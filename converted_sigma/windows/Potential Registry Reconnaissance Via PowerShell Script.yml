rule_id: 0f23f629-ed74-4a4b-9bfd-886a415c5a3d
name: "Potential Registry Reconnaissance Via PowerShell Script"
description: |
  Detects PowerShell Script Block Logging events that suggest registry reconnaissance. The pattern matches
  common registry-enumeration cmdlets/aliases (Get-Item, Get-ChildItem, gci) used with -Path to query
  sensitive registry locations often targeted for discovery of services, autoruns, and logon configuration:
  - CurrentControlSet\Services
  - CurrentVersion\Run / Run (autoruns)
  - CurrentVersion\Policies\Explorer\Run
  - CurrentVersion\ShellServiceObjectDelayLoad
  - CurrentVersion\Windows\Winlogon
  Requirements: PowerShell Script Block Logging must be enabled.
  False positives: Possible (admin scripts, inventory/compliance tools; string matching can over-hit).
  Triage: Review the full script block and parent process, confirm user context, and correlate with follow-on
  credential access, persistence changes (Set-ItemProperty/New-ItemProperty), or suspicious process/network activity.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // PowerShell Script Block Logging
  | WHERE winlog.channel == "Microsoft-Windows-PowerShell/Operational"
  | WHERE event.code == "4104"
  // Cmdlet aniqlash
  | WHERE winlog.event_data.ScriptBlockText RLIKE "(?i).*(Get-Item|Get-ChildItem|gci).*"
  // -Path parametri
  | WHERE winlog.event_data.ScriptBlockText RLIKE "(?i).*-Path.*"
  // Shubhali registry locationlarini alohida tekshirish
  | WHERE (
      winlog.event_data.ScriptBlockText RLIKE "(?i).*currentcontrolset\\\\services.*"
      OR winlog.event_data.ScriptBlockText RLIKE "(?i).*CurrentVersion\\\\Run.*"
      OR winlog.event_data.ScriptBlockText RLIKE "(?i).*Explorer\\\\Run.*"
      OR winlog.event_data.ScriptBlockText RLIKE "(?i).*ShellServiceObjectDelayLoad.*"
      OR winlog.event_data.ScriptBlockText RLIKE "(?i).*winlogon.*"
  )
  // Vaqt konteksti
  | EVAL hour_of_day    = DATE_EXTRACT("HOUR_OF_DAY", @timestamp)
  | EVAL is_after_hours = CASE(hour_of_day < 7 OR hour_of_day > 20, 1, 0)
  | STATS
      event_count      = COUNT(*),
      users            = VALUES(winlog.event_data.SubjectUserName),
      processes        = VALUES(winlog.event_data.ProcessName),
      script_blocks    = VALUES(winlog.event_data.ScriptBlockText),
      script_paths     = VALUES(winlog.event_data.ScriptPath),
      pipe_ids         = VALUES(winlog.event_data.PipelineId),
      after_hours_hits = SUM(is_after_hours)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | EVAL risk_score = event_count * 25 + after_hours_hits * 20
  | WHERE risk_score >= 25
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      script_blocks,
      script_paths,
      pipe_ids,
      after_hours_hits,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - attack.discovery
  - attack.t1012
  - attack.t1007
  - detection.threat-hunting
severity: medium
risk_score: 55
references:
  - "https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1012/T1012.md"
nist: ["AU-6", "SI-4"]
pci_dss: ["10.2"]
mitre_attack:
  TA0007:
    T1012: []
    T1007: []
