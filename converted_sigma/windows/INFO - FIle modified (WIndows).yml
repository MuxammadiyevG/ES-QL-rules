rule_id: a89f1b46-d782-468d-9f7f-64bf3849ab26

# 3) File Modified / Changed (generic)
name: "INFO - File Modified (Windows)"
description: |
  Informational baseline for file modification events. Use this to baseline normal write activity and
  later tune for sensitive paths (System32, startup folders, config dirs, etc.).
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // 4663 - fayl/obyektga kirish (write access mask)
  | WHERE event.code == "4663"
  // Write access mask: 0x2 (GENERIC_WRITE) yoki 0x40000000
  | WHERE winlog.event_data.AccessMask IN ("0x2", "0x40000000", "0x6")
  | WHERE winlog.event_data.ObjectName IS NOT NULL
  // Tizim shovqinlarini chiqarib tashlash
  | WHERE NOT (
      COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i)^C:\\\\Windows\\\\System32\\\\.*"
      OR COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i)^C:\\\\Windows\\\\SysWOW64\\\\.*"
  )
  | STATS
      event_count    = COUNT(*),
      users          = VALUES(winlog.event_data.SubjectUserName),
      processes      = VALUES(winlog.event_data.ProcessName),
      parents        = VALUES(winlog.event_data.CallerProcessName),
      modified_paths = VALUES(winlog.event_data.ObjectName),
      access_masks   = VALUES(winlog.event_data.AccessMask)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      parents,
      modified_paths,
      access_masks
  | SORT event_count DESC
enabled: true
tags:
  - informational
  - file-monitoring
severity: low
risk_score: 1
references:
  - "https://www.elastic.co/guide/en/ecs/current/ecs-event.html"
nist: ["AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.a"]
mitre_attack: []
