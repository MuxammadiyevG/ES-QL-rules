rule_id: 91ba9169-424a-4f08-a9dd-3b0c83112398

# 4) File Renamed (generic hunting / best-effort)
name: "INFO - File Renamed (Windows) - Hunting"
description: |
  Informational baseline for file rename activity. Many pipelines do not provide both old/new names in ECS.
  This rule hunts by agent_id, looking for file events that mention rename/move in event.action/type/dataset.
  If you have explicit old/new path fields, replace the logic to use them.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // Rename operatsiyalarini message orqali aniqlash
  | WHERE message RLIKE "(?i).*(SourceFilename|TargetFilename|Rename|renamed|moved).*"
  // FileNameBuffer mavjudligini tekshirish
  | WHERE winlog.event_data.FileNameBuffer IS NOT NULL
  // Tizim shovqinlarini chiqarib tashlash
  | WHERE NOT (
      COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i)^C:\\\\Windows\\\\System32\\\\.*"
      OR COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i)^C:\\\\Windows\\\\SysWOW64\\\\.*"
  )
  | STATS
      event_count = COUNT(*),
      users       = VALUES(winlog.event_data.SubjectUserName),
      processes   = VALUES(winlog.event_data.ProcessName),
      parents     = VALUES(winlog.event_data.CallerProcessName),
      paths       = VALUES(winlog.event_data.FileNameBuffer),
      messages    = VALUES(message)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      parents,
      paths,
      messages
  | SORT event_count DESC
enabled: true
tags:
  - informational
  - file-monitoring
severity: low
risk_score: 1
references:
  - "https://www.elastic.co/guide/en/ecs/current/ecs-event.html"
nist: ["AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.a"]
mitre_attack: {}
