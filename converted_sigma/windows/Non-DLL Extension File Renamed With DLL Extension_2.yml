rule_id: 9ec4cd12-d4c4-4393-a0a1-7ddbfe99ee4f
name: "Non-DLL Extension File Renamed With DLL Extension"
description: |
  Detects rename operations where the destination filename ends with ".dll" but the source filename
  was not already a ".dll". Malware sometimes renames payloads to .dll to blend in and evade simple
  extension-based detections.
  NOTE: Sigma expects SourceFilename/TargetFilename. In your field list those are not present, so this
  rule uses:
   - winlog.event_data.OriginalFileName as the target filename, and
   - event.original parsing as best-effort for source filename (if present in raw event).
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // .dll extension bilan tugagan fayllarni aniqlash
  | EVAL tgt = COALESCE(winlog.event_data.FileNameBuffer, "")
  | WHERE tgt RLIKE "(?i).*\\.dll$"
  // Manba .dll bo'lmagan holatlarni message orqali aniqlash
  | WHERE NOT message RLIKE "(?i).*SourceFilename[ \t]*[:=][ \t]*.*\\.dll.*"
  | WHERE NOT message RLIKE "(?i).*SourceFilename[ \t]*[:=][ \t]*.*\\.tmp.*"
  | WHERE NOT message RLIKE "(?i).*SourceFilename[ \t]*[:=][ \t]*(null|\"\").*"
  // TiWorker filtri
  | WHERE NOT (
      COALESCE(winlog.event_data.ProcessName, "") LIKE "*:\\\\Windows\\\\WinSxS\\\\*"
      AND winlog.event_data.ProcessName RLIKE "(?i).*\\\\TiWorker\\.exe$"
  )
  | WHERE NOT message RLIKE "(?i).*Image[ \t]*[:=].*\\\\TiWorker\\.exe.*"
  // wuauclt filtri
  | WHERE NOT (
      winlog.event_data.ProcessName RLIKE "(?i).*:\\\\Windows\\\\System32\\\\wuauclt\\.exe$"
      AND tgt LIKE "*:\\\\$WINDOWS.~BT\\\\Sources\\\\*"
  )
  // Program Files filtri
  | WHERE NOT (
      COALESCE(winlog.event_data.ProcessName, "") LIKE "*:\\\\Program Files (x86)\\\\*"
      OR COALESCE(winlog.event_data.ProcessName, "") LIKE "*:\\\\Program Files\\\\*"
  )
  // SquirrelTemp filtri
  | WHERE NOT message RLIKE "(?i).*SourceFilename[ \t]*[:=].*\\\\SquirrelTemp\\\\temp.*"
  | STATS
      event_count   = COUNT(*),
      users         = VALUES(winlog.event_data.TargetUserName),
      processes     = VALUES(winlog.event_data.ProcessName),
      parents       = VALUES(winlog.event_data.CallerProcessName),
      target_paths  = VALUES(winlog.event_data.FileNameBuffer),
      messages      = VALUES(message)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      parents,
      target_paths,
      messages
  | SORT event_count DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1036.008
  - detection.threat-hunting
severity: medium
risk_score: 50
references:
  - "https://twitter.com/ffforward/status/1481672378639912960"
  - "https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1036/T1036.md#atomic-test-1---system-file-copied-to-unusual-location"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1036: ["T1036.008"]
