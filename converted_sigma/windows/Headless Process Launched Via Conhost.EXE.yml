rule_id: 75d3c688-2d2c-4dee-9069-c75df5efe923
name: "Headless Process Launched Via Conhost.EXE"
description: |
  Detects child process execution where the parent process is conhost.exe and the parent
  command line includes the "--headless" flag. The --headless flag suppresses visible windows,
  allowing processes to run without user awareness. This behavior has been observed in
  fake browser update chains and unauthorized software execution.
  False positives: Unknown. Use as a hunting baseline and tune with allowlists if needed.
  Triage: Review the spawned child process, validate its binary path and signer, inspect
  the parent command line for installer/update lures, and correlate with persistence,
  network connections, or sustained CPU usage.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // Process creation events
  | WHERE event.code IN ("1", "4688")
  // Parent: conhost.exe --headless mode
  | WHERE (
      winlog.event_data.CallerProcessName == "conhost.exe"
      OR winlog.event_data.CallerProcessName RLIKE "(?i).*\\\\conhost\\.exe$"
  )
  | WHERE message LIKE "*--headless*"
  // Vaqt konteksti
  | EVAL hour_of_day    = DATE_EXTRACT("HOUR_OF_DAY", @timestamp)
  | EVAL is_after_hours = CASE(hour_of_day < 7 OR hour_of_day > 20, 1, 0)
  // Shubhali child process aniqlash
  | EVAL suspicious_child = CASE(
      winlog.event_data.ProcessName RLIKE "(?i).*(powershell|pwsh|cmd|mshta|wscript|cscript|rundll32|regsvr32|certutil|curl|wget)\\.exe$", 1,
      0
  )
  // Shubhali path aniqlash
  | EVAL suspicious_path = CASE(
      COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i).*(AppData\\\\Local\\\\Temp|AppData\\\\Roaming|Downloads|Windows\\\\Temp|ProgramData|Users\\\\Public).*", 1,
      0
  )
  | STATS
      event_count           = COUNT(*),
      users                 = VALUES(winlog.event_data.TargetUserName),
      parents               = VALUES(winlog.event_data.CallerProcessName),
      children              = VALUES(winlog.event_data.ProcessName),
      messages              = VALUES(message),
      after_hours_hits      = SUM(is_after_hours),
      suspicious_child_hits = SUM(suspicious_child),
      suspicious_path_hits  = SUM(suspicious_path)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  // Risk hisoblash
  | EVAL risk_score = event_count * 20
      + after_hours_hits * 15
      + suspicious_child_hits * 20
      + suspicious_path_hits * 15
  | WHERE risk_score >= 25
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      parents,
      children,
      messages,
      after_hours_hits,
      suspicious_child_hits,
      suspicious_path_hits,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.execution
  - attack.t1059.001
  - attack.t1059.003
  - detection.threat-hunting
severity: medium
risk_score: 55
references:
  - "https://www.huntress.com/blog/fake-browser-updates-lead-to-boinc-volunteer-computing-software"

nist: ["SI-4", "CM-7", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]

mitre_attack:
  TA0002:
    T1059: ["T1059.001", "T1059.003"]
