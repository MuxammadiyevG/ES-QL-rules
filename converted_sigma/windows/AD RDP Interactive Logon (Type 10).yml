rule_id: acc80539-79a3-412d-a037-d63b4118c865
name: AD RDP Interactive Logon (Type 10)
description: |
  Ushbu qoida Active Directory muhitida foydalanuvchining RDP (Remote Desktop Protocol) orqali masofadan tizimga kirishini aniqlaydi (Event ID 4624, Logon Type 10).
  Masofaviy kirishlar lateral movement (tarmoq bo'ylab harakatlanish) yoki ruxsatsiz kirish urinishlarini aniqlashda muhim indikator hisoblanadi.
  Qonuniy holatlar sifatida IT administratorlarining masofaviy xizmat ko'rsatishi yoki foydalanuvchilarning masofaviy ishi uchrashi mumkin.
  SOC triage bosqichlari:
  - `user` va `src_ip` (manba IP) manzillarining legitimligini tekshiring.
  - Kirish vaqti foydalanuvchining odatdagi ish soatlariga mos kelishini aniqlang.
  - Maqsadli host (`hostn`) kritik server (masalan, Domain Controller) ekanligini tekshiring.
  - Agar ushbu foydalanuvchi odatda ushbu hostga kirmasa, hodisani "Suspect" deb belgilang va VPN loglari bilan solishtiring.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE event.code == "4624"
  | WHERE winlog.event_data.LogonType == "10"
  | EVAL user         = COALESCE(winlog.event_data.TargetUserName, "")
  | EVAL user_domain  = COALESCE(winlog.event_data.TargetDomainName, "")
  | EVAL src_ip       = COALESCE(winlog.event_data.IpAddress, "")
  // Tizim akkauntlarini chiqarib tashlash
  | WHERE NOT (
      user LIKE "*$"
      OR user == "-"
      OR user == ""
  )
  | STATS
      event_count    = COUNT(*),
      users          = VALUES(winlog.event_data.TargetUserName),
      user_domains   = VALUES(winlog.event_data.TargetDomainName),
      src_ips        = VALUES(winlog.event_data.IpAddress),
      logon_ids      = VALUES(winlog.event_data.TargetLogonId),
      logon_guids    = VALUES(winlog.event_data.TargetLogonGuid)
  BY
      agent_id,
      winlog.computer_name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      winlog.computer_name,
      event_count,
      users,
      user_domains,
      src_ips,
      logon_ids,
      logon_guids
  | SORT event_count DESC
enabled: true
tags:
  - detection.lateral_movement
  - monitoring.logon
  - detection.compliance
severity: medium
risk_score: 50
nist: []
pci_dss: []
gdpr: []
mitre_attack: []
