rule_id: 1e32e1c8-705b-42bd-8bef-e37c5c988d91
name: Account Password Reset - Suspicious Activity
description: |
  Parolning boshqa foydalanuvchi (admin) tomonidan o'zgartirilishi (Event ID 4724).
  Hujumchilar akkauntni egallab olish uchun parolni reset qilishi mumkin.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE event.code == "4724"
  | EVAL actor         = COALESCE(winlog.event_data.SubjectUserName, "")
  | EVAL actor_domain  = COALESCE(winlog.event_data.SubjectDomainName, "")
  | EVAL target_user   = COALESCE(winlog.event_data.TargetUserName, "")
  | EVAL target_domain = COALESCE(winlog.event_data.TargetDomainName, "")
  // Tizim akkauntlarini filtr qilish
  | WHERE NOT (
      actor LIKE "*$"
      OR actor == "-"
      OR actor == ""
  )
  | STATS
      event_count      = COUNT(*),
      actors           = VALUES(winlog.event_data.SubjectUserName),
      actor_domains    = VALUES(winlog.event_data.SubjectDomainName),
      target_users     = VALUES(winlog.event_data.TargetUserName),
      target_domains   = VALUES(winlog.event_data.TargetDomainName),
      logon_ids        = VALUES(winlog.event_data.SubjectLogonId)
  BY
      agent_id,
      winlog.computer_name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      winlog.computer_name,
      event_count,
      actors,
      actor_domains,
      target_users,
      target_domains,
      logon_ids
  | SORT event_count DESC
enabled: true
tags:
  - detection.credential_access
  - monitoring.passwords
severity: low
risk_score: 45
nist: []
pci_dss: []
gdpr: []
mitre_attack: []
