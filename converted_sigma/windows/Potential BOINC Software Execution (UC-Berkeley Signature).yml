rule_id: afb34e6a-6474-4d3f-b73b-2fdcc471ef04
name: "Potential BOINC Software Execution (UC-Berkeley Signature)"
description: |
  Detects process execution where the file metadata description indicates "University of California, Berkeley",
  which is commonly associated with BOINC volunteer computing software. BOINC can be legitimately installed,
  but in some intrusions it has been abused for unauthorized compute (crypto/mining-like behavior) or persistence.
  False positives: Expected if BOINC is intentionally installed/used.
  Triage: Validate the binary path and signer/publisher, confirm installation approval, check CPU usage spikes
  (metricbeat), persistence mechanisms (services/scheduled tasks), outbound connections, and whether the parent
  process indicates fake update chains (browser/installer from Downloads/AppData).
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
  - logs-metric*
query_language: esql
query: |

  FROM logs-winlog*
  // UC Berkeley metadatasini message orqali aniqlash
  | WHERE message LIKE "*University of California, Berkeley*"
  // Vaqt konteksti
  | EVAL hour_of_day    = DATE_EXTRACT("HOUR_OF_DAY", @timestamp)
  | EVAL is_after_hours = CASE(hour_of_day < 7 OR hour_of_day > 20, 1, 0)
  // Shubhali path aniqlash
  | EVAL suspicious_path = CASE(
      COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i).*(AppData\\\\Local\\\\Temp|AppData\\\\Roaming|Downloads|Windows\\\\Temp|ProgramData|Users\\\\Public).*", 1,
      0
  )
  | STATS
      event_count          = COUNT(*),
      users                = VALUES(winlog.event_data.TargetUserName),
      processes            = VALUES(winlog.event_data.ProcessName),
      parents              = VALUES(winlog.event_data.CallerProcessName),
      messages             = VALUES(message),
      after_hours_hits     = SUM(is_after_hours),
      suspicious_path_hits = SUM(suspicious_path)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | EVAL risk_score = event_count * 1 + after_hours_hits * 5 + suspicious_path_hits * 5
  | WHERE risk_score >= 1
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      parents,
      messages,
      after_hours_hits,
      suspicious_path_hits,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - attack.execution
  - attack.defense-evasion
  - detection.threat-hunting
severity: low
risk_score: 5
references:
  - "https://boinc.berkeley.edu/"
  - "https://www.huntress.com/blog/fake-browser-updates-lead-to-boinc-volunteer-computing-software"
nist: ["AU-6", "SI-4"]
pci_dss: ["10.2"]
gdpr: ["32.1.a"]
mitre_attack:
  TA0005:
    T1553: []
