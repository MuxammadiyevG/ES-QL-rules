rule_id: 33615297-5ce6-4bae-ba62-605585886d8e
name: "Dynamic .NET Compilation Via Csc.EXE - Hunting"
description: |
  Detects execution of csc.exe (C# compiler) with command line pattern "/noconfig /fullpaths @" which is
  commonly seen during dynamic/on-the-fly .NET compilation. Adversaries may compile payloads locally to
  evade detections and remove the need to drop precompiled binaries.
  False positives: Many legitimate applications use dynamic compilation. Use this rule to hunt for anomalies.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // Process creation events
  | WHERE event.code IN ("1", "4688")
  // csc.exe aniqlash
  | WHERE winlog.event_data.ProcessName == "csc.exe"
      OR winlog.event_data.ProcessName RLIKE "(?i).*\\\\csc\\.exe$"
  // /noconfig /fullpaths @ argumentlarini message orqali aniqlash
  | WHERE message RLIKE "(?i).*/[nN]o[cC]onfig.*/[fF]ullpaths.*@.*"
  | STATS
      event_count  = COUNT(*),
      users        = VALUES(winlog.event_data.TargetUserName),
      parents      = VALUES(winlog.event_data.CallerProcessName),
      executables  = VALUES(winlog.event_data.ProcessName),
      messages     = VALUES(message),
      pids         = VALUES(winlog.event_data.ProcessPid)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      parents,
      executables,
      messages,
      pids
  | SORT event_count DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1027.004
  - detection.threat-hunting
severity: medium
risk_score: 50
references:
  - "https://securityboulevard.com/2019/08/agent-tesla-evading-edr-by-removing-api-hooks/"
  - "https://www.clearskysec.com/wp-content/uploads/2018/11/MuddyWater-Operations-in-Lebanon-and-Oman.pdf"
  - "https://app.any.run/tasks/c6993447-d1d8-414e-b856-675325e5aa09/"
  - "https://twitter.com/gN3mes1s/status/1206874118282448897"
nist: ["SI-4"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1027: ["T1027.004"]
