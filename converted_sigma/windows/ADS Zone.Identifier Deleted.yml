rule_id: 509187bf-874c-458c-82a8-adc025dd5cc0
name: "ADS Zone.Identifier Deleted"
description: |
  Detects deletion of the Zone.Identifier alternate data stream (ADS) by agent_id, matching file delete events
  where the target filename ends with ":Zone.Identifier". Removing this ADS can bypass Mark-of-the-Web
  (MOTW) based security restrictions used by Windows and Microsoft Office.
  False positives: Likely (some tools/cleanup actions remove ADS). Use as hunting baseline and tune.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // Selection: FileNameBuffer ends with :Zone.Identifier
  | WHERE winlog.event_data.FileNameBuffer RLIKE "(?i).*:Zone\\.Identifier$"
  // Filter out common benign install paths
  | WHERE NOT (
      COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i)^C:\\\\Program Files \\(x86\\)\\\\.*"
      OR COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i)^C:\\\\Program Files\\\\.*"
      OR COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i)^C:\\\\Windows\\\\System32\\\\.*"
      OR COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i)^C:\\\\Windows\\\\SysWOW64\\\\.*"
  )
  | STATS
      event_count  = COUNT(*),
      users        = VALUES(winlog.event_data.TargetUserName),
      processes    = VALUES(winlog.event_data.ProcessName),
      parents      = VALUES(winlog.event_data.CallerProcessName),
      file_paths   = VALUES(winlog.event_data.FileNameBuffer)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      parents,
      file_paths
  | SORT event_count DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1070.004
  - detection.threat-hunting
severity: low
risk_score: 20
references:
  - "https://securityliterate.com/how-malware-abuses-the-zone-identifier-to-circumvent-detection-and-analysis/"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1070: ["T1070.004"]
