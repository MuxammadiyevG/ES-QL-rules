rule_id: 40e3df80-9fc8-49cb-ad4f-d557ba5d0214
name: "Potential Password Reconnaissance Via Findstr.EXE"
description: |
  Detects execution of findstr.exe with command-line patterns searching for password-related
  keywords across multiple languages. Adversaries may use findstr to harvest credentials
  from configuration files, scripts, or logs.
  False positives: Unknown. Use as a hunting rule and validate context and file targets.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // Process creation events
  | WHERE event.code IN ("1", "4688")
  // findstr.exe aniqlash
  | WHERE winlog.event_data.ProcessName == "findstr.exe"
      OR winlog.event_data.ProcessName RLIKE "(?i).*\\\\findstr\\.exe$"
  // Ko'p tilli parol kalit so'zlarini message orqali aniqlash
  | WHERE message LIKE "*contraseña*"
      OR message LIKE "*hasło*"
      OR message LIKE "*heslo*"
      OR message LIKE "*parola*"
      OR message LIKE "*passe*"
      OR message LIKE "*passw*"
      OR message LIKE "*senha*"
      OR message LIKE "*senord*"
      OR message LIKE "*密碼*"
  | STATS
      event_count  = COUNT(*),
      users        = VALUES(winlog.event_data.TargetUserName),
      parents      = VALUES(winlog.event_data.CallerProcessName),
      executables  = VALUES(winlog.event_data.ProcessName),
      messages     = VALUES(message),
      pids         = VALUES(winlog.event_data.ProcessPid)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      parents,
      executables,
      messages,
      pids
  | SORT event_count DESC
enabled: true
tags:
  - attack.credential-access
  - attack.t1552.001
  - detection.threat-hunting
severity: medium
risk_score: 50
references:
  - "https://steflan-security.com/windows-privilege-escalation-credential-harvesting/"
  - "https://adsecurity.org/?p=2288"
nist: ["IA-5", "SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0006:
    T1552: ["T1552.001"]
