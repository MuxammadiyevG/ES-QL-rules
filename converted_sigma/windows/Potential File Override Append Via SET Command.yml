rule_id: a84d410e-1c86-4f3c-b185-46f4d83f4b8d
name: "Potential File Override/Append Via SET Command"
description: |
  Detects cmd.exe usage of the internal SET command with the /p flag followed directly by agent_id, "=" (set /p=),
  which can be abused to indirectly write/append content to files when combined with redirection (>>, >).
  Example: cmd /c >> example.txt set /p="test data" (appends "test data" to example.txt).
  While set /p= is normally used to prompt for user input, threat actors have used this pattern in ransomware
  campaigns to modify files stealthily.
  False positives: Legitimate scripts that use set /p for prompting or simple file writing. Treat as hunting
  baseline and tune by excluding known script paths and benign parent processes.
  Triage: Review the full command line to identify target file(s), look for >> or > operators, assess the
  parent process chain, and correlate with file modifications, persistence, or ransomware-like activity.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // Process creation events
  | WHERE event.code IN ("1", "4688")
  // cmd.exe aniqlash
  | WHERE winlog.event_data.ProcessName == "cmd.exe"
      OR winlog.event_data.ProcessName RLIKE "(?i).*\\\\cmd\\.exe$"
  // set /p= patternini message orqali aniqlash
  | WHERE message RLIKE "(?i).*([/\\\\]c[ \t]+set[ \t]+[/\\\\]p=|>>[ \t]*.*[ \t]*set[ \t]+[/\\\\]p=).*"
  // Redirection belgisini aniqlash
  | EVAL has_redirect = CASE(
      message LIKE "*>>*", 1,
      message LIKE "* > *", 1,
      0
  )
  // Vaqt konteksti
  | EVAL hour_of_day    = DATE_EXTRACT("HOUR_OF_DAY", @timestamp)
  | EVAL is_after_hours = CASE(hour_of_day < 7 OR hour_of_day > 20, 1, 0)
  // Shubhali parent aniqlash
  | EVAL suspicious_parent = CASE(
      winlog.event_data.CallerProcessName RLIKE "(?i).*(winword|excel|powerpnt|outlook|mshta|wscript|cscript|rundll32|powershell)\\.exe$", 1,
      0
  )
  | STATS
      event_count            = COUNT(*),
      users                  = VALUES(winlog.event_data.TargetUserName),
      parents                = VALUES(winlog.event_data.CallerProcessName),
      messages               = VALUES(message),
      redirect_hits          = SUM(has_redirect),
      after_hours_hits       = SUM(is_after_hours),
      suspicious_parent_hits = SUM(suspicious_parent)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | EVAL risk_score = event_count * 5 + redirect_hits * 10 + after_hours_hits * 10 + suspicious_parent_hits * 15
  | WHERE risk_score >= 5
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      parents,
      messages,
      redirect_hits,
      after_hours_hits,
      suspicious_parent_hits,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - attack.execution
  - attack.defense-evasion
  - detection.threat-hunting
severity: low
risk_score: 20
references:
  - "https://news.sophos.com/en-us/2024/08/07/sophos-mdr-hunt-tracks-mimic-ransomware-campaign-against-organizations-in-india/"
  - "https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/set_1"
  - "https://ss64.com/nt/set.html"
nist: ["AU-12", "SI-4", "CM-6"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0002:
    T1059: []
  TA0005:
    T1027: []
