rule_id: 316219e4-07c2-4fa8-8fa4-5e7eaaf36c9c
# 2) File Deleted (generic)
name: "INFO - File Deleted (Windows)"
description: |
  Informational baseline for file deletions. Useful for identifying normal cleanup behavior vs. unusual
  mass deletes or sensitive-path deletions in later detection rules.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // 4660 - obyekt o'chirildi, 4663 - kirish (delete mask)
  | WHERE event.code IN ("4660", "4663")
  // Delete access mask: 0x10000 (DELETE)
  | WHERE event.code == "4660"
      OR (
          event.code == "4663"
          AND winlog.event_data.AccessMask == "0x10000"
      )
  | WHERE winlog.event_data.ObjectName IS NOT NULL
  | STATS
      event_count   = COUNT(*),
      users         = VALUES(winlog.event_data.SubjectUserName),
      processes     = VALUES(winlog.event_data.ProcessName),
      deleted_paths = VALUES(winlog.event_data.ObjectName)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id, bucket, host.name,
      event_count, users, processes, deleted_paths
  | SORT event_count DESC
enabled: true
tags:
  - informational
  - file-monitoring
severity: low
risk_score: 1
references:
  - "https://www.elastic.co/guide/en/ecs/current/ecs-event.html"
nist: ["AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.a"]
mitre_attack: {}
