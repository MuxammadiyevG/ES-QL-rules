rule_id: 8f9352bc-aef0-4d6d-bbe1-0486972403a3
name: "Registry Set With Crypto-Classes From The 'Cryptography' PowerShell Namespace"
description: |
  Detects registry modifications to "\Shell\Open\Command" where the value data includes PowerShell (powershell/pwsh)
  and references to the .NET "System.Security.Cryptography" namespace, including common CryptoServiceProvider classes.
  This can indicate a persistence / hijack technique (Shell\Open\Command) that decrypts payloads on-the-fly for defense
  evasion (e.g., decrypting a malicious payload before execution).
  False positives: Rare but possible (legitimate scripts using crypto classes), though it is less common in Shell\Open\Command
  handlers. Tune by agent_id, allowlisting known-good software and correlating with suspicious parent process / low-prevalence users.
  Triage: Identify which key is modified (file association/protocol), extract the full command data, verify parent process/user,
  and correlate with subsequent PowerShell execution, file writes in Temp/Downloads, and any newly spawned processes.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // Shell\Open\Command registry key aniqlash
  | WHERE message RLIKE "(?i).*\\\\Shell\\\\Open\\\\Command.*"
  // PowerShell aniqlash
  | WHERE message RLIKE "(?i).*(powershell|pwsh).*"
  // System.Security.Cryptography namespace
  | WHERE message LIKE "*System.Security.Cryptography.*"
  // Crypto class aniqlash
  | WHERE message RLIKE "(?i).*(AesCryptoServiceProvider|DESCryptoServiceProvider|DSACryptoServiceProvider|RC2CryptoServiceProvider|Rijndael|RSACryptoServiceProvider|TripleDESCryptoServiceProvider).*"
  // Vaqt konteksti
  | EVAL hour_of_day    = DATE_EXTRACT("HOUR_OF_DAY", @timestamp)
  | EVAL is_after_hours = CASE(hour_of_day < 7 OR hour_of_day > 20, 1, 0)
  | STATS
      event_count      = COUNT(*),
      users            = VALUES(winlog.event_data.SubjectUserName),
      processes        = VALUES(winlog.event_data.ProcessName),
      parent_processes = VALUES(winlog.event_data.CallerProcessName),
      messages         = VALUES(message),
      after_hours_hits = SUM(is_after_hours)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | EVAL risk_score = event_count * 25 + after_hours_hits * 20
  | WHERE risk_score >= 25
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      parent_processes,
      messages,
      after_hours_hits,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.execution
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1059.001
  - attack.t1027.010
  - attack.t1547.001
  - detection.threat-hunting
severity: medium
risk_score: 55
references:
  - "https://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography?view=net-8.0"
  - "https://squiblydoo.blog/2023/11/07/october-2023-solarmarker/"
nist: ["AU-6", "SI-4", "CM-6"]
pci_dss: ["10.2"]
mitre_attack:
  TA0002:
    T1059: ["T1059.001"]
  TA0005:
    T1027: ["T1027.010"]
