rule_id: 7b50328c-e928-4090-b752-09cbf798bbe9
name: Potential Kerberoasting - Unusual TGS Request
description: |
  RC4 shifrlash algoritmi (0x17) yordamida ko'p miqdorda TGS (Service Ticket) so'rovlarini aniqlaydi (Event ID 4769).
  Bu parollarni buzib kirishga urinish belgisidir.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE event.code == "4769"
  // RC4 shifrlash (0x17) — Kerberoasting belgisi
  | WHERE winlog.event_data.TicketEncryptionType == "0x17"
  // Kompyuter akkauntlarini chiqarib tashlash
  | WHERE NOT winlog.event_data.TargetUserName RLIKE ".*\\$@.*"
  | WHERE NOT (
      COALESCE(winlog.event_data.TargetUserName, "") LIKE "*$"
      OR COALESCE(winlog.event_data.TargetUserName, "") == "-"
      OR COALESCE(winlog.event_data.TargetUserName, "") == ""
  )
  // Failure code filtri — faqat muvaffaqiyatli so'rovlar (0x0)
  | WHERE winlog.event_data.Status == "0x0"
      OR winlog.event_data.Status IS NULL
  | STATS
      ticket_count    = COUNT(*),
      target_users    = VALUES(winlog.event_data.TargetUserName),
      target_domains  = VALUES(winlog.event_data.TargetDomainName),
      service_names   = VALUES(winlog.event_data.ServiceName),
      enc_types       = VALUES(winlog.event_data.TicketEncryptionType)
  BY
      agent_id,
      winlog.computer_name,
      winlog.event_data.IpAddress,
      bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE ticket_count > 5
  | EVAL risk_score = CASE(
      ticket_count > 100, 90,
      ticket_count > 50,  70,
      ticket_count > 20,  50,
      30
  )
  | KEEP
      agent_id,
      bucket,
      winlog.computer_name,
      winlog.event_data.IpAddress,
      ticket_count,
      target_users,
      target_domains,
      service_names,
      enc_types,
      risk_score
  | SORT ticket_count DESC
enabled: true
tags:
  - detection.credential_access
  - attack.t1558.003
severity: low
risk_score: 50
nist: []
pci_dss: []
gdpr: []
mitre_attack: []
