rule_id: 7e790c29-f89d-4bed-a077-c113bec0b34d
#//RULE-NIST-10 — Multi-Factor Authentication Bypass (NIST IA-2)
#//Control Family: IA (Identification and Authentication)
#//Objective: Detect successful logins without MFA when policy requires it
#//Threat scenario: Attacker bypasses MFA via legacy protocol or stolen session token
#//Data sources: Windows Security 4624 (LogonType 3/10 without MFA claim), Azure AD logs
#//ECS fields used: event.code, winlog.event_data.LogonType, winlog.event_data.TargetUserName, event.action
#//Field validation: Verify all ECS fields exist in your indices before enabling
#//Tuning notes: Requires MFA enforcement baseline, allowlist service accounts, legacy apps

name: "MFA Bypass Detection"
description: |
  Detects successful interactive logins via RDP or network logon without multi-factor authentication.
  LogonType 10 (RemoteInteractive) and Type 3 (Network) should require MFA per policy.
  MFA bypass often achieved via legacy protocols (NTLM, basic auth) or token theft.
  False positives: Service accounts, legacy applications unable to support MFA, emergency access accounts.
  Triage: Verify if account is on MFA exclusion list, check authentication protocol used,
  review for concurrent credential theft indicators.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - winlogbeat-*
query_language: esql
query: |

  FROM logs-winlog*
  | WHERE event.code == "4624"
  | WHERE winlog.event_data.LogonType IN ("3", "10")
  // NTLM autentifikatsiyasini aniqlash (MFA qo'llab-quvvatlamaydi)
  | WHERE winlog.event_data.AuthenticationPackageName == "NTLM"
      OR winlog.event_data.LmPackageName RLIKE "(?i).*(NTLM|LM).*"
  // Tizim akkauntlarini chiqarib tashlash
  | EVAL user        = COALESCE(winlog.event_data.TargetUserName, "")
  | EVAL user_domain = COALESCE(winlog.event_data.TargetDomainName, "")
  | WHERE NOT (
      user LIKE "*$"
      OR user == "-"
      OR user == ""
      OR user RLIKE "(?i)(system|network service|local service|anonymous logon)"
  )
  | STATS
      non_mfa_logins  = COUNT(*),
      unique_sources  = COUNT_DISTINCT(winlog.event_data.IpAddress),
      users           = VALUES(winlog.event_data.TargetUserName),
      user_domains    = VALUES(winlog.event_data.TargetDomainName),
      source_ips      = VALUES(winlog.event_data.IpAddress),
      logon_types     = VALUES(winlog.event_data.LogonType),
      auth_packages   = VALUES(winlog.event_data.AuthenticationPackageName),
      lm_packages     = VALUES(winlog.event_data.LmPackageName),
      logon_ids       = VALUES(winlog.event_data.TargetLogonId)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(15 minutes, @timestamp)
  | WHERE non_mfa_logins >= 1
  | EVAL risk_score = non_mfa_logins * 20 + unique_sources * 10
  | WHERE risk_score >= 20
  | KEEP
      agent_id,
      bucket,
      host.name,
      non_mfa_logins,
      unique_sources,
      users,
      user_domains,
      source_ips,
      logon_types,
      auth_packages,
      lm_packages,
      logon_ids,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - nist_800_53
  - control_IA-2
  - family_IA
  - credential_access
  - defense_evasion
  - mfa_bypass
severity: high
risk_score: 70
references:
  - "NIST SP 800-53 Rev.5 IA-2: Identification and Authentication"
  - "MITRE ATT&CK T1078: Valid Accounts"
nist: ["IA-2"]
gdpr: ["32"]
pci_dss: ["8.3"]
mitre_attack:
  TA0005:
    T1078: []
