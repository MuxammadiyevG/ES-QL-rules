rule_id: 090ec8aa-07b8-473a-9a89-e608e9f1e6ff
name: AD User Password Never Expires Flag Set
description: |
  Foydalanuvchi akkauntining "Password Never Expires" opsiyasi yoqilganini aniqlaydi (Event ID 4738).
  Bu xavfsizlik siyosatiga zid bo'lishi va hujumchi tomonidan ishlatilishi mumkin.
type: esql
params: "{}"
schedule_interval: 15m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE event.code == "4738"
  | EVAL actor         = COALESCE(winlog.event_data.SubjectUserName, "")
  | EVAL actor_domain  = COALESCE(winlog.event_data.SubjectDomainName, "")
  | EVAL target_user   = COALESCE(winlog.event_data.TargetUserName, "")
  | EVAL target_domain = COALESCE(winlog.event_data.TargetDomainName, "")
  | EVAL uac_new       = COALESCE(winlog.event_data.NewUacValue, "")
  | EVAL uac_old       = COALESCE(winlog.event_data.OldUacValue, "")
  // Faqat "Password Never Expires" flag o'zgarganda (UAC bit 0x10000 = 65536)
  | WHERE winlog.event_data.NewUacValue == "0x10040"
      OR winlog.event_data.NewUacValue == "0x10000"
  // Tizim akkauntlarini chiqarib tashlash
  | WHERE NOT (
      actor LIKE "*$"
      OR actor == "-"
      OR actor == ""
      OR actor RLIKE "(?i)(system|network service|local service)"
  )
  | STATS
      event_count     = COUNT(*),
      actors          = VALUES(winlog.event_data.SubjectUserName),
      actor_domains   = VALUES(winlog.event_data.SubjectDomainName),
      target_users    = VALUES(winlog.event_data.TargetUserName),
      target_domains  = VALUES(winlog.event_data.TargetDomainName),
      uac_new_values  = VALUES(winlog.event_data.NewUacValue),
      uac_old_values  = VALUES(winlog.event_data.OldUacValue),
      logon_ids       = VALUES(winlog.event_data.SubjectLogonId)
  BY
      agent_id,
      winlog.computer_name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      winlog.computer_name,
      event_count,
      actors,
      actor_domains,
      target_users,
      target_domains,
      uac_new_values,
      uac_old_values,
      logon_ids
  | SORT event_count DESC
enabled: true
tags:
  - detection.persistence
  - monitoring.account_properties
severity: medium
risk_score: 55
nist: []
pci_dss: []
gdpr: []
mitre_attack: []
