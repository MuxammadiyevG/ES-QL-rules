rule_id: 3001a682-fe74-433a-a104-320e279d4eb3
name: AD User Account Deleted - Impact Monitoring
description: |
  Foydalanuvchi o'chirilishi (Event ID 4726) izlarni yashirish yoki servislar ishini to'xtatish uchun ishlatilishi mumkin.
  SOC triage bosqichlari:
  - O'chirilgan akkaunt muhim (imtiyozli) yoki yo'qligini tekshiring.
  - `actor` kimligini va bu uning vakolatiga kirishini tasdiqlang.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE event.code == "4726"
  | EVAL actor        = COALESCE(winlog.event_data.SubjectUserName, "")
  | EVAL actor_domain = COALESCE(winlog.event_data.SubjectDomainName, "")
  | EVAL target_user  = COALESCE(winlog.event_data.TargetUserName, "")
  | EVAL target_domain = COALESCE(winlog.event_data.TargetDomainName, "")
  // Tizim akkauntlarini chiqarib tashlash
  | WHERE NOT (
      actor LIKE "*$"
      OR actor == "-"
      OR actor == ""
      OR actor RLIKE "(?i)(system|network service|local service)"
  )
  | STATS
      event_count     = COUNT(*),
      actors          = VALUES(winlog.event_data.SubjectUserName),
      actor_domains   = VALUES(winlog.event_data.SubjectDomainName),
      target_users    = VALUES(winlog.event_data.TargetUserName),
      target_domains  = VALUES(winlog.event_data.TargetDomainName),
      sam_names       = VALUES(winlog.event_data.SamAccountName),
      logon_ids       = VALUES(winlog.event_data.SubjectLogonId)
  BY
      agent_id,
      winlog.computer_name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      winlog.computer_name,
      event_count,
      actors,
      actor_domains,
      target_users,
      target_domains,
      sam_names,
      logon_ids
  | SORT event_count DESC
enabled: true
tags:
  - detection.impact
  - monitoring.account_lifecycle
severity: low
risk_score: 25
nist: []
pci_dss: []
gdpr: []
mitre_attack: []
