rule_id: 76113631-738c-47ed-b0b9-52244e627a1f
name: "File Creation Date Changed to Another Year"
description: |
  Detects potential timestomping where a file’s creation time is modified from a recent year (202x)
  to an older year (pre-2020). This can be used to make a backdoor look “old” and blend with OS files.
  Note: Many legitimate installers/updaters can also touch timestamps. Baseline first, then tune.
  This implementation relies on event.original containing the timestamp fields (e.g. CreationUtcTime / PreviousCreationUtcTime),
  which is common with ETW/Sysmon-style file-change telemetry pipelines.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // Timestomping: PreviousCreationUtcTime 202x dan eskiga o'zgargan
  | WHERE message RLIKE "(?i).*PreviousCreationUtcTime\\s*[:=]\\s*202.*"
  | WHERE NOT message RLIKE "(?i).*CreationUtcTime\\s*[:=]\\s*202.*"
  // Program Files filtri
  | WHERE NOT (
      COALESCE(winlog.event_data.FileNameBuffer, "") RLIKE "(?i)^C:\\\\Program Files( \\(x86\\))?\\\\.*"
      AND COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i)^C:\\\\Program Files( \\(x86\\))?\\\\.*"
  )
  // Windows update processlarini chiqarib tashlash
  | WHERE NOT (
      winlog.event_data.ProcessName IN (
          "C:\\Windows\\system32\\ProvTool.exe",
          "C:\\Windows\\System32\\usocoreworker.exe",
          "C:\\Windows\\ImmersiveControlPanel\\SystemSettings.exe",
          "C:\\Windows\\system32\\msiexec.exe"
      )
  )
  // USOPrivate temp fayllarini chiqarib tashlash
  | WHERE NOT (
      COALESCE(winlog.event_data.FileNameBuffer, "") RLIKE "(?i)^C:\\\\ProgramData\\\\USOPrivate\\\\UpdateStore\\\\.*"
      AND COALESCE(winlog.event_data.FileNameBuffer, "") RLIKE "(?i).*\\.(tmp|temp)$"
  )
  // TiWorker/svchost/sihclient .cab fayllarini chiqarib tashlash
  | WHERE NOT (
      COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i)^C:\\\\WINDOWS\\\\System32\\\\.*"
      AND winlog.event_data.ProcessName RLIKE "(?i).*(TiWorker|svchost|sihclient)\\.exe$"
      AND COALESCE(winlog.event_data.FileNameBuffer, "") RLIKE "(?i).*\\.cab$"
  )
  // VCRedist filtri
  | WHERE NOT (
      COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i)^C:\\\\Windows\\\\Temp\\\\.*"
      AND winlog.event_data.ProcessName RLIKE "(?i).*\\\\VCREDI~1\\.EXE$"
  )
  | STATS
      event_count      = COUNT(*),
      users            = VALUES(winlog.event_data.TargetUserName),
      processes        = VALUES(winlog.event_data.ProcessName),
      parent_processes = VALUES(winlog.event_data.CallerProcessName),
      file_paths       = VALUES(winlog.event_data.FileNameBuffer),
      messages         = VALUES(message)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      parent_processes,
      file_paths,
      messages
  | SORT event_count DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1070.006
  - detection.threat-hunting
severity: low
risk_score: 20
references:
  - "https://www.inversecos.com/2022/04/defence-evasion-technique-timestomping.html"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1070: ["T1070.006"]
