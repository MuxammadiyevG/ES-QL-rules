rule_id: 1ccab74e-df06-4a19-882e-c47adec53f0c
name: "Compress-Archive Cmdlet Execution"
description: |
  Detects PowerShell Script Block Logging events where the Compress-Archive cmdlet is used to compress
  files/folders. Adversaries may stage collected data into archives before exfiltration to reduce size
  and simplify transfer.
  Requirements: PowerShell Script Block Logging must be enabled.
  False positives: Likely (legitimate admin/dev scripts, backups, packaging tasks).
  Triage: Review script content and output path, look for sensitive directory targets (Users, Desktop,
  Documents, browser/profile folders), unusual archive destinations (Temp, Public, ProgramData),
  and correlate with subsequent network activity (uploads, new outbound connections) or file writes.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // PowerShell Script Block Logging
  | WHERE winlog.channel == "Microsoft-Windows-PowerShell/Operational"
  | WHERE event.code == "4104"
  // Compress-Archive cmdlet aniqlash
  | WHERE winlog.event_data.ScriptBlockText RLIKE "(?i).*Compress-Archive.*"
  // Vaqt konteksti
  | EVAL hour_of_day    = DATE_EXTRACT("HOUR_OF_DAY", @timestamp)
  | EVAL is_after_hours = CASE(hour_of_day < 7 OR hour_of_day > 20, 1, 0)
  | STATS
      event_count      = COUNT(*),
      users            = VALUES(winlog.event_data.SubjectUserName),
      processes        = VALUES(winlog.event_data.ProcessName),
      script_blocks    = VALUES(winlog.event_data.ScriptBlockText),
      script_paths     = VALUES(winlog.event_data.ScriptPath),
      pipe_ids         = VALUES(winlog.event_data.PipelineId),
      after_hours_hits = SUM(is_after_hours)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  // Risk hisoblash
  | EVAL risk_score = event_count * 10 + after_hours_hits * 10
  | WHERE risk_score >= 10
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      script_blocks,
      script_paths,
      pipe_ids,
      after_hours_hits,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - attack.exfiltration
  - attack.collection
  - attack.t1560
  - detection.threat-hunting
severity: low
risk_score: 20
references:
  - "https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1560/T1560.md"
nist: ["AU-6", "SI-4"]
pci_dss: ["10.2"]
mitre_attack:
  TA0009: # Collection — was incorrectly TA0010 (Exfiltration)
    T1560: []
