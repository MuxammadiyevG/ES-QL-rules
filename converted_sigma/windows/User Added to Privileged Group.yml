rule_id: a4ff3fe8-514b-4008-b562-bebc59daef7c
name: User Added to Privileged Group
description: |
  Foydalanuvchining Domain Admins yoki boshqa muhim guruhlarga qo'shilishi (Event ID 4728, 4732).
  Bu huquqlarni oshirishning (Privilege Escalation) eng aniq belgisidir.
  SOC triage bosqichlari:
  - Guruh nomini (`target_group`) tekshiring.
  - `actor` (qo'shgan user) admin huquqiga egaligini va bu amal rejalashtirilganligini tekshiring.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // 4728 - Global group, 4732 - Local group, 4756 - Universal group (member added)
  | WHERE event.code IN ("4728", "4732", "4756")
  | EVAL actor        = COALESCE(winlog.event_data.SubjectUserName, "")
  | EVAL actor_domain = COALESCE(winlog.event_data.SubjectDomainName, "")
  // Tizim akkauntlarini chiqarib tashlash
  | WHERE NOT (
      actor LIKE "*$"
      OR actor == "-"
      OR actor == ""
      OR actor RLIKE "(?i)(system|network service|local service)"
  )
  // Faqat imtiyozli guruhlarni aniqlash
  | WHERE winlog.event_data.TargetUserName RLIKE "(?i).*(Admin|Backup Operators|Remote Desktop|Domain Admins|Enterprise Admins|Schema Admins|Account Operators|Server Operators|Print Operators|Group Policy Creator).*"
  | STATS
      event_count    = COUNT(*),
      event_codes    = VALUES(event.code),
      actors         = VALUES(winlog.event_data.SubjectUserName),
      actor_domains  = VALUES(winlog.event_data.SubjectDomainName),
      target_groups  = VALUES(winlog.event_data.TargetUserName),
      members        = VALUES(winlog.event_data.MemberName),
      member_sids    = VALUES(winlog.event_data.MemberSid),
      logon_ids      = VALUES(winlog.event_data.SubjectLogonId)
  BY
      agent_id,
      winlog.computer_name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      winlog.computer_name,
      event_count,
      event_codes,
      actors,
      actor_domains,
      target_groups,
      members,
      member_sids,
      logon_ids
  | SORT event_count DESC
enabled: true
tags:
  - detection.privilege_escalation
  - monitoring.groups
severity: low
risk_score: 50
nist: []
pci_dss: []
gdpr: []
mitre_attack: []
