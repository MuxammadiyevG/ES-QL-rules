rule_id: d8bc1121-8f8a-4b6e-8d0c-f419f33e3be3
name: AD User Account Created - Persistence Check
description: |
  Ushbu qoida Active Directory muhitida yangi foydalanuvchi hisobi yaratilishini aniqlaydi (Event ID 4720).
  Hujumchilar persistence (doimiy kirish) ta'minlash uchun yangi akkauntlar yaratishi mumkin.
  SOC triage bosqichlari:
  - `actor` (yaratuvchi) va `target_user` (yangi user) ni aniqlang.
  - HR yoki IT ticket tizimida ushbu user uchun ruxsat borligini tekshiring.
  - Akkaunt naming konvensiyaga mosligini tekshiring.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // 4720 - User akkaunt yaratish, 4741 - Kompyuter akkaunt yaratish
  | WHERE event.code IN ("4720", "4741")
  | EVAL actor        = COALESCE(winlog.event_data.SubjectUserName, "")
  | EVAL actor_domain = COALESCE(winlog.event_data.SubjectDomainName, "")
  | EVAL target_user  = COALESCE(winlog.event_data.TargetUserName, "")
  | EVAL sam_name     = COALESCE(winlog.event_data.SamAccountName, "")
  // Tizim akkauntlarini chiqarib tashlash
  | WHERE NOT (
      actor LIKE "*$"
      OR actor == "-"
      OR actor == ""
      OR actor RLIKE "(?i)(system|network service|local service)"
  )
  | STATS
      event_count    = COUNT(*),
      event_codes    = VALUES(event.code),
      actors         = VALUES(winlog.event_data.SubjectUserName),
      actor_domains  = VALUES(winlog.event_data.SubjectDomainName),
      target_users   = VALUES(winlog.event_data.TargetUserName),
      sam_names      = VALUES(winlog.event_data.SamAccountName),
      logon_ids      = VALUES(winlog.event_data.SubjectLogonId)
  BY
      agent_id,
      winlog.computer_name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      winlog.computer_name,
      event_count,
      event_codes,
      actors,
      actor_domains,
      target_users,
      sam_names,
      logon_ids
  | SORT event_count DESC
enabled: true
tags:
  - detection.persistence
  - monitoring.user_management
severity: low
risk_score: 50
nist: []
pci_dss: []
gdpr: []
mitre_attack: []
