rule_id: 9418f1f2-04e5-4381-af4c-a375ec9ae15e
#//RULE-NIST-18 — Ransomware Activity Indicators (NIST IR-4, SI-4)
#//Control Family: IR (Incident Response), SI (System and Information Integrity)
#//Objective: Detect early indicators of ransomware deployment
#//Threat scenario: Attacker deploys ransomware for extortion and business disruption
#//Data sources: Windows file creation patterns, mass file encryption indicators
#//ECS fields used: event.action, file.extension, winlog.event_data.OriginalFileName, winlog.event_data.ProcessName
#//Field validation: Verify all ECS fields exist in your indices before enabling
#//Tuning notes: Adjust file extension list for new ransomware variants, threshold for mass file ops

name: "Ransomware File Encryption Detection"
description: |
  Detects rapid creation of files with ransomware-associated extensions or mass file renaming.
  Suspicious extensions: .encrypted, .locked, .crypt, .enc, random extensions.
  High volume file operations (>50 files/minute) combined with extension changes indicate active encryption.
  False positives: Backup operations, file archiving, legitimate encryption tools.
  Triage: IMMEDIATE isolation of affected host, check for ransom note files (README.txt, HOW_TO_DECRYPT),
  review for known ransomware IOCs, initiate incident response procedures.
type: esql
params: "{}"
schedule_interval: 5m
index:
  - winlogbeat-*
  - auditbeat-*
query_language: esql
query: |
  FROM logs-winlog*
  // Fayl operatsiyalarini message orqali aniqlash
  | WHERE message RLIKE "(?i).*(encrypted|locked|crypt|enc|cry|crypted|l0cked|dharma|cerber|locky|wannacry|ryuk|maze|conti).*"
      OR message RLIKE "(?i).*(README|HOW_TO_DECRYPT|RESTORE_FILES|DECRYPT_INSTRUCTIONS).*"
      OR winlog.event_data.FileNameBuffer RLIKE "(?i).*\\.(encrypted|locked|crypt|enc|cry|crypted|l0cked)$"
  // Ransomware indikatorini aniqlash
  | EVAL suspicious_extension = CASE(
      winlog.event_data.FileNameBuffer RLIKE "(?i).*\\.(encrypted|locked|crypt|enc|cry|crypted|l0cked)$", 1,
      message RLIKE "(?i).*(README|HOW_TO_DECRYPT|RESTORE_FILES|DECRYPT_INSTRUCTIONS).*", 1,
      message RLIKE "(?i).*(dharma|cerber|locky|wannacry|ryuk|maze|conti).*", 1,
      0
  )
  // Foydalanuvchi ma'lumotlari operatsiyasini aniqlash
  | EVAL user_data = CASE(
      winlog.event_data.FileNameBuffer RLIKE "(?i).*\\.(doc|docx|xls|xlsx|pdf|jpg|png)$", 1,
      0
  )
  | STATS
      total_file_ops        = COUNT(*),
      ransomware_indicators = SUM(suspicious_extension),
      user_data_ops         = SUM(user_data),
      unique_extensions     = COUNT_DISTINCT(winlog.event_data.FileNameBuffer),
      file_paths            = VALUES(winlog.event_data.FileNameBuffer),
      processes             = VALUES(winlog.event_data.ProcessName),
      users                 = VALUES(winlog.event_data.SubjectUserName)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE ransomware_indicators >= 1
      OR (total_file_ops >= 50 AND unique_extensions >= 10)
  | EVAL confidence_level = CASE(
      ransomware_indicators >= 5,                              "critical",
      ransomware_indicators >= 1 AND total_file_ops >= 100,   "high",
      total_file_ops >= 200,                                   "medium",
      "low"
  )
  | EVAL risk_score = ransomware_indicators * 50 + total_file_ops / 2
  | WHERE risk_score >= 50
  | KEEP
      agent_id,
      bucket,
      host.name,
      total_file_ops,
      ransomware_indicators,
      user_data_ops,
      unique_extensions,
      processes,
      users,
      file_paths,
      confidence_level,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - nist_800_53
  - control_IR-4
  - control_SI-4
  - family_IR
  - family_SI
  - impact
  - ransomware
  - critical_incident
severity: critical
risk_score: 95
references:
  - "NIST SP 800-53 Rev.5 IR-4: Incident Handling"
  - "MITRE ATT&CK T1486: Data Encrypted for Impact"
nist: ["IR-4", "SI-4"]
gdpr: []
pci_dss: []
mitre_attack:
  TA0040:
    T1486: []
