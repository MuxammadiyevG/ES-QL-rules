rule_id: 2f734187-d3fe-4c47-9963-0f6484b970c9
# 5) File Access / Read (generic)
name: "INFO - File Access (Windows)"
description: |
  Informational baseline for file access/read events (open/read). Requires ETW Kernel-File or similar
  telemetry that produces file access events.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // 4663 - fayl/obyektga kirish (read access mask)
  | WHERE event.code == "4663"
  // Read access mask: 0x1 (GENERIC_READ) yoki 0x80000000
  | WHERE winlog.event_data.AccessMask IN ("0x1", "0x80000000", "0x3")
  | WHERE winlog.event_data.ObjectName IS NOT NULL
  // Tizim shovqinlarini chiqarib tashlash
  | WHERE NOT (
      COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i)^C:\\\\Windows\\\\System32\\\\.*"
      OR COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i)^C:\\\\Windows\\\\SysWOW64\\\\.*"
  )
  | STATS
      event_count     = COUNT(*),
      users           = VALUES(winlog.event_data.SubjectUserName),
      processes       = VALUES(winlog.event_data.ProcessName),
      parents         = VALUES(winlog.event_data.CallerProcessName),
      accessed_paths  = VALUES(winlog.event_data.ObjectName),
      access_masks    = VALUES(winlog.event_data.AccessMask)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      parents,
      accessed_paths,
      access_masks
  | SORT event_count DESC
enabled: true
tags:
  - informational
  - file-monitoring
severity: low
risk_score: 1
references:
  - "https://www.elastic.co/guide/en/ecs/current/ecs-event.html"
nist: ["AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.a"]
mitre_attack: {}
