rule_id: 3c18207a-bc46-4a5e-a82d-fcc1c499fd25
name: "WinAPI Library Calls Via PowerShell Scripts"
description: |
  Detects PowerShell Script Block Logging events referencing common WinAPI libraries (Advapi32.dll, kernel32.dll,
  KernelBase.dll, ntdll.dll, secur32.dll, user32.dll). Attackers often call WinAPI via .NET interop / Add-Type /
  P/Invoke to perform actions that may evade detections focused on typical PowerShell cmdlets/functions.
  Use this as a hunting baseline and tune for your environment.
  Requirements: PowerShell Script Block Logging must be enabled.
  False positives: Carbon PowerShell Module, Chocolatey scripts, and other legitimate automation that uses WinAPI.
  Triage: Review the script block for Add-Type / DllImport / Marshal usage, suspicious API functions (VirtualAlloc,
  WriteProcessMemory, CreateRemoteThread, OpenProcess, MiniDumpWriteDump), and correlate with process injection,
  credential dumping, or unusual child processes/network activity.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // PowerShell Script Block Logging
  | WHERE winlog.channel == "Microsoft-Windows-PowerShell/Operational"
  | WHERE event.code == "4104"
  // WinAPI library referencelarini aniqlash
  | WHERE winlog.event_data.ScriptBlockText RLIKE "(?i).*(Advapi32\\.dll|kernel32\\.dll|KernelBase\\.dll|ntdll\\.dll|secur32\\.dll|user32\\.dll).*"
  // Benign frameworklarni chiqarib tashlash
  | WHERE NOT winlog.event_data.ScriptBlockText RLIKE "(?i).*(Carbon|chocolatey|choco).*"
  // Library turini aniqlash
  | EVAL library_hit = CASE(
      winlog.event_data.ScriptBlockText RLIKE "(?i).*Advapi32\\.dll.*",   "Advapi32.dll",
      winlog.event_data.ScriptBlockText RLIKE "(?i).*kernel32\\.dll.*",   "kernel32.dll",
      winlog.event_data.ScriptBlockText RLIKE "(?i).*KernelBase\\.dll.*", "KernelBase.dll",
      winlog.event_data.ScriptBlockText RLIKE "(?i).*ntdll\\.dll.*",      "ntdll.dll",
      winlog.event_data.ScriptBlockText RLIKE "(?i).*secur32\\.dll.*",    "secur32.dll",
      winlog.event_data.ScriptBlockText RLIKE "(?i).*user32\\.dll.*",     "user32.dll",
      "WinAPI"
  )
  // Vaqt konteksti
  | EVAL hour_of_day    = DATE_EXTRACT("HOUR_OF_DAY", @timestamp)
  | EVAL is_after_hours = CASE(hour_of_day < 7 OR hour_of_day > 20, 1, 0)
  | STATS
      event_count      = COUNT(*),
      users            = VALUES(winlog.event_data.SubjectUserName),
      processes        = VALUES(winlog.event_data.ProcessName),
      script_blocks    = VALUES(winlog.event_data.ScriptBlockText),
      script_paths     = VALUES(winlog.event_data.ScriptPath),
      pipe_ids         = VALUES(winlog.event_data.PipelineId),
      libs             = VALUES(library_hit),
      after_hours_hits = SUM(is_after_hours)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | EVAL risk_score = event_count * 25 + after_hours_hits * 20
  | WHERE risk_score >= 25
  | KEEP
      agent_id,
      bucket,
      host.name,
      libs,
      event_count,
      users,
      processes,
      script_blocks,
      script_paths,
      pipe_ids,
      after_hours_hits,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - attack.execution
  - attack.t1059.001
  - attack.t1106
  - detection.threat-hunting
severity: medium
risk_score: 55
references:
  - "https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse"
nist: ["AU-6", "SI-4"]
pci_dss: ["10.2"]
mitre_attack:
  TA0002:
    T1059: ["T1059.001"]
