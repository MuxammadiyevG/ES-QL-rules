rule_id: decaa6d0-dd81-47e1-9c44-25e5afe439a2
name: "CMD Shell Output Redirect"
description: |
  Detects execution of cmd.exe with output redirection using the ">" operator.
  Adversaries may redirect the output of reconnaissance commands (e.g., hostname, whoami, dir)
  to files for later collection or exfiltration.
  False positives: Common in scripting and administration; use as a hunting baseline and
  tune by agent_id, excluding known scripts and benign parent processes.
  Triage: Review the full command line to identify redirected output files, verify the parent
  process and user context, and correlate with subsequent file access, compression, or exfiltration.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // Process creation events
  | WHERE event.code IN ("1", "4688")
  // cmd.exe aniqlash
  | WHERE winlog.event_data.ProcessName RLIKE "(?i).*\\\\cmd\\.exe$"
      OR winlog.event_data.ProcessName == "cmd.exe"
  // Output redirection (>) aniqlash — CommandLine o'rniga ProcessName ishlatamiz
  | WHERE winlog.event_data.ProcessName LIKE "* > *"
      OR message LIKE "* > *"
  // Benign shovqinlarni chiqarib tashlash
  | WHERE NOT (
      message LIKE "*\\\\Program Files (x86)\\\\Internet Download Manager\\\\IDMMsgHost.exe*"
      OR message LIKE "*chrome-extension://*"
      OR message LIKE "*\\\\.\\\\pipe\\\\chrome.nativeMessaging*"
  )
  // Vaqt konteksti
  | EVAL hour_of_day    = DATE_EXTRACT("HOUR_OF_DAY", @timestamp)
  | EVAL is_after_hours = CASE(hour_of_day < 7 OR hour_of_day > 20, 1, 0)
  // Shubhali parent aniqlash
  | EVAL suspicious_parent = CASE(
      winlog.event_data.CallerProcessName RLIKE "(?i).*(winword|excel|powerpnt|outlook|mshta|wscript|cscript|rundll32|powershell)\\.exe$", 1,
      0
  )
  | STATS
      event_count            = COUNT(*),
      users                  = VALUES(winlog.event_data.TargetUserName),
      parents                = VALUES(winlog.event_data.CallerProcessName),
      processes              = VALUES(winlog.event_data.ProcessName),
      messages               = VALUES(message),
      after_hours_hits       = SUM(is_after_hours),
      suspicious_parent_hits = SUM(suspicious_parent)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  // Risk hisoblash
  | EVAL risk_score = event_count * 5 + after_hours_hits * 10 + suspicious_parent_hits * 15
  | WHERE risk_score >= 5
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      parents,
      processes,
      messages,
      after_hours_hits,
      suspicious_parent_hits,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - attack.discovery
  - attack.t1082
  - detection.threat-hunting
severity: low
risk_score: 20
references:
  - "https://ss64.com/nt/syntax-redirection.html"

nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]

mitre_attack:
  TA0007:
    T1082: []
