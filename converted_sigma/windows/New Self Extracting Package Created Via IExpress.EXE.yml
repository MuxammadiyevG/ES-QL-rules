rule_id: 667e359d-c07f-4672-a47f-bf7c3798ac05
name: "New Self Extracting Package Created Via IExpress.EXE"
description: |
  Detects creation of self-extracting packages via IExpress. Attackers have been observed leveraging
  iexpress.exe to compile packages on the fly, often via .sed configuration files.
  This rule matches either:
   (1) makecab.exe spawned by agent_id, iexpress.exe, or
   (2) iexpress.exe executed with the /n flag (non-interactive build).
  False positives: Administrators legitimately building packages using IExpress.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // Process creation events
  | WHERE event.code IN ("1", "4688")
  // Branch 1: makecab.exe — iexpress.exe child processi
  | EVAL b1 = CASE(
      (
          winlog.event_data.ProcessName == "makecab.exe"
          OR winlog.event_data.ProcessName RLIKE "(?i).*\\\\makecab\\.exe$"
      )
      AND (
          winlog.event_data.CallerProcessName == "iexpress.exe"
          OR winlog.event_data.CallerProcessName RLIKE "(?i).*\\\\iexpress\\.exe$"
      ), 1, 0
  )
  // Branch 2: iexpress.exe /n flag bilan
  | EVAL b2 = CASE(
      (
          winlog.event_data.ProcessName == "iexpress.exe"
          OR winlog.event_data.ProcessName RLIKE "(?i).*\\\\iexpress\\.exe$"
      )
      AND message RLIKE "(?i).+/[nN](\\s|$).+", 1, 0
  )
  | WHERE b1 == 1 OR b2 == 1
  | STATS
      event_count  = COUNT(*),
      users        = VALUES(winlog.event_data.TargetUserName),
      parents      = VALUES(winlog.event_data.CallerProcessName),
      processes    = VALUES(winlog.event_data.ProcessName),
      messages     = VALUES(message),
      pids         = VALUES(winlog.event_data.ProcessPid)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      parents,
      processes,
      messages,
      pids
  | SORT event_count DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1218
  - detection.threat-hunting
severity: medium
risk_score: 50
references:
  - "https://strontic.github.io/xcyclopedia/library/iexpress.exe-D594B2A33EFAFD0EABF09E3FDC05FCEA.html"
  - "https://en.wikipedia.org/wiki/IExpress"
  - "https://decoded.avast.io/janvojtesek/raspberry-robins-roshtyak-a-little-lesson-in-trickery/"
  - "https://www.virustotal.com/gui/file/602f4ae507fa8de57ada079adff25a6c2a899bd25cd092d0af7e62cdb619c93c/behavior"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1218: []
