rule_id: 5d05dbe0-9e4a-496f-81d6-cd8eeb1d9c2f
name: "WinAPI Function Calls Via PowerShell Scripts"
description: |
  Detects PowerShell Script Block Logging events referencing common WinAPI / low-level function names frequently
  used in offensive tradecraft (P/Invoke, reflection, in-memory execution, process injection, token manipulation,
  credential dumping). Attackers may call these APIs from PowerShell to evade detections focused on standard cmdlets.
  This is primarily a threat-hunting baseline and can generate noise; tune using execution context (script path,
  parent process, user, host role) and add allowlists for known tooling.
  Requirements: PowerShell Script Block Logging must be enabled.
  False positives: Expected (legit security tools, admin frameworks, red team tooling, some installers).
  Triage: Look for Add-Type / DllImport / Marshal / reflection usage, suspicious parent processes (Office, browsers,
  wscript/cscript, mshta), unsigned script locations (Temp/Downloads/Public), and correlate with injection indicators,
  LSASS access, new services/tasks, and outbound C2.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // PowerShell Script Block Logging
  | WHERE winlog.channel == "Microsoft-Windows-PowerShell/Operational"
  | WHERE event.code == "4104"
  // WinAPI function names - 1-qism (injection/memory)
  | WHERE (
      winlog.event_data.ScriptBlockText RLIKE "(?i).*(CreateRemoteThread|CreateThread|VirtualAlloc|VirtualProtect|VirtualFree|WriteProcessMemory|ReadProcessMemory|OpenProcess|QueueUserApc|RtlCreateUserThread|CreateUserThread).*"
      // WinAPI function names - 2-qism (token/credential/handle)
      OR winlog.event_data.ScriptBlockText RLIKE "(?i).*(AdjustTokenPrivileges|DuplicateTokenEx|ImpersonateLoggedOnUser|OpenProcessToken|OpenThreadToken|GetTokenInformation|SetThreadToken|RevertToSelf|GetLogonSessionData|MiniDumpWriteDump).*"
      // WinAPI function names - 3-qism (library/process/misc)
      OR winlog.event_data.ScriptBlockText RLIKE "(?i).*(GetProcAddress|GetModuleHandle|LoadLibrary|FreeLibrary|OpenDesktop|OpenWindowStation|GetProcessHandle|DangerousGetHandle|GetDelegateForFunctionPointer|WaitForSingleObject|memcpy|ZeroFreeGlobalAllocUnicode).*"
  )
  // Vaqt konteksti
  | EVAL hour_of_day    = DATE_EXTRACT("HOUR_OF_DAY", @timestamp)
  | EVAL is_after_hours = CASE(hour_of_day < 7 OR hour_of_day > 20, 1, 0)
  // Shubhali script path aniqlash
  | EVAL suspicious_path = CASE(
      winlog.event_data.ScriptPath RLIKE "(?i).*(Downloads|AppData\\\\Local\\\\Temp|Windows\\\\Temp|ProgramData|Users\\\\Public).*", 1,
      0
  )
  | STATS
      event_count          = COUNT(*),
      users                = VALUES(winlog.event_data.SubjectUserName),
      processes            = VALUES(winlog.event_data.ProcessName),
      script_blocks        = VALUES(winlog.event_data.ScriptBlockText),
      script_paths         = VALUES(winlog.event_data.ScriptPath),
      pipe_ids             = VALUES(winlog.event_data.PipelineId),
      after_hours_hits     = SUM(is_after_hours),
      suspicious_path_hits = SUM(suspicious_path)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | EVAL risk_score = event_count * 20 + after_hours_hits * 15 + suspicious_path_hits * 10
  | WHERE risk_score >= 25
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      script_blocks,
      script_paths,
      pipe_ids,
      after_hours_hits,
      suspicious_path_hits,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - attack.execution
  - attack.t1059.001
  - attack.t1106
  - detection.threat-hunting
severity: medium
risk_score: 55
references:
  - "https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse"
nist: ["AU-6", "SI-4"]
pci_dss: ["10.2"]
mitre_attack:
  TA0002:
    T1059: ["T1059.001"]
    T1106: []
