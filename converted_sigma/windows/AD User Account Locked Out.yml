rule_id: 866b864f-b51b-4cc3-a239-4f2390e6e50b
name: AD User Account Locked Out
description: |
  Foydalanuvchi hisobi ko'p sonli muvaffaqiyatsiz urinishlardan keyin bloklanganini aniqlaydi (Event ID 4740).
  SOC triage bosqichlari:
  - `target_user` ning bloklanishiga sabab bo'lgan manba IP ni (agar mavjud bo'lsa) toping.
  - Bu brute-force hujumi yoki eskirgan parolli servis natijasi bo'lishi mumkin.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE event.code == "4740"
  | EVAL target_user   = COALESCE(winlog.event_data.TargetUserName, "")
  | EVAL target_domain = COALESCE(winlog.event_data.TargetDomainName, "")
  | EVAL actor         = COALESCE(winlog.event_data.SubjectUserName, "")
  | EVAL actor_domain  = COALESCE(winlog.event_data.SubjectDomainName, "")
  // Tizim akkauntlarini chiqarib tashlash
  | WHERE NOT (
      target_user LIKE "*$"
      OR target_user == "-"
      OR target_user == ""
  )
  | STATS
      event_count      = COUNT(*),
      target_users     = VALUES(winlog.event_data.TargetUserName),
      target_domains   = VALUES(winlog.event_data.TargetDomainName),
      actors           = VALUES(winlog.event_data.SubjectUserName),
      actor_domains    = VALUES(winlog.event_data.SubjectDomainName),
      caller_processes = VALUES(winlog.event_data.CallerProcessName),
      logon_ids        = VALUES(winlog.event_data.SubjectLogonId)
  BY
      agent_id,
      winlog.computer_name,
      bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      winlog.computer_name,
      event_count,
      target_users,
      target_domains,
      actors,
      actor_domains,
      caller_processes,
      logon_ids
  | SORT event_count DESC
enabled: true
tags:
  - detection.credential_access
  - monitoring.account_lockout
severity: medium
risk_score: 40
nist: []
pci_dss: []
gdpr: []
mitre_attack: []
