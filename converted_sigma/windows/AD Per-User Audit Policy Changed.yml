rule_id: 06010ef8-18d8-4f99-9b4e-26decdfffd46
name: AD Per-User Audit Policy Changed
description: |
  Foydalanuvchilar uchun maxsus audit siyosati o'zgarganini aniqlaydi (Event ID 4712).
  Bu ko'pincha "Defense Evasion" (loglardan qochish) texnikasi sifatida qo'llaniladi.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE event.code == "4712"
  | EVAL actor        = COALESCE(winlog.event_data.SubjectUserName, "")
  | EVAL actor_domain = COALESCE(winlog.event_data.SubjectDomainName, "")
  // Tizim akkauntlarini chiqarib tashlash
  | WHERE NOT (
      actor LIKE "*$"
      OR actor == "-"
      OR actor == ""
  )
  | STATS
      event_count    = COUNT(*),
      actors         = VALUES(winlog.event_data.SubjectUserName),
      actor_domains  = VALUES(winlog.event_data.SubjectDomainName),
      logon_ids      = VALUES(winlog.event_data.SubjectLogonId)
  BY
      agent_id,
      winlog.computer_name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      winlog.computer_name,
      event_count,
      actors,
      actor_domains,
      logon_ids
  | SORT event_count DESC
enabled: true
tags:
  - detection.defense_evasion
  - monitoring.audit_policy
severity: high
risk_score: 75
nist: []
pci_dss: []
gdpr: []
mitre_attack: []
