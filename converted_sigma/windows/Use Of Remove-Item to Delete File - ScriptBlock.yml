rule_id: f833dfa9-a8e2-4f24-80c2-c673b4e10f23
name: "Use Of Remove-Item to Delete File - ScriptBlock"
description: |
  Detects PowerShell Script Block Logging events where file or directory deletion is performed
  using Remove-Item or its common aliases (del, erase, rd, ri, rm, rmdir) with the -Path parameter.
  Adversaries may delete files or folders to remove evidence, clear artifacts, or disrupt recovery
  (defense evasion).
  Requirements: PowerShell Script Block Logging must be enabled.
  False positives: Legitimate administrative or maintenance scripts, cleanup jobs.
  Triage: Review the full script block to identify deleted paths, check for use of -Recurse/-Force,
  validate the user and execution context, and correlate with other defense-evasion behaviors
  (log clearing, shadow copy deletion, tool cleanup).
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // PowerShell Script Block Logging
  | WHERE winlog.channel == "Microsoft-Windows-PowerShell/Operational"
  | WHERE event.code == "4104"
  // Remove-Item va aliaslarini aniqlash
  | WHERE winlog.event_data.ScriptBlockText RLIKE "(?i).*(Remove-Item|del|erase|rd|ri|rm|rmdir).*"
    AND winlog.event_data.ScriptBlockText RLIKE "(?i).*-Path.*"
  // Vaqt konteksti
  | EVAL hour_of_day    = DATE_EXTRACT("HOUR_OF_DAY", @timestamp)
  | EVAL is_after_hours = CASE(hour_of_day < 7 OR hour_of_day > 20, 1, 0)
  // -Recurse va -Force flaglarini aniqlash (risk oshirish uchun)
  | EVAL has_force_recurse = CASE(
      winlog.event_data.ScriptBlockText RLIKE "(?i).*(-Recurse|-Force).*", 1,
      0
  )
  | STATS
      event_count          = COUNT(*),
      users                = VALUES(winlog.event_data.SubjectUserName),
      processes            = VALUES(winlog.event_data.ProcessName),
      script_blocks        = VALUES(winlog.event_data.ScriptBlockText),
      script_paths         = VALUES(winlog.event_data.ScriptPath),
      pipe_ids             = VALUES(winlog.event_data.PipelineId),
      after_hours_hits     = SUM(is_after_hours),
      force_recurse_hits   = SUM(has_force_recurse)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | EVAL risk_score = event_count * 10 + after_hours_hits * 10 + force_recurse_hits * 15
  | WHERE risk_score >= 10
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      script_blocks,
      script_paths,
      pipe_ids,
      after_hours_hits,
      force_recurse_hits,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1070.004
  - detection.threat-hunting
severity: low
risk_score: 20
references:
  - "https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.004/T1070.004.md"
  - "https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.management/Remove-Item?view=powershell-5.1&viewFallbackFrom=powershell-7"
nist: ["AU-6", "SI-4"]
pci_dss: ["10.2"]
mitre_attack:
  TA0005:
    T1070: ["T1070.004"]
