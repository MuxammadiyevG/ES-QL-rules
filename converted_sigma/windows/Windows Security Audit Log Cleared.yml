rule_id: 8fe9fb0b-2799-4733-9131-3851929ec499
name: Windows Security Audit Log Cleared
description: |
  Security loglari qo'lda tozalanganligini aniqlaydi (Event ID 1102).
  Bu deyarli har doim zararli yoki shubhali faoliyat belgisi hisoblanadi.
  SOC triage:
  - Ushbu amalni bajargan `actor` ni darhol so'roq qiling.
  - Log o'chirilishidan oldingi oxirgi hodisalarni tekshiring.
type: esql
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // 1102 - Security log cleared, 104 - System log cleared
  | WHERE event.code IN ("1102", "104")
  | EVAL actor        = COALESCE(winlog.event_data.SubjectUserName, "")
  | EVAL actor_domain = COALESCE(winlog.event_data.SubjectDomainName, "")
  // Tizim akkauntlarini chiqarib tashlash
  | WHERE NOT (
      actor LIKE "*$"
      OR actor == "-"
      OR actor == ""
  )
  | STATS
      event_count    = COUNT(*),
      event_codes    = VALUES(event.code),
      actors         = VALUES(winlog.event_data.SubjectUserName),
      actor_domains  = VALUES(winlog.event_data.SubjectDomainName),
      logon_ids      = VALUES(winlog.event_data.SubjectLogonId)
  BY
      agent_id,
      winlog.computer_name,
      bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE event_count >= 1
  // Log o'chirish har doim yuqori risk
  | EVAL risk_score = event_count * 100
  | KEEP
      agent_id,
      bucket,
      winlog.computer_name,
      event_count,
      event_codes,
      actors,
      actor_domains,
      logon_ids,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - detection.defense_evasion
  - monitoring.logs
severity: low
risk_score: 50
nist: []
pci_dss: []
gdpr: []
mitre_attack: []
