rule_id: a84a766e-8c22-4552-8891-4343b0a7a828
# 6) File Permission / Attribute Change (generic hunting)
name: "INFO - File Permission/Attribute Change (Windows) - Hunting"
description: |
  Informational baseline for file permission/attribute changes. Field availability varies by agent_id, telemetry.
  Uses event.action/type and raw hints. Tune with your actual fields when available.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // 4670 - obyekt permission o'zgarishi
  // 4663 - WRITE_DAC/WRITE_OWNER access mask
  | WHERE event.code IN ("4670", "4663")
  | WHERE event.code == "4670"
      OR (
          event.code == "4663"
          AND winlog.event_data.AccessMask IN ("0x40000", "0x80000", "0x4", "0x40004")
      )
  | WHERE winlog.event_data.ObjectName IS NOT NULL
  // SecurityDescriptor/ACL o'zgarishlarini message orqali aniqlash
  | WHERE message RLIKE "(?i).*(SecurityDescriptor|DACL|SACL|Attributes|Permission).*"
  // Tizim shovqinlarini chiqarib tashlash
  | WHERE NOT (
      COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i)^C:\\\\Windows\\\\System32\\\\.*"
      OR COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i)^C:\\\\Windows\\\\SysWOW64\\\\.*"
  )
  | STATS
      event_count  = COUNT(*),
      event_codes  = VALUES(event.code),
      users        = VALUES(winlog.event_data.SubjectUserName),
      processes    = VALUES(winlog.event_data.ProcessName),
      parents      = VALUES(winlog.event_data.CallerProcessName),
      paths        = VALUES(winlog.event_data.ObjectName),
      access_masks = VALUES(winlog.event_data.AccessMask),
      messages     = VALUES(message)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      event_codes,
      users,
      processes,
      parents,
      paths,
      access_masks,
      messages
  | SORT event_count DESC
enabled: true
tags:
  - informational
  - file-monitoring
severity: low
risk_score: 1
references:
  - "https://www.elastic.co/guide/en/ecs/current/ecs-event.html"
nist: ["AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.a"]
mitre_attack: {}
