rule_id: 605185f4-b4bf-4434-b304-c6d0c51c1660
# =========================
# FILE EVENT BASELINE RULES (Windows) — Informational
# Works best with file access/create/delete/rename/change telemetry (ETW/Sysmon/FIM pipelines)
# Index: winlogbeat-* (adjust if your file telemetry is in logs-* etc.)
# =========================

# 1) File Created (generic)
name: "INFO - File Created (Windows)"
description: |
  Informational baseline for file creation events. Use this to understand normal file creation patterns
  per host/user/process and build allowlists for production detections.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // Fayl path mavjudligini tekshirish
  | WHERE winlog.event_data.FileNameBuffer IS NOT NULL
  // Tizim shovqinlarini chiqarib tashlash
  | WHERE NOT (
      COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i)^C:\\\\Windows\\\\System32\\\\.*"
      OR COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i)^C:\\\\Windows\\\\SysWOW64\\\\.*"
  )
  | STATS
      event_count   = COUNT(*),
      users         = VALUES(winlog.event_data.TargetUserName),
      processes     = VALUES(winlog.event_data.ProcessName),
      parents       = VALUES(winlog.event_data.CallerProcessName),
      created_paths = VALUES(winlog.event_data.FileNameBuffer)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      parents,
      created_paths
  | SORT event_count DESC
enabled: true
tags:
  - informational
  - file-monitoring
severity: low
risk_score: 1
references:
  - "https://www.elastic.co/guide/en/ecs/current/ecs-event.html"
nist: ["AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.a"]
mitre_attack: {}
