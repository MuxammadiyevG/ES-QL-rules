rule_id: 9c5b88c1-4eb9-4547-8bb9-386cb7e436cd
name: AD Successful User Logon
description: |
  Foydalanuvchi tizimga muvaffaqiyatli kirganligini aniqlaydi (Event ID 4624).
  SOC triage bosqichlari:
  - `user` va `src_ip` ma'lumotlarini tekshiring.
  - `logon_type` orqali kirish usulini aniqlang (2 - Lokal, 3 - Tarmoq, 10 - RDP).
  - Agar kirish g'ayritabiiy vaqtda yoki noodatiy qurilmadan bo'lsa, foydalanuvchi faoliyatini chuqurroq o'rganing.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE event.code == "4624"
  // Faqat muhim logon turlari: 2-Lokal, 3-Tarmoq, 10-RDP
  | WHERE winlog.event_data.LogonType IN ("2", "3", "10")
  | EVAL user        = COALESCE(winlog.event_data.TargetUserName, "")
  | EVAL user_domain = COALESCE(winlog.event_data.TargetDomainName, "")
  // Tizim akkauntlarini chiqarib tashlash
  | WHERE NOT (
      user LIKE "*$"
      OR user == "-"
      OR user == ""
      OR user RLIKE "(?i)(system|network service|local service|anonymous logon)"
  )
  | STATS
      event_count   = COUNT(*),
      users         = VALUES(winlog.event_data.TargetUserName),
      user_domains  = VALUES(winlog.event_data.TargetDomainName),
      src_ips       = VALUES(winlog.event_data.IpAddress),
      logon_types   = VALUES(winlog.event_data.LogonType),
      logon_ids     = VALUES(winlog.event_data.TargetLogonId),
      logon_guids   = VALUES(winlog.event_data.TargetLogonGuid)
  BY
      agent_id,
      winlog.computer_name,
      bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      winlog.computer_name,
      event_count,
      users,
      user_domains,
      src_ips,
      logon_types,
      logon_ids,
      logon_guids
  | SORT event_count DESC
enabled: true
tags:
  - detection.logon
  - monitoring.auth_success
severity: low
risk_score: 10
nist: []
pci_dss: []
gdpr: []
mitre_attack: []
