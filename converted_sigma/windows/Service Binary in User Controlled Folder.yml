rule_id: 0cedb271-8644-434c-b81e-21e1824692a1
name: "Service Binary in User Controlled Folder"
description: |
  Detects registry modifications to Windows service ImagePath values where the configured service binary
  points to user-controlled locations such as ProgramData or user AppData (Local/Roaming). Attackers often
  stage payloads in these directories and then configure a service to execute them for persistence or
  privilege escalation.
  Notes: ProgramData is user-writable by agent_id, default, but some vendors apply restrictive ACLs; tune by filtering
  known-good service names/paths if noisy.
  False positives: Possible (poorly written software, some installers/updaters, vendor services).
  Triage: Identify the service name/key modified, validate the binary signature and owner, check parent process
  performing the registry write, and correlate with service creation/start events, new binaries in the referenced
  directory, and suspicious network connections.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // ControlSet\Services ImagePath o'zgarishlarini aniqlash
  | WHERE message RLIKE "(?i).*ControlSet.*\\\\Services\\\\.*"
  | WHERE message RLIKE "(?i).*\\\\ImagePath.*"
  // Foydalanuvchi tomonidan boshqariladigan papkalar
  | WHERE (
      message RLIKE "(?i).*:\\\\ProgramData\\\\.*"
      OR message RLIKE "(?i).*\\\\AppData\\\\Local\\\\.*"
      OR message RLIKE "(?i).*\\\\AppData\\\\Roaming\\\\.*"
  )
  // Windows Defender filtri
  | WHERE NOT (
      message RLIKE "(?i).*\\\\Services\\\\(WinDefend|MpKs).*"
      AND message RLIKE "(?i).*\\\\ProgramData\\\\Microsoft\\\\Windows Defender\\\\.*"
  )
  // Zoom filtri
  | WHERE NOT (
      message RLIKE "(?i).*\\\\Services\\\\ZoomCptService.*"
      AND message LIKE "*Common Files\\\\Zoom\\\\Support\\\\CptService.exe*"
  )
  // MBAM filtri
  | WHERE NOT (
      message RLIKE "(?i).*\\\\Services\\\\MBAMInstallerService.*"
      AND message RLIKE "(?i).*\\\\AppData\\\\Local\\\\Temp\\\\MBAMInstallerService\\.exe.*"
  )
  // Vaqt konteksti
  | EVAL hour_of_day    = DATE_EXTRACT("HOUR_OF_DAY", @timestamp)
  | EVAL is_after_hours = CASE(hour_of_day < 7 OR hour_of_day > 20, 1, 0)
  | STATS
      event_count      = COUNT(*),
      users            = VALUES(winlog.event_data.SubjectUserName),
      processes        = VALUES(winlog.event_data.ProcessName),
      parent_processes = VALUES(winlog.event_data.CallerProcessName),
      messages         = VALUES(message),
      after_hours_hits = SUM(is_after_hours)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | EVAL risk_score = event_count * 25 + after_hours_hits * 20
  | WHERE risk_score >= 25
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      parent_processes,
      messages,
      after_hours_hits,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.persistence
  - attack.t1112
  - detection.threat-hunting
severity: medium
risk_score: 55
references:
  - "https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md"
nist: ["AU-6", "SI-4", "CM-6"]
pci_dss: ["10.2"]
mitre_attack:
  TA0005:
    T1112: []
