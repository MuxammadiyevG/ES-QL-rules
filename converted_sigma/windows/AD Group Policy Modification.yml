rule_id: 9a829ce2-488c-4bea-904a-466daeef8e33
name: AD Group Policy Modification
description: |
  Group Policy obyekti yaratilishi, o'zgartirilishi yoki o'chirilishini aniqlaydi (Event ID 5136, 5137).
  Bu butun domen xavfsizligiga ta'sir qiluvchi jiddiy hodisa hisoblanadi.
  SOC triage:
  - `ObjectDN` orqali qaysi GPO o'zgarganini aniqlang.
  - O'zgarish tarkibini (masalan, yangi skript qo'shilganmi) tekshiring.
type: esql
params: "{}"
schedule_interval: 15m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE event.code IN ("5136", "5137", "5141")
  | EVAL actor        = COALESCE(winlog.event_data.SubjectUserName, "")
  | EVAL actor_domain = COALESCE(winlog.event_data.SubjectDomainName, "")
  | EVAL op_type      = COALESCE(winlog.event_data.OperationType, "")
  // Tizim akkauntlarini chiqarib tashlash
  | WHERE NOT (
      actor LIKE "*$"
      OR actor == "-"
      OR actor == ""
  )
  | STATS
      event_count    = COUNT(*),
      actors         = VALUES(winlog.event_data.SubjectUserName),
      actor_domains  = VALUES(winlog.event_data.SubjectDomainName),
      event_codes    = VALUES(event.code),
      op_types       = VALUES(winlog.event_data.OperationType),
      logon_ids      = VALUES(winlog.event_data.SubjectLogonId)
  BY
      agent_id,
      winlog.computer_name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      winlog.computer_name,
      event_count,
      actors,
      actor_domains,
      event_codes,
      op_types,
      logon_ids
  | SORT event_count DESC
enabled: true
tags:
  - detection.defense_evasion
  - monitoring.gpo
severity: low
risk_score: 50
nist: []
pci_dss: []
gdpr: []
mitre_attack: []
