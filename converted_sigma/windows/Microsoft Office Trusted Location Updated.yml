rule_id: 529cc646-9e26-4115-a9ab-ce41db902b20
name: "Microsoft Office Trusted Location Updated"
description: |
  Detects registry modifications that add or update Microsoft Office Trusted Locations.
  Attackers may add malicious directories as trusted locations to bypass Office macro
  security controls and execute macro-enabled documents without warnings.
  False positives: Common during Office installation, upgrades, Click-to-Run operations,
  or legitimate administrative configuration.
  Triage: Identify the Office application/version affected, review the added trusted path,
  verify the modifying process and user, and correlate with subsequent Office document
  execution, macro activity, or suspicious child processes.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // Trusted Location registry path aniqlash
  | WHERE message RLIKE "(?i).*Security\\\\Trusted Locations\\\\Location.*"
    AND message RLIKE "(?i).*\\\\Path.*"
  // Office installer va Office app larini chiqarib tashlash
  | WHERE NOT (
      COALESCE(winlog.event_data.ProcessName, "") LIKE "*\\\\Program Files\\\\Common Files\\\\Microsoft Shared\\\\ClickToRun\\\\OfficeClickToRun.exe"
      OR COALESCE(winlog.event_data.ProcessName, "") LIKE "*\\\\Program Files\\\\Microsoft Office\\\\*"
      OR COALESCE(winlog.event_data.ProcessName, "") LIKE "*\\\\Program Files (x86)\\\\Microsoft Office\\\\*"
  )
  // Vaqt konteksti
  | EVAL hour_of_day    = DATE_EXTRACT("HOUR_OF_DAY", @timestamp)
  | EVAL is_after_hours = CASE(hour_of_day < 7 OR hour_of_day > 20, 1, 0)
  | STATS
      event_count      = COUNT(*),
      users            = VALUES(winlog.event_data.SubjectUserName),
      processes        = VALUES(winlog.event_data.ProcessName),
      parent_processes = VALUES(winlog.event_data.CallerProcessName),
      messages         = VALUES(message),
      after_hours_hits = SUM(is_after_hours)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 1
  | EVAL risk_score = event_count * 25 + after_hours_hits * 20
  | WHERE risk_score >= 25
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      parent_processes,
      messages,
      after_hours_hits,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.persistence
  - attack.t1112
  - detection.threat-hunting
severity: medium
risk_score: 55
references:
  - "https://admx.help/?Category=Office2016&Policy=excel16.Office.Microsoft.Policies.Windows::L_TrustedLoc01"
nist: ["AU-6", "SI-4", "CM-6"]
pci_dss: ["10.2"]
mitre_attack:
  TA0005:
    T1112: []
