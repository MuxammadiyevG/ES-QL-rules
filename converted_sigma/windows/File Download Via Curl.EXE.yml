rule_id: 6b092f22-03b6-4847-9604-970556cc0662
name: "File Download Via Curl.EXE"
description: |
  Detects file download activity using curl.exe by agent_id, identifying curl execution with output flags such as
  -O/--remote-name/--output. Attackers may use curl to download tools or payloads from remote servers.
  False positives: Developer/admin scripts and legitimate automation; Git for Windows may use curl with
  --output in temp (gfw-httpget-xxxxxxxx.txt). Use as a hunting baseline and tune with allowlists.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // Process creation events
  | WHERE event.code IN ("1", "4688")
  // curl.exe aniqlash
  | WHERE winlog.event_data.ProcessName == "curl.exe"
      OR winlog.event_data.ProcessName RLIKE "(?i).*\\\\curl\\.exe$"
  // Download flaglarini message orqali aniqlash
  | WHERE message RLIKE "(?i).+(-O|--remote-name|--output).+"
      OR message RLIKE "(?i).+-[a-zA-Z]*O.+"
  // Git for Windows temp fayllarini chiqarib tashlash
  | WHERE NOT message RLIKE "(?i).*gfw-httpget-[a-z0-9]{8}\\.txt.*"
  | STATS
      event_count  = COUNT(*),
      users        = VALUES(winlog.event_data.TargetUserName),
      parents      = VALUES(winlog.event_data.CallerProcessName),
      executables  = VALUES(winlog.event_data.ProcessName),
      messages     = VALUES(message),
      pids         = VALUES(winlog.event_data.ProcessPid)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      parents,
      executables,
      messages,
      pids
  | SORT event_count DESC
enabled: true
tags:
  - attack.command-and-control
  - attack.t1105
  - detection.threat-hunting
severity: medium
risk_score: 50
references:
  - "https://web.archive.org/web/20200128160046/https://twitter.com/reegun21/status/1222093798009790464"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0011:
    T1105: []
