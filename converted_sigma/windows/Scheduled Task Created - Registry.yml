rule_id: ce3acf5d-4ce3-49d1-97d4-d95299857813
name: "Scheduled Task Created - Registry"
description: |
  Detects creation of Windows Scheduled Tasks via registry modifications to TaskCache keys:
  \Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tasks\ and \...\TaskCache\Tree\.
  Attackers may create scheduled tasks for persistence, execution, or privilege escalation.
  False positives: Likely (normal Windows/admin behavior). Use as hunting baseline and tune by
  agent_id, filtering known task paths, approved management tooling, and narrowing to suspicious users/hosts/times.
  Triage: Identify the task name/path and associated actions (schtasks.exe, TaskScheduler COM),
  review the creating user and parent process chain, and correlate with new service creation,
  script drops, or unusual binaries referenced by the task.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // TaskCache registry keylarini message orqali aniqlash
  | WHERE message RLIKE "(?i).*\\\\Schedule\\\\TaskCache\\\\(Tasks|Tree)\\\\.*"
  | EVAL taskcache_area = CASE(
      message RLIKE "(?i).*\\\\TaskCache\\\\Tasks\\\\.*", "TaskCache\\Tasks",
      message RLIKE "(?i).*\\\\TaskCache\\\\Tree\\\\.*",  "TaskCache\\Tree",
      "TaskCache"
  )
  // Vaqt konteksti
  | EVAL hour_of_day    = DATE_EXTRACT("HOUR_OF_DAY", @timestamp)
  | EVAL is_after_hours = CASE(hour_of_day < 7 OR hour_of_day > 20, 1, 0)
  // Tizim akkauntlarini chiqarib tashlash
  | WHERE NOT (
      COALESCE(winlog.event_data.SubjectUserName, "") LIKE "*$"
      OR COALESCE(winlog.event_data.SubjectUserName, "") == "-"
      OR COALESCE(winlog.event_data.SubjectUserName, "") == ""
  )
  | STATS
      event_count      = COUNT(*),
      users            = VALUES(winlog.event_data.SubjectUserName),
      processes        = VALUES(winlog.event_data.ProcessName),
      parent_processes = VALUES(winlog.event_data.CallerProcessName),
      messages         = VALUES(message),
      after_hours_hits = SUM(is_after_hours)
  BY
      agent_id,
      host.name,
      taskcache_area,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | EVAL risk_score = event_count * 5 + after_hours_hits * 10
  | WHERE risk_score >= 5
  | KEEP
      agent_id,
      bucket,
      host.name,
      taskcache_area,
      event_count,
      users,
      processes,
      parent_processes,
      messages,
      after_hours_hits,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - attack.execution
  - attack.persistence
  - attack.privilege-escalation
  - attack.s0111
  - attack.t1053.005
  - car.2013-08-001
  - detection.threat-hunting
severity: low
risk_score: 20
references:
  - "https://center-for-threat-informed-defense.github.io/summiting-the-pyramid/analytics/task_scheduling/"
  - "https://posts.specterops.io/abstracting-scheduled-tasks-3b6451f6a1c5"
nist: ["AU-6", "SI-4", "CM-6"]
pci_dss: ["10.2"]
mitre_attack:
  TA0002:
    T1053: ["T1053.005"]
  TA0003:
    T1053: ["T1053.005"]
  TA0004:
    T1053: ["T1053.005"]
