rule_id: f574b6df-1d26-4287-9463-453a987c8db2
name: "WDAC Policy File Creation In CodeIntegrity Folder"
description: |
  Detects creation of WDAC policy-related files (.cip / .p7b) inside the privileged
  Windows Code Integrity directory (C:\Windows\System32\CodeIntegrity\) by agent_id, a high-integrity
  (elevated) process. Attackers can weaponize WDAC to block EDR drivers while allowing
  malicious code, requiring a reboot to take effect.
  Note: This rule expects IntegrityLevel telemetry; if you don't ingest it, treat this as
  a hunting rule based on the folder/file extension and then correlate with elevation/admin activity.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // CodeIntegrity papkasida .cip va .p7b fayllarini aniqlash
  | EVAL p = COALESCE(winlog.event_data.FileNameBuffer, "")
  | WHERE p LIKE "*:\\\\Windows\\\\System32\\\\CodeIntegrity\\\\*"
    AND p RLIKE "(?i).*\\.(cip|p7b)$"
  // IntegrityLevel High ni message orqali aniqlash
  | WHERE message RLIKE "(?i).*IntegrityLevel[ \t]*[:=][ \t]*High.*"
      OR log.level == "high"
  | STATS
      event_count  = COUNT(*),
      users        = VALUES(winlog.event_data.TargetUserName),
      processes    = VALUES(winlog.event_data.ProcessName),
      parents      = VALUES(winlog.event_data.CallerProcessName),
      file_paths   = VALUES(winlog.event_data.FileNameBuffer),
      messages     = VALUES(message)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      parents,
      file_paths,
      messages
  | SORT event_count DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1562.001
  - detection.threat-hunting
severity: medium
risk_score: 50
references:
  - "https://beierle.win/2024-12-20-Weaponizing-WDAC-Killing-the-Dreams-of-EDR/"
  - "https://www.virustotal.com/gui/file/d2a4f52a9923336f119a52e531bbb1e66f18322fd8efa9af1a64b94f4d36dc97"
nist: ["SI-4", "AU-12", "CM-6"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1562: ["T1562.001"]
