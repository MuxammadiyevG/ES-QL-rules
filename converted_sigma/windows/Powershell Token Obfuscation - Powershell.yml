rule_id: f6589032-b2d3-43ad-ab84-70614dace68f
name: "Powershell Token Obfuscation - Powershell"
description: |
  Detects common token-obfuscation patterns frequently produced by agent_id, Invoke-Obfuscation and similar techniques
  in PowerShell Script Block Logging. This is intended as a threat-hunting baseline to identify obfuscated
  scripts (backticks inserted into tokens, string-format placeholder reconstruction, and obfuscated ${env:path}).
  Requirements: PowerShell Script Block Logging must be enabled.
  Exclusions: Known benign cases (plain ${env:path}, Chocolatey install scripts, Exchange servicecontrol.ps1 patterns).
  False positives: Possible (heavy legitimate string formatting or intentionally obfuscated admin scripts).
  Triage: Review the full script block for download/execute patterns (IEX, DownloadString, FromBase64String),
  suspicious network/URL usage, and correlate with parent process, user context, and follow-on persistence actions.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // PowerShell Script Block Logging
  | WHERE winlog.channel == "Microsoft-Windows-PowerShell/Operational"
  | WHERE event.code == "4104"
  // Token obfuscation patternlarini alohida tekshirish
  // Pattern 1: Backtick-in-token (i`n`v`o`k`e style)
  | WHERE (
      winlog.event_data.ScriptBlockText RLIKE "(?i).*[a-zA-Z]+`[a-zA-Z]`[a-zA-Z].*"
      // Pattern 2: String-format reconstruction ("{0}{1}" -f ...)
      OR winlog.event_data.ScriptBlockText RLIKE "(?i).*[{][0-9][}][{][0-9][}].*-f.*"
      // Pattern 3: Obfuscated environment path
      OR winlog.event_data.ScriptBlockText RLIKE "(?i).*[$][{].*`.*v.*:.*`.*[}].*"
  )
  // Benign holatlarni chiqarib tashlash
  | WHERE NOT winlog.event_data.ScriptBlockText LIKE "*${env:path}*"
  | WHERE NOT winlog.event_data.ScriptBlockText LIKE "*it will return true or false instead*"
  | WHERE NOT winlog.event_data.ScriptBlockText LIKE "*The function also prevents*"
  | WHERE NOT (
      winlog.event_data.ScriptPath RLIKE "(?i).*\\\\Exchange Server\\\\.*\\\\servicecontrol\\.ps1$"
      AND winlog.event_data.ScriptBlockText LIKE "*`r`n*"
  )
  // Vaqt konteksti
  | EVAL hour_of_day    = DATE_EXTRACT("HOUR_OF_DAY", @timestamp)
  | EVAL is_after_hours = CASE(hour_of_day < 7 OR hour_of_day > 20, 1, 0)
  | STATS
      event_count      = COUNT(*),
      users            = VALUES(winlog.event_data.SubjectUserName),
      processes        = VALUES(winlog.event_data.ProcessName),
      script_blocks    = VALUES(winlog.event_data.ScriptBlockText),
      script_paths     = VALUES(winlog.event_data.ScriptPath),
      pipe_ids         = VALUES(winlog.event_data.PipelineId),
      after_hours_hits = SUM(is_after_hours)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | EVAL risk_score = event_count * 25 + after_hours_hits * 20
  | WHERE risk_score >= 25
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      script_blocks,
      script_paths,
      pipe_ids,
      after_hours_hits,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1027.009
  - detection.threat-hunting
severity: medium
risk_score: 55
references:
  - "https://github.com/danielbohannon/Invoke-Obfuscation"
nist: ["AU-6", "SI-4"]
pci_dss: ["10.2"]
mitre_attack:
  TA0005:
    T1027: ["T1027.009"]
