rule_id: 79419d74-456a-410a-8164-1e5ef49c6788
name: "CodePage Modification Via MODE.COM"
description: |
  Detects a CodePage modification using the mode.com utility by agent_id, matching command line patterns
  consistent with setting console code page (e.g., "mode con cp select=...").
  This behavior has been used by threat actors (e.g., observed in Dharma ransomware activity).
  False positives: Unknown. Treat as hunting baseline and validate context.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // Process creation events
  | WHERE event.code IN ("1", "4688")
  // mode.com aniqlash
  | WHERE winlog.event_data.ProcessName == "mode.com"
      OR winlog.event_data.ProcessName RLIKE "(?i).*\\\\mode\\.com$"
  // Code page selection argumentlarini message orqali aniqlash
  | WHERE message LIKE "* con *"
      AND message LIKE "* cp *"
      AND message LIKE "*select=*"
  | STATS
      event_count  = COUNT(*),
      users        = VALUES(winlog.event_data.TargetUserName),
      parents      = VALUES(winlog.event_data.CallerProcessName),
      executables  = VALUES(winlog.event_data.ProcessName),
      messages     = VALUES(message),
      pids         = VALUES(winlog.event_data.ProcessPid)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      parents,
      executables,
      messages,
      pids
  | SORT event_count DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1036
  - detection.threat-hunting
severity: low
risk_score: 20
references:
  - "https://learn.microsoft.com/en-us/windows/win32/intl/code-page-identifiers"
  - "https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/mode"
  - "https://strontic.github.io/xcyclopedia/library/mode.com-59D1ED51ACB8C3D50F1306FD75F20E99.html"
  - "https://www.virustotal.com/gui/file/5e75ef02517afd6e8ba6462b19217dc4a5a574abb33d10eb0f2bab49d8d48c22/behavior"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1036: []
