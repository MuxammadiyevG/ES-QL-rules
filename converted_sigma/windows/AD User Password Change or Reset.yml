rule_id: ba3edecb-df30-4d75-afa3-46e9e2eabf79
name: AD User Password Change or Reset
description: |
  Foydalanuvchi paroli o'zgartirilganligini aniqlaydi (Event ID 4723, 4724).
  SOC triage bosqichlari:
  - `actor` (kim o'zgartirdi) va `target_user` (kimning paroli) ni aniqlang.
  - Agar admin ko'plab foydalanuvchilar parolini ketma-ket o'zgartirsa, bu account takeover (hisobni egallash) urinishi bo'lishi mumkin.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE event.code IN ("4723", "4724")
  | EVAL actor         = COALESCE(winlog.event_data.SubjectUserName, "")
  | EVAL actor_domain  = COALESCE(winlog.event_data.SubjectDomainName, "")
  | EVAL target_user   = COALESCE(winlog.event_data.TargetUserName, "")
  | EVAL target_domain = COALESCE(winlog.event_data.TargetDomainName, "")
  // Tizim akkauntlarini chiqarib tashlash
  | WHERE NOT (
      actor LIKE "*$"
      OR actor == "-"
      OR actor == ""
      OR actor RLIKE "(?i)(system|network service|local service)"
  )
  | STATS
      event_count     = COUNT(*),
      event_codes     = VALUES(event.code),
      actors          = VALUES(winlog.event_data.SubjectUserName),
      actor_domains   = VALUES(winlog.event_data.SubjectDomainName),
      target_users    = VALUES(winlog.event_data.TargetUserName),
      target_domains  = VALUES(winlog.event_data.TargetDomainName),
      logon_ids       = VALUES(winlog.event_data.SubjectLogonId)
  BY
      agent_id,
      winlog.computer_name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      winlog.computer_name,
      event_count,
      event_codes,
      actors,
      actor_domains,
      target_users,
      target_domains,
      logon_ids
  | SORT event_count DESC
enabled: true
tags:
  - detection.credential_access
  - monitoring.password_management
severity: medium
risk_score: 45
nist: []
pci_dss: []
gdpr: []
mitre_attack: []
