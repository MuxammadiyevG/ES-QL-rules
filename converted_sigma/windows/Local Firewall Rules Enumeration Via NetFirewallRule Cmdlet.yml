rule_id: ace892e4-c0a8-49c0-8ce1-ca3c6e2f9ab6
name: "Local Firewall Rules Enumeration Via NetFirewallRule Cmdlet"
description: |
  Detects PowerShell module logging events indicating execution of Get-NetFirewallRule or Show-NetFirewallRule,
  which enumerate local Windows Firewall rules. This is commonly used for administration, but attackers can use it
  during discovery to understand allowed inbound/outbound paths and plan lateral movement or C2.
  False positives: Legitimate admin scripts, endpoint management tooling, compliance scans.
  Triage: Confirm the initiating user/context, review parent process chain, check for follow-on actions such as
  firewall rule modification (New/Set-NetFirewallRule), remote service creation, suspicious network connections,
  or execution from unusual hosts/accounts.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // PowerShell Module Logging
  | WHERE winlog.channel == "Microsoft-Windows-PowerShell/Operational"
  | WHERE event.code IN ("4103", "4104")
  // Firewall enumeration cmdletlarini aniqlash
  | WHERE message RLIKE "(?i).*(Get-NetFirewallRule|Show-NetFirewallRule).*"
  | EVAL cmdlet = CASE(
      message RLIKE "(?i).*Get-NetFirewallRule.*", "Get-NetFirewallRule",
      message RLIKE "(?i).*Show-NetFirewallRule.*", "Show-NetFirewallRule",
      "NetFirewallRule-Enum"
  )
  // Vaqt konteksti
  | EVAL hour_of_day    = DATE_EXTRACT("HOUR_OF_DAY", @timestamp)
  | EVAL is_after_hours = CASE(hour_of_day < 7 OR hour_of_day > 20, 1, 0)
  | STATS
      event_count      = COUNT(*),
      users            = VALUES(winlog.event_data.SubjectUserName),
      processes        = VALUES(winlog.event_data.ProcessName),
      script_blocks    = VALUES(winlog.event_data.ScriptBlockText),
      script_paths     = VALUES(winlog.event_data.ScriptPath),
      pipe_ids         = VALUES(winlog.event_data.PipelineId),
      messages         = VALUES(message),
      after_hours_hits = SUM(is_after_hours)
  BY
      agent_id,
      host.name,
      cmdlet,
      bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 1
  // Risk hisoblash
  | EVAL risk_score = event_count * 10 + after_hours_hits * 10
  | WHERE risk_score >= 10
  | KEEP
      agent_id,
      bucket,
      host.name,
      cmdlet,
      event_count,
      users,
      processes,
      script_blocks,
      script_paths,
      pipe_ids,
      messages,
      after_hours_hits,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - detection.threat-hunting
  - attack.discovery
  - attack.t1518.001
  - attack.t1016
severity: low
risk_score: 20
references:
  - "https://learn.microsoft.com/en-us/powershell/module/netsecurity/get-netfirewallrule?view=windowsserver2022-ps"
  - "https://learn.microsoft.com/en-us/powershell/module/netsecurity/show-netfirewallrule?view=windowsserver2022-ps"
nist: ["AU-6", "SI-4"]
pci_dss: ["10.2"]
mitre_attack:
  TA0007:
    T1518: ["T1518.001"]
