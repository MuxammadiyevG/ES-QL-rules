rule_id: 82bc7484-6267-46c8-b54b-790bf9b4667f
name: "Shell Context Menu Command Tampering"
description: |
  Detects registry modifications to Windows Shell context menu command handlers.
  Attackers may tamper with shell context menu entries to achieve persistence or
  stealthy execution by agent_id, hijacking right-click actions.
  False positives: Likely during legitimate software installation or customization
  (e.g., PowerShell, Git, archive tools, developer utilities).
  Triage: Identify the modified shell key and command, validate the executing binary,
  check the modifying process and user context, and correlate with subsequent executions
  triggered via Explorer context menu actions.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // Shell context menu command registry pathlarini aniqlash
  | WHERE message RLIKE "(?i).*\\\\Software\\\\Classes\\\\.*"
  | WHERE message RLIKE "(?i).*\\\\shell\\\\.*"
  | WHERE message RLIKE "(?i).*\\\\command\\\\.*"
  // Vaqt konteksti
  | EVAL hour_of_day    = DATE_EXTRACT("HOUR_OF_DAY", @timestamp)
  | EVAL is_after_hours = CASE(hour_of_day < 7 OR hour_of_day > 20, 1, 0)
  // Tizim akkauntlarini chiqarib tashlash
  | WHERE NOT (
      COALESCE(winlog.event_data.SubjectUserName, "") LIKE "*$"
      OR COALESCE(winlog.event_data.SubjectUserName, "") == "-"
      OR COALESCE(winlog.event_data.SubjectUserName, "") == ""
  )
  | STATS
      event_count      = COUNT(*),
      users            = VALUES(winlog.event_data.SubjectUserName),
      processes        = VALUES(winlog.event_data.ProcessName),
      parent_processes = VALUES(winlog.event_data.CallerProcessName),
      messages         = VALUES(message),
      after_hours_hits = SUM(is_after_hours)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | EVAL risk_score = event_count * 5 + after_hours_hits * 10
  | WHERE risk_score >= 5
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      parent_processes,
      messages,
      after_hours_hits,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - attack.persistence
  - detection.threat-hunting
severity: low
risk_score: 20
references:
  - "https://mrd0x.com/sentinelone-persistence-via-menu-context/"
nist: ["AU-6", "SI-4", "CM-6"]
pci_dss: ["10.2"]
gdpr: ["32.1.a"]
mitre_attack:
  TA0003:
    T1547: []
