rule_id: 9e4b3124-3000-4bcb-9014-d1005c53225c
name: AD User Account Enabled
description: |
  Ilgari o'chirilgan (disabled) foydalanuvchi hisobi qayta yoqilganligini aniqlaydi (Event ID 4722).
  SOC triage bosqichlari:
  - `target_user` haqiqatdan ham ishga qaytgan xodim ekanligini HR ma'lumotlari orqali tekshiring.
  - `actor` (admin) ushbu amalni bajarish uchun asosga (ticket) ega ekanligini tasdiqlang.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE event.code == "4722"
  | EVAL actor         = COALESCE(winlog.event_data.SubjectUserName, "")
  | EVAL actor_domain  = COALESCE(winlog.event_data.SubjectDomainName, "")
  | EVAL target_user   = COALESCE(winlog.event_data.TargetUserName, "")
  | EVAL target_domain = COALESCE(winlog.event_data.TargetDomainName, "")
  // Tizim akkauntlarini chiqarib tashlash
  | WHERE NOT (
      actor LIKE "*$"
      OR actor == "-"
      OR actor == ""
      OR actor RLIKE "(?i)(system|network service|local service)"
  )
  | STATS
      event_count     = COUNT(*),
      actors          = VALUES(winlog.event_data.SubjectUserName),
      actor_domains   = VALUES(winlog.event_data.SubjectDomainName),
      target_users    = VALUES(winlog.event_data.TargetUserName),
      target_domains  = VALUES(winlog.event_data.TargetDomainName),
      sam_names       = VALUES(winlog.event_data.SamAccountName),
      logon_ids       = VALUES(winlog.event_data.SubjectLogonId)
  BY
      agent_id,
      winlog.computer_name,
      bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      winlog.computer_name,
      event_count,
      actors,
      actor_domains,
      target_users,
      target_domains,
      sam_names,
      logon_ids
  | SORT event_count DESC
enabled: true
tags:
  - detection.persistence
  - monitoring.account_status
severity: medium
risk_score: 50
nist: []
pci_dss: []
gdpr: []
mitre_attack: []
