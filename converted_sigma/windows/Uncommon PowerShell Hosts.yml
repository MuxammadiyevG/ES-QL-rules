rule_id: fda1586a-3411-4fd8-8e88-1723eb656161
name: "Uncommon PowerShell Hosts"
description: |
  Detects PowerShell execution where the host application is NOT the standard powershell.exe,
  which may indicate an attempt to bypass detections that key on powershell.exe.
  This rule looks for the PowerShell Classic logging artifact "HostApplication=" in event.original,
  then excludes common legitimate hosts (System32/SysWOW64 powershell paths, sdiagnhost.exe) and
  known benign vendor cases (Citrix ConfigSync, Hexnode Agent).
  Notes: PowerShell logging strings can be localized on non-English Windows builds; if your logs
  translate "HostApplication", add localized equivalents to the selection/filter logic.
  False positives: Legitimate software embedding PowerShell, MSP tooling, Citrix/MDM automation.
  Triage: Identify the host_application value, validate the parent process chain, check command_line,
  correlate with remote logons (WinRM/RDP), service creation, scheduled tasks, or LOLBins activity.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // PowerShell Classic channel
  | WHERE winlog.channel == "Windows PowerShell"
  | WHERE event.code == "400"
  // HostApplication mavjudligini aniqlash
  | WHERE message LIKE "*HostApplication=*"
  // Standard PowerShell hostlarini chiqarib tashlash
  | WHERE NOT (
      message RLIKE "(?i).*HostApplication=[A-Z]:[/\\\\]+Windows[/\\\\]+System32[/\\\\]+WindowsPowerShell[/\\\\]+v1\\.0[/\\\\]+powershell.*"
      OR message RLIKE "(?i).*HostApplication=[A-Z]:[/\\\\]+Windows[/\\\\]+SysWOW64[/\\\\]+WindowsPowerShell[/\\\\]+v1\\.0[/\\\\]+powershell.*"
      OR message RLIKE "(?i).*HostApplication=[A-Z]:[/\\\\]+Windows[/\\\\]+System32[/\\\\]+sdiagnhost\\.exe.*"
      OR message RLIKE "(?i).*HostApplication=[A-Z]:[/\\\\]+Windows[/\\\\]+SysWOW64[/\\\\]+sdiagnhost\\.exe.*"
      OR message RLIKE "(?i).*HostApplication=powershell.*"
  )
  // Benign vendor hostlarini chiqarib tashlash
  | WHERE NOT (
      message LIKE "*Citrix\\\\ConfigSync\\\\ConfigSync.ps1*"
      OR message LIKE "*HostApplication=C:\\\\Hexnode\\\\Hexnode Agent\\\\Current\\\\HexnodeAgent.exe*"
  )
  // Vaqt konteksti
  | EVAL hour_of_day    = DATE_EXTRACT("HOUR_OF_DAY", @timestamp)
  | EVAL is_after_hours = CASE(hour_of_day < 7 OR hour_of_day > 20, 1, 0)
  | STATS
      event_count      = COUNT(*),
      users            = VALUES(winlog.event_data.SubjectUserName),
      processes        = VALUES(winlog.event_data.ProcessName),
      pipe_ids         = VALUES(winlog.event_data.PipelineId),
      messages         = VALUES(message),
      after_hours_hits = SUM(is_after_hours)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(20 minutes, @timestamp)
  | WHERE event_count >= 1
  | EVAL risk_score = event_count * 25 + after_hours_hits * 20
  | WHERE risk_score >= 25
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      pipe_ids,
      messages,
      after_hours_hits,
      risk_score
  | SORT risk_score DESC
enabled: true
tags:
  - attack.execution
  - attack.t1059.001
  - detection.threat-hunting
severity: medium
risk_score: 50
references:
  - "https://threathunterplaybook.com/hunts/windows/190815-RemoteServiceInstallation/notebook.html"
nist: ["AU-6", "SI-4"]
pci_dss: ["10.2"]
mitre_attack:
  TA0002:
    T1059: ["T1059.001"]
