rule_id: b135d0d7-840f-4207-818b-37d25443537c
name: "Scheduled Task Created - FileCreation"
description: |
  Detects creation of Scheduled Tasks via file creation in Windows task folders:
  \Windows\System32\Tasks\, \Windows\SysWOW64\Tasks\, or \Windows\Tasks\.
  Attackers commonly create scheduled tasks for execution, persistence, and privilege escalation.
  False positives: Normal Windows/admin behavior. Use as hunting baseline and correlate with task content,
  creator process, and unusual timing/user context.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  // Task folder ichida fayl yaratilishini aniqlash
  | EVAL p = COALESCE(winlog.event_data.FileNameBuffer, "")
  | WHERE p LIKE "*:\\\\Windows\\\\System32\\\\Tasks\\\\*"
      OR p LIKE "*:\\\\Windows\\\\SysWOW64\\\\Tasks\\\\*"
      OR p LIKE "*:\\\\Windows\\\\Tasks\\\\*"
  // Tizim processlarini chiqarib tashlash
  | WHERE NOT (
      COALESCE(winlog.event_data.ProcessName, "") RLIKE "(?i)^C:\\\\Windows\\\\System32\\\\(svchost|taskeng|taskhostw)\\.exe$"
  )
  | STATS
      event_count  = COUNT(*),
      users        = VALUES(winlog.event_data.TargetUserName),
      processes    = VALUES(winlog.event_data.ProcessName),
      parents      = VALUES(winlog.event_data.CallerProcessName),
      file_paths   = VALUES(winlog.event_data.FileNameBuffer),
      messages     = VALUES(message)
  BY
      agent_id,
      host.name,
      bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP
      agent_id,
      bucket,
      host.name,
      event_count,
      users,
      processes,
      parents,
      file_paths,
      messages
  | SORT event_count DESC
enabled: true
tags:
  - attack.execution
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1053.005
  - attack.s0111
  - car.2013-08-001
  - detection.threat-hunting
severity: low
risk_score: 20
references:
  - "https://center-for-threat-informed-defense.github.io/summiting-the-pyramid/analytics/task_scheduling/"
  - "https://posts.specterops.io/abstracting-scheduled-tasks-3b6451f6a1c5"
nist: ["SI-4", "AU-12", "CM-6"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0003:
    T1053: ["T1053.005"]
