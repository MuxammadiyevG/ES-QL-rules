rule_id: 3e5f0e1d-8bf6-4ad7-8505-fe4d215f239a
name_uz: "Zanjir: Linux Shared-Library Preload Hijack — 2-bosqich: Preload o'zgargandan keyin jarayon bajarilishi"
name_ru: "Цепочка: Linux Shared-Library Preload Hijack — Этап 2: Запуск процесса после изменения preload"
name_en: "Chain: Linux Shared-Library Preload Hijack — Stage 2: Process Executed After Preload Change"
description_uz: |
  Linux Shared-Library Preload Hijack zanjiri — 2-bosqich (2 dan).
  Process Executed After Preload Change.
  Oldingi bosqichga (stage 1) bog'langan.
description_ru: |
  Цепочка Linux Shared-Library Preload Hijack — этап 2 (из 2).
  Запуск процесса после изменения preload.
  Связано с предыдущим этапом (stage 1).
description_en: |
  Linux Shared-Library Preload Hijack chain — stage 2 (of 2).
  Process Executed After Preload Change.
  Linked to the previous stage (stage 1).
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-* | WHERE @timestamp >= NOW() - 15 minutes AND event.action == "executed" | EVAL host.name = host.hostname, user.name = COALESCE(user.name, auditd.data.acct), process.command_line = MV_CONCAT(process.args, " ") | KEEP @timestamp, host.name, process.name, process.executable, process.command_line, user.name | LIMIT 500
tags:
  - attack.defense-evasion
  - attack.execution
  - attack.persistence
  - auditd
  - chain
  - correlation
  - linux
severity: critical
risk_score: 87
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host.name
    - process.name
    - process.executable
    - process.command_line
    - user.name
  timeframe_sec: 3600
  escalate_severity: critical
chain:
  enabled: true
  stage: 2
  depends_on_rule_ids:
    - 2435637a-ef31-4edd-af99-e823683bf467
  timeframe_sec: 3600
  correlate_by:
    - host.name
mitre_attack:
  TA0002:
    T1059: ["T1059.004"]
  TA0005:
    T1574: ["T1574.006"]
