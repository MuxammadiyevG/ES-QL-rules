rule_id: 4b590ae5-f575-45df-a005-afdeb5c7a427
name: "Chain: Sensitive API Access After Login (Nginx)"
description: |
  Veb auth brute zanjiri — 3-bosqich.
  Muvaffaqiyatli login'dan keyin o'sha source.ip dan maxfiy API'larga kirish (contract/system/law-enforcement).
  2-bosqichga bog'langan.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-nginx.access-*
query_language: esql
query: |
  FROM logs-nginx.access-*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE source.ip IS NOT NULL AND http.response.status_code < 400
  | EVAL p = TO_LOWER(url.path)
  | WHERE p LIKE "*/api/contract*" OR p LIKE "*/api/system*" OR p LIKE "*law-enforcement*" OR p LIKE "*/api/site-expertise*"
  | KEEP @timestamp, source.ip, url.path, http.request.method, http.response.status_code
  | LIMIT 500
tags:
  - attack.collection
  - attack.t1213
  - web
  - nginx
  - data-access
  - correlation
  - chain
severity: high
risk_score: 80
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - source.ip
  timeframe_sec: 300
  dedup_fields:
    - source.ip
    - url.path
  escalate_severity: critical
chain:
  enabled: true
  stage: 3
  depends_on_rule_ids:
    - 09a3dd70-a261-4cbc-94c3-74af6a4af9b5
  timeframe_sec: 3600
  correlate_by:
    - source.ip
references:
  - "https://attack.mitre.org/techniques/T1213/"
nist: ["AC-4", "SI-4"]
pci_dss: ["10.2.1"]
mitre_attack:
  TA0009:
    T1213: []
