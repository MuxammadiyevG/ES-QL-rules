rule_id: e00a41c2-6aa4-4e7f-a059-9b6fe38f7e3f
name_uz: "Zanjir: Veb login xatoliklari to'lqini (Nginx)"
name_ru: "Цепочка: Всплеск неудачных веб-входов (Nginx)"
name_en: "Chain: Web Login Failure Burst (Nginx)"
description_uz: |
  Veb auth brute zanjiri — 1-bosqich.
  Bitta source.ip dan login/auth endpoint'ga ko'p muvaffaqiyatsiz urinish (401/403).
  Korrelyatsiya source.ip bo'yicha.
description_ru: |
  Цепочка Web auth brute — этап 1.
  Много неудачных попыток (401/403) к login/auth endpoint с одного source.ip.
  Корреляция по source.ip.
description_en: |
  Web auth brute chain — stage 1.
  Many failed attempts (401/403) against the login/auth endpoint from a single source.ip.
  Correlation by source.ip.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-nginx.access-*
query_language: esql
query: |
  FROM logs-nginx.access-*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE source.ip IS NOT NULL AND http.response.status_code IN (401, 403)
  | EVAL p = TO_LOWER(url.path)
  | WHERE p LIKE "*login*" OR p LIKE "*signin*" OR p LIKE "*auth*"
  | KEEP @timestamp, source.ip, url.path, http.request.method, http.response.status_code, user_agent.original
  | LIMIT 500
tags:
  - attack.credential-access
  - attack.t1110
  - web
  - nginx
  - brute-force
  - correlation
  - chain
severity: medium
risk_score: 65
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - source.ip
  frequency: 6
  timeframe_sec: 120
  dedup_fields:
    - source.ip
    - url.path
  ignore_sec: 60
  escalate_severity: high
chain:
  enabled: true
  stage: 1
  timeframe_sec: 3600
  correlate_by:
    - source.ip
references:
  - "https://attack.mitre.org/techniques/T1110/"
nist: ["AC-7", "SI-4"]
pci_dss: ["8.1.6", "6.6"]
mitre_attack:
  TA0006:
    T1110: []
