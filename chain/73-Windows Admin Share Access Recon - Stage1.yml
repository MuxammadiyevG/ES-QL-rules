rule_id: 64d28de7-af7e-4529-a433-030e56f013db
name_uz: "Zanjir: Windows Admin Share Access Recon — 1-bosqich: Admin share'ga kirish to'lqini"
name_ru: "Цепочка: Windows Admin Share Access Recon — Этап 1: Всплеск обращений к административным share"
name_en: "Chain: Windows Admin Share Access Recon — Stage 1: Admin Share Access Burst"
description_uz: |
  Windows Admin Share Access Recon zanjiri — 1-bosqich (2 dan).
  Admin Share Access Burst (C$/ADMIN$).
  FP kamaytirish: IPC$ chiqarib tashlandi — u har bir normal SMB sessiyada (named pipe) ochiladi, recon signali emas.
description_ru: |
  Цепочка Windows Admin Share Access Recon — этап 1 (из 2).
  Всплеск обращений к административным share (C$/ADMIN$).
  Снижение FP: IPC$ исключён — он открывается в каждой нормальной SMB-сессии (named pipe) и не является признаком разведки.
description_en: |
  Windows Admin Share Access Recon chain — stage 1 (of 2).
  Admin Share Access Burst (C$/ADMIN$).
  FP reduction: IPC$ was excluded — it is opened in every normal SMB session (named pipe) and is not a recon signal.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog* | WHERE @timestamp >= NOW() - 15 minutes | WHERE winlog.channel == "Security" AND event.code == "5140" | EVAL share_name = winlog.event_data.ShareName | WHERE (share_name RLIKE ".*C[$]" OR share_name RLIKE ".*ADMIN[$]") AND NOT share_name RLIKE ".*IPC[$]" | EVAL host.name = winlog.computer_name, source.ip = winlog.event_data.IpAddress, user.name = winlog.event_data.SubjectUserName | KEEP host.name, source.ip, user.name, share_name, @timestamp | LIMIT 500
tags:
  - SMB
  - admin-share
  - attack.lateral-movement
  - chain
  - correlation
  - windows
severity: medium
risk_score: 47
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host.name
  frequency: 3
  timeframe_sec: 300
  dedup_fields:
    - source.ip
    - share_name
chain:
  enabled: true
  stage: 1
  timeframe_sec: 3600
  correlate_by:
    - host.name
mitre_attack:
  TA0008:
    T1021: ["T1021.002"]
