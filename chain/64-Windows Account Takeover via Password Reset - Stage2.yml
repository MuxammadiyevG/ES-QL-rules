rule_id: 597a5d24-1a7b-4cb8-bcf9-60de39ae7a95
name: "Chain: Windows Account Takeover via Password Reset — Stage 2: Affected Account Logon After Reset"
description: |
  Windows Account Takeover via Password Reset zanjiri — 2-bosqich (2 dan).
  Affected Account Logon After Reset.
  Oldingi bosqichga (stage 1) bog'langan.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4624"
  | EVAL host.name = winlog.computer_name
  | EVAL user.name = winlog.event_data.TargetUserName
  | EVAL logon_type = winlog.event_data.LogonType
  | EVAL src_ip = winlog.event_data.IpAddress
  | WHERE user.name IS NOT NULL
  | WHERE NOT user.name LIKE "*$"
  | WHERE logon_type IN ("2", "3", "10")
  | KEEP host.name, user.name, logon_type, src_ip, @timestamp
  | LIMIT 500
tags:
  - attack.initial-access
  - attack.t1078
  - chain
  - correlation
  - windows
severity: high
risk_score: 73
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host.name
  frequency: 1
  timeframe_sec: 3600
  dedup_fields:
    - user.name
    - logon_type
    - src_ip
  escalate_severity: high
chain:
  enabled: true
  stage: 2
  depends_on_rule_ids:
    - 8ccab6be-e036-4414-8eb6-e19889d18f33
  timeframe_sec: 3600
  correlate_by:
    - host.name
mitre_attack:
  TA0001:
    T1078: ["T1078.002"]
