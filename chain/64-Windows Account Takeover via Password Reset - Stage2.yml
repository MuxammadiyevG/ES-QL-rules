rule_id: 597a5d24-1a7b-4cb8-bcf9-60de39ae7a95
name_uz: "Zanjir: Windows Account Takeover via Password Reset — 2-bosqich: Reset'dan keyin ta'sirlangan akkaunt logon'i"
name_ru: "Цепочка: Windows Account Takeover via Password Reset — Этап 2: Вход затронутой учётной записи после сброса"
name_en: "Chain: Windows Account Takeover via Password Reset — Stage 2: Affected Account Logon After Reset"
description_uz: |
  Windows Account Takeover via Password Reset zanjiri — 2-bosqich (2 dan).
  Affected Account Logon After Reset.
  Oldingi bosqichga (stage 1) bog'langan — korrelyatsiya user.name (reset qilingan akkaunt login qiladi) bo'yicha.
description_ru: |
  Цепочка Windows Account Takeover via Password Reset — этап 2 (из 2).
  Вход затронутой учётной записи после сброса.
  Связано с предыдущим этапом (stage 1) — корреляция по user.name (учётная запись со сброшенным паролем выполняет вход).
description_en: |
  Windows Account Takeover via Password Reset chain — stage 2 (of 2).
  Affected Account Logon After Reset.
  Linked to the previous stage (stage 1) — correlation by user.name (the reset account logs in).
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4624"
  | EVAL host.name = winlog.computer_name
  | EVAL user.name = winlog.event_data.TargetUserName
  | EVAL logon_type = winlog.event_data.LogonType
  | EVAL src_ip = winlog.event_data.IpAddress
  | WHERE user.name IS NOT NULL
  | WHERE NOT user.name LIKE "*$"
  | WHERE logon_type IN ("2", "3", "10")
  | KEEP host.name, user.name, logon_type, src_ip, @timestamp
  | LIMIT 500
tags:
  - attack.initial-access
  - attack.t1078
  - chain
  - correlation
  - windows
severity: high
risk_score: 73
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host.name
  frequency: 1
  timeframe_sec: 3600
  dedup_fields:
    - user.name
    - logon_type
    - src_ip
  escalate_severity: high
chain:
  enabled: true
  stage: 2
  depends_on_rule_ids:
    - 8ccab6be-e036-4414-8eb6-e19889d18f33
  timeframe_sec: 3600
  correlate_by:
    - user.name
mitre_attack:
  TA0001:
    T1078: ["T1078.002"]
