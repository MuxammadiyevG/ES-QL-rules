rule_id: 6acdfa77-44de-447b-9d10-128500013d95
name_uz: "Zanjir: Windows Process Injection — 1-bosqich: CreateRemoteThread aniqlandi"
name_ru: "Цепочка: Windows Process Injection — Этап 1: Обнаружен CreateRemoteThread"
name_en: "Chain: Windows Process Injection — Stage 1: CreateRemoteThread Detected"
description_uz: |
  Windows Process Injection zanjiri — 1-bosqich (2 dan).
  CreateRemoteThread Detected.
description_ru: |
  Цепочка Windows Process Injection — этап 1 (из 2).
  Обнаружен CreateRemoteThread.
description_en: |
  Windows Process Injection chain — stage 1 (of 2).
  CreateRemoteThread Detected.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog* | WHERE @timestamp >= NOW() - 15 minutes AND winlog.channel == "Microsoft-Windows-Sysmon/Operational" AND event.code == "8" | EVAL host_name = winlog.computer_name, source_image = winlog.event_data.SourceImage, target_image = winlog.event_data.TargetImage, new_thread_id = winlog.event_data.NewThreadId, si_l = TO_LOWER(COALESCE(winlog.event_data.SourceImage, "-")), ti_l = TO_LOWER(COALESCE(winlog.event_data.TargetImage, "-")) | WHERE NOT (si_l RLIKE ".*dwm[.]exe" AND ti_l RLIKE ".*csrss[.]exe") | KEEP host_name, source_image, target_image, new_thread_id, @timestamp | LIMIT 500
tags:
  - attack.defense_evasion
  - attack.privilege_escalation
  - chain
  - correlation
  - sysmon
  - windows
severity: medium
risk_score: 47
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host_name
  timeframe_sec: 1800
chain:
  enabled: true
  stage: 1
  timeframe_sec: 3600
  correlate_by:
    - host_name
mitre_attack:
  TA0005:
    T1055: ["T1055.003"]
