rule_id: 96f9c889-cfcb-4aba-9802-e26707f918c1
name_uz: "Zanjir: Windows Credential Dumping — 2-bosqich: Dump'dan keyin imtiyozli yoki tarmoq logon'i"
name_ru: "Цепочка: Windows Credential Dumping — Этап 2: Привилегированный или сетевой вход после дампа"
name_en: "Chain: Windows Credential Dumping — Stage 2: Privileged or Network Logon Post-Dump"
description_uz: |
  Windows Credential Dumping zanjiri — 2-bosqich (2 dan).
  Privileged or Network Logon Post-Dump.
  Oldingi bosqichga (stage 1) bog'langan.
description_ru: |
  Цепочка Windows Credential Dumping — этап 2 (из 2).
  Привилегированный или сетевой вход после дампа.
  Связано с предыдущим этапом (stage 1).
description_en: |
  Windows Credential Dumping chain — stage 2 (of 2).
  Privileged or Network Logon Post-Dump.
  Linked to the previous stage (stage 1).
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code IN ("4672", "4624")
  | EVAL host.name = winlog.computer_name
  | EVAL user.name = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.TargetUserName, "-")
  | EVAL logon_type = COALESCE(winlog.event_data.LogonType, "")
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, "-")
  | EVAL priv_list = COALESCE(winlog.event_data.PrivilegeList, "")
  | WHERE user.name IS NOT NULL AND NOT user.name LIKE "*$"
  | WHERE (event.code == "4672") OR (event.code == "4624" AND logon_type IN ("3"))
  | KEEP @timestamp, agent_id, host.name, user.name, logon_type, src_ip, priv_list, event.code
  | LIMIT 500
tags:
  - attack.credential-access
  - attack.lateral-movement
  - attack.t1003.001
  - attack.t1078
  - chain
  - correlation
  - privileged-logon
  - windows
severity: critical
risk_score: 95
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host.name
  timeframe_sec: 3600
  dedup_fields:
    - host.name
    - user.name
  escalate_severity: critical
chain:
  enabled: true
  stage: 2
  depends_on_rule_ids:
    - 8189dabf-bba1-40bd-a6a2-7281738d9e15
  timeframe_sec: 3600
  correlate_by:
    - host.name
mitre_attack:
  TA0001:
    T1078: []
  TA0006:
    T1003: ["T1003.001"]
