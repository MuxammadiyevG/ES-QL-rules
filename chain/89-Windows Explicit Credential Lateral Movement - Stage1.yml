rule_id: fbb8a929-97ac-4689-8d09-df2bd387e7ed
name: "Chain: Windows Explicit Credential Lateral Movement — Stage 1: Explicit Credential Use (RunAs / Pass-the-Cred)"
description: |
  Windows Explicit Credential Lateral Movement zanjiri — 1-bosqich (2 dan).
  Explicit Credential Use (RunAs / Pass-the-Cred).
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog* | WHERE @timestamp >= NOW() - 15 minutes | WHERE winlog.channel == "Security" AND event.code == "4648" | EVAL actor = winlog.event_data.SubjectUserName, target_user = winlog.event_data.TargetUserName, target_host = winlog.event_data.TargetServerName, host.name = winlog.computer_name | WHERE NOT actor LIKE "*$" | KEEP host.name, actor, target_user, target_host | LIMIT 500
tags:
  - attack.lateral-movement
  - chain
  - correlation
  - explicit-credentials
  - lateral-movement
  - windows
severity: medium
risk_score: 47
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host.name
  frequency: 1
  timeframe_sec: 900
  dedup_fields:
    - actor
    - target_user
    - target_host
chain:
  enabled: true
  stage: 1
  timeframe_sec: 3600
  correlate_by:
    - host.name
mitre_attack:
  TA0008:
    T1021: []
    T1550: ["T1550.002"]
