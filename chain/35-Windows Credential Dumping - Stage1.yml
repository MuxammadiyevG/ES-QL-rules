rule_id: 8189dabf-bba1-40bd-a6a2-7281738d9e15
name: "Chain: Windows Credential Dumping — Stage 1: LSASS Dump Tooling"
description: |
  Windows Credential Dumping zanjiri — 1-bosqich (2 dan).
  LSASS Dump Tooling.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational" AND event.code == "1"
  | EVAL cmd = TO_LOWER(COALESCE(winlog.event_data.CommandLine, "-"))
  | EVAL img = TO_LOWER(COALESCE(winlog.event_data.Image, "-"))
  | EVAL host.name = winlog.computer_name
  | WHERE cmd RLIKE ".*(procdump.*lsass|lsass.*procdump|comsvcs.*minidump|rundll32.*comsvcs|rundll32.*minidump|sqldumper.*lsass|out-minidump|nanodump|mimikatz|sekurlsa).*"
      OR (cmd RLIKE ".*lsass.*" AND img RLIKE ".*(procdump|createdump)[.]exe.*")
  | KEEP @timestamp, agent_id, host.name, winlog.computer_name, cmd, img, event.code
  | LIMIT 500
tags:
  - attack.credential-access
  - attack.t1003.001
  - chain
  - correlation
  - lsass
  - mimikatz
  - sysmon
  - windows
severity: high
risk_score: 80
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host.name
  timeframe_sec: 900
  dedup_fields:
    - host.name
    - cmd
chain:
  enabled: true
  stage: 1
  timeframe_sec: 3600
  correlate_by:
    - host.name
mitre_attack:
  TA0006:
    T1003: ["T1003.001"]
