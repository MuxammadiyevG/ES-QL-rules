rule_id: 985e7df6-b288-486c-95b5-02b7282319de
name: "Chain: Linux Reverse Shell — Stage 2: Post-Exploitation Activity on Same Host"
description: |
  Linux Reverse Shell zanjiri — 2-bosqich (2 dan).
  Post-Exploitation Activity on Same Host.
  Oldingi bosqichga (stage 1) bog'langan.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-* | WHERE @timestamp >= NOW() - 15 minutes | WHERE event.action == "executed" | EVAL cmd_line = MV_CONCAT(process.args, " ") | EVAL cmd_low = TO_LOWER(cmd_line) | WHERE process.name IN ("id", "whoami", "uname") OR process.name IN ("useradd", "adduser") OR (process.name IN ("wget", "curl") AND cmd_low RLIKE ".*(http|ftp)://[0-9].*") OR (process.name == "chmod" AND cmd_low RLIKE ".*(4755|4777|777).*") | EVAL host_name = host.hostname, user_name = COALESCE(user.name, auditd.data.acct) | KEEP @timestamp, event.action, process.name, process.executable, cmd_line, host_name, user_name | LIMIT 500
tags:
  - attack.discovery
  - attack.privilege-escalation
  - attack.t1059.004
  - auditd
  - chain
  - correlation
  - linux
severity: critical
risk_score: 99
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - event.action
    - process.name
    - cmd_line
    - host_name
  timeframe_sec: 3600
  dedup_fields:
    - process.name
  escalate_severity: critical
chain:
  enabled: true
  stage: 2
  depends_on_rule_ids:
    - b5073576-a7f0-439a-837b-719f5884cfd3
  timeframe_sec: 3600
  correlate_by:
    - host_name
mitre_attack:
  TA0003:
    T1136: ["T1136.001"]
  TA0007:
    T1033: []
    T1057: []
    T1082: []
