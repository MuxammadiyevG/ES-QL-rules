rule_id: 1c53e95b-fdf1-4ecd-ad0d-1f5fb3408ba3
name: "Chain: Linux Defense Evasion: Log Clearing Followed by Firewall Flush — Stage 1: Log or Shell History Cleared"
description: |
  Linux Defense Evasion: Log Clearing Followed by Firewall Flush zanjiri — 1-bosqich (2 dan).
  Log or Shell History Cleared.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-* | WHERE @timestamp >= NOW() - 15 minutes | WHERE event.action == "executed" | WHERE process.name IN ("rm", "truncate", "shred") | EVAL args_str = MV_CONCAT(process.args, " ") | WHERE args_str RLIKE ".*var/log.*" OR args_str RLIKE ".*bash_history.*" | EVAL host.name = host.hostname, cmd_args = args_str | KEEP host.name, process.name, cmd_args, user.name, @timestamp | LIMIT 500
tags:
  - attack.defense_evasion
  - auditd
  - chain
  - correlation
  - defense-evasion
  - linux
severity: medium
risk_score: 47
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host.name
    - process.name
    - cmd_args
    - user.name
  timeframe_sec: 3600
chain:
  enabled: true
  stage: 1
  timeframe_sec: 3600
  correlate_by:
    - host.name
mitre_attack:
  TA0005:
    T1070: ["T1070.002", "T1070.003"]
