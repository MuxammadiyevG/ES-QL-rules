rule_id: ad9151e5-5485-4371-a010-0acc4d5bbe36
name: "Chain: Windows Sensitive Privilege Abuse — Stage 2: Sensitive Privileged Operation by Same Account"
description: |
  Windows Sensitive Privilege Abuse zanjiri — 2-bosqich (2 dan).
  Sensitive Privileged Operation by Same Account.
  Oldingi bosqichga (stage 1) bog'langan.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog* | WHERE @timestamp >= NOW() - 15 minutes AND winlog.channel == "Security" AND (event.code == "4673" OR event.code == "4674") AND winlog.event_data.SubjectUserSid != "S-1-5-18" AND NOT winlog.event_data.SubjectUserName LIKE "*$" | EVAL user.name = winlog.event_data.SubjectUserName, host.name = winlog.computer_name, privilege_list = winlog.event_data.PrivilegeList, object_server = winlog.event_data.ObjectServer | KEEP @timestamp, `user.name`, `host.name`, privilege_list, object_server | LIMIT 500
tags:
  - attack.defense-evasion
  - attack.privilege-escalation
  - chain
  - correlation
  - security-4673
  - security-4674
  - windows
  - winlog
severity: high
risk_score: 73
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - user.name
    - host.name
  timeframe_sec: 3600
  escalate_severity: critical
chain:
  enabled: true
  stage: 2
  depends_on_rule_ids:
    - 841fedcc-77d0-43a6-8825-fb7519b95c6a
  timeframe_sec: 3600
  correlate_by:
    - user.name
mitre_attack:
  TA0004:
    T1134: ["T1134.001"]
