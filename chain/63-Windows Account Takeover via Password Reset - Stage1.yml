rule_id: 8ccab6be-e036-4414-8eb6-e19889d18f33
name_uz: "Zanjir: Windows Account Takeover via Password Reset — 1-bosqich: Admin paroli reset qilindi yoki akkaunt o'zgartirildi"
name_ru: "Цепочка: Windows Account Takeover via Password Reset — Этап 1: Сброс пароля администратора или изменение учётной записи"
name_en: "Chain: Windows Account Takeover via Password Reset — Stage 1: Admin Password Reset or Account Modified"
description_uz: |
  Windows Account Takeover via Password Reset zanjiri — 1-bosqich (2 dan).
  Admin Password Reset (4724).
  FP kamaytirish: 4738 (account changed) olib tashlandi — u ko'p benign atribut o'zgarishlarida ishlaydi; zanjir intent'i parol reset (4724).
  Korrelyatsiya tuzatildi: chain endi RESET QILINGAN AKKAUNT (user.name=target_user) bo'yicha bog'lanadi, host.name emas — shunda "X akkaunt paroli reset qilindi → X login qildi" aniqlanadi (DC dagi har qanday reset+login emas).
description_ru: |
  Цепочка Windows Account Takeover via Password Reset — этап 1 (из 2).
  Сброс пароля администратора (4724).
  Снижение FP: 4738 (account changed) удалён — он срабатывает на множестве безобидных изменений атрибутов; цель цепочки — сброс пароля (4724).
  Корреляция исправлена: цепочка теперь связывается по СБРОШЕННОЙ УЧЁТНОЙ ЗАПИСИ (user.name=target_user), а не по host.name — благодаря чему выявляется "пароль учётной записи X сброшен → X выполнил вход" (а не любой сброс+вход на DC).
description_en: |
  Windows Account Takeover via Password Reset chain — stage 1 (of 2).
  Admin Password Reset (4724).
  FP reduction: 4738 (account changed) was removed — it fires on many benign attribute changes; the chain's intent is password reset (4724).
  Correlation fixed: the chain now links by the RESET ACCOUNT (user.name=target_user), not host.name — so that "account X's password was reset → X logged in" is detected (not any reset+logon on the DC).
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4724"
  | EVAL host.name = winlog.computer_name
  | EVAL actor = winlog.event_data.SubjectUserName
  | EVAL target_user = winlog.event_data.TargetUserName
  | WHERE actor IS NOT NULL
  | WHERE NOT actor LIKE "*$"
  | WHERE actor != "ANONYMOUS LOGON" AND actor != "АНОНИМНЫЙ ВХОД"
  | WHERE target_user IS NOT NULL
  | WHERE NOT target_user LIKE "*$"
  | EVAL event_type = "password_reset"
  | EVAL user.name = target_user
  | KEEP host.name, actor, target_user, user.name, event_type, @timestamp
  | LIMIT 500
tags:
  - attack.credential-access
  - attack.t1098
  - chain
  - correlation
  - windows
severity: medium
risk_score: 47
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host.name
  frequency: 1
  timeframe_sec: 3600
  dedup_fields:
    - target_user
    - event_type
chain:
  enabled: true
  stage: 1
  timeframe_sec: 3600
  correlate_by:
    - user.name
mitre_attack:
  TA0003:
    T1098: []
  TA0040:
    T1531: []
