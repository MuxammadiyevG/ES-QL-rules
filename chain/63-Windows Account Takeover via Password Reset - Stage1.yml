rule_id: 8ccab6be-e036-4414-8eb6-e19889d18f33
name: "Chain: Windows Account Takeover via Password Reset — Stage 1: Admin Password Reset or Account Modified"
description: |
  Windows Account Takeover via Password Reset zanjiri — 1-bosqich (2 dan).
  Admin Password Reset or Account Modified.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code IN ("4724", "4738")
  | EVAL host.name = winlog.computer_name
  | EVAL actor = winlog.event_data.SubjectUserName
  | EVAL target_user = winlog.event_data.TargetUserName
  | WHERE actor IS NOT NULL
  | WHERE NOT actor LIKE "*$"
  | WHERE actor != "ANONYMOUS LOGON" AND actor != "АНОНИМНЫЙ ВХОД"
  | WHERE target_user IS NOT NULL
  | WHERE NOT target_user LIKE "*$"
  | EVAL event_type = CASE(event.code == "4724", "password_reset", "account_modified")
  | KEEP host.name, actor, target_user, event_type, @timestamp
  | LIMIT 500
tags:
  - attack.credential-access
  - attack.t1098
  - chain
  - correlation
  - windows
severity: medium
risk_score: 47
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host.name
  frequency: 1
  timeframe_sec: 3600
  dedup_fields:
    - target_user
    - event_type
chain:
  enabled: true
  stage: 1
  timeframe_sec: 3600
  correlate_by:
    - host.name
mitre_attack:
  TA0006:
    T1098: []
    T1531: []
