rule_id: 229b4d21-b7f3-4c1e-a010-ef02862b44ba
name_uz: "Zanjir: Linux Credential Access via Shadow File — 2-bosqich: Credential fayl nusxalash yoki eksfiltratsiya"
name_ru: "Цепочка: Linux Credential Access via Shadow File — Этап 2: Копирование или эксфильтрация файла с учётными данными"
name_en: "Chain: Linux Credential Access via Shadow File — Stage 2: Credential File Copy or Exfil"
description_uz: |
  Linux Credential Access via Shadow File zanjiri — 2-bosqich (2 dan).
  Credential File Copy or Exfil.
  Oldingi bosqichga (stage 1) bog'langan.
description_ru: |
  Цепочка Linux Credential Access via Shadow File — этап 2 (из 2).
  Копирование или эксфильтрация файла с учётными данными.
  Связано с предыдущим этапом (stage 1).
description_en: |
  Linux Credential Access via Shadow File chain — stage 2 (of 2).
  Credential File Copy or Exfil.
  Linked to the previous stage (stage 1).
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-* | WHERE @timestamp >= NOW() - 15 minutes | WHERE event.action == "executed" | WHERE process.name RLIKE ".*(cat|cp|scp|curl|tar|dd|base64|nc|ncat|socat|python|ruby|perl|wget|rsync).*" AND MV_CONCAT(process.args, " ") RLIKE ".*/etc/(shadow|gshadow).*" | EVAL host_name = host.name, cmd_line = MV_CONCAT(process.args, " ") | KEEP host_name, user.name, process.name, process.executable, cmd_line, @timestamp | SORT @timestamp DESC | LIMIT 500
tags:
  - attack.credential-access
  - attack.exfiltration
  - auditd
  - chain
  - correlation
  - linux
severity: high
risk_score: 80
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host_name
    - user.name
    - process.name
    - cmd_line
  frequency: 1
  timeframe_sec: 3600
  escalate_severity: critical
chain:
  enabled: true
  stage: 2
  depends_on_rule_ids:
    - e8e2e4a6-8011-48c5-8aeb-df3c362a82a4
  timeframe_sec: 3600
  correlate_by:
    - host_name
mitre_attack:
  TA0006:
    T1003: ["T1003.008"]
  TA0010:
    T1052: []
