rule_id: 1f9bffe6-3ff2-4993-97a7-e544531d506b
name: "Chain: Windows Password Spray — Stage 2: Successful Logon After Spray"
description: |
  Windows Password Spray zanjiri — 2-bosqich (2 dan).
  Successful Logon After Spray.
  Oldingi bosqichga (stage 1) bog'langan.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog* | WHERE @timestamp >= NOW() - 15 minutes AND event.code == "4624" AND winlog.channel == "Security" AND winlog.event_data.LogonType IN ("2","3","10") AND winlog.event_data.TargetUserName IS NOT NULL AND NOT winlog.event_data.TargetUserName LIKE "*$" AND winlog.event_data.IpAddress IS NOT NULL AND winlog.event_data.IpAddress != "-" AND winlog.event_data.IpAddress != "::1" AND winlog.event_data.IpAddress != "127.0.0.1" | EVAL source_ip = winlog.event_data.IpAddress, `user.name` = winlog.event_data.TargetUserName, `host.name` = winlog.computer_name, logon_type = winlog.event_data.LogonType | KEEP source_ip, `user.name`, `host.name`, logon_type | LIMIT 500
tags:
  - attack.credential_access
  - attack.initial_access
  - chain
  - correlation
  - password_spray
  - windows
severity: high
risk_score: 75
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host.name
  timeframe_sec: 3600
  check_diff: true
  escalate_severity: critical
chain:
  enabled: true
  stage: 2
  depends_on_rule_ids:
    - 0094bd6e-aaa3-457b-9672-c7c1c513248c
  timeframe_sec: 3600
  correlate_by:
    - host.name
mitre_attack:
  TA0006:
    T1110: ["T1110.003"]
    T1078: []
