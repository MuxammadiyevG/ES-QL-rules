rule_id: 088454aa-9c78-462a-b3d1-e8bdda0d1dee
name_uz: "Zanjir: Windows audit siyosatini buzish, so'ng imtiyozli faoliyat — 1-bosqich: audit siyosati manbasini manipulyatsiya qilish"
name_ru: "Цепочка: подмена политики аудита Windows, затем привилегированная активность — Этап 1: манипуляция источником политики аудита"
name_en: "Chain: Windows Audit Policy Tampering then Privileged Activity — Stage 1: Audit Policy Source Manipulation"
description_uz: |
  Windows Audit Policy Tampering then Privileged Activity zanjiri — 1-bosqich (2 dan).
  Audit Policy Source Manipulation.
description_ru: |
  Цепочка подмены политики аудита Windows с последующей привилегированной активностью — Этап 1 (из 2).
  Манипуляция источником политики аудита.
description_en: |
  Windows Audit Policy Tampering then Privileged Activity chain — Stage 1 (of 2).
  Audit Policy Source Manipulation.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog* | WHERE @timestamp >= NOW() - 15 minutes | WHERE winlog.channel == "Security" AND event.code IN ("4719", "4904", "4905") | EVAL host_name = winlog.computer_name, user_name = winlog.event_data.SubjectUserName, event_action = event.code | WHERE user_name IS NULL OR NOT user_name LIKE "*$" | KEEP @timestamp, event.code, event_action, host_name, user_name, winlog.channel | LIMIT 500
tags:
  - attack.defense-evasion
  - audit-policy-tampering
  - chain
  - correlation
  - windows
  - winlog
severity: medium
risk_score: 47
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host_name
    - winlog.channel
  timeframe_sec: 3600
  dedup_fields:
    - host_name
    - event.code
chain:
  enabled: true
  stage: 1
  timeframe_sec: 3600
  correlate_by:
    - host_name
mitre_attack:
  TA0005:
    T1562: ["T1562.002"]
