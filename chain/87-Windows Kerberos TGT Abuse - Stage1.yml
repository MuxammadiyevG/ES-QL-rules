rule_id: cc65a0a9-d67a-4a4c-bc34-edf5cbff51e0
name_uz: "Zanjir: Windows Kerberos TGT suiiste'moli — 1-bosqich: Kerberos TGT enumeratsiya seriyasi"
name_ru: "Цепочка: злоупотребление Kerberos TGT в Windows — Этап 1: всплеск перечисления Kerberos TGT"
name_en: "Chain: Windows Kerberos TGT Abuse — Stage 1: Kerberos TGT Enumeration Burst"
description_uz: |
  Windows Kerberos TGT Abuse zanjiri — 1-bosqich (2 dan).
  Kerberos TGT Enumeration Burst — kuchsiz shifrlash (RC4/DES) bilan.
  FP kamaytirish: normal AD AES (0x12) ishlatadi; faqat downgrade (RC4 0x17 / DES) TGT so'rovlari olinadi, bu kerberoast/overpass-the-hash signali.
description_ru: |
  Цепочка злоупотребления Kerberos TGT в Windows — Этап 1 (из 2).
  Всплеск перечисления Kerberos TGT — со слабым шифрованием (RC4/DES).
  Снижение FP: обычный AD использует AES (0x12); берутся только TGT-запросы с понижением шифрования (RC4 0x17 / DES), что является признаком kerberoast/overpass-the-hash.
description_en: |
  Windows Kerberos TGT Abuse chain — Stage 1 (of 2).
  Kerberos TGT Enumeration Burst — with weak encryption (RC4/DES).
  FP reduction: normal AD uses AES (0x12); only downgraded (RC4 0x17 / DES) TGT requests are taken, which is a kerberoast/overpass-the-hash signal.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog* | WHERE @timestamp >= NOW() - 15 minutes | WHERE winlog.channel == "Security" | WHERE event.code == "4768" | WHERE winlog.event_data.IpAddress IS NOT NULL | WHERE NOT winlog.event_data.IpAddress == "::1" | WHERE NOT winlog.event_data.TargetUserName LIKE "*$" | EVAL host.name = winlog.computer_name, user.name = winlog.event_data.TargetUserName, src.ip = winlog.event_data.IpAddress, ticket_enc_type = winlog.event_data.TicketEncryptionType | WHERE ticket_enc_type IN ("0x17", "0x18", "0x1", "0x3") | KEEP @timestamp, `host.name`, `user.name`, `src.ip`, ticket_enc_type | LIMIT 1000
tags:
  - attack.credential_access
  - attack.discovery
  - chain
  - correlation
  - kerberos
  - windows
severity: medium
risk_score: 47
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host.name
    - src.ip
  different_field: user.name
  frequency: 5
  timeframe_sec: 300
  dedup_fields:
    - user.name
    - src.ip
chain:
  enabled: true
  stage: 1
  timeframe_sec: 3600
  correlate_by:
    - host.name
mitre_attack:
  TA0006:
    T1558: ["T1558.001"]
