rule_id: cc65a0a9-d67a-4a4c-bc34-edf5cbff51e0
name: "Chain: Windows Kerberos TGT Abuse — Stage 1: Kerberos TGT Enumeration Burst"
description: |
  Windows Kerberos TGT Abuse zanjiri — 1-bosqich (2 dan).
  Kerberos TGT Enumeration Burst.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog* | WHERE @timestamp >= NOW() - 15 minutes | WHERE winlog.channel == "Security" | WHERE event.code == "4768" | WHERE winlog.event_data.IpAddress IS NOT NULL | WHERE NOT winlog.event_data.IpAddress == "::1" | WHERE NOT winlog.event_data.TargetUserName LIKE "*$" | EVAL host.name = winlog.computer_name, user.name = winlog.event_data.TargetUserName, src.ip = winlog.event_data.IpAddress, ticket_enc_type = winlog.event_data.TicketEncryptionType | KEEP @timestamp, `host.name`, `user.name`, `src.ip`, ticket_enc_type | LIMIT 1000
tags:
  - attack.credential_access
  - attack.discovery
  - chain
  - correlation
  - kerberos
  - windows
severity: medium
risk_score: 47
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host.name
    - src.ip
  different_field: user.name
  frequency: 5
  timeframe_sec: 300
  dedup_fields:
    - user.name
    - src.ip
chain:
  enabled: true
  stage: 1
  timeframe_sec: 3600
  correlate_by:
    - host.name
mitre_attack:
  TA0006:
    T1558: ["T1558.001"]
