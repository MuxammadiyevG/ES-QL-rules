rule_id: 09a3dd70-a261-4cbc-94c3-74af6a4af9b5
name: "Chain: Web Login Success After Brute Force (Nginx)"
description: |
  Veb auth brute zanjiri — 2-bosqich.
  Muvaffaqiyatsiz urinishlardan keyin o'sha source.ip dan muvaffaqiyatli login (200/201).
  1-bosqichga bog'langan.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-nginx.access-*
query_language: esql
query: |
  FROM logs-nginx.access-*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE source.ip IS NOT NULL AND http.response.status_code IN (200, 201)
  | EVAL p = TO_LOWER(url.path)
  | WHERE p LIKE "*login*" OR p LIKE "*signin*" OR p LIKE "*auth*"
  | KEEP @timestamp, source.ip, url.path, http.request.method, http.response.status_code, user_agent.original
  | LIMIT 500
tags:
  - attack.credential-access
  - attack.initial-access
  - attack.t1078
  - web
  - nginx
  - brute-success
  - correlation
  - chain
severity: high
risk_score: 85
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - source.ip
  timeframe_sec: 300
  dedup_fields:
    - source.ip
  ignore_sec: 120
  escalate_severity: critical
chain:
  enabled: true
  stage: 2
  depends_on_rule_ids:
    - e00a41c2-6aa4-4e7f-a059-9b6fe38f7e3f
  timeframe_sec: 3600
  correlate_by:
    - source.ip
references:
  - "https://attack.mitre.org/techniques/T1078/"
nist: ["AC-7"]
pci_dss: ["8.1.6"]
mitre_attack:
  TA0001:
    T1078: []
