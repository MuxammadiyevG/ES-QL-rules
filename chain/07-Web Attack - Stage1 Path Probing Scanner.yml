rule_id: 1dea38dd-09b2-48db-9709-7448009fc1fc
name_uz: "Zanjir: Veb path probing / skaner (Nginx)"
name_ru: "Цепочка: Зондирование веб-путей / сканер (Nginx)"
name_en: "Chain: Web Path Probing / Scanner (Nginx)"
description_uz: |
  Veb hujum zanjiri — 1-bosqich.
  Bitta source.ip qisqa vaqtda ko'p turli url.path ga XATO (4xx) javob olsa (scanner/recon path enumeration).
  Korrelyatsiya dvigateli source.ip bo'yicha url.path noyobligini hisoblaydi (different_field).
  FP kamaytirish: status_code >= 400 sharti normal browsing'ni (200/30x) chiqarib tashlaydi; faqat probing qoladi.
description_ru: |
  Цепочка веб-атаки — этап 1.
  Если один source.ip за короткое время получает ОШИБОЧНЫЕ (4xx) ответы по множеству разных url.path (scanner/recon path enumeration).
  Корреляционный движок считает уникальность url.path по source.ip (different_field).
  Снижение FP: условие status_code >= 400 исключает нормальный browsing (200/30x); остаётся только probing.
description_en: |
  Web attack chain — stage 1.
  When a single source.ip receives ERROR (4xx) responses for many different url.path values within a short time (scanner/recon path enumeration).
  The correlation engine counts url.path uniqueness by source.ip (different_field).
  FP reduction: the status_code >= 400 condition excludes normal browsing (200/30x); only probing remains.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-nginx.access-*
query_language: esql
query: |
  FROM logs-nginx.access-*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE source.ip IS NOT NULL AND url.path IS NOT NULL
  | WHERE http.response.status_code >= 400 AND http.response.status_code <= 451
  | KEEP @timestamp, source.ip, url.path, http.request.method, http.response.status_code, user_agent.original
  | LIMIT 1000
tags:
  - attack.reconnaissance
  - attack.t1595
  - web
  - nginx
  - scanner
  - correlation
  - chain
severity: medium
risk_score: 65
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - source.ip
  different_field: url.path
  frequency: 15
  timeframe_sec: 120
  dedup_fields:
    - source.ip
    - url.path
  ignore_sec: 30
  escalate_severity: high
chain:
  enabled: true
  stage: 1
  timeframe_sec: 3600
  correlate_by:
    - source.ip
references:
  - "https://attack.mitre.org/techniques/T1595/"
nist: ["SI-4", "SC-7"]
pci_dss: ["6.6", "11.4"]
mitre_attack:
  TA0043:
    T1595: []
