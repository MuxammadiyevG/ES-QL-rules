rule_id: de1963d9-7b68-4aa8-bd3e-fe2f465f29bd
name_uz: "Endpoint: offensive-security tool yoki malware ishga tushishi (standalone)"
name_ru: "Endpoint: запуск offensive security tool / вредоносного ПО (standalone)"
name_en: "Endpoint: Offensive Security Tool / Malware Execution (standalone)"
description_uz: |
  Endpoint'da offensive-security tool yoki malware ishga tushishi
  (mimikatz, rubeus, bloodhound, crackmapexec, procdump, cobalt, pwdump, lazagne;
  nmap, masscan, nikto, hydra, hashcat, sqlmap, linpeas, pspy, chisel).
  STANDALONE qilindi: avval bu "ESET threat → endpoint process" cross-source zanjirning 2-bosqichi edi,
  lekin ESET monitoring hostlari (ydenilyuk/badilov/aqoriyev/...) Windows+auditd hostlaridan
  (WINDC22/DESKTOP-Q4KDUEJ/siem/vision) BUTUNLAY AJRALGAN — ESET endpointlari bu clusterga Sysmon/auditd
  yubormaydi, shuning uchun zanjir host.name bo'yicha hech qachon korrelyatsiya qila olmasdi (hech qachon
  ishlamasdi). Endi mustaqil yuqori-ishonchli detection sifatida ishlaydi.
  FP kamaytirish: keng "temp/downloads/tmp dan ishga tushish" catch-all va dual-use vssadmin olib tashlandi;
  faqat aniq offensive-tool imzolari qoldi.
description_ru: |
  Запуск offensive-security инструмента или вредоносного ПО на endpoint
  (mimikatz, rubeus, bloodhound, crackmapexec, procdump, cobalt, pwdump, lazagne;
  nmap, masscan, nikto, hydra, hashcat, sqlmap, linpeas, pspy, chisel).
  СДЕЛАНО STANDALONE: раньше это был Этап 2 cross-source цепочки "ESET threat → endpoint process",
  но хосты мониторинга ESET (ydenilyuk/badilov/aqoriyev/...) ПОЛНОСТЬЮ ОТДЕЛЕНЫ от хостов Windows+auditd
  (WINDC22/DESKTOP-Q4KDUEJ/siem/vision) — endpoint-ы ESET не отправляют Sysmon/auditd
  в этот кластер, поэтому цепочка никогда не могла коррелировать по host.name (она никогда
  не работала). Теперь она работает как самостоятельная детекция с высокой достоверностью.
  Снижение FP: убраны широкий catch-all "запуск из temp/downloads/tmp" и dual-use vssadmin;
  остались только явные сигнатуры offensive-инструментов.
description_en: |
  Execution of an offensive-security tool or malware on an endpoint
  (mimikatz, rubeus, bloodhound, crackmapexec, procdump, cobalt, pwdump, lazagne;
  nmap, masscan, nikto, hydra, hashcat, sqlmap, linpeas, pspy, chisel).
  MADE STANDALONE: this used to be Stage 2 of the "ESET threat → endpoint process" cross-source chain,
  but the ESET monitoring hosts (ydenilyuk/badilov/aqoriyev/...) are COMPLETELY SEPARATE from the Windows+auditd hosts
  (WINDC22/DESKTOP-Q4KDUEJ/siem/vision) — the ESET endpoints do not send Sysmon/auditd
  to this cluster, so the chain could never correlate on host.name (it never
  worked). Now it runs as a standalone high-confidence detection.
  FP reduction: the broad "execution from temp/downloads/tmp" catch-all and dual-use vssadmin were removed;
  only explicit offensive-tool signatures remain.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*,logs-updive.audit-*
query_language: esql
query: |
  FROM logs-winlog*, logs-updive.audit-* | WHERE @timestamp >= NOW() - 15 minutes | EVAL host.name = COALESCE(winlog.computer_name, host.hostname) | EVAL process_exe = COALESCE(winlog.event_data.Image, process.executable) | EVAL process_cmd = COALESCE(winlog.event_data.CommandLine, MV_CONCAT(process.args, " ")) | EVAL proc_user = COALESCE(winlog.event_data.User, user.name) | EVAL img_lower = TO_LOWER(process_exe) | WHERE (winlog.channel == "Microsoft-Windows-Sysmon/Operational" AND event.code == "1" AND img_lower RLIKE ".*(mimikatz|meterpreter|procdump|rubeus|bloodhound|wce[.]exe|crackmapexec|pwdump|lazagne|cobalt).*") OR (event.action == "executed" AND img_lower RLIKE ".*(nmap|masscan|nikto|hydra|hashcat|sqlmap|linpeas|pspy|chisel|mimikatz|lazagne).*") | KEEP @timestamp, host.name, process_exe, process_cmd, proc_user | LIMIT 500
tags:
  - attack.execution
  - attack.credential-access
  - chain
  - correlation
  - eset
  - linux
  - windows
severity: high
risk_score: 73
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host.name
    - process_exe
    - process_cmd
    - proc_user
  frequency: 1
  timeframe_sec: 3600
  dedup_fields:
    - host.name
    - process_exe
  escalate_severity: high
chain:
  enabled: true
  stage: 1
  timeframe_sec: 3600
  correlate_by:
    - host.name
mitre_attack:
  TA0002:
    T1059: []
  TA0005:
    T1036: ["T1036.005"]
    T1055: []
  TA0006:
    T1003: ["T1003.001"]
