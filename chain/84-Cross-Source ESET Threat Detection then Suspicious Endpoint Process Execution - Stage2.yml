rule_id: de1963d9-7b68-4aa8-bd3e-fe2f465f29bd
name: "Endpoint: Offensive Security Tool / Malware Execution (standalone)"
description: |
  Endpoint'da offensive-security tool yoki malware ishga tushishi
  (mimikatz, rubeus, bloodhound, crackmapexec, procdump, cobalt, pwdump, lazagne;
  nmap, masscan, nikto, hydra, hashcat, sqlmap, linpeas, pspy, chisel).
  STANDALONE qilindi: avval bu "ESET threat → endpoint process" cross-source zanjirning 2-bosqichi edi,
  lekin ESET monitoring hostlari (ydenilyuk/badilov/aqoriyev/...) Windows+auditd hostlaridan
  (WINDC22/DESKTOP-Q4KDUEJ/siem/vision) BUTUNLAY AJRALGAN — ESET endpointlari bu clusterga Sysmon/auditd
  yubormaydi, shuning uchun zanjir host.name bo'yicha hech qachon korrelyatsiya qila olmasdi (hech qachon
  ishlamasdi). Endi mustaqil yuqori-ishonchli detection sifatida ishlaydi.
  FP kamaytirish: keng "temp/downloads/tmp dan ishga tushish" catch-all va dual-use vssadmin olib tashlandi;
  faqat aniq offensive-tool imzolari qoldi.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*,logs-updive.audit-*
query_language: esql
query: |
  FROM logs-winlog*, logs-updive.audit-* | WHERE @timestamp >= NOW() - 15 minutes | EVAL host.name = COALESCE(winlog.computer_name, host.hostname) | EVAL process_exe = COALESCE(winlog.event_data.Image, process.executable) | EVAL process_cmd = COALESCE(winlog.event_data.CommandLine, MV_CONCAT(process.args, " ")) | EVAL proc_user = COALESCE(winlog.event_data.User, user.name) | EVAL img_lower = TO_LOWER(process_exe) | WHERE (winlog.channel == "Microsoft-Windows-Sysmon/Operational" AND event.code == "1" AND img_lower RLIKE ".*(mimikatz|meterpreter|procdump|rubeus|bloodhound|wce[.]exe|crackmapexec|pwdump|lazagne|cobalt).*") OR (event.action == "executed" AND img_lower RLIKE ".*(nmap|masscan|nikto|hydra|hashcat|sqlmap|linpeas|pspy|chisel|mimikatz|lazagne).*") | KEEP @timestamp, host.name, process_exe, process_cmd, proc_user | LIMIT 500
tags:
  - attack.execution
  - attack.credential-access
  - chain
  - correlation
  - eset
  - linux
  - windows
severity: high
risk_score: 73
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host.name
    - process_exe
    - process_cmd
    - proc_user
  frequency: 1
  timeframe_sec: 3600
  dedup_fields:
    - host.name
    - process_exe
  escalate_severity: high
chain:
  enabled: true
  stage: 1
  timeframe_sec: 3600
  correlate_by:
    - host.name
mitre_attack:
  TA0002:
    T1059: []
  TA0005:
    T1036: ["T1036.005"]
    T1055: []
  TA0006:
    T1003: ["T1003.001"]
