rule_id: 0094bd6e-aaa3-457b-9672-c7c1c513248c
name_uz: "Zanjir: Windows Password Spray — 1-bosqich: Muvaffaqiyatsiz logon spray'i"
name_ru: "Цепочка: Windows Password Spray — Этап 1: Спрей неудачных попыток входа"
name_en: "Chain: Windows Password Spray — Stage 1: Failed Logon Spray"
description_uz: |
  Windows Password Spray zanjiri — 1-bosqich (2 dan).
  Failed Logon Spray.
description_ru: |
  Цепочка Windows Password Spray — этап 1 (из 2).
  Спрей неудачных попыток входа.
description_en: |
  Windows Password Spray chain — stage 1 (of 2).
  Failed Logon Spray.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog* | WHERE @timestamp >= NOW() - 15 minutes AND event.code == "4625" AND winlog.channel == "Security" AND winlog.event_data.TargetUserName IS NOT NULL AND NOT winlog.event_data.TargetUserName LIKE "*$" AND winlog.event_data.IpAddress IS NOT NULL AND winlog.event_data.IpAddress != "-" | EVAL source_ip = winlog.event_data.IpAddress, `user.name` = winlog.event_data.TargetUserName, `host.name` = winlog.computer_name, logon_type = winlog.event_data.LogonType | KEEP source_ip, `user.name`, `host.name`, logon_type | LIMIT 500
tags:
  - attack.credential_access
  - chain
  - correlation
  - password_spray
  - windows
severity: medium
risk_score: 40
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host.name
  different_field: user.name
  frequency: 5
  timeframe_sec: 300
  dedup_fields:
    - source_ip
    - user.name
chain:
  enabled: true
  stage: 1
  timeframe_sec: 3600
  correlate_by:
    - host.name
mitre_attack:
  TA0006:
    T1110: ["T1110.003"]
