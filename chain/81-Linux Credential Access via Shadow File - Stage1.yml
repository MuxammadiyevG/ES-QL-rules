rule_id: e8e2e4a6-8011-48c5-8aeb-df3c362a82a4
name: "Chain: Linux Credential Access via Shadow File — Stage 1: Shadow File Accessed via FIM"
description: |
  Linux Credential Access via Shadow File zanjiri — 1-bosqich (2 dan).
  Shadow File Accessed via FIM.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-* | WHERE @timestamp >= NOW() - 15 minutes | WHERE event.module == "file_integrity" AND event.type == "change" AND (file.path == "/etc/shadow" OR file.path == "/etc/gshadow") | EVAL host_name = host.name | KEEP host_name, file.path, event.action, event.module, @timestamp | SORT @timestamp DESC | LIMIT 500
tags:
  - attack.credential-access
  - auditd
  - chain
  - correlation
  - linux
severity: medium
risk_score: 47
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host_name
    - file.path
    - event.module
  frequency: 1
  timeframe_sec: 900
chain:
  enabled: true
  stage: 1
  timeframe_sec: 3600
  correlate_by:
    - host_name
mitre_attack:
  TA0006:
    T1003: ["T1003.008"]
