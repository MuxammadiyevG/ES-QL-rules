rule_id: 86c6195d-6887-4265-bc62-30dc4a8f0e84
name_uz: "Zanjir: Windows'da explicit credential bilan lateral harakat — 2-bosqich: explicit credential ishlatilgandan keyingi tarmoq yoki imtiyozli kirish"
name_ru: "Цепочка: горизонтальное перемещение с явными учётными данными в Windows — Этап 2: сетевой или привилегированный вход после использования явных учётных данных"
name_en: "Chain: Windows Explicit Credential Lateral Movement — Stage 2: Network or Privileged Logon Following Explicit-Cred Use"
description_uz: |
  Windows Explicit Credential Lateral Movement zanjiri — 2-bosqich (2 dan).
  Network or Privileged Logon Following Explicit-Cred Use.
  Oldingi bosqichga (stage 1) bog'langan.
description_ru: |
  Цепочка горизонтального перемещения с явными учётными данными в Windows — Этап 2 (из 2).
  Сетевой или привилегированный вход после использования явных учётных данных.
  Связан с предыдущим этапом (stage 1).
description_en: |
  Windows Explicit Credential Lateral Movement chain — Stage 2 (of 2).
  Network or Privileged Logon Following Explicit-Cred Use.
  Linked to the previous stage (stage 1).
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog* | WHERE @timestamp >= NOW() - 15 minutes | WHERE winlog.channel == "Security" AND (event.code == "4624" OR event.code == "4672") | EVAL user.name = CASE(event.code == "4624", winlog.event_data.TargetUserName, winlog.event_data.SubjectUserName), host.name = winlog.computer_name, logon_type = winlog.event_data.LogonType, privilege_list = winlog.event_data.PrivilegeList | WHERE NOT user.name LIKE "*$" | WHERE NOT user.name IN ("СИСТЕМА", "SYSTEM", "LOCAL SERVICE", "NETWORK SERVICE", "IUSR") | WHERE NOT user.name RLIKE ".*DWM-[0-9].*" | WHERE (event.code == "4672") OR (event.code == "4624" AND logon_type == "3") | KEEP host.name, user.name, event.code, logon_type, privilege_list | LIMIT 500
tags:
  - attack.lateral-movement
  - chain
  - correlation
  - lateral-movement
  - network-logon
  - privilege-escalation
  - windows
severity: high
risk_score: 73
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - host.name
    - user.name
  frequency: 1
  timeframe_sec: 3600
  dedup_fields:
    - event.code
    - logon_type
  escalate_severity: high
chain:
  enabled: true
  stage: 2
  depends_on_rule_ids:
    - fbb8a929-97ac-4689-8d09-df2bd387e7ed
  timeframe_sec: 3600
  correlate_by:
    - host.name
mitre_attack:
  TA0001:
    T1078: ["T1078.002"]
  TA0008:
    T1021: ["T1021.002"]
    T1550: ["T1550.002"]
