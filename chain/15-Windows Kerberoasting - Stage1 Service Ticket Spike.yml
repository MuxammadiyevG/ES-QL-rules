rule_id: 65b0b2bd-176f-42fd-9efd-2d7d08a96759
name_uz: "Zanjir: Kerberos service ticket keskin o'sishi — Kerberoasting (4769)"
name_ru: "Цепочка: Всплеск Kerberos service ticket — Kerberoasting (4769)"
name_en: "Chain: Kerberos Service Ticket Spike — Kerberoasting (4769)"
description_uz: |
  Kerberoasting zanjiri — 1-bosqich.
  Bitta hisob qisqa vaqtda ko'p turli SPN uchun KUCHSIZ shifrlash (RC4/DES) bilan service ticket so'rasa (4769) — Kerberoasting belgisi.
  Korrelyatsiya: same_fields user.name, different_field ServiceName.
  FP kamaytirish: normal AD AES (0x12) ishlatadi; faqat RC4 (0x17)/DES service ticket so'rovlari olinadi — bu kerberoasting'ning klassik imzosi.
description_ru: |
  Цепочка Kerberoasting — этап 1.
  Если одна учётная запись за короткое время запрашивает service ticket для множества разных SPN со СЛАБЫМ шифрованием (RC4/DES) (4769) — признак Kerberoasting.
  Корреляция: same_fields user.name, different_field ServiceName.
  Снижение FP: нормальный AD использует AES (0x12); берутся только запросы service ticket с RC4 (0x17)/DES — это классическая сигнатура kerberoasting.
description_en: |
  Kerberoasting chain — stage 1.
  When a single account requests service tickets for many different SPNs with WEAK encryption (RC4/DES) within a short time (4769) — an indicator of Kerberoasting.
  Correlation: same_fields user.name, different_field ServiceName.
  FP reduction: normal AD uses AES (0x12); only RC4 (0x17)/DES service ticket requests are taken — this is the classic kerberoasting signature.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security" AND event.code == "4769"
  | EVAL user.name = winlog.event_data.TargetUserName, host.name = winlog.computer_name, service = winlog.event_data.ServiceName, enc = winlog.event_data.TicketEncryptionType
  | WHERE user.name IS NOT NULL AND NOT user.name LIKE "*$"
  | WHERE enc IN ("0x17", "0x18", "0x1", "0x3")
  | KEEP @timestamp, agent_id, user.name, service, enc, host.name, event.code
  | LIMIT 1000
tags:
  - attack.credential-access
  - attack.t1558.003
  - windows
  - kerberoasting
  - correlation
  - chain
severity: high
risk_score: 80
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - user.name
  different_field: service
  frequency: 10
  timeframe_sec: 300
  dedup_fields:
    - user.name
    - service
  escalate_severity: high
chain:
  enabled: true
  stage: 1
  timeframe_sec: 3600
  correlate_by:
    - user.name
references:
  - "https://attack.mitre.org/techniques/T1558/003/"
nist: ["AC-7", "SI-4"]
pci_dss: ["8.3", "10.2.4"]
mitre_attack:
  TA0006:
    T1558: ["T1558.003"]
