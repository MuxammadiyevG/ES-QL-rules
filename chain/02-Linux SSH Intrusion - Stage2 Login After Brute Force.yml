rule_id: 7afac640-f586-4c10-a306-16070eea7bb5
name_uz: "Zanjir: Brute force'dan keyin muvaffaqiyatli SSH login (Linux)"
name_ru: "Цепочка: Успешный вход по SSH после brute force (Linux)"
name_en: "Chain: SSH Successful Login After Brute Force (Linux)"
description_uz: |
  Linux SSH zanjiri — 2-bosqich.
  Brute-force failurelaridan keyin o'sha source.ip dan muvaffaqiyatli SSH login (auditd user_start success).
  1-bosqichga bog'langan — kompromitatsiya belgisidir.
description_ru: |
  Цепочка Linux SSH — этап 2.
  После неудач brute-force успешный SSH-вход с того же source.ip (auditd user_start success).
  Связан с этапом 1 — признак компрометации.
description_en: |
  Linux SSH chain — stage 2.
  After brute-force failures, a successful SSH login from the same source.ip (auditd user_start success).
  Linked to stage 1 — an indicator of compromise.
type: esql
enabled: true
params: "{}"
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE auditd.message_type == "user_start" AND auditd.result == "success"
      AND process.executable == "/usr/sbin/sshd" AND source.ip IS NOT NULL
  | EVAL host.name = host.hostname, user.name = auditd.data.acct
  | KEEP @timestamp, agent_id, source.ip, user.name, host.name, auditd.message_type, auditd.result
  | LIMIT 500
tags:
  - attack.credential-access
  - attack.initial-access
  - attack.t1110.001
  - attack.t1078
  - ssh
  - brute-force-success
  - auditd
  - correlation
  - chain
severity: high
risk_score: 90
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - source.ip
  timeframe_sec: 300
  dedup_fields:
    - source.ip
    - user.name
    - host.name
  ignore_sec: 120
  escalate_severity: critical
chain:
  enabled: true
  stage: 2
  depends_on_rule_ids:
    - c7683cc7-c4d3-4f67-9d1b-96ab7385fa35
  timeframe_sec: 3600
  correlate_by:
    - source.ip
references:
  - "https://attack.mitre.org/techniques/T1110/001/"
  - "https://attack.mitre.org/techniques/T1078/"
nist: ["AC-7", "AC-17", "SI-4"]
pci_dss: ["8.1.6", "8.3"]
mitre_attack:
  TA0001:
    T1078: []
  TA0006:
    T1110: ["T1110.001"]
