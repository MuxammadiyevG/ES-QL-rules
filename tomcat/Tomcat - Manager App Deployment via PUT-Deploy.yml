rule_id: c1d69d89-7a74-4e3a-8381-1f801b636fde
name_uz: "Tomcat - Manager App orqali PUT/Deploy bilan deploy qilish"
name_ru: "Tomcat - развёртывание через Manager App по PUT/Deploy"
name_en: "Tomcat - Manager App Deployment via PUT/Deploy"
description_uz: |
  Ushbu qoida Tomcat Manager App orqali masofadan WAR deploy qilish yoki
  fayl yuklash urinishlarini aniqlaydi — /manager/text/deploy,
  /manager/html/upload yoki PUT metodi orqali. Bu zaif yoki o'g'irlangan
  manager hisob ma'lumotlari yordamida webshell/malicious WAR joylashtirish
  belgisi bo'lishi mumkin (T1505.003, T1190).
  Qonuniy holatlar: CI/CD pipeline, DevOps deployment (authorized IP'lardan).
  SOC triage bosqichlari:
  - Manba IP'ni authorized deployment infratuzilmasi bilan solishtiring
  - Deploy qilingan WAR/path nomini va response code'ni tekshiring (200 = muvaffaqiyat!)
  - Manager hisobiga muvaffaqiyatli autentifikatsiya bo'lganini tekshiring
  - So'nggi rejalashtirilgan deploy operatsiyalari bilan solishtiring
  - Serverda yangi context/webapp paydo bo'lganligini tekshiring
description_ru: |
  Это правило обнаруживает попытки удалённого развёртывания WAR или
  загрузки файла через Tomcat Manager App — по /manager/text/deploy,
  /manager/html/upload либо методом PUT. Это может быть признаком размещения
  вебшелла/вредоносного WAR с использованием слабых или украденных
  учётных данных manager (T1505.003, T1190).
  Легитимные случаи: CI/CD pipeline, DevOps-развёртывание (с авторизованных IP).
  Шаги SOC-триажа:
  - Сопоставьте исходный IP с авторизованной инфраструктурой развёртывания
  - Проверьте имя развёрнутого WAR/пути и код ответа (200 = успех!)
  - Проверьте, была ли успешная аутентификация в учётной записи manager
  - Сопоставьте с недавними плановыми операциями развёртывания
  - Проверьте появление нового context/webapp на сервере
description_en: |
  This rule detects attempts to remotely deploy a WAR or upload a file
  through the Tomcat Manager App — via /manager/text/deploy,
  /manager/html/upload or the PUT method. This may indicate the deployment
  of a webshell/malicious WAR using weak or stolen
  manager credentials (T1505.003, T1190).
  Legitimate cases: CI/CD pipeline, DevOps deployment (from authorized IPs).
  SOC triage steps:
  - Compare the source IP with the authorized deployment infrastructure
  - Check the deployed WAR/path name and the response code (200 = success!)
  - Check whether authentication to the manager account succeeded
  - Compare with recent scheduled deployment operations
  - Check whether a new context/webapp appeared on the server
type: esql
params: '{}'
schedule_interval: 5m
index:
  - filebeat-tomcat-*
query_language: esql
query: |
  FROM filebeat-tomcat-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE data_stream.dataset == "tomcat.access"
  | WHERE TO_LOWER(rsa.web.urlpage) LIKE "*/manager/text/deploy*"
     OR TO_LOWER(rsa.web.urlpage) LIKE "*/manager/html/upload*"
     OR TO_LOWER(rsa.web.urlpage) LIKE "*/manager/text/undeploy*"
     OR TO_LOWER(rsa.web.urlpage) LIKE "*/manager/deploy*"
     OR (rsa.web.p_web_method == "PUT" AND TO_LOWER(rsa.web.urlpage) LIKE "*/manager/*")
  | STATS
      event_count = COUNT(*),
      deploy_paths = VALUES(rsa.web.urlpage),
      response_codes = VALUES(rsa.misc.result_code),
      methods = VALUES(rsa.web.p_web_method),
      user_agents = VALUES(rsa.misc.client),
      auth_users = VALUES(rsa.identity.user_role),
      target_hosts = VALUES(rsa.network.host_dst)
    BY agent_id, source.ip, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP agent_id, bucket, source.ip, event_count, deploy_paths, response_codes, methods, user_agents, auth_users, target_hosts
  | SORT event_count DESC
  | LIMIT 50
enabled: true
tags:
  - attack.persistence
  - attack.t1505.003
  - attack.execution
  - attack.t1059
  - tomcat
  - manager
  - deployment
severity: high
risk_score: 88
references:
  - "https://attack.mitre.org/techniques/T1505/003/"
  - "https://attack.mitre.org/techniques/T1190/"
nist: ["AC-6", "SI-3", "CM-7"]
pci_dss: ["6.5.1", "7.1"]
gdpr: ["32.1"]
mitre_attack:
  TA0003:
    T1505: ["T1505.003"]
  TA0002:
    T1059: []
