rule_id: 70e8ba82-4293-409b-9499-04939fa13129
name_uz: "Tomcat - URL'da SQL Injection urinishi"
name_ru: "Tomcat - попытка SQL Injection в URL"
name_en: "Tomcat - SQL Injection Attempt in URL"
description_uz: |
  Ushbu qoida HTTP so'rov URL'larida SQL injection pattern'larini aniqlaydi.
  Bu ma'lumotlar bazasiga ruxsatsiz kirish yoki ma'lumot o'g'irlash
  urinishi bo'lishi mumkin (T1190, T1059).
  Qonuniy holatlar: Juda kam (pentest, security scanner).
  SOC triage bosqichlari:
  - URL va query string'ni to'liq ko'ring
  - Response code va size'ni tekshiring (200 + katta size = xavfli)
  - WAF loglarini tekshiring (bloklangan yoki o'tganmi?)
  - DB server loglarini tekshiring
  - Manba IP reputation'ini tekshiring
description_ru: |
  Это правило обнаруживает паттерны SQL injection в URL HTTP-запросов.
  Это может быть попыткой несанкционированного доступа к базе данных или кражи
  данных (T1190, T1059).
  Легитимные случаи: очень редко (pentest, security scanner).
  Шаги SOC-триажа:
  - Полностью просмотрите URL и query string
  - Проверьте код ответа и размер (200 + большой размер = опасно)
  - Проверьте логи WAF (было заблокировано или прошло?)
  - Проверьте логи сервера БД
  - Проверьте репутацию исходного IP
description_en: |
  This rule detects SQL injection patterns in HTTP request URLs.
  This may be an attempt at unauthorized database access or data
  theft (T1190, T1059).
  Legitimate cases: Very rare (pentest, security scanner).
  SOC triage steps:
  - View the URL and query string in full
  - Check the response code and size (200 + large size = dangerous)
  - Check the WAF logs (was it blocked or did it pass?)
  - Check the DB server logs
  - Check the source IP reputation
type: esql
params: '{}'
schedule_interval: 5m
index:
  - filebeat-tomcat-*
query_language: esql
query: |
  FROM filebeat-tomcat-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE data_stream.dataset == "tomcat.access"
  | WHERE TO_LOWER(rsa.web.urlpage) LIKE "*select*"
     OR TO_LOWER(rsa.web.urlpage) LIKE "*union*"
     OR TO_LOWER(rsa.web.urlpage) LIKE "*insert*"
     OR TO_LOWER(rsa.web.urlpage) LIKE "*drop*"
     OR TO_LOWER(rsa.web.urlpage) LIKE "*1=1*"
     OR TO_LOWER(rsa.web.urlpage) LIKE "*or+1*"
     OR TO_LOWER(rsa.web.urlpage) LIKE "*%27*"
     OR TO_LOWER(rsa.web.p_url) LIKE "*union+select*"
     OR TO_LOWER(rsa.web.p_url) LIKE "*'+or+'*"
  | STATS
      event_count = COUNT(*),
      attack_urls = VALUES(rsa.web.urlpage),
      response_codes = VALUES(rsa.misc.result_code),
      user_agents = VALUES(rsa.misc.client),
      target_hosts = VALUES(rsa.network.host_dst)
    BY agent_id, source.ip, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP agent_id, bucket, source.ip, event_count, attack_urls, response_codes, user_agents, target_hosts
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.initial-access
  - attack.t1190
  - attack.t1059
  - tomcat
  - sql-injection
  - web-attack
severity: critical
risk_score: 88
references:
  - "https://attack.mitre.org/techniques/T1190/"
  - "https://owasp.org/www-community/attacks/SQL_Injection"
nist: ["SI-10", "AC-3"]
pci_dss: ["6.5.1"]
gdpr: ["32.2"]
mitre_attack:
  TA0001:
    T1190: []