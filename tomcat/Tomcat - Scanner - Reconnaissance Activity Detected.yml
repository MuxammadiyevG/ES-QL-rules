rule_id: 60fe1317-95aa-4f21-b626-8b57855b32af
name_uz: "Tomcat - Skaner / razvedka faoliyati aniqlandi"
name_ru: "Tomcat - обнаружена активность сканера / разведки"
name_en: "Tomcat - Scanner / Reconnaissance Activity Detected"
description_uz: |
  Ushbu qoida bir IP'dan ko'p xil URL path'lariga qilingan so'rovlarni
  aniqlaydi — bu automated scanner (Nikto, Dirbuster, Nuclei) yoki
  manual reconnaissance belgisi bo'lishi mumkin (T1595, T1046).
  Qonuniy holatlar: pentest, vulnerability scan (authorized).
  SOC triage bosqichlari:
  - User-Agent string'ni tekshiring (scanner signature'mi?)
  - Scan'ning authorized pentest bilan mosligini tasdiqlang
  - Scan qilingan path'larni ro'yxatlang
  - Manba IP'ni threat intel bilan solishtiring
  - Muvaffaqiyatli (200) response'lar borligini tekshiring
description_ru: |
  Это правило обнаруживает запросы с одного IP к множеству различных URL-путей —
  это может быть признаком автоматического сканера (Nikto, Dirbuster, Nuclei) или
  ручной разведки (T1595, T1046).
  Легитимные случаи: pentest, vulnerability scan (авторизованный).
  Шаги SOC-триажа:
  - Проверьте строку User-Agent (это сигнатура сканера?)
  - Подтвердите соответствие сканирования авторизованному pentest
  - Составьте список просканированных путей
  - Сопоставьте исходный IP с threat intel
  - Проверьте наличие успешных (200) ответов
description_en: |
  This rule detects requests from a single IP to many different URL paths —
  this may indicate an automated scanner (Nikto, Dirbuster, Nuclei) or
  manual reconnaissance (T1595, T1046).
  Legitimate cases: pentest, vulnerability scan (authorized).
  SOC triage steps:
  - Check the User-Agent string (is it a scanner signature?)
  - Confirm that the scan matches an authorized pentest
  - List the scanned paths
  - Compare the source IP with threat intel
  - Check whether there are successful (200) responses
type: esql
params: '{}'
schedule_interval: 10m
index:
  - filebeat-tomcat-*
query_language: esql
query: |
  FROM filebeat-tomcat-*
  | WHERE @timestamp >= NOW() - 30 minutes
  | WHERE data_stream.dataset == "tomcat.access"
  | WHERE TO_LOWER(rsa.misc.client) LIKE "*nikto*"
     OR TO_LOWER(rsa.misc.client) LIKE "*dirbuster*"
     OR TO_LOWER(rsa.misc.client) LIKE "*nuclei*"
     OR TO_LOWER(rsa.misc.client) LIKE "*gobuster*"
     OR TO_LOWER(rsa.misc.client) LIKE "*sqlmap*"
     OR TO_LOWER(rsa.misc.client) LIKE "*masscan*"
     OR TO_LOWER(rsa.misc.client) LIKE "*nmap*"
     OR TO_LOWER(rsa.misc.client) LIKE "*zap*"
     OR TO_LOWER(rsa.misc.client) LIKE "*acunetix*"
     OR TO_LOWER(rsa.misc.client) LIKE "*burpsuite*"
  | STATS
      scan_count = COUNT(*),
      unique_paths = COUNT_DISTINCT(rsa.web.urlpage),
      paths_sample = VALUES(rsa.web.urlpage),
      scanner_agents = VALUES(rsa.misc.client),
      response_codes = VALUES(rsa.misc.result_code)
    BY agent_id, source.ip, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE scan_count >= 10
  | KEEP agent_id, bucket, source.ip, scan_count, unique_paths, paths_sample, scanner_agents, response_codes
  | SORT scan_count DESC
  | LIMIT 50
enabled: true
tags:
  - attack.reconnaissance
  - attack.t1595
  - attack.discovery
  - attack.t1046
  - tomcat
  - scanner
  - recon
severity: medium
risk_score: 55
references:
  - "https://attack.mitre.org/techniques/T1595/"
  - "https://attack.mitre.org/techniques/T1046/"
nist: ["SI-4", "AU-6"]
pci_dss: ["11.3", "10.6"]
gdpr: ["32.1"]
mitre_attack:
  TA0043:
    T1595: []
  TA0007:
    T1046: []