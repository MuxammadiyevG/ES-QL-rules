rule_id: 62d055dd-da97-4a80-afe4-065e2da0f49e
name_uz: "Tomcat - Path Traversal hujumi aniqlandi"
name_ru: "Tomcat - обнаружена атака Path Traversal"
name_en: "Tomcat - Path Traversal Attack Detected"
description_uz: |
  Ushbu qoida HTTP so'rovlarda "../", "%2e%2e", "%252e" kabi path traversal
  pattern'larini aniqlaydi. Muvaffaqiyatli bo'lsa, server fayllariga
  ruxsatsiz kirish mumkin (T1083, T1005).
  Qonuniy holatlar: URL encoding bilan bog'liq app xatolari (juda kam).
  SOC triage bosqichlari:
  - So'rov URL'ini to'liq tekshiring (rsa.web.urlpage)
  - HTTP response code'ni tekshiring (200 = critical!)
  - Manba IP'ni threat intel bilan solishtiring
  - Tomcat access log'dagi response size'ni tekshiring
  - Target file/directory aniqlanganligini tekshiring
description_ru: |
  Это правило обнаруживает в HTTP-запросах паттерны path traversal, такие как "../", "%2e%2e", "%252e".
  В случае успеха возможен несанкционированный доступ к файлам
  сервера (T1083, T1005).
  Легитимные случаи: ошибки приложения, связанные с URL encoding (очень редко).
  Шаги SOC-триажа:
  - Полностью проверьте URL запроса (rsa.web.urlpage)
  - Проверьте код ответа HTTP (200 = critical!)
  - Сопоставьте исходный IP с threat intel
  - Проверьте response size в access log Tomcat
  - Проверьте, был ли определён целевой файл/каталог
description_en: |
  This rule detects path traversal patterns such as "../", "%2e%2e", "%252e"
  in HTTP requests. If successful, unauthorized access to server files
  is possible (T1083, T1005).
  Legitimate cases: app errors related to URL encoding (very rare).
  SOC triage steps:
  - Inspect the full request URL (rsa.web.urlpage)
  - Check the HTTP response code (200 = critical!)
  - Compare the source IP with threat intel
  - Check the response size in the Tomcat access log
  - Check whether the target file/directory was identified
type: esql
params: '{}'
schedule_interval: 5m
index:
  - filebeat-tomcat-*
query_language: esql
query: |
  FROM filebeat-tomcat-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE data_stream.dataset == "tomcat.access"
  | WHERE rsa.web.urlpage LIKE "*../*"
     OR TO_LOWER(rsa.web.urlpage) LIKE "*%2e%2e%*"
     OR TO_LOWER(rsa.web.urlpage) LIKE "*%252e*"
     OR rsa.web.p_url LIKE "*../*"
     OR TO_LOWER(rsa.web.p_url) LIKE "*%2e%2e*"
  | STATS
      event_count = COUNT(*),
      urls = VALUES(rsa.web.urlpage),
      response_codes = VALUES(rsa.misc.result_code),
      user_agents = VALUES(rsa.misc.client),
      response_sizes = VALUES(rsa.misc.result)
    BY agent_id, source.ip, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP agent_id, bucket, source.ip, event_count, urls, response_codes, user_agents, response_sizes
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.discovery
  - attack.t1083
  - attack.t1005
  - tomcat
  - path-traversal
  - lfi
severity: critical
risk_score: 90
references:
  - "https://attack.mitre.org/techniques/T1083/"
  - "https://owasp.org/www-community/attacks/Path_Traversal"
nist: ["AC-3", "SI-10"]
pci_dss: ["6.5.8"]
gdpr: ["32.2"]
mitre_attack:
  TA0007:
    T1083: []