rule_id: 87bda738-026f-42ee-af5c-7f369d4315c9
name: "Agent FIM: Windows New Host Initial Scan Detected"
description: |
  Ushbu qoida Discovery texnikasiga bog'liq bo'lib, yangi Windows hostda FIM
  agentining birinchi marta skanerlashini (initial_scan) aniqlaydi. Bu hodisa
  monitoring uchun foydali bo'lib, yangi host tarmoqqa qo'shilganini yoki agent
  qayta o'rnatilganini bildiradi. Kutilmagan yangi host shubhali bo'lishi mumkin.
  Qonuniy holatlar: yangi server o'rnatilishi, agent reinstall, tizim restore.
  SOC triage bosqichlari:
  - `host.hostname` va `host.ip` — bu host asset inventoryda bormi.
  - `agent.id` — avval ko'rilmagan yangi agent IDmi.
  - `@timestamp` — biznes soatlaridan tashqarida bo'lsa shubhali.
  - Tarmoq diagrammasi bilan solishtiring — ruxsatsiz host qo'shilganmi.
  - Noqonuniy bo'lsa: hostni izolyatsiya qiling, kim o'rnatganini aniqlang.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.module == "file_integrity"
  | WHERE host.os.type == "windows"
  | WHERE event.action == "initial_scan"
  | WHERE event.type == "info"
  | EVAL host_name  = host.hostname
  | EVAL file_path  = file.path
  | EVAL file_name  = file.name
  | EVAL file_ext   = file.extension
  | EVAL file_owner = file.owner
  | EVAL file_size  = file.size
  | STATS
      scan_count  = COUNT(*),
      host_names  = VALUES(host.hostname),
      file_paths  = VALUES(file.path),
      file_names  = VALUES(file.name),
      file_exts   = VALUES(file.extension),
      file_owners = VALUES(file.owner),
      error_msgs  = VALUES(error.message),
      last_seen   = MAX(@timestamp),
      first_seen  = MIN(@timestamp)
    BY agent_id, host.hostname
  | WHERE scan_count >= 1
  | EVAL
      host_name = host.hostname
  | KEEP
      agent_id, host_name, scan_count,
      host_names, file_paths, file_names, file_exts,
      file_owners, error_msgs, last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - attack.discovery
  - attack.t1082
  - attack.t1046
  - detection.threat-hunting
severity: low
risk_score: 30
references:
  - "https://attack.mitre.org/techniques/T1082/"
  - "https://attack.mitre.org/techniques/T1046/"
nist: ["CM-8", "SI-4", "AU-12"]
pci_dss: ["11.1", "11.4", "2.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0007:
    T1082: []
    T1046: []