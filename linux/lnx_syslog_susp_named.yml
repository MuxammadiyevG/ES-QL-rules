rule_id: aea78bea-08ec-4daa-9063-4e0dc91c058f
name: "Suspicious Named Error"
description: |
  Detects suspicious DNS (BIND/named) error messages that indicate fatal or abnormal behavior.
  Such errors may be caused by exploitation attempts, zone transfer abuse, or malformed packets.
  Targets syslog messages containing raw named/BIND daemon output.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-switch.syslog-*
query_language: esql
query: |
  FROM logs-switch.syslog-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* Detect suspicious named / DNS error messages in syslog */
  | WHERE TO_LOWER(COALESCE(event.original, "")) RLIKE ".*(dropping source port zero packet from|denied axfr from|exiting .due to fatal error.).*"
  | STATS
      event_count = COUNT(*),
      raw_samples = VALUES(event.original)
    BY host.name, observer.hostname, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP
      bucket,
      host.name,
      observer.hostname,
      event_count,
      raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.initial-access
  - attack.t1190
severity: high
risk_score: 75
references:
  - "https://github.com/ossec/ossec-hids/blob/1ecffb1b884607cb12e619f9ab3c04f530801083/etc/rules/named_rules.xml"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0001:
    T1190: []
