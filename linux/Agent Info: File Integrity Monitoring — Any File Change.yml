rule_id: 9cf6f6fb-e9d6-4e2e-b224-e9a1b45a4937
name_uz: "Agent Info: Fayl yaxlitligi monitoringi — har qanday fayl o'zgarishi"
name_ru: "Agent Info: Мониторинг целостности файлов — любое изменение файла"
name_en: "Agent Info: File Integrity Monitoring — Any File Change"
description_uz: |
  FIM moduli tomonidan aniqlangan barcha fayl o'zgarishlarini qayd etadi.
  Tizimda qaysi fayllar o'zgarayotganini ko'rish va baseline yaratish uchun ishlatiladi.
description_ru: |
  Фиксирует все изменения файлов, обнаруженные модулем FIM.
  Используется для наблюдения за тем, какие файлы изменяются в системе, и для создания baseline.
description_en: |
  Records all file changes detected by the FIM module.
  Used to see which files are changing on the system and to build a baseline.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.module == "file_integrity"
  | WHERE event.type == "change"
  | WHERE NOT (file.path LIKE "/etc/updive/*")
  | STATS
      event_count  = COUNT(*),
      host_names   = VALUES(host.hostname),
      file_paths   = VALUES(file.path),
      file_exts    = VALUES(file.extension),
      file_owners  = VALUES(file.owner),
      actions      = VALUES(event.action),
      last_seen    = MAX(@timestamp),
      first_seen   = MIN(@timestamp)
    BY agent_id, host.hostname, file.path
  | WHERE event_count >= 1
  | KEEP
      agent_id, host.hostname, file.path, event_count,
      host_names, file_paths, file_exts,
      file_owners, actions, last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - detection.informational
  - visibility.file-integrity
severity: low
risk_score: 5
references: []
nist: ["SI-7", "AU-12"]
pci_dss: ["10.5.1", "11.5"]
gdpr: ["32.1.b"]
mitre_attack: []