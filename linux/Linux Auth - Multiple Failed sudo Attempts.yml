rule_id: 743d5f68-26d7-4a1a-89de-8ddc55c88ab5
name: Linux Auth - Multiple Failed sudo Attempts
description: |
  Ushbu qoida Linux auth.log (logs-linux.auth-*) dagi takroriy muvaffaqiyatsiz sudo
  autentifikatsiya urinishlarini aniqlaydi. Bitta foydalanuvchi qisqa vaqt ichida ko'p
  marta sudo parolini noto'g'ri kiritishi yoki ruxsatsiz sudo urinishi privilege
  escalation (T1548.003 - Sudo and Sudo Caching) belgisi bo'lishi mumkin.
  Qonuniy holatlar: foydalanuvchi parolni unutgan, skript noto'g'ri sozlangan.
  SOC triage bosqichlari:
  - `actor` (user.name) va qaysi `host`da ekanini tekshiring.
  - Urinishlar interaktiv sessiyadan yoki avtomatlashtirilgan jarayondan kelganini ko'ring.
  - Sudoers ro'yxatida foydalanuvchi borligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa: akkauntni bloklang, sudoers ni audit qiling.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-linux.auth-*
query_language: esql
query: |
  FROM logs-linux.auth-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE data_stream.dataset == "linux.auth"
  | WHERE event.action IN ("sudo-command", "sudo-auth-failed", "sudo")
  | WHERE event.outcome == "failure"
  | EVAL actor    = COALESCE(user.name, "Unknown")
  | EVAL hostn    = COALESCE(host.hostname, "Unknown")
  | EVAL src_ip   = COALESCE(TO_STRING(source.ip), "Unknown")
  | EVAL cmd      = COALESCE(process.command_line, "Unknown")
  | EVAL eff_user = COALESCE(user.effective.name, "Unknown")
  | STATS
      fail_count = COUNT(*),
      commands   = VALUES(cmd),
      eff_users  = VALUES(eff_user),
      src_ips    = VALUES(src_ip),
      hosts      = VALUES(hostn),
      first_seen = MIN(@timestamp),
      last_seen  = MAX(@timestamp)
    BY agent_id, actor, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE fail_count >= 5
  | KEEP agent_id, bucket, actor, fail_count, commands,
         eff_users, src_ips, hosts, first_seen, last_seen
  | SORT fail_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.privilege_escalation
  - attack.t1548
  - attack.t1548.003
  - detection.linux
  - linux.auth.sudo
severity: high
risk_score: 70
nist: ["AU-2", "AU-12", "AC-6", "AC-7"]
pci_dss: ["10.2.2", "10.2.4", "10.2.5"]
gdpr: ["32.1.a", "32.2"]
mitre_attack:
  TA0004:
    T1548:
      - "T1548.003"
