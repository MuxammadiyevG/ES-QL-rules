rule_id: c8037c6b-000b-4404-82e3-09d3e4438bb2
name_uz: "Agent Defense Evasion: SSHD jarayoni qayta yaratildi yoki qayta ishga tushirildi"
name_ru: "Agent Defense Evasion: процесс SSHD пересоздан или перезапущен"
name_en: "Agent Defense Evasion: SSHD Process Respawned or Restarted"
description_uz: |
  Ushbu qoida Defense Evasion va Persistence texnikalariga bog'liq bo'lib, sshd daemon
  jarayonining qayta ishga tushirilishini aniqlaydi. Hujumchi sshd binary ni trojanize
  qilib yoki sshd konfiguratsiyasini o'zgartirib persistent backdoor yaratishi mumkin.
  Qonuniy holatlar: tizim restart, systemd service reload, OpenSSH yangilanishi.
  SOC triage bosqichlari:
  - `process.parent.pid` ni tekshiring — systemd (PID 1) yoki boshqa process tomonidan.
  - `process.args` dagi flaglarni tekshiring: `-D -R` normal, g'ayrioddiy flaglar shubhali.
  - `auditd.paths.mode` va `file.mode` — sshd binary huquqlarini tekshiring (0755 normal).
  - `auditd.paths.inode` ni saqlang va keyingi o'zgarishlar bilan solishtiring.
  - sshd binary hash ni tekshiring: `sha256sum /usr/sbin/sshd`.
  - Noqonuniy bo'lsa: sshd binary ni verify qiling, konfiguratsiyani tekshiring.
description_ru: |
  Это правило связано с техниками Defense Evasion и Persistence и выявляет перезапуск
  процесса демона sshd. Злоумышленник может троянизировать бинарный файл sshd
  или изменить конфигурацию sshd и создать постоянный бэкдор.
  Легитимные случаи: перезагрузка системы, reload службы systemd, обновление OpenSSH.
  Шаги SOC-триажа:
  - Проверьте `process.parent.pid` — запущен systemd (PID 1) или другим процессом.
  - Проверьте флаги в `process.args`: `-D -R` — норма, необычные флаги подозрительны.
  - `auditd.paths.mode` и `file.mode` — проверьте права бинарного файла sshd (0755 — норма).
  - Сохраните `auditd.paths.inode` и сравните с последующими изменениями.
  - Проверьте хеш бинарного файла sshd: `sha256sum /usr/sbin/sshd`.
  - Если активность нелегитимна: верифицируйте бинарный файл sshd, проверьте конфигурацию.
description_en: |
  This rule is related to Defense Evasion and Persistence techniques and detects the sshd daemon
  process being restarted. An attacker may trojanize the sshd binary
  or modify the sshd configuration to create a persistent backdoor.
  Legitimate cases: system restart, systemd service reload, OpenSSH update.
  SOC triage steps:
  - Check `process.parent.pid` — started by systemd (PID 1) or by another process.
  - Check the flags in `process.args`: `-D -R` is normal, unusual flags are suspicious.
  - `auditd.paths.mode` and `file.mode` — check the sshd binary permissions (0755 is normal).
  - Record `auditd.paths.inode` and compare it with subsequent changes.
  - Check the sshd binary hash: `sha256sum /usr/sbin/sshd`.
  - If illegitimate: verify the sshd binary, review the configuration.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE auditd.message_type == "syscall"
  | WHERE auditd.data.syscall == "execve"
  | WHERE process.name == "sshd"
  | WHERE auditd.result == "success"
  | EVAL host_name    = host.hostname
  | EVAL actor        = COALESCE(auditd.summary.actor.primary, user.name)
  | EVAL proc_title   = process.title
  | EVAL proc_args    = process.args
  | EVAL tty          = auditd.data.tty
  | EVAL parent_pid   = process.parent.pid
  | EVAL file_mode    = auditd.paths.mode
  | EVAL file_inode   = auditd.paths.inode
  | EVAL file_path    = auditd.summary.object.primary
  | WHERE file_path IS NOT NULL
  | STATS
      event_count   = COUNT(*),
      host_names    = VALUES(host.hostname),
      actors        = VALUES(user.name),
      proc_titles   = VALUES(process.title),
      ttys          = VALUES(auditd.data.tty),
      parent_pids   = VALUES(process.parent.pid),
      file_modes    = VALUES(auditd.paths.mode),
      file_inodes   = VALUES(auditd.paths.inode),
      last_seen     = MAX(@timestamp),
      first_seen    = MIN(@timestamp)
    BY agent_id, host.hostname, process.parent.pid
  | WHERE event_count >= 1
  | EVAL
      host_name  = host.hostname,
      parent_pid = process.parent.pid
  | KEEP
      agent_id, host_name, parent_pid, event_count,
      host_names, actors, proc_titles, ttys,
      parent_pids, file_modes, file_inodes,
      last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.persistence
  - attack.t1554
  - attack.t1543.002
  - detection.threat-hunting
severity: medium
risk_score: 55
references:
  - "https://attack.mitre.org/techniques/T1554/"
  - "https://attack.mitre.org/techniques/T1543/002/"
nist: ["SI-7", "CM-7", "AU-12", "SI-4"]
pci_dss: ["6.3", "10.2.2", "10.6.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1554: []
  TA0003:
    T1543: ["T1543.002"]