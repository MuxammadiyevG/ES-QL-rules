rule_id: 5bddab61-be85-4403-bbbc-1cf9e9eab0a9
name_uz: "Agent FIM: Windows Domain Controller kritik fayli o'zgartirildi (NTDS, SYSVOL)"
name_ru: "Agent FIM: изменение критичного файла Windows Domain Controller (NTDS, SYSVOL)"
name_en: "Agent FIM: Windows Domain Controller Critical File Modified (NTDS, SYSVOL)"
description_uz: |
  Ushbu qoida Credential Access va Impact texnikalariga bog'liq bo'lib, Active Directory
  Domain Controller tizimidagi kritik fayllarning (NTDS.dit, SYSVOL, NETLOGON) o'zgarishini
  aniqlaydi. NTDS.dit fayliga kirish barcha domain credentialslarini ochib beradi.
  Qonuniy holatlar: AD backup jarayonlari, DC promotion/demotion.
  SOC triage bosqichlari:
  - `file.name` NTDS.dit bo'lsa — darhol kritik incident oching.
  - `file.owner` — SYSTEM bo'lmagan owner bo'lsa DCSync hujumi bo'lishi mumkin.
  - `file.mtime` — rejalashtirilmagan vaqtda o'zgarish shubhali.
  - Volume Shadow Copy orqali NTDS.dit copy qilinganligini tekshiring.
  - Noqonuniy bo'lsa: DC ni izolyatsiya qiling, AD credentialslarni reset qiling.
description_ru: |
  Данное правило связано с техниками Credential Access и Impact и обнаруживает изменение
  критичных файлов (NTDS.dit, SYSVOL, NETLOGON) в системе Active Directory
  Domain Controller. Доступ к файлу NTDS.dit раскрывает все доменные учётные данные.
  Легитимные случаи: процессы резервного копирования AD, DC promotion/demotion.
  Этапы SOC-триажа:
  - Если `file.name` — NTDS.dit, немедленно откройте критичный инцидент.
  - `file.owner` — если владелец не SYSTEM, возможна атака DCSync.
  - `file.mtime` — изменение во внеплановое время подозрительно.
  - Проверьте, не был ли NTDS.dit скопирован через Volume Shadow Copy.
  - Если нелегитимно: изолируйте DC, сбросьте учётные данные AD.
description_en: |
  This rule is related to Credential Access and Impact techniques and detects modification
  of critical files (NTDS.dit, SYSVOL, NETLOGON) on an Active Directory
  Domain Controller. Access to the NTDS.dit file exposes all domain credentials.
  Legitimate cases: AD backup processes, DC promotion/demotion.
  SOC triage steps:
  - If `file.name` is NTDS.dit — open a critical incident immediately.
  - `file.owner` — if the owner is not SYSTEM, this may be a DCSync attack.
  - `file.mtime` — a change at an unscheduled time is suspicious.
  - Check whether NTDS.dit was copied via Volume Shadow Copy.
  - If illegitimate: isolate the DC, reset AD credentials.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.module == "file_integrity"
  | WHERE host.os.type == "windows"
  | WHERE event.type == "change"
  | WHERE STARTS_WITH(file.path, "C:\\Windows\\NTDS\\")
      OR STARTS_WITH(file.path, "C:\\Windows\\SYSVOL\\")
      OR STARTS_WITH(file.path, "C:\\Windows\\System32\\dns\\")
      OR file.name == "NTDS.dit"
      OR file.name == "ntds.dit"
  | EVAL host_name  = host.hostname
  | EVAL file_path  = file.path
  | EVAL file_name  = file.name
  | EVAL file_ext   = file.extension
  | EVAL file_owner = file.owner
  | EVAL file_uid   = file.uid
  | EVAL file_size  = file.size
  | EVAL file_mtime = file.mtime
  | EVAL action     = event.action
  | WHERE file_path IS NOT NULL
  | STATS
      event_count = COUNT(*),
      host_names  = VALUES(host.hostname),
      file_paths  = VALUES(file.path),
      file_names  = VALUES(file.name),
      file_exts   = VALUES(file.extension),
      file_owners = VALUES(file.owner),
      file_uids   = VALUES(file.uid),
      file_sizes  = VALUES(file.size),
      actions     = VALUES(event.action),
      last_seen   = MAX(@timestamp),
      first_seen  = MIN(@timestamp)
    BY agent_id, host.hostname, file.path
  | WHERE event_count >= 1
  | EVAL
      host_name = host.hostname,
      file_path = file.path
  | KEEP
      agent_id, host_name, file_path, event_count,
      host_names, file_paths, file_names, file_exts,
      file_owners, file_uids, file_sizes, actions,
      last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - attack.credential-access
  - attack.impact
  - attack.t1003.003
  - attack.t1565.001
  - detection.threat-hunting
severity: critical
risk_score: 95
references:
  - "https://attack.mitre.org/techniques/T1003/003/"
  - "https://attack.mitre.org/techniques/T1565/001/"
nist: ["AC-3", "AC-6", "SI-7", "IR-4", "AU-12"]
pci_dss: ["7.1", "10.2.7", "11.5", "12.10.1"]
gdpr: ["32.1.b", "32.1.c"]
mitre_attack:
  TA0006:
    T1003: ["T1003.003"]
  TA0040:
    T1565: ["T1565.001"]