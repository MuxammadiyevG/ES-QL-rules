rule_id: 46a89ffd-f2ff-442a-9fb3-5fce565c6d09
name_uz: "Agent FIM: Program Files tashqarisida Windows bajariluvchi fayl yoki DLL yaratildi yoki o'zgartirildi"
name_ru: "Agent FIM: создание или изменение исполняемого файла или DLL Windows вне Program Files"
name_en: "Agent FIM: Windows Executable or DLL Created or Modified Outside Program Files"
description_uz: |
  Ushbu qoida Persistence va Execution texnikalariga bog'liq bo'lib, Windows tizimida
  kutilmagan joylarda (.exe, .dll, .bat, .ps1, .vbs) fayl yaratilishi yoki o'zgartirilishini
  aniqlaydi. Hujumchi temp katalog, user profile yoki boshqa yozish mumkin bo'lgan
  joylarga zararli fayl joylashtirib persistence ta'minlashi mumkin.
  Qonuniy holatlar: dastur o'rnatish, update jarayonlari, developer faoliyati.
  SOC triage bosqichlari:
  - `file.path` — Temp, AppData, Users katalogida exe/dll bo'lsa yuqori xavf.
  - `file.owner` — SYSTEM yoki Administrator emas, oddiy user bo'lsa shubhali.
  - `file.size` — juda kichik PE fayl (< 10KB) packed/obfuscated bo'lishi mumkin.
  - `file.created` vs `file.mtime` — yangi yaratilgan fayl yoki mavjud fayl ustiga yozilgan.
  - Faylni AV/sandbox orqali tekshiring.
  - Noqonuniy bo'lsa: faylni karantinga oling, process tree ni tekshiring.
description_ru: |
  Данное правило связано с техниками Persistence и Execution и обнаруживает создание
  или изменение файлов (.exe, .dll, .bat, .ps1, .vbs) в неожиданных местах
  в системе Windows. Атакующий может разместить вредоносный файл во временном каталоге,
  в профиле пользователя или в других доступных для записи местах и обеспечить закрепление.
  Легитимные случаи: установка программ, процессы обновления, деятельность разработчиков.
  Этапы SOC-триажа:
  - `file.path` — exe/dll в каталогах Temp, AppData, Users — высокий риск.
  - `file.owner` — если это не SYSTEM или Administrator, а обычный user — подозрительно.
  - `file.size` — очень маленький PE-файл (< 10KB) может быть packed/obfuscated.
  - `file.created` vs `file.mtime` — файл создан заново или записан поверх существующего.
  - Проверьте файл через AV/sandbox.
  - Если нелегитимно: поместите файл в карантин, проверьте process tree.
description_en: |
  This rule is related to Persistence and Execution techniques and detects the creation
  or modification of files (.exe, .dll, .bat, .ps1, .vbs) in unexpected locations
  on a Windows system. An attacker may place a malicious file in a temp directory,
  a user profile, or other writable locations to establish persistence.
  Legitimate cases: software installation, update processes, developer activity.
  SOC triage steps:
  - `file.path` — an exe/dll in the Temp, AppData, or Users directory is high risk.
  - `file.owner` — if it is not SYSTEM or Administrator but a regular user, it is suspicious.
  - `file.size` — a very small PE file (< 10KB) may be packed/obfuscated.
  - `file.created` vs `file.mtime` — a newly created file or an overwrite of an existing file.
  - Check the file with AV/sandbox.
  - If illegitimate: quarantine the file, inspect the process tree.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.module == "file_integrity"
  | WHERE host.os.type == "windows"
  | WHERE event.type == "change"
  | WHERE file.extension IN ("exe", "dll", "bat", "ps1", "vbs", "cmd", "scr", "pif", "com")
  | WHERE NOT STARTS_WITH(file.path, "C:\\Program Files\\")
      AND NOT STARTS_WITH(file.path, "C:\\Program Files (x86)\\")
      AND NOT STARTS_WITH(file.path, "C:\\Windows\\")
      AND NOT STARTS_WITH(file.path, "C:\\ProgramData\\Microsoft\\")
  | EVAL host_name    = host.hostname
  | EVAL file_path    = file.path
  | EVAL file_name    = file.name
  | EVAL file_ext     = file.extension
  | EVAL file_owner   = file.owner
  | EVAL file_size    = file.size
  | EVAL file_mtime   = file.mtime
  | EVAL file_created = file.created
  | EVAL action       = event.action
  | WHERE file_path IS NOT NULL
  | STATS
      event_count   = COUNT(*),
      host_names    = VALUES(host.hostname),
      file_paths    = VALUES(file.path),
      file_names    = VALUES(file.name),
      file_exts     = VALUES(file.extension),
      file_owners   = VALUES(file.owner),
      file_sizes    = VALUES(file.size),
      actions       = VALUES(event.action),
      last_seen     = MAX(@timestamp),
      first_seen    = MIN(@timestamp)
    BY agent_id, host.hostname, file.extension, file.path
  | WHERE event_count >= 1
  | EVAL
      host_name = host.hostname,
      file_path = file.path,
      file_ext  = file.extension
  | KEEP
      agent_id, host_name, file_path, file_ext, event_count,
      host_names, file_paths, file_names, file_exts,
      file_owners, file_sizes, actions, last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - attack.persistence
  - attack.execution
  - attack.defense-evasion
  - attack.t1204.002
  - attack.t1059.001
  - attack.t1059.003
  - attack.t1547.001
  - detection.threat-hunting
severity: high
risk_score: 75
references:
  - "https://attack.mitre.org/techniques/T1204/002/"
  - "https://attack.mitre.org/techniques/T1059/001/"
  - "https://attack.mitre.org/techniques/T1547/001/"
nist: ["SI-3", "SI-7", "CM-7", "AU-12"]
pci_dss: ["5.1", "6.3", "10.2.7", "11.5"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0003:
    T1547: ["T1547.001"]
  TA0002:
    T1059: ["T1059.001", "T1059.003"]
    T1204: ["T1204.002"]