rule_id: 2ae64c0c-e739-4f16-bd85-3c6c9ce0b384
name_uz: "Agent Credential Access: Bir Necha Muvaffaqiyatsiz sudo Urinishi va Keyin Muvaffaqiyat (Brute Force)"
name_ru: "Agent Credential Access: несколько неудачных попыток sudo с последующим успехом (brute force)"
name_en: "Agent Credential Access: Multiple sudo Failures Followed by Success (Brute Force)"
description_uz: |
  Ushbu qoida Credential Access texnikasiga bog'liq bo'lib, bir foydalanuvchi tomonidan
  qisqa vaqt ichida bir necha marta muvaffaqiyatsiz sudo urinishi, so'ngra muvaffaqiyatli
  autentifikatsiya hodisasini aniqlaydi — bu sudo password brute force belgisi.
  Qonuniy holatlar: foydalanuvchi parolini unutib, bir necha marta xato kiritib keyin
  to'g'ri kiritishi.
  SOC triage bosqichlari:
  - `fail_count` va `success_count` nisbatini baholang.
  - `auditd.data.terminal` — qaysi terminaldan urinishlar bo'lgan.
  - Urinishlar bir sessiya (`auditd.session`) ichida bo'lganmi yoki turli sessiyalardan.
  - `user.audit.name` — haqiqiy foydalanuvchi identitetini tasdiqlang.
  - Muvaffaqiyatli logindan keyin qaysi buyruqlar bajarilganini tekshiring.
  - Noqonuniy bo'lsa: foydalanuvchi sessiyasini to'xtating, sudo huquqini vaqtincha olib tashlang.
description_ru: |
  Это правило связано с техникой Credential Access и выявляет несколько неудачных попыток sudo
  одним пользователем за короткое время, а затем успешное
  событие аутентификации — это признак перебора пароля sudo (brute force).
  Легитимные случаи: пользователь забыл пароль, несколько раз ввёл его неверно, а потом
  ввёл верно.
  Этапы SOC-триажа:
  - Оцените соотношение `fail_count` и `success_count`.
  - `auditd.data.terminal` — с какого терминала выполнялись попытки.
  - Были ли попытки в рамках одной сессии (`auditd.session`) или из разных сессий.
  - `user.audit.name` — подтвердите настоящую личность пользователя.
  - Проверьте, какие команды были выполнены после успешного входа.
  - Если активность нелегитимна: завершите сессию пользователя, временно снимите права sudo.
description_en: |
  This rule is related to the Credential Access technique and detects several failed sudo
  attempts by a single user within a short period of time, followed by a successful
  authentication event — this is an indicator of sudo password brute force.
  Legitimate cases: a user forgetting the password, entering it incorrectly several times and then
  entering it correctly.
  SOC triage steps:
  - Assess the ratio of `fail_count` to `success_count`.
  - `auditd.data.terminal` — from which terminal the attempts were made.
  - Whether the attempts were within one session (`auditd.session`) or from different sessions.
  - `user.audit.name` — confirm the real user identity.
  - Check which commands were executed after the successful login.
  - If illegitimate: terminate the user session, temporarily remove the sudo privilege.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE auditd.message_type == "user_auth"
  | WHERE auditd.data.op == "PAM:authentication"
  | WHERE process.executable == "/usr/bin/sudo"
  | EVAL host_name    = host.hostname
  | EVAL actor        = COALESCE(user.audit.name, user.name)
  | EVAL terminal     = auditd.data.terminal
  | EVAL session_id   = auditd.session
  | EVAL result       = auditd.result
  | WHERE actor IS NOT NULL
  | STATS
      event_count   = COUNT(*),
      success_count = COUNT(auditd.result == "success"),
      fail_count    = COUNT(auditd.result == "fail"),
      host_names    = VALUES(host.hostname),
      actors        = VALUES(user.audit.name),
      terminals     = VALUES(auditd.data.terminal),
      session_ids   = VALUES(auditd.session),
      last_seen     = MAX(@timestamp),
      first_seen    = MIN(@timestamp)
    BY agent_id, host.hostname, user.audit.name
  | WHERE fail_count >= 2 AND success_count >= 1
  | EVAL
      host_name = host.hostname,
      actor     = user.audit.name
  | KEEP
      agent_id, host_name, actor, event_count,
      success_count, fail_count,
      host_names, actors, terminals,
      session_ids, last_seen, first_seen
  | SORT fail_count DESC
enabled: true
tags:
  - attack.credential-access
  - attack.t1110.001
  - detection.threat-hunting
severity: high
risk_score: 78
references:
  - "https://attack.mitre.org/techniques/T1110/001/"
nist: ["AC-7", "AC-6", "AU-12", "SI-4"]
pci_dss: ["8.1.6", "8.3", "10.2.4", "10.2.5"]
gdpr: ["32.1.b"]
mitre_attack:
