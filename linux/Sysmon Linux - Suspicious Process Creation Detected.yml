rule_id: 77e202c3-bc17-453a-add3-9a714c5bcd70
name_uz: "Linux Auth - sudo/SSH sessiyasi orqali shubhali buyruq"
name_ru: "Linux Auth - подозрительная команда через sudo/SSH-сессию"
name_en: "Linux Auth - Suspicious Command via sudo/SSH session"
description_uz: |
  Ushbu qoida Linux auth.log (logs-linux.auth-*) dagi sudo komandalari va SSH
  sessiyalaridagi shubhali buyruqlarni kuzatadi (shell spawn, nc/curl/wget, xavfli
  chmod rejimlari, foydalanuvchi qo'shish va h.k.). Bu execution yoki priv-esc
  texnikasiga ishora qilishi mumkin (T1204).
  Qonuniy holatlar: rejalashtirilgan skriptlar, deployment jarayonlari, servis yangilanishlari.
  SOC triage bosqichlari:
  - `actor` (user.name) va `process.command_line` (cmd) ni tekshiring.
  - Buyruq qaysi sessiya/manbadan ishga tushganini tahlil qiling.
  - `source.ip` legitimligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa: manbani cheklang, credentiallarni yangilang.
description_ru: |
  Это правило отслеживает подозрительные команды в командах sudo и в SSH-
  сессиях в Linux auth.log (logs-linux.auth-*) (запуск shell, nc/curl/wget, опасные
  режимы chmod, добавление пользователя и т.д.). Это может указывать на технику выполнения (execution)
  или повышения привилегий (priv-esc, T1204).
  Легитимные случаи: плановые скрипты, процессы развёртывания, обновления сервисов.
  Этапы SOC triage:
  - Проверьте `actor` (user.name) и `process.command_line` (cmd).
  - Проанализируйте, из какой сессии/источника была запущена команда.
  - Проверьте легитимность `source.ip`.
  - При подтверждении вредоносной активности: ограничьте источник, смените учётные данные.
description_en: |
  This rule monitors suspicious commands in sudo commands and SSH
  sessions in the Linux auth.log (logs-linux.auth-*) (shell spawn, nc/curl/wget, dangerous
  chmod modes, user creation, etc.). This may point to an execution or priv-esc
  technique (T1204).
  Legitimate cases: scheduled scripts, deployment processes, service updates.
  SOC triage steps:
  - Check `actor` (user.name) and `process.command_line` (cmd).
  - Analyze from which session/source the command was launched.
  - Verify the legitimacy of `source.ip`.
  - If malicious activity is confirmed: restrict the source, rotate credentials.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-linux.auth-*
query_language: esql
query: |
  FROM logs-linux.auth-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE data_stream.dataset == "linux.auth"
  | WHERE event.action == "ssh-login-success"
     OR event.action == "sudo-command"
  | EVAL actor       = COALESCE(user.name, "Unknown")
  | EVAL hostn       = COALESCE(host.hostname, "Unknown")
  | EVAL src_ip      = COALESCE(TO_STRING(source.ip), "Unknown")
  | EVAL cmd         = COALESCE(process.command_line, "Unknown")
  | EVAL working_dir = COALESCE(process.working_directory, "Unknown")
  | EVAL eff_user    = COALESCE(user.effective.name, "Unknown")
  /* Monitoring agentlarini chiqarib tashlash */
  | WHERE actor NOT IN ("wazuh", "zabbix", "nagios", "elastic")
  /* Shubhali shell/tool buyruqlari */
  | WHERE TO_LOWER(cmd) RLIKE ".*(bash|sh\\s|python|perl|ruby|nc\\s|ncat|netcat|wget|curl|chown|useradd|passwd|visudo|crontab).*"
  /* Xavfli chmod rejimlari (faqat 777/666 va setuid/setgid) */
     OR TO_LOWER(cmd) RLIKE ".*chmod\\s+(0?777|0?666|[24][0-7][0-7][0-7]).*"
  | STATS
      process_count = COUNT(*),
      commands      = VALUES(cmd),
      working_dirs  = VALUES(working_dir),
      eff_users     = VALUES(eff_user),
      src_ips       = VALUES(src_ip),
      hosts         = VALUES(hostn),
      first_seen    = MIN(@timestamp),
      last_seen     = MAX(@timestamp)
    BY agent_id, actor, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE process_count >= 2
  | KEEP agent_id, bucket, actor, process_count, commands,
         working_dirs, eff_users, src_ips, hosts, first_seen, last_seen
  | SORT process_count DESC
  | LIMIT 200
enabled: false
tags:
  - attack.execution
  - attack.t1204
  - detection.linux
  - linux.auth.sudo
severity: medium
risk_score: 55
nist: ["AU-2", "AU-12", "SI-3", "AC-7"]
pci_dss: ["10.2.4", "10.2.5"]
gdpr: ["32.1.a", "32.2"]
mitre_attack:
  TA0002:
    T1204: []