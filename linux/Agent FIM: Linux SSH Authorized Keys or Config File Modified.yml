rule_id: 0b598591-84d1-46a8-b7f8-5fedf5a79775
name_uz: "Agent FIM: Linux SSH authorized_keys yoki konfiguratsiya fayli o'zgartirildi"
name_ru: "Agent FIM: изменение SSH authorized_keys или файла конфигурации в Linux"
name_en: "Agent FIM: Linux SSH Authorized Keys or Config File Modified"
description_uz: |
  Ushbu qoida Persistence texnikasiga bog'liq bo'lib, SSH authorized_keys fayllari
  yoki SSH konfiguratsiya fayllarining o'zgarishini aniqlaydi.
  Hujumchi o'z SSH public kalitini qo'shib, tizimga parolsiz kirish imkoniyatini
  ta'minlashi mumkin — bu eng keng tarqalgan persistence texnikalaridan biri.
  Qonuniy holatlar: tizim administratori yangi SSH kalit qo'shishi, initial server setup.
  SOC triage bosqichlari:
  - `file.path` dagi foydalanuvchi home katalogini aniqlang — kimning kaliti o'zgargan.
  - O'zgarish vaqti (`file.mtime`) va kim login qilganini (`user_login` loglar) korrelatsiya qiling.
  - `file.hash.sha1` ni baseline bilan solishtiring.
  - Yangi qo'shilgan SSH kalitni tekshiring: `cat ~/.ssh/authorized_keys`.
  - `/etc/ssh/sshd_config` da `PermitRootLogin`, `PasswordAuthentication` o'zgarganmi.
  - Noqonuniy bo'lsa: ruxsatsiz kalitni o'chiring, SSH serverni restart qiling.
description_ru: |
  Данное правило связано с техникой Persistence и обнаруживает изменение файлов
  SSH authorized_keys или файлов конфигурации SSH.
  Атакующий может добавить свой публичный ключ SSH и обеспечить себе беспарольный
  доступ к системе — это одна из самых распространённых техник закрепления.
  Легитимные случаи: системный администратор добавляет новый ключ SSH, initial server setup.
  Этапы SOC-триажа:
  - Определите домашний каталог пользователя в `file.path` — чей ключ был изменён.
  - Сопоставьте время изменения (`file.mtime`) и то, кто выполнял вход (логи `user_login`).
  - Сравните `file.hash.sha1` с baseline.
  - Проверьте вновь добавленный ключ SSH: `cat ~/.ssh/authorized_keys`.
  - Изменились ли `PermitRootLogin`, `PasswordAuthentication` в `/etc/ssh/sshd_config`.
  - Если нелегитимно: удалите несанкционированный ключ, перезапустите сервер SSH.
description_en: |
  This rule is related to the Persistence technique and detects modification of SSH
  authorized_keys files or SSH configuration files.
  An attacker may add their own SSH public key and thereby obtain passwordless access
  to the system — this is one of the most common persistence techniques.
  Legitimate cases: a system administrator adding a new SSH key, initial server setup.
  SOC triage steps:
  - Identify the user home directory in `file.path` — whose key was changed.
  - Correlate the modification time (`file.mtime`) with who logged in (`user_login` logs).
  - Compare `file.hash.sha1` against the baseline.
  - Check the newly added SSH key: `cat ~/.ssh/authorized_keys`.
  - Whether `PermitRootLogin`, `PasswordAuthentication` changed in `/etc/ssh/sshd_config`.
  - If illegitimate: remove the unauthorized key, restart the SSH server.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.module == "file_integrity"
  | WHERE event.type == "change"
  | WHERE host.os.type == "linux"
  | WHERE
      file.path LIKE "*/.ssh/authorized_keys"
      OR file.path LIKE "*/.ssh/authorized_keys2"
      OR file.path LIKE "/etc/ssh/sshd_config"
      OR file.path LIKE "/etc/ssh/ssh_config"
      OR file.path LIKE "*/.ssh/config"
      OR file.path LIKE "/root/.ssh/*"
  | EVAL host_name   = host.hostname
  | EVAL file_path   = file.path
  | EVAL file_name   = file.name
  | EVAL file_owner  = file.owner
  | EVAL file_mode   = file.mode
  | EVAL file_hash   = file.hash.sha1
  | EVAL file_size   = file.size
  | EVAL file_mtime  = file.mtime
  | EVAL action      = event.action
  | STATS
      event_count  = COUNT(*),
      host_names   = VALUES(host.hostname),
      file_paths   = VALUES(file.path),
      file_names   = VALUES(file.name),
      file_owners  = VALUES(file.owner),
      file_modes   = VALUES(file.mode),
      file_hashes  = VALUES(file.hash.sha1),
      file_sizes   = VALUES(file.size),
      actions      = VALUES(event.action),
      last_seen    = MAX(@timestamp),
      first_seen   = MIN(@timestamp)
    BY agent_id, host.hostname, file.path
  | WHERE event_count >= 1
  | EVAL
      host_name = host.hostname,
      file_path = file.path
  | KEEP
      agent_id, host_name, file_path, event_count,
      host_names, file_paths, file_names, file_owners,
      file_modes, file_hashes, file_sizes,
      actions, last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - attack.persistence
  - attack.lateral-movement
  - attack.t1098.004
  - attack.t1021.004
  - detection.threat-hunting
severity: critical
risk_score: 88
references:
