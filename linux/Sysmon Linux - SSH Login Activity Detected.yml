rule_id: d4411e69-12d7-479f-a4a8-019d0b8c9808
name_uz: "Linux Auth - SSH kirish faoliyati"
name_ru: "Linux Auth - активность SSH-входов"
name_en: "Linux Auth - SSH Login Activity"
description_uz: |
  Ushbu qoida Linux auth.log (logs-linux.auth-*) dagi SSH kirish va chiqish hodisalarini kuzatadi.
  sshd tomonidan qayd etilgan muvaffaqiyatli va muvaffaqiyatsiz SSH urinishlari, noma'lum
  foydalanuvchilar hamda session ochilish/yopilish hodisalari monitoring qilinadi.
  Bu qoida asosan audit va visibility maqsadida low severity darajasida belgilangan.
  Qonuniy holatlar: administratorlar, DevOps, servis akkauntlarining oddiy SSH kirishlari.
  SOC triage bosqichlari:
  - `actor` (user.name) va `source.ip` ni tekshiring.
  - GeoIP ma'lumotlarini (`source.geo`) tekshiring — noodatiy mamlakat/shahardan kirish bormi.
  - Muvaffaqiyatsiz urinishlar soni ortib borayotgan bo'lsa brute-force ehtimolini ko'rib chiqing.
  - `event.outcome` failure bo'lsa va takrorlanayotgan bo'lsa escalation bajaring.
description_ru: |
  Это правило отслеживает события входа и выхода SSH в Linux auth.log (logs-linux.auth-*).
  Мониторятся успешные и неуспешные попытки SSH, зафиксированные sshd, неизвестные
  пользователи, а также события открытия/закрытия сессий.
  Правилу присвоен уровень low severity, оно предназначено в основном для аудита и видимости.
  Легитимные случаи: обычные SSH-входы администраторов, DevOps и сервисных учётных записей.
  Этапы SOC triage:
  - Проверьте `actor` (user.name) и `source.ip`.
  - Проверьте данные GeoIP (`source.geo`) — нет ли входа из необычной страны/города.
  - Если число неуспешных попыток растёт, рассмотрите вероятность перебора паролей (brute-force).
  - Если `event.outcome` равен failure и повторяется, выполните эскалацию.
description_en: |
  This rule monitors SSH login and logout events in the Linux auth.log (logs-linux.auth-*).
  Successful and failed SSH attempts recorded by sshd, unknown
  users and session open/close events are monitored.
  This rule is set at low severity mainly for audit and visibility purposes.
  Legitimate cases: routine SSH logins by administrators, DevOps and service accounts.
  SOC triage steps:
  - Check `actor` (user.name) and `source.ip`.
  - Check GeoIP data (`source.geo`) — whether the login comes from an unusual country/city.
  - If the number of failed attempts is growing, consider the possibility of brute-force.
  - If `event.outcome` is failure and it repeats, escalate.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-linux.auth-*
query_language: esql
query: |
  FROM logs-linux.auth-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE data_stream.dataset == "linux.auth"
  | WHERE event.category == "authentication"
     OR event.category == "session"
  | WHERE event.action IN (
      "ssh-login-success",
      "ssh-login-failed",
      "ssh-invalid-user",
      "ssh-session-start",
      "ssh-session-end"
    )
  | EVAL actor       = COALESCE(user.name, "Unknown")
  | EVAL hostn       = COALESCE(host.hostname, "Unknown")
  | EVAL src_ip      = COALESCE(TO_STRING(source.ip), "Unknown")
  | EVAL src_port    = COALESCE(source.port, 0)
  | EVAL outcome     = COALESCE(event.outcome, "Unknown")
  | EVAL action      = COALESCE(event.action, "Unknown")
  | EVAL geo_city    = COALESCE(source.geo.city_name, "Unknown")
  | EVAL geo_country = COALESCE(source.geo.country_name, "Unknown")
  | STATS
      event_count    = COUNT(*),
      success_count  = COUNT_IF(outcome == "success"),
      failure_count  = COUNT_IF(outcome == "failure"),
      actions        = VALUES(action),
      src_ips        = VALUES(src_ip),
      src_ports      = VALUES(src_port),
      geo_cities     = VALUES(geo_city),
      geo_countries  = VALUES(geo_country),
      hosts          = VALUES(hostn),
      first_seen     = MIN(@timestamp),
      last_seen      = MAX(@timestamp)
    BY agent_id, actor, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, actor, event_count, success_count,
         failure_count, actions, src_ips, src_ports, geo_cities, geo_countries,
         hosts, first_seen, last_seen
  | SORT event_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.initial_access
  - attack.t1078
  - detection.linux
  - linux.auth.ssh
severity: low
risk_score: 21
nist: ["AU-2", "AU-12", "AC-17", "IA-2"]
pci_dss: ["10.2.1", "10.2.4", "10.2.5", "8.1.6"]
gdpr: ["32.1.a", "32.2"]
mitre_attack:
  TA0001:
    T1078: []