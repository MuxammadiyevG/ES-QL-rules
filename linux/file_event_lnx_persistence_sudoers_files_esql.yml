rule_id: 442ab540-3396-409c-bf12-8e031124bc7e
name_uz: "Sudoers fayllari orqali mustahkamlanish (persistence)"
name_ru: "Закрепление через файлы sudoers"
name_en: "Persistence via Sudoers Files"
description_uz: |
  /etc/sudoers.d/ ichida sudoers fayllari yaratilishini aniqlaydi.
  Tajovuzkorlar imtiyozlarni oshirish yoki mustahkamlanish uchun sudoers fayllarini qo'shishi mumkin.
description_ru: |
  Обнаруживает создание файлов sudoers в /etc/sudoers.d/.
  Злоумышленники могут добавлять файлы sudoers для повышения привилегий или закрепления.
description_en: |
  Detects creation of sudoers files in /etc/sudoers.d/.
  Adversaries may add sudoers files to escalate privileges or persist.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* file creation events */
  | WHERE event.category == "file" AND event.type == "creation"
  /* selection: sudoers.d */
  | WHERE TO_LOWER(file.path) RLIKE "/etc/sudoers\\.d/.*"
  /* Filter: exclude OS package managers */
  | WHERE NOT (process.name IN ("dpkg", "yum", "dnf", "apt", "dockerd", "ansible-playbook"))
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      file_paths = VALUES(file.path),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, file_paths, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1548.003
severity: medium
risk_score: 60
references:
  - "https://github.com/h3xduck/TripleCross"
nist: ["SI-4", "AU-12", "AC-6"]
pci_dss: ["10.2", "7.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0004:
    T1548: ["T1548.003"]
