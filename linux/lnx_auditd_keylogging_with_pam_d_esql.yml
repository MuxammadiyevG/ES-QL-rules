rule_id: 642dd105-733e-43bf-a10a-19b424586464
name: "Keylogging via PAM Configuration"
description: |
  Detects attempts to enable TTY auditing via PAM configuration.
  Adversaries may enable TTY auditing to record keystrokes (keylogging).
  Monitors both modifications to /etc/pam.d/ files and TTY/USER_TTY events.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd PATH or TTY events */
  /* selection 1: PAM config modification */
  | WHERE (
      auditd.message_type == "path"
      AND auditd.data.name IN ("/etc/pam.d/system-auth", "/etc/pam.d/password-auth")
    )
    /* selection 2: TTY events (indicating keystroke logging active) */
    OR auditd.message_type IN ("tty", "user_tty")
  /* Filter out known TTY noise if needed by agent_id, aggregation */
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      file_paths = VALUES(auditd.data.name),
      message_types = VALUES(auditd.message_type),
      hosts = VALUES(host.hostname),
      raw_samples = VALUES(event.original)
    BY agent_id, host.hostname, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.hostname, user.name, event_count, users, processes, file_paths, message_types, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.collection
  - attack.credential-access
  - attack.t1056.001
severity: high
risk_score: 75
references:
  - "https://attack.mitre.org/techniques/T1056/001/"
nist: ["SI-4", "AU-12", "AC-2"]
pci_dss: ["10.2", "8.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0009:
    T1056: ["T1056.001"]
