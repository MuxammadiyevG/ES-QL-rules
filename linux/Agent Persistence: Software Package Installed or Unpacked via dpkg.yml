rule_id: f0758664-b86e-4fa8-a9c0-8e5090afdeae
name_uz: "Agent Persistence: dpkg orqali dasturiy paket o'rnatildi yoki ochildi"
name_ru: "Agent Persistence: Программный пакет установлен или распакован через dpkg"
name_en: "Agent Persistence: Software Package Installed or Unpacked via dpkg"
description_uz: |
  Ushbu qoida Persistence va Defense Evasion texnikalariga bog'liq bo'lib, dpkg orqali
  paket o'rnatish operatsiyalarini aniqlaydi. Hujumchi zararli paket o'rnatib, tizimga
  backdoor yoki rootkit kiritishi mumkin.
  Qonuniy holatlar: tizim yangilanishi (apt upgrade), ma'mur tomonidan o'rnatish.
  SOC triage bosqichlari:
  - `process.title` dagi paket nomini tekshiring — `/var/cache/apt/archives/` da kutilgan paketmi.
  - O'rnatish vaqtini (`@timestamp`) rejalashtirilgan maintenance window bilan solishtiring.
  - `auditd.data.tty` interaktiv bo'lsa — kim o'rnatganini aniqlang.
  - `auditd.summary.actor.primary` = unset bo'lsa — avtomatik (unattended-upgrades yoki skript).
  - Kutilmagan paket nomi yoki manba bo'lsa — paket hash ni tekshiring.
  - Noqonuniy bo'lsa: paketni olib tashlang (`dpkg --remove`), tizimni skan qiling.
description_ru: |
  Это правило связано с техниками Persistence и Defense Evasion и выявляет операции установки
  пакетов через dpkg. Злоумышленник может установить вредоносный пакет и внедрить в систему
  backdoor или rootkit.
  Легитимные случаи: обновление системы (apt upgrade), установка администратором.
  Шаги SOC-триажа:
  - Проверьте имя пакета в `process.title` — является ли это ожидаемым пакетом в `/var/cache/apt/archives/`.
  - Сопоставьте время установки (`@timestamp`) с запланированным maintenance window.
  - Если `auditd.data.tty` интерактивный — определите, кто выполнил установку.
  - Если `auditd.summary.actor.primary` = unset — установка автоматическая (unattended-upgrades или скрипт).
  - Если имя пакета или источник неожиданные — проверьте hash пакета.
  - Если нелегитимно: удалите пакет (`dpkg --remove`), просканируйте систему.
description_en: |
  This rule is related to Persistence and Defense Evasion techniques and detects package
  installation operations via dpkg. An attacker may install a malicious package and introduce
  a backdoor or rootkit into the system.
  Legitimate cases: system update (apt upgrade), installation by an administrator.
  SOC triage steps:
  - Check the package name in `process.title` — is it an expected package in `/var/cache/apt/archives/`.
  - Compare the installation time (`@timestamp`) with the planned maintenance window.
  - If `auditd.data.tty` is interactive — determine who installed it.
  - If `auditd.summary.actor.primary` = unset — it is automated (unattended-upgrades or a script).
  - If the package name or source is unexpected — check the package hash.
  - If illegitimate: remove the package (`dpkg --remove`), scan the system.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE auditd.message_type == "syscall"
  | WHERE auditd.data.syscall IN ("fchown", "fchmod")
  | WHERE process.executable == "/usr/bin/dpkg"
  | WHERE auditd.result == "success"
  | EVAL host_name    = host.hostname
  | EVAL actor        = COALESCE(auditd.summary.actor.primary, user.name)
  | EVAL proc_title   = process.title
  | EVAL tty          = auditd.data.tty
  | EVAL syscall      = auditd.data.syscall
  | EVAL file_inode   = auditd.paths.inode
  | EVAL file_mode    = auditd.paths.mode
  | EVAL parent_pid   = process.parent.pid
  | WHERE proc_title IS NOT NULL
  | STATS
      event_count   = COUNT(*),
      host_names    = VALUES(host.hostname),
      actors        = VALUES(user.name),
      proc_titles   = VALUES(process.title),
      ttys          = VALUES(auditd.data.tty),
      syscalls      = VALUES(auditd.data.syscall),
      file_inodes   = VALUES(auditd.paths.inode),
      file_modes    = VALUES(auditd.paths.mode),
      last_seen     = MAX(@timestamp),
      first_seen    = MIN(@timestamp)
    BY agent_id, host.hostname, process.title, auditd.data.tty
  | WHERE event_count >= 2
  | EVAL
      host_name   = host.hostname,
      proc_title  = process.title,
      tty         = auditd.data.tty
  | KEEP
      agent_id, host_name, proc_title, tty, event_count,
      host_names, actors, proc_titles, syscalls,
      file_inodes, file_modes, last_seen, first_seen
  | SORT event_count DESC
enabled: true
tags:
  - attack.persistence
  - attack.defense-evasion
  - attack.t1072
  - attack.t1195.002
  - detection.threat-hunting
severity: medium
risk_score: 50
references:
  - "https://attack.mitre.org/techniques/T1072/"
  - "https://attack.mitre.org/techniques/T1195/002/"
nist: ["CM-7", "CM-11", "SI-7", "AU-12"]
pci_dss: ["6.3.1", "6.3.2", "10.2.7"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0003:
    T1072: []
  TA0040:
    T1195: ["T1195.002"]