rule_id: 0e26001a-8c7e-4957-907e-c25fcd0ddb2e
name_uz: "Profile katalogida shubhali shell skript"
name_ru: "Подозрительный shell-скрипт в каталоге profile"
name_en: "Suspicious Shell Script in Profile Directory"
description_uz: |
  /etc/profile.d/ ichida shell skriptlar (.sh, .csh) yaratilishini aniqlaydi.
  Bu katalogdagi skriptlar foydalanuvchilar tizimga kirganda bajariladi va mustahkamlanish (persistence) tekshiruvlarini ta'minlaydi.
description_ru: |
  Обнаруживает создание shell-скриптов (.sh, .csh) в /etc/profile.d/.
  Скрипты в этом каталоге выполняются при входе пользователей в систему, что обеспечивает проверки закрепления.
description_en: |
  Detects creation of shell scripts (.sh, .csh) in /etc/profile.d/.
  Scripts in this directory are executed when users log in, providing persistence checks.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* file creation events */
  | WHERE event.category == "file" AND event.type == "creation"
  /* selection: profile.d and script extension */
  | WHERE TO_LOWER(file.path) RLIKE "/etc/profile\\.d/.*\\.(sh|csh)"
  /* Filter: exclude OS package managers */
  | WHERE NOT (process.name IN ("dpkg", "yum", "dnf", "apt", "dockerd", "ansible-playbook"))
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      file_paths = VALUES(file.path),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, file_paths, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.persistence
  - attack.t1546.002
severity: medium
risk_score: 55
references:
  - "https://blogs.jpcert.or.jp/en/2023/05/gobrat.html"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0003:
    T1546: ["T1546.002"]
