rule_id: d8958f34-0a9b-4aeb-98c2-72da35d6a1a5
name_uz: "Parol siyosatini aniqlash (discovery)"
name_ru: "Разведка политики паролей"
name_en: "Password Policy Discovery"
description_uz: |
  Parol siyosatlarini ko'rish uchun ishlatiladigan buyruqlarni aniqlaydi.
  Tajovuzkorlar foydalanuvchi hisoblarini samaraliroq nishonga olish uchun parol siyosatlarini tekshiradi.
  chage, passwd buyruqlarini va siyosat fayllariga kirishni kuzatadi.
description_ru: |
  Обнаруживает команды, используемые для просмотра политик паролей.
  Злоумышленники проверяют политики паролей, чтобы эффективнее выбирать целевые учётные записи.
  Отслеживает команды chage, passwd и доступ к файлам политик.
description_en: |
  Detects commands used to inspect password policies.
  Adversaries check password policies to target user accounts more effectively.
  Monitors chage, passwd commands and access to policy files.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd EXECVE or PATH */
  /* selection 1: commands */
  | WHERE (
      (process.name == "chage" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*(-l|--list).*")
      OR (process.name == "passwd" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*(-s|--status).*")
    )
    /* selection 2: file access */
    OR (
      event.action == "opened-file"
      AND file.path IN (
        "/etc/login.defs",
        "/etc/pam.d/auth",
        "/etc/pam.d/common-account",
        "/etc/pam.d/common-auth",
        "/etc/pam.d/common-password",
        "/etc/pam.d/system-auth",
        "/etc/security/pwquality.conf"
      )
    )
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      file_paths = VALUES(file.path),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  /* Threshold increased to 3 to reduce FPs from admin scripts */
  | WHERE event_count >= 3
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, file_paths, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.discovery
  - attack.t1201
severity: low
risk_score: 30
references:
  - "https://attack.mitre.org/techniques/T1201/"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0007:
    T1201: []
