rule_id: 26cb3cba-87cd-435d-bb4d-3eb8c6c22d65
name_uz: "Audit konfiguratsiyasi o'zgarishlarini aniqlash"
name_ru: "Обнаружение изменений конфигурации аудита"
name_en: "Auditing Configuration Changes Detection"
description_uz: |
  auditd konfiguratsiya fayllaridagi o'zgarishlarni aniqlaydi.
  Tajovuzkorlar aniqlanishdan qochish uchun audit konfiguratsiyalarini o'zgartirishi mumkin.
  /etc/audit/auditd.conf faylidagi o'zgarishlarni kuzatadi.
description_ru: |
  Обнаруживает изменения в конфигурационных файлах auditd.
  Злоумышленники могут изменять конфигурации аудита для обхода обнаружения.
  Отслеживает изменения в /etc/audit/auditd.conf.
description_en: |
  Detects changes to auditd configuration files.
  Adversaries may modify audit configurations to evade detection.
  Monitors /etc/audit/auditd.conf for modifications.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd PATH type events */
  | WHERE event.action == "opened-file"
  /* selection: auditd configuration file */
  | WHERE file.path == "/etc/audit/auditd.conf"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      executables = VALUES(process.executable),
      file_operations = VALUES(event.action),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, executables, file_operations, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.defense-evasion
  - attack.t1562.006
  - detection.threat-hunting
severity: high
risk_score: 75
references:
  - "https://attack.mitre.org/techniques/T1562/006/"
nist: ["SI-4", "AU-12", "AU-6"]
pci_dss: ["10.2", "10.5"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1562: ["T1562.006"]
