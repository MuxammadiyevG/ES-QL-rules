rule_id: a63bfbeb-4323-412e-a28b-49c088c4f4b1
name_uz: "Unix shell konfiguratsiyasining o'zgartirilishi"
name_ru: "Изменение конфигурации Unix shell"
name_en: "Unix Shell Configuration Modification"
description_uz: |
  Unix shell konfiguratsiya fayllarining o'zgartirilishini aniqlaydi.
  Tajovuzkorlar mustahkamlanish (persistence) o'rnatish uchun shell konfiguratsiya fayllarini (.bashrc, .profile va h.k.) o'zgartirishi mumkin.
  Keng tarqalgan shell konfiguratsiya fayllaridagi o'zgarishlarni kuzatadi.
description_ru: |
  Обнаруживает изменение конфигурационных файлов Unix shell.
  Злоумышленники могут изменять конфигурационные файлы shell (.bashrc, .profile и т.д.) для закрепления.
  Отслеживает изменения в распространённых конфигурационных файлах shell.
description_en: |
  Detects modification of Unix shell configuration files.
  Adversaries may modify shell configuration files (.bashrc, .profile, etc.) to establish persistence.
  Monitors common shell configuration files for modifications.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd PATH type events */
  | WHERE event.action == "opened-file"
  /* selection: shell configuration files */
  | WHERE (
      TO_LOWER(file.path) RLIKE ".*/\\.bashrc"
      OR TO_LOWER(file.path) RLIKE ".*/\\.bash_profile"
      OR TO_LOWER(file.path) RLIKE ".*/\\.profile"
      OR TO_LOWER(file.path) RLIKE ".*/\\.zshrc"
      OR TO_LOWER(file.path) RLIKE ".*/\\.kshrc"
      OR file.path == "/etc/profile"
      OR TO_LOWER(file.path) RLIKE "/etc/profile\\.d/.*"
    )
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      executables = VALUES(process.executable),
      file_paths = VALUES(file.path),
      file_operations = VALUES(event.action),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, executables, file_paths, file_operations, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1546.004
  - detection.threat-hunting
severity: medium
risk_score: 60
references:
  - "https://attack.mitre.org/techniques/T1546/004/"
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2", "2.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0003:
    T1546: ["T1546.004"]
  TA0004:
    T1546: ["T1546.004"]
