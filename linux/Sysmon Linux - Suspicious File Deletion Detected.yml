rule_id: 517d2ffe-9af4-4da0-9c75-53c4cf8d268e
name_uz: "Linux Auth - sudo orqali shubhali fayl o'chirish"
name_ru: "Linux Auth - подозрительное удаление файлов через sudo"
name_en: "Linux Auth - Suspicious File Deletion via sudo"
description_uz: |
  Ushbu qoida Linux auth.log (logs-linux.auth-*) dagi sudo komandalarini kuzatib,
  fayl o'chiruvchi buyruqlar (rm/shred/unlink/truncate) muhim kataloglarda (/var/log,
  /etc) imtiyoz bilan ishlatilishini aniqlaydi. Bu indicator removal (T1107) yoki
  data destruction (T1485) texnikalariga ishora qilishi mumkin.
  Qonuniy holatlar: rejalashtirilgan cleanup skriptlari, disk space management.
  SOC triage bosqichlari:
  - `actor` (user.name) va `user.effective.name` ni tekshiring.
  - O'chirilgan fayl yo'lini (`process.command_line`) tahlil qiling.
  - Log fayllari yoki konfiguratsiya fayllar o'chirilganini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa: backup dan tiklang, manbani cheklang.
description_ru: |
  Это правило отслеживает команды sudo в Linux auth.log (logs-linux.auth-*) и выявляет
  запуск команд удаления файлов (rm/shred/unlink/truncate) с привилегиями в важных
  каталогах (/var/log, /etc). Это может указывать на удаление индикаторов (indicator removal, T1107) или
  уничтожение данных (data destruction, T1485).
  Легитимные случаи: плановые скрипты очистки, управление дисковым пространством.
  Этапы SOC triage:
  - Проверьте `actor` (user.name) и `user.effective.name`.
  - Проанализируйте путь удалённого файла (`process.command_line`).
  - Проверьте, не были ли удалены файлы журналов или конфигурационные файлы.
  - При подтверждении вредоносной активности: восстановите из резервной копии, ограничьте источник.
description_en: |
  This rule monitors sudo commands in the Linux auth.log (logs-linux.auth-*) and detects
  file-deleting commands (rm/shred/unlink/truncate) being run with privileges in critical
  directories (/var/log, /etc). This may point to indicator removal (T1107) or
  data destruction (T1485) techniques.
  Legitimate cases: scheduled cleanup scripts, disk space management.
  SOC triage steps:
  - Check `actor` (user.name) and `user.effective.name`.
  - Analyze the deleted file path (`process.command_line`).
  - Check whether log files or configuration files were deleted.
  - If malicious activity is confirmed: restore from backup, restrict the source.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-linux.auth-*
query_language: esql
query: |
  FROM logs-linux.auth-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE data_stream.dataset == "linux.auth"
  | WHERE event.action == "sudo-command"
  | EVAL actor       = COALESCE(user.name, "Unknown")
  | EVAL hostn       = COALESCE(host.hostname, "Unknown")
  | EVAL src_ip      = COALESCE(TO_STRING(source.ip), "Unknown")
  | EVAL cmd         = COALESCE(process.command_line, "Unknown")
  | EVAL working_dir = COALESCE(process.working_directory, "Unknown")
  | EVAL eff_user    = COALESCE(user.effective.name, "Unknown")
  /* Monitoring agentlarini chiqarib tashlash */
  | WHERE actor NOT IN ("wazuh", "zabbix")
  /* Shubhali o'chirish komandalari (esp. /var/log /etc) */
  | WHERE TO_LOWER(cmd) RLIKE ".*(rm\\s|shred\\s|wipe\\s|unlink\\s|truncate\\s).*"
  | WHERE TO_LOWER(cmd) RLIKE ".*(/var/log|/etc|-rf|-fr).*"
  | STATS
      delete_count = COUNT(*),
      commands     = VALUES(cmd),
      working_dirs = VALUES(working_dir),
      eff_users    = VALUES(eff_user),
      src_ips      = VALUES(src_ip),
      hosts        = VALUES(hostn),
      first_seen   = MIN(@timestamp),
      last_seen    = MAX(@timestamp)
    BY agent_id, actor, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE delete_count >= 2
  | KEEP agent_id, bucket, actor, delete_count, commands,
         working_dirs, eff_users, src_ips, hosts, first_seen, last_seen
  | SORT delete_count DESC
  | LIMIT 200
enabled: false
tags:
  - attack.defense_evasion
  - attack.impact
  - attack.t1107
  - attack.t1485
  - detection.linux
  - linux.auth.sudo
severity: high
risk_score: 75
nist: ["AU-2", "AU-12", "CP-9", "SI-12"]
pci_dss: ["10.2.4", "10.5.5", "12.10.5"]
gdpr: ["32.1.a", "32.2"]
mitre_attack:
  TA0005:
    T1107: []
  TA0040:
    T1485: []