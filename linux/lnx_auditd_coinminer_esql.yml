rule_id: 6dd0211f-c8f7-4a83-930f-3889e74ee75b
name_uz: "Ehtimoliy coin miner CPU prioritetini aniqlash"
name_ru: "Возможное обнаружение приоритета CPU коин-майнера"
name_en: "Possible Coin Miner CPU Priority Detection"
description_uz: |
  Coin minerlar bilan juda tez-tez ishlatiladigan buyruq qatori parametrini aniqlaydi.
  XMRig kabi kriptovalyuta minerlari CPU dan foydalanish va prioritetni boshqarish uchun --cpu-priority bayrog'idan foydalanadi.
  Bu bayroq odatda cryptojacking va ruxsatsiz mayning faoliyatida uchraydi.
  Eslatma: bu bayroqdan foydalanadigan jarayonlarni boshqa mayning indikatorlari bilan birgalikda kuzating.
description_ru: |
  Обнаруживает параметр командной строки, очень часто используемый коин-майнерами.
  Криптовалютные майнеры вроде XMRig используют флаг --cpu-priority для управления загрузкой и приоритетом CPU.
  Этот флаг обычно встречается при cryptojacking и несанкционированном майнинге.
  Примечание: отслеживайте процессы с этим флагом в сочетании с другими индикаторами майнинга.
description_en: |
  Detects command line parameter very often used with coin miners.
  Cryptocurrency miners like XMRig use the --cpu-priority flag to control CPU usage and priority.
  This flag is commonly seen in cryptojacking and unauthorized mining activities.
  Note: Monitor for processes using this flag in conjunction with other mining indicators.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd execve telemetry */
  | WHERE event.action == "executed"
  /* selection: --cpu-priority flag in any argument position */
  | WHERE TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*--cpu-priority.*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      executables = VALUES(process.executable),
      parent_processes = VALUES(process.parent.pid),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, executables, parent_processes, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.privilege-escalation
  - attack.t1496
  - detection.threat-hunting
severity: critical
risk_score: 85
references:
  - "https://xmrig.com/docs/miner/command-line-options"
  - "https://attack.mitre.org/techniques/T1496/"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2", "10.6"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0040:
    T1496: []
