rule_id: 5b49710e-f6ff-48fd-9eb4-84187b225558
name_uz: "Fayllarni bo'laklarga ajratishni aniqlash (split buyrug'i)"
name_ru: "Обнаружение разбиения файлов (команда split)"
name_en: "File Splitting Detection (split command)"
description_uz: |
  Fayllarni bo'laklarga ajratish uchun split buyrug'idan foydalanishni aniqlaydi.
  Tajovuzkorlar hajmga asoslangan aniqlashdan qochish yoki eksfiltratsiyani osonlashtirish uchun fayllarni bo'laklarga ajratishi mumkin.
description_ru: |
  Обнаруживает использование команды split для разбиения файлов на части.
  Злоумышленники могут разбивать файлы, чтобы обойти обнаружение по размеру или облегчить эксфильтрацию.
description_en: |
  Detects usage of the split command to split files into pieces.
  Adversaries may split files to evade size-based detection or facilitate exfiltration.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd SYSCALL events */
  /* selection: split execution */
  | WHERE auditd.summary.how == "/usr/bin/split" OR auditd.summary.how RLIKE ".*/split" AND NOT auditd.summary.how RLIKE ".*dpkg-split.*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      executables = VALUES(auditd.summary.how),
      hosts = VALUES(host.hostname)
    BY agent_id, host.hostname, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.hostname, user.name, event_count, users, executables, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.exfiltration
  - attack.t1030
severity: low
risk_score: 30
references:
  - "https://attack.mitre.org/techniques/T1030/"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0010:
    T1030: []
