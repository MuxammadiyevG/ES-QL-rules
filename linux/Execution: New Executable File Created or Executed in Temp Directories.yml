rule_id: 017c1be5-9005-446d-bd9a-33adc87cb7e0
name: "Execution: New Executable File Created or Executed in Temp Directories"
description: |
  Ushbu qoida `/tmp`, `/dev/shm`, `/var/tmp` kataloglari ichida yangi fayl
  yaratilishi, yozilishi yoki u yerdan executable ishga tushirilishini aniqlaydi.

type: esql
params: "{}"
schedule_interval: 10m

index:
  - logs-updive.audit-*

query_language: esql

query: |
  FROM logs-updive.audit-*
     | WHERE service.type == "auditd"
     | WHERE @timestamp >= NOW() - 10 minute
       AND auditd.message_type == "syscall"
       AND auditd.data.syscall IN ("execve", "open", "openat", "creat")
       AND (
         file.path RLIKE "^/(tmp|var/tmp|dev/shm)/.*"
         OR auditd.summary.object.primary RLIKE "^/(tmp|var/tmp|dev/shm)/.*"
         OR process.executable RLIKE "^/(tmp|var/tmp|dev/shm)/.*"
         OR process.working_directory IN ("/tmp", "/var/tmp", "/dev/shm")
       )
     | EVAL
         actor_user = auditd.summary.actor.primary,
         actor_effective_user = auditd.summary.actor.secondary,

         raw_target = CASE(
           file.path RLIKE "^/(tmp|var/tmp|dev/shm)/.*", file.path,
           auditd.summary.object.primary RLIKE "^/(tmp|var/tmp|dev/shm)/.*", auditd.summary.object.primary,
           process.executable
         ),

         target_file = raw_target,

         temp_directory = CASE(
           raw_target RLIKE "^/tmp/.*", "/tmp",
           raw_target RLIKE "^/var/tmp/.*", "/var/tmp",
           raw_target RLIKE "^/dev/shm/.*", "/dev/shm",
           process.working_directory
         ),

         activity_type = CASE(
           auditd.data.syscall == "execve", "file_executed",
           auditd.data.syscall == "creat", "file_created",
           auditd.data.syscall IN ("open", "openat"), "file_accessed",
           "file_activity"
         ),

         process_name = process.name,
         process_path = process.executable,
         command_line = process.title,
         host_name = host.hostname,
         session_id = auditd.session,

         detection_reason = CASE(
           activity_type == "file_executed", "Executable or script launched from temp directory",
           activity_type == "file_created", "File created in temp directory",
           activity_type == "file_accessed", "File accessed in temp directory",
           "Suspicious temp directory file activity"
         )

     | STATS
         first_seen = MIN(@timestamp),
         last_seen = MAX(@timestamp),
         event_count = COUNT(*)
       BY
         actor_user,
         agent_id,
         actor_effective_user,
         target_file,
         temp_directory,
         activity_type,
         process_name,
         process_path,
         command_line,
         host_name,
         session_id,
         detection_reason
     | SORT last_seen DESC

enabled: true

tags:
  - attack.execution
  - attack.defense-evasion
  - attack.persistence
  - attack.t1059
  - attack.t1105
  - linux
  - temp-directory
  - executable
  - auditd

severity: high
risk_score: 80

references:
  - "https://attack.mitre.org/techniques/T1059/"
  - "https://attack.mitre.org/techniques/T1105/"

nist: ["AU-2", "AU-6", "AU-12", "CM-3", "CM-5", "CM-7", "SI-4", "SI-7"]

pci_dss: ["10.2.1", "10.4.1"]

gdpr: ["32.1.b", "32.1.d"]

mitre_attack:
  TA0002:
    T1059: []
