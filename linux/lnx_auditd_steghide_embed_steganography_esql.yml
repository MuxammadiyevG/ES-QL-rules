rule_id: 092b7846-9d70-46eb-bc0a-19135fd07d21
name_uz: "Steghide bilan steganografiya joylash"
name_ru: "Встраивание данных стеганографией Steghide"
name_en: "Steghide Embed Steganography"
description_uz: |
  Rasmlarga ma'lumot joylash uchun steghide'dan foydalanishni aniqlaydi.
description_ru: |
  Обнаруживает использование steghide для встраивания данных в изображения.
description_en: |
  Detects usage of steghide to embed data in images.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE event.action == "executed"
  | WHERE process.name == "steghide" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*embed.*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.defense-evasion
  - attack.t1027.003
severity: medium
risk_score: 60
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1027: ["T1027.003"]
