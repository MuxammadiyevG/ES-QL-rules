rule_id: 58a8d551-c6d9-4701-8cd8-cd440db32639
name_uz: "Agent Credential Access: Masofaviy Hostdan SSH Login Muvaffaqiyatsizligi"
name_ru: "Agent Credential Access: неудачный вход по SSH с удалённого хоста"
name_en: "Agent Credential Access: SSH Login Failure from Remote Host"
description_uz: |
  Ushbu qoida Credential Access texnikasiga bog'liq bo'lib, tashqi IP manzildan SSH orqali
  muvaffaqiyatsiz login urinishlarini aniqlaydi. Bu SSH password brute force yoki
  noto'g'ri credentials bilan ulanish urinishi belgisi bo'lishi mumkin.
  Qonuniy holatlar: foydalanuvchi parolini unutib xato kiritishi, SSH key mismatch.
  SOC triage bosqichlari:
  - `source.ip` manzilini tekshiring — tashqi manzildan ko'p urinish brute force.
  - `auditd.data.acct` — qaysi username bilan urinilganini aniqlang.
  - Bir IP dan qisqa vaqtda ko'p urinish — avtomatlashtirilgan hujum.
  - `auditd.summary.object.secondary` dagi source IP ni threat intelligence bilan solishtiring.
  - `auditd.data.terminal == "sshd"` — pre-auth failure (key auth muvaffaqiyatsiz).
  - Noqonuniy bo'lsa: IP ni firewall orqali bloklang, fail2ban qoidasini tekshiring.
description_ru: |
  Это правило связано с техникой Credential Access и выявляет неудачные попытки входа
  по SSH с внешнего IP-адреса. Это может быть признаком SSH password brute force или
  попытки подключения с неверными учётными данными.
  Легитимные случаи: пользователь забыл пароль и ввёл его неверно, SSH key mismatch.
  Этапы SOC-триажа:
  - Проверьте адрес `source.ip` — множество попыток с внешнего адреса означает brute force.
  - `auditd.data.acct` — определите, с каким username выполнялись попытки.
  - Множество попыток с одного IP за короткое время — автоматизированная атака.
  - Сопоставьте source IP из `auditd.summary.object.secondary` с threat intelligence.
  - `auditd.data.terminal == "sshd"` — pre-auth failure (аутентификация по ключу не удалась).
  - Если активность нелегитимна: заблокируйте IP на firewall, проверьте правило fail2ban.
description_en: |
  This rule is related to the Credential Access technique and detects failed login attempts
  via SSH from an external IP address. This may be an indicator of SSH password brute force or
  of a connection attempt with incorrect credentials.
  Legitimate cases: a user forgetting the password and entering it incorrectly, SSH key mismatch.
  SOC triage steps:
  - Check the `source.ip` address — many attempts from an external address mean brute force.
  - `auditd.data.acct` — determine which username was used in the attempts.
  - Many attempts from one IP in a short time — an automated attack.
  - Compare the source IP in `auditd.summary.object.secondary` against threat intelligence.
  - `auditd.data.terminal == "sshd"` — pre-auth failure (key auth failed).
  - If illegitimate: block the IP on the firewall, check the fail2ban rule.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE auditd.message_type == "user_login"
  | WHERE auditd.result == "fail"
  | WHERE event.outcome == "failure"
  | WHERE network.direction == "ingress"
  | WHERE source.ip IS NOT NULL
  | EVAL host_name    = host.hostname
  | EVAL target_acct  = COALESCE(auditd.data.acct, user.effective.name, auditd.summary.actor.secondary)
  | EVAL src_ip       = source.ip
  | EVAL terminal     = auditd.data.terminal
  | EVAL src_hostname = auditd.data.hostname
  | STATS
      event_count    = COUNT(*),
      host_names     = VALUES(host.hostname),
      target_accts   = VALUES(auditd.data.acct),
      src_ips        = VALUES(source.ip),
      src_hostnames  = VALUES(auditd.data.hostname),
      terminals      = VALUES(auditd.data.terminal),
      last_seen      = MAX(@timestamp),
      first_seen     = MIN(@timestamp)
    BY agent_id, host.hostname, source.ip, auditd.data.acct
  | WHERE event_count >= 3
  | EVAL
      host_name   = host.hostname,
      src_ip      = source.ip,
      target_acct = auditd.data.acct
  | KEEP
      agent_id, host_name, src_ip, target_acct, event_count,
      host_names, target_accts, src_ips, src_hostnames,
      terminals, last_seen, first_seen
  | SORT event_count DESC
enabled: true
tags:
  - attack.credential-access
  - attack.t1110.001
  - attack.t1110.003
  - detection.threat-hunting
severity: high
risk_score: 75
references:
  - "https://attack.mitre.org/techniques/T1110/001/"
  - "https://attack.mitre.org/techniques/T1110/003/"
nist: ["AC-7", "SI-4", "AU-12", "SC-7"]
pci_dss: ["8.1.6", "8.3", "10.2.4", "10.6.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0006:
    T1110: ["T1110.001", "T1110.003"]