  - "https://attack.mitre.org/techniques/T1112/"
  - "https://attack.mitre.org/techniques/T1053/005/"
nist: ["SI-7", "CM-3", "AU-12"]
pci_dss: ["10.5.1", "11.5", "6.3"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1565: ["T1565.001"]
    T1112: []
  TA0003:
    T1053: ["T1053.005"]