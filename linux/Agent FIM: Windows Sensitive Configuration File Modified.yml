rule_id: 2c45b6f5-bc26-4529-8434-bad9676d8b1f
name_uz: "Agent FIM: Windows muhim konfiguratsiya fayli o'zgartirildi"
name_ru: "Agent FIM: изменение важного файла конфигурации Windows"
name_en: "Agent FIM: Windows Sensitive Configuration File Modified"
description_uz: |
  Ushbu qoida Defense Evasion va Persistence texnikalariga bog'liq bo'lib, Windows
  muhim konfiguratsiya fayllarining o'zgarishini aniqlaydi. Hujumchi hosts fayli,
  registry export, yoki boshqa konfiguratsiya fayllarini o'zgartirib tarmoq
  yo'naltirishini manipulyatsiya qilishi yoki persistence ta'minlashi mumkin.
  Qonuniy holatlar: tizim administratori konfiguratsiya o'zgarishlari, dastur o'rnatish.
  SOC triage bosqichlari:
  - `file.path` ni tekshiring — hosts, lmhosts, services faylmi.
  - `file.owner` SYSTEM yoki Administrator emas bo'lsa shubhali.
  - `file.mtime` — oxirgi o'zgarish vaqtini ish soatlari bilan solishtiring.
  - Faylning yangi mazmunini tekshiring — noto'g'ri DNS yozuvi bormi.
  - Noqonuniy bo'lsa: faylni asl holatiga qaytaring, kim o'zgartirganini aniqlang.
description_ru: |
  Данное правило связано с техниками Defense Evasion и Persistence и обнаруживает изменение
  важных файлов конфигурации Windows. Атакующий может изменить файл hosts,
  registry export или иные файлы конфигурации и тем самым манипулировать сетевой
  маршрутизацией либо обеспечить закрепление.
  Легитимные случаи: изменения конфигурации системным администратором, установка программ.
  Этапы SOC-триажа:
  - Проверьте `file.path` — это файл hosts, lmhosts или services.
  - Если `file.owner` не SYSTEM и не Administrator — подозрительно.
  - `file.mtime` — сопоставьте время последнего изменения с рабочими часами.
  - Проверьте новое содержимое файла — нет ли некорректной записи DNS.
  - Если нелегитимно: верните файл в исходное состояние, установите, кто его изменил.
description_en: |
  This rule is related to Defense Evasion and Persistence techniques and detects modification
  of sensitive Windows configuration files. An attacker may modify the hosts file,
  a registry export, or other configuration files to manipulate network
  routing or to establish persistence.
  Legitimate cases: configuration changes by a system administrator, software installation.
  SOC triage steps:
  - Check `file.path` — is it the hosts, lmhosts, or services file.
  - It is suspicious if `file.owner` is not SYSTEM or Administrator.
  - `file.mtime` — compare the last modification time against business hours.
  - Inspect the new content of the file — is there an incorrect DNS entry.
  - If illegitimate: restore the file to its original state, determine who changed it.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.module == "file_integrity"
  | WHERE host.os.type == "windows"
  | WHERE event.type == "change"
  | WHERE STARTS_WITH(file.path, "C:\\Windows\\System32\\drivers\\etc\\")
      OR STARTS_WITH(file.path, "C:\\Windows\\System32\\GroupPolicy\\")
      OR STARTS_WITH(file.path, "C:\\Windows\\System32\\Tasks\\")
      OR STARTS_WITH(file.path, "C:\\Windows\\SysWOW64\\drivers\\etc\\")
  | EVAL host_name  = host.hostname
  | EVAL file_path  = file.path
  | EVAL file_name  = file.name
  | EVAL file_owner = file.owner
  | EVAL file_size  = file.size
  | EVAL file_mtime = file.mtime
  | EVAL action     = event.action
  | WHERE file_path IS NOT NULL
  | STATS
      event_count = COUNT(*),
      host_names  = VALUES(host.hostname),
      file_paths  = VALUES(file.path),
      file_names  = VALUES(file.name),
      file_owners = VALUES(file.owner),
      file_sizes  = VALUES(file.size),
      actions     = VALUES(event.action),
      last_seen   = MAX(@timestamp),
      first_seen  = MIN(@timestamp)
    BY agent_id, host.hostname, file.path
  | WHERE event_count >= 1
  | EVAL
      host_name = host.hostname,
      file_path = file.path
  | KEEP
      agent_id, host_name, file_path, event_count,
      host_names, file_paths, file_names,
      file_owners, file_sizes, actions, last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.persistence
  - attack.t1565.001
  - attack.t1112
  - attack.t1053.005
  - detection.threat-hunting
severity: high
risk_score: 73
references:
