rule_id: aab9a793-fb45-482e-8102-04f48081929e
name: "System Firewall Modification Detection"
description: |
  Detects the removal or modification of system firewall rules on Linux.
  Adversaries may only delete or modify specific system firewall rules to bypass controls limiting network usage or access.
  Detection rules that match only on the disabling of firewalls will miss this technique.
  Covers iptables, firewall-cmd, ufw, and nft (nftables) firewall management tools.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd execve telemetry */
  | WHERE event.action == "executed"
  /* allowlist: exclude SIEM/monitoring host where Docker generates high-volume benign iptables DROP rules */
  | WHERE host.name != "siem"
  /* selection: firewall modification commands */
  | WHERE (
      /* iptables DROP rules */
      (process.name == "iptables" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*drop.*")
      /* firewall-cmd remove */
      OR (process.name == "firewall-cmd" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*remove.*")
      /* ufw delete */
      OR (process.name == "ufw" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*delete.*")
      /* nft delete or flush */
      OR (process.name == "nft" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*(delete|flush).*")
    )
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      executables = VALUES(process.executable),
      parent_processes = VALUES(process.parent.pid),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, executables, parent_processes, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.defense-evasion
  - attack.t1562.004
  - detection.threat-hunting
severity: medium
risk_score: 65
references:
  - "https://www.trendmicro.com/en_us/research/22/c/cyclops-blink-sets-sights-on-asus-routers--.html"
  - "https://blog.aquasec.com/container-security-tnt-container-attack"
  - "https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/8/html/configuring_and_managing_networking/getting-started-with-nftables_configuring-and-managing-networking"
nist: ["SI-4", "AU-12", "SC-7", "AC-4"]
pci_dss: ["10.2", "1.3"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1562: ["T1562.004"]
