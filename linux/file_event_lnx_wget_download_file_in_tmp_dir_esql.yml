rule_id: 585229ea-10cc-4ac2-bf20-cd293c86d71a
name_uz: "Wget orqali vaqtinchalik katalogga fayl yuklab olish"
name_ru: "Загрузка файла через wget во временный каталог"
name_en: "Wget File Download in Temp Directory"
description_uz: |
  wget tomonidan /tmp yoki /var/tmp kataloglarida fayllar yaratilishini aniqlaydi.
  Tajovuzkorlar ko'pincha vositalar/zararli dasturlarni vaqtinchalik kataloglarga yuklab oladi.
description_ru: |
  Обнаруживает создание файлов утилитой wget в каталогах /tmp или /var/tmp.
  Злоумышленники часто загружают инструменты/вредоносное ПО во временные каталоги.
description_en: |
  Detects wget creating files in /tmp or /var/tmp directories.
  Adversaries often download tools/malware to temporary directories.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* file creation events */
  | WHERE event.category == "file" AND event.type == "creation"
  /* selection: wget process AND tmp directory target */
  | WHERE (process.name == "wget" OR process.executable RLIKE ".*/wget")
    AND (
      TO_LOWER(file.path) RLIKE "/tmp/.*"
      OR TO_LOWER(file.path) RLIKE "/var/tmp/.*"
    )
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      file_paths = VALUES(file.path),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, file_paths, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.command-and-control
  - attack.t1105
severity: medium
risk_score: 55
references:
  - "https://attack.mitre.org/techniques/T1105/"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0011:
    T1105: []
