rule_id: 1146e9a5-e43e-4fc0-b6f6-bccb59a29e03
name: "Network Sniffing Detection - Linux"
description: |
  Network sniffing refers to using the network interface on a system to monitor or capture information sent over a wired or wireless connection.
  An adversary may place a network interface into promiscuous mode to passively access data in transit over the network, or use span ports to capture a larger amount of data.
  Detects usage of tcpdump and tshark network sniffing tools.
  Note: Legitimate administrators may use these tools for troubleshooting. Baseline your environment.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd execve telemetry */
  | WHERE event.action == "executed"
  /* selection: tcpdump or tshark with capture flags */
  | WHERE (
      (process.name == "tcpdump" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*-c.*-i.*")
      OR (process.name == "tshark" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*-c.*-i.*")
    )
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      executables = VALUES(process.executable),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, executables, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.credential-access
  - attack.discovery
  - attack.t1040
  - detection.threat-hunting
severity: low
risk_score: 40
references:
  - "https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1040/T1040.md"
  - "https://attack.mitre.org/techniques/T1040/"
nist: ["SI-4", "AU-12", "AC-3"]
pci_dss: ["10.2", "10.6.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0006:
    T1040: []
  TA0007:
    T1040: []
