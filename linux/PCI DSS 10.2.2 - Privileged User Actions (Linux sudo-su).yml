rule_id: 14232e25-dec2-447e-8968-dc5675524ec9
name_uz: "PCI DSS 10.2.2 - imtiyozli foydalanuvchi harakatlari (Linux sudo/su)"
name_ru: "PCI DSS 10.2.2 - действия привилегированного пользователя (Linux sudo/su)"
name_en: "PCI DSS 10.2.2 - Privileged User Actions (Linux sudo/su)"
description_uz: |
  auditd orqali Linux tizimlaridagi barcha sudo va su imtiyozlarni oshirish hodisalarini aniqlaydi.
  Barcha administrativ harakatlarni kuzatish uchun agent_id, PCI DSS Requirement 10.2.2 talab qiladi.
  USER_CMD (sudo buyruqlari), USER_AUTH (su autentifikatsiyasi) va
  imtiyoz o'zgarishlariga oid SYSCALL hodisalarini (setuid, setgid) kuzatadi.
  Trigger: cardholder data muhitidagi Linux hostlarda har qanday sudo/su ishlatilishi.
  False positive: ruxsat etilgan adminlarning odatiy texnik xizmat vazifalarini bajarishi.
  Triage: change management yozuvlari bilan solishtiring, buyruq kutilgan yoki yo'qligini tekshiring,
  bajarilish vaqti maintenance window jadvallariga mos kelishini tasdiqlang.
description_ru: |
  Выявляет все события повышения привилегий sudo и su в системах Linux через auditd.
  Требуется agent_id, PCI DSS Requirement 10.2.2 для отслеживания всех административных действий.
  Отслеживает USER_CMD (команды sudo), USER_AUTH (аутентификация su) и
  события SYSCALL, связанные с изменением привилегий (setuid, setgid).
  Trigger: любое использование sudo/su на Linux-хостах среды cardholder data.
  False positives: авторизованные администраторы, выполняющие плановые задачи обслуживания.
  Triage: сверьте с записями change management, проверьте, ожидаема ли команда,
  подтвердите, что время выполнения совпадает с расписанием maintenance window.
description_en: |
  Detects all sudo and su privilege escalation events on Linux systems via auditd.
  Required by agent_id, PCI DSS Requirement 10.2.2 to track all administrative actions.
  Monitors USER_CMD (sudo commands), USER_AUTH (su authentication), and
  SYSCALL events related to privilege changes (setuid, setgid).
  Trigger: Any sudo/su usage on cardholder data environment Linux hosts.
  False positives: Authorized admins performing routine maintenance tasks.
  Triage: Verify against change management records, check if command is expected,
  confirm execution time aligns with maintenance window schedules.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp > NOW() - 5 minutes
    AND event.dataset == "updive-audit.log"
    AND (
      auditd.message_type == "user_cmd"
      OR (auditd.message_type == "user_auth" AND TO_LOWER(auditd.summary.how) RLIKE ".*(sudo|/su).*")
    )
  | STATS
      priv_commands      = COUNT(*),
      unique_users       = COUNT_DISTINCT(user.name),
      executing_users    = VALUES(user.name),
      commands_run       = VALUES(auditd.data.cmd),
      target_users       = VALUES(auditd.data.uid),
      outcomes           = VALUES(event.outcome)
    BY agent_id, host.hostname,
       user.name,
       bucket = DATE_TRUNC(5 minutes, @timestamp)
  | EVAL severity_level = CASE(
      priv_commands >= 30, "high",
      priv_commands >= 10, "medium",
      "info"
    )
  | EVAL risk_score = CASE(
      priv_commands >= 30, 60,
      priv_commands >= 10, 35,
      15
    )
  | KEEP agent_id, bucket, host.hostname, user.name, priv_commands,
         unique_users, executing_users, commands_run,
         target_users, outcomes, severity_level, risk_score
  | SORT priv_commands DESC
enabled: false
tags:
  - pci_dss
  - privileged_access
  - audit_trail
  - linux
severity: low
risk_score: 15
references:
  - "PCI DSS v3.2.1 Requirement 10.2.2: All actions by agent_id, individuals with root or administrative privileges"
pci_dss: ["10.2.2", "10.3"]
nist: ["AC-6","AU-2","AU-12"]
gdpr: ["5.1.f", "32"]
mitre_attack:
  TA0004:
    T1078: ["T1078.003"]
    T1548: ["T1548.003"]
