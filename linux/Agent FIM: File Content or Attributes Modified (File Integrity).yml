rule_id: 7e3be053-8d0d-4aa2-8b05-82c5474970f5
name_uz: "Agent FIM: fayl mazmuni yoki atributlari o'zgartirildi (fayl yaxlitligi)"
name_ru: "Agent FIM: изменено содержимое или атрибуты файла (целостность файлов)"
name_en: "Agent FIM: File Content or Attributes Modified (File Integrity)"
description_uz: |
  Ushbu qoida Impact va Defense Evasion texnikalariga bog'liq bo'lib, fayl yaxlitligi monitori (FIM)
  tomonidan aniqlangan fayl o'zgarishlarini kuzatadi. Hujumchi konfiguratsiya fayllarini, binary
  fayllarni yoki log fayllarini o'zgartirishi mumkin.
  Qonuniy holatlar: tizim yangilanishlari, konfiguratsiya deployment, agent token yangilanishi.
  SOC triage bosqichlari:
  - O'zgargan fayl yo'lini (`file.path`) tekshiring — tizim katalogida bo'lsa yuqori xavf.
  - `event.action` qiymatini aniqlang: updated, attributes_modified, created, deleted.
  - `file.hash.sha1` o'zgarganini oldingi qiymat bilan solishtiring.
  - Fayl o'zgarish vaqti (`file.mtime`) va ctime ni solishtiring.
  - O'sha paytda tizimda qaysi process ishlayotganini korrelatsiya qiling.
  - Noqonuniy bo'lsa: faylni rollback qiling, o'zgartirilgan binary ni karantinga oling.
description_ru: |
  Это правило связано с техниками Impact и Defense Evasion и отслеживает изменения файлов, выявленные
  монитором целостности файлов (FIM). Злоумышленник может изменить конфигурационные файлы, бинарные
  файлы или файлы журналов.
  Легитимные случаи: обновления системы, развёртывание конфигураций, обновление токена агента.
  Шаги SOC-триажа:
  - Проверьте путь изменённого файла (`file.path`) — если это системный каталог, риск высокий.
  - Определите значение `event.action`: updated, attributes_modified, created, deleted.
  - Сравните изменившийся `file.hash.sha1` с предыдущим значением.
  - Сравните время изменения файла (`file.mtime`) и ctime.
  - Скоррелируйте, какой процесс работал в системе в этот момент.
  - Если активность нелегитимна: откатите файл, поместите изменённый бинарный файл в карантин.
description_en: |
  This rule is related to Impact and Defense Evasion techniques and tracks file changes detected by
  the file integrity monitor (FIM). An attacker may modify configuration files, binary
  files, or log files.
  Legitimate cases: system updates, configuration deployment, agent token renewal.
  SOC triage steps:
  - Check the path of the changed file (`file.path`) — high risk if it is in a system directory.
  - Determine the `event.action` value: updated, attributes_modified, created, deleted.
  - Compare the changed `file.hash.sha1` with the previous value.
  - Compare the file modification time (`file.mtime`) with ctime.
  - Correlate which process was running on the system at that time.
  - If illegitimate: roll the file back, quarantine the modified binary.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.module == "file_integrity"
  | WHERE event.type == "change"
  | EVAL host_name    = host.hostname
  | EVAL file_path    = file.path
  | EVAL file_name    = file.name
  | EVAL file_mode    = file.mode
  | EVAL file_owner   = file.owner
  | EVAL file_hash    = file.hash.sha1
  | EVAL file_size    = file.size
  | EVAL file_mtime   = file.mtime
  | EVAL file_ext     = file.extension
  | EVAL action       = event.action
  | WHERE file_path IS NOT NULL
  // Exclude high-churn Elastic agent internal token/config files (benign, ~1M+ events/71d)
  | WHERE NOT (file_path LIKE "/etc/updive/*")
  // Exclude transient dpkg temp files created/removed during package installs
  | WHERE NOT (file_path LIKE "*.dpkg-new" OR file_path LIKE "*.dpkg-tmp" OR file_path LIKE "*.dpkg-old")
  | STATS
      event_count   = COUNT(*),
      host_names    = VALUES(host.hostname),
      file_paths    = VALUES(file.path),
      file_names    = VALUES(file.name),
      file_modes    = VALUES(file.mode),
      file_owners   = VALUES(file.owner),
      file_hashes   = VALUES(file.hash.sha1),
      actions       = VALUES(event.action),
      last_seen     = MAX(@timestamp),
      first_seen    = MIN(@timestamp)
    BY agent_id, host.hostname, file.path
  | WHERE event_count >= 1
  | EVAL
      host_name  = host.hostname,
      file_path  = file.path
  | KEEP
      agent_id, host_name, file_path, event_count,
      host_names, file_paths, file_names, file_modes,
      file_owners, file_hashes, actions, last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.impact
  - attack.persistence
  - attack.t1565.001
  - attack.t1070.006
  - detection.threat-hunting
severity: medium
risk_score: 58
references:
  - "https://attack.mitre.org/techniques/T1565/001/"
  - "https://attack.mitre.org/techniques/T1070/006/"
nist: ["SI-7", "AU-9", "CM-3"]
pci_dss: ["10.5.1", "11.5", "6.3"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0040:
    T1565: ["T1565.001"]
  TA0005:
    T1070: ["T1070.006"]