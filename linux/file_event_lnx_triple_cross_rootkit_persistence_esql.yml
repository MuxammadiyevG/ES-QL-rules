rule_id: 4b939115-7bfc-4b77-a556-5b26f5351da7
name_uz: "TripleCross rootkit mustahkamlanish fayli"
name_ru: "Файл закрепления руткита TripleCross"
name_en: "TripleCross Rootkit Persistence File"
description_uz: |
  cron.d yoki sudoers.d ichida 'ebpfbackdoor' fayllarining yaratilishini aniqlaydi.
  TripleCross rootkit uchun xos mustahkamlanish (persistence) mexanizmi.
description_ru: |
  Обнаруживает создание файлов 'ebpfbackdoor' в cron.d или sudoers.d.
  Специфический механизм закрепления руткита TripleCross.
description_en: |
  Detects creation of 'ebpfbackdoor' files in cron.d or sudoers.d.
  Specific persistence mechanism for TripleCross rootkit.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* file creation events */
  | WHERE event.category == "file" AND event.type == "creation"
  /* selection: ebpfbackdoor filename suffix */
  | WHERE TO_LOWER(file.name) RLIKE ".*ebpfbackdoor"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      file_paths = VALUES(file.path),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, file_paths, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.persistence
  - attack.t1053.003
severity: high
risk_score: 80
references:
  - "https://github.com/h3xduck/TripleCross"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0003:
    T1053: ["T1053.003"]
