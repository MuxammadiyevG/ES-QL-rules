rule_id: 488ffb3c-d833-4389-96c6-41821eb0d1a5
name: "Disabling Security Tools - Builtin"
description: |
  Detects attempts to disable built-in or installed security tools on Linux systems.
  Adversaries may stop firewalls or endpoint security agents to evade defenses.
  Monitors auditd events indicating stopping of security-related services.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd service_stop events only */
  | WHERE auditd.message_type == "service_stop"
  /* Detect stopping of security-related services via auditd.data.unit */
  | WHERE auditd.data.unit RLIKE ".*(iptables|ip6tables|firewalld|cbdaemon|falcon-sensor|ufw|nftables|fail2ban|apparmor|suricata|ossec|wazuh|snort|clamav|auditd).*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      executables = VALUES(auditd.summary.how),
      service_units = VALUES(auditd.data.unit),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP
      agent_id, bucket,
      host.name,
      user.name,
      event_count,
      users,
      processes,
      executables,
      service_units,
      hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.defense-evasion
  - attack.t1562.004
severity: medium
risk_score: 60
references:
  - "https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.004/T1562.004.md"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1562: ["T1562.004"]
