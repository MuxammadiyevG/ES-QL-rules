rule_id: 6c0f7b48-307b-43dc-8b52-75813025ad1c
name_uz: "Chattr orqali immutable atributini olib tashlash"
name_ru: "Снятие атрибута immutable через chattr"
name_en: "Chattr Immutable Attribute Removal"
description_uz: |
  chattr yordamida faylning immutable atributi olib tashlanishini aniqlaydi.
  Tajovuzkorlar himoyalangan tizim fayllarini o'zgartirish uchun immutable atributlarini olib tashlashi mumkin.
description_ru: |
  Обнаруживает снятие атрибута immutable с файла с помощью chattr.
  Злоумышленники могут снимать атрибуты immutable, чтобы изменять защищённые системные файлы.
description_en: |
  Detects removal of immutable file attribute using chattr.
  Adversaries may remove immutable attributes to modify protected system files.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE event.action == "executed"
  | WHERE process.name == "chattr" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*-i.*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      file_paths = VALUES(file.path),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, file_paths, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.defense-evasion
  - attack.t1222
severity: medium
risk_score: 55
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1222: []
