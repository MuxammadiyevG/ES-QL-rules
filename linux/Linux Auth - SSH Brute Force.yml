rule_id: 15b68698-b2b4-4435-a8fc-3448eb9e3022
name_uz: "Linux Auth - SSH brute force"
name_ru: "Linux Auth - SSH brute force"
name_en: "Linux Auth - SSH Brute Force"
description_uz: |
  Ushbu qoida Linux auth.log (logs-linux.auth-*) dagi sshd hodisalarini kuzatib, bitta
  `source.ip` dan qisqa vaqt ichida ko'p sonli muvaffaqiyatsiz SSH kirish urinishlarini
  aniqlaydi. Bu brute-force yoki password spray hujumi (T1110) belgisi. Muvaffaqiyatsiz
  urinishlardan keyin muvaffaqiyatli kirish bo'lsa, ehtimoliy buzilishni ko'rsatadi.
  Qonuniy holatlar: noto'g'ri sozlangan mijoz, expired credential bilan retry qiluvchi servis.
  SOC triage bosqichlari:
  - Hujum manbasi `source.ip` ni va nishon `actor`larni aniqlang.
  - `success_count > 0` bo'lsa — kirish muvaffaqiyatli bo'lgan, darhol escalation qiling.
  - `source.geo` orqali noodatiy mamlakatni tekshiring.
  - Noqonuniy faoliyat tasdiqlansa: IP ni bloklang, parollarni rotatsiya qiling.
description_ru: |
  Данное правило отслеживает события sshd в Linux auth.log (logs-linux.auth-*) и выявляет
  большое число неуспешных попыток входа по SSH с одного `source.ip` за короткое время.
  Это признак атаки перебора паролей (brute force) или password spray (T1110). Успешный
  вход после неуспешных попыток указывает на возможную компрометацию.
  Легитимные случаи: неверно настроенный клиент, служба, повторяющая попытки с expired credential.
  Шаги SOC-триажа:
  - Определите источник атаки `source.ip` и целевые `actor`.
  - Если `success_count > 0` — вход был успешным, немедленно выполните escalation.
  - Проверьте нетипичную страну через `source.geo`.
  - При подтверждении нелегитимной активности: заблокируйте IP, выполните ротацию паролей.
description_en: |
  This rule monitors sshd events in the Linux auth.log (logs-linux.auth-*) and detects a
  large number of failed SSH login attempts from a single `source.ip` within a short
  period of time. This is a sign of a brute-force or password spray attack (T1110). A
  successful login after failed attempts indicates a possible compromise.
  Legitimate cases: a misconfigured client, a service retrying with an expired credential.
  SOC triage steps:
  - Identify the attack source `source.ip` and the targeted `actor`s.
  - If `success_count > 0` — the login succeeded, escalate immediately.
  - Check for an unusual country via `source.geo`.
  - If malicious activity is confirmed: block the IP, rotate the passwords.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-linux.auth-*
query_language: esql
query: |
  FROM logs-linux.auth-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE data_stream.dataset == "linux.auth"
  | WHERE event.category == "authentication"
  | WHERE event.action IN ("ssh-login-success", "ssh-login-failed", "ssh-invalid-user")
  | EVAL actor   = COALESCE(user.name, "Unknown")
  | EVAL hostn   = COALESCE(host.hostname, "Unknown")
  | EVAL src_ip  = COALESCE(TO_STRING(source.ip), "Unknown")
  | EVAL outcome = COALESCE(event.outcome, "Unknown")
  | EVAL action  = COALESCE(event.action, "Unknown")
  | STATS
      event_count    = COUNT(*),
      fail_count     = COUNT_IF(outcome == "failure"),
      success_count  = COUNT_IF(outcome == "success"),
      targeted_users = COUNT_DISTINCT(actor),
      actors         = VALUES(actor),
      actions        = VALUES(action),
      hosts          = VALUES(hostn),
      first_seen     = MIN(@timestamp),
      last_seen      = MAX(@timestamp)
    BY agent_id, src_ip, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE fail_count >= 10
  | KEEP agent_id, bucket, src_ip, event_count, fail_count, success_count,
         targeted_users, actors, actions, hosts, first_seen, last_seen
  | SORT fail_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.credential_access
  - attack.t1110
  - detection.linux
  - linux.auth.ssh
severity: high
risk_score: 75
nist: ["AU-2", "AU-12", "AC-7", "IA-2"]
pci_dss: ["10.2.4", "10.2.5", "8.1.6"]
gdpr: ["32.1.a", "32.2"]
mitre_attack:
  TA0006:
    T1110: []
