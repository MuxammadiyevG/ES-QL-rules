rule_id: 7147315f-941e-489c-8844-770b507b1e60
name: "Agent Defense Evasion: BPF Program Loaded or Unloaded"
description: |
  Ushbu qoida Defense Evasion va Execution texnikalariga bog'liq bo'lib, eBPF dasturlarining tizimga yuklanishi yoki o'chirilishini aniqlaydi.
  Hujumchi eBPF rootkit orqali tizim chaqiruvlarini ushlash, tarmoq trafikini filtrlash yoki xavfsizlik vositalarini chetlab o'tishi mumkin.
  Qonuniy holatlar: monitoring agentlari (Cilium, Falco, bcc tools), kernel debugging, tarmoq observability tizimlari.
  SOC triage bosqichlari:
  - BPF operatsiyasi turini (`auditd.data.op`: LOAD/UNLOAD) va dastur ID (`auditd.data.prog-id`) ni aniqlang.
  - O'sha paytda qaysi process BPF yuklaganini tekshiring (process.executable).
  - Tizimda eBPF dasturlarni ko'rish uchun `bpftool prog list` ni ishlatib tekshiring.
  - Kutilmagan vaqt yoki foydalanuvchi tomonidan yuklangan bo'lsa — yuqori prioritet.
  - Noqonuniy bo'lsa: BPF dasturni o'chirib, yuklovchi processni to'xtating.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE auditd.message_type == "bpf"
  | WHERE auditd.data.op IN ("LOAD", "UNLOAD")
  | WHERE NOT host.hostname IN ("siem", "vision")
  | EVAL host_name    = host.hostname
  | EVAL bpf_op       = auditd.data.op
  | EVAL actor        = COALESCE(user.name, auditd.summary.actor.secondary)
  | STATS
      event_count  = COUNT(*),
      host_names   = VALUES(host.hostname),
      actors       = VALUES(user.name),
      bpf_ops      = VALUES(auditd.data.op),
      last_seen    = MAX(@timestamp),
      first_seen   = MIN(@timestamp)
    BY agent_id, host.hostname, auditd.data.op
  | WHERE event_count >= 1
  | EVAL
      host_name = host.hostname,
      bpf_op    = auditd.data.op
  | KEEP
      agent_id, host_name, bpf_op, event_count,
      host_names, actors, bpf_ops,
      last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.execution
  - attack.t1014
  - attack.t1611
  - detection.threat-hunting
severity: high
risk_score: 75
references:
  - "https://attack.mitre.org/techniques/T1014/"
  - "https://attack.mitre.org/techniques/T1611/"
nist: ["SI-3", "SI-7", "AU-12", "CM-7"]
pci_dss: ["6.3", "10.2.7", "11.5"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1014: []
  TA0002:
    T1611: []