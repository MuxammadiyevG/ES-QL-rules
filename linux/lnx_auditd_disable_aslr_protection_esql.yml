rule_id: 1863d292-bb5a-4dfe-928b-0eb9136c07cf
name_uz: "ASLR o'chirilishini aniqlash"
name_ru: "Обнаружение отключения ASLR"
name_en: "ASLR Disabled Detection"
description_uz: |
  Address Space Layout Randomization (ASLR) ni o'chiruvchi harakatlarni aniqlaydi.
  Tajovuzkorlar xotira buzilishiga oid hujumlarni ishonchliroq qilish uchun ASLR ni o'chiradi.
  Kuzatiladigan o'zgaruvchilar: sysctl o'zgarishlari, personality syscall va /proc/sys/kernel/randomize_va_space.
description_ru: |
  Обнаруживает действия, отключающие Address Space Layout Randomization (ASLR).
  Злоумышленники отключают ASLR, чтобы сделать атаки на повреждение памяти более надёжными.
  Отслеживаемые переменные: изменения sysctl, системный вызов personality и /proc/sys/kernel/randomize_va_space.
description_en: |
  Detects actions that disable Address Space Layout Randomization (ASLR).
  Adversaries disable ASLR to make memory corruption attacks more reliable.
  Monitors variables: sysctl modifications, personality syscall, and /proc/sys/kernel/randomize_va_space.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd SYSCALL or EXECVE */
  /* selection 1: personality syscall with ADDR_NO_RANDOMIZE (0x40000) */
  | WHERE (
      (
        TO_LOWER(COALESCE(event.original, "")) RLIKE ".*syscall=135.*" /* personality */
        OR TO_LOWER(COALESCE(event.original, "")) RLIKE ".*syscall=personality.*"
      )
      AND TO_LOWER(COALESCE(event.original, "")) RLIKE ".*a0=40000.*"
    )
    /* selection 2: sysctl command */
    OR (
      process.name == "sysctl"
      AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*-w.*"
      AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*kernel\\.randomize_va_space=0.*"
    )
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      executables = VALUES(process.executable),
      command_lines = VALUES(process.title),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, executables, command_lines, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.defense-evasion
  - attack.privilege-escalation
  - attack.t1562.001
severity: high
risk_score: 75
references:
  - "https://attack.mitre.org/techniques/T1562/001/"
  - "https://linux-audit.com/linux-aslr-and-kernelrandomize_va_space-setting/"
nist: ["SI-4", "AU-12", "SC-39"]
pci_dss: ["10.2", "2.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1562: ["T1562.001"]
