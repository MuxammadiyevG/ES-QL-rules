rule_id: e21b4c9d-5a41-4b65-8a59-41820845454d
name_uz: "SVN'da audit qilinadigan fayl yoki katalog mazmuni o'zgartirildi"
name_ru: "Изменено содержимое аудируемого файла или каталога в SVN"
name_en: "Audited file or directory content modified in SVN"
description_uz: |
  Ushbu qoida Defense Evasion va Impact texnikalariga bog'liq bo'lib, `Audited file or directory content modified in SVN` kontekstida FortiSIEM agentless fayl monitoringi orqali SSH ulanishi yordamida SVN repozitoriyasidagi fayl yoki directory mazmunining o'zgartirilganligini aniqlaydi.
  Bu turdagi hodisa hujumchi source code, konfiguratsiya fayllari yoki muhim loyiha fayllarini ruxsatsiz o'zgartirish orqali supply chain hujumi, backdoor kiritish yoki ma'lumot manipulyatsiyasi maqsadida faoliyat yuritayotganligini ko'rsatishi mumkinligi sababli xavfli hisoblanadi.
  Qonuniy holatlar sifatida rejalashtirilgan kod o'zgarishlari, tasdiqlangan commit operatsiyalari yoki deployment jarayonlari uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `host.hostname`, `user.name` va o'zgartirilgan `auditd.paths.name` ni aniq identifikatsiya qiling.
  - Qo'shilgan (`added_item`) va o'chirilgan (`deleted_item`) elementlarni ko'rib chiqing.
  - SVN versiya raqamlarini (`old_svn_version`, `new_svn_version`) tekshiring.
  - O'zgarishni amalga oshirgan foydalanuvchining SVN commit huquqlari borligini tasdiqlang.
  - O'zgarish uchun tasdiqlangan change ticket yoki code review yozuvi borligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa tezkor containment bajaring: SVN commitni revert qiling, foydalanuvchi SSH sessiyasini to'xtating va hostni izolyatsiya qiling.
description_ru: |
  Данное правило связано с техниками Defense Evasion и Impact и в контексте `Audited file or directory content modified in SVN` выявляет изменение содержимого файла или directory в репозитории SVN через SSH-подключение с помощью безагентного файлового мониторинга FortiSIEM.
  Событие такого типа считается опасным, поскольку может указывать на то, что злоумышленник действует с целью атаки на цепочку поставок (supply chain), внедрения backdoor или манипуляции данными посредством несанкционированного изменения source code, конфигурационных файлов или важных файлов проекта.
  Легитимными случаями могут быть плановые изменения кода, утверждённые операции commit или процессы deployment.
  Шаги SOC-триажа:
  - Точно идентифицируйте `host.hostname`, `user.name` в событии и изменённый `auditd.paths.name`.
  - Изучите добавленные (`added_item`) и удалённые (`deleted_item`) элементы.
  - Проверьте номера версий SVN (`old_svn_version`, `new_svn_version`).
  - Подтвердите, что пользователь, внёсший изменение, имеет права на commit в SVN.
  - Проверьте наличие утверждённого change ticket или записи code review для этого изменения.
  - При подтверждении нелегитимной активности выполните оперативный containment: откатите SVN commit, завершите SSH-сессию пользователя и изолируйте хост.
description_en: |
  This rule is related to Defense Evasion and Impact techniques and, in the context of `Audited file or directory content modified in SVN`, detects modification of the content of a file or directory in an SVN repository over an SSH connection by means of FortiSIEM agentless file monitoring.
  An event of this type is considered dangerous because it may indicate that an attacker is acting with the aim of a supply chain attack, backdoor insertion or data manipulation through unauthorized modification of source code, configuration files or important project files.
  Legitimate cases may include planned code changes, approved commit operations or deployment processes.
  SOC triage steps:
  - Precisely identify the `host.hostname`, `user.name` in the event and the modified `auditd.paths.name`.
  - Review the added (`added_item`) and deleted (`deleted_item`) items.
  - Check the SVN version numbers (`old_svn_version`, `new_svn_version`).
  - Confirm that the user who made the change has SVN commit rights.
  - Check whether there is an approved change ticket or code review record for the change.
  - If malicious activity is confirmed, perform rapid containment: revert the SVN commit, terminate the user's SSH session and isolate the host.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE auditd.message_type IN ("syscall", "path")
  | WHERE auditd.data.syscall IN ("write", "truncate", "ftruncate", "rename", "renameat", "renameat2", "open", "openat")
  | WHERE auditd.paths.name RLIKE ".*svn.*"
     OR auditd.paths.name RLIKE ".*wc[.]db.*"
     OR auditd.paths.name RLIKE ".*svn-commit.*"
     OR auditd.paths.name RLIKE ".*svn-base.*"
     OR auditd.paths.name RLIKE ".*pristine.*"
     OR auditd.paths.name RLIKE ".*svnrepos.*"
  | WHERE auditd.paths.name IS NOT NULL
  | EVAL host_name    = host.hostname
  | EVAL actor        = COALESCE(auditd.data.subj_user, auditd.data.uid)
  | EVAL file_path    = auditd.paths.name
  | EVAL file_inode   = auditd.paths.inode
  | EVAL file_mode    = auditd.paths.mode
  | EVAL hash_code    = auditd.paths.cap_fp
  | EVAL added_item   = auditd.paths.cap_fi
  | EVAL deleted_item = auditd.paths.cap_fver
  | EVAL syscall      = auditd.data.syscall
  | EVAL tty          = auditd.data.tty
  | EVAL is_critical_svn = CASE(
      auditd.paths.name RLIKE ".*wc[.]db.*",       "YES - SVN metadata",
      auditd.paths.name RLIKE ".*pristine.*",      "YES - SVN revision store",
      auditd.paths.name RLIKE ".*svn-commit.*",    "YES - SVN commit file",
      auditd.paths.name RLIKE ".*[.]svn.*",        "YES - SVN working copy",
      "NO"
    )
  | STATS
      event_count        = COUNT(*),
      host_names         = VALUES(host.hostname),
      actors             = VALUES(auditd.data.subj_user),
      file_paths         = VALUES(auditd.paths.name),
      file_modes         = VALUES(auditd.paths.mode),
      hash_codes         = VALUES(auditd.paths.cap_fp),
      added_items        = VALUES(auditd.paths.cap_fi),
      deleted_items      = VALUES(auditd.paths.cap_fver),
      syscalls           = VALUES(auditd.data.syscall),
      ttys               = VALUES(auditd.data.tty),
      critical_svn_paths = VALUES(is_critical_svn),
      last_seen          = MAX(@timestamp),
      first_seen         = MIN(@timestamp)
    BY agent_id, host.hostname, auditd.paths.name, auditd.data.subj_user
  | WHERE event_count >= 1
  | EVAL
      host_name         = host.hostname,
      file_name         = auditd.paths.name,
      user              = auditd.data.subj_user
  | KEEP
      agent_id,
      host_name,
      file_name,
      user,
      event_count,
      host_names,
      actors,
      file_paths,
      file_modes,
      hash_codes,
      added_items,
      deleted_items,
      syscalls,
      ttys,
      critical_svn_paths,
      last_seen,
      first_seen
  | SORT event_count DESC
enabled: true
tags:
