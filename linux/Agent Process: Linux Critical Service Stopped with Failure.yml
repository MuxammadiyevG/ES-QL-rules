rule_id: c98a5bc6-6984-42a7-baa4-0e5663871925
name_uz: "Agent Process: Linux'da kritik servis xatolik bilan to'xtatildi"
name_ru: "Agent Process: критичная служба Linux остановлена с ошибкой"
name_en: "Agent Process: Linux Critical Service Stopped with Failure"
description_uz: |
  Ushbu qoida Impact va Defense Evasion texnikalariga bog'liq bo'lib, Linux tizimida
  servis muvaffaqiyatsiz to'xtatilishini (stopped-service + failure) aniqlaydi.
  Bu holat servis crash, kill signali, yoki hujumchi tomonidan ataylab to'xtatilishni
  bildirishi mumkin. Security, auditd, syslog kabi kritik servislarning to'xtashi
  monitoring bo'shlig'ini yaratadi.
  Qonuniy holatlar: servis konfiguratsiya xatosi, restart jarayoni, tizim yangilanishi.
  SOC triage bosqichlari:
  - `auditd.summary.how` — qaysi process servisni to'xtatganini tekshiring.
  - `user.id == 0` bo'lmagan holda to'xtash shubhali.
  - `user.selinux.user: unconfined` — SELinux cheklovisiz foydalanuvchi.
  - Bir xil hostda qisqa vaqtda bir nechta servis to'xtashi — ransomware yoki wiper belgisi.
  - `journalctl -u <service> --since` orqali servis loglarini tekshiring.
  - Noqonuniy bo'lsa: servisni qayta ishga tushiring, sababi aniqlang.
description_ru: |
  Данное правило связано с техниками Impact и Defense Evasion и выявляет неуспешную
  остановку службы (stopped-service + failure) в системе Linux.
  Это может указывать на сбой службы, сигнал kill или преднамеренную остановку
  злоумышленником. Остановка критичных служб, таких как Security, auditd, syslog,
  создаёт пробел в мониторинге.
  Легитимные случаи: ошибка конфигурации службы, процедура перезапуска, обновление системы.
  Шаги SOC-триажа:
  - `auditd.summary.how` — проверьте, какой процесс остановил службу.
  - Остановка без `user.id == 0` подозрительна.
  - `user.selinux.user: unconfined` — пользователь без ограничений SELinux.
  - Остановка нескольких служб на одном хосте за короткое время — признак ransomware или wiper.
  - Проверьте логи службы через `journalctl -u <service> --since`.
  - Если нелегитимно: перезапустите службу, установите причину.
description_en: |
  This rule is related to Impact and Defense Evasion techniques and detects a service
  being stopped with a failure (stopped-service + failure) on a Linux system.
  This may indicate a service crash, a kill signal, or a deliberate stop performed by
  an attacker. Stopping critical services such as Security, auditd, syslog creates a
  monitoring gap.
  Legitimate cases: service configuration error, restart procedure, system update.
  SOC triage steps:
  - `auditd.summary.how` — check which process stopped the service.
  - A stop performed without `user.id == 0` is suspicious.
  - `user.selinux.user: unconfined` — user without SELinux confinement.
  - Several services stopping on the same host in a short time — a sign of ransomware or a wiper.
  - Check the service logs via `journalctl -u <service> --since`.
  - If illegitimate: restart the service, determine the cause.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.module == "auditd"
  | WHERE event.action == "stopped-service"
  | WHERE event.outcome == "failure"
  | WHERE event.category == "process"
  | WHERE event.type == "end"
  | EVAL host_name    = host.hostname
  | EVAL user_name    = user.name
  | EVAL user_id      = user.id
  | EVAL selinux_user = user.selinux.user
  | EVAL action       = event.action
  | EVAL outcome      = event.outcome
  | STATS
      event_count    = COUNT(*),
      host_names     = VALUES(host.hostname),
      user_names     = VALUES(user.name),
      user_ids       = VALUES(user.id),
      selinux_users  = VALUES(user.selinux.user),
      outcomes       = VALUES(event.outcome),
      last_seen      = MAX(@timestamp),
      first_seen     = MIN(@timestamp)
    BY agent_id, host.hostname, user.id
  | WHERE event_count >= 200
  | EVAL
      host_name = host.hostname,
      user_id   = user.id
  | KEEP
      agent_id, host_name, user_id, event_count,
      host_names, user_names, user_ids, selinux_users,
      outcomes, last_seen, first_seen
  | SORT event_count DESC
enabled: true
tags:
  - attack.impact
  - attack.defense-evasion
  - attack.t1489
  - attack.t1562.001
  - detection.threat-hunting
severity: high
risk_score: 72
references:
  - "https://attack.mitre.org/techniques/T1489/"
  - "https://attack.mitre.org/techniques/T1562/001/"
nist: ["SI-4", "AU-12", "IR-4", "CP-10"]
pci_dss: ["10.6.1", "12.10.1", "6.3"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0040:
    T1489: []
  TA0005:
    T1562: ["T1562.001"]