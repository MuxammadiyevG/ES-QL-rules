rule_id: 4759cf1e-0ad9-49d2-bb6b-c13cc247f3a6
name: "Clipboard Image Collection - Linux"
description: |
  Detects usage of xclip to capture clipboard images.
  Adversaries may collect clipboard data including screenshots and images.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE event.action == "executed"
  | WHERE process.name == "xclip" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*(image/png|image/jpeg).*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.collection
  - attack.t1113
severity: medium
risk_score: 50
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0009:
    T1113: []
