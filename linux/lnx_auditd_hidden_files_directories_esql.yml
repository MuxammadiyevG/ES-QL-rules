rule_id: 1a2339b5-da0b-4dce-a905-1531d7c2ea86
name_uz: "Yashirin fayl va kataloglar yaratilishi"
name_ru: "Создание скрытых файлов и каталогов"
name_en: "Hidden Files and Directories Creation"
description_uz: |
  Yashirin fayl va kataloglarning (nuqta bilan boshlanadigan) yaratilishini aniqlaydi.
  Tajovuzkorlar zararli faoliyatni yashirish uchun yashirin fayllardan foydalanishi mumkin.
description_ru: |
  Обнаруживает создание скрытых файлов и каталогов (начинающихся с точки).
  Злоумышленники могут использовать скрытые файлы для сокрытия вредоносной активности.
description_en: |
  Detects creation of hidden files and directories (starting with dot).
  Adversaries may use hidden files to conceal malicious activity.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE event.action == "executed"
  | WHERE process.name IN ("touch", "mkdir") AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*/\\..*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      file_paths = VALUES(file.path),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 3
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, file_paths, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.defense-evasion
  - attack.t1564.001
severity: low
risk_score: 35
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1564: ["T1564.001"]
