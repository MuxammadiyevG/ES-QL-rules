rule_id: 25c6b486-8a5b-4275-85ae-800b6bf88433
name_uz: "History fayllari bilan amallarni aniqlash"
name_ru: "Обнаружение операций с файлами истории"
name_en: "History File Operations Detection"
description_uz: |
  Shell history fayllari ustidagi shubhali amallarni aniqlaydi.
  Tajovuzkorlar izlarini yashirish uchun history'ni tozalashi mumkin.
description_ru: |
  Обнаруживает подозрительные операции с файлами истории shell.
  Злоумышленники могут очищать историю, чтобы скрыть свои следы.
description_en: |
  Detects suspicious operations on shell history files.
  Adversaries may clear history to hide their tracks.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE event.action == "executed"
  | WHERE process.name IN ("rm", "shred", "truncate")
    AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*(bash_history|zsh_history|\\.history).*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      file_paths = VALUES(file.path),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, file_paths, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.defense-evasion
  - attack.t1070.003
severity: medium
risk_score: 65
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1070: ["T1070.003"]
