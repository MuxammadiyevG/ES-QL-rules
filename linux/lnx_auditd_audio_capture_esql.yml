rule_id: b5710dff-9242-429f-a9e4-147035f5e1a4
name_uz: "Audio yozib olishni aniqlash"
name_ru: "Обнаружение записи аудио"
name_en: "Audio Capture Detection"
description_uz: |
  arecord yoki ecasound utilitalari yordamida audio yozib olishga urinishlarni aniqlaydi.
  Tajovuzkorlar josuslik maqsadida audio yozib olish uchun o'rnatilgan vositalardan foydalanishi mumkin.
  arecord ning maxsus bayroqlar bilan ishga tushirilishini yoki agent_id, ecasound tomonidan memfd_create syscall ni kuzatadi.
description_ru: |
  Обнаруживает попытки записи аудио с помощью утилит arecord или ecasound.
  Злоумышленники могут использовать встроенные инструменты для записи аудио в целях шпионажа.
  Отслеживает запуск arecord с определёнными флагами или системный вызов memfd_create от agent_id, ecasound.
description_en: |
  Detects attempts to record audio using arecord or ecasound utilities.
  Adversaries may use built-in tools to record audio for espionage.
  Monitors execution of arecord with specific flags or memfd_create syscall by agent_id, ecasound.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd EXECVE or SYSCALL */
  /* selection 1: arecord execution */
  | WHERE (
      process.name == "arecord"
      AND (
        TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*-vv.*"
        OR TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*-fdat.*"
      )
    )
    /* selection 2: ecasound memfd_create */
    OR (
      process.executable RLIKE ".*/ecasound"
      AND (
        TO_LOWER(COALESCE(event.original, "")) RLIKE ".*syscall=319.*" /* memfd_create */
        OR TO_LOWER(COALESCE(event.original, "")) RLIKE ".*syscall=memfd_create.*"
      )
    )
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      executables = VALUES(process.executable),
      command_lines = VALUES(process.title),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, executables, command_lines, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.collection
  - attack.t1123
severity: low
risk_score: 30
references:
  - "https://linux.die.net/man/1/arecord"
  - "https://attack.mitre.org/techniques/T1123/"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0009:
    T1123: []
