rule_id: eb3d6456-c321-4d2c-9ed4-aebc9ee7b04f
name: "Suspicious Service Reload or Restart"
description: |
  Detects suspicious service reload or restart commands.
  May indicate persistence mechanism or service manipulation.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE event.action == "executed"
  | WHERE process.name IN ("systemctl", "service")
    AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*(reload|restart).*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 5
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.persistence
  - attack.t1543.002
severity: low
risk_score: 35
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0003:
    T1543: ["T1543.002"]
