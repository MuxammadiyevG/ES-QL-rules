rule_id: 4123fb98-059d-4520-a511-bf85d419b582
name_uz: "Agent FIM: Windows Startup papkasidagi fayl o'zgartirildi (Persistence)"
name_ru: "Agent FIM: изменение файла в папке Windows Startup (Persistence)"
name_en: "Agent FIM: Windows Startup Folder File Modified (Persistence)"
description_uz: |
  Ushbu qoida Persistence texnikasiga bog'liq bo'lib, Windows Startup papkasidagi
  fayl o'zgarishlarini aniqlaydi. Bu eng oddiy va samarali persistence mexanizmlaridan
  biri — bu papkadagi har qanday fayl tizim yoki foydalanuvchi loginida avtomatik
  ishga tushadi.
  Qonuniy holatlar: dastur o'rnatishda startup shortcut yaratilishi.
  SOC triage bosqichlari:
  - `file.name` va `file.path` ni tekshiring — kutilmagan fayl nomi shubhali.
  - `file.extension` — exe, lnk, vbs, ps1 bo'lsa tekshiring.
  - `file.owner` — SYSTEM yoki Administrator bo'lmagan owner shubhali.
  - Startup faylni manual tekshiring: ulanish manzili, argumentlari.
  - Noqonuniy bo'lsa: faylni o'chiring, autorun ro'yxatini tekshiring.
description_ru: |
  Данное правило связано с техникой Persistence и обнаруживает изменения файлов
  в папке Windows Startup. Это один из самых простых и эффективных механизмов
  закрепления — любой файл в этой папке автоматически запускается при загрузке системы
  или при входе пользователя.
  Легитимные случаи: создание startup shortcut при установке программы.
  Этапы SOC-триажа:
  - Проверьте `file.name` и `file.path` — неожиданное имя файла подозрительно.
  - `file.extension` — проверьте, если это exe, lnk, vbs, ps1.
  - `file.owner` — владелец, отличный от SYSTEM или Administrator, подозрителен.
  - Проверьте файл startup вручную: адрес ссылки, аргументы.
  - Если нелегитимно: удалите файл, проверьте список autorun.
description_en: |
  This rule is related to the Persistence technique and detects file changes
  in the Windows Startup folder. This is one of the simplest and most effective persistence
  mechanisms — any file in this folder runs automatically at system or user
  login.
  Legitimate cases: creation of a startup shortcut during software installation.
  SOC triage steps:
  - Check `file.name` and `file.path` — an unexpected file name is suspicious.
  - `file.extension` — check if it is exe, lnk, vbs, ps1.
  - `file.owner` — an owner other than SYSTEM or Administrator is suspicious.
  - Inspect the startup file manually: link target, arguments.
  - If illegitimate: delete the file, check the autorun list.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.module == "file_integrity"
  | WHERE host.os.type == "windows"
  | WHERE event.type == "change"
  | WHERE STARTS_WITH(file.path, "C:\\Users\\")
      AND STARTS_WITH(file.path, "C:\\Users\\") AND file.path LIKE "*Startup*"
      OR STARTS_WITH(file.path, "C:\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\")
  | EVAL host_name  = host.hostname
  | EVAL file_path  = file.path
  | EVAL file_name  = file.name
  | EVAL file_ext   = file.extension
  | EVAL file_owner = file.owner
  | EVAL file_size  = file.size
  | EVAL file_mtime = file.mtime
  | EVAL action     = event.action
  | WHERE file_path IS NOT NULL
  | STATS
      event_count = COUNT(*),
      host_names  = VALUES(host.hostname),
      file_paths  = VALUES(file.path),
      file_names  = VALUES(file.name),
      file_exts   = VALUES(file.extension),
      file_owners = VALUES(file.owner),
      file_sizes  = VALUES(file.size),
      actions     = VALUES(event.action),
      last_seen   = MAX(@timestamp),
      first_seen  = MIN(@timestamp)
    BY agent_id, host.hostname, file.path
  | WHERE event_count >= 1
  | EVAL
      host_name = host.hostname,
      file_path = file.path
  | KEEP
      agent_id, host_name, file_path, event_count,
      host_names, file_paths, file_names, file_exts,
      file_owners, file_sizes, actions, last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - attack.persistence
  - attack.t1547.001
  - detection.threat-hunting
severity: critical
risk_score: 88
references:
