rule_id: 03f4c445-fc34-4314-81d9-71dcd10e13c5
name_uz: "DD orqali fayl o'chirishni aniqlash"
name_ru: "Обнаружение удаления файлов через dd"
name_en: "DD File Deletion Detection"
description_uz: |
  dd buyrug'i agent_id, nollar bilan ustidan yozish orqali fayllarni o'chirish uchun ishlatilayotganini aniqlaydi.
  Tajovuzkorlar tiklanishning oldini olish uchun fayllarni xavfsiz o'chirishda dd dan foydalanishi mumkin.
description_ru: |
  Обнаруживает использование команды dd для удаления файлов посредством agent_id, перезаписи нулями.
  Злоумышленники могут использовать dd для безопасного удаления файлов, чтобы предотвратить восстановление.
description_en: |
  Detects dd command being used to delete files by agent_id, overwriting with zeros.
  Adversaries may use dd to securely delete files to prevent recovery.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE event.action == "executed"
  | WHERE process.name == "dd" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*of=.*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.impact
  - attack.t1485
severity: medium
risk_score: 60
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0040:
    T1485: []
