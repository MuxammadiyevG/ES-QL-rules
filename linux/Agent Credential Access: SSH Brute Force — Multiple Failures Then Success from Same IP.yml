rule_id: 19e271d2-a8a0-4239-a223-e705398aa0b2
name: "Agent Credential Access: SSH Brute Force — Multiple Failures Then Success from Same IP"
description: |
  Ushbu qoida Credential Access texnikasiga bog'liq bo'lib, bir xil IP manzildan qisqa
  vaqt ichida bir necha marta muvaffaqiyatsiz SSH login urinishi va oxirida muvaffaqiyatli
  login hodisasini aniqlaydi. Bu klassik SSH brute force hujumining muvaffaqiyatli
  yakunlangan varianti hisoblanadi va darhol javob talab qiladi.
  Qonuniy holatlar: foydalanuvchi parolini bir necha marta xato kiritib, keyin to'g'ri kiritishi
  (odatda 1-2 ta xato, 5+ ta xato shubhali).
  SOC triage bosqichlari:
  - `src_ip` manzilidan `fail_count` va `success_count` nisbatini baholang.
  - Muvaffaqiyatli login qilgan `target_acct` ning keyingi faoliyatini tekshiring.
  - Muvaffaqiyatli login `auditd.session` dan keyingi sudo yoki execve hodisalarini ko'ring.
  - `src_ip` ni threat intelligence bazasi bilan solishtiring.
  - `first_seen` va `last_seen` orasidagi vaqt oralig'ini hisoblang — tez bo'lsa avtomatlashtirilgan.
  - Darhol: IP ni bloklang, sessiyani to'xtating, account parolini reset qiling, incident oching.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE auditd.message_type == "user_login"
  | WHERE network.direction == "ingress"
  | WHERE source.ip IS NOT NULL
  | EVAL host_name    = host.hostname
  | EVAL target_acct  = COALESCE(
        auditd.data.acct,
        user.audit.name,
        user.effective.name,
        auditd.summary.actor.secondary
      )
  | EVAL src_ip       = source.ip
  | EVAL result       = auditd.result
  | EVAL terminal     = auditd.data.terminal
  | EVAL session_id   = auditd.session
  | STATS
      event_count    = COUNT(*),
      fail_count     = COUNT(auditd.result == "fail"),
      success_count  = COUNT(auditd.result == "success"),
      host_names     = VALUES(host.hostname),
      target_accts   = VALUES(auditd.data.acct),
      terminals      = VALUES(auditd.data.terminal),
      session_ids    = VALUES(auditd.session),
      last_seen      = MAX(@timestamp),
      first_seen     = MIN(@timestamp)
    BY agent_id, host.hostname, source.ip
  | WHERE fail_count >= 5 AND success_count >= 1
  | EVAL
      host_name = host.hostname,
      src_ip    = source.ip
  | KEEP
      agent_id, host_name, src_ip, event_count,
      fail_count, success_count,
      host_names, target_accts, terminals,
      session_ids, last_seen, first_seen
  | SORT fail_count DESC
enabled: true
tags:
  - attack.credential-access
  - attack.initial-access
  - attack.t1110.001
  - attack.t1133
  - detection.threat-hunting
severity: critical
risk_score: 92
references:
  - "https://attack.mitre.org/techniques/T1110/001/"
  - "https://attack.mitre.org/techniques/T1133/"
nist: ["AC-7", "AC-17", "SI-4", "IR-4", "SC-7"]
pci_dss: ["8.1.6", "8.3", "10.2.4", "10.2.5", "11.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0006:
    T1110: ["T1110.001"]
  TA0001:
    T1133: []