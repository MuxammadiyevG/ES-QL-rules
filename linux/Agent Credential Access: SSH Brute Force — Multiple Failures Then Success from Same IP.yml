rule_id: 19e271d2-a8a0-4239-a223-e705398aa0b2
name_uz: "Agent Credential Access: SSH Brute Force — Bir Xil IP dan Bir Necha Muvaffaqiyatsizlik, So'ng Muvaffaqiyat"
name_ru: "Agent Credential Access: SSH brute force — несколько неудач, затем успех с того же IP"
name_en: "Agent Credential Access: SSH Brute Force — Multiple Failures Then Success from Same IP"
description_uz: |
  Ushbu qoida Credential Access texnikasiga bog'liq bo'lib, bir xil IP manzildan qisqa
  vaqt ichida bir necha marta muvaffaqiyatsiz SSH login urinishi va oxirida muvaffaqiyatli
  login hodisasini aniqlaydi. Bu klassik SSH brute force hujumining muvaffaqiyatli
  yakunlangan varianti hisoblanadi va darhol javob talab qiladi.
  Qonuniy holatlar: foydalanuvchi parolini bir necha marta xato kiritib, keyin to'g'ri kiritishi
  (odatda 1-2 ta xato, 5+ ta xato shubhali).
  SOC triage bosqichlari:
  - `src_ip` manzilidan `fail_count` va `success_count` nisbatini baholang.
  - Muvaffaqiyatli login qilgan `target_acct` ning keyingi faoliyatini tekshiring.
  - Muvaffaqiyatli login `auditd.session` dan keyingi sudo yoki execve hodisalarini ko'ring.
  - `src_ip` ni threat intelligence bazasi bilan solishtiring.
  - `first_seen` va `last_seen` orasidagi vaqt oralig'ini hisoblang — tez bo'lsa avtomatlashtirilgan.
  - Darhol: IP ni bloklang, sessiyani to'xtating, account parolini reset qiling, incident oching.
description_ru: |
  Это правило связано с техникой Credential Access и выявляет несколько неудачных попыток входа по SSH
  с одного и того же IP-адреса за короткое время и в конце успешное
  событие входа. Это успешно завершившийся вариант классической атаки
  SSH brute force, и он требует немедленного реагирования.
  Легитимные случаи: пользователь несколько раз неверно ввёл пароль, а затем ввёл верно
  (обычно 1-2 ошибки, 5+ ошибок подозрительно).
  Этапы SOC-триажа:
  - Оцените соотношение `fail_count` и `success_count` с адреса `src_ip`.
  - Проверьте дальнейшую активность `target_acct`, выполнившего успешный вход.
  - Посмотрите события sudo или execve после успешного входа `auditd.session`.
  - Сопоставьте `src_ip` с базой threat intelligence.
  - Вычислите интервал между `first_seen` и `last_seen` — если он короткий, атака автоматизирована.
  - Немедленно: заблокируйте IP, завершите сессию, сбросьте пароль account, откройте инцидент.
description_en: |
  This rule is related to the Credential Access technique and detects several failed SSH login
  attempts from the same IP address within a short period of time and, at the end, a successful
  login event. This is the successfully completed variant of a classic SSH brute force
  attack and it requires an immediate response.
  Legitimate cases: a user entering the password incorrectly several times and then entering it correctly
  (usually 1-2 failures, 5+ failures are suspicious).
  SOC triage steps:
  - Assess the ratio of `fail_count` to `success_count` from the `src_ip` address.
  - Check the subsequent activity of the `target_acct` that logged in successfully.
  - Review the sudo or execve events following the successful login `auditd.session`.
  - Compare the `src_ip` against a threat intelligence database.
  - Calculate the time interval between `first_seen` and `last_seen` — if it is short, the attack is automated.
  - Immediately: block the IP, terminate the session, reset the account password, open an incident.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE auditd.message_type == "user_login"
  | WHERE network.direction == "ingress"
  | WHERE source.ip IS NOT NULL
  | EVAL host_name    = host.hostname
  | EVAL target_acct  = COALESCE(
        auditd.data.acct,
        user.audit.name,
        user.effective.name,
        auditd.summary.actor.secondary
      )
  | EVAL src_ip       = source.ip
  | EVAL result       = auditd.result
  | EVAL terminal     = auditd.data.terminal
  | EVAL session_id   = auditd.session
  | STATS
      event_count    = COUNT(*),
      fail_count     = COUNT(auditd.result == "fail"),
      success_count  = COUNT(auditd.result == "success"),
      host_names     = VALUES(host.hostname),
      target_accts   = VALUES(auditd.data.acct),
      terminals      = VALUES(auditd.data.terminal),
      session_ids    = VALUES(auditd.session),
      last_seen      = MAX(@timestamp),
      first_seen     = MIN(@timestamp)
    BY agent_id, host.hostname, source.ip
  | WHERE fail_count >= 5 AND success_count >= 1
  | EVAL
      host_name = host.hostname,
      src_ip    = source.ip
  | KEEP
      agent_id, host_name, src_ip, event_count,
      fail_count, success_count,
      host_names, target_accts, terminals,
      session_ids, last_seen, first_seen
  | SORT fail_count DESC
enabled: true
