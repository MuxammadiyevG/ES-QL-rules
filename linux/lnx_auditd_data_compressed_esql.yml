rule_id: 9407d2b1-fe0c-43fa-aadb-c161d53cbc48
name_uz: "Ma'lumotlarni siqishni aniqlash - Linux"
name_ru: "Обнаружение сжатия данных - Linux"
name_en: "Data Compression Detection - Linux"
description_uz: |
  Linux tizimlarida ma'lumotlar siqilayotganini aniqlaydi.
  Tajovuzkorlar aniqlashni qiyinlashtirish yoki yuboriladigan ma'lumot hajmini kamaytirish uchun eksfiltratsiyadan oldin ma'lumotlarni siqishi mumkin.
  gzip, bzip2, siqish bilan tar va zip kabi keng tarqalgan siqish vositalari kuzatiladi.
  Eslatma: qonuniy tizim operatsiyalari ham siqishdan foydalanadi. Boshqa shubhali faoliyat bilan korrelyatsiya qiling.
description_ru: |
  Обнаруживает сжатие данных в системах Linux.
  Злоумышленники могут сжимать данные перед эксфильтрацией, чтобы затруднить обнаружение или уменьшить объём передаваемых данных.
  Отслеживаются распространённые инструменты сжатия: gzip, bzip2, tar со сжатием и zip.
  Примечание: легитимные системные операции также используют сжатие. Соотносите с другой подозрительной активностью.
description_en: |
  Detects data being compressed on Linux systems.
  Adversaries may compress data before exfiltration to make it harder to detect or to reduce the amount of data sent.
  Common compression tools like gzip, bzip2, tar with compression, and zip are monitored.
  Note: Legitimate system operations also use compression. Correlate with other suspicious activities.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd execve telemetry */
  | WHERE event.action == "executed"
  /* selection: compression commands */
  | WHERE process.name IN ("gzip", "bzip2", "tar", "zip", "7z", "rar", "xz")
    OR TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*(tar\\s+.*(c|z)|gzip|bzip2|zip|7z|rar).*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      executables = VALUES(process.executable),
      file_paths = VALUES(file.path),
      working_directories = VALUES(process.working_directory),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 5
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, executables, file_paths, working_directories, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.collection
  - attack.t1560.001
  - detection.threat-hunting
severity: low
risk_score: 30
references:
  - "https://attack.mitre.org/techniques/T1560/001/"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0009:
    T1560: ["T1560.001"]
