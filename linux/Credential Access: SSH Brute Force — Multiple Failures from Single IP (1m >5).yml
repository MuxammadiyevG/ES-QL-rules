rule_id: 7f58b742-0310-4512-a35a-5160bdab7fe0
name_uz: "Credential Access: SSH brute force — bitta IP'dan bir nechta muvaffaqiyatsizlik (1m >5)"
name_ru: "Credential Access: SSH brute force — несколько неудач с одного IP (1m >5)"
name_en: "Credential Access: SSH Brute Force — Multiple Failures from Single IP (1m >5)"
description_uz: |
  Ushbu qoida bitta IP manzildan 1 daqiqa ichida 5 tadan ortiq
  muvaffaqiyatsiz SSH login urinishlarini aniqlaydi.
  Bu SSH brute-force yoki password guessing hujumini ko'rsatishi mumkin.
description_ru: |
  Данное правило выявляет более 5 неуспешных попыток входа по SSH
  с одного IP-адреса в течение 1 минуты.
  Это может указывать на атаку SSH brute-force или подбор пароля (password guessing).
description_en: |
  This rule detects more than 5 failed SSH login attempts from a single
  IP address within 1 minute.
  This may indicate an SSH brute-force or password guessing attack.
type: esql
params: "{}"
schedule_interval: 1m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 1 minute
  | WHERE auditd.message_type == "user_login"
    AND auditd.result == "fail"
    AND auditd.data.op == "login"
    AND auditd.data.terminal == "sshd"
    AND source.ip IS NOT NULL
  | EVAL
      src_ip = source.ip,
      target_acct = auditd.data.acct,
      host_name = host.hostname
  | STATS
      fail_count = COUNT(*),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id,src_ip, target_acct, host_name
  | WHERE fail_count > 5
  | KEEP
      agent_id,
      src_ip,
      target_acct,
      host_name,
      fail_count,
      first_seen,
      last_seen
  | SORT fail_count DESC
enabled: true
tags:
  - attack.credential-access
  - attack.t1110.001
  - ssh
  - brute-force
  - auditd
severity: high
risk_score: 80
references:
  - "https://attack.mitre.org/techniques/T1110/001/"
nist: ["AC-7", "AC-2", "AU-2", "AU-6", "SI-4", "IR-4"]
pci_dss: ["8.1.6", "8.3", "10.2.4", "10.2.5", "11.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0006:
    T1110: ["T1110.001"]
