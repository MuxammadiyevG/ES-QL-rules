rule_id: 35c9f69c-c94d-4e36-b618-e5565954417c
name_uz: "Linux Auth - ko'p turli manbalardan SSH ulanishi"
name_ru: "Linux Auth - SSH-подключения с множества разных источников"
name_en: "Linux Auth - SSH Connection from Many Distinct Sources"
description_uz: |
  Ushbu qoida Linux auth.log (logs-linux.auth-*) dagi sshd hodisalarini kuzatib,
  bitta host ko'p sonli turli `source.ip` manzillaridan SSH autentifikatsiya urinishlari
  qabul qilayotganini aniqlaydi. Bu password spray, scanning yoki distributed brute-force
  belgisi bo'lishi mumkin (T1110). auth.log network ulanishlarini ko'rmaydi — shu sabab
  qoida faqat SSH autentifikatsiya maydonlariga tayanadi.
  Qonuniy holatlar: bastion/jump host, NAT orqasidagi ko'p mijoz, monitoring agentlari.
  SOC triage bosqichlari:
  - Qaysi `host`ga ko'p `source.ip` dan urinish kelayotganini tekshiring.
  - Muvaffaqiyatsiz urinishlardan keyin muvaffaqiyatli kirish borligini ko'ring.
  - `source.geo` orqali noodatiy mamlakat/shaharlarni aniqlang.
  - Noqonuniy faoliyat tasdiqlansa: IP larni bloklang, fail2ban/firewall qo'llang.
description_ru: |
  Это правило отслеживает события sshd в Linux auth.log (logs-linux.auth-*) и выявляет,
  что один хост получает попытки SSH-аутентификации с большого числа различных
  адресов `source.ip`. Это может быть признаком password spray, сканирования или распределённого перебора паролей
  (brute-force, T1110). auth.log не видит сетевых подключений — поэтому
  правило опирается только на поля SSH-аутентификации.
  Легитимные случаи: bastion/jump host, множество клиентов за NAT, агенты мониторинга.
  Этапы SOC triage:
  - Проверьте, на какой `host` приходят попытки с множества `source.ip`.
  - Посмотрите, был ли успешный вход после неуспешных попыток.
  - Определите необычные страны/города по `source.geo`.
  - При подтверждении вредоносной активности: заблокируйте IP-адреса, примените fail2ban/firewall.
description_en: |
  This rule monitors sshd events in the Linux auth.log (logs-linux.auth-*) and detects
  a single host receiving SSH authentication attempts from a large number of distinct
  `source.ip` addresses. This may be a sign of password spray, scanning or distributed brute-force
  (T1110). auth.log does not see network connections — for that reason
  the rule relies only on SSH authentication fields.
  Legitimate cases: bastion/jump host, many clients behind NAT, monitoring agents.
  SOC triage steps:
  - Check which `host` is receiving attempts from many `source.ip` addresses.
  - See whether a successful login follows the failed attempts.
  - Identify unusual countries/cities via `source.geo`.
  - If malicious activity is confirmed: block the IPs, apply fail2ban/firewall.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-linux.auth-*
query_language: esql
query: |
  FROM logs-linux.auth-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE data_stream.dataset == "linux.auth"
  | WHERE event.category == "authentication"
  | WHERE event.action IN (
      "ssh-login-success",
      "ssh-login-failed",
      "ssh-invalid-user"
    )
  | EVAL actor    = COALESCE(user.name, "Unknown")
  | EVAL hostn    = COALESCE(host.hostname, "Unknown")
  | EVAL src_ip   = COALESCE(TO_STRING(source.ip), "Unknown")
  | EVAL outcome  = COALESCE(event.outcome, "Unknown")
  | EVAL action   = COALESCE(event.action, "Unknown")
  /* Monitoring agentlarini chiqarib tashlash */
  | WHERE actor NOT IN ("wazuh", "zabbix", "nagios", "elastic")
  | STATS
      conn_count      = COUNT(*),
      distinct_srcs   = COUNT_DISTINCT(src_ip),
      success_count   = COUNT_IF(outcome == "success"),
      failure_count   = COUNT_IF(outcome == "failure"),
      actors          = VALUES(actor),
      src_ips         = VALUES(src_ip),
      actions         = VALUES(action),
      first_seen      = MIN(@timestamp),
      last_seen       = MAX(@timestamp)
    BY agent_id, hostn, bucket = DATE_TRUNC(10 minutes, @timestamp)
  /* Bitta host ko'p turli manbadan SSH urinishi (scanning/spray) */
  | WHERE distinct_srcs >= 5
  | KEEP agent_id, bucket, hostn, conn_count, distinct_srcs, success_count,
         failure_count, actors, src_ips, actions, first_seen, last_seen
  | SORT distinct_srcs DESC, conn_count DESC
  | LIMIT 200
enabled: false
tags:
  - attack.credential_access
  - attack.t1110
  - detection.linux
  - linux.auth.ssh
severity: medium
risk_score: 60
nist: ["AU-2", "AU-12", "SC-7"]
pci_dss: ["10.2.4", "10.2.5", "1.3.2"]
gdpr: ["32.1.a", "32.2"]
mitre_attack:
  TA0006:
    T1110: []
