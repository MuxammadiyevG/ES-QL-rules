rule_id: 8a53fec0-9b94-4096-8721-f7361050f007
name_uz: "Yashirin ZIP steganografiyasini ochish"
name_ru: "Извлечение скрытого ZIP (стеганография)"
name_en: "Unzip Hidden ZIP Steganography"
description_uz: |
  Rasmlar ichidan ZIP fayllarni chiqarishni (steganografiya) aniqlaydi.
description_ru: |
  Обнаруживает извлечение ZIP-архивов из изображений (стеганография).
description_en: |
  Detects extraction of ZIP files from images (steganography).
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE event.action == "executed"
  | WHERE process.name == "unzip" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*\\.(jpg|jpeg|png|gif).*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.defense-evasion
  - attack.t1027.003
severity: medium
risk_score: 55
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1027: ["T1027.003"]
