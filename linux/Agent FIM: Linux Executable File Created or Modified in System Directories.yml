rule_id: 0c3087cb-ef40-4a6b-bdb8-a3b8870b8a79
name_uz: "Agent FIM: tizim kataloglarida Linux bajariladigan fayl yaratildi yoki o'zgartirildi"
name_ru: "Agent FIM: в системных каталогах Linux создан или изменён исполняемый файл"
name_en: "Agent FIM: Linux Executable File Created or Modified in System Directories"
description_uz: |
  Ushbu qoida Persistence va Defense Evasion texnikalariga bog'liq bo'lib, Linux tizim
  kataloglarida bajariladigan fayl (.sh, .py, .pl, .rb, .elf va extension-siz binary)
  yaratilishi yoki o'zgartirilishini aniqlaydi.
  Hujumchi /usr/bin, /usr/sbin, /bin, /sbin kataloglarida trojanize qilingan binary
  yoki backdoor skript joylashtirishi mumkin.
  Qonuniy holatlar: apt/dpkg paket o'rnatish, tizim yangilanishi, deployment skriptlari.
  SOC triage bosqichlari:
  - `file.path` ni tekshiring — tizim binary katalogidami yoki foydalanuvchi homemi.
  - `file.owner` root bo'lmasa yoki `file.mode` SUID/SGID bitlari bo'lsa yuqori xavf.
  - `file.hash.sha1` ni oldingi baseline bilan solishtiring.
  - O'sha paytda qaysi process ishlayotganini auditd SYSCALL loglar bilan korrelatsiya qiling.
  - `file.mtime` vs `file.ctime` farqini tekshiring.
  - Noqonuniy bo'lsa: faylni karantinga oling, `sha256sum` bilan verify qiling.
description_ru: |
  Это правило связано с техниками Persistence и Defense Evasion и выявляет создание или
  изменение исполняемых файлов (.sh, .py, .pl, .rb, .elf и бинарные файлы без расширения)
  в системных каталогах Linux.
  Злоумышленник может разместить троянизированный бинарный файл или скрипт-бэкдор в каталогах
  /usr/bin, /usr/sbin, /bin, /sbin.
  Легитимные случаи: установка пакетов apt/dpkg, обновление системы, скрипты развёртывания.
  Шаги SOC-триажа:
  - Проверьте `file.path` — это системный каталог бинарных файлов или домашний каталог пользователя.
  - Если `file.owner` не root или в `file.mode` есть биты SUID/SGID — высокий риск.
  - Сравните `file.hash.sha1` с предыдущим baseline.
  - Скоррелируйте, какой процесс работал в этот момент, с логами auditd SYSCALL.
  - Проверьте разницу между `file.mtime` и `file.ctime`.
  - Если активность нелегитимна: поместите файл в карантин, проверьте его с помощью `sha256sum`.
description_en: |
  This rule is related to Persistence and Defense Evasion techniques and detects executable files
  (.sh, .py, .pl, .rb, .elf and extensionless binaries) being created or modified in Linux system
  directories.
  An attacker may place a trojanized binary or a backdoor script in the /usr/bin, /usr/sbin,
  /bin, /sbin directories.
  Legitimate cases: apt/dpkg package installation, system update, deployment scripts.
  SOC triage steps:
  - Check `file.path` — whether it is a system binary directory or a user home.
  - High risk if `file.owner` is not root or if `file.mode` has SUID/SGID bits.
  - Compare `file.hash.sha1` with the previous baseline.
  - Correlate which process was running at that time with auditd SYSCALL logs.
  - Check the difference between `file.mtime` and `file.ctime`.
  - If illegitimate: quarantine the file, verify it with `sha256sum`.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.module == "file_integrity"
  | WHERE event.type == "change"
  | WHERE host.os.type == "linux"
  | WHERE
      file.path LIKE "/usr/bin/*"
      OR file.path LIKE "/usr/sbin/*"
      OR file.path LIKE "/bin/*"
      OR file.path LIKE "/sbin/*"
      OR file.path LIKE "/usr/local/bin/*"
      OR file.path LIKE "/usr/local/sbin/*"
  | EVAL host_name   = host.hostname
  | EVAL file_path   = file.path
  | EVAL file_name   = file.name
  | EVAL file_ext    = file.extension
  | EVAL file_owner  = file.owner
  | EVAL file_mode   = file.mode
  | EVAL file_size   = file.size
  | EVAL file_hash   = file.hash.sha1
  | EVAL file_mtime  = file.mtime
  | EVAL action      = event.action
  | STATS
      event_count  = COUNT(*),
      host_names   = VALUES(host.hostname),
      file_paths   = VALUES(file.path),
      file_names   = VALUES(file.name),
      file_exts    = VALUES(file.extension),
      file_owners  = VALUES(file.owner),
      file_modes   = VALUES(file.mode),
      file_hashes  = VALUES(file.hash.sha1),
      file_sizes   = VALUES(file.size),
      actions      = VALUES(event.action),
      last_seen    = MAX(@timestamp),
      first_seen   = MIN(@timestamp)
    BY agent_id, host.hostname, file.path
  | WHERE event_count >= 1
  | EVAL
      host_name = host.hostname,
      file_path = file.path
  | KEEP
      agent_id, host_name, file_path, event_count,
      host_names, file_paths, file_names, file_exts,
      file_owners, file_modes, file_hashes, file_sizes,
      actions, last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - attack.persistence
  - attack.defense-evasion
  - attack.t1574.006
  - attack.t1565.001
  - detection.threat-hunting
severity: high
risk_score: 75
references:
  - "https://attack.mitre.org/techniques/T1574/006/"
  - "https://attack.mitre.org/techniques/T1565/001/"
nist: ["SI-7", "CM-7", "AU-9", "SI-4"]
pci_dss: ["10.5.1", "11.5", "6.3"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0003:
    T1574: ["T1574.006"]
  TA0040:
    T1565: ["T1565.001"]