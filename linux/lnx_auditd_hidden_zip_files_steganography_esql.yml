rule_id: 64ce632f-606b-466e-b663-ee1bb461166a
name_uz: "Yashirin ZIP fayllar steganografiyasi"
name_ru: "Стеганография в скрытых ZIP-файлах"
name_en: "Hidden ZIP Files Steganography"
description_uz: |
  Steganografiya maqsadida yashirin ZIP fayllar yaratilishini aniqlaydi.
description_ru: |
  Обнаруживает создание скрытых ZIP-файлов в целях стеганографии.
description_en: |
  Detects creation of hidden ZIP files for steganography purposes.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE event.action == "executed"
  | WHERE process.name == "zip" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*\\.jpg.*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.defense-evasion
  - attack.t1027.003
severity: medium
risk_score: 50
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1027: ["T1027.003"]
