rule_id: 4a6d86e7-ed77-4e9d-bd9e-16cb226ea773
name: "System Information Discovery"
description: |
  Detects commands and file accesses used to identify system information (OS version, kernel, etc.).
  Adversaries use this for reconnaissance.
  Monitors /etc/*release files and commands like uname, uptime, lsmod.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd EXECVE or PATH */
  /* selection 1: commands */
  | WHERE (
      process.name IN ("uname", "uptime", "lsmod", "hostname")
      OR (process.name == "grep" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*(vbox|vm|xen|virtio|hv).*")
      OR (process.name == "kmod" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*list.*")
    )
    /* selection 2: file access */
    OR (
      event.action == "opened-file"
      AND (
        file.path IN ("/etc/lsb-release", "/etc/redhat-release", "/etc/issue")
        OR TO_LOWER(file.path) RLIKE "/etc/.*release.*"
      )
    )
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      file_paths = VALUES(file.path),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  /* High threshold because these are very common commands */
  | WHERE event_count >= 10
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, file_paths, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.discovery
  - attack.t1082
severity: low
risk_score: 30
references:
  - "https://attack.mitre.org/techniques/T1082/"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0007:
    T1082: []
