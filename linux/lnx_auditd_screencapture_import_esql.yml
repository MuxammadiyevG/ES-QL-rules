rule_id: ea92cb39-9791-48d2-b3f5-1a34be120d9b
name_uz: "import buyrug'i orqali ekranni suratga olish"
name_ru: "Захват экрана с помощью команды import"
name_en: "Screen Capture with Import Command"
description_uz: |
  ImageMagick import buyrug'i yordamida ekranni suratga olishni aniqlaydi.
description_ru: |
  Обнаруживает захват экрана с помощью команды import из ImageMagick.
description_en: |
  Detects screen capture using ImageMagick import command.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE event.action == "executed"
  | WHERE process.name == "import" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*-window.*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 2
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.collection
  - attack.t1113
severity: medium
risk_score: 50
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0009:
    T1113: []
