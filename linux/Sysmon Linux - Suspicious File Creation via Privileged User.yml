rule_id: 1e1b31d8-2fb2-44bb-9fcb-d3d003b95534
name_uz: "Linux Auth - sudo/root orqali shubhali fayl amali"
name_ru: "Linux Auth - подозрительная файловая операция через sudo/root"
name_en: "Linux Auth - Suspicious File Op via sudo/root"
description_uz: |
  Ushbu qoida Linux auth.log (logs-linux.auth-*) dagi sudo komandalarini kuzatib,
  fayl yaratuvchi buyruqlar (touch/cp/dd/tee/install) shubhali kataloglarda (/tmp,
  /dev/shm, /var/tmp, /run) imtiyoz bilan ishlatilishini aniqlaydi. Bu persistence yoki
  payload tashlash (T1044) texnikasiga ishora qilishi mumkin.
  Qonuniy holatlar: rejalashtirilgan deployment skriptlari, paket o'rnatishlari, konfiguratsiya yangilanishlari.
  SOC triage bosqichlari:
  - `actor` (user.name) va `user.effective.name` ni tekshiring.
  - `process.command_line` (cmd) va `process.working_directory` ni tahlil qiling.
  - Yaratilgan fayl yo'li shubhali katalogda emasligini tasdiqlang (/tmp, /dev/shm, /var/tmp).
  - Noqonuniy faoliyat tasdiqlansa: faylni karantinga oling, manbani cheklang.
description_ru: |
  Это правило отслеживает команды sudo в Linux auth.log (logs-linux.auth-*) и выявляет
  запуск команд создания файлов (touch/cp/dd/tee/install) с привилегиями в подозрительных
  каталогах (/tmp, /dev/shm, /var/tmp, /run). Это может указывать на закрепление (persistence) или
  сброс полезной нагрузки (payload, T1044).
  Легитимные случаи: плановые скрипты развёртывания, установка пакетов, обновления конфигурации.
  Этапы SOC triage:
  - Проверьте `actor` (user.name) и `user.effective.name`.
  - Проанализируйте `process.command_line` (cmd) и `process.working_directory`.
  - Убедитесь, что путь созданного файла не находится в подозрительном каталоге (/tmp, /dev/shm, /var/tmp).
  - При подтверждении вредоносной активности: поместите файл в карантин, ограничьте источник.
description_en: |
  This rule monitors sudo commands in the Linux auth.log (logs-linux.auth-*) and detects
  file-creating commands (touch/cp/dd/tee/install) being run with privileges in suspicious
  directories (/tmp, /dev/shm, /var/tmp, /run). This may point to persistence or
  payload drop (T1044) techniques.
  Legitimate cases: scheduled deployment scripts, package installations, configuration updates.
  SOC triage steps:
  - Check `actor` (user.name) and `user.effective.name`.
  - Analyze `process.command_line` (cmd) and `process.working_directory`.
  - Confirm that the created file path is not in a suspicious directory (/tmp, /dev/shm, /var/tmp).
  - If malicious activity is confirmed: quarantine the file, restrict the source.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-linux.auth-*
query_language: esql
query: |
  FROM logs-linux.auth-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE data_stream.dataset == "linux.auth"
  | WHERE event.action == "sudo-command"
  | EVAL actor       = COALESCE(user.name, "Unknown")
  | EVAL hostn       = COALESCE(host.hostname, "Unknown")
  | EVAL src_ip      = COALESCE(TO_STRING(source.ip), "Unknown")
  | EVAL cmd         = COALESCE(process.command_line, "Unknown")
  | EVAL working_dir = COALESCE(process.working_directory, "Unknown")
  | EVAL eff_user    = COALESCE(user.effective.name, "Unknown")
  /* Monitoring agentlarini chiqarib tashlash */
  | WHERE actor NOT IN ("wazuh", "zabbix")
  /* Shubhali kataloglarda fayl yaratuvchi buyruqlar */
  | WHERE TO_LOWER(working_dir) RLIKE ".*(/tmp|/dev/shm|/var/tmp|/run|/proc).*"
     OR TO_LOWER(cmd) RLIKE ".*(touch\\s|cp\\s|tee\\s|dd\\s|install\\s).*"
  | STATS
      file_create_count = COUNT(*),
      commands          = VALUES(cmd),
      working_dirs      = VALUES(working_dir),
      eff_users         = VALUES(eff_user),
      src_ips           = VALUES(src_ip),
      hosts             = VALUES(hostn),
      first_seen        = MIN(@timestamp),
      last_seen         = MAX(@timestamp)
    BY agent_id, actor, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE file_create_count >= 2
  | KEEP agent_id, bucket, actor, file_create_count, commands,
         working_dirs, eff_users, src_ips, hosts, first_seen, last_seen
  | SORT file_create_count DESC
  | LIMIT 200
enabled: false
tags:
  - attack.persistence
  - attack.t1044
  - detection.linux
  - linux.auth.sudo
severity: medium
risk_score: 60
nist: ["AU-2", "AU-12", "SI-7"]
pci_dss: ["10.2.4", "10.2.7"]
gdpr: ["32.1.a", "32.2"]
mitre_attack:
  TA0003:
    T1044: []