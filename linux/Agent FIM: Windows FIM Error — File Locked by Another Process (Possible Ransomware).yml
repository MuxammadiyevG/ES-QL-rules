rule_id: 5359a48b-726a-4126-bc35-35de7b0d83d1
name: "Agent FIM: Windows FIM Error — File Locked by Another Process (Possible Ransomware)"
description: |
  Ushbu qoida Impact texnikasiga bog'liq bo'lib, FIM agentining fayllarga kirish xatoliklarini
  aniqlaydi. Ko'p sonli "file being used by another process" xatoliklari ransomware
  faoliyatining belgisi bo'lishi mumkin — ransomware fayllarni encrypt qilayotganda ularni lock
  qiladi va FIM hash ololmaydi.
  Qonuniy holatlar: antivirus real-time scanning, Windows Update, VSS snapshot.
  SOC triage bosqichlari:
  - `error_count` yuqori bo'lsa va qisqa vaqt ichida bo'lsa — ransomware encryption belgisi.
  - `file.path` larning xilma-xilligini tekshiring — turli kataloglarda bo'lsa yuqori xavf.
  - `host.hostname` dagi boshqa hodisalar bilan korrelatsiya qiling.
  - CPU va disk I/O metrikalarini tekshiring — yuqori bo'lsa encryption jarayoni.
  - Network loglarini tekshiring — C2 ulanish yoki exfiltration borligini aniqlang.
  - Darhol: hostni tarmoqdan ajrating, snapshot oling, incident oching.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.module == "file_integrity"
  | WHERE host.os.type == "windows"
  | WHERE error.message IS NOT NULL
  | WHERE error.message LIKE "*being used by another process*"
      OR error.message LIKE "*access*denied*"
      OR error.message LIKE "*failed to open file for hashing*"
  | EVAL host_name    = host.hostname
  | EVAL file_path    = file.path
  | EVAL file_name    = file.name
  | EVAL file_ext     = file.extension
  | EVAL file_size    = file.size
  | EVAL file_owner   = file.owner
  | EVAL file_mtime   = file.mtime
  | EVAL error_msg    = error.message
  | EVAL action       = event.action
  | WHERE file_path IS NOT NULL
  | STATS
      error_count   = COUNT(*),
      host_names    = VALUES(host.hostname),
      file_paths    = VALUES(file.path),
      file_names    = VALUES(file.name),
      file_exts     = VALUES(file.extension),
      file_owners   = VALUES(file.owner),
      file_sizes    = VALUES(file.size),
      error_msgs    = VALUES(error.message),
      actions       = VALUES(event.action),
      last_seen     = MAX(@timestamp),
      first_seen    = MIN(@timestamp)
    BY agent_id, host.hostname
  | WHERE error_count >= 5
  | EVAL
      host_name = host.hostname
  | KEEP
      agent_id, host_name, error_count,
      host_names, file_paths, file_names, file_exts,
      file_owners, file_sizes, error_msgs, actions,
      last_seen, first_seen
  | SORT error_count DESC
enabled: true
tags:
  - attack.impact
  - attack.t1486
  - attack.t1490
  - detection.threat-hunting
severity: critical
risk_score: 90
references:
  - "https://attack.mitre.org/techniques/T1486/"
  - "https://attack.mitre.org/techniques/T1490/"
nist: ["SI-3", "SI-7", "IR-4", "CP-9", "AU-12"]
pci_dss: ["5.1", "10.6.1", "12.10.1"]
gdpr: ["32.1.b", "32.1.c"]
mitre_attack:
  TA0040:
    T1486: []
    T1490: []