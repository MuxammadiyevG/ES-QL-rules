rule_id: 47d7c859-7340-48eb-80f9-716a67dca623
name_uz: "Fayllarda credential qidirish - Linux"
name_ru: "Поиск учётных данных в файлах - Linux"
name_en: "Credential Search in Files - Linux"
description_uz: |
  grep yordamida fayllardan parollarni ajratib olishga urinishlarni aniqlaydi.
  Tajovuzkorlar parollar bo'lgan fayllarni topish uchun lokal fayl tizimlari va masofaviy fayl ulashmalarini (share) qidirishi mumkin.
  Bu usul odatda credential/hisob ma'lumotlarini yig'ish va post-exploitation faoliyatida ishlatiladi.
  Eslatma: qonuniy parolni tiklash yoki konfiguratsiya ishlari tufayli false positive yuzaga kelishi mumkin.
description_ru: |
  Обнаруживает попытки извлечения паролей из файлов с помощью grep.
  Злоумышленники могут искать файлы с паролями в локальных файловых системах и на удалённых файловых ресурсах.
  Этот приём обычно используется при сборе учётных данных и активности после эксплуатации (post-exploitation).
  Примечание: возможны ложные срабатывания из-за легитимного сброса паролей или работ с конфигурацией.
description_en: |
  Detects attempts to extract passwords from files using grep.
  Adversaries may search local file systems and remote file shares for files containing passwords.
  This pattern is commonly used in credential harvesting and post-exploitation activities.
  Note: May generate false positives from legitimate password reset or configuration activities.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd execve telemetry */
  | WHERE event.action == "executed"
  /* selection: grep commands searching for passwords */
  | WHERE TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*grep.*password.*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      executables = VALUES(process.executable),
      working_directories = VALUES(process.working_directory),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 2
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, executables, working_directories, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.credential-access
  - attack.t1552.001
  - detection.threat-hunting
severity: high
risk_score: 70
references:
  - "https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.001/T1552.001.md"
  - "https://attack.mitre.org/techniques/T1552/001/"
nist: ["SI-4", "AU-12", "IA-5"]
pci_dss: ["10.2", "8.2.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0006:
    T1552: ["T1552.001"]
