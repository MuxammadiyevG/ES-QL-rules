rule_id: aad8a429-7ebb-4a0c-a0a5-8abf638b3567
name_uz: "Agent Execution: execve syscall orqali shubhali jarayon bajarildi"
name_ru: "Agent Execution: подозрительный процесс выполнен через syscall execve"
name_en: "Agent Execution: Suspicious Process Executed via execve Syscall"
description_uz: |
  Ushbu qoida Execution texnikasiga bog'liq bo'lib, tizimda execve syscall orqali ishga tushirilgan
  jarayonlarni aniqlaydi. Hujumchi shell, interpreter yoki tizim vositalarini ishlatib zarar etkazuvchi
  buyruqlarni bajarishi mumkin.
  Qonuniy holatlar: oddiy tizim jarayonlari, daemon restart, cron joblar, SSH sessiyalari.
  SOC triage bosqichlari:
  - `process.executable` va `process.args` ni tekshiring — g'ayrioddiy argument yoki yo'lni aniqlang.
  - `auditd.summary.actor.primary` (asl foydalanuvchi) va `user.name` (effektiv) farqini ko'ring.
  - `process.working_directory` uy katalogidan tashqarida bo'lsa — diqqat qiling.
  - `auditd.data.tty` qiymatini tekshiring: interaktiv (pts/X) vs avtomatik (none).
  - Jarayon parent PID zanjirini ko'rib, zararli chain borligini aniqlang.
  - Noqonuniy bo'lsa: jarayonni o'ldiring, sessiyani to'xtating, forensic dump oling.
description_ru: |
  Это правило связано с техникой Execution и выявляет процессы, запущенные в системе
  через syscall execve. Злоумышленник может с помощью shell, интерпретатора или системных утилит выполнять
  вредоносные команды.
  Легитимные случаи: обычные системные процессы, перезапуск демонов, задания cron, SSH-сессии.
  Шаги SOC-триажа:
  - Проверьте `process.executable` и `process.args` — выявите необычные аргументы или пути.
  - Сравните `auditd.summary.actor.primary` (исходный пользователь) и `user.name` (эффективный).
  - Если `process.working_directory` находится вне домашнего каталога — обратите внимание.
  - Проверьте значение `auditd.data.tty`: интерактивный (pts/X) или автоматический (none).
  - Изучите цепочку родительских PID процесса и определите, есть ли вредоносная цепочка.
  - Если активность нелегитимна: завершите процесс, остановите сессию, снимите форензик-дамп.
description_en: |
  This rule is related to the Execution technique and detects processes started on the system
  via the execve syscall. An attacker may use a shell, an interpreter, or system utilities to run
  malicious commands.
  Legitimate cases: ordinary system processes, daemon restart, cron jobs, SSH sessions.
  SOC triage steps:
  - Check `process.executable` and `process.args` — identify unusual arguments or paths.
  - Look at the difference between `auditd.summary.actor.primary` (original user) and `user.name` (effective).
  - If `process.working_directory` is outside the home directory — pay attention.
  - Check the `auditd.data.tty` value: interactive (pts/X) vs automated (none).
  - Review the process parent PID chain and determine whether a malicious chain exists.
  - If illegitimate: kill the process, terminate the session, take a forensic dump.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE auditd.message_type == "syscall"
  | WHERE auditd.data.syscall == "execve"
  | WHERE auditd.result == "success"
  | EVAL host_name      = host.hostname
  | EVAL actor          = COALESCE(auditd.summary.actor.primary, user.audit.name, user.name)
  | EVAL effective_user = user.name
  | EVAL proc_exec      = process.executable
  | EVAL proc_args      = process.title
  | EVAL proc_name      = process.name
  | EVAL work_dir       = process.working_directory
  | EVAL tty            = auditd.data.tty
  | EVAL file_path      = auditd.summary.object.primary
  | WHERE proc_exec IS NOT NULL
  | WHERE actor != "unset" OR tty != "(none)"
  | STATS
      event_count   = COUNT(*),
      host_names    = VALUES(host.hostname),
      actors        = VALUES(auditd.summary.actor.primary),
      eff_users     = VALUES(user.name),
      executables   = VALUES(process.executable),
      proc_titles   = VALUES(process.title),
      work_dirs     = VALUES(process.working_directory),
      ttys          = VALUES(auditd.data.tty),
      last_seen     = MAX(@timestamp),
      first_seen    = MIN(@timestamp)
    BY agent_id, host.hostname, process.executable, auditd.summary.actor.primary
  | WHERE event_count >= 1
  | EVAL
      host_name  = host.hostname,
      proc_exec  = process.executable,
      actor      = auditd.summary.actor.primary
  | KEEP
      agent_id, host_name, proc_exec, actor, event_count,
      host_names, actors, eff_users, executables,
      proc_titles, work_dirs, ttys, last_seen, first_seen
  | SORT event_count DESC
enabled: true
tags:
  - attack.execution
  - attack.t1059
  - attack.t1204.002
  - detection.threat-hunting
severity: low
risk_score: 35
references:
  - "https://attack.mitre.org/techniques/T1059/"
  - "https://attack.mitre.org/techniques/T1204/002/"
nist: ["AU-12", "SI-4", "CM-7"]
pci_dss: ["10.2.2", "10.2.7"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0002:
    T1059: []
    T1204: ["T1204.002"]