rule_id: 2b9ac96a-73d2-45e7-8b08-ba1da510bbf3
name_uz: "Webshell orqali masofaviy buyruq bajarilishini aniqlash"
name_ru: "Обнаружение удалённого выполнения команд через веб-шелл"
name_en: "Webshell Remote Command Execution Detection"
description_uz: |
  agent_id, veb-server foydalanuvchisi (masalan, www-data) tomonidan buyruq bajarilishini aniqlaydi.
  Bu webshell yoki RCE zaifligidan foydalanish belgisi bo'lishi mumkin.
  Ma'lum UID bo'yicha execve/execveat syscall'larini kuzatadi.
description_ru: |
  Обнаруживает выполнение команд от agent_id, пользователя веб-сервера (например, www-data).
  Это может указывать на веб-шелл или эксплуатацию уязвимости RCE.
  Отслеживает системные вызовы execve/execveat от определённого UID.
description_en: |
  Detects command execution by agent_id, web server user (e.g. www-data).
  This may indicate a webshell or RCE vulnerability exploitation.
  Monitors execve/execveat syscalls by specific UID.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd SYSCALL events */
  /* selection: execve syscalls by agent_id, web user (uid 33 / www-data) */
  | WHERE (
      TO_LOWER(COALESCE(event.original, "")) RLIKE ".*syscall=59.*"  /* execve */
      OR TO_LOWER(COALESCE(event.original, "")) RLIKE ".*syscall=322.*" /* execveat */
      OR event.action IN ("execve", "execveat", "executed")
    )
    AND (
      user.id == "33"
      OR TO_LOWER(user.name) RLIKE ".*(www-data|apache|nginx|tomcat).*"
    )
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      executables = VALUES(process.executable),
      command_lines = VALUES(process.title),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, executables, command_lines, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.persistence
  - attack.t1505.003
severity: critical
risk_score: 90
references:
  - "https://attack.mitre.org/techniques/T1505/003/"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2", "11.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0003:
    T1505: ["T1505.003"]
