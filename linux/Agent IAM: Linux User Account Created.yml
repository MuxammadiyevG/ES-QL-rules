rule_id: 66e91d04-0398-4f7b-90f9-c0ae38c385f5
name_uz: "Agent IAM: Linux foydalanuvchi akkaunti yaratildi"
name_ru: "Agent IAM: Создана учётная запись пользователя Linux"
name_en: "Agent IAM: Linux User Account Created"
description_uz: |
  Ushbu qoida Persistence texnikasiga bog'liq bo'lib, tizimda yangi foydalanuvchi yaratilishini aniqlaydi.
  Hujumchi persistence ta'minlash yoki backdoor yaratish maqsadida yangi account ochayotgan bo'lishi mumkin.
  Qonuniy holatlar: IT onboarding jarayonlari, avtomatik provisioning skriptlari, Docker container yaratish.
  SOC triage bosqichlari:
  - `host.hostname` va `user.effective.name` orqali kim tomonidan yaratilganini aniqlang.
  - Yangi account nomi (`auditd.summary.object.primary`) va GID ni tekshiring.
  - Yaratish vaqtini (`@timestamp`) ish soatlari bilan solishtiring.
  - Tasdiqlangan HR yoki DevOps ticketi borligini tekshiring.
  - Noqonuniy bo'lsa: accountni o'chirib tashlang, sessiyani tugatib, incident oching.
description_ru: |
  Это правило связано с техникой Persistence и выявляет создание нового пользователя в системе.
  Злоумышленник может создавать новую учётную запись с целью закрепления или создания backdoor.
  Легитимные случаи: процессы IT-онбординга, скрипты автоматического provisioning, создание Docker container.
  Шаги SOC-триажа:
  - По `host.hostname` и `user.effective.name` определите, кем она была создана.
  - Проверьте имя новой учётной записи (`auditd.summary.object.primary`) и GID.
  - Сопоставьте время создания (`@timestamp`) с рабочими часами.
  - Проверьте наличие согласованной заявки HR или DevOps.
  - Если нелегитимно: удалите учётную запись, завершите сессию и заведите инцидент.
description_en: |
  This rule is related to the Persistence technique and detects the creation of a new user on the system.
  An attacker may be creating a new account in order to establish persistence or to create a backdoor.
  Legitimate cases: IT onboarding processes, automated provisioning scripts, Docker container creation.
  SOC triage steps:
  - Determine who created it via `host.hostname` and `user.effective.name`.
  - Check the new account name (`auditd.summary.object.primary`) and the GID.
  - Compare the creation time (`@timestamp`) with business hours.
  - Check whether there is an approved HR or DevOps ticket.
  - If illegitimate: delete the account, terminate the session and open an incident.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE auditd.message_type == "add_user"
  | EVAL host_name   = host.hostname
  | EVAL actor       = COALESCE(user.effective.name, auditd.summary.actor.secondary)
  | EVAL new_user    = auditd.summary.object.primary
  | EVAL how         = auditd.summary.how
  | EVAL terminal    = auditd.data.terminal
  | WHERE new_user IS NOT NULL
  | STATS
      event_count  = COUNT(*),
      host_names   = VALUES(host.hostname),
      actors       = VALUES(user.effective.name),
      new_users    = VALUES(auditd.summary.object.primary),
      executables  = VALUES(auditd.summary.how),
      terminals    = VALUES(auditd.data.terminal),
      last_seen    = MAX(@timestamp),
      first_seen   = MIN(@timestamp)
    BY agent_id, host.hostname, auditd.summary.object.primary, user.effective.name
  | WHERE event_count >= 1
  | EVAL
      host_name  = host.hostname,
      new_user   = auditd.summary.object.primary,
      actor      = user.effective.name
  | KEEP
      agent_id, host_name, new_user, actor, event_count,
      host_names, actors, new_users, executables,
      terminals, last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - attack.persistence
  - attack.t1136.001
  - detection.threat-hunting
severity: medium
risk_score: 60
references:
  - "https://attack.mitre.org/techniques/T1136/001/"
nist: ["AC-2", "AC-6", "AU-12"]
pci_dss: ["8.1.1", "10.2.5"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0003:
    T1136: ["T1136.001"]