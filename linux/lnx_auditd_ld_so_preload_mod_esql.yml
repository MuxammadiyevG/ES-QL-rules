rule_id: 68fd378f-fd24-4280-ae76-0cb310c4e5dc
name_uz: "LD_SO_PRELOAD o'zgartirilishini aniqlash"
name_ru: "Обнаружение изменения LD_SO_PRELOAD"
name_en: "LD_SO_PRELOAD Modification Detection"
description_uz: |
  Shared object inyeksiyasi uchun /etc/ld.so.preload o'zgartirilishini aniqlaydi.
  Bu texnika agent_id, hujumchilar tomonidan jarayonlarga ixtiyoriy kod yuklash uchun ishlatiladi.
  ld.so.preload dinamik linkerni boshqa barcha kutubxonalardan oldin ko'rsatilgan kutubxonalarni yuklashga majbur qiladi.
  Bu Linux da keng tarqalgan mustahkamlanish (persistence) va imtiyozlarni oshirish texnikasi.
description_ru: |
  Выявляет изменение /etc/ld.so.preload для инъекции разделяемых объектов (shared object).
  Эта техника используется agent_id, злоумышленниками для загрузки произвольного кода в процессы.
  ld.so.preload заставляет динамический компоновщик загружать указанные библиотеки раньше всех остальных.
  Это распространённая техника закрепления и повышения привилегий в Linux.
description_en: |
  Identifies modification of /etc/ld.so.preload for shared object injection.
  This technique is used by agent_id, attackers to load arbitrary code into processes.
  ld.so.preload forces the dynamic linker to load specified libraries before any others.
  This is a common persistence and privilege escalation technique on Linux.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd PATH type events */
  | WHERE event.action == "opened-file"
  /* selection: /etc/ld.so.preload file access */
  | WHERE file.path == "/etc/ld.so.preload"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      executables = VALUES(process.executable),
      file_operations = VALUES(event.action),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, executables, file_operations, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.privilege-escalation
  - attack.persistence
  - attack.defense-evasion
  - attack.t1574.006
  - detection.threat-hunting
severity: high
risk_score: 80
references:
  - "https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1574.006/T1574.006.md"
  - "https://eqllib.readthedocs.io/en/latest/analytics/fd9b987a-1101-4ed3-bda6-a70300eaf57e.html"
  - "https://attack.mitre.org/techniques/T1574/006/"
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2", "2.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0004:
    T1574: ["T1574.006"]
  TA0003:
    T1574: ["T1574.006"]
  TA0005:
    T1574: ["T1574.006"]
