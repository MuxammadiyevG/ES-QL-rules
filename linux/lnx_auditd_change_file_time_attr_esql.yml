rule_id: 9eaaa4f9-907d-4d74-9ace-06037bab3eb7
name_uz: "Fayl vaqt atributini o'zgartirish"
name_ru: "Изменение временных атрибутов файла"
name_en: "File Time Attribute Modification"
description_uz: |
  touch buyrug'i yordamida fayl vaqt atributlari o'zgartirilishini aniqlaydi.
  Tajovuzkorlar yangi fayllarni yoki mavjud fayllardagi o'zgarishlarni yashirish uchun fayl vaqt atributlarini o'zgartirishi mumkin (timestomping).
description_ru: |
  Обнаруживает изменение временных атрибутов файлов с помощью команды touch.
  Злоумышленники могут изменять временные атрибуты файлов, чтобы скрыть новые файлы или изменения в существующих (timestomping).
description_en: |
  Detects file time attribute changes using touch command.
  Adversaries may modify file time attributes to hide new or changes to existing files (timestomping).
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE event.action == "executed"
  | WHERE process.name == "touch" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*(-t|-d).*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      file_paths = VALUES(file.path),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, file_paths, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.defense-evasion
  - attack.t1070.006
severity: low
risk_score: 40
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1070: ["T1070.006"]
