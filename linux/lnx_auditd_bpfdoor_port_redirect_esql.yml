rule_id: a1719539-ae26-488b-9522-c783c96f52a5
name_uz: "BPFDoor port yo'naltirishini aniqlash"
name_ru: "Обнаружение перенаправления портов BPFDoor"
name_en: "BPFDoor Port Redirection Detection"
description_uz: |
  BPFDoor zararli dasturining iptables yordamida port yo'naltirish texnikasini aniqlaydi.
  BPFDoor — bu tarmoq trafigini yashirish uchun BPF (Berkeley Packet Filter) dan foydalanadigan Linux backdoor.
  Zararli dastur command and control uchun trafikni bir portdan boshqasiga yo'naltirishda iptables dan foydalanadi.
  Bu BPFDoor faoliyatining o'ziga xos kompromis indikatoridir.
description_ru: |
  Обнаруживает технику перенаправления портов вредоносного ПО BPFDoor с помощью iptables.
  BPFDoor — это Linux-бэкдор, использующий BPF (Berkeley Packet Filter) для сокрытия сетевого трафика.
  Вредоносное ПО использует iptables для перенаправления трафика с одного порта на другой в целях command and control.
  Это специфический индикатор компрометации активности BPFDoor.
description_en: |
  Detects BPFDoor malware port redirection technique using iptables.
  BPFDoor is a Linux backdoor that uses BPF (Berkeley Packet Filter) to hide network traffic.
  The malware uses iptables to redirect traffic from one port to another for command and control.
  This is a specific indicator of compromise for BPFDoor activity.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  // Filter for process execution events in Linux Audit logs
  | WHERE event.action == "executed"
  // Selection: Identify iptables being used to establish BPFDoor-style port redirection
  | EVAL cmd = COALESCE(event.original, "")
  | WHERE process.name == "iptables"
      AND cmd RLIKE ".*-t nat.*"
      AND cmd RLIKE ".*PREROUTING.*"
      AND cmd RLIKE ".*--dport.*"
      AND cmd RLIKE ".*REDIRECT.*"
      AND cmd RLIKE ".*--to-ports.*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(cmd),
      executables = VALUES(process.executable),
      parent_pids = VALUES(process.parent.pid),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY 
      agent_id, host.name, 
      user.name, 
      bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP
      agent_id, bucket, host.name, user.name, event_count, users, processes,
      command_lines, executables, parent_pids, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.command-and-control
  - attack.t1090
  - detection.threat-hunting
severity: critical
risk_score: 90
references:
  - "https://www.sandflysecurity.com/blog/bpfdoor-an-evasive-linux-backdoor-technical-analysis/"
  - "https://attack.mitre.org/techniques/T1090/"
nist: ["SI-4", "AU-12", "SC-7"]
pci_dss: ["10.2", "1.3"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0011:
    T1090: []
