rule_id: efb82179-44bf-4193-9a0c-601d92e9ed85
name_uz: "Account Management: Linux Foydalanuvchisi Yaratildi, O'chirildi, Paroli O'zgartirildi yoki Imtiyozli Guruhga Qo'shildi"
name_ru: "Account Management: создание, удаление, смена пароля пользователя Linux или добавление в привилегированную группу"
name_en: "Account Management: Linux User Created, Deleted, Password Changed or Added to Privileged Group"
description_uz: |
  Ushbu qoida Linux tizimida foydalanuvchilarni boshqarish bilan bog‘liq muhim
  amallarni aniqlaydi: foydalanuvchi yaratish, o‘chirish, parol o‘zgartirish
  yoki foydalanuvchini imtiyozli guruhlarga qo‘shish.

  Kuzatiladigan commandlar:
  - useradd / adduser
  - userdel / deluser
  - passwd
  - usermod -aG sudo|adm|wheel|root
  - gpasswd -a user sudo|adm|wheel|root
  - adduser user sudo|adm|wheel|root
  - groupmod
description_ru: |
  Это правило выявляет важные операции, связанные с управлением пользователями в системе
  Linux: создание пользователя, удаление, смену пароля
  или добавление пользователя в привилегированные группы.

  Отслеживаемые команды:
  - useradd / adduser
  - userdel / deluser
  - passwd
  - usermod -aG sudo|adm|wheel|root
  - gpasswd -a user sudo|adm|wheel|root
  - adduser user sudo|adm|wheel|root
  - groupmod
description_en: |
  This rule detects important operations related to user management on a Linux
  system: creating a user, deleting a user, changing a password,
  or adding a user to privileged groups.

  Monitored commands:
  - useradd / adduser
  - userdel / deluser
  - passwd
  - usermod -aG sudo|adm|wheel|root
  - gpasswd -a user sudo|adm|wheel|root
  - adduser user sudo|adm|wheel|root
  - groupmod
type: esql
params: "{}"
schedule_interval: 10m

index:
  - logs-updive.audit-*

query_language: esql

query: |
  FROM logs-updive.audit-*
   | WHERE @timestamp >= NOW() - 10 minute
   | WHERE service.type == "auditd"
     AND auditd.message_type == "syscall"
     AND auditd.data.syscall == "execve"
     AND process.name IN (
       "useradd", "adduser",
       "userdel", "deluser",
       "passwd",
       "usermod", "gpasswd",
       "groupmod"
     )
     AND (
       process.name IN ("useradd", "adduser", "userdel", "deluser", "passwd")
       OR (
         process.name == "usermod"
         AND (
           MV_CONTAINS(process.args, "-aG")
           OR MV_CONTAINS(process.args, "-G")
           OR MV_CONTAINS(process.args, "--append")
           OR MV_CONTAINS(process.args, "--groups")
           OR MV_CONTAINS(process.args, "-L")
           OR MV_CONTAINS(process.args, "-U")
           OR MV_CONTAINS(process.args, "-e")
           OR MV_CONTAINS(process.args, "-E")
         )
       )
       OR (
         process.name == "gpasswd"
         AND (
           MV_CONTAINS(process.args, "-a")
           OR MV_CONTAINS(process.args, "--add")
         )
       )
     )
   | EVAL
       actor_user = auditd.summary.actor.primary,
       actor_effective_user = auditd.summary.actor.secondary,
       target_user = MV_LAST(process.args),
       process_name = process.name,
       process_path = process.executable,
       host_name = host.hostname,
       session_id = auditd.session,
       user_management_action = CASE(
         process.name IN ("useradd", "adduser"), "user_created",
         process.name IN ("userdel", "deluser"), "user_deleted",
         process.name == "passwd" AND (MV_CONTAINS(process.args, "-l") OR MV_CONTAINS(process.args, "--lock")), "account_locked",
         process.name == "passwd" AND (MV_CONTAINS(process.args, "-u") OR MV_CONTAINS(process.args, "--unlock")), "account_unlocked",
         process.name == "usermod" AND MV_CONTAINS(process.args, "-L"), "account_locked",
         process.name == "usermod" AND MV_CONTAINS(process.args, "-U"), "account_unlocked",
         process.name == "usermod" AND (MV_CONTAINS(process.args, "-e") OR MV_CONTAINS(process.args, "-E") OR MV_CONTAINS(process.args, "--expiredate")), "account_expiration_changed",
         process.name == "passwd", "password_changed",
         process.name IN ("usermod", "gpasswd", "adduser", "groupmod") AND (
           MV_CONTAINS(process.args, "sudo")
           OR MV_CONTAINS(process.args, "adm")
           OR MV_CONTAINS(process.args, "wheel")
           OR MV_CONTAINS(process.args, "root")
         ), "user_added_to_privileged_group",
         "user_management_activity"
       ),
       privileged_group = CASE(
         MV_CONTAINS(process.args, "sudo"), "sudo",
         MV_CONTAINS(process.args, "adm"), "adm",
         MV_CONTAINS(process.args, "wheel"), "wheel",
         MV_CONTAINS(process.args, "root"), "root",
         "none"
       ),
       detection_reason = CASE(
         user_management_action == "user_created", "Linux user account created",
         user_management_action == "user_deleted", "Linux user account deleted",
         user_management_action == "password_changed", "Linux user password changed",
         user_management_action == "account_locked", "Linux user account locked",
         user_management_action == "account_unlocked", "Linux user account unlocked",
         user_management_action == "account_expiration_changed", "Linux user account expiration changed",
         user_management_action == "user_added_to_privileged_group", "Linux user added to privileged group",
         "Linux user management activity"
       )
   | STATS
       first_seen = MIN(@timestamp),
       last_seen = MAX(@timestamp),
       event_count = COUNT(*)
     BY
       agent_id,
       actor_user,
       actor_effective_user,
       target_user,
       user_management_action,
       privileged_group,
       process_name,
       process_path,
       process.title,
       host_name,
       session_id,
       detection_reason,
       event.action
   | SORT last_seen DESC

enabled: true

tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098
  - attack.t1136.001
  - account-management
  - privileged-group
  - sudo
  - adm
  - linux
  - auditd

severity: high
risk_score: 80

references:
  - "https://attack.mitre.org/techniques/T1098/"
  - "https://attack.mitre.org/techniques/T1136/001/"

nist: ["AC-2", "AC-3", "AC-6", "AU-2", "AU-6", "AU-12", "CM-5", "IA-5", "SI-4"]

pci_dss: ["7.2.1", "7.2.2", "8.2.1", "8.2.2", "8.2.4", "10.2.1", "10.4.1"]

gdpr: ["32.1.b", "32.1.d"]

