rule_id: ceddb539-bcef-40fd-b17e-f76afdba04f9
name_uz: "sysinfo syscall orqali tizim ma'lumotlarini aniqlash"
name_ru: "Разведка сведений о системе через системный вызов sysinfo"
name_en: "System Info Discovery via sysinfo Syscall"
description_uz: |
  sysinfo tizim chaqiruvidan foydalanishni aniqlaydi.
  Zararli dastur nishonga olish yoki aniqlashdan qochish maqsadida muhit statistikasini to'plash uchun sysinfo'dan foydalanishi mumkin.
  auditd qoidasi talab qilinadi: -S sysinfo.
description_ru: |
  Обнаруживает использование системного вызова sysinfo.
  Вредоносное ПО может использовать sysinfo для сбора статистики об окружении в целях выбора цели или уклонения от обнаружения.
  Требуется правило auditd: -S sysinfo.
description_en: |
  Detects use of the sysinfo system call.
  Malware may use sysinfo to gather environment statistics for targeting or evasion.
  Requires auditd rule: -S sysinfo.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd SYSCALL events */
  /* selection: sysinfo syscall */
  | WHERE TO_LOWER(COALESCE(event.original, "")) RLIKE ".*syscall=99.*" OR TO_LOWER(COALESCE(event.original, "")) RLIKE ".*syscall=sysinfo.*"
  /* filter: exclude Splunk */
  | WHERE NOT (process.executable RLIKE ".*splunkd")
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      executables = VALUES(process.executable),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, executables, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.discovery
  - attack.t1082
  - attack.t1057
severity: low
risk_score: 30
references:
  - "https://man7.org/linux/man-pages/man2/sysinfo.2.html"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0007:
    T1082: []
    T1057: []
