rule_id: 1facfe98-2b02-48ce-9813-a51cbce226ba
name_uz: "BPFDoor fayllariga murojaatni aniqlash"
name_ru: "Обнаружение доступа к файлам BPFDoor"
name_en: "BPFDoor File Access Detection"
description_uz: |
  BPFDoor zararli dasturi bilan bog'liq fayllarga murojaatni aniqlaydi.
  BPFDoor — bu tarmoq trafigini yashirish uchun BPF filtrlaridan foydalanadigan Linux backdoor.
  Ma'lum BPFDoor fayl yo'llariga murojaatni kuzatadi.
description_ru: |
  Обнаруживает доступ к файлам, связанным с вредоносным ПО BPFDoor.
  BPFDoor — это Linux-бэкдор, использующий BPF-фильтры для сокрытия сетевого трафика.
  Отслеживает доступ к известным путям файлов BPFDoor.
description_en: |
  Detects access to files associated with BPFDoor malware.
  BPFDoor is a Linux backdoor that uses BPF filters to hide network traffic.
  Monitors for access to known BPFDoor file paths.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd PATH type events */
  | WHERE event.action == "opened-file"
  /* selection: BPFDoor related files */
  | WHERE TO_LOWER(file.path) RLIKE ".*(/dev/shm/kdmtmpflush|/dev/shm/kinsing).*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      executables = VALUES(process.executable),
      file_paths = VALUES(file.path),
      file_operations = VALUES(event.action),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, executables, file_paths, file_operations, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.command-and-control
  - attack.t1071
  - detection.threat-hunting
severity: critical
risk_score: 95
references:
  - "https://www.sandflysecurity.com/blog/bpfdoor-an-evasive-linux-backdoor-technical-analysis/"
  - "https://www.elastic.co/security-labs/a-peek-behind-the-bpfdoor"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2", "11.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0011:
    T1071: []
