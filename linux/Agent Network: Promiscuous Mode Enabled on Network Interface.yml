rule_id: 302c92fa-e321-47c0-b38e-79ca762adf4b
name: "Agent Network: Promiscuous Mode Enabled on Network Interface"
description: |
  Ushbu qoida Collection va Credential Access texnikalariga bog'liq bo'lib, tarmoq interfeysida promiscuous mode yoqilishini aniqlaydi.
  Hujumchi tarmoq trafikini tinglash (sniffing) orqali login credential yoki maxfiy ma'lumotlarni ushlamoqchi bo'lishi mumkin.
  Qonuniy holatlar: tarmoq diagnostikasi vositalari (tcpdump, Wireshark), monitoring agentlari, virtual switch konfiguratsiyasi.
  SOC triage bosqichlari:
  - Hodisa ro'y bergan interfeys (`auditd.data.dev`) va host (`host.hostname`) ni aniqlang.
  - `auditd.data.prom` va `auditd.data.old_prom` qiymatlarini solishtiring.
  - O'sha paytda qaysi process ishlayotganini tekshiring (process.executable).
  - Docker/veth interfeyslari uchun container context ni tekshiring.
  - Noqonuniy bo'lsa: interfeys promiscuous modeni o'chiring, host trafikini tekshiring.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE auditd.message_type == "anom_promiscuous"
  | EVAL host_name    = host.hostname
  | EVAL net_device   = auditd.data.dev
  | EVAL prom_new     = auditd.data.prom
  | EVAL prom_old     = auditd.data.old_prom
  | EVAL actor        = COALESCE(user.name, auditd.summary.actor.secondary)
  | WHERE net_device IS NOT NULL
  | WHERE NOT STARTS_WITH(net_device, "veth")
  | STATS
      event_count  = COUNT(*),
      host_names   = VALUES(host.hostname),
      actors       = VALUES(user.name),
      net_devices  = VALUES(auditd.data.dev),
      prom_values  = VALUES(auditd.data.prom),
      last_seen    = MAX(@timestamp),
      first_seen   = MIN(@timestamp)
    BY agent_id, host.hostname, auditd.data.dev
  | WHERE event_count >= 1
  | EVAL
      host_name  = host.hostname,
      net_device = auditd.data.dev
  | KEEP
      agent_id, host_name, net_device, event_count,
      host_names, actors, net_devices, prom_values,
      last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - attack.collection
  - attack.credential-access
  - attack.t1040
  - detection.threat-hunting
severity: high
risk_score: 72
references:
  - "https://attack.mitre.org/techniques/T1040/"
nist: ["SI-4", "AU-12", "SC-7"]
pci_dss: ["10.6.1", "11.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0009:
    T1040: []
  TA0006:
    T1040: []