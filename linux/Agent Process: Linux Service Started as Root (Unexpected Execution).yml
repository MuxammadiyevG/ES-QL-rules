rule_id: a41d1065-e467-4155-87d5-c92860fe8c9a
name_uz: "Agent Process: Linux servisi root sifatida ishga tushirildi (kutilmagan bajarilish)"
name_ru: "Agent Process: служба Linux запущена от root (неожиданный запуск)"
name_en: "Agent Process: Linux Service Started as Root (Unexpected Execution)"
description_uz: |
  Ushbu qoida Persistence va Privilege Escalation texnikalariga bog'liq bo'lib,
  root (uid=0) tomonidan Linux servisning ishga tushirilishini aniqlaydi.
  Hujumchi backdoor yoki reverse shell ni servis sifatida ro'yxatdan o'tkazib,
  root huquqida persistence ta'minlashi mumkin.
  Qonuniy holatlar: tizim servislari (sshd, cron, rsyslog), tizim boshlang'ich yuklash.
  SOC triage bosqichlari:
  - `auditd.summary.how` yoki `process.executable` — kutilmagan binary yo'limi.
  - `user.selinux.user: unconfined` — SELinux cheklovi yo'q.
  - `systemctl list-units --type=service` orqali yangi servislarni tekshiring.
  - `/etc/systemd/system/` da yangi unit fayl bormi.
  - Noqonuniy bo'lsa: servisni to'xtating, unit faylini o'chiring, tizimni tekshiring.
description_ru: |
  Данное правило связано с техниками Persistence и Privilege Escalation и выявляет
  запуск службы Linux пользователем root (uid=0).
  Злоумышленник может зарегистрировать backdoor или reverse shell в качестве службы
  и обеспечить закрепление с правами root.
  Легитимные случаи: системные службы (sshd, cron, rsyslog), начальная загрузка системы.
  Шаги SOC-триажа:
  - `auditd.summary.how` или `process.executable` — неожиданный путь к binary.
  - `user.selinux.user: unconfined` — ограничения SELinux отсутствуют.
  - Проверьте новые службы через `systemctl list-units --type=service`.
  - Есть ли новый unit-файл в `/etc/systemd/system/`.
  - Если нелегитимно: остановите службу, удалите unit-файл, проверьте систему.
description_en: |
  This rule is related to Persistence and Privilege Escalation techniques and detects
  a Linux service being started by root (uid=0).
  An attacker may register a backdoor or a reverse shell as a service and thereby
  maintain persistence with root privileges.
  Legitimate cases: system services (sshd, cron, rsyslog), system boot.
  SOC triage steps:
  - `auditd.summary.how` or `process.executable` — an unexpected binary path.
  - `user.selinux.user: unconfined` — no SELinux confinement.
  - Check new services via `systemctl list-units --type=service`.
  - Whether there is a new unit file in `/etc/systemd/system/`.
  - If illegitimate: stop the service, delete the unit file, inspect the system.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.module == "auditd"
  | WHERE event.category == "process"
  | WHERE event.type == "start"
  | WHERE event.outcome == "success"
  | WHERE user.id == "0"
  | WHERE event.action == "started-service"
  | EVAL host_name    = host.hostname
  | EVAL user_name    = user.name
  | EVAL user_id      = user.id
  | EVAL group_name   = user.group.name
  | EVAL selinux_user = user.selinux.user
  | EVAL action       = event.action
  | STATS
      event_count    = COUNT(*),
      host_names     = VALUES(host.hostname),
      user_names     = VALUES(user.name),
      group_names    = VALUES(user.group.name),
      selinux_users  = VALUES(user.selinux.user),
      actions        = VALUES(event.action),
      last_seen      = MAX(@timestamp),
      first_seen     = MIN(@timestamp)
    BY agent_id, host.hostname, event.action
  | WHERE event_count >= 150
  | EVAL
      host_name = host.hostname,
      action    = event.action
  | KEEP
      agent_id, host_name, action, event_count,
      host_names, user_names, group_names, selinux_users,
      actions, last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1543.002
  - attack.t1078.003
  - detection.threat-hunting
severity: medium
risk_score: 55
references:
  - "https://attack.mitre.org/techniques/T1543/002/"
  - "https://attack.mitre.org/techniques/T1078/003/"
nist: ["AC-6", "SI-4", "AU-12", "CM-7"]
pci_dss: ["7.1", "10.2.7", "6.3"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0003:
    T1543: ["T1543.002"]
  TA0004:
    T1078: ["T1078.003"]