rule_id: 953cfb04-be55-4d1a-a415-6e53d54d5b70
name_uz: "Shubhali C2 va razvedka buyruqlari"
name_ru: "Подозрительные команды C2 и разведки"
name_en: "Suspicious C2 and Reconnaissance Commands"
description_uz: |
  Ko'pincha C2, razvedka va ma'lumot eksfiltratsiyasi bilan bog'liq bo'lgan bajarilgan buyruqlarni aniqlaydi.
  'susp_activity' audit kalitiga asoslangan, biroq jarayon nomlariga to'g'ridan-to'g'ri moslash uchun kengaytirilgan.
  wget, curl, nc, ssh, nmap va boshqalarni o'z ichiga oladi.
description_ru: |
  Обнаруживает выполненные команды, часто связанные с C2, разведкой и эксфильтрацией данных.
  Основана на ключе аудита 'susp_activity', но расширена для прямого сопоставления по именам процессов.
  Включает wget, curl, nc, ssh, nmap и другие.
description_en: |
  Detects executed commands often associated with C2, reconnaissance, and data exfiltration.
  Based on 'susp_activity' audit key but expanded to match process names directly.
  Includes wget, curl, nc, ssh, nmap, and others.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd EXECVE */
  /* selection: suspicious activities */
  | WHERE (
      process.name IN (
        "wget", "curl", "base64", "nc", "netcat", "ncat", "socat", 
        "wireshark", "tshark", "rawshark", "rdesktop", "xfreerdp", 
        "nmap", "ssh", "scp", "sftp", "ftp"
      )
      OR TO_LOWER(COALESCE(event.original, "")) RLIKE ".*key=susp_activity.*"
    )
  /* Filter out common legit admin activity */
  | WHERE NOT (user.name IN ("root", "admin") AND process.name IN ("ssh", "scp"))
  /* Filter out monitoring service account running localhost health checks */
  | WHERE NOT (user.name == "netadmin" AND process.name IN ("curl", "base64", "ssh"))
  /* Filter out root nc loopback port checks (nc 127.0.0.1 ...) */
  | WHERE NOT (user.name == "root" AND process.name == "nc" AND TO_LOWER(COALESCE(process.title, "")) RLIKE ".*nc 127\\.0\\.0\\.1.*")
  /* Filter out root curl localhost health checks */
  | WHERE NOT (user.name == "root" AND process.name == "curl" AND TO_LOWER(COALESCE(process.title, "")) RLIKE ".*curl.*localhost.*")
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.command-and-control
  - attack.discovery
  - attack.t1071
  - attack.t1095
severity: medium
risk_score: 50
references:
  - "https://github.com/Neo23x0/auditd"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0011:
    T1071: []
