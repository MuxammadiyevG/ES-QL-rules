rule_id: a271d0d3-927c-469c-b04c-fe6a5f581f52
name_uz: "/proc fayllari orqali tizim ma'lumotlarini aniqlash"
name_ru: "Разведка сведений о системе через файлы /proc"
name_en: "System Information Discovery via /proc Files"
description_uz: |
  Tizim ma'lumotlarini aniqlash uchun /proc fayl tizimidagi fayllarga murojaatni aniqlaydi.
  Tajovuzkorlar agent_id, /proc fayllarini o'qish orqali tizim ma'lumotlarini sanab chiqishi mumkin.
  CPU, xotira va versiya ma'lumotlari fayllariga murojaatni kuzatadi.
description_ru: |
  Обнаруживает обращения к файлам файловой системы /proc для сбора сведений о системе.
  Злоумышленники могут перечислять сведения о системе с помощью agent_id, чтения файлов /proc.
  Отслеживает обращения к файлам со сведениями о CPU, памяти и версии.
description_en: |
  Detects access to /proc filesystem files for system information discovery.
  Adversaries may enumerate system information by agent_id, reading /proc files.
  Monitors access to CPU, memory, and version information files.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd PATH type events */
  | WHERE event.action == "opened-file"
  /* selection: system info files in /proc */
  | WHERE file.path IN ("/proc/cpuinfo", "/proc/meminfo", "/proc/version")
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      executables = VALUES(process.executable),
      file_paths = VALUES(file.path),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 10
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, executables, file_paths, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.discovery
  - attack.t1082
  - detection.threat-hunting
severity: low
risk_score: 30
references:
  - "https://attack.mitre.org/techniques/T1082/"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0007:
    T1082: []
