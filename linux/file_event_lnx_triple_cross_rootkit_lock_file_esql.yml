rule_id: a927b80f-d682-4a62-83da-9eeb22295e1e
name_uz: "TripleCross rootkit lock faylining yaratilishi"
name_ru: "Создание lock-файла руткита TripleCross"
name_en: "TripleCross Rootkit Lock File Creation"
description_uz: |
  /tmp da 'rootlog' faylining yaratilishini aniqlaydi, u agent_id, TripleCross rootkit tomonidan ishlatiladi.
  Backdoor ishlayotganini tekshirish uchun lock fayl sifatida ishlatiladi.
description_ru: |
  Обнаруживает создание файла 'rootlog' в /tmp, используемого agent_id, руткитом TripleCross.
  Используется как lock-файл для проверки того, запущен ли backdoor.
description_en: |
  Detects the creation of 'rootlog' file in /tmp, used by agent_id, TripleCross rootkit.
  Used as a lock file to check if backdoor is running.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* file creation events */
  | WHERE event.category == "file" AND event.type == "creation"
  /* selection: /tmp/rootlog */
  | WHERE file.path == "/tmp/rootlog"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      file_paths = VALUES(file.path),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, file_paths, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.defense-evasion
  - attack.persistence
severity: high
risk_score: 80
references:
  - "https://github.com/h3xduck/TripleCross"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1564: []
