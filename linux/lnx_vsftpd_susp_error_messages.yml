rule_id: a08ce517-bf65-4a5f-8f84-77b61c4c5670
name_uz: "Shubhali VSFTPD xato xabarlari"
name_ru: "Подозрительные сообщения об ошибках VSFTPD"
name_en: "Suspicious VSFTPD Error Messages"
description_uz: |
  Halokatli yoki g'ayritabiiy xatti-harakatdan darak beruvchi shubhali VSFTPD xato xabarlarini aniqlaydi.
  Bunday xatolar ekspluatatsiya urinishlari, noto'g'ri sozlamalar yoki zararli mijozlar sabab yuzaga kelishi mumkin.
  VSFTPD xato xabarlari logs-switch.syslog-* ga yig'iladigan syslog uslubidagi loglarda ko'rinadi.
description_ru: |
  Обнаруживает подозрительные сообщения об ошибках VSFTPD, указывающие на фатальное или аномальное поведение.
  Такие ошибки могут быть вызваны попытками эксплуатации, ошибками конфигурации или вредоносными клиентами.
  Сообщения об ошибках VSFTPD появляются в логах syslog-формата, попадающих в logs-switch.syslog-*.
description_en: |
  Detects suspicious VSFTPD error messages that indicate fatal or abnormal behavior.
  Such errors may be caused by exploitation attempts, misconfigurations, or malicious clients.
  VSFTPD error messages appear in syslog-style logs ingested into logs-switch.syslog-*.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-switch.syslog-*
query_language: esql
query: |
  FROM logs-switch.syslog-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* Detect relevant VSFTPD error messages in syslog message field */
  | WHERE TO_LOWER(COALESCE(message, "")) RLIKE ".*(connection refused: too many sessions for this address[.]|connection refused: tcp_wrappers denial[.]|bad http verb[.]|port and pasv both active|pasv and port both active|transfer done [(]but failed to open directory[)][.]|could not set file modification time[.]|bug: pid active in ptrace_sandbox_free|ptrace_setoptions failure|weird status:|couldn.t handle sandbox event|out of bounds|syscall not permitted:|syscall validate failed:|input line too long[.]|poor buffer accounting in str_netfd_alloc|vsf_sysutil_read_loop).*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      hosts = VALUES(host.name),
      raw_samples = VALUES(message)
    BY host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP
      bucket,
      host.name,
      user.name,
      event_count,
      users,
      hosts,
      raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.initial-access
  - attack.t1190
severity: medium
risk_score: 60
references:
  - "https://github.com/dagwieers/vsftpd/"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0001:
    T1190: []
