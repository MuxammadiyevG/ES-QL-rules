rule_id: 59e0fb02-3eee-418a-b313-75884704faad
name_uz: "Agent Initial Access: Masofaviy hostdan muvaffaqiyatli SSH login"
name_ru: "Agent Initial Access: Успешный вход по SSH с удалённого хоста"
name_en: "Agent Initial Access: Successful SSH Login from Remote Host"
description_uz: |
  Ushbu qoida Initial Access texnikasiga bog'liq bo'lib, tashqi IP manzildan SSH orqali
  muvaffaqiyatli login hodisalarini aniqlaydi. Hujumchi o'g'irlangan credentials, brute force
  yoki valid SSH kaliti yordamida tizimga kirishi mumkin.
  Qonuniy holatlar: administrator remote boshqaruv, DevOps deploy operatsiyalari.
  SOC triage bosqichlari:
  - `source.ip` manzilini tekshiring — korporativ tarmoqdan tashqarida bo'lsa shubhali.
  - `user.name` va `user.audit.name` — qaysi account login qilganini aniqlang.
  - `auditd.data.terminal` — `/dev/pts/X` interaktiv SSH sessiyasi.
  - `auditd.session` raqamini keyingi execve va sudo hodisalar bilan korrelatsiya qiling.
  - Login vaqti (`@timestamp`) ish soatlaridan tashqarida bo'lsa — yuqori xavf.
  - Bir IP dan bir necha foydalanuvchi login qilsa — credential stuffing urinishi bo'lishi mumkin.
  - Noqonuniy bo'lsa: SSH sessiyani to'xtating, IP ni bloklang, credentials rotatsiya qiling.
description_ru: |
  Это правило связано с техникой Initial Access и выявляет события успешного входа по SSH
  с внешнего IP-адреса. Злоумышленник может войти в систему с помощью украденных credentials, перебора паролей (brute force)
  или валидного SSH-ключа.
  Легитимные случаи: удалённое управление администратором, операции развёртывания DevOps.
  Шаги SOC-триажа:
  - Проверьте адрес `source.ip` — подозрительно, если он вне корпоративной сети.
  - `user.name` и `user.audit.name` — определите, какая учётная запись выполнила вход.
  - `auditd.data.terminal` — `/dev/pts/X` означает интерактивную SSH-сессию.
  - Скоррелируйте номер `auditd.session` с последующими событиями execve и sudo.
  - Если время входа (`@timestamp`) вне рабочих часов — высокий риск.
  - Если с одного IP входят несколько пользователей — возможна попытка credential stuffing.
  - Если нелегитимно: завершите SSH-сессию, заблокируйте IP, выполните ротацию credentials.
description_en: |
  This rule is related to the Initial Access technique and detects successful SSH login
  events from an external IP address. An attacker may access the system using stolen credentials, brute force
  or a valid SSH key.
  Legitimate cases: administrator remote management, DevOps deploy operations.
  SOC triage steps:
  - Check the `source.ip` address — suspicious if it is outside the corporate network.
  - `user.name` and `user.audit.name` — determine which account logged in.
  - `auditd.data.terminal` — `/dev/pts/X` is an interactive SSH session.
  - Correlate the `auditd.session` number with subsequent execve and sudo events.
  - If the login time (`@timestamp`) is outside business hours — high risk.
  - If several users log in from a single IP — this may be a credential stuffing attempt.
  - If illegitimate: terminate the SSH session, block the IP, rotate the credentials.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE auditd.message_type == "user_login"
  | WHERE auditd.result == "success"
  | WHERE event.outcome == "success"
  | WHERE network.direction == "ingress"
  | WHERE source.ip IS NOT NULL
  | EVAL host_name     = host.hostname
  | EVAL actor         = COALESCE(user.audit.name, user.name, auditd.summary.actor.secondary)
  | EVAL src_ip        = source.ip
  | EVAL terminal      = auditd.data.terminal
  | EVAL session_id    = auditd.session
  | EVAL login_op      = auditd.data.op
  | EVAL src_hostname  = auditd.data.hostname
  | STATS
      event_count   = COUNT(*),
      host_names    = VALUES(host.hostname),
      actors        = VALUES(user.audit.name),
      src_ips       = VALUES(source.ip),
      src_hostnames = VALUES(auditd.data.hostname),
      terminals     = VALUES(auditd.data.terminal),
      session_ids   = VALUES(auditd.session),
      last_seen     = MAX(@timestamp),
      first_seen    = MIN(@timestamp)
    BY agent_id, host.hostname, source.ip, user.audit.name
  | WHERE event_count >= 1
  | EVAL
      host_name = host.hostname,
      src_ip    = source.ip,
      actor     = user.audit.name
  | KEEP
      agent_id, host_name, src_ip, actor, event_count,
      host_names, actors, src_ips, src_hostnames,
      terminals, session_ids, last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - attack.initial-access
  - attack.t1078
  - attack.t1133
  - detection.threat-hunting
severity: medium
risk_score: 55
references:
  - "https://attack.mitre.org/techniques/T1078/"
  - "https://attack.mitre.org/techniques/T1133/"
nist: ["AC-17", "AC-2", "AU-12", "SI-4"]
pci_dss: ["8.1.4", "10.2.1", "10.2.4", "1.3"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0001:
    T1078: []
    T1133: []