rule_id: c1a80323-8fb4-46c9-9615-f87c7cb24d3f
name: "Credential Access: SSH Brute Force — Multiple Failures Then Success"
description: |
  Ushbu qoida bitta IP manzildan qisqa vaqt ichida bir nechta
  muvaffaqiyatsiz SSH login urinishlari va undan keyin muvaffaqiyatli
  login sodir bo‘lganini aniqlaydi.

  Bu brute-force hujum muvaffaqiyatli yakunlanganini bildiradi.
type: esql
params: "{}"
schedule_interval: 1m

index:
  - logs-updive.audit-*

query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 1 minute
  | WHERE process.executable == "/usr/sbin/sshd"
    AND source.ip IS NOT NULL
    AND (
      auditd.message_type == "user_login"
      OR auditd.message_type == "user_start"
    )
  | EVAL
      src_ip = source.ip,
      target_acct = auditd.data.acct,
      host_name = host.hostname,
      is_fail = auditd.message_type == "user_login" AND auditd.result == "fail",
      is_success = auditd.message_type == "user_start" AND auditd.result == "success"
  | STATS
      fail_count = COUNT(is_fail),
      success_count = COUNT(is_success),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp),
      message_types = VALUES(auditd.message_type),
      results = VALUES(auditd.result)
    BY agent_id, src_ip, target_acct, host_name
  | WHERE fail_count > 5 AND success_count >= 1
  | KEEP
      agent_id,
      src_ip,
      target_acct,
      host_name,
      fail_count,
      success_count,
      first_seen,
      last_seen,
      message_types,
      results
  | SORT fail_count DESC

enabled: true
tags:
  - attack.credential-access
  - attack.initial-access
  - attack.t1110.001
  - attack.t1078
  - ssh
  - brute-force
  - auditd
severity: critical
risk_score: 92
references:
  - "https://attack.mitre.org/techniques/T1110/001/"
  - "https://attack.mitre.org/techniques/T1078/"
nist: ["AC-7", "AC-17", "SI-4", "IR-4", "SC-7"]
pci_dss: ["8.1.6", "8.3", "10.2.4", "10.2.5", "11.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0006:
    T1110: ["T1110.001"]
  TA0001:
    T1078: []
