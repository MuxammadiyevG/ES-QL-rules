rule_id: 60ec6f7e-9e3f-42a4-91d3-9d24a01fd7e7
name_uz: "Resurs: Yuqori memory ishlatilishi aniqlandi"
name_ru: "Ресурсы: обнаружено высокое использование памяти"
name_en: "Resource: High Memory Utilization Detected"
description_uz: |
  Ushbu qoida Linux yoki Windows hostda memory utilization yuqori bo‘lishini
  aniqlaydi. Agar hostda 5 daqiqa davomida o‘rtacha RAM ishlatilishi
  80% dan yuqori bo‘lsa alert hosil qiladi.

  Metricbeat orqali system.memory.actual.used.pct fieldi tahlil qilinadi.
description_ru: |
  Это правило выявляет высокое использование памяти на хосте Linux или Windows.
  Оповещение создаётся, если среднее использование RAM на хосте в течение 5 минут
  превышает 80%.

  С помощью Metricbeat анализируется поле system.memory.actual.used.pct.
description_en: |
  This rule detects high memory utilization on a Linux or Windows host.
  It raises an alert if the average RAM usage on the host over 5 minutes
  exceeds 80%.

  The system.memory.actual.used.pct field is analyzed via Metricbeat.
type: esql
params: "{}"
schedule_interval: 15m

index:
  - metricbeat-*

query_language: esql

query: |
  FROM metrics-updive*
      | WHERE @timestamp >= NOW() - 5 minute
      | WHERE system.memory.actual.used.pct IS NOT NULL
      | EVAL host_name = COALESCE(host.name, host.hostname)
      | STATS
          avg_memory_pct = AVG(system.memory.actual.used.pct),
          max_memory_pct = MAX(system.memory.actual.used.pct),
          event_count = COUNT(),
          first_seen = MIN(@timestamp),
          last_seen = MAX(@timestamp)
        BY host_name
      | WHERE avg_memory_pct >= 0.80
      | EVAL
          avg_memory_percent = ROUND(avg_memory_pct * 100, 2),
          max_memory_percent = ROUND(max_memory_pct * 100, 2),
          detection_reason = "Memory utilization is above 80 percent threshold"
      | KEEP
          host_name,
          avg_memory_percent,
          max_memory_percent,
          event_count,
          first_seen,
          last_seen,
          detection_reason
      | SORT avg_memory_percent DESC

enabled: true

tags:
  - resource
  - performance
  - memory
  - ram
  - high-utilization
  - linux
  - windows
  - metricbeat
  - availability

severity: medium
risk_score: 50

references:
  - "https://www.elastic.co/guide/en/beats/metricbeat/current/metricbeat-module-system.html"

nist: ["AU-6", "SI-4", "CP-10", "SC-5"]

pci_dss: ["10.2.1", "10.4.1", "12.10.5"]

gdpr: ["32.1.b", "32.1.c", "32.1.d"]

mitre_attack:
  TA0040:
    T1499: [] # Endpoint Denial of Service
