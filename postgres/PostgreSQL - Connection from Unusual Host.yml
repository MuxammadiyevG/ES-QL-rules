rule_id: b8d6fff3-3cb6-4af5-a9df-8726bc923bc6
name_uz: "PostgreSQL - Noodatiy Hostdan Ulanish"
name_ru: "PostgreSQL - подключение с необычного хоста"
name_en: "PostgreSQL - Connection from Unusual Host"
description_uz: |
  Ushbu qoida PostgreSQL log (logs-postgresql.log-*) ichida muvaffaqiyatli
  autentifikatsiyalarni `source.ip` bo'yicha guruhlab, bitta foydalanuvchi yoki host
  ko'p sonli turli manba IP manzillaridan ulanayotganini aniqlaydi. Noodatiy yoki yangi
  manbadan kirish hisobni egallash (T1078 - Valid Accounts) belgisi bo'lishi mumkin.
  Qonuniy holatlar: connection pooler, ko'p instans ilova, NAT orqasidagi mijozlar.
  SOC triage bosqichlari:
  - `actor` (user.name) qaysi `source.ip` manzillaridan kirayotganini tekshiring.
  - Manba IP odatdagi ilova/app server diapazonida ekanligini tasdiqlang.
  - Kirish vaqti business hours ichida ekanligini ko'ring.
  - Noqonuniy faoliyat tasdiqlansa: IP ni bloklang, credentiallarni rotatsiya qiling.
description_ru: |
  Данное правило группирует успешные аутентификации в журнале PostgreSQL
  (logs-postgresql.log-*) по `source.ip` и выявляет, что один пользователь или хост
  подключается с большого числа разных исходных IP-адресов. Вход с необычного или нового
  источника может быть признаком захвата учётной записи (T1078 - Valid Accounts).
  Легитимные случаи: connection pooler, многоинстансное приложение, клиенты за NAT.
  Шаги SOC-триажа:
  - Проверьте, с каких адресов `source.ip` входит `actor` (user.name).
  - Подтвердите, что исходный IP находится в обычном диапазоне приложения/app-сервера.
  - Посмотрите, попадает ли время входа в business hours.
  - При подтверждении нелегитимной активности: заблокируйте IP, произведите ротацию учётных данных.
description_en: |
  This rule groups successful authentications inside the PostgreSQL log
  (logs-postgresql.log-*) by `source.ip` and detects a single user or host
  connecting from a large number of different source IP addresses. Access from an unusual or new
  source may be a sign of account takeover (T1078 - Valid Accounts).
  Legitimate cases: connection pooler, multi-instance application, clients behind NAT.
  SOC triage steps:
  - Check which `source.ip` addresses `actor` (user.name) is connecting from.
  - Confirm that the source IP is in the usual application/app server range.
  - See whether the access time falls within business hours.
  - If illegitimate activity is confirmed: block the IP, rotate the credentials.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-postgresql.log-*
query_language: esql
query: |
  FROM logs-postgresql.log-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE data_stream.dataset == "postgresql.log"
  | WHERE event.action == "postgres-connection"
  | WHERE event.outcome == "success"
  | WHERE TO_LOWER(postgresql.log.message) RLIKE ".*(connection authorized|connection authenticated).*"
  | EVAL actor    = COALESCE(user.name, "Unknown")
  | EVAL db       = COALESCE(db.name, "Unknown")
  | EVAL hostn    = COALESCE(host.hostname, "Unknown")
  | EVAL src_ip   = COALESCE(TO_STRING(source.ip), "Unknown")
  | EVAL pid      = COALESCE(process.pid, 0)
  | STATS
      conn_count    = COUNT(*),
      distinct_srcs = COUNT_DISTINCT(src_ip),
      databases     = VALUES(db),
      src_ips       = VALUES(src_ip),
      pids          = VALUES(pid),
      hosts         = VALUES(hostn),
      first_seen    = MIN(@timestamp),
      last_seen     = MAX(@timestamp)
    BY agent_id, actor, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE distinct_srcs >= 3
  | KEEP agent_id, bucket, actor, conn_count, distinct_srcs, databases,
         src_ips, pids, hosts, first_seen, last_seen
  | SORT distinct_srcs DESC, conn_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.initial_access
  - attack.t1078
  - detection.postgresql
severity: medium
risk_score: 55
nist: ["AU-2", "AU-12", "AC-7", "AC-17"]
pci_dss: ["10.2.5", "8.1.6"]
gdpr: ["32.1.a", "32.2"]
mitre_attack:
  TA0001:
    T1078: []
