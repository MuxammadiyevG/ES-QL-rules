rule_id: 44f53f18-11cb-47a9-9541-25dfce182ac6
name_uz: "PostgreSQL - Ma'lumotlar Bazasida Muvaffaqiyatli Autentifikatsiya"
name_ru: "PostgreSQL - успешная аутентификация в базе данных"
name_en: "PostgreSQL - Database Authentication Success"
description_uz: |
  Ushbu qoida PostgreSQL da muvaffaqiyatli autentifikatsiya hodisalarini kuzatadi (Rule 50511).
  Muvaffaqiyatli kirish odatda qonuniy bo'lsa ham, noodatiy vaqt, IP yoki foydalanuvchidan
  kirish hisobni egallash (T1078) belgisi bo'lishi mumkin.
  Qonuniy holatlar: oddiy foydalanuvchi va servis akkauntlarining kirishlari.
  SOC triage bosqichlari:
  - `actor` (user.name) va `db.name` ni tekshiring.
  - `source.ip` manzili va vaqtni tekshiring — noodatiy soatda kirish bormi.
  - GeoIP ma'lumotlarini tekshiring.
  - Ko'p muvaffaqiyatli kirish brute-force dan keyin bo'lishi mumkin.
description_ru: |
  Данное правило отслеживает события успешной аутентификации в PostgreSQL (Rule 50511).
  Хотя успешный вход обычно легитимен, вход в необычное время, с необычного IP или
  от необычного пользователя может быть признаком захвата учётной записи (T1078).
  Легитимные случаи: входы обычных пользователей и сервисных учётных записей.
  Шаги SOC-триажа:
  - Проверьте `actor` (user.name) и `db.name`.
  - Проверьте адрес `source.ip` и время — нет ли входа в необычный час.
  - Проверьте данные GeoIP.
  - Множество успешных входов может следовать за перебором паролей (brute force).
description_en: |
  This rule tracks successful authentication events in PostgreSQL (Rule 50511).
  Although a successful login is usually legitimate, a login at an unusual time, from an unusual IP
  or by an unusual user may be a sign of account takeover (T1078).
  Legitimate cases: logins of ordinary users and service accounts.
  SOC triage steps:
  - Check `actor` (user.name) and `db.name`.
  - Check the `source.ip` address and the time — is there a login at an unusual hour.
  - Check the GeoIP data.
  - Many successful logins may follow a brute-force attack.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-postgresql.log-*
query_language: esql
query: |
  FROM logs-postgresql.log-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE data_stream.dataset == "postgresql.log"
  | WHERE event.action == "postgres-connection"
  | WHERE event.outcome == "success"
  | WHERE TO_LOWER(postgresql.log.message) RLIKE ".*(connection authorized|connection authenticated).*"
  | EVAL actor    = COALESCE(user.name, "Unknown")
  | EVAL db       = COALESCE(db.name, "Unknown")
  | EVAL hostn    = COALESCE(host.hostname, "Unknown")
  | EVAL pg_level = COALESCE(postgresql.log.severity, "Unknown")
  | EVAL pg_msg   = COALESCE(postgresql.log.message, "Unknown")
  | EVAL pid      = COALESCE(process.pid, 0)
  | STATS
      auth_count  = COUNT(*),
      databases   = VALUES(db),
      pids        = VALUES(pid),
      messages    = VALUES(pg_msg),
      hosts       = VALUES(hostn),
      first_seen  = MIN(@timestamp),
      last_seen   = MAX(@timestamp)
    BY agent_id, actor, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, actor, auth_count, databases,
         pids, messages, hosts, first_seen, last_seen
  | SORT auth_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.initial_access
  - attack.t1078
  - detection.postgresql
severity: low
risk_score: 21
nist: ["AU-2", "AU-12", "AU-14", "AC-7"]
pci_dss: ["10.2.5", "8.1.6"]
gdpr: ["32.1.a", "32.2"]
mitre_attack:
  TA0001:
    T1078: []