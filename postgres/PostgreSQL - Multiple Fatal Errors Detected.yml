rule_id: 7cb1e9ff-c947-44b2-ba8f-0ca80ff1343d
name_uz: "PostgreSQL - Ko'p Sonli FATAL Xatolar Aniqlandi"
name_ru: "PostgreSQL - обнаружено множество фатальных ошибок"
name_en: "PostgreSQL - Multiple Fatal Errors Detected"
description_uz: |
  Ushbu qoida PostgreSQL da qisqa vaqt ichida ko'p FATAL xato hodisalarini kuzatadi (Rule 50580).
  Ko'p xato servis ta'siriga (T1499 - Endpoint Denial of Service) yoki konfiguratsiya muammosiga ishora qilishi mumkin.
  Qonuniy holatlar: dastur xatosi, noto'g'ri konfiguratsiya, connection pool muammosi.
  SOC triage bosqichlari:
  - `postgresql.log.message` xato turini aniq aniqlang.
  - `actor` va `db.name` takrorlanayotganligini tekshiring.
  - Xatolar bir xil manba yoki jarayondan kelayotganini ko'ring.
  - Noqonuniy faoliyat tasdiqlansa: manbani cheklang, DBA xabardor qiling.
description_ru: |
  Данное правило отслеживает большое количество ошибок FATAL в PostgreSQL за короткое время (Rule 50580).
  Множество ошибок может указывать на воздействие на сервис (T1499 - Endpoint Denial of Service) или на проблему конфигурации.
  Легитимные случаи: ошибка приложения, некорректная конфигурация, проблема connection pool.
  Шаги SOC-триажа:
  - Точно определите тип ошибки в `postgresql.log.message`.
  - Проверьте, повторяются ли `actor` и `db.name`.
  - Посмотрите, приходят ли ошибки из одного и того же источника или процесса.
  - При подтверждении нелегитимной активности: ограничьте источник, оповестите DBA.
description_en: |
  This rule tracks a large number of FATAL error events in PostgreSQL within a short period of time (Rule 50580).
  Many errors may point to service impact (T1499 - Endpoint Denial of Service) or to a configuration problem.
  Legitimate cases: application bug, misconfiguration, connection pool problem.
  SOC triage steps:
  - Precisely determine the error type in `postgresql.log.message`.
  - Check whether `actor` and `db.name` are repeating.
  - See whether the errors are coming from the same source or process.
  - If illegitimate activity is confirmed: restrict the source, notify the DBA.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-postgresql.log-*
query_language: esql
query: |
  FROM logs-postgresql.log-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE data_stream.dataset == "postgresql.log"
  | WHERE event.outcome == "failure"
  | WHERE postgresql.log.severity == "FATAL"
  | EVAL actor    = COALESCE(user.name, "Unknown")
  | EVAL db       = COALESCE(db.name, "Unknown")
  | EVAL hostn    = COALESCE(host.hostname, "Unknown")
  | EVAL pg_msg   = COALESCE(postgresql.log.message, "Unknown")
  | EVAL pid      = COALESCE(process.pid, 0)
  | STATS
      fatal_count = COUNT(*),
      databases   = VALUES(db),
      messages    = VALUES(pg_msg),
      pids        = VALUES(pid),
      hosts       = VALUES(hostn),
      first_seen  = MIN(@timestamp),
      last_seen   = MAX(@timestamp)
    BY agent_id, actor, bucket = DATE_TRUNC(2 minutes, @timestamp)
  /* Rule 50580: timeframe 120s ichida 8 ta FATAL (analog) */
  | WHERE fatal_count >= 8
  | KEEP agent_id, bucket, actor, fatal_count, databases,
         messages, pids, hosts, first_seen, last_seen
  | SORT fatal_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.impact
  - attack.t1499
  - detection.postgresql
  - service.availability
severity: high
risk_score: 73
nist: ["AU-2", "AU-12", "AU-6", "SI-4"]
pci_dss: ["10.6.1", "11.4"]
gdpr: ["32.1.a", "32.2", "35.7.d"]
mitre_attack:
  TA0040:
    T1499: []