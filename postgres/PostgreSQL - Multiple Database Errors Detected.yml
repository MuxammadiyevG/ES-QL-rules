rule_id: 870fae61-1576-49c2-afa6-2481f437e976
name_uz: "PostgreSQL - Ko'p Sonli Ma'lumotlar Bazasi Xatolari Aniqlandi"
name_ru: "PostgreSQL - обнаружено множество ошибок базы данных"
name_en: "PostgreSQL - Multiple Database Errors Detected"
description_uz: |
  Ushbu qoida PostgreSQL da qisqa vaqt ichida ko'p ERROR xato hodisalarini kuzatadi (Rule 50581).
  Takroriy ERROR hodisalari SQL injection, noto'g'ri so'rovlar yoki servis ta'sirlanishiga ishora qilishi mumkin (T1499).
  Qonuniy holatlar: dastur xatosi, noto'g'ri SQL so'rovlar, schema muammolari.
  SOC triage bosqichlari:
  - `postgresql.log.message` xato turini aniq aniqlang.
  - Duplicate key, permission denied yoki syntax error ekanligini tekshiring.
  - Bir xil `actor` yoki `db.name` dan kelayotganini ko'ring.
  - SQL injection belgisi bo'lsa: WAF qoidasini yangilang, manbani cheklang.
description_ru: |
  Данное правило отслеживает большое количество событий ERROR в PostgreSQL за короткое время (Rule 50581).
  Повторяющиеся события ERROR могут указывать на SQL injection, некорректные запросы или воздействие на сервис (T1499).
  Легитимные случаи: ошибка приложения, некорректные SQL-запросы, проблемы схемы.
  Шаги SOC-триажа:
  - Точно определите тип ошибки в `postgresql.log.message`.
  - Проверьте, является ли это duplicate key, permission denied или syntax error.
  - Посмотрите, приходят ли они от одного и того же `actor` или `db.name`.
  - При признаках SQL injection: обновите правило WAF, ограничьте источник.
description_en: |
  This rule tracks a large number of ERROR events in PostgreSQL within a short period of time (Rule 50581).
  Repeated ERROR events may point to SQL injection, malformed queries or service impact (T1499).
  Legitimate cases: application bug, malformed SQL queries, schema problems.
  SOC triage steps:
  - Precisely determine the error type in `postgresql.log.message`.
  - Check whether it is a duplicate key, permission denied or syntax error.
  - See whether they are coming from the same `actor` or `db.name`.
  - If there is a sign of SQL injection: update the WAF rule, restrict the source.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-postgresql.log-*
query_language: esql
query: |
  FROM logs-postgresql.log-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE data_stream.dataset == "postgresql.log"
  | WHERE event.outcome == "failure"
  | WHERE postgresql.log.severity == "ERROR"
  | EVAL actor    = COALESCE(user.name, "Unknown")
  | EVAL db       = COALESCE(db.name, "Unknown")
  | EVAL hostn    = COALESCE(host.hostname, "Unknown")
  | EVAL pg_msg   = COALESCE(postgresql.log.message, "Unknown")
  | EVAL pid      = COALESCE(process.pid, 0)
  | EVAL sql_op   = COALESCE(postgresql.log.sql_operation, "Unknown")
  | STATS
      error_count = COUNT(*),
      databases   = VALUES(db),
      messages    = VALUES(pg_msg),
      sql_ops     = VALUES(sql_op),
      pids        = VALUES(pid),
      hosts       = VALUES(hostn),
      first_seen  = MIN(@timestamp),
      last_seen   = MAX(@timestamp)
    BY agent_id, actor, bucket = DATE_TRUNC(2 minutes, @timestamp)
  /* Rule 50581: timeframe 120s ichida 8 ta ERROR (analog) */
  | WHERE error_count >= 8
  | KEEP agent_id, bucket, actor, error_count, databases,
         messages, sql_ops, pids, hosts, first_seen, last_seen
  | SORT error_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.impact
  - attack.t1499
  - detection.postgresql
  - service.availability
severity: high
risk_score: 73
nist: ["AU-2", "AU-12", "AU-6", "SI-4"]
pci_dss: ["10.6.1", "11.4"]
gdpr: ["32.1.a", "32.2", "35.7.d"]
mitre_attack:
  TA0040:
    T1499: []