rule_id: 19aee67b-5615-48e6-9c81-7f9d07bd128f
name_uz: "WAF ogohlantirishi aniqlandi"
name_ru: "Обнаружено оповещение WAF"
name_en: "WAF Alert Detected"
description_uz: |
  Ushbu qoida WAF tomonidan aniqlangan
  barcha web hujumlarni kuzatadi.


  WAF tomonidan `event.outcome: failure` bilan qaytarilgan hodisalar
  source.ip bo'yicha guruhlanadi.

  SOC triage bosqichlari:
  - `source.ip` ni threat intelligence bilan tekshiring.
  - `event.reason` orqali hujum turini aniqlang (LFI, SQLi, RFI va h.k.).
  - `url.domain` (host) — qaysi resurs nishonga olinganligi.
  - `rule.id` (ruleId) — qaysi WAF qoidasi ishga tushganini aniqlang.
  - Bir xil `event.id` bilan kelgan eventlar bir hujum sessiyasiga tegishli.
  - Takroriy urinishlar bo'lsa `source.ip` ni blocklist ga qo'shing.
  - WAF logidan to'liq request tafsilotini `event.original` dan o'qing.
description_ru: |
  Это правило отслеживает все веб-атаки, обнаруженные
  WAF.


  События, возвращённые WAF с `event.outcome: failure`,
  группируются по source.ip.

  Этапы SOC-триажа:
  - Проверьте `source.ip` по threat intelligence.
  - Определите тип атаки по `event.reason` (LFI, SQLi, RFI и т.д.).
  - `url.domain` (host) — какой ресурс был выбран целью.
  - `rule.id` (ruleId) — определите, какое правило WAF сработало.
  - События с одинаковым `event.id` относятся к одной сессии атаки.
  - При повторных попытках добавьте `source.ip` в blocklist.
  - Полные детали запроса из лога WAF читайте в `event.original`.
description_en: |
  This rule tracks all web attacks detected
  by WAF.


  Events returned by WAF with `event.outcome: failure`
  are grouped by source.ip.

  SOC triage steps:
  - Check `source.ip` against threat intelligence.
  - Determine the attack type via `event.reason` (LFI, SQLi, RFI, etc.).
  - `url.domain` (host) — which resource was targeted.
  - `rule.id` (ruleId) — determine which WAF rule was triggered.
  - Events arriving with the same `event.id` belong to a single attack session.
  - If there are repeated attempts, add `source.ip` to the blocklist.
  - Read the full request details from the WAF log in `event.original`.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-nginx.waf-*
query_language: esql
query: |
  FROM logs-nginx.waf-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | MV_EXPAND event.dataset
  | WHERE event.dataset == "nginx.waf" OR event.dataset == "nginx.modsecurity"
  | MV_EXPAND event.category
  | WHERE event.category == "intrusion_detection"
    OR event.category == "web"
  | WHERE event.outcome == "failure"
  | MV_EXPAND event.kind
  | WHERE event.kind == "alert"
  | WHERE source.ip IS NOT NULL
  | STATS
      event_count   = COUNT_DISTINCT(event.id),
      src_ips       = VALUES(source.ip),
      hosts         = VALUES(url.domain),
      reasons       = VALUES(event.reason),
      rule_ids      = VALUES(rule.id),
      severities    = VALUES(event.severity),
      event_ids     = VALUES(event.id),
      modules       = VALUES(event.module),
      outcomes      = VALUES(event.outcome),
      last_seen     = MAX(@timestamp),
      first_seen    = MIN(@timestamp)
    BY agent_id, source.ip, event.reason
  | KEEP
      agent_id,
      source.ip,
      event.reason,
      event_count,
      src_ips,
      hosts,
      reasons,
      rule_ids,
      severities,
      event_ids,
      modules,
      outcomes,
      last_seen,
      first_seen
  | SORT event_count DESC
  | LIMIT 200

enabled: true
tags:
  - attack.initial-access
  - attack.t1190
  - detection.waf
  - source.nginx
severity: medium
risk_score: 60
references:
  - "https://attack.mitre.org/techniques/T1190/"
  - "https://owasp.org/www-project-modsecurity-core-rule-set/"
  - "https://coreruleset.org/docs/"
nist: ["SI-3", "SI-4", "SC-7", "AC-17"]
pci_dss: ["6.4.1", "6.4.2", "10.4.1", "11.5.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0001:
    T1190: []