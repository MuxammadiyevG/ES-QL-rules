rule_id: d8361f51-7c2e-4a5d-92af-9ac7aa5e142a
name_uz: "Yuqori chastotali WAF bloklashlari - avtomatlashtirilgan skaner aniqlandi"
name_ru: "Высокочастотные блокировки WAF - обнаружен автоматизированный сканер"
name_en: "High Frequency WAF Blocks - Automated Scanner Detected"
description_uz: |
  Bitta IP manzildan juda qisqa vaqt ichida katta miqdordagi WAF bloklash hodisalari
  aniqlandi. Bu sqlmap, nikto, nuclei, burpsuite kabi avtomatlashtirilgan skaner
  yoki fuzzing vositasining ishlatilayotganligini ko'rsatadi.
  Qonuniy holatlar: rejalashtirilgan pentest yoki vulnerability assessment bo'lishi mumkin.
  SOC triage bosqichlari:
  - `source.ip` uchun tasdiqlangan pentest change ticket borligini tekshiring.
  - `rule.category` va `rule.description` asosida qanday turdagi hujumlar skanlanayotganini aniqlab oling.
  - IP manzilning hosting provayderini (VPS, cloud, residential) tekshiring.
  - Ruxsatsiz scan bo'lsa darhol IP ni WAF darajasida bloklang va hodisani qayd eting.
  - Bir xil IP dan turli rule IDlar triggerlanganda keng qamrovli reconnaissance deb baholang.
description_ru: |
  С одного IP-адреса за очень короткое время обнаружено большое количество
  событий блокировки WAF. Это указывает на использование автоматизированного сканера
  или fuzzing-инструмента вроде sqlmap, nikto, nuclei, burpsuite.
  Легитимные случаи: может быть запланированный pentest или vulnerability assessment.
  Этапы SOC-триажа:
  - Проверьте, есть ли для `source.ip` подтверждённый change ticket на pentest.
  - По `rule.category` и `rule.description` определите, какие типы атак сканируются.
  - Проверьте хостинг-провайдера IP-адреса (VPS, cloud, residential).
  - Если скан несанкционированный, немедленно заблокируйте IP на уровне WAF и зарегистрируйте инцидент.
  - Если с одного и того же IP срабатывают разные rule ID, оценивайте это как широкую разведку (reconnaissance).
description_en: |
  A large number of WAF block events from a single IP address within a very short
  time was detected. This indicates the use of an automated scanner
  or fuzzing tool such as sqlmap, nikto, nuclei, burpsuite.
  Legitimate cases: it may be a scheduled pentest or vulnerability assessment.
  SOC triage steps:
  - Check whether there is an approved pentest change ticket for `source.ip`.
  - Based on `rule.category` and `rule.description`, determine what types of attacks are being scanned for.
  - Check the hosting provider of the IP address (VPS, cloud, residential).
  - If the scan is unauthorized, immediately block the IP at the WAF level and log the incident.
  - When different rule IDs are triggered from the same IP, assess it as broad reconnaissance.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-nginx.waf*
query_language: esql
query: |
  FROM logs-nginx.waf*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE event.category == "intrusion_detection"
  | STATS
      total_blocks       = COUNT(*),
      unique_rules       = COUNT_DISTINCT(rule.id),
      triggered_rules    = VALUES(rule.id),
      rule_descriptions  = VALUES(rule.description),
      rule_categories    = VALUES(rule.category),
      targeted_domains   = VALUES(url.domain),
      unique_domains     = COUNT_DISTINCT(url.domain),
      severity_levels    = VALUES(event.severity),
      match_data         = VALUES(nginx.modsecurity.match_data),
      first_seen         = MIN(@timestamp),
      last_seen          = MAX(@timestamp)
    BY agent_id, source.ip, source.geo.country_name, source.geo.city_name,
       source.geo.region_name, source.geo.country_iso_code,
       bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE total_blocks >= 10
  | KEEP agent_id, bucket, source.ip, source.geo.country_name, source.geo.city_name,
        source.geo.region_name, source.geo.country_iso_code,
        total_blocks, unique_rules, triggered_rules, rule_descriptions,
        rule_categories, targeted_domains, unique_domains,
        severity_levels, match_data, first_seen, last_seen
  | SORT total_blocks DESC
  | LIMIT 200
enabled: true
tags:
  - attack.reconnaissance
  - attack.t1595
  - attack.t1190
  - detection.high
severity: high
risk_score: 80
nist: ["SI-4", "AU-6", "SC-7"]
pci_dss: ["11.4", "6.4.1"]
gdpr: ["32.1.a"]
mitre_attack:
  TA0043:
    T1595: []