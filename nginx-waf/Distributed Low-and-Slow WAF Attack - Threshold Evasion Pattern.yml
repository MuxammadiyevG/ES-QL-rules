rule_id: efffaaf2-90d8-494c-8cd5-a8966be62b93
name_uz: "Taqsimlangan Low-and-Slow WAF hujumi - chegaradan qochish patterni"
name_ru: "Распределённая атака Low-and-Slow на WAF - шаблон обхода порога"
name_en: "Distributed Low-and-Slow WAF Attack - Threshold Evasion Pattern"
description_uz: |
  Ko'p sonli turli IP manzillardan har biridan ozgina (1-2 ta) so'rov yuborib,
  WAF rate limiting chegarasidan qochishga urinish aniqlandi.
  Bu "low-and-slow" yoki "distributed brute force" texnikasi bo'lib,
  botnet koordinatsiyasi orqali amalga oshiriladi.
  Har bir alohida IP bloklansa ham, umumiy hujum davom etadi.
  SOC triage bosqichlari:
  - `unique_sources` soni yuqori, lekin har bir IP dan `avg_hits_per_ip` past bo'lsa — bu klassik low-and-slow pattern.
  - Barcha hujum IP larini bir vaqtda bloklash uchun threat feed yoki dynamic blocklist yarating.
  - Hujum payload laridagi (`match_data`) umumiy pattern ni aniqlang — bir xil payload turli IP lardan kelayotgan bo'lishi mumkin.
  - CAPTCHA yoki rate limiting ni IP darajasidan session/fingerprint darajasiga ko'tiring.
  - CDN yoki DDoS protection xizmatiga eskalyatsiya qilishni ko'rib chiqing.
description_ru: |
  С большого числа различных IP-адресов, с каждого из которых отправляется
  лишь несколько (1-2) запросов, обнаружена попытка обойти порог rate limiting WAF.
  Это техника "low-and-slow" или "distributed brute force",
  которая реализуется через координацию ботнета.
  Даже если заблокировать каждый отдельный IP, общая атака продолжается.
  Этапы SOC-триажа:
  - Если число `unique_sources` высокое, а `avg_hits_per_ip` с каждого IP низкое — это классический low-and-slow паттерн.
  - Создайте threat feed или динамический blocklist, чтобы заблокировать все атакующие IP одновременно.
  - Определите общий паттерн в payload'ах атаки (`match_data`) — один и тот же payload может приходить с разных IP.
  - Поднимите CAPTCHA или rate limiting с уровня IP на уровень сессии/fingerprint.
  - Рассмотрите эскалацию в службу CDN или DDoS protection.
description_en: |
  An attempt to evade the WAF rate limiting threshold was detected by sending only a few
  (1-2) requests from each of a large number of different IP addresses.
  This is a "low-and-slow" or "distributed brute force" technique,
  carried out through botnet coordination.
  Even if each individual IP is blocked, the overall attack continues.
  SOC triage steps:
  - If `unique_sources` is high but `avg_hits_per_ip` per IP is low — this is the classic low-and-slow pattern.
  - Create a threat feed or dynamic blocklist to block all attacking IPs at once.
  - Identify the common pattern in the attack payloads (`match_data`) — the same payload may be coming from different IPs.
  - Raise CAPTCHA or rate limiting from the IP level to the session/fingerprint level.
  - Consider escalating to a CDN or DDoS protection service.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-nginx.waf*
query_language: esql
query: |
  FROM logs-nginx.waf*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.category == "intrusion_detection"
  | STATS
      total_attacks      = COUNT(*),
      unique_sources     = COUNT_DISTINCT(source.ip),
      source_ips         = VALUES(source.ip),
      unique_countries   = COUNT_DISTINCT(source.geo.country_iso_code),
      country_names      = VALUES(source.geo.country_name),
      country_codes      = VALUES(source.geo.country_iso_code),
      continent_names    = VALUES(source.geo.continent_name),
      unique_rules       = COUNT_DISTINCT(rule.id),
      triggered_rules    = VALUES(rule.id),
      rule_descriptions  = VALUES(rule.description),
      match_data         = VALUES(nginx.modsecurity.match_data),
      reasons            = VALUES(event.reason),
      first_seen         = MIN(@timestamp),
      last_seen          = MAX(@timestamp)
    BY agent_id, url.domain, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | EVAL avg_hits_per_ip = total_attacks / unique_sources
  | WHERE unique_sources >= 5 AND avg_hits_per_ip <= 3
  | KEEP agent_id, bucket, url.domain, total_attacks, unique_sources, avg_hits_per_ip,
        source_ips, unique_countries, country_names, country_codes,
        continent_names, unique_rules, triggered_rules, rule_descriptions,
        match_data, reasons, first_seen, last_seen
  | SORT unique_sources DESC
  | LIMIT 100
enabled: true
tags:
- attack.initial-access
- attack.t1190
- attack.t1583
- attack.discovery
- detection.critical
severity: critical
risk_score: 90
nist: ["SI-4", "SC-5", "AU-6", "IR-4", "SC-7"]
pci_dss: [6.4.1, '11.4', 10.2.4, 12.10.1]
gdpr: ["32.1.a", "32.2", "33.1"]
mitre_attack:
  TA0001:
    T1190: []
  TA0042:
    T1583: []
