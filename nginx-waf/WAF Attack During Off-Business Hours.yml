rule_id: 9771fb71-e1b2-4a73-860c-6ccc52454cde
name_uz: "Ish vaqtidan tashqarida WAF hujumi"
name_ru: "WAF-атака в нерабочее время"
name_en: "WAF Attack During Off-Business Hours"
description_uz: |
  Ish soatlaridan tashqarida (kechasi 22:00 dan 06:00 gacha yoki dam olish kunlari)
  WAF hujum hodisalari aniqlandi. Hujumchilar ko'pincha monitoring kamroq bo'lgan
  vaqtlarda hujumni amalga oshirishga harakat qiladi.
  Bu insider threat, vaqt zonasi farqidan foydalanuvchi tashqi hujumchi,
  yoki scheduled avtomatlashtirilgan hujum bo'lishi mumkin.
  SOC triage bosqichlari:
  - `source.geo.timezone` va hujum vaqtini solishtiring — hujumchi uchun bu ish vaqti bo'lishi mumkin.
  - Shu vaqt oralig'ida autentifikatsiya tizimlari va VPN loglarini tekshiring.
  - On-call SOC xodimiga darhol xabar bering.
  - Rejalashtirilgan maintenance oynasi bor-yo'qligini change management tizimidan tekshiring.
  - Agar ichki IP manzildan bo'lsa, insider threat stsenariyini ko'rib chiqing.
description_ru: |
  В нерабочее время (ночью с 22:00 до 06:00 или в выходные дни)
  обнаружены события WAF-атак. Атакующие часто пытаются проводить атаку
  в периоды, когда мониторинг слабее.
  Это может быть insider threat, внешний атакующий, использующий разницу часовых поясов,
  или запланированная (scheduled) автоматизированная атака.
  Этапы SOC-триажа:
  - Сопоставьте `source.geo.timezone` и время атаки — для атакующего это может быть рабочее время.
  - Проверьте логи систем аутентификации и VPN за этот же интервал времени.
  - Немедленно уведомите дежурного (on-call) сотрудника SOC.
  - Проверьте в системе change management, есть ли запланированное окно maintenance.
  - Если источник — внутренний IP-адрес, рассмотрите сценарий insider threat.
description_en: |
  Outside business hours (at night from 22:00 to 06:00 or on weekends)
  WAF attack events were detected. Attackers often try to carry out attacks
  at times when monitoring is lighter.
  This may be an insider threat, an external attacker exploiting a time zone difference,
  or a scheduled automated attack.
  SOC triage steps:
  - Compare `source.geo.timezone` with the attack time — it may be business hours for the attacker.
  - Check authentication systems and VPN logs for the same time window.
  - Notify the on-call SOC staff member immediately.
  - Check the change management system for whether a planned maintenance window exists.
  - If it comes from an internal IP address, consider an insider threat scenario.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-nginx.waf*
query_language: esql
query: |
  FROM logs-nginx.waf*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.category == "intrusion_detection"
  // NOTE: hour_of_day is derived from @timestamp in UTC. Adjust the 22:00-06:00
  // off-hours window if the organization's local timezone differs from UTC.
  | EVAL hour_of_day = DATE_EXTRACT("hour", @timestamp)
  | WHERE hour_of_day >= 22 OR hour_of_day < 6
  | STATS
      off_hours_attacks  = COUNT(*),
      unique_sources     = COUNT_DISTINCT(source.ip),
      source_ips         = VALUES(source.ip),
      unique_rules       = COUNT_DISTINCT(rule.id),
      triggered_rules    = VALUES(rule.id),
      rule_descriptions  = VALUES(rule.description),
      targeted_domains   = VALUES(url.domain),
      countries          = VALUES(source.geo.country_name),
      timezones          = VALUES(source.geo.timezone),
      match_data         = VALUES(nginx.modsecurity.match_data),
      reasons            = VALUES(event.reason),
      first_seen         = MIN(@timestamp),
      last_seen          = MAX(@timestamp)
    BY agent_id, source.ip, source.geo.country_name, source.geo.country_iso_code,
       source.geo.city_name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE off_hours_attacks >= 3
  | KEEP agent_id, bucket, source.ip, source.geo.country_name, source.geo.country_iso_code,
        source.geo.city_name, off_hours_attacks, unique_sources, source_ips,
        unique_rules, triggered_rules, rule_descriptions, targeted_domains,
        countries, timezones, match_data, reasons, first_seen, last_seen
  | SORT off_hours_attacks DESC
  | LIMIT 200
enabled: true
tags:
- attack.initial-access
- attack.t1190
- attack.t1078
- detection.medium
severity: medium
risk_score: 70
nist: ["SI-4", "AU-6", "AC-2"]
pci_dss: [10.2.4, '11.4', '8.3']
gdpr: ["32.1.a"]
mitre_attack:
  TA0001:
    T1190: []
    T1078: []
