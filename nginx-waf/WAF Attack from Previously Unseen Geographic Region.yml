rule_id: 5fb566bd-3753-479d-9e99-ae2533012754
name_uz: "Yuqori xavfli geografik mintaqadan WAF hujumi"
name_ru: "WAF-атака из географического региона высокого риска"
name_en: "WAF Attack from High-Risk Geographic Region"
description_uz: |
  Odatda hujumlar kuzatilmagan yangi geografik mintaqadan (mamlakat yoki kontinent)
  WAF qoidalari ishga tushdi. Bu yangi hujum kampaniyasining boshlanishini yoki
  VPN/proxy orqali manzilni yashirishga urinayotgan hujumchini ko'rsatishi mumkin.
  SOC triage bosqichlari:
  - `source.geo.continent_name` va `source.geo.country_name` ni tashkilotning
    odatdagi foydalanuvchi bazasi bilan solishtiring.
  - `source.geo.timezone` asosida hujum vaqtining mahalliy ish vaqtiga to'g'ri
    kelmasligi (kechasi, bayram) ni tekshiring.
  - Ushbu mamlakatdan boshqa tizimlar (VPN gateway, email, auth) ga kirish
    urinishlari bor-yo'qligini korrelyatsiya qiling.
  - Geo-blocking policy mavjud bo'lsa, bu mintaqadan trafik WAF ga yetib kelmasligi kerak edi — policy tekshiring.
description_ru: |
  Правила WAF сработали из нового географического региона (страна или континент),
  откуда обычно атаки не наблюдались. Это может указывать на начало новой кампании атак или
  на атакующего, пытающегося скрыть своё местоположение через VPN/proxy.
  Этапы SOC-триажа:
  - Сопоставьте `source.geo.continent_name` и `source.geo.country_name` с обычной
    пользовательской базой организации.
  - По `source.geo.timezone` проверьте, не приходится ли время атаки на нерабочее
    местное время (ночь, праздник).
  - Выполните корреляцию, есть ли из этой страны попытки входа в другие системы
    (VPN gateway, email, auth).
  - Если существует политика geo-blocking, трафик из этого региона не должен был доходить до WAF — проверьте политику.
description_en: |
  WAF rules were triggered from a new geographic region (country or continent)
  where attacks are not normally observed. This may indicate the start of a new attack campaign or
  an attacker trying to hide their location via VPN/proxy.
  SOC triage steps:
  - Compare `source.geo.continent_name` and `source.geo.country_name` with the organization's
    usual user base.
  - Using `source.geo.timezone`, check whether the attack time falls outside local
    business hours (night, holiday).
  - Correlate whether there are login attempts from this country to other systems
    (VPN gateway, email, auth).
  - If a geo-blocking policy exists, traffic from this region should not have reached the WAF — check the policy.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-nginx.waf*
query_language: esql
query: |
  FROM logs-nginx.waf*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.category == "intrusion_detection"
  | WHERE source.geo.continent_name IN ("Africa", "South America", "Oceania")
     OR source.geo.country_iso_code IN ("KP", "IR", "SY", "CU", "VE", "BY")
  | STATS
      attack_count       = COUNT(*),
      unique_sources     = COUNT_DISTINCT(source.ip),
      source_ips         = VALUES(source.ip),
      unique_rules       = COUNT_DISTINCT(rule.id),
      triggered_rules    = VALUES(rule.id),
      rule_descriptions  = VALUES(rule.description),
      targeted_domains   = VALUES(url.domain),
      timezones          = VALUES(source.geo.timezone),
      postal_codes       = VALUES(source.geo.postal_code),
      match_data         = VALUES(nginx.modsecurity.match_data),
      first_seen         = MIN(@timestamp),
      last_seen          = MAX(@timestamp)
    BY agent_id, source.geo.country_name, source.geo.country_iso_code,
       source.geo.continent_name, source.geo.region_name,
       bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, source.geo.country_name, source.geo.country_iso_code,
        source.geo.continent_name, source.geo.region_name,
        attack_count, unique_sources, source_ips, unique_rules,
        triggered_rules, rule_descriptions, targeted_domains,
        timezones, postal_codes, match_data, first_seen, last_seen
  | SORT attack_count DESC
  | LIMIT 200
enabled: true
tags:
- attack.initial-access
- attack.t1190
- attack.t1133
- detection.medium
severity: medium
risk_score: 65
nist: ["SI-4", "AC-2"]
pci_dss: ['11.4', '8.3']
gdpr: ["32.1.a"]
mitre_attack:
  TA0001:
    T1190: []
    T1133: []
