rule_id: 23399502-1bfc-43a1-8717-e0be623b6c66
name_uz: "Token imtiyozining oshirilishi aniqlandi"
name_ru: "Обнаружено повышение привилегий токена"
name_en: "Token Privilege Elevation Detected"
description_uz: |
  Ushbu qoida bir logon sessiyasida imtiyozli token berilishini aniqlaydi: 4624 (logon) va
  4672 (Special Privileges Assigned) bir xil `logon_id` ostida korrelyatsiya qilinadi.
  SYSTEM sessiyalari (0x3e7/0x3e4/0x3e5) chiqariladi. Bu admin/imtiyozli kirishni va token
  manipulyatsiyasini kuzatish imkonini beradi.
  SOC triage:
  - `account`/`logon_id` — qaysi akkaunt imtiyozli token oldi?
  - Bu kutilgan admin sessiyasimi?
  - Tasdiqlanmasa: sessiyani tekshiring, 4673/4674 imtiyoz ishlatilishi bilan bog'lang.
description_ru: |
  Данное правило выявляет выдачу привилегированного токена в рамках одной сессии входа: 4624 (logon) и
  4672 (Special Privileges Assigned) коррелируются по одинаковому `logon_id`.
  Сессии SYSTEM (0x3e7/0x3e4/0x3e5) исключаются. Это позволяет отслеживать админский/привилегированный доступ и
  манипуляции с токенами.
  SOC triage:
  - `account`/`logon_id` — какая учётная запись получила привилегированный токен?
  - Является ли это ожидаемой админской сессией?
  - Если не подтверждено: проверьте сессию, свяжите с использованием привилегий 4673/4674.
description_en: |
  This rule detects a privileged token being granted within one logon session: 4624 (logon) and
  4672 (Special Privileges Assigned) are correlated under the same `logon_id`.
  SYSTEM sessions (0x3e7/0x3e4/0x3e5) are excluded. This makes it possible to track admin/privileged access and token
  manipulation.
  SOC triage:
  - `account`/`logon_id` — which account received the privileged token?
  - Is this an expected admin session?
  - If not confirmed: review the session, correlate it with 4673/4674 privilege use.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code IN ("4624", "4672")
  | EVAL logon_id = CASE(event.code == "4624", winlog.event_data.TargetLogonId, winlog.event_data.SubjectLogonId)
  | EVAL account  = CASE(event.code == "4624", winlog.event_data.TargetUserName, winlog.event_data.SubjectUserName)
  | EVAL logon_type = COALESCE(winlog.event_data.LogonType, "-")
  | EVAL is_elevation = CASE(event.code == "4672", 1, 0)
  | EVAL is_logon = CASE(event.code == "4624", 1, 0)
  | WHERE logon_id IS NOT NULL AND NOT logon_id IN ("0x3e7", "0x3e4", "0x3e5", "0x0")
  | WHERE account IS NOT NULL AND NOT account LIKE "*$"
  | WHERE NOT TO_LOWER(account) RLIKE "(system|local service|network service|dwm-[0-9]+|iusr|defaultuser[0-9]+)"
  | STATS
      total_events = COUNT(*),
      elevations = SUM(is_elevation),
      logons = SUM(is_logon),
      logon_types = VALUES(logon_type),
      first_seen = MIN(@timestamp),
      last_seen  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, account, logon_id, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE elevations >= 1 AND logons >= 1
  | EVAL dyn_risk = 80
  | KEEP agent_id, bucket, winlog.computer_name, account, logon_id, elevations, logons,
      logon_types, dyn_risk, first_seen, last_seen
  | SORT elevations DESC
  | LIMIT 200
enabled: true
tags:
  - attack.privilege-escalation
  - attack.defense-evasion
  - attack.t1134
  - attack.t1548.002
  - detection.emerging-threats
severity: high
risk_score: 80
mitre_attack:
  TA0004:
    T1134: []
    T1548: ["T1548.002"]
  TA0005:
    T1134: []
nist: ["AU-6", "AU-9", "SI-4"]
pci_dss: ["10.2.7", "10.5"]
gdpr: ["32.1.a", "32.2"]
