rule_id: 278de698-eb83-4a77-9a93-b103ccbe74e6
name_uz: "GDPR Art.33(2) - Uchinchi tomon yetkazib beruvchi yoki processor akkaunti anomaliyasi"
name_ru: "GDPR Art.33(2) - Аномалия учётной записи стороннего поставщика или обработчика"
name_en: "GDPR Art.33(2) - Third-Party Vendor or Processor Account Anomaly"
description_uz: |
  Uchinchi tomon yetkazib beruvchi yoki processor akkauntlarining anomal faoliyatini aniqlaydi — bu processor
  darajasidagi buzilishdan darak berishi mumkin va GDPR 33(2)-moddasi bo'yicha processorlarning buzilish haqida
  bilgach, kechiktirmasdan controllerlarni xabardor qilish majburiyatini keltirib chiqaradi.
  Vendor/service akkauntlarining g'ayrioddiy soatlarda, kutilmagan joylashuvlardan kirishini,
  odatda murojaat qilmaydigan tizimlarga kirishini yoki ommaviy operatsiyalar bajarishini kuzatadi.
  Vendor akkauntining kompromatatsiyasi shaxsiy ma'lumotlar buzilishi uchun yuqori xavfli vektordir, chunki
  processorlar ko'pincha controllerning ma'lumot tizimlariga keng kirish huquqiga ega bo'ladi.
  Trigger: Vendor akkauntining bir nechta source IP'dan kirishi, yoki odatdagi kirish hajmidan >3x,
  yoki vendorning odatdagi kirish shabloniga kirmagan tizimlarga murojaat.
  False positive: Vendor xodimlarining almashishi, vendor IP diapazonining o'zgarishi, qonuniy incident response.
  Triage: Kirishning qonuniyligini tasdiqlash uchun vendor/processor bilan darhol bog'laning,
  vendor o'z tomonida biror xavfsizlik insidenti haqida xabar berganmi, tekshiring (Art.33(2) majburiyati),
  tasdiqlanmasa vendor akkauntini to'xtating, kirish mumkin bo'lgan shaxsiy ma'lumotlar doirasini baholang.
  ESLATMA: Katalogingizda vendor/processor akkauntlarini guruh yoki nomlash konvensiyasi bilan belgilang
  va quyidagi user.name filtrini shunga mos yangilang (masalan, svc_vendor_*, ext_* va h.k.).
description_ru: |
  Обнаруживает аномальную активность учётных записей сторонних поставщиков или обработчиков, которая может указывать
  на утечку на уровне обработчика, что влечёт обязанность по статье 33(2) GDPR для обработчиков
  уведомлять контролёров без неоправданной задержки после того, как им стало известно об утечке.
  Отслеживает входы vendor/service учётных записей в необычные часы, из неожиданных локаций,
  с доступом к системам, к которым они обычно не обращаются, или с выполнением массовых операций.
  Компрометация учётной записи поставщика — вектор высокого риска для утечек персональных данных, поскольку
  обработчики часто имеют широкий доступ к системам данных контролёра.
  Триггер: Вход учётной записи поставщика с нескольких source IP, или >3x от обычного объёма доступа,
  или доступ к системам вне обычного шаблона доступа поставщика.
  Ложные срабатывания: Смена персонала поставщика, изменение диапазона IP поставщика, легитимное реагирование на инциденты.
  Разбор: Немедленно свяжитесь с поставщиком/обработчиком для подтверждения легитимности доступа,
  проверьте, сообщал ли поставщик о каких-либо инцидентах безопасности на своей стороне (обязанность по Art.33(2)),
  заблокируйте учётную запись поставщика, если доступ не подтверждён, оцените объём доступных персональных данных.
  ПРИМЕЧАНИЕ: Отметьте учётные записи поставщиков/обработчиков в каталоге группой или соглашением об именовании
  и обновите фильтр user.name ниже соответствующим образом (например, svc_vendor_*, ext_* и т.д.).
description_en: |
  Detects anomalous activity from third-party vendor or processor accounts that may indicate
  a breach at the processor level, triggering GDPR Article 33(2) obligation for processors
  to notify controllers without undue delay after becoming aware of a breach.
  Monitors vendor/service account logins at unusual hours, from unexpected locations,
  accessing systems they don't normally access, or performing bulk operations.
  Vendor account compromise is a high-risk vector for personal data breaches as
  processors often have broad access to controller's data systems.
  Trigger: Vendor account login from multiple source IPs, or >3x normal access volume,
  or access to systems not in vendor's normal access pattern.
  False positives: Vendor staff changes, vendor IP range changes, legitimate incident response.
  Triage: Contact the vendor/processor immediately to verify legitimacy of access,
  check if vendor has reported any security incidents on their side (Art.33(2) obligation),
  suspend vendor account if unverified, assess scope of personal data accessible.
  NOTE: Tag vendor/processor accounts in your directory with a group or naming convention
  and update the user.name filter below accordingly (e.g. svc_vendor_*, ext_*, etc.).
type: esql
params: '{}'
schedule_interval: 15m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp > NOW() - 15 minutes
    AND event.outcome == "success"
    AND event.code IN ("4624", "4648")
    AND (
      winlog.event_data.TargetUserName LIKE "svc_*"
      OR winlog.event_data.TargetUserName LIKE "vendor_*"
      OR winlog.event_data.TargetUserName LIKE "ext_*"
      OR winlog.event_data.TargetUserName LIKE "*_svc"
      OR winlog.event_data.TargetUserName LIKE "3p_*"
    )
    AND NOT winlog.event_data.TargetUserName LIKE "*$"
  | STATS
      vendor_logins         = COUNT(*),
      unique_vendors        = COUNT_DISTINCT(winlog.event_data.TargetUserName),
      unique_source_ips     = COUNT_DISTINCT(winlog.event_data.IpAddress),
      unique_hosts_accessed = COUNT_DISTINCT(host.name),
      vendor_accounts       = VALUES(winlog.event_data.TargetUserName),
      source_ip_list        = VALUES(winlog.event_data.IpAddress),
      hosts_accessed        = VALUES(host.name),
      logon_types           = VALUES(winlog.event_data.LogonType)
    BY agent_id, winlog.event_data.TargetUserName,
       bucket = DATE_TRUNC(15 minutes, @timestamp)
  | EVAL anomaly_indicators =
      CASE(unique_source_ips >= 3, 3, 0)
      + CASE(unique_hosts_accessed >= 5, 3, 0)
      + CASE(vendor_logins >= 20, 2, 0)
  | WHERE anomaly_indicators >= 2
  | EVAL risk_narrative = CASE(
      unique_source_ips >= 3,
        "HIGH - Vendor account using multiple source IPs - possible account sharing or compromise",
      unique_hosts_accessed >= 5,
        "HIGH - Vendor accessing unusual number of systems - verify scope of processor agreement",
      "MEDIUM - Vendor account access volume anomaly requires verification"
    )
  | EVAL gdpr_33_2_action = CASE(
      anomaly_indicators >= 6,
        "URGENT: Suspend vendor account. Contact processor per Art.33(2). Assess personal data access scope.",
      anomaly_indicators >= 3,
        "HIGH: Contact vendor to verify access. Review DPA agreement scope. Monitor for exfiltration.",
      "MEDIUM: Verify with vendor team. Review Art.28 processor access controls."
    )
  | EVAL severity_level = CASE(
      anomaly_indicators >= 6, "critical",
      anomaly_indicators >= 3, "high",
      "medium"
    )
  | EVAL risk_score = CASE(
      anomaly_indicators >= 6, 90,
      anomaly_indicators >= 3, 70,
      45
    )
  | KEEP agent_id, bucket, winlog.event_data.TargetUserName, vendor_logins,
         unique_vendors, unique_source_ips, unique_hosts_accessed,
         source_ip_list, hosts_accessed,
         anomaly_indicators, risk_narrative, gdpr_33_2_action,
         severity_level, risk_score
  | SORT anomaly_indicators DESC
enabled: false
tags:
  - gdpr
  - third_party
  - processor
  - vendor_access
  - art33
severity: high
risk_score: 70
references:
  - "GDPR Article 33(2): Processor shall notify controller without undue delay after becoming aware of breach"
  - "GDPR Article 28: Processor obligations and data processing agreements"
  - "GDPR Article 28(3)(h): Processor must provide information necessary for audits"
gdpr: ["33.2", "28.1", "28.3.b", "5.1.f"]
nist: ["SA-9", "IR-6", "AC-17", "AU-12"]
pci_dss: ["12.8.4", "8.1.5"]
mitre_attack:
  TA0001:
    T1078: []
    T1133: []
  TA0006:
    T1110: []
