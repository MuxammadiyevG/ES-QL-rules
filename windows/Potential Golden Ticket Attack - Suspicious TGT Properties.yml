rule_id: c2207e8a-7c8c-431e-949d-5bd9f38d0320
name_uz: "Ehtimoliy Golden Ticket hujumi - shubhali TGT xossalari"
name_ru: "Возможная атака Golden Ticket - подозрительные свойства TGT"
name_en: "Potential Golden Ticket Attack - Suspicious TGT Properties"
description_uz: |
  Ushbu qoida soxta Kerberos ticket (Golden/Silver) belgilarini evristik tarzda aniqlaydi:
  zamonaviy AD'da deyarli uchramaydigan DES (0x1/0x3) shifrli ticketlar yoki AES o'rniga
  RC4 (0x17) bilan so'ralgan TGT (4768). Encryption downgrade ko'pincha mimikatz/forged
  ticket bilan bog'liq.
  Qonuniy holatlar: juda eski legacy tizimlar (DES/RC4) — alohida ro'yxatga oling.
  SOC triage:
  - `enc_types` qaysi: DES (0x1/0x3) — deyarli har doim shubhali; RC4 — domen AES bo'lsa shubhali.
  - `users`/`services` va `src_ips` ni KDC normal xulqi bilan solishtiring.
  - Tasdiqlansa: krbtgt parolini IKKI marta rotatsiya qiling (Golden Ticket containment), Tier-0 IR.
description_ru: |
  Это правило эвристически обнаруживает признаки поддельных билетов Kerberos (Golden/Silver):
  билеты с шифрованием DES (0x1/0x3), которое почти не встречается в современном AD, либо TGT
  (4768), запрошенные с RC4 (0x17) вместо AES. Понижение уровня шифрования часто связано с
  mimikatz/поддельными билетами.
  Легитимные случаи: очень старые legacy-системы (DES/RC4) — ведите их отдельным списком.
  SOC triage:
  - Какие `enc_types`: DES (0x1/0x3) — почти всегда подозрительно; RC4 — подозрительно, если домен на AES.
  - Сравните `users`/`services` и `src_ips` с обычным поведением KDC.
  - При подтверждении: смените пароль krbtgt ДВА раза (Golden Ticket containment), Tier-0 IR.
description_en: |
  This rule heuristically detects signs of forged Kerberos tickets (Golden/Silver):
  tickets with DES (0x1/0x3) encryption, almost never seen in modern AD, or TGTs
  (4768) requested with RC4 (0x17) instead of AES. Encryption downgrade is often linked to
  mimikatz/forged tickets.
  Legitimate cases: very old legacy systems (DES/RC4) — keep a separate list of them.
  SOC triage:
  - Which `enc_types`: DES (0x1/0x3) — almost always suspicious; RC4 — suspicious if the domain is AES.
  - Compare `users`/`services` and `src_ips` with normal KDC behaviour.
  - If confirmed: rotate the krbtgt password TWICE (Golden Ticket containment), Tier-0 IR.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code IN ("4768", "4769")
  // Ixtiyoriy DC scoping:
  // | WHERE TO_LOWER(winlog.computer_name) RLIKE ".*(dc[0-9]|addc|domaincontroller).*"
  | EVAL user         = winlog.event_data.TargetUserName
  | EVAL service_name = COALESCE(winlog.event_data.ServiceName, "-")
  | EVAL enc          = COALESCE(winlog.event_data.TicketEncryptionType, "-")
  | EVAL opts         = COALESCE(winlog.event_data.TicketOptions, "-")
  | EVAL src_ip       = COALESCE(winlog.event_data.IpAddress, "-")
  | WHERE user IS NOT NULL
  // DES (deyarli har doim shubhali) yoki RC4 bilan TGT so'rovi
  | WHERE enc IN ("0x1", "0x3") OR (enc == "0x17" AND event.code == "4768")
  | EVAL is_des = CASE(enc IN ("0x1", "0x3"), 1, 0)
  | STATS
      suspicious_requests = COUNT(*),
      des_count           = SUM(is_des),
      users               = VALUES(user),
      services            = VALUES(service_name),
      enc_types           = VALUES(enc),
      ticket_options      = VALUES(opts),
      src_ips             = VALUES(src_ip),
      first_seen          = MIN(@timestamp),
      last_seen           = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE suspicious_requests >= 1
  | EVAL dyn_risk = CASE(des_count >= 1, 95, 85)
  | KEEP agent_id, bucket, winlog.computer_name, suspicious_requests, des_count, users, services,
      enc_types, ticket_options, src_ips, dyn_risk, first_seen, last_seen
  | SORT dyn_risk DESC, suspicious_requests DESC
  | LIMIT 200
enabled: true
tags:
  - attack.credential-access
  - attack.persistence
  - attack.t1558.001
  - detection.critical
severity: high
risk_score: 95
mitre_attack:
  TA0006:
    T1558: ["T1558.001"]
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
