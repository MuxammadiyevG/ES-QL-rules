rule_id: 6ef11743-9fe6-4d75-a81e-c7a90278a6a0
name_uz: "PrintNightmare - Print Spooler jarayon ishga tushirmoqda"
name_ru: "PrintNightmare - Print Spooler порождает процесс"
name_en: "PrintNightmare - Print Spooler Spawning Process"
description_uz: |
  Ushbu qoida Print Spooler (`spoolsv.exe`) shell/skript yoki noodatiy jarayon ishga
  tushirishini aniqlaydi — PrintNightmare (CVE-2021-34527) va boshqa spooler suiiste'mollari
  belgisidir (T1068). Sysmon 1 (ParentImage spoolsv → Image).
  SOC triage:
  - `children`/`command_lines` nima? DLL yuklanganmi? Host'ni patch holatini tekshiring.
description_ru: |
  Это правило обнаруживает запуск Print Spooler (`spoolsv.exe`) шелла/скрипта или необычного
  процесса — это признак PrintNightmare (CVE-2021-34527) и других злоупотреблений спулером
  (T1068). Sysmon 1 (ParentImage spoolsv → Image).
  SOC triage:
  - Что в `children`/`command_lines`? Загружалась ли DLL? Проверьте состояние патчей на хосте.
description_en: |
  This rule detects the Print Spooler (`spoolsv.exe`) launching a shell/script or an unusual
  process — a sign of PrintNightmare (CVE-2021-34527) and other spooler abuse
  (T1068). Sysmon 1 (ParentImage spoolsv → Image).
  SOC triage:
  - What are `children`/`command_lines`? Was a DLL loaded? Check the host's patch status.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "1"
  | EVAL parent = TO_LOWER(COALESCE(winlog.event_data.ParentImage, "-"))
  | EVAL child = TO_LOWER(COALESCE(winlog.event_data.Image, "-"))
  | EVAL cmd = COALESCE(winlog.event_data.CommandLine, "-")
  | EVAL actor = COALESCE(winlog.event_data.User, "-")
  | WHERE parent RLIKE ".*spoolsv.exe"
  | WHERE child RLIKE ".*(cmd|powershell|pwsh|rundll32|wscript|cscript|mshta|regsvr32).exe"
  | STATS
      exec_count = COUNT(*),
      children = VALUES(child),
      command_lines = VALUES(cmd),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE exec_count >= 1
  | EVAL dyn_risk = 92
  | KEEP agent_id, bucket, winlog.computer_name, exec_count, children, command_lines, users, dyn_risk, first_seen, last_seen
  | SORT exec_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.privilege-escalation
  - attack.t1068
  - AD-advanced
severity: high
risk_score: 92
mitre_attack:
  TA0004:
    T1068: []
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4", "6.2"]
gdpr: ["32.1.a"]
