rule_id: 6cb46679-df2c-4a3d-9417-58a36db441f7
name_uz: "AD imtiyozli guruhdan a'zo olib tashlandi (4729/4733/4757)"
name_ru: "Удаление участника из привилегированной группы AD (4729/4733/4757)"
name_en: "AD Privileged Group Membership Removed (4729/4733/4757)"
description_uz: |
  Ushbu qoida privilege escalation va defense evasion bilan bog'liq bo'lib, imtiyozli guruhlardan a'zoni olib tashlash hodisasini nazorat qiladi.
  Hujumchi boshqa adminlarni guruhdan chiqarib yuborib nazoratni monopolizatsiya qilishi yoki izlarni yashirish uchun a'zolikni tezda rollback qilishi mumkin.
  Qonuniy holatlar: rejalashtirilgan access review, vaqtinchalik rol muddati tugashi, IAM governance jarayonlari.
  SOC triage bosqichlari:
  - `actor`, chiqarilgan `target_user` va `group_name` ni aniqlang.
  - O'zgarish uchun change ticket/deployment ruxsatnomasi borligini tasdiqlang.
  - `src_ip` manbasi va ish stansiya kontekstini tekshiring.
  - Ta'sirlangan foydalanuvchi/guruhning qolgan a'zoliklarini tekshirib, privilege chain buzilishini baholang.
  - Noqonuniy bo'lsa a'zolikni tiklang, aktor huquqlarini cheklang va zarur containmentni bajaring.
description_ru: |
  Данное правило связано с повышением привилегий и defense evasion и контролирует событие удаления участника из привилегированных групп.
  Атакующий может монополизировать контроль, исключив из группы других администраторов, либо быстро откатить членство, чтобы скрыть следы.
  Легитимные случаи: запланированный access review, истечение срока временной роли, процессы IAM governance.
  Этапы SOC triage:
  - Определите `actor`, удалённого `target_user` и `group_name`.
  - Подтвердите наличие change ticket/разрешения на развёртывание для этого изменения.
  - Проверьте источник `src_ip` и контекст рабочей станции.
  - Проверьте оставшиеся членства затронутого пользователя/группы и оцените нарушение privilege chain.
  - Если действие нелегитимно, восстановите членство, ограничьте права актора и выполните необходимый containment.
description_en: |
  This rule is related to privilege escalation and defense evasion and monitors the removal of a member from privileged groups.
  An attacker may monopolize control by removing other admins from the group, or quickly roll back a membership in order to hide traces.
  Legitimate cases: a planned access review, expiry of a temporary role, IAM governance processes.
  SOC triage steps:
  - Identify the `actor`, the removed `target_user` and the `group_name`.
  - Confirm that a change ticket/deployment authorization exists for the change.
  - Check the `src_ip` source and the workstation context.
  - Check the remaining memberships of the affected user/group and assess the break in the privilege chain.
  - If illegitimate, restore the membership, restrict the actor's rights and perform the necessary containment.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | EVAL hostn = winlog.computer_name
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.SubjectUserName)
  | EVAL target_user = COALESCE(winlog.event_data.MemberName, winlog.event_data.TargetUserName, winlog.event_data.SamAccountName)
  | EVAL group_name = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.SamAccountName)
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, winlog.event_data.IpAddress)
  // host-filtri olib tashlandi - barcha hostlarda ishlaydi (DC-only kerak bolsa qolda yoqing)
  | WHERE event.code IN ("4729", "4733", "4757")
  | WHERE actor IS NOT NULL
  | WHERE NOT actor LIKE "*$"
  | WHERE TO_LOWER(group_name) RLIKE ".*(администраторы домена|администраторы схемы|администраторы|операторы учета|операторы архива|операторы сервера|dnsadmins).*"
  | STATS remove_count = COUNT(*) BY agent_id, hostn, actor, target_user, group_name, src_ip
  | WHERE remove_count >= 1
  | EVAL dyn_risk = CASE(TO_LOWER(group_name) RLIKE ".*(администраторы домена|администраторы схемы).*", 93, remove_count >= 3, 88, 82)
  | KEEP agent_id, hostn, actor, target_user, group_name, src_ip, remove_count, dyn_risk
  | SORT dyn_risk DESC, remove_count DESC
  | LIMIT 200
enabled: false
tags:
  - AD
  - Privilege Escalation
  - Defense Evasion
severity: high
risk_score: 82
references:
  - "https://attack.mitre.org/techniques/T1078/"
mitre_attack:
  TA0004:
    T1078: []
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
