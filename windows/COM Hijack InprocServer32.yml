rule_id: ad03bebd-ca42-4252-b8e3-71b5e2911774
name_uz: "InprocServer32 orqali COM hijacking"
name_ru: "COM Hijacking через InprocServer32"
name_en: "COM Hijacking via InprocServer32"
description_uz: |
  Ushbu qoida user-hive COM obyekti (CLSID\...\InprocServer32) registriga yozishni aniqlaydi
  (Sysmon 13) — COM hijacking orqali persistence/execution (T1546.015). Hujumchi mavjud
  CLSID'ga o'z DLL'ini ulaydi.
  SOC triage:
  - `details` (DLL yo'li) shubhali joydami (temp/appdata)? Qaysi CLSID?
description_ru: |
  Это правило выявляет запись в реестр COM-объекта в user-hive (CLSID\...\InprocServer32)
  (Sysmon 13) — закрепление/выполнение через COM hijacking (T1546.015). Злоумышленник подключает
  к существующему CLSID свою DLL.
  Триаж SOC:
  - Находится ли `details` (путь к DLL) в подозрительном месте (temp/appdata)? Какой CLSID?
description_en: |
  This rule detects writes to the registry of a user-hive COM object (CLSID\...\InprocServer32)
  (Sysmon 13) — persistence/execution via COM hijacking (T1546.015). The attacker attaches
  their own DLL to an existing CLSID.
  SOC triage:
  - Is `details` (the DLL path) in a suspicious location (temp/appdata)? Which CLSID?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "13"
  | EVAL tobj = TO_LOWER(COALESCE(winlog.event_data.TargetObject, "-"))
  | EVAL details = TO_LOWER(COALESCE(winlog.event_data.Details, "-"))
  | EVAL img = COALESCE(winlog.event_data.Image, "-")
  | EVAL actor = COALESCE(winlog.event_data.User, "-")
  | WHERE tobj RLIKE ".*clsid\\..*inprocserver32.*"
  | WHERE details RLIKE ".*(temp|appdata|programdata|users.public|\\.tmp).*" OR details RLIKE ".*\\.(dll|ocx)"
  | EVAL is_susp = CASE(details RLIKE ".*(temp|appdata|programdata|users.public).*", 1, 0)
  | STATS
      hits = COUNT(*),
      susp_hits = SUM(is_susp),
      target_objects = VALUES(tobj),
      details = VALUES(details),
      images = VALUES(img),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE susp_hits >= 1
  | EVAL dyn_risk = 85
  | KEEP agent_id, bucket, winlog.computer_name, hits, susp_hits, target_objects, details, images, users, dyn_risk, first_seen, last_seen
  | SORT hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1546.015
  - Registry
severity: high
risk_score: 82
mitre_attack:
  TA0003:
    T1546: ["T1546.015"]
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
