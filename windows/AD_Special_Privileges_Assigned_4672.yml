rule_id: aa70f6ee-c9d4-4ef0-bf71-4b8a72f0a4d7
name_uz: "AD'da yangi logon'ga maxsus imtiyozlar berildi (4672)"
name_ru: "Назначение специальных привилегий новому входу в AD (4672)"
name_en: "AD Special Privileges Assigned to New Logon (4672)"
description_uz: |
  Ushbu qoida privilege escalation hamda lateral movement xavfini ifodalovchi 4672 hodisalarini aniqlaydi.
  SeDebugPrivilege, SeTcbPrivilege kabi maxsus huquqlar bilan logon bo'lish hujumchiga credential dumping, token manipulation va DC ustidan chuqur nazorat imkonini beradi.
  Qonuniy holatlar: Domain Admin logonlari, zaxira agentlari, ayrim monitoring/EDR xizmat hisoblari.
  SOC triage bosqichlari:
  - `actor` va huquq berilgan logon kontekstini (`target_user`) aniqlang.
  - Change ticket yoki ruxsatli administrativ ish borligini tasdiqlang.
  - `src_ip` manbasi va logon boshlangan hostni tekshiring.
  - Akkauntning imtiyozli guruhlardagi a'zoligini va yangi huquqlar zarurligini tekshiring.
  - Tasdiqlanmagan holatda sessiyani tugating, akkauntni cheklang va komprometatsiya doirasini keng tekshiring.
description_ru: |
  Данное правило выявляет события 4672, отражающие риск повышения привилегий и горизонтального перемещения.
  Вход с такими специальными правами, как SeDebugPrivilege, SeTcbPrivilege, даёт атакующему возможность credential dumping, token manipulation и глубокого контроля над DC.
  Легитимные случаи: входы Domain Admin, агенты резервного копирования, отдельные служебные учётные записи monitoring/EDR.
  Этапы SOC triage:
  - Определите `actor` и контекст входа, которому выданы права (`target_user`).
  - Подтвердите наличие change ticket или разрешённой административной работы.
  - Проверьте источник `src_ip` и хост, с которого начался вход.
  - Проверьте членство учётной записи в привилегированных группах и необходимость новых прав.
  - Если подтверждения нет, завершите сессию, ограничьте учётную запись и широко проверьте область компрометации.
description_en: |
  This rule detects 4672 events that represent the risk of privilege escalation and lateral movement.
  Logging on with special rights such as SeDebugPrivilege, SeTcbPrivilege gives an attacker the ability to perform credential dumping, token manipulation and deep control over the DC.
  Legitimate cases: Domain Admin logons, backup agents, certain monitoring/EDR service accounts.
  SOC triage steps:
  - Identify the `actor` and the logon context the privileges were granted to (`target_user`).
  - Confirm that a change ticket or authorized administrative work exists.
  - Check the `src_ip` source and the host where the logon started.
  - Check the account's membership in privileged groups and whether the new privileges are necessary.
  - If unconfirmed, terminate the session, restrict the account and broadly check the scope of compromise.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | EVAL hostn = winlog.computer_name
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.SubjectUserName)
  | EVAL target_user = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.SamAccountName, winlog.event_data.SubjectUserName)
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, winlog.event_data.IpAddress)
  | EVAL priv_list = COALESCE(winlog.event_data.PrivilegeList, "")
  // host-filtri olib tashlandi - barcha hostlarda ishlaydi (DC-only kerak bolsa qolda yoqing)
  | WHERE event.code == "4672"
  | WHERE actor IS NOT NULL
  | WHERE NOT actor LIKE "*$"
  | STATS event_count = COUNT(*) BY agent_id, hostn, actor, target_user, src_ip, priv_list
  | WHERE event_count >= 1
  | EVAL dyn_risk = CASE(TO_LOWER(priv_list) RLIKE "(sedebugprivilege|setcbprivilege|seimpersonateprivilege)", 92, event_count >= 4, 86, 80)
  | KEEP agent_id, hostn, actor, target_user, src_ip, priv_list, event_count, dyn_risk
  | SORT dyn_risk DESC, event_count DESC
  | LIMIT 200
enabled: false
tags:
  - AD
  - Privilege Escalation
  - Lateral Movement
severity: high
risk_score: 80
references:
  - "https://attack.mitre.org/techniques/T1078/"
mitre_attack:
  TA0004:
    T1078: []
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
