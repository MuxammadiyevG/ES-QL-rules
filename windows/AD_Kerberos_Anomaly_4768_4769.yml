rule_id: e3efcc1c-d6d0-44eb-9f17-a7b9c9026f3e
name_uz: "Domain Controller'da Kerberos Ticket Anomaliyasi (4768/4769)"
name_ru: "Аномалия Kerberos-билетов на контроллере домена (4768/4769)"
name_en: "AD Kerberos Ticket Anomaly on Domain Controller (4768/4769)"
description_uz: |
  Ushbu qoida credential access va lateral movement bilan bog'liq bo'lib, Kerberos TGT/TGS jarayonidagi noodatiy xatti-harakatlarni aniqlaydi.
  Juda ko'p ticket so'rovi yoki zaif shifrlash (masalan RC4) Golden/Silver ticket, Kerberoasting yoki service abuse holatlarini ko'rsatishi mumkin.
  Qonuniy holatlar: legacy tizimlar, yirik servis restarti, patchdan keyingi qayta autentikatsiya to'lqini.
  SOC triage bosqichlari:
  - `actor`, `target_user`, event turi va ticket parametrlarini aniqlang.
  - Change ticket asosida rejalashtirilgan servis o'zgarishi borligini tekshiring.
  - `src_ip` manbasi va KDC so'rovlarining tarqalishini tekshiring.
  - Nishon akkaunt/service principal guruh a'zoligi hamda imtiyozlarini tekshiring.
  - Shubhali bo'lsa tegishli xizmat credentiallarini rotatsiya qiling, hujum manbasini bloklang va Kerberos auditini chuqurlashtiring.
description_ru: |
  Это правило связано с получением учётных данных и горизонтальным перемещением и обнаруживает нетипичное поведение в процессе Kerberos TGT/TGS.
  Очень большое число запросов билетов или слабое шифрование (например RC4) может указывать на Golden/Silver ticket, Kerberoasting или злоупотребление сервисом.
  Легитимные случаи: legacy-системы, перезапуск крупного сервиса, волна повторной аутентификации после установки патчей.
  Шаги SOC triage:
  - Определите `actor`, `target_user`, тип события и параметры билета.
  - Проверьте на основании change ticket, было ли запланированное изменение сервиса.
  - Проверьте источник `src_ip` и распределение запросов к KDC.
  - Проверьте членство в группах и привилегии целевой учётной записи/service principal.
  - При подозрении выполните ротацию учётных данных соответствующего сервиса, заблокируйте источник атаки и углубите аудит Kerberos.
description_en: |
  This rule is related to credential access and lateral movement and detects unusual behaviour in the Kerberos TGT/TGS process.
  A very large number of ticket requests or weak encryption (for example RC4) may indicate Golden/Silver ticket, Kerberoasting or service abuse.
  Legitimate cases: legacy systems, a large service restart, a re-authentication wave after patching.
  SOC triage steps:
  - Identify the `actor`, `target_user`, event type and ticket parameters.
  - Check on the basis of a change ticket whether there was a planned service change.
  - Check the `src_ip` source and the distribution of KDC requests.
  - Review the group membership and privileges of the target account/service principal.
  - If suspicious, rotate the relevant service credentials, block the attack source and deepen Kerberos auditing.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | EVAL hostn = winlog.computer_name
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.TargetUserName, winlog.event_data.SubjectUserName)
  | EVAL target_user = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.ServiceName, winlog.event_data.SamAccountName)
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, "-")
  | EVAL enc_type = COALESCE(winlog.event_data.TicketEncryptionType, "")
  | EVAL svc = COALESCE(winlog.event_data.ServiceName, "")
  // host-filtri olib tashlandi - barcha hostlarda ishlaydi (DC-only kerak bolsa qolda yoqing)
  | WHERE event.code IN ("4768", "4769")
  | WHERE actor IS NOT NULL
  | WHERE NOT actor LIKE "*$"
  | STATS ticket_count = COUNT(*), unique_services = COUNT_DISTINCT(svc) BY agent_id, hostn, src_ip, actor, enc_type, event.code
  | WHERE ticket_count >= 20 OR unique_services >= 8 OR enc_type IN ("0x17", "0x18")
  | EVAL dyn_risk = CASE(enc_type == "0x17", 92, ticket_count >= 80 OR unique_services >= 20, 90, 84)
  | KEEP agent_id, hostn, src_ip, actor, enc_type, event.code, ticket_count, unique_services, dyn_risk
  | SORT dyn_risk DESC, ticket_count DESC
  | LIMIT 200
enabled: false
tags:
  - AD
  - Authentication
  - Kerberos
severity: high
risk_score: 84
references:
  - "https://attack.mitre.org/techniques/T1558/"
mitre_attack:
  TA0006:
    T1558: [T1558.003]
nist: ["AU-2", "AU-12", "AC-7", "IA-2"]
pci_dss: ["10.2.4", "10.2.5", "8.1.6"]
gdpr: ["32.1.a", "32.2"]
