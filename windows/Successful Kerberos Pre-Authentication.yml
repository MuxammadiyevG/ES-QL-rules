rule_id: 8f6222c8-7ed7-4042-b1ef-5f34164b2df7
name_uz: "Muvaffaqiyatli Kerberos pre-authentication"
name_ru: "Успешная предварительная аутентификация Kerberos"
name_en: "Successful Kerberos Pre-Authentication"
description_uz: |
  Baseline/health qoidasi: preauth bilan muvaffaqiyatli TGT (4768, Status=0x0, PreAuthType!=0)
  hodisalarini yig'adi. Kerberos salomatligi va normal autentikatsiya darajasini kuzatish uchun
  (alert emas, kontekst). AS-REP roasting rule'i bilan to'ldiruvchi.
description_ru: |
  Baseline/health правило: собирает события успешного TGT с preauth (4768, Status=0x0, PreAuthType!=0).
  Служит для наблюдения за состоянием Kerberos и нормальным уровнем аутентификации
  (не алерт, а контекст). Дополняет правило AS-REP roasting.
description_en: |
  Baseline/health rule: collects successful TGT events with preauth (4768, Status=0x0, PreAuthType!=0).
  Used to monitor Kerberos health and the normal authentication baseline
  (not an alert, context). Complements the AS-REP roasting rule.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4768"
  | EVAL user    = winlog.event_data.TargetUserName
  | EVAL preauth = COALESCE(winlog.event_data.PreAuthType, "-")
  | EVAL status  = COALESCE(winlog.event_data.Status, "-")
  | EVAL src_ip  = COALESCE(winlog.event_data.IpAddress, "-")
  | WHERE status == "0x0" AND preauth != "0"
  | WHERE user IS NOT NULL AND NOT user LIKE "*$"
  | STATS
      preauth_count = COUNT(*),
      unique_users  = COUNT_DISTINCT(user),
      users         = VALUES(user),
      src_ips       = VALUES(src_ip),
      preauth_types = VALUES(preauth),
      first_auth    = MIN(@timestamp),
      last_auth     = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE preauth_count >= 1
  | KEEP agent_id, bucket, winlog.computer_name, preauth_count, unique_users, users,
      src_ips, preauth_types, first_auth, last_auth
  | SORT preauth_count DESC
  | LIMIT 200
enabled: false
tags:
  - detection.baseline
  - monitoring.kerberos-health
severity: low
risk_score: 30
nist: ["AU-2", "AU-12", "AC-7", "IA-2"]
pci_dss: ["10.2.4", "10.2.5", "8.1.6"]
gdpr: ["32.1.a", "32.2"]
mitre_attack: []
