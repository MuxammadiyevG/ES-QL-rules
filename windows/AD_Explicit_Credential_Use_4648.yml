rule_id: 64b0f7ce-5360-4000-9e3a-77c922335d2b
name_uz: "AD'da Explicit Credential bilan Kirish Urinishi (4648)"
name_ru: "Попытка входа с явными учётными данными в AD (4648)"
name_en: "AD Explicit Credential Logon Attempt (4648)"
description_uz: |
  Ushbu qoida credential access va lateral movement texnikalariga mos bo'lib, explicit credential bilan ishga tushirilgan jarayonlarni aniqlaydi.
  Hujumchi o'g'irlangan parol/hashlardan foydalanib RunAs yoki boshqa mexanizm orqali boshqa akkaunt nomidan autentikatsiya qilishi mumkin, bu AD bo'ylab tez harakatlanishga olib keladi.
  Qonuniy holatlar: admin runas ishlatishi, avtomatlashtirish skriptlari, servis integratsiyasi uchun credential delegation.
  SOC triage bosqichlari:
  - `actor`, `target_user` va jarayon kontekstini aniqlang.
  - Ushbu kirish usuli ruxsat etilgan operational jarayon ekanini ticket orqali tekshiring.
  - `src_ip` va host manbasini, ayniqsa noodatiy endpointlarni tekshiring.
  - Target akkauntning guruh a'zoligi va imtiyozlarini ko'rib chiqing.
  - Tasdiqlanmasa credentiallarni rotatsiya qiling, sessiyalarni yoping va komprometatsiya indikatorlarini chuqur qidiring.
description_ru: |
  Это правило соответствует техникам получения учётных данных и горизонтального перемещения и обнаруживает процессы, запущенные с явными учётными данными.
  Атакующий может использовать украденные пароли/хеши и аутентифицироваться от имени другой учётной записи через RunAs или иной механизм, что приводит к быстрому перемещению по AD.
  Легитимные случаи: использование runas администратором, скрипты автоматизации, credential delegation для интеграции сервисов.
  Шаги SOC triage:
  - Определите `actor`, `target_user` и контекст процесса.
  - Проверьте по тикету, что этот способ входа является разрешённым операционным процессом.
  - Проверьте источник `src_ip` и хост, особенно нетипичные endpoint'ы.
  - Рассмотрите членство целевой учётной записи в группах и её привилегии.
  - Если не подтверждено, выполните ротацию учётных данных, завершите сессии и проведите глубокий поиск индикаторов компрометации.
description_en: |
  This rule matches credential access and lateral movement techniques and detects processes launched with explicit credentials.
  An attacker may use stolen passwords/hashes to authenticate as another account via RunAs or another mechanism, which leads to fast movement across AD.
  Legitimate cases: an admin using runas, automation scripts, credential delegation for service integration.
  SOC triage steps:
  - Identify the `actor`, `target_user` and the process context.
  - Verify via ticket that this logon method is an approved operational process.
  - Check the `src_ip` and host source, especially unusual endpoints.
  - Review the target account's group membership and privileges.
  - If not confirmed, rotate the credentials, close the sessions and hunt deeply for indicators of compromise.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | EVAL hostn = winlog.computer_name
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.SubjectUserName)
  | EVAL target_user = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.SamAccountName)
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, winlog.event_data.IpAddress)
  | EVAL proc = COALESCE(winlog.event_data.ProcessName, winlog.event_data.ProcessName, "")
  // host-filtri olib tashlandi - barcha hostlarda ishlaydi (DC-only kerak bolsa qolda yoqing)
  | WHERE event.code == "4648"
  | WHERE actor IS NOT NULL
  | WHERE NOT actor LIKE "*$"
  | STATS event_count = COUNT(*) BY agent_id, hostn, actor, target_user, src_ip, proc
  | WHERE event_count >= 2
  | EVAL dyn_risk = CASE(TO_LOWER(target_user) RLIKE "^(administrator|krbtgt|svc_.*|backup_.*|sqlsvc.*)$", 92, event_count >= 5, 88, 81)
  | KEEP agent_id, hostn, actor, target_user, src_ip, proc, event_count, dyn_risk
  | SORT dyn_risk DESC, event_count DESC
  | LIMIT 200
enabled: false
tags:
  - AD
  - Authentication
  - Credential Access
severity: high
risk_score: 81
references:
  - "https://attack.mitre.org/techniques/T1550/"
mitre_attack:
  TA0008:
    T1550: [T1550.002]
nist: ["AU-2", "AU-12", "AC-7", "IA-2"]
pci_dss: ["10.2.4", "10.2.5", "8.1.6"]
gdpr: ["32.1.a", "32.2"]
