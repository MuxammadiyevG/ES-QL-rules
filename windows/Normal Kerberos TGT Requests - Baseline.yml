rule_id: a9320141-449c-46fc-a81c-7c7a37ee75f7
name_uz: "Normal Kerberos TGT so'rovlari - Baseline"
name_ru: "Нормальные запросы TGT Kerberos - Baseline"
name_en: "Normal Kerberos TGT Requests - Baseline"
description_uz: |
  Baseline/monitoring qoidasi: muvaffaqiyatli TGT (4768) so'rovlarini foydalanuvchi va
  shifrlash turi bo'yicha yig'adi. Kerberos autentikatsiyasi uchun normal darajani
  belgilash maqsadida (alert emas, kontekst).
description_ru: |
  Правило baseline/мониторинга: агрегирует успешные запросы TGT (4768) по пользователю и
  типу шифрования. Служит для определения нормального уровня аутентификации Kerberos
  (не алерт, контекст).
description_en: |
  Baseline/monitoring rule: aggregates successful TGT (4768) requests by user and
  encryption type. Intended to establish the normal level for Kerberos authentication
  (not an alert, context).
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4768"
  | EVAL user   = winlog.event_data.TargetUserName
  | EVAL status = COALESCE(winlog.event_data.Status, "-")
  | EVAL enc    = COALESCE(winlog.event_data.TicketEncryptionType, "-")
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, "-")
  | EVAL encryption_name = CASE(
      enc == "0x12", "AES256",
      enc == "0x11", "AES128",
      enc == "0x17", "RC4-HMAC",
      enc == "0x18", "RC4-HMAC-EXP",
      "Other")
  | WHERE status == "0x0"
  | WHERE user IS NOT NULL AND NOT user LIKE "*$"
  | STATS
      tgt_requests  = COUNT(*),
      unique_users  = COUNT_DISTINCT(user),
      users         = VALUES(user),
      src_ips       = VALUES(src_ip),
      encryption_types = VALUES(encryption_name),
      first_request = MIN(@timestamp),
      last_request  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE tgt_requests >= 1
  | KEEP agent_id, bucket, winlog.computer_name, tgt_requests, unique_users, users,
      src_ips, encryption_types, first_request, last_request
  | SORT tgt_requests DESC
  | LIMIT 200
enabled: false
tags:
  - detection.baseline
  - monitoring.kerberos
severity: low
risk_score: 30
mitre_attack:
  TA0001:
    T1078: []
nist: ["AU-2", "AU-12", "AC-7", "IA-2"]
pci_dss: ["10.2.4", "10.2.5", "8.1.6"]
gdpr: ["32.1.a", "32.2"]
