rule_id: c9baea88-0f0a-479b-8805-ecce7fe4632d
name_uz: "Foydalanuvchi logoff hodisalari - Sessiyani kuzatish"
name_ru: "События выхода пользователей - отслеживание сессий"
name_en: "User Logoff Events - Session Tracking"
description_uz: |
  Baseline/monitoring qoidasi: foydalanuvchi logoff (4634, 4647) hodisalarini yig'adi. 4634/4647
  da Subject yo'q — foydalanuvchi `TargetUserName` da bo'ladi. Sessiya davomiyligi va xulqini
  kuzatish uchun (alert emas, kontekst).
description_ru: |
  Правило baseline/мониторинга: собирает события выхода пользователя (4634, 4647). В 4634/4647
  нет Subject — пользователь находится в `TargetUserName`. Для отслеживания длительности сессии и
  поведения (не алерт, а контекст).
description_en: |
  Baseline/monitoring rule: collects user logoff (4634, 4647) events. In 4634/4647
  there is no Subject — the user is in `TargetUserName`. For tracking session duration and
  behavior (not an alert, but context).
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code IN ("4634", "4647")
  | EVAL target_user = winlog.event_data.TargetUserName
  | EVAL logon_id    = COALESCE(winlog.event_data.TargetLogonId, "-")
  | EVAL logon_type  = COALESCE(winlog.event_data.LogonType, "-")
  | EVAL logon_type_name = CASE(
      logon_type == "2", "Interactive",
      logon_type == "3", "Network",
      logon_type == "10", "RemoteInteractive",
      "Other")
  | WHERE target_user IS NOT NULL AND NOT target_user LIKE "*$"
  | WHERE NOT TO_LOWER(target_user) RLIKE "(system|anonymous logon|dwm-.*|umfd-.*)"
  | STATS
      logoff_count = COUNT(*),
      unique_users = COUNT_DISTINCT(target_user),
      users = VALUES(target_user),
      logon_types = VALUES(logon_type_name),
      first_logoff = MIN(@timestamp),
      last_logoff  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE logoff_count >= 1
  | KEEP agent_id, bucket, winlog.computer_name, logoff_count, unique_users, users,
      logon_types, first_logoff, last_logoff
  | SORT logoff_count DESC
  | LIMIT 200
enabled: false
tags:
  - detection.baseline
  - monitoring.session-tracking
severity: low
risk_score: 30
mitre_attack:
  TA0001:
    T1078: []
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
