rule_id: 5ee93082-005c-46eb-9827-700f37559f3d
#//RULE-NIST-14 — Software Installation Without Authorization (NIST CM-7, CM-11)
#//Control Family: CM (Configuration Management)
#//Objective: Detect installation of unauthorized software packages
#//Threat scenario: User installs prohibited software (hacking tools, P2P, unauthorized remote access)
#//Data sources: Windows MSI install events, Linux package manager logs
#//ECS fields used: event.action, process.name, process.command_line, file.path
#//Field validation: Verify all ECS fields exist in your indices before enabling
#//Tuning notes: Requires approved software catalog, allowlist enterprise deployment tools

name_uz: "Ruxsatsiz dasturiy ta'minot o'rnatilishi"
name_ru: "Неавторизованная установка программного обеспечения"
name_en: "Unauthorized Software Installation"
description_uz: |
  Dasturiy ta'minot o'rnatuvchilari yoki paket menejerlarining agent_id bo'yicha, administrativ bo'lmagan foydalanuvchilar tomonidan ishga tushirilishini aniqlaydi.
  MSI o'rnatuvchilar, apt/yum/dnf paket o'rnatishlari yoki bevosita bajariluvchi fayl yuklab olishlari siyosat buzilishini bildiradi.
  Boshqariladigan deployment tizimlaridan (SCCM, Intune) tashqarida foydalanuvchi tomonidan boshlangan o'rnatishlarga e'tibor bering.
  False positive: ruxsat etilgan self-service dasturiy ta'minot portallari, dasturchi ish stansiyalari, admin texnik xizmati.
  Triage: foydalanuvchida dasturiy ta'minot o'rnatish imtiyozi bor-yo'qligini tasdiqlang, dasturiy ta'minotni tasdiqlangan katalog bilan solishtiring, 
  ma'lum zararli dasturiy ta'minot imzolarini ko'rib chiqing.
description_ru: |
  Выявляет запуск установщиков ПО или пакетных менеджеров по agent_id пользователями без административных прав.
  Установщики MSI, установка пакетов apt/yum/dnf или прямая загрузка исполняемых файлов указывают на нарушение политики.
  Обратите внимание на инициированные пользователем установки вне управляемых систем развёртывания (SCCM, Intune).
  Ложные срабатывания: авторизованные self-service порталы ПО, рабочие станции разработчиков, обслуживание администраторами.
  Triage: проверьте, есть ли у пользователя привилегии на установку ПО, сверьте ПО с утверждённым каталогом, 
  проверьте наличие известных сигнатур вредоносного ПО.
description_en: |
  Detects execution of software installers or package managers by agent_id, non-administrative users.
  MSI installers, apt/yum/dnf package installations, or direct executable downloads indicate policy violation.
  Focus on user-initiated installs outside of managed deployment systems (SCCM, Intune).
  False positives: Authorized self-service software portals, developer workstations, admin maintenance.
  Triage: Verify if user has software install privileges, check software against approved catalog, 
  review for known malicious software signatures.
type: esql
params: '{}'
schedule_interval: 15m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp > NOW() - 15 minutes
    AND (
      (
        winlog.channel == "Microsoft-Windows-Sysmon/Operational"
        AND event.code == "1"
        AND (
          TO_LOWER(winlog.event_data.Image) RLIKE ".*(msiexec|setup|install).*"
          OR TO_LOWER(winlog.event_data.CommandLine) RLIKE ".*(msiexec|setup|install).*"
        )
        AND NOT TO_LOWER(winlog.event_data.Image) RLIKE ".*(trustedinstaller|svchost|edgeupdate).*"
      )
      OR event.code IN ("11707", "1033")
    )
  | WHERE winlog.event_data.User IS NULL OR (
      NOT TO_LOWER(winlog.event_data.User) RLIKE ".*(admin|nt authority|system|trustedinstaller|sccm|intune).*"
    )
  | EVAL install_name = COALESCE(winlog.event_data.Image, winlog.event_data.param1, "unknown")
  | EVAL user_name = COALESCE(winlog.event_data.User, winlog.event_data.SubjectUserName, "unknown")
  | EVAL install_method = CASE(
      TO_LOWER(COALESCE(winlog.event_data.Image, "")) RLIKE ".*msiexec.*", "Windows-MSI",
      event.code IN ("11707", "1033"), "Windows-MSI",
      "Generic-Installer"
    )
  | EVAL suspicious_software = CASE(
      TO_LOWER(COALESCE(winlog.event_data.CommandLine, winlog.event_data.param1, "")) RLIKE ".*(teamviewer|anydesk|vnc|ngrok|tor|metasploit|mimikatz).*", true,
      false
    )
  | STATS
      install_count = COUNT(*),
      unique_installers = COUNT_DISTINCT(install_name),
      installed_software = VALUES(install_name),
      suspicious_count = SUM(CASE(suspicious_software == true, 1, 0))
    BY agent_id, host.name, user_name, install_method, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE install_count >= 1
  | EVAL risk_score = (install_count * 20) + (suspicious_count * 50)
  | WHERE risk_score >= 20
  | KEEP agent_id, bucket, host.name, user_name, install_method, install_count, installed_software, suspicious_count, risk_score
  | SORT risk_score DESC
enabled: false
tags:
  - nist_800_53
  - control_CM-7
  - control_CM-11
  - family_CM
  - execution
  - policy_violation
severity: medium
risk_score: 58
references:
  - "NIST SP 800-53 Rev.5 CM-11: User-Installed Software"
  - "MITRE ATT&CK T1072: Software Deployment Tools"
nist: ["CM-7", "CM-11"]
pci_dss: ["2.2.4"]
mitre_attack:
  TA0002:
    T1072: []