rule_id: b81f2f20-e0ba-4c45-91c9-dfb3caa07e16
name_uz: "GDPR Art.25(1) - agent_id, dizayn orqali ma'lumotlar himoyasi nazoratlarining ishlamasligi"
name_ru: "GDPR Art.25(1) - Сбой средств контроля защиты данных по agent_id, на этапе проектирования"
name_en: "GDPR Art.25(1) - Data Protection by agent_id, Design Controls Failure"
description_uz: |
  agent_id, GDPR 25(1)-moddasi talab qiladigan texnik data-protection-by-design nazoratlarining
  ishlamasligi yoki yo'qligini aniqlaydi; ushbu modda ishlov berishni loyihalash paytida ma'lumotlar himoyasi
  tamoyillarini samarali amalga oshirish uchun tegishli texnik choralarni majburiy qiladi.
  Aniqrog'i, quyidagilar monitoring qilinadi: (1) audit logging bo'shliqlari - 30 daqiqadan ortiq log yubormayotgan hostlar,
  (2) nol hodisa generatsiya qilayotgan firewall/xavfsizlik nazoratlari (silent failure),
  (3) kritik tizimlarda kutilgan autentifikatsiya hodisalarining yo'qligi.
  Xavfsizlik hodisalarini yuborishni to'xtatgan hostda nazoratlar o'chirilgan yoki host komprometatsiya qilingan bo'lishi mumkin.
  Trigger: 30+ daqiqalik oynada nol xavfsizlik hodisasiga ega bo'lgan har qanday monitoring qilinayotgan host.
  False positive: host qayta yuklanishlari, agent yangilanishlari, rejalashtirilgan maintenance oynalari.
  Triage: Fleet'da agent holatini tekshiring, host mavjudligini tekshiring, maintenance rejalashtirilganini
  tasdiqlang, rejalashtirilmagan bo'lsa eskalatsiya qiling - hujumchi xavfsizlik nazoratlarini o'chirayotgan bo'lishi mumkin.
description_ru: |
  Выявляет сбои или отсутствие технических средств контроля data-protection-by-design, требуемых
  agent_id, статьёй 25(1) GDPR, которая предписывает надлежащие технические меры для эффективной реализации
  принципов защиты данных на этапе проектирования обработки.
  Конкретно отслеживается: (1) пробелы в audit logging - хосты, не отправляющие логи более 30 мин,
  (2) firewall/средства безопасности, генерирующие ноль событий (silent failure),
  (3) отсутствие ожидаемых событий аутентификации на критичных системах.
  У хоста, переставшего отправлять события безопасности, средства контроля могут быть отключены, либо он скомпрометирован.
  Trigger: любой отслеживаемый хост с нулём событий безопасности в окне 30+ минут.
  False positives: перезагрузки хостов, обновления агентов, плановые окна обслуживания.
  Triage: проверьте состояние агента в Fleet, проверьте доступность хоста, подтвердите, было ли обслуживание
  запланировано, эскалируйте при незапланированном - возможно, злоумышленник отключает средства безопасности.
description_en: |
  Detects failures or absence of technical data-protection-by-design controls required
  by agent_id, GDPR Article 25(1), which mandates appropriate technical measures to implement
  data protection principles effectively at the time of processing design.
  Specifically monitors: (1) audit logging gaps - hosts not sending logs for >30 min,
  (2) firewall/security controls generating zero events (silent failure),
  (3) absence of expected authentication events on critical systems.
  A host that stops sending security events may have its controls disabled or compromised.
  Trigger: Any monitored host with zero security events for 30+ minute window.
  False positives: Host reboots, agent upgrades, planned maintenance windows.
  Triage: Verify agent health in Fleet, check if host is reachable, confirm if maintenance
  was scheduled, escalate if unplanned - potential attacker disabling security controls.
type: esql
params: '{}'
schedule_interval: 30m
index:
  - logs-winlog*
  - logs-updive.audit*
query_language: esql
query: |
  FROM logs-winlog*, logs-updive.audit*
  | WHERE @timestamp >= NOW() - 2 hours
  | STATS
      event_count          = COUNT(*),
      last_seen            = MAX(@timestamp),
      first_seen           = MIN(@timestamp),
      event_types          = COUNT_DISTINCT(event.code),
      datasets_reporting   = COUNT_DISTINCT(event.dataset)
    BY agent_id, host.name,
       bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE event_count < 5
  | EVAL control_status = CASE(
      event_count == 0,                      "no_events_received",
      event_count < 5 AND event_types <= 1,  "minimal_coverage_anomaly",
      "sparse_event_coverage"
    )
  | EVAL gdpr_implication = CASE(
      control_status == "no_events_received",    "Art.25 VIOLATION - no evidence of technical controls operating",
      "Art.25 NOTICE - reduced control visibility requires investigation"
    )
  | EVAL severity_level = CASE(
      control_status == "no_events_received",    "critical",
      control_status == "minimal_coverage_anomaly", "medium",
      "low"
    )
  | EVAL risk_score = CASE(
      control_status == "no_events_received",    95,
      control_status == "minimal_coverage_anomaly", 50,
      30
    )
  | KEEP agent_id, bucket, host.name, event_count, last_seen,
         event_types, datasets_reporting,
         control_status, gdpr_implication, severity_level, risk_score
  | SORT risk_score DESC
enabled: false
tags:
  - gdpr
  - data_protection_by_design
  - control_monitoring
  - log_gap
severity: high
risk_score: 75
references:
  - "GDPR Article 25(1): Data protection by agent_id, design - implement appropriate technical measures"
  - "GDPR Article 25(2): Data protection by default"
  - "GDPR Article 32(1)(d): Process for regularly testing and evaluating effectiveness of measures"
gdpr: ["25.1", "25.2", "32.1.d", "30.1.g"]
nist: ["AU-5", "CA-7", "SI-4"]
pci_dss: ["10.5", "10.7"]
mitre_attack:
  TA0005:
    T1562: ["T1562.001", "T1562.002"]