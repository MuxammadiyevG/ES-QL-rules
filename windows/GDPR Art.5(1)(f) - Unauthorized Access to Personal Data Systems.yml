rule_id: 2558a8a5-490a-4191-9d9d-2f88514ca1cb
name_uz: "GDPR Art.5(1)(f) - Shaxsiy ma'lumotlar tizimlariga ruxsatsiz kirish"
name_ru: "GDPR Art.5(1)(f) - Несанкционированный доступ к системам персональных данных"
name_en: "GDPR Art.5(1)(f) - Unauthorized Access to Personal Data Systems"
description_uz: |
  Shaxsiy ma'lumotlarni qayta ishlaydigan tizimlarga ruxsatsiz yoki anomal kirish urinishlarini aniqlaydi,
  bu bevosita GDPR 5(1)(f)-moddasini buzadi; ushbu modda ma'lumotlar tegishli xavfsizlik bilan, jumladan
  ruxsatsiz yoki noqonuniy qayta ishlashdan himoyalangan holda qayta ishlanishini talab qiladi.
  Ham Windows (Event 4625), ham Linux (auditd) muvaffaqiyatsiz autentifikatsiya hodisalarini
  va ulardan keyingi, akkaunt kompromatatsiyasidan darak berishi mumkin bo'lgan muvaffaqiyatli kirishlarni kuzatadi.
  Trigger: >10 muvaffaqiyatsiz urinish, so'ngra agent_id, 10 daqiqa ichida o'sha manbadan muvaffaqiyat
  (potensial muvaffaqiyatli brute force), yoki bitta IP'dan bir nechta host bo'ylab >30 muvaffaqiyatsizlik.
  False positive: Noto'g'ri sozlangan servis akkauntlari, parol reset'idan keyingi sinxronizatsiya muammolari.
  Triage: Muvaffaqiyatli kirish muvaffaqiyatsizliklardan keyin bo'lganini tekshiring (kompromatatsiya belgisi),
  source IP geolokatsiyasini tekshiring, akkaunt qaysi ma'lumotlarga kirish huquqiga ega ekanini ko'rib chiqing,
  kirishdan keyin shaxsiy ma'lumotlarga murojaat qilinganini baholang, Art.33 buzilish baholashini boshlang.
description_ru: |
  Обнаруживает несанкционированные или аномальные попытки доступа к системам, обрабатывающим персональные данные,
  что напрямую нарушает статью 5(1)(f) GDPR, требующую обработки данных с надлежащей
  безопасностью, включая защиту от несанкционированной или незаконной обработки.
  Отслеживает события неудачной аутентификации как в Windows (Event 4625), так и в Linux (auditd)
  в сочетании с последующими успешными входами, которые могут указывать на компрометацию учётной записи.
  Триггер: >10 неудачных попыток, за которыми следует agent_id, успех с того же источника в течение 10 минут
  (потенциально успешный перебор паролей (brute force)), или >30 неудач с одного IP на нескольких хостах.
  Ложные срабатывания: Неверно настроенные служебные учётные записи, проблемы синхронизации паролей после сброса.
  Разбор: Проверьте, был ли успешный вход после неудач (индикатор компрометации),
  проверьте геолокацию source IP, изучите, к каким данным имеет доступ учётная запись,
  оцените, был ли получен доступ к персональным данным после входа, инициируйте оценку утечки по Art.33.
description_en: |
  Detects unauthorized or anomalous access attempts against systems that process personal data,
  directly violating GDPR Article 5(1)(f) which requires data to be processed with appropriate
  security including protection against unauthorised or unlawful processing.
  Monitors both Windows (Event 4625) and Linux (auditd) failed authentication events
  combined with subsequent successful logins that may indicate account compromise.
  Trigger: >10 failed attempts followed by agent_id, a success from same source within 10 minutes
  (potential successful brute force), or >30 failures from single IP across multiple hosts.
  False positives: Misconfigured service accounts, password sync issues after resets.
  Triage: Check if the successful login came after failures (compromise indicator),
  verify source IP geolocation, review what data the account has access to,
  assess if personal data was accessed post-login, initiate Art.33 breach assessment.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-winlog*
  - logs-updive.audit*
query_language: esql
query: |
  FROM logs-winlog*, logs-updive.audit*
  | WHERE event.outcome == "failure"
    AND (
      event.code == "4625"
      OR (event.dataset == "updive-audit.log" AND event.action IN ("authenticated", "logged-in"))
    )
  | EVAL effective_source_ip = COALESCE(source.ip, TO_IP(winlog.event_data.IpAddress))
  | STATS
      failed_attempts       = COUNT(*),
      unique_target_hosts   = COUNT_DISTINCT(host.name),
      unique_target_users   = COUNT_DISTINCT(user.name),
      targeted_hosts        = VALUES(host.name),
      targeted_users        = VALUES(user.name),
      source_ip_list        = VALUES(effective_source_ip),
      failure_methods       = VALUES(event.action)
    BY agent_id, effective_source_ip,
       bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE failed_attempts >= 10
  | EVAL attack_scope = CASE(
      unique_target_hosts >= 5 AND failed_attempts >= 50, "multi_host_coordinated",
      unique_target_hosts >= 3,                            "lateral_spread",
      unique_target_users >= 5,                            "user_spray",
      "single_target_brute_force"
    )
  | EVAL gdpr_risk = CASE(
      attack_scope == "multi_host_coordinated", "HIGH - potential mass personal data exposure",
      attack_scope == "lateral_spread",          "HIGH - multiple personal data systems targeted",
      attack_scope == "user_spray",              "MEDIUM - multiple data subject accounts targeted",
      "MEDIUM - unauthorized access attempt to personal data system"
    )
  | EVAL severity_level = CASE(
      failed_attempts >= 100 OR attack_scope == "multi_host_coordinated", "critical",
      failed_attempts >= 50  OR attack_scope == "lateral_spread",          "high",
      failed_attempts >= 20,                                                "medium",
      "low"
    )
  | EVAL risk_score = CASE(
      failed_attempts >= 100, 90,
      failed_attempts >= 50,  70,
      failed_attempts >= 20,  55,
      35
    )
  | KEEP agent_id, bucket, effective_source_ip, failed_attempts, unique_target_hosts,
         unique_target_users, targeted_hosts, targeted_users,
         attack_scope, gdpr_risk, severity_level, risk_score
  | SORT risk_score DESC
enabled: false
tags:
  - gdpr
  - unauthorized_access
  - personal_data_protection
  - integrity_confidentiality
severity: medium
risk_score: 55
references:
  - "GDPR Article 5(1)(f): Integrity and confidentiality principle"
  - "GDPR Article 32: Security of processing"
  - "GDPR Article 33: Notification obligation triggered on confirmed breach"
gdpr: ["5.1.f", "32.1.b", "33.1"]
nist: ["AC-7", "SI-4", "IR-4", "RA-3"]
pci_dss: []
mitre_attack:
  TA0006:
    T1110: ["T1110.003"]