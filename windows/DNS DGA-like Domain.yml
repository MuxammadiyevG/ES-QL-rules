rule_id: 3b422da1-7709-4700-9cf6-7410ea6287d6
name_uz: "DGA-ga o'xshash / yuqori entropiyali DNS domeni"
name_ru: "DNS-домен в стиле DGA / с высокой энтропией"
name_en: "DNS DGA-like / High-Entropy Domain"
description_uz: |
  Ushbu qoida DGA (Domain Generation Algorithm) uslubidagi domenlarni aniqlaydi (Sysmon 22):
  uzun, tasodifiy ko'rinadigan label (20+ alfanumerik). Malware C2'ni topish uchun shunday
  domenlar generatsiya qiladi (T1568.002). Evristik — ma'lum CDN/telemetriya chiqarilgan.
  SOC triage:
  - `domains` haqiqatan tasodifiymi? `images` qaysi jarayon? FP bo'lishi mumkin — tekshiring.
description_ru: |
  Это правило выявляет домены в стиле DGA (Domain Generation Algorithm) (Sysmon 22):
  длинные, случайно выглядящие метки (20+ буквенно-цифровых символов). Malware генерирует такие
  домены, чтобы найти свой C2 (T1568.002). Эвристика — известные CDN/телеметрия исключены.
  Триаж SOC:
  - Действительно ли `domains` случайны? Какой процесс в `images`? Возможен FP — проверьте.
description_en: |
  This rule detects DGA (Domain Generation Algorithm) style domains (Sysmon 22):
  long, random-looking labels (20+ alphanumeric characters). Malware generates such
  domains in order to find its C2 (T1568.002). Heuristic — known CDN/telemetry is excluded.
  SOC triage:
  - Are the `domains` really random? Which process is in `images`? It may be an FP — verify.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "22"
  | EVAL qn = TO_LOWER(COALESCE(winlog.event_data.QueryName, "-"))
  | EVAL img = COALESCE(winlog.event_data.Image, "-")
  | WHERE qn RLIKE ".*[a-z0-9]{20,}.*"
  | WHERE NOT qn RLIKE ".*(microsoft|windows|msftncsi|office|azure|akamai|amazonaws|cloudfront|googleusercontent|gstatic|digicert|windowsupdate|csecdc\\.uz|\\.local|sharepoint|onedrive|gvt1|fbcdn|tiktokcdn|cloudflare).*"
  | STATS
      hits = COUNT(*),
      unique_domains = COUNT_DISTINCT(qn),
      domains = VALUES(qn),
      images = VALUES(img),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = 70
  | KEEP agent_id, bucket, winlog.computer_name, hits, unique_domains, domains, images, dyn_risk, first_seen, last_seen
  | SORT unique_domains DESC, hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.command-and-control
  - attack.t1568.002
  - DNS
severity: medium
risk_score: 70
mitre_attack:
  TA0011:
    T1568: ["T1568.002"]
nist: ["SI-4", "AU-12", "SC-7"]
pci_dss: ["10.2.7", "11.4", "1.3"]
gdpr: ["32.1.a"]
