rule_id: 0150e8a4-9791-484f-ab61-a9c48ed61121
name_uz: "AD Domen Siyosatining O'zgartirilishi (4739)"
name_ru: "Изменение политики домена AD (4739)"
name_en: "AD Domain Policy Changed (4739)"
description_uz: |
  Ushbu qoida privilege escalation va defense evasion bilan bog'liq bo'lib, domen siyosati parametrlarining o'zgarishini aniqlaydi.
  Domain policy (password, lockout, kerberos) o'zgarishi hujumchiga himoya cheklovlarini yumshatish va hisoblarni egallashni osonlashtirish imkonini beradi.
  Qonuniy holatlar: rasmiy security baseline yangilanishi, audit/compliance talabiga ko'ra policy tuning.
  SOC triage bosqichlari:
  - `actor` va ta'sirlangan policy hodisasini aniq identifikatsiya qiling.
  - Change ticket/deployment asosida policy o'zgarishining legitimligini tekshiring.
  - `src_ip` manbasi va boshqaruv hostini tekshirib, noodatiy manbani ajrating.
  - O'zgarishdan keyin imtiyozli guruhlarga ta'sir qiluvchi authentikatsiya parametrlarini tekshiring.
  - Shubhali bo'lsa policy'ni qayta tiklang, aktorni cheklang va domen bo'ylab qo'shimcha monitoringni kuchaytiring.
description_ru: |
  Это правило связано с повышением привилегий и обходом защиты и обнаруживает изменение параметров политики домена.
  Изменение domain policy (password, lockout, kerberos) позволяет атакующему ослабить защитные ограничения и упростить захват учётных записей.
  Легитимные случаи: официальное обновление security baseline, тюнинг политики по требованиям аудита/compliance.
  Шаги SOC triage:
  - Точно идентифицируйте `actor` и затронутое событие изменения политики.
  - Проверьте легитимность изменения политики на основании change ticket/deployment.
  - Проверьте источник `src_ip` и хост управления, чтобы выделить нетипичный источник.
  - После изменения проверьте параметры аутентификации, влияющие на привилегированные группы.
  - При подозрении восстановите политику, ограничьте актора и усильте дополнительный мониторинг по всему домену.
description_en: |
  This rule is related to privilege escalation and defense evasion and detects changes to domain policy parameters.
  A change to domain policy (password, lockout, kerberos) allows an attacker to loosen protective restrictions and make account takeover easier.
  Legitimate cases: an official security baseline update, policy tuning driven by audit/compliance requirements.
  SOC triage steps:
  - Precisely identify the `actor` and the affected policy event.
  - Check the legitimacy of the policy change on the basis of a change ticket/deployment.
  - Check the `src_ip` source and the management host to single out an unusual source.
  - After the change, review the authentication parameters that affect privileged groups.
  - If suspicious, restore the policy, restrict the actor and strengthen additional monitoring across the domain.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | EVAL hostn = winlog.computer_name
  | EVAL target_user = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.SamAccountName)
  | EVAL src_ip = winlog.event_data.IpAddress
  | EVAL changed = COALESCE(event.action, "")
  // SubjectUserName is absent in 4739 events; use hostn (winlog.computer_name) as the actor proxy
  | WHERE event.code == "4739"
  | STATS change_count = COUNT(*) BY agent_id, hostn, target_user, src_ip, changed
  | WHERE change_count >= 1
  | EVAL dyn_risk = CASE(change_count >= 3, 94, TO_LOWER(changed) RLIKE ".*(0|1).*", 91, 88)
  | KEEP agent_id, hostn, target_user, src_ip, changed, change_count, dyn_risk
  | SORT dyn_risk DESC, change_count DESC
  | LIMIT 200
enabled: false
tags:
  - AD
  - Policy Change
  - Privilege Escalation
severity: high
risk_score: 88
references:
  - "https://attack.mitre.org/techniques/T1484/001/"
mitre_attack:
  TA0004:
    T1484: [T1484.001]
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
