rule_id: 2cf6a561-d74d-4ddb-bb91-ef0df9550c51
name_uz: "Ko'p tizim bo'ylab tez tarmoq logonlari"
name_ru: "Быстрые сетевые входы на множество систем"
name_en: "Rapid Network Logons Across Multiple Systems"
description_uz: |
  Ushbu qoida lateral harakatni aniqlaydi: bitta akkaunt (`source_user`) bitta manbadan
  qisqa vaqtda KO'P xil hostga network logon (4624, LogonType 3) qilsa. Bu pass-the-hash,
  PsExec yoki credential bilan tarmoq bo'ylab tez tarqalish belgisidir.
  Eslatma: bu rule hostlar bo'ylab agregatsiya qiladi (agent_id bo'yicha bo'linmaydi).
  SOC triage:
  - `source_user`/`source_ip` va `target_hosts` — qaysi tizimlarga ketma-ket kirilgan?
  - `logon_rate` (host/min) odatiy emasmi?
  - Tasdiqlanmasa: akkauntni bloklang, manba hostni izolyatsiya qiling, IR.
description_ru: |
  Это правило обнаруживает горизонтальное перемещение: когда одна учётная запись (`source_user`) с одного
  источника за короткое время выполняет сетевые входы (4624, LogonType 3) на МНОГО разных хостов. Это признак
  pass-the-hash, PsExec или быстрого распространения по сети с использованием учётных данных.
  Примечание: это правило агрегирует по всем хостам (не разбивается по agent_id).
  SOC triage:
  - `source_user`/`source_ip` и `target_hosts` — к каким системам были последовательные подключения?
  - Не является ли `logon_rate` (хостов/мин) необычным?
  - Если не подтверждено: заблокируйте учётную запись, изолируйте исходный хост, IR.
description_en: |
  This rule detects lateral movement: when one account (`source_user`) from a single source performs
  network logons (4624, LogonType 3) to MANY different hosts in a short time. This is a sign of
  pass-the-hash, PsExec or fast spreading across the network with a credential.
  Note: this rule aggregates across hosts (it is not split by agent_id).
  SOC triage:
  - `source_user`/`source_ip` and `target_hosts` — which systems were accessed one after another?
  - Is `logon_rate` (hosts/min) unusual?
  - If not confirmed: block the account, isolate the source host, IR.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4624"
  | WHERE winlog.event_data.LogonType == "3"
  | EVAL source_user = winlog.event_data.TargetUserName
  | EVAL source_ip   = COALESCE(winlog.event_data.IpAddress, "-")
  | EVAL auth_package = COALESCE(winlog.event_data.AuthenticationPackageName, "-")
  | WHERE source_user IS NOT NULL AND NOT source_user LIKE "*$"
  | WHERE source_ip != "-" AND source_ip != "::1" AND source_ip != "127.0.0.1"
  | STATS
      total_logons = COUNT(*),
      unique_hosts = COUNT_DISTINCT(winlog.computer_name),
      target_hosts = VALUES(winlog.computer_name),
      auth_packages = VALUES(auth_package),
      first_logon  = MIN(@timestamp),
      last_logon   = MAX(@timestamp)
    BY source_user, source_ip, bucket = DATE_TRUNC(15 minutes, @timestamp)
  | WHERE unique_hosts >= 5
  | EVAL span_sec = DATE_DIFF("seconds", first_logon, last_logon)
  | EVAL logon_rate = CASE(span_sec > 0, ROUND(unique_hosts * 60.0 / span_sec, 2), unique_hosts * 1.0)
  | EVAL dyn_risk = CASE(unique_hosts >= 20, 92, unique_hosts >= 10, 85, 78)
  | KEEP source_user, source_ip, bucket, total_logons, unique_hosts, logon_rate, target_hosts,
      auth_packages, dyn_risk, first_logon, last_logon
  | SORT dyn_risk DESC, unique_hosts DESC
  | LIMIT 200
enabled: true
tags:
  - attack.lateral-movement
  - attack.t1021
  - attack.t1550.002
  - detection.emerging-threats
severity: high
risk_score: 85
mitre_attack:
  TA0008:
    T1021: []
    T1550: ["T1550.002"]
nist: ["AC-17", "AU-2", "AU-12", "SI-4"]
pci_dss: ["10.2.5", "8.1.6"]
gdpr: ["32.1.a"]
