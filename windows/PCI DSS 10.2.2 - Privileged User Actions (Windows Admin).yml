rule_id: a696e6ee-f177-499d-b970-fb3f682e110f
name_uz: "PCI DSS 10.2.2 - Imtiyozli foydalanuvchi harakatlari (Windows Admin)"
name_ru: "PCI DSS 10.2.2 - Действия привилегированных пользователей (Windows Admin)"
name_en: "PCI DSS 10.2.2 - Privileged User Actions (Windows Admin)"
description_uz: |
  agent_id, root yoki administrativ imtiyozlarga ega foydalanuvchilar bajargan barcha harakatlarni aniqlaydi va kuzatadi,
  PCI DSS Requirement 10.2.2 talab qilganidek.
  Windows Event 4672 (Special privileges assigned to new logon) ni kuzatadi — u
  sezgir imtiyozlarga ega akkaunt tizimga kirganda ishga tushadi - admin faoliyatining asosiy indikatori.
  Trigger: audit trail to'liqligini tekshirish uchun har qanday admin/imtiyozli logon hodisasi.
  False positive: maintenance oynalarida odatiy admin kirishlari.
  Triage: change management tiketlari bilan solishtiring, ish vaqtidan tashqarida bo'lganini tekshiring,
  imtiyozli akkauntning ushbu tizimga kirishi kutilganmi - tekshiring.
description_ru: |
  Обнаруживает и отслеживает все действия, выполняемые agent_id, пользователями с root или административными привилегиями,
  как того требует PCI DSS Requirement 10.2.2.
  Отслеживает Windows Event 4672 (Special privileges assigned to new logon), которое срабатывает
  при каждом входе учётной записи с чувствительными привилегиями - ключевой индикатор административной активности.
  Trigger: любое событие административного/привилегированного входа для проверки полноты audit trail.
  False positives: рутинные входы администраторов во время окон обслуживания.
  Triage: сопоставьте с тикетами change management, проверьте, было ли это вне рабочего времени,
  проверьте, ожидается ли вход этой привилегированной учётной записи в данную систему.
description_en: |
  Detects and tracks all actions taken by agent_id, users with root or administrative privileges
  as required by PCI DSS Requirement 10.2.2.
  Monitors Windows Event 4672 (Special privileges assigned to new logon) which fires
  whenever an account with sensitive privileges logs on - key indicator of admin activity.
  Trigger: Any admin/privileged logon event for audit trail completeness verification.
  False positives: Routine admin logins during maintenance windows.
  Triage: Cross-reference with change management tickets, verify if outside business hours,
  check if the privileged account is expected to log on to this system.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE event.code == "4672"
    AND NOT winlog.event_data.SubjectUserName LIKE "*$"
    AND NOT winlog.event_data.SubjectUserName == "SYSTEM"
    AND NOT winlog.event_data.SubjectUserName == "СИСТЕМА"
    AND NOT winlog.event_data.SubjectUserName == "LOCAL SERVICE"
    AND NOT winlog.event_data.SubjectUserName == "NETWORK SERVICE"
    AND NOT winlog.event_data.SubjectUserName LIKE "DWM-*"
    AND NOT winlog.event_data.SubjectUserName == "IUSR"
    AND NOT winlog.event_data.SubjectUserName == "defaultuser0"
    AND NOT winlog.event_data.SubjectUserName == "USER"
  | STATS
      privileged_logons    = COUNT(*),
      unique_admins        = COUNT_DISTINCT(winlog.event_data.SubjectUserName),
      admin_accounts       = VALUES(winlog.event_data.SubjectUserName),
      logon_ids            = VALUES(winlog.event_data.SubjectLogonId),
      privileges_assigned  = VALUES(winlog.event_data.PrivilegeList)
    BY agent_id, host.name,
       winlog.event_data.SubjectUserName,
       bucket = DATE_TRUNC(5 minutes, @timestamp)
  | EVAL severity_level = CASE(
      privileged_logons >= 20, "high",
      privileged_logons >= 5,  "medium",
      "info"
    )
  | EVAL risk_score = CASE(
      privileged_logons >= 20, 65,
      privileged_logons >= 5,  40,
      20
    )
  | KEEP agent_id, bucket, host.name, winlog.event_data.SubjectUserName,
         privileged_logons, unique_admins, admin_accounts,
         privileges_assigned, severity_level, risk_score
  | SORT privileged_logons DESC
enabled: false
tags:
  - pci_dss
  - privileged_access
  - audit_trail
  - windows
severity: low
risk_score: 20
references:
  - "PCI DSS v3.2.1 Requirement 10.2.2: All actions by agent_id, individuals with root or administrative privileges"
  - "https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventID=4672"
pci_dss: ["10.2.2", "10.3"]
nist: ["AC-2","AU-2","AU-12"]
gdpr: ["5.1.f", "32"]
mitre_attack:
  TA0004:
    T1078: ["T1078.002"]
  