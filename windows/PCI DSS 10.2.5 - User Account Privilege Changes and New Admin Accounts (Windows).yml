rule_id: e380ccc3-333d-458f-b1a5-569a514c92f1
name_uz: "PCI DSS 10.2.5 - Akkaunt imtiyozlari o'zgarishi va yangi admin akkauntlar (Windows)"
name_ru: "PCI DSS 10.2.5 - Изменения привилегий учётных записей и новые админ-аккаунты (Windows)"
name_en: "PCI DSS 10.2.5 - User Account Privilege Changes and New Admin Accounts (Windows)"
description_uz: |
  Windows tizimlarida yangi akkauntlar yaratilishini, imtiyozlarni oshirishni va admin guruh
  a'zoligidagi o'zgarishlarni aniqlaydi. PCI DSS Requirement 10.2.5 identifikatsiya/autentifikatsiya
  mexanizmlaridan har qanday foydalanish va ulardagi o'zgarishlarni, jumladan yangi akkauntlar yaratish
  va imtiyozlarni oshirishni loglashni talab qiladi.
  Kuzatadi: 4720 (akkaunt yaratildi), 4728/4732/4756 (xavfsizlik guruhiga qo'shildi),
  4738 (foydalanuvchi akkaunti o'zgartirildi), 4670 (ruxsatlar o'zgartirildi).
  Trigger: imtiyozli guruhlar uchun har qanday yangi akkaunt yaratilishi yoki guruh a'zoligi o'zgarishi.
  False positive: qonuniy IT provisioning jarayonlari, HR onboarding avtomatlashtirilishi.
  Triage: HR/IT tiket tizimi bilan solishtiring, o'zgarish ish vaqtidan tashqarida bo'lganini tekshiring,
  tasdiqlovchi shaxsni aniqlang, guruh a'zoligi rol talablariga mos kelishini tekshiring.
description_ru: |
  Обнаруживает создание новых учётных записей, повышение привилегий и изменения членства в
  административных группах в системах Windows. PCI DSS Requirement 10.2.5 требует логирования
  любого использования и изменения механизмов идентификации/аутентификации, включая
  создание новых учётных записей и повышение привилегий.
  Отслеживает: 4720 (учётная запись создана), 4728/4732/4756 (добавление в группу безопасности),
  4738 (учётная запись пользователя изменена), 4670 (изменены разрешения).
  Trigger: любое создание новой учётной записи или изменение членства для привилегированных групп.
  False positives: легитимные процессы IT provisioning, автоматизация HR onboarding.
  Triage: сверьтесь с системой тикетов HR/IT, проверьте, было ли изменение вне рабочего времени,
  подтвердите личность согласующего, убедитесь, что членство в группах соответствует требованиям роли.
description_en: |
  Detects creation of new accounts, privilege elevation, and changes to admin group
  membership on Windows systems. PCI DSS Requirement 10.2.5 requires logging of
  all use of and changes to identification/authentication mechanisms including
  creation of new accounts and elevation of privileges.
  Monitors: 4720 (account created), 4728/4732/4756 (added to security group),
  4738 (user account changed), 4670 (permissions changed).
  Trigger: Any new account creation or group membership change for privileged groups.
  False positives: Legitimate IT provisioning processes, HR onboarding automation.
  Triage: Verify against HR/IT ticketing system, check if change was outside business hours,
  confirm approver identity, validate group membership matches role requirements.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE event.code IN ("4720", "4728", "4732", "4756", "4738", "4670", "4722", "4724")
  | EVAL change_type = CASE(
      event.code == "4720", "new_account_created",
      event.code == "4722", "account_enabled",
      event.code == "4724", "password_reset",
      event.code == "4728", "added_to_global_security_group",
      event.code == "4732", "added_to_local_security_group",
      event.code == "4756", "added_to_universal_security_group",
      event.code == "4738", "user_account_changed",
      event.code == "4670", "permissions_changed",
      "unknown_account_change"
    )
  | STATS
      change_count        = COUNT(*),
      unique_actors       = COUNT_DISTINCT(winlog.event_data.SubjectUserName),
      unique_targets      = COUNT_DISTINCT(winlog.event_data.TargetUserName),
      actors              = VALUES(winlog.event_data.SubjectUserName),
      target_accounts     = VALUES(winlog.event_data.TargetUserName),
      groups_modified     = VALUES(winlog.event_data.TargetUserName),
      change_types        = VALUES(change_type)
    BY agent_id, host.name,
       change_type,
       bucket = DATE_TRUNC(5 minutes, @timestamp)
  | EVAL severity_level = CASE(
      change_type == "new_account_created",            "high",
      change_type IN ("added_to_global_security_group",
                       "added_to_local_security_group",
                       "added_to_universal_security_group"), "high",
      change_type == "password_reset",                 "medium",
      change_type == "account_enabled",                "medium",
      "low"
    )
  | EVAL risk_score = CASE(
      change_type == "new_account_created",     75,
      change_type LIKE "added_to*",             70,
      change_type == "password_reset",          50,
      change_type == "account_enabled",         45,
      30
    )
  | KEEP agent_id, bucket, host.name, change_type, change_count,
         unique_actors, unique_targets, actors,
         target_accounts, groups_modified,
         severity_level, risk_score
  | SORT risk_score DESC
enabled: false
tags:
  - pci_dss
  - account_management
  - privilege_escalation
  - windows
severity: high
risk_score: 70
references:
  - "PCI DSS v3.2.1 Requirement 10.2.5: Use of and changes to identification and authentication mechanisms"
  - "PCI DSS v3.2.1 Requirement 8.1.2: Control addition, deletion, and modification of user IDs"
pci_dss: ["10.2.5", "8.1.2", "8.1.3"]
nist: ["AC-2","AC-6","AU-9","CM-5"]
gdpr: ["5.1.f", "25", "32"]
mitre_attack:
  TA0003:
    T1098: []
    T1136: ["T1136.001"]
  TA0004:
    T1078: ["T1078.002"]