rule_id: 026e78d3-5cfa-4d86-8a23-0b92cb3008d3
name: Normal Kerberos Service Ticket Requests
description: |
  Baseline/monitoring qoidasi: muvaffaqiyatli TGS (4769) so'rovlarini foydalanuvchi va
  servis bo'yicha yig'adi. Kerberoasting yoki anomal TGS xulqi uchun normal darajani
  belgilash maqsadida ishlatiladi (alert emas, kontekst).
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4769"
  | EVAL requestor    = winlog.event_data.TargetUserName
  | EVAL service_name = winlog.event_data.ServiceName
  | EVAL enc          = COALESCE(winlog.event_data.TicketEncryptionType, "-")
  | EVAL status       = COALESCE(winlog.event_data.Status, "-")
  | EVAL src_ip       = COALESCE(winlog.event_data.IpAddress, "-")
  | WHERE status == "0x0"
  | WHERE requestor IS NOT NULL AND NOT requestor LIKE "*$@*"
  | WHERE service_name IS NOT NULL AND NOT service_name LIKE "*$" AND NOT TO_LOWER(service_name) RLIKE "krbtgt.*"
  | STATS
      tgs_requests    = COUNT(*),
      unique_services = COUNT_DISTINCT(service_name),
      users           = VALUES(requestor),
      services        = VALUES(service_name),
      src_ips         = VALUES(src_ip),
      encryption_types = VALUES(enc),
      first_request   = MIN(@timestamp),
      last_request    = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE tgs_requests >= 1
  | KEEP agent_id, bucket, winlog.computer_name, tgs_requests, unique_services, users,
      services, src_ips, encryption_types, first_request, last_request
  | SORT tgs_requests DESC
  | LIMIT 200
enabled: false
tags:
  - detection.baseline
  - monitoring.service-access
severity: low
risk_score: 30
nist: ["AU-2", "AU-12", "AC-7", "IA-2"]
pci_dss: ["10.2.4", "10.2.5", "8.1.6"]
gdpr: ["32.1.a", "32.2"]
mitre_attack: []
