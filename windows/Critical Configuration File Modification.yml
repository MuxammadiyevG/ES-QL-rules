rule_id: 0122fc83-fb74-44ac-ac4f-34c566128cfb
#//RULE-NIST-12 — Unauthorized System Configuration Change (NIST CM-6)
#//Control Family: CM (Configuration Management)
#//Objective: Detect modifications to critical system configuration files
#//Threat scenario: Attacker modifies security settings to weaken defenses
#//Data sources: Windows Registry changes, Linux /etc configuration file modifications
#//ECS fields used: event.action, event.original, file.path, user.name
#//Field validation: Verify all ECS fields exist in your indices before enabling
#//Tuning notes: Allowlist known configuration management tools (Ansible, Puppet), change windows

name_uz: "Muhim konfiguratsiya faylining o'zgartirilishi"
name_ru: "Изменение критичного файла конфигурации"
name_en: "Critical Configuration File Modification"
description_uz: |
  Muhim tizim konfiguratsiya fayllari va registr kalitlariga ruxsatsiz o'zgartirishlarni aniqlaydi.
  Xavfsizlik siyosati, firewall qoidalari yoki servis konfiguratsiyalarining o'zgarishi imtiyozlarni oshirishdan darak berishi mumkin.
  Windows registrida xavfsizlik sozlamalariga kiritilgan o'zgarishlar yoki Linux /etc fayllaridagi o'zgarishlar qamrab olinadi.
  False positive: qonuniy administrativ o'zgarishlar, dasturiy ta'minot yangilanishlari, avtomatlashtirilgan konfiguratsiya boshqaruvi.
  Triage: o'zgarish change ticket orqali tasdiqlanganini tekshiring, o'zgartirgan shaxsda admin imtiyozlari bor-yo'qligini tekshiring,
  o'zgartirilgan aniq konfiguratsiyani xavfsizlikka ta'siri jihatidan ko'rib chiqing.
description_ru: |
  Обнаруживает несанкционированные изменения критичных файлов конфигурации системы и ключей реестра.
  Изменения политики безопасности, правил firewall или конфигураций служб могут указывать на повышение привилегий.
  Фиксируются изменения параметров безопасности в реестре Windows или изменения файлов /etc в Linux.
  Ложные срабатывания: легитимные административные изменения, обновления ПО, автоматизированное управление конфигурацией.
  Триаж: убедитесь, что изменение согласовано через change ticket, проверьте, есть ли у изменившего права администратора,
  оцените конкретное изменённое значение конфигурации с точки зрения влияния на безопасность.
description_en: |
  Detects unauthorized changes to critical system configuration files and registry keys.
  Modifications to security policy, firewall rules, or service configurations may indicate privilege escalation.
  Windows registry changes to security settings or Linux /etc file modifications captured.
  False positives: Legitimate administrative changes, software updates, automated configuration management.
  Triage: Verify change authorized via change ticket, check if modifier has admin privileges,
  review specific configuration changed for security impact.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE event.code IN ("4663", "4670")
      AND (winlog.event_data.ObjectName LIKE "*System32*config*" OR winlog.event_data.ObjectName LIKE "*Policies*" OR winlog.event_data.ObjectName LIKE "*Services*")
  | EVAL config_type = CASE(
      TO_LOWER(winlog.event_data.ObjectName) LIKE "*system32*config*", "Windows-Registry-Hive",
      TO_LOWER(winlog.event_data.ObjectName) LIKE "*policies*", "Windows-Security-Policy",
      TO_LOWER(winlog.event_data.ObjectName) LIKE "*services*", "Windows-Service-Config",
      "Other-Critical-Config"
    )
  | EVAL hour_of_day = DATE_EXTRACT("hour_of_day", @timestamp)
  | EVAL is_after_hours = CASE(hour_of_day < 7 OR hour_of_day > 19, true, false)
  | STATS
      change_count = COUNT(*),
      unique_files = COUNT_DISTINCT(winlog.event_data.ObjectName),
      changed_configs = VALUES(winlog.event_data.ObjectName),
      modifiers = VALUES(winlog.event_data.SubjectUserName),
      after_hours_changes = SUM(CASE(is_after_hours == true, 1, 0))
    BY agent_id, host.name, config_type, bucket = DATE_TRUNC(15 minutes, @timestamp)
  | WHERE change_count >= 1
  | EVAL risk_score = change_count * 15 + after_hours_changes * 25
  | WHERE risk_score >= 15
  | KEEP agent_id, bucket, host.name, config_type, change_count, unique_files, changed_configs, modifiers, after_hours_changes, risk_score
  | SORT risk_score DESC
enabled: false
tags:
  - nist_800_53
  - control_CM-6
  - family_CM
  - defense_evasion
  - persistence
  - privilege_escalation
severity: high
risk_score: 72
references:
  - "NIST SP 800-53 Rev.5 CM-6: Configuration Settings"
  - "MITRE ATT&CK T1562: Impair Defenses"
nist: ["CM-6"]
pci_dss: ["2.2"]
mitre_attack:
  TA0005:
    T1562: []
