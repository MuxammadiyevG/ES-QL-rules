rule_id: aac8e2ae-d220-4d99-9d32-7492508af4e7
#//RULE-NIST-15 — File Integrity Monitoring Alert (NIST SI-7)
#//Control Family: SI (System and Information Integrity)
#//Objective: Detect unauthorized modifications to critical system files
#//Threat scenario: Attacker modifies system binaries to install rootkit or backdoor
#//Data sources: Windows Sysmon FileCreate (event 11) and FileCreateTime (event 2)
#//ECS fields used: winlog.event_data.TargetFilename, winlog.event_data.User, event.code
#//Field validation: Requires Sysmon configured on logs-winlog* agents
#//Tuning notes: Allowlist software update processes, patch windows

name: "Critical System File Tampering"
description: |
  Detects modifications to critical operating system binaries and libraries.
  Changes to files in System32 indicate potential rootkit or malware infection.
  Uses Sysmon FileCreate (event 11) and FileCreateTime (event 2) events.
  File creation or timestamp changes on executables are strong indicators of file replacement attacks.
  False positives: Windows updates, legitimate patching.
  Triage: Verify if modification occurred during maintenance window, check file signature,
  compare hash with known-good baseline, scan with antivirus.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
    AND event.code IN ("2", "11")
    AND @timestamp >= NOW() - 15 minutes
  | EVAL target_file_lower = TO_LOWER(winlog.event_data.TargetFilename)
  | EVAL system_criticality = CASE(
      target_file_lower RLIKE ".*(lsass|winlogon|csrss|services|kernel|bash|sudo).*", "Critical",
      target_file_lower RLIKE ".*(cmd|powershell|python|perl).*", "High",
      target_file_lower RLIKE ".*c:\\\\windows\\\\system32\\\\.*\\.(exe|dll)$", "Medium",
      NULL
    )
  | WHERE system_criticality IS NOT NULL
  | STATS
      modification_count = COUNT(*),
      unique_files = COUNT_DISTINCT(winlog.event_data.TargetFilename),
      modified_files = VALUES(winlog.event_data.TargetFilename),
      modifiers = VALUES(winlog.event_data.User)
    BY agent_id, host.name, system_criticality
    , bucket = DATE_TRUNC(15 minutes, @timestamp)
  | WHERE modification_count >= 1
  | EVAL risk_score = CASE(
      system_criticality == "Critical", modification_count * 50,
      system_criticality == "High", modification_count * 30,
      modification_count * 10
    )
  | KEEP agent_id, bucket, host.name, system_criticality, modification_count, unique_files, modified_files, modifiers, risk_score
  | SORT risk_score DESC
enabled: false
tags:
  - nist_800_53
  - control_SI-7
  - family_SI
  - defense_evasion
  - persistence
  - rootkit
severity: critical
risk_score: 88
references:
  - "NIST SP 800-53 Rev.5 SI-7: Software, Firmware, and Information Integrity"
  - "MITRE ATT&CK T1556: Modify Authentication Process"
nist: ["SI-7"]
pci_dss: ["11.5"]
mitre_attack:
  TA0005:
    T1556: []
