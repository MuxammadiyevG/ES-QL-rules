rule_id: 0fee2705-23b0-4547-87df-b100181941ee
name: PowerShell Module Logging - Suspicious Commands
description: |
  Ushbu qoida PowerShell module logging (4103, Payload/ContextInfo) ichida shubhali
  buyruq/funksiyalarni aniqlaydi: download cradle, mimikatz, AMSI bypass, reflection/shellcode.
  ScriptBlock (4104) bilan to'ldiruvchi — ba'zi faoliyat faqat module log'da ko'rinadi.
  SOC triage:
  - `payloads` da qaysi buyruq? `user`/`host` — triage qiling.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-PowerShell/Operational"
  | WHERE event.code == "4103"
  | EVAL payload = TO_LOWER(COALESCE(winlog.event_data.Payload, "-"))
  | EVAL ctx = TO_LOWER(COALESCE(winlog.event_data.ContextInfo, "-"))
  | EVAL actor = COALESCE(winlog.user.name, "-")
  | WHERE payload RLIKE ".*(downloadstring|net\\.webclient|invoke-mimikatz|amsiutils|amsiinitfailed|frombase64string|virtualalloc|createremotethread|invoke-shellcode|invoke-kerberoast|reflection\\.assembly|getprocaddress|invoke-dcsync).*"
  | EVAL sb_sample = SUBSTRING(payload, 1, 400)
  | STATS
      hits = COUNT(*),
      payloads = VALUES(sb_sample),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = 90
  | KEEP agent_id, bucket, winlog.computer_name, hits, payloads, users, dyn_risk, first_seen, last_seen
  | SORT hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.execution
  - attack.credential-access
  - attack.t1059.001
  - PowerShell
severity: high
risk_score: 90
mitre_attack:
  TA0002:
    T1059: ["T1059.001"]
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
