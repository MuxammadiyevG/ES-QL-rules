rule_id: f18f0132-cd56-4c15-95d2-93d00d48e030
name_uz: "LOLBin suiiste'moli - Download / Proxy Execution"
name_ru: "Злоупотребление LOLBin - Download / Proxy Execution"
name_en: "LOLBin Abuse - Download / Proxy Execution"
description_uz: |
  Ushbu qoida tizim ikkilik fayllarini (LOLBins) suiiste'mol qilishni aniqlaydi: certutil,
  bitsadmin, mshta, regsvr32, rundll32, installutil, msbuild — fayl yuklash yoki kod ijro
  etish uchun (T1218/T1105). Sysmon EventID 1 (CommandLine).
  SOC triage:
  - `command_lines` da URL/decode/scrobj bormi? `parent` kim ishga tushirgan?
description_ru: |
  Это правило обнаруживает злоупотребление системными бинарными файлами (LOLBins): certutil,
  bitsadmin, mshta, regsvr32, rundll32, installutil, msbuild — для загрузки файлов или выполнения
  кода (T1218/T1105). Sysmon EventID 1 (CommandLine).
  SOC triage:
  - Есть ли в `command_lines` URL/decode/scrobj? Кто запустил, `parent`?
description_en: |
  This rule detects abuse of system binaries (LOLBins): certutil,
  bitsadmin, mshta, regsvr32, rundll32, installutil, msbuild — to download files or execute
  code (T1218/T1105). Sysmon EventID 1 (CommandLine).
  SOC triage:
  - Is there a URL/decode/scrobj in `command_lines`? Who launched it, the `parent`?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "1"
  | EVAL img = TO_LOWER(COALESCE(winlog.event_data.Image, "-"))
  | EVAL cmd = TO_LOWER(COALESCE(winlog.event_data.CommandLine, "-"))
  | EVAL parent = COALESCE(winlog.event_data.ParentImage, "-")
  | EVAL actor = COALESCE(winlog.event_data.User, "-")
  | WHERE img RLIKE ".*(certutil|bitsadmin|mshta|regsvr32|rundll32|installutil|msbuild|hh).exe"
  | WHERE cmd RLIKE ".*(urlcache|-decode| -f |/transfer|scrobj|javascript:|vbscript:|http://|https://|ftp://|/i:http).*"
  | STATS
      exec_count = COUNT(*),
      command_lines = VALUES(cmd),
      parents = VALUES(parent),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE exec_count >= 1
  | EVAL dyn_risk = 88
  | KEEP agent_id, bucket, winlog.computer_name, exec_count, command_lines, parents, users, dyn_risk, first_seen, last_seen
  | SORT exec_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.defense-evasion
  - attack.execution
  - attack.t1218
  - attack.t1105
  - Sysmon
severity: high
risk_score: 88
mitre_attack:
  TA0005:
    T1218: []
  TA0011:
    T1105: []
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
