rule_id: ca1f673f-4499-4f7c-b45a-94db1ea877fb
name_uz: "Domain Controller'da AD Akkauntlarini Ommaviy Disable Qilish (4725)"
name_ru: "Всплеск отключения учётных записей AD на контроллере домена (4725)"
name_en: "AD User Account Disabled Burst on Domain Controller (4725)"
description_uz: |
  Ushbu qoida privilege escalation va defense evasion kontekstida akkauntlarni ommaviy disable qilish urinishlarini aniqlaydi.
  Hujumchi xavfsizlik yoki admin akkauntlarini disable qilib monitoringni susaytirishi, javob choralarini kechiktirishi va AD boshqaruvini qo'lga olishi mumkin.
  Qonuniy holatlar: mass offboarding, reorganizatsiya, skript orqali deprovisioning yoki audit tozalash ishlari.
  SOC triage bosqichlari:
  - `actor` kimligini va qaysi `target_user` lar ta'sirlanganini aniqlang.
  - Change ticket/deployment bilan disable amallarining rejalashtirilganligini tasdiqlang.
  - `src_ip` manzili va hostning admin jump-server ekanini tekshiring.
  - Disable qilingan akkauntlarning guruh a'zoligini (Domain Admins va boshqalar) tekshiring.
  - Noqonuniy bo'lsa o'zgarishni rollback qiling, huquqlarni cheklang va aktorni izolyatsiya qiling.
description_ru: |
  Это правило обнаруживает попытки массового отключения учётных записей в контексте повышения привилегий и обхода защиты.
  Атакующий может отключить учётные записи безопасности или администраторов, ослабив мониторинг, задержав меры реагирования и захватив управление AD.
  Легитимные случаи: массовый offboarding, реорганизация, скриптовый deprovisioning или работы по очистке аудита.
  Шаги SOC triage:
  - Определите, кто является `actor` и какие `target_user` были затронуты.
  - Подтвердите по change ticket/deployment, что отключения были запланированы.
  - Проверьте адрес `src_ip` и является ли хост административным jump-server.
  - Проверьте членство отключённых учётных записей в группах (Domain Admins и другие).
  - Если действие нелегитимно, откатите изменение, ограничьте права и изолируйте актора.
description_en: |
  This rule detects mass account disable attempts in the context of privilege escalation and defense evasion.
  An attacker may disable security or admin accounts to weaken monitoring, delay response actions and take over AD administration.
  Legitimate cases: mass offboarding, reorganization, scripted deprovisioning or audit cleanup work.
  SOC triage steps:
  - Identify who the `actor` is and which `target_user` accounts were affected.
  - Confirm via change ticket/deployment that the disable actions were planned.
  - Check the `src_ip` address and whether the host is an admin jump-server.
  - Review the group membership of the disabled accounts (Domain Admins and others).
  - If illegitimate, roll back the change, restrict the rights and isolate the actor.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | EVAL hostn = winlog.computer_name
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.SubjectUserName)
  | EVAL target_user = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.SamAccountName)
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, winlog.event_data.IpAddress)
  // host-filtri olib tashlandi - barcha hostlarda ishlaydi (DC-only kerak bolsa qolda yoqing)
  | WHERE event.code == "4725"
  | WHERE actor IS NOT NULL
  | WHERE NOT actor LIKE "*$"
  | STATS event_count = COUNT(*), unique_targets = COUNT_DISTINCT(target_user) BY agent_id, hostn, actor, src_ip
  | WHERE unique_targets >= 2
  | EVAL dyn_risk = CASE(unique_targets >= 10, 90, unique_targets >= 5, 84, 76)
  | KEEP agent_id, hostn, actor, src_ip, event_count, unique_targets, dyn_risk
  | SORT dyn_risk DESC, unique_targets DESC
  | LIMIT 200
enabled: false
tags:
  - AD
  - Account Lifecycle
  - Defense Evasion
severity: high
risk_score: 76
references:
  - "https://attack.mitre.org/techniques/T1489/"
mitre_attack:
  TA0040:
    T1489: []
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
