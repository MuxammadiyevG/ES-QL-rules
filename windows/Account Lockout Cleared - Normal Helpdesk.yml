rule_id: 8e845eba-1509-403e-a199-3096a97da1fc
name_uz: "Akkaunt blokdan chiqarildi - Normal Helpdesk"
name_ru: "Разблокировка учётной записи - Normal Helpdesk"
name_en: "Account Lockout Cleared - Normal Helpdesk"
description_uz: |
  Ushbu qoida credential access va privilege escalation texnikalariga bog'liq bo'lib, `Account Lockout Cleared - Normal Helpdesk` kontekstidagi shubhali Active Directory faoliyatini aniqlaydi.
  Bu turdagi hodisa AD muhitida hujumchiga ruxsatsiz kirishni mustahkamlash, hisoblarni egallash yoki boshqaruv huquqlarini oshirish imkonini berishi mumkinligi sababli xavfli hisoblanadi.
  Qonuniy holatlar sifatida rejalashtirilgan administrativ ishlar, change/deployment jarayonlari, IAM sinxronizatsiyasi yoki servis konfiguratsiya yangilanishlari uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `actor` va `target_user` (yoki target obyekt) ni aniq identifikatsiya qiling.
  - O'zgarish/kirish uchun tasdiqlangan change ticket yoki deployment yozuvi borligini tekshiring.
  - `src_ip` manzili, manba host va tarmoq segmentining legitimligini tekshiring.
  - Ta'sirlangan akkaunt yoki obyektning guruh a'zoligi, ayniqsa imtiyozli guruhlar bilan bog'liqligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa tezkor containment bajaring: manbani cheklang, credentiallarni yangilang va ta'sir doirasini izolyatsiya qiling.
description_ru: |
  Данное правило связано с техниками credential access и повышения привилегий и выявляет подозрительную активность Active Directory в контексте `Account Lockout Cleared - Normal Helpdesk`.
  Событие такого типа считается опасным, поскольку в среде AD оно может позволить атакующему закрепить несанкционированный доступ, захватить учётные записи или повысить административные права.
  В качестве легитимных случаев могут встречаться запланированные административные работы, процессы change/deployment, синхронизация IAM или обновления конфигурации служб.
  Этапы SOC triage:
  - Точно идентифицируйте `actor` и `target_user` (или целевой объект) в событии.
  - Проверьте наличие утверждённого change ticket или записи о развёртывании для изменения/доступа.
  - Проверьте легитимность адреса `src_ip`, исходного хоста и сетевого сегмента.
  - Проверьте членство затронутой учётной записи или объекта в группах, особенно связь с привилегированными группами.
  - При подтверждении нелегитимной активности выполните оперативный containment: ограничьте источник, обновите учётные данные и изолируйте область воздействия.
description_en: |
  This rule is related to credential access and privilege escalation techniques and detects suspicious Active Directory activity in the `Account Lockout Cleared - Normal Helpdesk` context.
  This type of event is considered dangerous because in an AD environment it may allow an attacker to consolidate unauthorized access, take over accounts or escalate administrative rights.
  Legitimate cases may include planned administrative work, change/deployment processes, IAM synchronization or service configuration updates.
  SOC triage steps:
  - Precisely identify the `actor` and `target_user` (or target object) in the event.
  - Check whether an approved change ticket or deployment record exists for the change/access.
  - Check the legitimacy of the `src_ip` address, the source host and the network segment.
  - Check the group membership of the affected account or object, especially any relation to privileged groups.
  - If illegitimate activity is confirmed, perform rapid containment: restrict the source, rotate the credentials and isolate the scope of impact.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | EVAL hostn = winlog.computer_name
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.SubjectUserName)
  | EVAL target_user = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.SamAccountName)
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, winlog.event_data.IpAddress)
  // host-filtri olib tashlandi - barcha hostlarda ishlaydi (DC-only kerak bolsa qolda yoqing)
  | WHERE NOT actor LIKE "*$"
  | WHERE event.code == "4767"
  | EVAL 
      unlocking_user = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.SubjectUserName, "Unknown"),
      target_user = COALESCE(winlog.event_data.TargetUserName, "Unknown")
  | STATS 
      unlock_count = COUNT(*),
      unique_targets = COUNT_DISTINCT(target_user),
      unlockers = VALUES(unlocking_user),
      unlocked_accounts = VALUES(target_user),
      first_unlock = MIN(@timestamp),
      last_unlock = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE unlock_count >= 1
  | KEEP agent_id, bucket, winlog.computer_name, unlock_count, unique_targets, unlockers,
      unlocked_accounts, first_unlock, last_unlock
  | SORT unlock_count DESC
  | LIMIT 200
enabled: false
tags:
  - detection.baseline
  - monitoring.helpdesk
  - detection.compliance
severity: high
risk_score: 75
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
mitre_attack: []