rule_id: ccd052a5-9edc-42fe-ae85-96ac6f81b0f1
name_uz: "Avtomatik ishga tushadigan servis to'xtatildi"
name_ru: "Остановлена служба с автоматическим запуском"
name_en: "Auto Service Stopped"
description_uz: |
  Ushbu qoida Impact texnikasiga bog'liq bo'lib, `Auto Service Stopped` kontekstida Windows serverda avtomatik ishga tushadigan servisning to'xtatilganligini aniqlaydi.
  Bu turdagi hodisa hujumchi muhim tizim servislarini o'chirish orqali xizmat ko'rsatishni buzish (DoS), monitoring tizimlarini o'chirish yoki persistence mexanizmlarini ishga tushirish maqsadida faoliyat yuritayotganligini ko'rsatishi mumkinligi sababli xavfli hisoblanadi.
  Qonuniy holatlar sifatida rejalashtirilgan maintenance, servis yangilanishi, Windows Update jarayonlari yoki administrator tomonidan bajarilgan konfiguratsiya o'zgarishlari uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `winlog.computer_name` (host) va `winlog.event_data.ServiceName` ni aniq identifikatsiya qiling.
  - Servis qanday sabab bilan to'xtatilganligini tekshiring (manual, crash, dependency failure).
  - `winlog.event_data.ServiceFileName` orqali servis fayl yo'lini tekshiring.
  - Xostda boshqa shubhali hodisalar borligini tekshiring.
  - Clear condition: 10 daqiqa ichida servis qayta ishga tushsa alert avtomatik tozalanadi.
  - Noqonuniy faoliyat tasdiqlansa tezkor containment bajaring: servisni qayta tiklang, root cause ni aniqlang va hostni tekshiring.
description_ru: |
  Это правило связано с техникой Impact и выявляет в контексте `Auto Service Stopped` остановку службы с автоматическим запуском на сервере Windows.
  Событие такого типа считается опасным, поскольку оно может указывать на то, что злоумышленник отключает важные системные службы с целью нарушения обслуживания (DoS), отключения систем мониторинга или запуска механизмов закрепления (persistence).
  В качестве легитимных случаев могут встречаться плановое обслуживание (maintenance), обновление службы, процессы Windows Update или изменения конфигурации, выполненные администратором.
  Этапы SOC-триажа:
  - Точно идентифицируйте `winlog.computer_name` (хост) и `winlog.event_data.ServiceName` в событии.
  - Проверьте, по какой причине служба была остановлена (вручную, сбой, отказ зависимости).
  - Проверьте путь к файлу службы через `winlog.event_data.ServiceFileName`.
  - Проверьте, есть ли на хосте другие подозрительные события.
  - Clear condition: если служба перезапустится в течение 10 минут, алерт очищается автоматически.
  - При подтверждении нелегитимной активности выполните оперативное сдерживание (containment): восстановите службу, определите первопричину (root cause) и проверьте хост.
description_en: |
  This rule is related to the Impact technique and detects, in the `Auto Service Stopped` context, that an automatically started service on a Windows server has been stopped.
  An event of this type is considered dangerous because it may indicate that an attacker is disabling critical system services in order to disrupt service (DoS), turn off monitoring systems, or launch persistence mechanisms.
  Legitimate cases may include planned maintenance, a service update, Windows Update processes, or configuration changes made by an administrator.
  SOC triage steps:
  - Precisely identify the `winlog.computer_name` (host) and `winlog.event_data.ServiceName` in the event.
  - Check for what reason the service was stopped (manual, crash, dependency failure).
  - Check the service file path via `winlog.event_data.ServiceFileName`.
  - Check whether there are other suspicious events on the host.
  - Clear condition: if the service restarts within 10 minutes, the alert is cleared automatically.
  - If malicious activity is confirmed, perform immediate containment: restore the service, determine the root cause, and inspect the host.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE winlog.channel == "System"
  | WHERE winlog.event_id IN ("7036", "7034", "7031")
  | WHERE winlog.event_data.param2 == "stopped"
     OR winlog.event_id IN ("7034", "7031")
  | EVAL host_name    = winlog.computer_name
  | EVAL service_name = COALESCE(winlog.event_data.ServiceName, winlog.event_data.param1)
  | EVAL service_path = COALESCE(winlog.event_data.ImagePath, winlog.event_data.param3)
  | EVAL event_state  = COALESCE(winlog.event_data.param2, "stopped")
  | EVAL exit_code    = winlog.event_data.param3
  | WHERE service_name IS NOT NULL
  | STATS
      event_count    = COUNT(*),
      host_names     = VALUES(winlog.computer_name),
      service_names  = VALUES(winlog.event_data.ServiceName),
      service_paths  = VALUES(winlog.event_data.ImagePath),
      event_ids      = VALUES(winlog.event_id),
      exit_codes     = VALUES(winlog.event_data.param3),
      last_seen      = MAX(@timestamp),
      first_seen     = MIN(@timestamp)
    BY agent_id, winlog.computer_name, winlog.event_data.ServiceName, winlog.event_data.ImagePath
  | WHERE event_count >= 1
  | EVAL
      host_name         = winlog.computer_name,
      service_name      = winlog.event_data.ServiceName,
      service_path      = winlog.event_data.ImagePath
  | KEEP
      agent_id,
      host_name,
      service_name,
      service_path,
      event_count,
      host_names,
      service_names,
      service_paths,
      event_ids,
      exit_codes,
      last_seen,
      first_seen
  | SORT last_seen DESC
enabled: false
