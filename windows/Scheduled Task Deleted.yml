rule_id: 93011f33-473f-4fc9-bc14-044d9633a143
name_uz: "Scheduled Task o'chirildi (Microsoft'niki emas)"
name_ru: "Удаление Scheduled Task (не Microsoft)"
name_en: "Scheduled Task Deleted (Non-Microsoft)"
description_uz: |
  Ushbu qoida scheduled task o'chirilishini aniqlaydi (TaskScheduler/Operational 141) —
  Microsoft tizim tasklaridan tashqari. Hujumchi o'z task'ini yoki izlarini yashirish uchun
  o'chirishi mumkin (T1053.005 / defense evasion).
  SOC triage:
  - `task_names`/`user_names` — qaysi task, kim o'chirdi? Qonuniy o'zgartirishmi?
description_ru: |
  Это правило выявляет удаление scheduled task (TaskScheduler/Operational 141) —
  кроме системных задач Microsoft. Атакующий может удалить свою задачу или скрыть следы
  таким удалением (T1053.005 / defense evasion).
  SOC triage:
  - `task_names`/`user_names` — какая задача, кто удалил? Легитимное ли это изменение?
description_en: |
  This rule detects deletion of a scheduled task (TaskScheduler/Operational 141) —
  excluding Microsoft system tasks. An attacker may delete their own task or hide their traces
  by deleting it (T1053.005 / defense evasion).
  SOC triage:
  - `task_names`/`user_names` — which task, who deleted it? Is it a legitimate change?
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-TaskScheduler/Operational"
  | WHERE event.code == "141"
  | EVAL tn = COALESCE(winlog.event_data.TaskName, "-")
  | EVAL un = COALESCE(winlog.event_data.UserName, "-")
  | WHERE NOT TO_LOWER(tn) RLIKE ".*.microsoft.windows..*"
  | STATS
      hits = COUNT(*),
      task_names = VALUES(tn),
      user_names = VALUES(un),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = 68
  | KEEP agent_id, bucket, winlog.computer_name, hits, task_names, user_names, dyn_risk, first_seen, last_seen
  | SORT hits DESC
  | LIMIT 200
enabled: false
tags:
  - attack.defense-evasion
  - attack.t1053.005
  - ScheduledTask
severity: medium
risk_score: 60
mitre_attack:
  TA0003:
    T1053: ["T1053.005"]
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
