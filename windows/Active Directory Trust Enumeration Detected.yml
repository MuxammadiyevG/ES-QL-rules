rule_id: 3846c8ab-b781-4bcd-b363-a123f0ff4424
name: Active Directory Trust Enumeration Detected
description: |
  Ushbu qoida AD discovery/recon'ni aniqlaydi: bitta MASHINA bo'lmagan akkaunt qisqa vaqtda
  juda ko'p xil AD obyektiga (4662) kirsa — bu domain/trust enumeratsiya (nltest, BloodHound,
  PowerView) belgisi. Qo'shimcha: trustedDomain klass GUID'iga kirish ham belgilanadi.
  ESLATMA: `trustedDomain` schemaIDGUID muhitingizga qarab tekshiring/sozlang.
  SOC triage:
  - `accessing_user` kim, `unique_objects` qancha? Recon tooli ishlatilganmi?
  - Tasdiqlanmasa: manba hostni tekshiring, akkauntni cheklang.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4662"
  | EVAL accessing_user = winlog.event_data.SubjectUserName
  | EVAL object_type = COALESCE(winlog.event_data.ObjectType, "-")
  | EVAL object_name = COALESCE(winlog.event_data.ObjectName, "-")
  | EVAL src_ip      = COALESCE(winlog.event_data.IpAddress, "-")
  // trustedDomain klass schemaIDGUID (muhitingizga moslab tekshiring)
  | EVAL is_trust = CASE(TO_LOWER(object_type) RLIKE ".*b8242adb-89e6-11d2-9e74-00c04fb967ec.*", 1, 0)
  // DC akkauntlari (masalan CSECLDC$) ni qo'shish: faqat "*DC$" pattern mashinalarni ruxsat bering,
  // boshqa mashina akkauntlari ($) ni chiqarib tashlaymiz
  | EVAL is_dc_account = CASE(TO_LOWER(accessing_user) LIKE "*dc$", 1, 0)
  | WHERE accessing_user IS NOT NULL AND (is_dc_account == 1 OR NOT accessing_user LIKE "*$")
  | WHERE NOT TO_LOWER(accessing_user) RLIKE "(system|local service|network service)"
  | STATS
      enum_attempts  = COUNT(*),
      unique_objects = COUNT_DISTINCT(object_name),
      trust_hits     = SUM(is_trust),
      object_types   = VALUES(object_type),
      src_ips        = VALUES(src_ip),
      first_attempt  = MIN(@timestamp),
      last_attempt   = MAX(@timestamp)
    BY agent_id, winlog.computer_name, accessing_user, bucket = DATE_TRUNC(1 hour, @timestamp)
  // Recon: ko'p obyekt (lowered from 25 to 10 for DC accounts), yoki trustedDomain'ga kirish
  | WHERE unique_objects >= 10 OR trust_hits >= 1
  | EVAL dyn_risk = CASE(trust_hits >= 1, 80, unique_objects >= 100, 78, 70)
  | KEEP agent_id, bucket, winlog.computer_name, accessing_user, enum_attempts, unique_objects,
      trust_hits, object_types, src_ips, dyn_risk, first_attempt, last_attempt
  | SORT dyn_risk DESC, unique_objects DESC
  | LIMIT 200
enabled: true
tags:
  - attack.discovery
  - attack.t1482
  - detection.reconnaissance
severity: medium
risk_score: 75
nist: ["AU-2", "AU-12", "AC-7", "IA-2"]
pci_dss: ["10.2.4", "10.2.5", "8.1.6"]
gdpr: ["32.1.a", "32.2"]
mitre_attack:
  TA0007:
    T1482: []
