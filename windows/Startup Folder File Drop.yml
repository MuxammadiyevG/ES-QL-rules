rule_id: a5d9ca5d-1815-49d6-becf-7280db721c1a
name_uz: "Startup papkasiga fayl tashlash"
name_ru: "Запись файла в папку Startup"
name_en: "Startup Folder File Drop"
description_uz: |
  Ushbu qoida Startup papkasiga fayl yozilishini aniqlaydi (Sysmon 11) — login paytida
  avtomatik ishga tushadigan persistence (T1547.001).
  SOC triage:
  - `files` qanday fayl, `images` kim yozdi? Qonuniy o'rnatishmi?
description_ru: |
  Это правило выявляет запись файла в папку Startup (Sysmon 11) — закрепление (persistence),
  автоматически запускающееся при входе в систему (T1547.001).
  SOC triage:
  - `files` какой файл, `images` кто записал? Легитимная ли это установка?
description_en: |
  This rule detects a file written to the Startup folder (Sysmon 11) — persistence that runs
  automatically at login (T1547.001).
  SOC triage:
  - `files` what file, `images` who wrote it? Is it a legitimate installation?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "11"
  | EVAL tfn = TO_LOWER(COALESCE(winlog.event_data.TargetFilename, "-"))
  | EVAL img = COALESCE(winlog.event_data.Image, "-")
  | EVAL actor = COALESCE(winlog.event_data.User, "-")
  | WHERE tfn RLIKE ".*start menu.programs.startup..*"
  | STATS
      hits = COUNT(*),
      files = VALUES(tfn),
      images = VALUES(img),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = 82
  | KEEP agent_id, bucket, winlog.computer_name, hits, files, images, users, dyn_risk, first_seen, last_seen
  | SORT hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.persistence
  - attack.t1547.001
  - File
severity: high
risk_score: 82
mitre_attack:
  TA0003:
    T1547: ["T1547.001"]
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
