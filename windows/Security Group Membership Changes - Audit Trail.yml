rule_id: f8781401-3afb-4079-8be5-df0758cc701e
name_uz: "Xavfsizlik guruhi a'zoligidagi o'zgarishlar - audit izi"
name_ru: "Изменения членства в группах безопасности - аудиторский след"
name_en: "Security Group Membership Changes - Audit Trail"
description_uz: |
  Ushbu qoida privilege escalation va persistence texnikalariga bog'liq bo'lib, `Security Group Membership Changes - Audit Trail` kontekstidagi shubhali Active Directory faoliyatini aniqlaydi.
  Bu turdagi hodisa AD muhitida hujumchiga ruxsatsiz kirishni mustahkamlash, hisoblarni egallash yoki boshqaruv huquqlarini oshirish imkonini berishi mumkinligi sababli xavfli hisoblanadi.
  Qonuniy holatlar sifatida rejalashtirilgan administrativ ishlar, change/deployment jarayonlari, IAM sinxronizatsiyasi yoki servis konfiguratsiya yangilanishlari uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `actor` va `target_user` (yoki target obyekt) ni aniq identifikatsiya qiling.
  - O'zgarish/kirish uchun tasdiqlangan change ticket yoki deployment yozuvi borligini tekshiring.
  - `src_ip` manzili, manba host va tarmoq segmentining legitimligini tekshiring.
  - Ta'sirlangan akkaunt yoki obyektning guruh a'zoligi, ayniqsa imtiyozli guruhlar bilan bog'liqligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa tezkor containment bajaring: manbani cheklang, credentiallarni yangilang va ta'sir doirasini izolyatsiya qiling.
description_ru: |
  Это правило связано с техниками повышения привилегий и закрепления (persistence) и выявляет подозрительную активность Active Directory в контексте `Security Group Membership Changes - Audit Trail`.
  Событие такого типа считается опасным, поскольку в среде AD оно может позволить атакующему закрепить несанкционированный доступ, захватить учётные записи или повысить административные права.
  В качестве легитимных случаев могут встречаться плановые административные работы, процессы change/deployment, синхронизация IAM или обновления конфигурации сервисов.
  Этапы SOC triage:
  - Точно идентифицируйте `actor` и `target_user` (или целевой объект) в событии.
  - Проверьте наличие утверждённого change ticket или записи о deployment для изменения/доступа.
  - Проверьте легитимность адреса `src_ip`, исходного хоста и сегмента сети.
  - Проверьте членство в группах затронутой учётной записи или объекта, особенно связь с привилегированными группами.
  - При подтверждении нелегитимной активности выполните оперативный containment: ограничьте источник, смените учётные данные и изолируйте зону воздействия.
description_en: |
  This rule is related to privilege escalation and persistence techniques and detects suspicious Active Directory activity in the `Security Group Membership Changes - Audit Trail` context.
  An event of this type is considered dangerous because in an AD environment it can allow an attacker to entrench unauthorized access, take over accounts or escalate administrative rights.
  Legitimate cases may include planned administrative work, change/deployment processes, IAM synchronization or service configuration updates.
  SOC triage steps:
  - Precisely identify the `actor` and `target_user` (or target object) in the event.
  - Check whether an approved change ticket or deployment record exists for the change/access.
  - Verify the legitimacy of the `src_ip` address, the source host and the network segment.
  - Check the group membership of the affected account or object, especially any association with privileged groups.
  - If illegitimate activity is confirmed, perform rapid containment: restrict the source, rotate credentials and isolate the impact scope.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | EVAL hostn = winlog.computer_name
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.SubjectUserName)
  | EVAL target_user = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.SamAccountName)
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, winlog.event_data.IpAddress)
  // host-filtri olib tashlandi - barcha hostlarda ishlaydi (DC-only kerak bolsa qolda yoqing)
  | WHERE NOT actor LIKE "*$"
  | WHERE event.code IN ("4728", "4729", "4732", "4733", "4756", "4757")
  | EVAL 
      modifier = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.SubjectUserName, "Unknown"),
      target_user = COALESCE(winlog.event_data.MemberName, winlog.event_data.TargetUserName, "Unknown"),
      group_name = COALESCE(winlog.event_data.TargetUserName, "Unknown"),
      change_type = CASE(
        event.code IN ("4728", "4732", "4756"), "Member Added",
        event.code IN ("4729", "4733", "4757"), "Member Removed",
        "Unknown"
      )
  | STATS 
      changes = COUNT(*),
      unique_groups = COUNT_DISTINCT(group_name),
      modifiers = VALUES(modifier),
      affected_users = VALUES(target_user),
      groups = VALUES(group_name),
      change_types = VALUES(change_type),
      first_change = MIN(@timestamp),
      last_change = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE changes >= 1
  | KEEP agent_id, bucket, winlog.computer_name, changes, unique_groups, modifiers,
      affected_users, groups, change_types, first_change, last_change
  | SORT changes DESC
  | LIMIT 200
enabled: false
tags:
  - detection.baseline
  - detection.compliance
  - monitoring.group-management
severity: high
risk_score: 75
mitre_attack:
  TA0003:
    T1098: []
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
