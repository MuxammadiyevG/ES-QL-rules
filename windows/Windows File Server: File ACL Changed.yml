rule_id: 0adcbc24-08dd-458d-84b9-a11873cc6a6f
name_uz: "Windows File Server: Fayl ACL O'zgartirildi"
name_ru: "Windows File Server: изменение ACL файла"
name_en: "Windows File Server: File ACL Changed"
description_uz: |
  Ushbu qoida Windows File Server share ostidagi fayl yoki papkada ACL,
  permission yoki DACL o‘zgartirilganini aniqlaydi. 4670 permission change
  hodisasi eng aniq signal hisoblanadi. 4663 dagi `WRITE_DAC` yoki `0x40000`
  accesslari permission change urinishini ko‘rsatishi mumkin.
description_ru: |
  Это правило выявляет изменение ACL, разрешений или DACL у файла или папки
  под шарой Windows File Server. Событие 4670 (permission change)
  считается наиболее точным сигналом. Доступы `WRITE_DAC` или `0x40000`
  в 4663 могут указывать на попытку permission change.
description_en: |
  This rule detects that the ACL, permissions, or DACL of a file or folder
  under a Windows File Server share has been changed. The 4670 permission change
  event is considered the most precise signal. The `WRITE_DAC` or `0x40000`
  accesses in 4663 may indicate a permission change attempt.
type: esql
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
    | WHERE @timestamp >= NOW() - 5 minute
    | WHERE winlog.channel == "Security"
      AND event.code IN ("4670", "4663")
      AND (
        winlog.event_data.ObjectType == "File"
        OR event.code == "4670"
      )
      AND (
        event.code == "4670"
        OR winlog.event_data.AccessList LIKE "*WRITE_DAC*"
        OR winlog.event_data.AccessList LIKE "*ChangePermissions*"
        OR winlog.event_data.AccessList LIKE "*Change Permissions*"
        OR winlog.event_data.AccessMask == "0x40000"
      )
    | EVAL
        file_path = winlog.event_data.ObjectName,
        user_account = CONCAT(winlog.event_data.SubjectDomainName, "\\", winlog.event_data.SubjectUserName),
        process_name = winlog.event_data.ProcessName,
        access_mask = winlog.event_data.AccessMask,
        access_list = winlog.event_data.AccessList,
        old_sd = winlog.event_data.OldSd,
        new_sd = winlog.event_data.NewSd,
        host_name = host.name
    | WHERE file_path IS NOT NULL
    | WHERE NOT file_path RLIKE "C:\\\\\\\\Windows\\\\\\\\.*"
    | WHERE NOT file_path RLIKE "C:\\\\\\\\Program Files\\\\\\\\.*"
    | WHERE NOT file_path RLIKE "C:\\\\\\\\Program Files \\\\(x86\\\\)\\\\\\\\.*"
    | KEEP
        @timestamp,
        agent_id,
        host_name,
        user_account,
        file_path,
        process_name,
        access_mask,
        access_list,
        old_sd,
        new_sd,
        event.code,
        event.action

enabled: true
tags:
  - windows
  - file-server
  - acl-change
  - permission-change
  - ntfs
severity: high
risk_score: 70
references:
  - "https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4670"
  - "https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4663"
nist: ["AC-2", "AC-3", "AU-2", "AU-6", "AU-12"]
pci_dss: ["7.1", "7.2", "10.2.1", "10.2.2", "10.2.6"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1222: ["T1222.001"]
