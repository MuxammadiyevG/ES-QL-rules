rule_id: 86ad84ea-8b12-4f56-92bd-2f7200710e7a
name_uz: "Domain Controller'da shubhali AD foydalanuvchi akkaunti o'zgarishi (4738)"
name_ru: "Подозрительное изменение учётной записи AD на контроллере домена (4738)"
name_en: "AD Suspicious User Account Change on Domain Controller (4738)"
description_uz: |
  Ushbu qoida persistence va privilege escalation faoliyatlariga tegishli bo'lib, foydalanuvchi atributlaridagi xavfli o'zgarishlarni kuzatadi.
  4738 orqali parol siyosati, UAC flaglari, SPN yoki delegatsiya parametrlaridagi manipulyatsiya aniqlanishi mumkin; bular AD'da yashirin hukmronlikka olib keladi.
  Qonuniy holatlar: helpdesk profili yangilashi, IAM platforma sync, servis akkaunt konfiguratsiyasi o'zgarishi.
  SOC triage bosqichlari:
  - O'zgarishni boshlagan `actor` va ta'sirlangan `target_user` ni aniqlang.
  - Change ticket/deployment hujjati bilan aniq mosligini tekshiring.
  - `src_ip` manbasi va boshqaruv vositasi (jump host/script runner)ni tekshiring.
  - Target akkauntning guruh a'zoligi va yangi huquq kontekstini tekshiring.
  - Shubhali bo'lsa atributni oldingi holatga qaytaring, parol/kalitlarni yangilang va komprometatsiya doirasini cheklang.
description_ru: |
  Данное правило относится к активности закрепления и повышения привилегий и отслеживает опасные изменения атрибутов пользователя.
  Через 4738 могут быть выявлены манипуляции с парольной политикой, флагами UAC, SPN или параметрами делегирования; они ведут к скрытому доминированию в AD.
  Легитимные случаи: обновление профиля службой helpdesk, синхронизация IAM-платформы, изменение конфигурации служебной учётной записи.
  Этапы SOC triage:
  - Определите `actor`, инициировавшего изменение, и затронутого `target_user`.
  - Проверьте точное соответствие change ticket/документу развёртывания.
  - Проверьте источник `src_ip` и средство управления (jump host/script runner).
  - Проверьте членство целевой учётной записи в группах и контекст новых прав.
  - При подозрении верните атрибут в прежнее состояние, обновите пароли/ключи и ограничьте область компрометации.
description_en: |
  This rule relates to persistence and privilege escalation activity and monitors dangerous changes to user attributes.
  Through 4738, manipulation of the password policy, UAC flags, SPN or delegation parameters can be detected; these lead to covert dominance in AD.
  Legitimate cases: a helpdesk profile update, IAM platform sync, a service account configuration change.
  SOC triage steps:
  - Identify the `actor` who initiated the change and the affected `target_user`.
  - Check that it exactly matches a change ticket/deployment document.
  - Check the `src_ip` source and the management tool (jump host/script runner).
  - Check the target account's group membership and the context of the new privileges.
  - If suspicious, revert the attribute to its previous state, rotate passwords/keys and limit the scope of compromise.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | EVAL hostn = winlog.computer_name
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.SubjectUserName)
  | EVAL target_user = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.SamAccountName)
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, winlog.event_data.IpAddress)
  | EVAL changed_attrs = CONCAT(COALESCE(winlog.event_data.NewUacValue, ""), " ", COALESCE(winlog.event_data.ServicePrincipalNames, ""), " ", COALESCE(winlog.event_data.AllowedToDelegateTo, ""), " ", COALESCE(winlog.event_data.SidHistory, ""), " ", COALESCE(winlog.event_data.ScriptPath, ""))
  // host-filtri olib tashlandi - barcha hostlarda ishlaydi (DC-only kerak bolsa qolda yoqing)
  | WHERE event.code == "4738"
  | WHERE actor IS NOT NULL
  | WHERE NOT actor LIKE "*$"
  | WHERE actor != "ANONYMOUS LOGON" AND actor != "АНОНИМНЫЙ ВХОД"
  | STATS event_count = COUNT(*) BY agent_id, hostn, actor, target_user, src_ip, changed_attrs
  | WHERE event_count >= 1
  | EVAL dyn_risk = CASE(TO_LOWER(changed_attrs) RLIKE "(spn|script|delegat|trustedfor|admincount)", 90, event_count >= 3, 82, 74)
  | KEEP agent_id, hostn, actor, target_user, src_ip, changed_attrs, event_count, dyn_risk
  | SORT dyn_risk DESC, event_count DESC
  | LIMIT 200
enabled: false
tags:
  - AD
  - Account Lifecycle
  - Privilege Escalation
severity: high
risk_score: 74
references:
  - "https://attack.mitre.org/techniques/T1098/"
mitre_attack:
  TA0003:
    T1098: []
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
