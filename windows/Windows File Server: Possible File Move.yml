rule_id: d7d37ee5-97e6-4698-bb1d-5146e199b2d9
name: "Windows File Server: Possible File Move"
description: |
  Ushbu qoida Windows File Server share ichida fayl ko‘chirilgan bo‘lishi
  mumkin bo‘lgan holatlarni aniqlaydi. Move odatda source path delete/delete
  request va destination path write/create ko‘rinishida loglanadi.
type: esql
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
    | WHERE @timestamp >= NOW() - 5 minute
    | WHERE winlog.channel == "Security"
      AND event.code IN ("5145", "4663", "4660")
    | EVAL
        raw_path = COALESCE(winlog.event_data.RelativeTargetName, winlog.event_data.ObjectName),
        user_account = CONCAT(winlog.event_data.SubjectDomainName, "\\", winlog.event_data.SubjectUserName),
        file_action = CASE(
          event.code == "4660", "source_deleted",
          winlog.event_data.AccessMask == "0x10000", "source_delete_requested",
          winlog.event_data.AccessList LIKE "*DELETE*", "source_delete_requested",
          winlog.event_data.AccessList LIKE "*WriteData*", "destination_written",
          winlog.event_data.AccessList LIKE "*AddFile*", "destination_written",
          winlog.event_data.AccessList LIKE "*AppendData*", "destination_written",
          "other"
        )
    | WHERE file_action != "other"
    | WHERE raw_path IS NOT NULL
    | WHERE winlog.event_data.ShareName IS NULL OR NOT winlog.event_data.ShareName RLIKE ".*SYSVOL$"
    | WHERE winlog.event_data.ShareName IS NULL OR NOT winlog.event_data.ShareName RLIKE ".*NETLOGON$"
    | WHERE winlog.event_data.ShareName IS NULL OR NOT winlog.event_data.ShareName RLIKE ".*IPC\\$$"
    | WHERE NOT winlog.event_data.SubjectUserName LIKE "*$"
    | STATS
        event_count = COUNT(),
        actions = VALUES(file_action),
        paths = VALUES(raw_path),
        share_names = VALUES(winlog.event_data.ShareName),
        src_ips = VALUES(winlog.event_data.IpAddress)
      BY host.name, user_account, BUCKET(@timestamp, 3 minutes)
    | WHERE event_count >= 2
    | KEEP
        host.name,
        user_account,
        event_count,
        actions,
        paths,
        share_names,
        src_ips

enabled: true
tags:
  - windows
  - file-server
  - smb
  - file-move
  - correlation
severity: medium
risk_score: 45
references:
  - "https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-5145"
  - "https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4663"
nist: ["AC-2", "AU-2", "AU-6", "AU-12"]
pci_dss: ["10.2.1", "10.2.2", "10.2.6"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1070: ["T1070.004"]
