rule_id: 31ab3b2a-1796-4d46-811c-db769d93ca4b
name_uz: "Kerberos tiketini yangilash - Normal operatsiyalar"
name_ru: "Обновление билетов Kerberos - Нормальные операции"
name_en: "Kerberos Ticket Renewal - Normal Operations"
description_uz: |
  Baseline/monitoring qoidasi: TGS renewal (4770) hodisalarini foydalanuvchi va servis
  bo'yicha yig'adi. Ticket lifecycle'ning normal darajasini kuzatish uchun (alert emas).
description_ru: |
  Baseline/мониторинговое правило: агрегирует события TGS renewal (4770) по пользователю
  и сервису. Служит для наблюдения нормального уровня ticket lifecycle (не алерт).
description_en: |
  Baseline/monitoring rule: aggregates TGS renewal (4770) events by user and
  service. Used to observe the normal level of the ticket lifecycle (not an alert).
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4770"
  | EVAL user         = winlog.event_data.TargetUserName
  | EVAL service_name = COALESCE(winlog.event_data.ServiceName, "-")
  | EVAL enc          = COALESCE(winlog.event_data.TicketEncryptionType, "-")
  | WHERE user IS NOT NULL AND NOT user LIKE "*$"
  | STATS
      renewal_count = COUNT(*),
      unique_users  = COUNT_DISTINCT(user),
      users         = VALUES(user),
      services      = VALUES(service_name),
      encryption_types = VALUES(enc),
      first_renewal = MIN(@timestamp),
      last_renewal  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE renewal_count >= 1
  | KEEP agent_id, bucket, winlog.computer_name, renewal_count, unique_users, users,
      services, encryption_types, first_renewal, last_renewal
  | SORT renewal_count DESC
  | LIMIT 200
enabled: false
tags:
  - detection.baseline
  - monitoring.ticket-lifecycle
severity: low
risk_score: 30
nist: ["AU-2", "AU-12", "AC-7", "IA-2"]
pci_dss: ["10.2.4", "10.2.5", "8.1.6"]
gdpr: ["32.1.a", "32.2"]
mitre_attack: []
