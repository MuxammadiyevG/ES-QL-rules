rule_id: 14d77ecc-ba0e-4c1b-8457-d49aec964ac9
name_uz: "Privileged Access Workstation (PAW) faolligi"
name_ru: "Активность Privileged Access Workstation (PAW)"
name_en: "Privileged Access Workstation (PAW) Activity"
description_uz: |
  Baseline/compliance qoidasi: PAW (Privileged Access Workstation) yoki admin ish-stansiyalaridan
  interaktiv/RDP logon (4624, LogonType 2/10) hodisalarini yig'adi. PAW nomlash konvensiyangizni
  quyidagi regex'ga moslang. Tier-0 admin faoliyatini kuzatish uchun (alert emas).
description_ru: |
  Baseline/compliance-правило: собирает события интерактивного/RDP входа (4624, LogonType 2/10) с
  PAW (Privileged Access Workstation) или административных рабочих станций. Приведите свою конвенцию
  именования PAW к приведённому ниже regex. Для наблюдения за активностью Tier-0 админов (не алерт).
description_en: |
  Baseline/compliance rule: aggregates interactive/RDP logon events (4624, LogonType 2/10) from
  PAW (Privileged Access Workstation) or admin workstations. Adapt your PAW naming convention
  to the regex below. For monitoring Tier-0 admin activity (not an alert).
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4624"
  | WHERE winlog.event_data.LogonType IN ("2", "10")
  | EVAL target_user = winlog.event_data.TargetUserName
  | EVAL workstation = COALESCE(winlog.event_data.WorkstationName, winlog.computer_name, "-")
  | EVAL source_ip   = COALESCE(winlog.event_data.IpAddress, "-")
  | WHERE target_user IS NOT NULL AND NOT target_user LIKE "*$"
  // PAW/admin ish-stansiya yoki admin akkaunt nomlash shabloni (o'z muhitingizga moslang)
  | WHERE TO_LOWER(workstation) RLIKE ".*(paw|adm-ws|admin-ws|mgmt|jump|t0).*" OR TO_LOWER(target_user) RLIKE "(admin.*|.*[-_]adm|.*[-_]admin)"
  | STATS
      logon_count = COUNT(*),
      unique_users = COUNT_DISTINCT(target_user),
      admin_users = VALUES(target_user),
      workstations = VALUES(workstation),
      source_ips  = VALUES(source_ip),
      first_logon = MIN(@timestamp),
      last_logon  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE logon_count >= 1
  | KEEP agent_id, bucket, winlog.computer_name, logon_count, unique_users, admin_users,
      workstations, source_ips, first_logon, last_logon
  | SORT logon_count DESC
  | LIMIT 200
enabled: false
tags:
  - detection.baseline
  - monitoring.privileged-access
  - detection.compliance
severity: medium
risk_score: 50
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
mitre_attack: []
