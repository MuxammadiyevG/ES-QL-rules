rule_id: abfaad15-442e-456a-bb9d-169bb99b727a
name_uz: "Bir nechta manba IP'dan bir vaqtda kirish"
name_ru: "Одновременный вход с нескольких исходных IP"
name_en: "Concurrent Logon From Multiple Source IPs"
description_uz: |
  Ushbu qoida bitta akkauntning qisqa vaqtda BIR NECHTA xil manba IP'dan muvaffaqiyatli
  kirishini aniqlaydi (4624) — "impossible travel" / o'g'irlangan credential bilan parallel
  sessiyalar belgisidir (T1078).
  SOC triage:
  - `source_ips` haqiqatan turli joylardanmi? `target_user` egasimi? VPN/NAT emasmi?
description_ru: |
  Это правило выявляет успешные входы одной учётной записи за короткое время с НЕСКОЛЬКИХ разных
  исходных IP (4624) — это признак "impossible travel" / параллельных сессий с украденными
  учётными данными (T1078).
  Триаж SOC:
  - Действительно ли `source_ips` из разных мест? Является ли `target_user` владельцем? Не VPN/NAT ли это?
description_en: |
  This rule detects a single account logging on successfully from SEVERAL different source IPs
  within a short time (4624) — this is a sign of "impossible travel" / parallel sessions with
  stolen credentials (T1078).
  SOC triage:
  - Are the `source_ips` really from different locations? Is `target_user` the owner? Is it not VPN/NAT?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4624"
  | WHERE winlog.event_data.LogonType IN ("3", "10")
  | EVAL target_user = winlog.event_data.TargetUserName
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, "-")
  | WHERE target_user IS NOT NULL AND NOT target_user LIKE "*$"
  | WHERE src_ip != "-" AND src_ip != "::1" AND src_ip != "127.0.0.1" AND src_ip != "0.0.0.0"
  | STATS
      logon_count = COUNT(*),
      unique_sources = COUNT_DISTINCT(src_ip),
      source_ips = VALUES(src_ip),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY target_user, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE unique_sources >= 3
  | EVAL dyn_risk = CASE(unique_sources >= 6, 82, 72)
  | KEEP target_user, bucket, logon_count, unique_sources, source_ips, dyn_risk, first_seen, last_seen
  | SORT unique_sources DESC
  | LIMIT 200
enabled: true
tags:
  - attack.initial-access
  - attack.t1078
  - AuthAnomaly
severity: medium
risk_score: 72
mitre_attack:
  TA0001:
    T1078: []
nist: ["AC-7", "AU-12", "SI-4"]
pci_dss: ["10.2.5", "8.1.6"]
gdpr: ["32.1.a"]
