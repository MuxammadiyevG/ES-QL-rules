rule_id: 78c0de30-b93c-443e-83e4-32a266e3d29e
name: Web Shell File Drop
description: |
  Ushbu qoida web-server papkasiga (wwwroot/inetpub/htdocs/webapps) bajariladigan veb-fayl
  (.aspx/.asp/.php/.jsp/.ashx) yozilishini aniqlaydi (Sysmon 11) — web-shell persistence
  (T1505.003). Ayniqsa w3wp/php/tomcat jarayoni yozsa.
  SOC triage:
  - `files` qaysi, `images` qaysi jarayon (w3wp.exe → web-shell)? Faylni ko'rib chiqing.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "11"
  | EVAL tfn = TO_LOWER(COALESCE(winlog.event_data.TargetFilename, "-"))
  | EVAL img = TO_LOWER(COALESCE(winlog.event_data.Image, "-"))
  | EVAL actor = COALESCE(winlog.event_data.User, "-")
  | WHERE tfn RLIKE ".*(inetpub.wwwroot|.wwwroot.|.htdocs.|.webapps.|.www.|.public_html.).*"
  | WHERE tfn RLIKE ".*\\.(aspx|asp|php|php5|jsp|jspx|ashx|asmx|war|cshtml)"
  | EVAL by_websrv = CASE(img RLIKE ".*(w3wp|php-cgi|php|httpd|tomcat|nginx|java).exe", 1, 0)
  | STATS
      hits = COUNT(*),
      websrv_hits = SUM(by_websrv),
      files = VALUES(tfn),
      images = VALUES(img),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = CASE(websrv_hits >= 1, 95, 85)
  | KEEP agent_id, bucket, winlog.computer_name, hits, websrv_hits, files, images, users, dyn_risk, first_seen, last_seen
  | SORT dyn_risk DESC, hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.persistence
  - attack.t1505.003
  - File
severity: critical
risk_score: 92
mitre_attack:
  TA0003:
    T1505: ["T1505.003"]
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4", "6.6"]
gdpr: ["32.1.a"]
