rule_id: 4dace9ad-a840-4c04-9b7b-545204a182aa
name_uz: "AD NTLM Autentikatsiya Xatolarining Keskin Oshishi (4776)"
name_ru: "Всплеск ошибок аутентификации NTLM в AD (4776)"
name_en: "AD NTLM Authentication Failure Spike (4776)"
description_uz: |
  Ushbu qoida credential access faoliyatiga taalluqli bo'lib, NTLM autentikatsiya xatolarining spike holatini aniqlaydi.
  Ko'p sonli 4776 hodisalari password spray, credential stuffing yoki eski protokollar orqali AD hisoblarini buzishga urinishdan darak beradi.
  Qonuniy holatlar: legacy ilovalar, noto'g'ri saqlangan servis parollari, parol rotatsiyasidan keyingi kechikkan yangilanishlar.
  SOC triage bosqichlari:
  - Hujum manbasi sifatida `src_ip` va nishonlangan `target_user` larni aniqlang.
  - Change ticket/deployment bo'yicha NTLM bilan bog'liq o'zgarishlar borligini tekshiring.
  - `src_ip` manzilining reputatsiyasi va tarmoq segmentini tekshirib chiqing.
  - Nishon akkauntlarning guruh a'zoligi va imtiyoz darajasini tekshiring.
  - Tasdiqlansa manbani cheklang, parollarni yangilang va NTLM qisqartirish strategiyasini ishga tushiring.
description_ru: |
  Это правило относится к активности получения учётных данных и обнаруживает всплеск ошибок аутентификации NTLM.
  Большое количество событий 4776 свидетельствует о password spray, credential stuffing или попытке взлома учётных записей AD через устаревшие протоколы.
  Легитимные случаи: legacy-приложения, некорректно сохранённые пароли сервисов, запоздалые обновления после ротации паролей.
  Шаги SOC triage:
  - Определите `src_ip` как источник атаки и атакуемые `target_user`.
  - Проверьте по change ticket/deployment, были ли изменения, связанные с NTLM.
  - Изучите репутацию адреса `src_ip` и его сетевой сегмент.
  - Проверьте членство атакуемых учётных записей в группах и уровень их привилегий.
  - При подтверждении ограничьте источник, обновите пароли и запустите стратегию сокращения NTLM.
description_en: |
  This rule pertains to credential access activity and detects a spike in NTLM authentication failures.
  A large number of 4776 events signals password spray, credential stuffing or an attempt to break into AD accounts through legacy protocols.
  Legitimate cases: legacy applications, incorrectly stored service passwords, delayed updates after password rotation.
  SOC triage steps:
  - Identify the `src_ip` as the attack source and the targeted `target_user` accounts.
  - Check whether there are NTLM-related changes in a change ticket/deployment.
  - Review the reputation of the `src_ip` address and its network segment.
  - Review the group membership and privilege level of the targeted accounts.
  - If confirmed, restrict the source, update the passwords and launch an NTLM reduction strategy.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | EVAL hostn = winlog.computer_name
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.TargetUserName, winlog.event_data.SubjectUserName)
  | EVAL target_user = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.SamAccountName)
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, winlog.event_data.Workstation, winlog.event_data.IpAddress)
  | EVAL status = COALESCE(winlog.event_data.Status, "")
  // host-filtri olib tashlandi - barcha hostlarda ishlaydi (DC-only kerak bolsa qolda yoqing)
  | WHERE event.code == "4776"
  | STATS fail_count = COUNT(*), distinct_users = COUNT_DISTINCT(target_user) BY agent_id, hostn, src_ip, status
  | WHERE fail_count >= 20 OR distinct_users >= 8
  | EVAL dyn_risk = CASE(fail_count >= 80 OR distinct_users >= 25, 92, fail_count >= 40 OR distinct_users >= 12, 87, 82)
  | KEEP agent_id, hostn, src_ip, status, fail_count, distinct_users, dyn_risk
  | SORT dyn_risk DESC, fail_count DESC
  | LIMIT 200
enabled: false
tags:
  - AD
  - Authentication
  - Credential Access
severity: high
risk_score: 82
references:
  - "https://attack.mitre.org/techniques/T1110/"
mitre_attack:
  TA0006:
    T1110: []
nist: ["AU-2", "AU-12", "AC-7", "IA-2"]
pci_dss: ["10.2.4", "10.2.5", "8.1.6"]
gdpr: ["32.1.a", "32.2"]
