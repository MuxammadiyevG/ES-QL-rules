rule_id: 272e1d51-c8f9-48a0-aa28-48787b8ce1eb
name_uz: "Akkaunt bloklandi - Domain"
name_ru: "Учётная запись заблокирована - Domain"
name_en: "Account Locked - Domain"
description_uz: |
  Ushbu qoida Credential Access texnikalariga bog'liq bo'lib, `Account Locked: Domain` kontekstidagi haddan tashqari noto'g'ri kirish urinishlari natijasida domain akkauntning bloklanishini aniqlaydi.
  Bu turdagi hodisa AD muhitida hujumchi brute force yoki password spraying orqali foydalanuvchi akkauntini egallashga urinayotganligini ko'rsatishi mumkinligi sababli xavfli hisoblanadi.
  Qonuniy holatlar sifatida foydalanuvchi parolini unutganligi, boshqa tizimda keshlangan eski credential, servis akkauntidagi noto'g'ri parol konfiguratsiyasi yoki avtomatik skriptlardagi muammolar uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `actor` (bloklangan foydalanuvchi) va `src_ip` (manba IP) ni aniq identifikatsiya qiling.
  - Bloklash manbasi — qaysi host yoki IP dan kelganini tekshiring.
  - Foydalanuvchining boshqa tizimlarda keshlangan credential borligini tekshiring.
  - Manba hostda boshqa shubhali hodisalar (malware, lateral movement) borligini tekshiring.
  - Manba va manzil hostlarda zaifliklar borligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa tezkor containment bajaring: manba IP ni bloklang, credentiallarni yangilang va ta'sir doirasini izolyatsiya qiling.
description_ru: |
  Данное правило связано с техниками Credential Access и выявляет блокировку доменной учётной записи в результате чрезмерного количества неверных попыток входа в контексте `Account Locked: Domain`.
  Событие такого типа считается опасным, поскольку может указывать на то, что в среде AD атакующий пытается захватить учётную запись пользователя через brute force или password spraying.
  В качестве легитимных случаев могут встречаться забытый пользователем пароль, старые учётные данные, закешированные в другой системе, неверная конфигурация пароля в служебной учётной записи или проблемы в автоматических скриптах.
  Этапы SOC triage:
  - Точно идентифицируйте `actor` (заблокированного пользователя) и `src_ip` (исходный IP) в событии.
  - Проверьте источник блокировки — с какого хоста или IP она пришла.
  - Проверьте наличие закешированных учётных данных пользователя в других системах.
  - Проверьте наличие других подозрительных событий (malware, горизонтальное перемещение) на исходном хосте.
  - Проверьте наличие уязвимостей на исходном и целевом хостах.
  - При подтверждении нелегитимной активности выполните оперативный containment: заблокируйте исходный IP, обновите учётные данные и изолируйте область воздействия.
description_en: |
  This rule is related to Credential Access techniques and detects the lockout of a domain account caused by an excessive number of incorrect logon attempts in the `Account Locked: Domain` context.
  This type of event is considered dangerous because it may indicate that in an AD environment an attacker is trying to take over a user account through brute force or password spraying.
  Legitimate cases may include a user forgetting the password, old credentials cached on another system, an incorrect password configuration in a service account or problems in automated scripts.
  SOC triage steps:
  - Precisely identify the `actor` (the locked-out user) and the `src_ip` (source IP) in the event.
  - Check the source of the lockout — which host or IP it came from.
  - Check whether the user has cached credentials on other systems.
  - Check whether there are other suspicious events (malware, lateral movement) on the source host.
  - Check whether there are vulnerabilities on the source and destination hosts.
  - If illegitimate activity is confirmed, perform rapid containment: block the source IP, rotate the credentials and isolate the scope of impact.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 600 seconds
  | WHERE winlog.channel == "Security"
  | WHERE winlog.event_id == "4740"
  | EVAL hostn       = winlog.computer_name
  | EVAL actor       = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.SamAccountName)
  | EVAL src_ip      = COALESCE(winlog.event_data.IpAddress, winlog.event_data.ClientAddress)
  | EVAL src_host    = COALESCE(winlog.event_data.WorkstationName, winlog.event_data.Workstation)
  | EVAL logon_type  = winlog.event_data.LogonType
  | WHERE TO_LOWER(hostn) RLIKE ".*(windc|addc|-dc|domaincontroller).*"
  | WHERE NOT actor RLIKE ".*\\$$"
  | STATS
      event_count   = COUNT(*),
      users         = VALUES(winlog.event_data.TargetUserName),
      src_ips       = VALUES(winlog.event_data.IpAddress),
      src_hosts     = VALUES(winlog.event_data.WorkstationName),
      dest_hosts    = VALUES(winlog.computer_name),
      logon_types   = VALUES(winlog.event_data.LogonType),
      last_seen     = MAX(@timestamp),
      first_seen    = MIN(@timestamp)
    BY agent_id, winlog.computer_name, winlog.event_data.IpAddress, winlog.event_data.TargetUserName
  | WHERE event_count >= 1
  | EVAL
      destination_host  = winlog.computer_name,
      destination_ip    = winlog.event_data.IpAddress,
      user              = winlog.event_data.TargetUserName
  | KEEP
      agent_id,
      destination_host,
      destination_ip,
      user,
      event_count,
      src_ips,
      src_hosts,
      logon_types,
      last_seen,
      first_seen
  | SORT event_count DESC
enabled: false
tags:
  - attack.credential-access
  - attack.t1110.001
  - detection.threat-hunting
severity: medium
risk_score: 60
references:
  - "https://attack.mitre.org/techniques/T1110/001/"
  - "https://docs.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4740"
nist: ["AC-7", "IA-5", "SI-4"]
pci_dss: ["8.1.6", "8.1.7", "10.6.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0006:
    T1110: ["T1110.001"]