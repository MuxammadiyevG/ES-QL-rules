rule_id: aa9f955e-2101-42b6-bfe8-aab4a272ded5
name_uz: "Normal domen kontrolleri replikatsiyasi"
name_ru: "Нормальная репликация контроллеров домена"
name_en: "Normal Domain Controller Replication"
description_uz: |
  Baseline/monitoring qoidasi: qonuniy DC-to-DC replikatsiyani yig'adi — 4662 `Properties`
  da replikatsiya GUID'i (1131f6aa) bo'lib, uni MASHINA akkaunti (DC$) bajaradi. DCSync
  detection'lari uchun normal replikatsiya darajasini belgilash maqsadida (alert emas).
description_ru: |
  Правило baseline/мониторинга: собирает легитимную репликацию DC-to-DC — в 4662 `Properties`
  содержится GUID репликации (1131f6aa), и выполняет её МАШИННАЯ учётная запись (DC$). Служит для определения
  нормального уровня репликации для детектов DCSync (не алерт).
description_en: |
  Baseline/monitoring rule: collects legitimate DC-to-DC replication — 4662 with the replication
  GUID (1131f6aa) in `Properties`, performed by a MACHINE account (DC$). Intended to establish the
  normal replication level for DCSync detections (not an alert).
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4662"
  | EVAL accessing_account = winlog.event_data.SubjectUserName
  | EVAL props = COALESCE(winlog.event_data.Properties, "")
  | WHERE TO_LOWER(props) RLIKE ".*(1131f6aa|1131f6ad).*"
  // Faqat mashina (DC) akkauntlari — qonuniy replikatsiya
  | WHERE accessing_account IS NOT NULL AND accessing_account LIKE "*$"
  | STATS
      replication_count = COUNT(*),
      dc_accounts = VALUES(accessing_account),
      first_replication = MIN(@timestamp),
      last_replication  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE replication_count >= 1
  | KEEP agent_id, bucket, winlog.computer_name, replication_count, dc_accounts,
      first_replication, last_replication
  | SORT replication_count DESC
  | LIMIT 200
enabled: false
tags:
  - detection.baseline
  - monitoring.replication
  - monitoring.infrastructure
severity: low
risk_score: 30
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
mitre_attack: []
