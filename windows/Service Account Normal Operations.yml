rule_id: 058b8fad-a39e-4fdf-acdc-6fa1285ae259
name_uz: "Servis akkauntning normal operatsiyalari"
name_ru: "Нормальные операции сервисной учётной записи"
name_en: "Service Account Normal Operations"
description_uz: |
  Baseline/monitoring qoidasi: servis akkauntlarining batch/service logon (4624, LogonType
  4/5) hodisalarini yig'adi — bu servis akkauntlar uchun NORMAL rejim. Servis akkaunt
  anomaliyalari (masalan, interaktiv logon) uchun normal darajani belgilash maqsadida.
description_ru: |
  Baseline/мониторинговое правило: собирает события batch/service logon сервисных учётных записей (4624, LogonType
  4/5) — это НОРМАЛЬНЫЙ режим для сервисных учётных записей. Цель — определить нормальный уровень
  для аномалий сервисных учётных записей (например, интерактивный вход).
description_en: |
  Baseline/monitoring rule: collects batch/service logon events of service accounts (4624, LogonType
  4/5) — this is the NORMAL mode for service accounts. Intended to establish the normal baseline
  for service account anomalies (for example, an interactive logon).
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4624"
  | WHERE winlog.event_data.LogonType IN ("4", "5")
  | EVAL target_user = winlog.event_data.TargetUserName
  | EVAL logon_type  = winlog.event_data.LogonType
  | EVAL logon_type_name = CASE(logon_type == "4", "Batch", logon_type == "5", "Service", "Other")
  | EVAL logon_process = COALESCE(winlog.event_data.LogonProcessName, "-")
  | WHERE target_user IS NOT NULL AND NOT target_user LIKE "*$"
  | WHERE NOT TO_LOWER(target_user) RLIKE "(system|local service|network service|iusr)"
  | WHERE target_user NOT IN ("СИСТЕМА", "ЛОКАЛЬНАЯ СЛУЖБА", "СЕТЕВАЯ СЛУЖБА")
  | STATS
      logon_count = COUNT(*),
      unique_accounts = COUNT_DISTINCT(target_user),
      service_accounts = VALUES(target_user),
      logon_types = VALUES(logon_type_name),
      processes  = VALUES(logon_process),
      first_logon = MIN(@timestamp),
      last_logon  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE logon_count >= 1
  | KEEP agent_id, bucket, winlog.computer_name, logon_count, unique_accounts, service_accounts,
      logon_types, processes, first_logon, last_logon
  | SORT logon_count DESC
  | LIMIT 200
enabled: false
tags:
  - detection.baseline
  - monitoring.service-accounts
severity: low
risk_score: 30
nist: ["AU-2", "AU-12", "AC-7", "IA-2"]
pci_dss: ["10.2.4", "10.2.5", "8.1.6"]
gdpr: ["32.1.a", "32.2"]
mitre_attack: []
