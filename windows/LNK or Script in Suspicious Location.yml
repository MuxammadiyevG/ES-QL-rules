rule_id: 8609c9ce-6abd-4f9c-8a6b-12108cb9dae7
name: LNK / Script File Created in Suspicious Location
description: |
  Ushbu qoida shubhali joyda (Startup/Temp/AppData/Downloads/Public) LNK, HTA, SCR yoki
  skript fayli yaratilishini aniqlaydi (Sysmon 11) — fishing artefakti yoki persistence
  (T1547.009/T1566).
  SOC triage:
  - `files` qaysi, `images` kim yaratdi (brauzer/arxivator/Office)?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "11"
  | EVAL tfn = TO_LOWER(COALESCE(winlog.event_data.TargetFilename, "-"))
  | EVAL img = COALESCE(winlog.event_data.Image, "-")
  | EVAL actor = COALESCE(winlog.event_data.User, "-")
  | WHERE tfn RLIKE ".*\\.(lnk|hta|scr|jse|wsf|vbe|js|vbs)"
  | WHERE tfn RLIKE ".*(.startup.|.temp.|.appdata.|.downloads.|.users.public.|.programdata.).*"
  | WHERE NOT TO_LOWER(img) RLIKE ".*\\\\edgeupdate.*\\\\.*setup\\.exe"
  | STATS
      hits = COUNT(*),
      files = VALUES(tfn),
      images = VALUES(img),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = 74
  | KEEP agent_id, bucket, winlog.computer_name, hits, files, images, users, dyn_risk, first_seen, last_seen
  | SORT hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.persistence
  - attack.initial-access
  - attack.t1547.009
  - File
severity: medium
risk_score: 74
mitre_attack:
  TA0003:
    T1547: ["T1547.009"]
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
