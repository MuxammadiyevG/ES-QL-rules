rule_id: 4eb9dfa3-60ee-4bb5-a358-524ba8c8a4e0
name_uz: "Audit siyosati o'chirilgan yoki o'zgartirilgan"
name_ru: "Политика аудита отключена или изменена"
name_en: "Audit Policy Disabled or Modified"
description_uz: |
  Ushbu qoida persistence va defense evasion texnikalariga bog'liq bo'lib, `Audit Policy Disabled or Modified` kontekstidagi shubhali Active Directory faoliyatini aniqlaydi.
  Bu turdagi hodisa AD muhitida hujumchiga ruxsatsiz kirishni mustahkamlash, hisoblarni egallash yoki boshqaruv huquqlarini oshirish imkonini berishi mumkinligi sababli xavfli hisoblanadi.
  Qonuniy holatlar sifatida rejalashtirilgan administrativ ishlar, change/deployment jarayonlari, IAM sinxronizatsiyasi yoki servis konfiguratsiya yangilanishlari uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `actor` va `target_user` (yoki target obyekt) ni aniq identifikatsiya qiling.
  - O'zgarish/kirish uchun tasdiqlangan change ticket yoki deployment yozuvi borligini tekshiring.
  - `src_ip` manzili, manba host va tarmoq segmentining legitimligini tekshiring.
  - Ta'sirlangan akkaunt yoki obyektning guruh a'zoligi, ayniqsa imtiyozli guruhlar bilan bog'liqligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa tezkor containment bajaring: manbani cheklang, credentiallarni yangilang va ta'sir doirasini izolyatsiya qiling.
description_ru: |
  Это правило связано с техниками закрепления (persistence) и обхода защиты (defense evasion) и выявляет подозрительную активность Active Directory в контексте `Audit Policy Disabled or Modified`.
  Событие такого типа считается опасным, поскольку в среде AD оно может позволить злоумышленнику закрепить несанкционированный доступ, захватить учётные записи или повысить административные права.
  В качестве легитимных случаев могут встречаться плановые административные работы, процессы change/deployment, синхронизация IAM или обновления конфигурации служб.
  Этапы SOC-триажа:
  - Точно идентифицируйте `actor` и `target_user` (или целевой объект) в событии.
  - Проверьте наличие утверждённого change-тикета или записи о deployment для изменения/доступа.
  - Проверьте легитимность адреса `src_ip`, исходного хоста и сетевого сегмента.
  - Проверьте членство в группах затронутой учётной записи или объекта, особенно связь с привилегированными группами.
  - При подтверждении нелегитимной активности выполните оперативное сдерживание (containment): ограничьте источник, смените учётные данные и изолируйте зону воздействия.
description_en: |
  This rule is related to persistence and defense evasion techniques and detects suspicious Active Directory activity in the `Audit Policy Disabled or Modified` context.
  An event of this type is considered dangerous because in an AD environment it may allow an attacker to establish unauthorized access, take over accounts, or escalate administrative rights.
  Legitimate cases may include planned administrative work, change/deployment processes, IAM synchronization, or service configuration updates.
  SOC triage steps:
  - Precisely identify the `actor` and `target_user` (or target object) in the event.
  - Check whether an approved change ticket or deployment record exists for the change/access.
  - Verify the legitimacy of the `src_ip` address, the source host, and the network segment.
  - Check the group membership of the affected account or object, especially any association with privileged groups.
  - If malicious activity is confirmed, perform immediate containment: restrict the source, rotate credentials, and isolate the affected scope.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | EVAL hostn = winlog.computer_name
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.SubjectUserName)
  | EVAL target_user = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.SamAccountName)
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, winlog.event_data.IpAddress)
  // host-filtri olib tashlandi - barcha hostlarda ishlaydi (DC-only kerak bolsa qolda yoqing)
  | WHERE NOT actor LIKE "*$"
  | WHERE event.code == "4719"
  | EVAL 
      modifier = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.SubjectUserName, "Unknown"),
      category = "Unknown",
      subcategory = "Unknown",
      subcategory_guid = "Unknown",
      audit_policy_changes = COALESCE(event.action, "Unknown")
  | STATS 
      policy_changes = COUNT(*),
      categories = VALUES(category),
      subcategories = VALUES(subcategory),
      subcategory_guids = VALUES(subcategory_guid),
      changes = VALUES(audit_policy_changes),
      first_change = MIN(@timestamp),
      last_change = MAX(@timestamp)
    BY agent_id, winlog.computer_name, modifier, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE policy_changes >= 1
  | KEEP agent_id, bucket, winlog.computer_name, modifier, policy_changes, categories,
      subcategories, subcategory_guids, changes, first_change, last_change
  | SORT policy_changes DESC
  | LIMIT 200
enabled: false
tags:
  - attack.defense-evasion
  - attack.t1562.002
  - detection.critical
severity: high
risk_score: 85
mitre_attack:
  TA0005:
    T1562: ["T1562.002"]
nist: ["AU-6", "AU-9", "SI-4"]
pci_dss: ["10.2.7", "10.5"]
gdpr: ["32.1.a", "32.2"]
