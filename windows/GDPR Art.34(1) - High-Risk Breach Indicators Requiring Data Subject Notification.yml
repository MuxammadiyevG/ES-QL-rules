rule_id: 7e61625e-023b-4946-a899-172daa8d8c6c
name_uz: "GDPR Art.34(1) - Ma'lumot subyektlarini xabardor qilishni talab qiluvchi yuqori xavfli buzilish indikatorlari"
name_ru: "GDPR Art.34(1) - Индикаторы утечки высокого риска, требующие уведомления субъектов данных"
name_en: "GDPR Art.34(1) - High-Risk Breach Indicators Requiring Data Subject Notification"
description_uz: |
  Jismoniy shaxslarning huquq va erkinliklari uchun yuqori xavf keltirib chiqarish ehtimoli yuqori bo'lgan
  eng yuqori jiddiylikdagi buzilish indikatorlarini aniqlaydi — bu GDPR 34(1)-moddasi bo'yicha buzilish haqida
  ta'sirlangan ma'lumot subyektlariga kechiktirmasdan xabar berish majburiyatini keltirib chiqaradi.
  Art.34 Art.33 chegarasi bajarilganda VA buzilish shaxslar uchun YUQORI XAVF tug'dirganda qo'llaniladi:
  moliyaviy zarar, kamsitish, shaxsni o'g'irlash, obro'ga putur yetkazish yoki ma'lumot subyektlari uchun
  sezilarli ijtimoiy/iqtisodiy noqulaylik.
  Kuzatadi: (1) ommaviy akkaunt kompromatatsiyasi indikatorlari, (2) ommaviy ma'lumotga kirish anomaliyalari,
  (3) tarmoq orqali shifrlanmagan shaxsiy ma'lumotlarni eksfiltratsiya qilish urinishlari, (4) shaxsiy ma'lumotlar
  omborlarida ransomware'ga o'xshash fayl o'zgartirish shablonlari.
  Trigger: >50 ta turli foydalanuvchi akkaunti kompromatatsiya qilingan YOKI bitta sessiyadan ommaviy ma'lumotga kirish
  YOKI ma'lumotlar bazasi hostlaridan katta hajmli chiquvchi uzatma.
  False positive: Ruxsat etilgan ommaviy ma'lumot eksportlari, ETL jarayonlari, backup ishlari.
  Triage: DARHOL C-level va DPO darajasiga eskalatsiya talab qilinadi. Aniqlang: (1) buzilgan ma'lumotlarga
  shifrlash qo'llanilganmi (Art.34(3)(a) istisnosi)?, (2) qancha ma'lumot subyekti ta'sirlangan?,
  (3) shaxsiy ma'lumotlarning qaysi toifalari (maxsus toifalar = yuqoriroq xavf)?,
  (4) Art.34(2) bo'yicha aniq va sodda tilda ma'lumot subyektlariga xabarnoma tayyorlang.
description_ru: |
  Обнаруживает индикаторы утечки наивысшей серьёзности, которые с высокой вероятностью влекут высокий риск
  для прав и свобод физических лиц, что порождает обязанность по статье 34(1) GDPR
  сообщить об утечке затронутым субъектам данных без неоправданной задержки.
  Art.34 применяется, когда достигнут порог Art.33 И утечка создаёт ВЫСОКИЙ РИСК для физических лиц:
  финансовые потери, дискриминация, кража личности, репутационный ущерб или существенные
  социальные/экономические неблагоприятные последствия для субъектов данных.
  Отслеживает: (1) индикаторы массовой компрометации учётных записей, (2) аномалии массового доступа к данным,
  (3) попытки эксфильтрации незашифрованных персональных данных по сети, (4) характерные для ransomware
  шаблоны модификации файлов в хранилищах персональных данных.
  Триггер: >50 различных учётных записей скомпрометировано ИЛИ массовый доступ к данным из одной сессии
  ИЛИ крупная исходящая передача с хостов баз данных.
  Ложные срабатывания: Санкционированные массовые выгрузки данных, ETL-процессы, задания резервного копирования.
  Разбор: Требуется НЕМЕДЛЕННАЯ эскалация на уровень C-level и DPO. Определите: (1) применено ли шифрование
  к скомпрометированным данным (исключение Art.34(3)(a))?, (2) сколько субъектов данных затронуто?,
  (3) какие категории персональных данных (специальные категории = более высокий риск)?,
  (4) подготовьте уведомление субъектов данных на ясном и простом языке согласно Art.34(2).
description_en: |
  Detects breach indicators of the highest severity that are likely to result in high risk
  to the rights and freedoms of natural persons, triggering GDPR Article 34(1) obligation
  to communicate the breach to affected data subjects without undue delay.
  Art.34 applies when Art.33 threshold is met AND the breach poses HIGH RISK to individuals:
  financial loss, discrimination, identity theft, reputational damage, or significant
  social/economic disadvantage to data subjects.
  Monitors: (1) mass account compromise indicators, (2) bulk data access anomalies,
  (3) unencrypted personal data exfiltration attempts via network, (4) ransomware-like
  file modification patterns on personal data stores.
  Trigger: >50 distinct user accounts compromised OR bulk data access from single session
  OR large outbound transfer from database hosts.
  False positives: Authorized bulk data exports, ETL processes, backup jobs.
  Triage: IMMEDIATE C-level and DPO escalation required. Determine: (1) is encryption
  applied to breached data (Art.34(3)(a) exception)?, (2) how many data subjects affected?,
  (3) what categories of personal data (special categories = higher risk)?,
  (4) prepare data subject notification in clear and plain language per Art.34(2).
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-winlog*
  - logs-updive.audit*
query_language: esql
query: |
  FROM logs-winlog*, logs-updive.audit*
  | WHERE @timestamp >= NOW() - 5 minutes
    AND event.outcome == "success"
    AND NOT host.name IN ("windc22", "csecldc")
    AND (
      event.code IN ("4624", "4648", "4672", "4768", "4769", "4776")
      OR (event.dataset == "updive-audit.log" AND event.action IN ("acquired-credentials", "was-authorized", "started-session", "changed-login-id-to"))
    )
  | EVAL effective_user = COALESCE(winlog.event_data.TargetUserName, user.name)
  | STATS
      total_auth_events       = COUNT(*),
      unique_accounts         = COUNT_DISTINCT(effective_user),
      unique_hosts            = COUNT_DISTINCT(host.name),
      privileged_sessions     = COUNT(CASE(event.code == "4672", 1, null)),
      kerberos_tickets        = COUNT(CASE(event.code IN ("4768", "4769"), 1, null)),
      explicit_credential_use = COUNT(CASE(event.code == "4648", 1, null)),
      accounts_accessed       = VALUES(effective_user),
      hosts_accessed          = VALUES(host.name)
    BY agent_id,
       bucket = DATE_TRUNC(5 minutes, @timestamp)
  | EVAL high_risk_score =
      CASE(unique_accounts >= 50,  10, CASE(unique_accounts >= 20, 5, 0))
      + CASE(unique_hosts >= 10,   8,  CASE(unique_hosts >= 5,     4, 0))
      + CASE(privileged_sessions >= 10, 8, CASE(privileged_sessions >= 3, 4, 0))
      + CASE(explicit_credential_use >= 5, 6, 0)
      + CASE(kerberos_tickets >= 20, 5, 0)
  | WHERE high_risk_score >= 8
  | EVAL art34_trigger = CASE(
      high_risk_score >= 20,
        "CRITICAL - Art.34(1) LIKELY TRIGGERED: Mass account access indicates high risk to data subjects. Notify DPO and C-level NOW.",
      high_risk_score >= 12,
        "HIGH - Art.34(1) ASSESSMENT REQUIRED: Significant breach scope; evaluate data subject notification obligation.",
      "MEDIUM - Art.34(1) MONITOR: Elevated breach indicators; assess if high risk threshold is met."
    )
  | EVAL data_subject_risk = CASE(
      unique_accounts >= 50,
        "MASS EXPOSURE - 50+ accounts; financial, identity theft and discrimination risks to large number of data subjects",
      unique_hosts >= 10,
        "WIDE SCOPE - 10+ systems accessed; assess personal data categories on each system",
      privileged_sessions >= 10,
        "ADMIN COMPROMISE - privileged access may expose all personal data on affected systems",
      "ELEVATED RISK - correlate with data inventory to assess data subject impact"
    )
  | EVAL severity_level = CASE(
      high_risk_score >= 20, "critical",
      high_risk_score >= 12, "high",
      "medium"
    )
  | EVAL risk_score = CASE(
      high_risk_score >= 20, 99,
      high_risk_score >= 12, 85,
      65
    )
  | KEEP agent_id, bucket, total_auth_events, unique_accounts,
         unique_hosts, privileged_sessions, kerberos_tickets,
         explicit_credential_use, accounts_accessed, hosts_accessed,
         high_risk_score, art34_trigger, data_subject_risk,
         severity_level, risk_score
  | SORT high_risk_score DESC
enabled: false
tags:
  - gdpr
  - breach_notification
  - data_subject_rights
  - art34
  - high_risk
  - critical
severity: critical
risk_score: 99
references:
  - "GDPR Article 34(1): Communicate high-risk breaches to data subjects without undue delay"
  - "GDPR Article 34(2): Communication in clear and plain language describing nature of breach"
  - "GDPR Article 34(3)(a): Exception if appropriate technical protection applied (encryption)"
  - "GDPR Article 33(1): Supervisory authority notification prerequisite"
gdpr: ["34.1", "34.2", "33.1", "33.3"]
