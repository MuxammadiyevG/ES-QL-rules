rule_id: 7441da8e-c184-48f6-921d-6c1e01f17cfb
name: Privileged Account Interactive Logon
description: |
  Ushbu qoida imtiyozli akkauntning interaktiv/RDP logon'ini aniqlaydi (4624, LogonType 2/10).
  Built-in Administrator (SID RID-500) yoki admin nomidagi akkauntning logon'i — ayniqsa
  noodatiy hostda — lateral movement yoki imtiyoz suiiste'moli belgisi bo'lishi mumkin.
  SOC triage:
  - `target_user`/`source_ips`/`workstations` odatiy admin segmentidanmi?
  - `elevated_tokens` — to'liq token bilan kirilganmi?
  - Tasdiqlanmasa: sessiyani uzing, credential'ni yangilang, manbani izolyatsiya qiling.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4624"
  | WHERE winlog.event_data.LogonType IN ("2", "10")
  | EVAL target_user = winlog.event_data.TargetUserName
  | EVAL target_sid  = COALESCE(winlog.event_data.TargetUserSid, "-")
  | EVAL source_ip   = COALESCE(winlog.event_data.IpAddress, "-")
  | EVAL workstation = COALESCE(winlog.event_data.WorkstationName, "-")
  | EVAL logon_process = COALESCE(winlog.event_data.LogonProcessName, "-")
  | EVAL elevated_token = COALESCE(winlog.event_data.ElevatedToken, "-")
  | WHERE target_user IS NOT NULL AND NOT target_user LIKE "*$"
  // Built-in Administrator (SID ...-500) yoki admin nomli akkauntlar
  | WHERE target_sid LIKE "*-500" OR TO_LOWER(target_user) RLIKE "(administrator|admin.*|.*[-_]adm|.*[-_]admin|da[-_].*|ea[-_].*)"
  | STATS
      logon_count = COUNT(*),
      source_ips  = VALUES(source_ip),
      workstations = VALUES(workstation),
      logon_processes = VALUES(logon_process),
      elevated_tokens = VALUES(elevated_token),
      first_logon = MIN(@timestamp),
      last_logon  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, target_user, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE logon_count >= 1
  | EVAL dyn_risk = CASE(logon_count >= 10, 82, 75)
  | KEEP agent_id, bucket, winlog.computer_name, target_user, logon_count, source_ips,
      workstations, logon_processes, elevated_tokens, dyn_risk, first_logon, last_logon
  | SORT dyn_risk DESC, logon_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.privilege-escalation
  - attack.lateral-movement
  - attack.t1078.002
  - detection.monitoring
severity: high
risk_score: 75
mitre_attack:
  TA0004:
    T1078: ["T1078.002"]
  TA0008:
    T1021: []
nist: ["AC-17", "AU-2", "AU-12", "SI-4"]
pci_dss: ["10.2.5", "8.1.6"]
gdpr: ["32.1.a"]
