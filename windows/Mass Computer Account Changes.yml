rule_id: 64ac091c-ac68-4bfa-9967-4079212f1599
name_uz: "Ommaviy / anomal computer account o'zgarishlari (4742)"
name_ru: "Массовые / аномальные изменения учётных записей компьютеров (4742)"
name_en: "Mass / Anomalous Computer Account Changes (4742)"
description_uz: |
  Ushbu qoida qisqa vaqtda ko'p computer account o'zgarishini (4742) aniqlaydi — ommaviy
  parol reset, MachineAccountQuota suiiste'mol yoki Zerologon-uslubidagi hujum belgisi
  bo'lishi mumkin. Oddiy holatda 4742 kam uchraydi.
  SOC triage:
  - `actors` kim o'zgartiryapti, `targets` qaysi mashinalar? DC$ akkaunti bormi (Zerologon)?
description_ru: |
  Это правило обнаруживает множество изменений учётных записей компьютеров (4742) за короткое
  время — признак массового сброса паролей, злоупотребления MachineAccountQuota или атаки
  в стиле Zerologon. В обычных условиях 4742 встречается редко.
  SOC triage:
  - `actors` кто вносит изменения, `targets` какие машины? Есть ли учётная запись DC$ (Zerologon)?
description_en: |
  This rule detects many computer account changes (4742) in a short time — it may indicate mass
  password resets, MachineAccountQuota abuse or a Zerologon-style attack.
  Normally 4742 is rare.
  SOC triage:
  - `actors` who is making the changes, `targets` which machines? Is a DC$ account involved (Zerologon)?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4742"
  | EVAL target = COALESCE(winlog.event_data.TargetUserName, "-")
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, "-")
  | STATS
      changes = COUNT(*),
      unique_targets = COUNT_DISTINCT(target),
      targets = VALUES(target),
      actors = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE changes >= 10 OR unique_targets >= 10
  | EVAL dyn_risk = CASE(unique_targets >= 25, 85, 75)
  | KEEP agent_id, bucket, winlog.computer_name, changes, unique_targets, targets, actors, dyn_risk, first_seen, last_seen
  | SORT dyn_risk DESC, changes DESC
  | LIMIT 200
enabled: true
tags:
  - attack.privilege-escalation
  - attack.t1098
  - AD-advanced
severity: high
risk_score: 75
mitre_attack:
  TA0004:
    T1098: []
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
