rule_id: 5bdd228b-cae6-486f-a186-9a027b726227
name_uz: "Akkaunt lockout / domen siyosati o'zgartirildi"
name_ru: "Изменена политика блокировки учётных записей / политика домена"
name_en: "Account Lockout / Domain Policy Changed"
description_uz: |
  Ushbu qoida domen siyosati o'zgarishini aniqlaydi (4739 — Domain Policy Changed). 4739
  kamdan-kam va yuqori imtiyoz talab qiladi; lockout/parol siyosatini zaiflashtirish brute
  force'ga yo'l ochadi.
  Eslatma: sizning indeksingizda `LockoutThreshold`/`LockoutDuration` MAVJUD EMAS — shu
  sabab aniq lockout qiymatini ko'rsata olmaydi; rule har qanday 4739 o'zgarishini va mavjud
  `MinimumPasswordLength` ni surface qiladi. Lockout qiymatini ko'rish uchun audit/parser'da
  shu maydonlarni yoqing.
  SOC triage:
  - `actor` kim, bu rasmiy baseline o'zgarishimi (change ticket)?
  - Tasdiqlanmasa: siyosatni tiklang, aktorni cheklang.
description_ru: |
  Данное правило выявляет изменение доменной политики (4739 — Domain Policy Changed). 4739
  встречается редко и требует высоких привилегий; ослабление политики lockout/паролей открывает путь
  к перебору паролей (brute force).
  Примечание: в вашем индексе `LockoutThreshold`/`LockoutDuration` ОТСУТСТВУЮТ — по этой
  причине точное значение lockout показать невозможно; правило выводит любое изменение 4739 и имеющийся
  `MinimumPasswordLength`. Чтобы увидеть значение lockout, в audit/parser
  включите эти поля.
  SOC triage:
  - Кто такой `actor`, является ли это официальным изменением baseline (change ticket)?
  - Если не подтверждено: восстановите политику, ограничьте актора.
description_en: |
  This rule detects a domain policy change (4739 — Domain Policy Changed). 4739
  is rare and requires high privileges; weakening the lockout/password policy opens the way to brute
  force.
  Note: your index does NOT have `LockoutThreshold`/`LockoutDuration` — for this
  reason it cannot show the exact lockout value; the rule surfaces any 4739 change and the available
  `MinimumPasswordLength`. To see the lockout value, enable those fields in the
  audit/parser.
  SOC triage:
  - Who is the `actor`, is this an official baseline change (change ticket)?
  - If not confirmed: restore the policy, restrict the actor.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4739"
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, "-")
  | EVAL min_pwd_length = COALESCE(winlog.event_data.MinimumPasswordLength, "-")
  | EVAL domain = COALESCE(winlog.event_data.TargetDomainName, winlog.event_data.SubjectDomainName, "-")
  | WHERE actor IS NOT NULL AND NOT actor LIKE "*$"
  | STATS
      change_count = COUNT(*),
      actors = VALUES(actor),
      domains = VALUES(domain),
      min_lengths = VALUES(min_pwd_length),
      first_change = MIN(@timestamp),
      last_change  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE change_count >= 1
  | EVAL dyn_risk = 78
  | KEEP agent_id, bucket, winlog.computer_name, change_count, actors, domains, min_lengths,
      dyn_risk, first_change, last_change
  | SORT change_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.defense-evasion
  - attack.persistence
  - attack.t1098
  - detection.threat-hunting
severity: high
risk_score: 70
references:
  - "https://attack.mitre.org/techniques/T1098/"
nist: ["AC-7", "IA-5"]
pci_dss: ["8.1.6", "8.1.7"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0003:
    T1098: []
