rule_id: 6cd334ce-151d-4b37-8844-d7fb0bce94bc
name_uz: "DNS tunneling - bitta jarayondan haddan ziyod ko'p noyob so'rov"
name_ru: "DNS Tunneling - чрезмерное число уникальных запросов от одного процесса"
name_en: "DNS Tunneling - Excessive Unique Queries by One Process"
description_uz: |
  Ushbu qoida DNS tunneling/DGA'ni aniqlaydi: bitta jarayon qisqa vaqtda JUDA KO'P xil domen
  so'rasa (Sysmon 22). Tunneling data'ni subdomenlarga kodlab chiqaradi (T1071.004/T1048).
  Brauzer/CDN jarayonlari chiqarib tashlangan.
  SOC triage:
  - `image` brauzer emasmi? `unique_domains` juda yuqorimi? namuna `domains`.
description_ru: |
  Это правило выявляет DNS tunneling/DGA: когда один процесс за короткое время запрашивает ОЧЕНЬ МНОГО разных
  доменов (Sysmon 22). Туннелирование кодирует данные в поддомены и выводит их наружу (T1071.004/T1048).
  Процессы браузеров/CDN исключены.
  Триаж SOC:
  - Не браузер ли `image`? Не слишком ли высок `unique_domains`? образец `domains`.
description_en: |
  This rule detects DNS tunneling/DGA: when a single process queries VERY MANY different domains
  in a short time (Sysmon 22). Tunneling encodes data into subdomains and sends it out (T1071.004/T1048).
  Browser/CDN processes are excluded.
  SOC triage:
  - Is `image` not a browser? Is `unique_domains` very high? sample `domains`.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "22"
  | EVAL qn = TO_LOWER(COALESCE(winlog.event_data.QueryName, "-"))
  | EVAL img = TO_LOWER(COALESCE(winlog.event_data.Image, "-"))
  | WHERE qn != "-"
  | WHERE NOT img RLIKE ".*(chrome|msedge|firefox|brave|opera|svchost|teams|onedrive|outlook|searchapp|backgroundtaskhost|googleupdate).exe"
  | STATS
      total_queries = COUNT(*),
      unique_domains = COUNT_DISTINCT(qn),
      sample_domains = VALUES(qn),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, img, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE unique_domains >= 50
  | EVAL dyn_risk = CASE(unique_domains >= 200, 85, unique_domains >= 100, 78, 70)
  | KEEP agent_id, bucket, winlog.computer_name, img, total_queries, unique_domains, sample_domains, dyn_risk, first_seen, last_seen
  | SORT unique_domains DESC
  | LIMIT 200
enabled: true
tags:
  - attack.command-and-control
  - attack.exfiltration
  - attack.t1071.004
  - DNS
severity: medium
risk_score: 75
mitre_attack:
  TA0011:
    T1071: ["T1071.004"]
nist: ["SI-4", "AU-12", "SC-7"]
pci_dss: ["10.2.7", "11.4", "1.3"]
gdpr: ["32.1.a"]
