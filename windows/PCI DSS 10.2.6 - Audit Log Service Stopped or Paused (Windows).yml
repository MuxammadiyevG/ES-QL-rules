rule_id: 70f9eaf1-e64e-4428-97e1-8608a13ea8a2
name_uz: "PCI DSS 10.2.6 - Audit log servisi to'xtatildi yoki pauza qilindi (Windows)"
name_ru: "PCI DSS 10.2.6 - Служба журнала аудита остановлена или приостановлена (Windows)"
name_en: "PCI DSS 10.2.6 - Audit Log Service Stopped or Paused (Windows)"
description_uz: |
  Windows tizimlarida audit log servislarini to'xtatish, pauza qilish yoki ularga aralashishni aniqlaydi.
  PCI DSS Requirement 10.2.6 audit loglarini ishga tushirish, to'xtatish yoki pauza qilishni loglashni talab qiladi.
  Event 1100 (audit log servisi o'chirildi), 1102 (audit log tozalandi),
  1104 (xavfsizlik logi to'ldi) va 4719 (tizim audit siyosati o'zgartirildi) ni kuzatadi.
  Bu HIGH darajadagi hodisa - audit loglarini o'chirish hujumchining izlarini yashirayotgani yoki
  insider tahdid faoliyatining kuchli indikatoridir.
  False positive: rejalashtirilgan tizim maintenance ishlari, qonuniy GPO audit siyosati o'zgarishlari.
  Triage: DARHOL o'zgarish avtorizatsiya qilinganini tekshiring, kim o'zgartirganini aniqlang,
  yondosh vaqt oralig'idagi shubhali faoliyatni ko'rib chiqing, incident response ga eskalatsiya qiling.
description_ru: |
  Обнаруживает остановку, приостановку или вмешательство в работу служб журналов аудита в системах Windows.
  PCI DSS Requirement 10.2.6 требует логирования инициализации, остановки или приостановки журналов аудита.
  Отслеживает Event 1100 (служба журнала аудита остановлена), 1102 (журнал аудита очищен),
  1104 (журнал безопасности переполнен) и 4719 (изменена системная политика аудита).
  Это событие уровня HIGH - отключение журналов аудита является сильным индикатором того,
  что атакующий заметает следы, или инсайдерской активности.
  False positives: плановое обслуживание системы, легитимные изменения политики аудита через GPO.
  Triage: НЕМЕДЛЕННО проверьте, было ли изменение авторизовано, выясните, кто его внёс,
  просмотрите соседний временной интервал на предмет подозрительной активности, эскалируйте в incident response.
description_en: |
  Detects stopping, pausing, or tampering with audit log services on Windows systems.
  PCI DSS Requirement 10.2.6 requires logging of initialization, stopping, or pausing of audit logs.
  Monitors Event 1100 (audit log service shutdown), 1102 (audit log cleared),
  1104 (security log is full), and 4719 (system audit policy was changed).
  This is a HIGH severity event - disabling audit logs is a strong indicator of
  an attacker covering their tracks or insider threat activity.
  False positives: Planned system maintenance, legitimate GPO audit policy changes.
  Triage: IMMEDIATELY verify if change was authorized, check who made the change,
  review adjacent timeline for suspicious activity, escalate to incident response.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.code IN ("1100", "1102", "1104", "4719", "4612")
  | EVAL event_meaning = CASE(
      event.code == "1100", "audit_service_shutdown",
      event.code == "1102", "audit_log_cleared",
      event.code == "1104", "security_log_full",
      event.code == "4719", "audit_policy_changed",
      event.code == "4612", "audit_log_not_saved",
      "unknown_audit_event"
    )
  | STATS
      audit_events       = COUNT(*),
      event_types        = VALUES(event_meaning),
      event_codes        = VALUES(event.code),
      actors             = VALUES(winlog.event_data.SubjectUserName),
      affected_policies  = VALUES(winlog.event_data.CategoryId)
    BY agent_id, host.name,
       event_meaning,
       bucket = DATE_TRUNC(5 minutes, @timestamp)
  | EVAL severity_level = CASE(
      event_meaning == "audit_log_cleared",    "critical",
      event_meaning == "audit_service_shutdown","critical",
      event_meaning == "audit_policy_changed", "high",
      event_meaning == "security_log_full",    "high",
      "medium"
    )
  | EVAL risk_score = CASE(
      event_meaning == "audit_log_cleared",     95,
      event_meaning == "audit_service_shutdown", 90,
      event_meaning == "audit_policy_changed",   75,
      event_meaning == "security_log_full",       70,
      50
    )
  | KEEP agent_id, bucket, host.name, event_meaning, audit_events,
         event_types, event_codes, actors, affected_policies,
         severity_level, risk_score
  | SORT risk_score DESC
enabled: false
tags:
  - pci_dss
  - audit_tampering
  - log_integrity
  - windows
  - critical
severity: high
risk_score: 90
references:
  - "PCI DSS v3.2.1 Requirement 10.2.6: Initialization, stopping, or pausing of the audit logs"
  - "PCI DSS v3.2.1 Requirement 10.5: Secure audit trails so they cannot be altered"
  - "https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventID=1102"
pci_dss: ["10.2.6", "10.5", "10.5.2"]
nist: ["AU-5","AU-9","SI-12","IR-4"]
gdpr: ["5.1.f", "32", "33"]
mitre_attack:
  TA0005:
    T1070: ["T1070.001"]
    T1562: ["T1562.002"]