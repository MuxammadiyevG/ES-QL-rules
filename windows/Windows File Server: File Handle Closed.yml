rule_id: dab0c06e-db71-4fbf-af40-1831eb9eff1b
name_uz: "Windows File Server: Fayl Handle Yopildi"
name_ru: "Windows File Server: закрытие дескриптора файла"
name_en: "Windows File Server: File Handle Closed"
description_uz: |
  Ushbu qoida Windows File Server’da fayl handle yopilganini aniqlaydi.
  4658 hodisasi handle closed holatini bildiradi. Bu eventda file path ko‘pincha
  bo‘sh bo‘lishi mumkin, shuning uchun `HandleId` orqali 4656/4663 bilan
  correlation qilish tavsiya etiladi.
description_ru: |
  Это правило выявляет закрытие дескриптора файла на Windows File Server.
  Событие 4658 обозначает состояние handle closed. В этом событии file path часто
  может быть пустым, поэтому рекомендуется выполнять корреляцию с 4656/4663
  по `HandleId`.
description_en: |
  This rule detects that a file handle has been closed on a Windows File Server.
  The 4658 event indicates the handle closed state. In this event the file path can often
  be empty, therefore correlating with 4656/4663 via `HandleId`
  is recommended.
type: esql
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
    | WHERE @timestamp >= NOW() - 5 minute
    | WHERE winlog.channel == "Security"
      AND event.code == "4658"
    | EVAL
        user_account = CONCAT(winlog.event_data.SubjectDomainName, "\\", winlog.event_data.SubjectUserName),
        process_name = winlog.event_data.ProcessName,
        handle_id = winlog.event_data.HandleId,
        host_name = host.name
    | WHERE handle_id IS NOT NULL
    | KEEP
        @timestamp,
        agent_id,
        host_name,
        user_account,
        process_name,
        handle_id,
        event.code,
        event.action

enabled: true
tags:
  - windows
  - file-server
  - file-close
  - handle-closed
severity: low
risk_score: 15
references:
  - "https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4658"
nist: ["AC-2", "AU-2", "AU-6", "AU-12"]
pci_dss: ["10.2.1", "10.2.2", "10.2.6"]
gdpr: ["32.1.b"]
mitre_attack: []
