rule_id: 46a1148a-64f5-4bc6-bb69-573e4faf8b5e
name_uz: "Domain Controller'ga qarshi AD Password Spray (4625)"
name_ru: "AD Password Spray против контроллера домена (4625)"
name_en: "AD Password Spray Against Domain Controller (4625)"
description_uz: |
  Ushbu qoida credential access texnikasiga tegishli bo'lib, bitta manbadan ko'p akkauntga muvaffaqiyatsiz kirish urinishlarini aniqlaydi.
  Password spray AD uchun xavfli, chunki past shovqinli usul bilan ko'plab akkauntlardan birini egallab olish va keyin lateral movement boshlash mumkin.
  Qonuniy holatlar: noto'g'ri konfiguratsiyalangan ilova, eski credential bilan ishlayotgan servis, ommaviy parol yangilashdan keyingi sinxronizatsiya muammosi.
  SOC triage bosqichlari:
  - Hujumchi sifatida ko'rinayotgan manbani (`src_ip`) va urinishlar aktorini aniqlang.
  - Change ticket yoki rejalashtirilgan authentication testi mavjudligini tekshiring.
  - `src_ip` reputatsiyasi, geolokatsiyasi va tarmoq segmentini tekshiring.
  - Nishonga olingan akkauntlarning guruh a'zoligi, ayniqsa privileged hisoblarni tekshiring.
  - Tasdiqlansa manba IP ni bloklash, ta'sirlangan akkauntlarni reset qilish va qo'shimcha MFA/conditional policy ni kuchaytirish choralarini ko'ring.
description_ru: |
  Данное правило относится к технике credential access и выявляет неудачные попытки входа с одного источника на множество учётных записей.
  Password spray опасен для AD, поскольку малошумным способом позволяет захватить одну из множества учётных записей и затем начать lateral movement.
  Легитимные случаи: неправильно сконфигурированное приложение, служба, работающая со старыми учётными данными, проблема синхронизации после массовой смены паролей.
  Этапы SOC triage:
  - Определите источник (`src_ip`), выглядящий как атакующий, и актора попыток.
  - Проверьте наличие change ticket или запланированного теста аутентификации.
  - Проверьте репутацию, геолокацию и сетевой сегмент `src_ip`.
  - Проверьте членство в группах атакуемых учётных записей, особенно привилегированные учётные записи.
  - При подтверждении рассмотрите меры по блокировке исходного IP, сбросу затронутых учётных записей и усилению дополнительной MFA/conditional policy.
description_en: |
  This rule relates to the credential access technique and detects failed logon attempts from a single source against many accounts.
  Password spray is dangerous for AD because a low-noise method makes it possible to take over one of many accounts and then start lateral movement.
  Legitimate cases: a misconfigured application, a service running with old credentials, a synchronization problem after a mass password update.
  SOC triage steps:
  - Identify the source that appears to be the attacker (`src_ip`) and the actor behind the attempts.
  - Check whether a change ticket or a planned authentication test exists.
  - Check the reputation, geolocation and network segment of `src_ip`.
  - Check the group membership of the targeted accounts, especially privileged accounts.
  - If confirmed, consider blocking the source IP, resetting the affected accounts and strengthening additional MFA/conditional policy.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | EVAL hostn = winlog.computer_name
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.SubjectUserName, winlog.event_data.TargetUserName)
  | EVAL target_user = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.SamAccountName)
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, winlog.event_data.IpAddress)
  | EVAL logon_type = COALESCE(winlog.event_data.LogonType, "")
  // host-filtri olib tashlandi - barcha hostlarda ishlaydi (DC-only kerak bolsa qolda yoqing)
  | WHERE event.code == "4625"
  | WHERE src_ip IS NOT NULL
  | WHERE src_ip NOT IN ("-", "::1", "127.0.0.1")
  | STATS fail_count = COUNT(*), distinct_users = COUNT_DISTINCT(target_user) BY agent_id, src_ip, hostn, logon_type
  | WHERE fail_count >= 20 AND distinct_users >= 8
  | EVAL dyn_risk = CASE(fail_count >= 100 OR distinct_users >= 30, 95, fail_count >= 50 OR distinct_users >= 15, 90, 85)
  | KEEP agent_id, src_ip, hostn, logon_type, fail_count, distinct_users, dyn_risk
  | SORT dyn_risk DESC, fail_count DESC, distinct_users DESC
  | LIMIT 200
enabled: false
tags:
  - AD
  - Authentication
  - Credential Access
severity: high
risk_score: 85
references:
  - "https://attack.mitre.org/techniques/T1110/003/"
mitre_attack:
  TA0006:
    T1110: [T1110.003]
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
