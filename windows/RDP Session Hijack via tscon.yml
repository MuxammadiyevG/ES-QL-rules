rule_id: 4eaa2e36-300b-40e5-823a-6d5458701580
name: RDP Session Hijack via tscon
description: |
  Ushbu qoida RDP sessiya o'g'irlashni aniqlaydi: `tscon.exe` boshqa sessiyaga ulanish uchun
  ishlatilsa (ko'pincha SYSTEM huquqida, `/dest:` bilan) — hujumchi boshqa foydalanuvchining
  faol RDP sessiyasini parolsiz egallab oladi.
  SOC triage:
  - `command_line` da boshqa sessiya ID/`/dest:` bormi? Kim ishga tushirgan (`user`)?
  - SYSTEM yoki admin tomonidan bo'lsa — sessiya hijack ehtimoli yuqori.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "1"
  | EVAL img = COALESCE(winlog.event_data.Image, "-")
  | EVAL cmd = COALESCE(winlog.event_data.CommandLine, "-")
  | EVAL pimg = COALESCE(winlog.event_data.ParentImage, "-")
  | EVAL actor = COALESCE(winlog.event_data.User, "-")
  | WHERE TO_LOWER(img) RLIKE ".*\\\\tscon.exe" OR TO_LOWER(cmd) RLIKE ".*tscon.*/dest:.*"
  | STATS
      exec_count = COUNT(*),
      command_lines = VALUES(cmd),
      parent_images = VALUES(pimg),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE exec_count >= 1
  | EVAL dyn_risk = 88
  | KEEP agent_id, bucket, winlog.computer_name, exec_count, command_lines, parent_images,
      users, dyn_risk, first_seen, last_seen
  | SORT exec_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.lateral-movement
  - attack.t1563.002
  - RDP
severity: high
risk_score: 88
mitre_attack:
  TA0008:
    T1563: ["T1563.002"]
nist: ["AC-17", "AU-2", "AU-12", "SI-4"]
pci_dss: ["10.2.5", "8.1.6"]
gdpr: ["32.1.a"]
