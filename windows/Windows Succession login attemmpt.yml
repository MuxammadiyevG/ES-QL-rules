rule_id: ebfefa1b-33a8-4582-8cb6-a2b8353228ab
name_uz: "Windows Akkaunti Bir Nechta Manbadan Nishonga Olindi (Taqsimlangan Brute Force)"
name_ru: "Атака на учётную запись Windows с нескольких источников (распределённый brute force)"
name_en: "Windows Account Targeted From Multiple Sources (Distributed Brute Force)"
description_uz: |
  Ushbu qoida bitta akkauntga BIR NECHA xil manbadan (`src_ip`) muvaffaqiyatsiz logon (4625)
  urinishlarini aniqlaydi — taqsimlangan brute force / credential stuffing belgisi. Bitta
  akkauntning qisqa vaqtda 3+ xil IP'dan ko'p marta xato kirishi shubhali.
  SOC triage:
  - `username` nishon akkaunt, `source_ips` qaysi manbalar (reputatsiya/geolokatsiya)?
  - Akkaunt imtiyozlimi (Domain Admins)?
  - Tasdiqlansa: manbalarni bloklang, akkauntni himoyalang (MFA/reset), monitoringni kuchaytiring.
description_ru: |
  Это правило выявляет неуспешные попытки входа (4625) к одной учётной записи с НЕСКОЛЬКИХ разных источников (`src_ip`)
  — признак распределённого перебора паролей (brute force) / credential stuffing. Многократные
  неудачные входы одной учётной записи с 3+ разных IP за короткое время подозрительны.
  SOC-триаж:
  - `username` — целевая учётная запись, какие источники в `source_ips` (репутация/геолокация)?
  - Является ли учётная запись привилегированной (Domain Admins)?
  - При подтверждении: заблокируйте источники, защитите учётную запись (MFA/сброс), усильте мониторинг.
description_en: |
  This rule detects failed logon (4625) attempts against a single account from MULTIPLE different sources (`src_ip`)
  — an indicator of distributed brute force / credential stuffing. Many failed
  logons for a single account from 3+ different IPs in a short time are suspicious.
  SOC triage:
  - `username` is the target account, which sources are in `source_ips` (reputation/geolocation)?
  - Is the account privileged (Domain Admins)?
  - If confirmed: block the sources, protect the account (MFA/reset), increase monitoring.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4625"
  | EVAL username   = winlog.event_data.TargetUserName
  | EVAL src_ip     = COALESCE(winlog.event_data.IpAddress, "-")
  | EVAL logon_type = COALESCE(winlog.event_data.LogonType, "-")
  | EVAL status     = COALESCE(winlog.event_data.Status, "-")
  | WHERE username IS NOT NULL AND NOT username LIKE "*$"
  | WHERE src_ip != "-" AND src_ip != "::1" AND src_ip != "127.0.0.1"
  | STATS
      failure_count = COUNT(*),
      unique_sources = COUNT_DISTINCT(src_ip),
      source_ips    = VALUES(src_ip),
      logon_types   = VALUES(logon_type),
      status_codes  = VALUES(status),
      first_seen    = MIN(@timestamp),
      last_seen     = MAX(@timestamp)
    BY agent_id, username, bucket = DATE_TRUNC(15 minutes, @timestamp)
  | WHERE failure_count >= 10 AND unique_sources >= 3
  | EVAL dyn_risk = CASE(unique_sources >= 10, 90, unique_sources >= 5, 85, 80)
  | KEEP agent_id, username, bucket, failure_count, unique_sources, source_ips, logon_types,
      status_codes, dyn_risk, first_seen, last_seen
  | SORT dyn_risk DESC, failure_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.credential-access
  - attack.t1110
  - detection.emerging-threats
severity: high
risk_score: 85
mitre_attack:
  TA0006:
    T1110: []
nist: ["AC-17", "AU-2", "AU-12", "SI-4"]
pci_dss: ["10.2.5", "8.1.6"]
gdpr: ["32.1.a"]
