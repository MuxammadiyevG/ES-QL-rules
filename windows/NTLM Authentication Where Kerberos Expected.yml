rule_id: 221d1387-706c-41e0-828c-f3c3f79cde65
name_uz: "Kerberos kutilgan joyda NTLM autentifikatsiyasi"
name_ru: "NTLM-аутентификация там, где ожидается Kerberos"
name_en: "NTLM Authentication Where Kerberos Expected"
description_uz: |
  Ushbu qoida credential access va lateral movement texnikalariga bog'liq bo'lib, `NTLM Authentication Where Kerberos Expected` kontekstidagi shubhali Active Directory faoliyatini aniqlaydi.
  Bu turdagi hodisa AD muhitida hujumchiga ruxsatsiz kirishni mustahkamlash, hisoblarni egallash yoki boshqaruv huquqlarini oshirish imkonini berishi mumkinligi sababli xavfli hisoblanadi.
  Qonuniy holatlar sifatida rejalashtirilgan administrativ ishlar, change/deployment jarayonlari, IAM sinxronizatsiyasi yoki servis konfiguratsiya yangilanishlari uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `actor` va `target_user` (yoki target obyekt) ni aniq identifikatsiya qiling.
  - O'zgarish/kirish uchun tasdiqlangan change ticket yoki deployment yozuvi borligini tekshiring.
  - `src_ip` manzili, manba host va tarmoq segmentining legitimligini tekshiring.
  - Ta'sirlangan akkaunt yoki obyektning guruh a'zoligi, ayniqsa imtiyozli guruhlar bilan bog'liqligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa tezkor containment bajaring: manbani cheklang, credentiallarni yangilang va ta'sir doirasini izolyatsiya qiling.
description_ru: |
  Это правило связано с техниками credential access и горизонтального перемещения и обнаруживает подозрительную активность Active Directory в контексте `NTLM Authentication Where Kerberos Expected`.
  Событие такого типа считается опасным, поскольку в среде AD оно может позволить атакующему закрепить несанкционированный доступ, захватить учётные записи или повысить административные права.
  К легитимным случаям могут относиться плановые административные работы, процессы change/deployment, синхронизация IAM или обновления конфигурации сервисов.
  Шаги SOC triage:
  - Точно идентифицируйте `actor` и `target_user` (или целевой объект) в событии.
  - Проверьте наличие утверждённого change ticket или записи о deployment для изменения/доступа.
  - Проверьте легитимность адреса `src_ip`, исходного хоста и сегмента сети.
  - Проверьте членство затронутой учётной записи или объекта в группах, особенно связь с привилегированными группами.
  - При подтверждении нелегитимной активности выполните оперативный containment: ограничьте источник, обновите учётные данные и изолируйте зону воздействия.
description_en: |
  This rule relates to credential access and lateral movement techniques and detects suspicious Active Directory activity in the context of `NTLM Authentication Where Kerberos Expected`.
  This type of event is considered dangerous because in an AD environment it can allow an attacker to consolidate unauthorized access, take over accounts or escalate administrative rights.
  Legitimate cases may include planned administrative work, change/deployment processes, IAM synchronization or service configuration updates.
  SOC triage steps:
  - Precisely identify the `actor` and `target_user` (or the target object) in the event.
  - Check whether an approved change ticket or deployment record exists for the change/access.
  - Verify the legitimacy of the `src_ip` address, the source host and the network segment.
  - Check the group membership of the affected account or object, especially any link to privileged groups.
  - If illegitimate activity is confirmed, perform rapid containment: restrict the source, rotate the credentials and isolate the scope of impact.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | EVAL hostn = winlog.computer_name
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.SubjectUserName)
  | EVAL target_user = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.SamAccountName)
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, winlog.event_data.IpAddress)
  // host-filtri olib tashlandi - barcha hostlarda ishlaydi (DC-only kerak bolsa qolda yoqing)
  | WHERE NOT actor LIKE "*$"
  | WHERE event.code IN ("4624", "4776")
  | EVAL 
      target_user = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.TargetUserName, "Unknown"),
      source_ip = COALESCE(winlog.event_data.IpAddress, winlog.event_data.IpAddress, winlog.event_data.Workstation, "Unknown"),
      auth_package = COALESCE(winlog.event_data.AuthenticationPackageName, winlog.event_data.PackageName, "Unknown"),
      logon_type = COALESCE(winlog.event_data.LogonType, "Unknown"),
      logon_process = COALESCE(winlog.event_data.LogonProcessName, "Unknown")
  /* Filter for NTLM authentication */
  | WHERE TO_LOWER(auth_package) RLIKE "ntlm"
    AND logon_type IN ("3", "9", "10")
  /* Exclude computer accounts and system accounts */
  | WHERE NOT (TO_LOWER(target_user) RLIKE "(\\$$|system|anonymous)")
  /* Exclude events where username was not resolved (NTLM pass-through artefact) */
  | WHERE target_user != "-" AND target_user != "Unknown"
  | STATS 
      ntlm_auth_count = COUNT(*),
      unique_sources = COUNT_DISTINCT(source_ip),
      source_ips = VALUES(source_ip),
      logon_types = VALUES(logon_type),
      logon_processes = VALUES(logon_process),
      first_auth = MIN(@timestamp),
      last_auth = MAX(@timestamp)
    BY agent_id, winlog.computer_name, target_user, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE ntlm_auth_count >= 5
  | EVAL 
      risk_level = CASE(
        unique_sources >= 10, "High - Multiple Sources Using NTLM",
        ntlm_auth_count >= 20, "Medium - Repeated NTLM Usage",
        "Low - Limited NTLM Activity"
      )
  | KEEP agent_id, bucket, winlog.computer_name, target_user, ntlm_auth_count, unique_sources,
      source_ips, logon_types, risk_level, first_auth, last_auth
  | SORT ntlm_auth_count DESC
  | LIMIT 200
enabled: false
tags:
  - attack.lateral-movement
  - attack.credential-access
  - attack.t1550.002
  - detection.anomaly
severity: high
risk_score: 75
mitre_attack:
  TA0008:
    T1550: ["T1550.002"]
  TA0006:
    T1003: []
nist: ["AC-17", "AU-2", "AU-12", "SI-4"]
pci_dss: ["10.2.5", "8.1.6"]
gdpr: ["32.1.a"]
