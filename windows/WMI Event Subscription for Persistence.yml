rule_id: 8d18b5cc-f1a2-408d-8916-033620f2a2cd
name_uz: "Persistence uchun WMI Event Subscription"
name_ru: "Подписка на события WMI для закрепления"
name_en: "WMI Event Subscription for Persistence"
description_uz: |
  Ushbu qoida WMI event subscription persistence'ni aniqlaydi: 5861 (va 5859/5860)
  "Microsoft-Windows-WMI-Activity/Operational" kanalida. Permanent WMI consumer + filter
  binding fileless, reboot'ga chidamli persistence beradi.
  Eslatma: WMI maydonlari sizning indeksingizda `winlog.user_data.*` ostida (Operation,
  Namespace, User, CONSUMER, PossibleCause, Query).
  SOC triage:
  - `operations`/`consumers`/`namespaces` — qanday consumer (CommandLine/ActiveScript)?
  - Tasdiqlanmasa: __EventConsumer/__FilterToConsumerBinding'ni o'chiring, IR.
description_ru: |
  Это правило выявляет закрепление через WMI event subscription: 5861 (и 5859/5860)
  в канале "Microsoft-Windows-WMI-Activity/Operational". Постоянный WMI consumer + filter
  binding даёт бесфайловое, устойчивое к перезагрузке закрепление.
  Примечание: поля WMI в вашем индексе находятся под `winlog.user_data.*` (Operation,
  Namespace, User, CONSUMER, PossibleCause, Query).
  SOC-триаж:
  - `operations`/`consumers`/`namespaces` — какой это consumer (CommandLine/ActiveScript)?
  - Если не подтверждено: удалите __EventConsumer/__FilterToConsumerBinding, IR.
description_en: |
  This rule detects WMI event subscription persistence: 5861 (and 5859/5860)
  in the "Microsoft-Windows-WMI-Activity/Operational" channel. A permanent WMI consumer + filter
  binding provides fileless, reboot-resistant persistence.
  Note: in your index the WMI fields are under `winlog.user_data.*` (Operation,
  Namespace, User, CONSUMER, PossibleCause, Query).
  SOC triage:
  - `operations`/`consumers`/`namespaces` — what kind of consumer (CommandLine/ActiveScript)?
  - If not confirmed: delete the __EventConsumer/__FilterToConsumerBinding, IR.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-WMI-Activity/Operational"
  | WHERE event.code IN ("5859", "5860", "5861")
  | EVAL operation = COALESCE(winlog.user_data.Operation, "-")
  | EVAL namespace = COALESCE(winlog.user_data.Namespace, "-")
  | EVAL wmi_user  = COALESCE(winlog.user_data.User, "-")
  | EVAL consumer  = COALESCE(winlog.user_data.CONSUMER, winlog.user_data.PossibleCause, "-")
  | EVAL wmi_query = COALESCE(winlog.user_data.Query, "-")
  | EVAL event_type = CASE(
      event.code == "5859", "WMI Activity",
      event.code == "5860", "Temporary Subscription",
      event.code == "5861", "Permanent Subscription/Binding",
      "Unknown")
  | STATS
      wmi_operations = COUNT(*),
      operations = VALUES(operation),
      namespaces = VALUES(namespace),
      consumers  = VALUES(consumer),
      queries    = VALUES(wmi_query),
      event_types = VALUES(event_type),
      users      = VALUES(wmi_user),
      first_operation = MIN(@timestamp),
      last_operation  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE wmi_operations >= 1
  | EVAL dyn_risk = 85
  | KEEP agent_id, bucket, winlog.computer_name, wmi_operations, operations, namespaces,
      consumers, queries, event_types, users, dyn_risk, first_operation, last_operation
  | SORT wmi_operations DESC
  | LIMIT 200
enabled: true
tags:
  - attack.persistence
  - attack.execution
  - attack.t1546.003
  - detection.emerging-threats
severity: high
risk_score: 75
mitre_attack:
  TA0003:
    T1546: ["T1546.003"]
  TA0002:
    T1047: []
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
