rule_id: 19eb467d-89df-4f91-9735-7aa5791bf094
name: Security / AV Process Terminated
description: |
  Ushbu qoida xavfsizlik/AV jarayonining to'xtatilishini aniqlaydi (Sysmon 5): MsMpEng,
  MsSense, SecurityHealthService, Sysmon, yoki uchinchi tomon EDR (CrowdStrike/Cylance/
  CarbonBlack). Bu himoyani o'chirish belgisi (T1562.001).
  SOC triage:
  - `images` qaysi himoya jarayoni to'xtadi? Reboot/update emasmi? Kim sababchi?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "5"
  | EVAL img = TO_LOWER(COALESCE(winlog.event_data.Image, "-"))
  | EVAL actor = COALESCE(winlog.event_data.User, "-")
  | WHERE img RLIKE ".*(msmpeng|mssense|sensecncproxy|securityhealthservice|msmpsvc|nissrv|windefend|csfalconservice|csagent|cylancesvc|cb\\.exe|carbonblack|sentinelagent|xagt|sysmon|sysmon64).exe"
  | STATS
      hits = COUNT(*),
      images = VALUES(img),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = 88
  | KEEP agent_id, bucket, winlog.computer_name, hits, images, users, dyn_risk, first_seen, last_seen
  | SORT hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1562.001
  - Sysmon
severity: high
risk_score: 88
mitre_attack:
  TA0005:
    T1562: ["T1562.001"]
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
