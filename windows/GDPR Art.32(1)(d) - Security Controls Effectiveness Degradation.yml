rule_id: f07abf8c-9698-4152-b6e2-119dff0baea9
name_uz: "GDPR Art.32(1)(d) - Xavfsizlik nazorat vositalari samaradorligining pasayishi"
name_ru: "GDPR Art.32(1)(d) - Снижение эффективности мер безопасности"
name_en: "GDPR Art.32(1)(d) - Security Controls Effectiveness Degradation"
description_uz: |
  Muntazam sinovdan o'tkazilishi va baholanishi kerak bo'lgan xavfsizlik nazorat vositalarining
  buzilishi yoki ishdan chiqishini GDPR 32(1)(d)-moddasiga muvofiq aniqlaydi; ushbu modda qayta ishlash
  xavfsizligini ta'minlovchi texnik va tashkiliy choralar samaradorligini muntazam sinash,
  tekshirish va baholash jarayonini talab qiladi.
  Kuzatadi: antivirus/EDR jimib qolishi, IDS/IPS to'xtashi, firewall siyosati xatoliklari,
  log yig'ish muammosidan darak beruvchi audit log hajmining pasayishi va Windows Defender
  real vaqt himoyasi o'chirilgan hodisalari (Event 5001, 5010, 5012).
  Trigger: Kritik xavfsizlik vositasi o'chirilgan yoki kutilgan oynada nol hodisa qaytarmoqda.
  False positive: Vosita yangilanishi, agent qayta ishga tushishi, GPO orqali qonuniy konfiguratsiya o'zgarishlari.
  Triage: Xavfsizlik vositasidagi o'zgarish change management orqali tasdiqlanganini tekshiring,
  boshqaruv konsolida agent holatini tekshiring, ruxsatsiz bo'lsa nazoratni darhol tiklang,
  Art.32(1)(d) muvofiqlik dalili sifatida bo'shliqni hujjatlashtiring.
description_ru: |
  Обнаруживает деградацию или отказ мер безопасности, которые должны регулярно тестироваться
  и оцениваться согласно статье 32(1)(d) GDPR, требующей наличия процесса регулярного
  тестирования, оценки и анализа эффективности технических и организационных
  мер обеспечения безопасности обработки.
  Отслеживает: замолкание antivirus/EDR, остановку IDS/IPS, сбои политик firewall,
  падение объёма журналов аудита, указывающее на проблемы сбора логов, и события
  отключения защиты в реальном времени Windows Defender (Event 5001, 5010, 5012).
  Триггер: Критическое средство защиты отключено или не присылает события в ожидаемом окне.
  Ложные срабатывания: Обновления средств защиты, перезапуски агентов, легитимные изменения конфигурации через GPO.
  Разбор: Проверьте, было ли изменение средства защиты санкционировано через управление изменениями,
  проверьте состояние агента в консоли управления, немедленно восстановите меры защиты при отсутствии санкции,
  задокументируйте пробел как свидетельство соответствия Art.32(1)(d).
description_en: |
  Detects degradation or failure of security controls that should be regularly tested
  and evaluated per GDPR Article 32(1)(d), which requires a process for regularly
  testing, assessing and evaluating the effectiveness of technical and organisational
  measures for ensuring the security of processing.
  Monitors: antivirus/EDR going silent, IDS/IPS stopping, firewall policy failures,
  audit log volume drops indicating log collection issues, and Windows Defender
  real-time protection disabled events (Event 5001, 5010, 5012).
  Trigger: Critical security tool disabled or reporting zero events for expected window.
  False positives: Tool upgrades, agent restarts, legitimate config changes via GPO.
  Triage: Verify if security tool change was authorized via change management,
  check agent health in management console, restore controls immediately if unauthorized,
  document the gap for Art.32(1)(d) compliance evidence.
type: esql
params: '{}'
schedule_interval: 15m
index:
  - logs-winlog*
  - logs-updive.audit*
query_language: esql
query: |
  FROM logs-winlog*, logs-updive.audit*
  | WHERE (
      event.code IN ("5001", "5004", "5010", "5012", "5013",
                     "3002", "3007",
                     "2003", "2004")
      OR
      (event.dataset == "updive-audit.log"
        AND event.action == "stopped-service"
        AND auditd.data.unit IN ("auditd", "firewalld", "fail2ban",
                                  "ossec", "wazuh-agent", "clamav"))
    )
  | EVAL control_type = CASE(
      event.code IN ("5001", "5004", "5010", "5012", "5013"), "antivirus_realtime_disabled",
      event.code IN ("3002", "3007"),                           "av_engine_failure",
      event.code IN ("2003", "2004"),                           "firewall_disabled",
      auditd.data.unit == "auditd",                              "linux_audit_daemon_stopped",
      auditd.data.unit == "firewalld",                          "linux_firewall_stopped",
      auditd.data.unit IN ("ossec", "wazuh-agent"),             "linux_hids_stopped",
      auditd.data.unit == "fail2ban",                           "linux_brute_force_protection_stopped",
      "unknown_security_control_event"
    )
  | STATS
      control_events       = COUNT(*),
      unique_control_types = COUNT_DISTINCT(control_type),
      disabled_controls    = VALUES(control_type),
      affected_systems     = VALUES(host.name),
      actors               = VALUES(winlog.user.name)
    BY agent_id, host.name,
       control_type,
       bucket = DATE_TRUNC(15 minutes, @timestamp)
  | EVAL gdpr_32d_status = CASE(
      control_type == "antivirus_realtime_disabled",
        "CRITICAL - real-time protection disabled; Art.32 technical measure non-operational",
      control_type == "linux_audit_daemon_stopped",
        "CRITICAL - audit capability lost; Art.32(1)(d) evaluation process impaired",
      control_type == "firewall_disabled",
        "CRITICAL - network boundary control disabled; personal data systems exposed",
      control_type == "linux_hids_stopped",
        "HIGH - host intrusion detection stopped; Art.32 monitoring measure non-operational",
      "MEDIUM - security control state change; verify Art.32 measure effectiveness"
    )
  | EVAL severity_level = CASE(
      control_type IN ("antivirus_realtime_disabled",
                        "linux_audit_daemon_stopped",
                        "firewall_disabled"),            "critical",
      control_type IN ("linux_hids_stopped",
                        "linux_brute_force_protection_stopped",
                        "av_engine_failure"),             "high",
      "medium"
    )
  | EVAL risk_score = CASE(
      control_type == "antivirus_realtime_disabled",  90,
      control_type == "linux_audit_daemon_stopped",   90,
      control_type == "firewall_disabled",             88,
      control_type == "linux_hids_stopped",            70,
      50
    )
  | KEEP agent_id, bucket, host.name, control_type, control_events,
         unique_control_types, disabled_controls, affected_systems,
         actors, gdpr_32d_status, severity_level, risk_score
  | SORT risk_score DESC
enabled: false
tags:
  - gdpr
  - security_controls
  - control_effectiveness
  - art32
severity: high
risk_score: 80
references:
  - "GDPR Article 32(1)(d): Process for regularly testing, assessing and evaluating effectiveness of measures"
  - "GDPR Article 25(1): Data protection by agent_id, design - technical measures must remain operational"
  - "GDPR Article 32(1)(b): Ongoing confidentiality and integrity of processing systems"
gdpr: ["32.1.d", "32.1.b", "25.1"]
nist: ["CA-2", "CA-7", "SI-4", "AU-5"]
pci_dss: ["5.3", "11.5", "6.1"]
mitre_attack:
  TA0005:
    T1562: ["T1562.001", "T1562.002", "T1562.004"]