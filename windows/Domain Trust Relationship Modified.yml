rule_id: c9a36b9d-b738-4161-b622-c76c7d4292f3
name_uz: "Domen ishonch munosabati o'zgartirildi"
name_ru: "Изменены доверительные отношения домена"
name_en: "Domain Trust Relationship Modified"
description_uz: |
  Ushbu qoida persistence va defense evasion texnikalariga bog'liq bo'lib, `Domain Trust Relationship Modified` kontekstidagi shubhali Active Directory faoliyatini aniqlaydi.
  Bu turdagi hodisa AD muhitida hujumchiga ruxsatsiz kirishni mustahkamlash, hisoblarni egallash yoki boshqaruv huquqlarini oshirish imkonini berishi mumkinligi sababli xavfli hisoblanadi.
  Qonuniy holatlar sifatida rejalashtirilgan administrativ ishlar, change/deployment jarayonlari, IAM sinxronizatsiyasi yoki servis konfiguratsiya yangilanishlari uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `actor` va `target_user` (yoki target obyekt) ni aniq identifikatsiya qiling.
  - O'zgarish/kirish uchun tasdiqlangan change ticket yoki deployment yozuvi borligini tekshiring.
  - `src_ip` manzili, manba host va tarmoq segmentining legitimligini tekshiring.
  - Ta'sirlangan akkaunt yoki obyektning guruh a'zoligi, ayniqsa imtiyozli guruhlar bilan bog'liqligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa tezkor containment bajaring: manbani cheklang, credentiallarni yangilang va ta'sir doirasini izolyatsiya qiling.
description_ru: |
  Это правило связано с техниками закрепления и обхода защиты (defense evasion) и выявляет подозрительную активность Active Directory в контексте `Domain Trust Relationship Modified`.
  Событие такого типа считается опасным, поскольку в среде AD оно может позволить злоумышленнику закрепить несанкционированный доступ, захватить учётные записи или повысить административные права.
  В качестве легитимных сценариев могут встречаться плановые административные работы, процессы change/deployment, синхронизация IAM или обновления конфигурации сервисов.
  Шаги SOC triage:
  - Точно идентифицируйте `actor` и `target_user` (или целевой объект) в событии.
  - Проверьте наличие утверждённого change ticket или записи о deployment для изменения/доступа.
  - Проверьте легитимность адреса `src_ip`, исходного хоста и сегмента сети.
  - Проверьте членство в группах затронутой учётной записи или объекта, особенно связь с привилегированными группами.
  - При подтверждении нелегитимной активности выполните оперативное containment: ограничьте источник, смените учётные данные и изолируйте зону воздействия.
description_en: |
  This rule relates to persistence and defense evasion techniques and detects suspicious Active Directory activity in the `Domain Trust Relationship Modified` context.
  An event of this type is considered dangerous because in an AD environment it may allow an attacker to entrench unauthorized access, take over accounts or elevate administrative rights.
  Legitimate cases may include scheduled administrative work, change/deployment processes, IAM synchronization or service configuration updates.
  SOC triage steps:
  - Precisely identify the `actor` and `target_user` (or target object) in the event.
  - Verify that an approved change ticket or deployment record exists for the change/access.
  - Verify the legitimacy of the `src_ip` address, the source host and the network segment.
  - Check the group membership of the affected account or object, especially any association with privileged groups.
  - If illegitimate activity is confirmed, perform rapid containment: restrict the source, rotate credentials and isolate the scope of impact.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | EVAL hostn = winlog.computer_name
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.SubjectUserName)
  | EVAL target_user = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.SamAccountName)
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, winlog.event_data.IpAddress)
  // host-filtri olib tashlandi - barcha hostlarda ishlaydi (DC-only kerak bolsa qolda yoqing)
  | WHERE NOT actor LIKE "*$"
  | WHERE event.code IN ("4706", "4707")
  | EVAL 
      modifier = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.SubjectUserName, "Unknown"),
      trust_name = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.SamAccountName, "Unknown"),
      trust_sid = "Unknown",
      trust_type = "Unknown",
      trust_direction = "Unknown",
      trust_attributes = "Unknown",
      event_type = CASE(
        event.code == "4706", "Trust Created",
        event.code == "4707", "Trust Removed",
        "Unknown"
      )
  | STATS 
      trust_changes = COUNT(*),
      trusts_modified = VALUES(trust_name),
      trust_sids = VALUES(trust_sid),
      change_types = VALUES(event_type),
      trust_types = VALUES(trust_type),
      trust_directions = VALUES(trust_direction),
      first_change = MIN(@timestamp),
      last_change = MAX(@timestamp)
    BY agent_id, winlog.computer_name, modifier, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE trust_changes >= 1
  | KEEP agent_id, bucket, winlog.computer_name, modifier, trust_changes, trusts_modified,
      trust_sids, change_types, trust_types, trust_directions, first_change, last_change
  | SORT trust_changes DESC
  | LIMIT 200
enabled: false
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1484
  - detection.critical
severity: high
risk_score: 90
mitre_attack:
  TA0004:
    T1484: []
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
