rule_id: 6492db2f-3c8f-49df-a5b6-e3625b399440
name_uz: "Hostdan chiquvchi RDP - lateral harakat"
name_ru: "Исходящий RDP с хоста - горизонтальное перемещение"
name_en: "Outbound RDP From Host - Lateral Movement"
description_uz: |
  Ushbu qoida hostdan CHIQUVCHI RDP ulanishini (WFP 5156, Direction=Outbound, DestPort=3389)
  aniqlaydi. Server yoki ish-stansiyaning boshqa hostga RDP qilishi lateral movement / pivot
  belgisi bo'lishi mumkin (ayniqsa server-dan).
  SOC triage:
  - `application` qaysi jarayon (mstsc.exe normal; boshqa = shubhali), `dest_addresses` qayerga?
  - Manba host odatda RDP klient sifatida ishlatiladimi?
description_ru: |
  Это правило обнаруживает ИСХОДЯЩИЕ RDP-подключения с хоста (WFP 5156, Direction=Outbound, DestPort=3389).
  RDP с сервера или рабочей станции на другой хост может быть признаком горизонтального перемещения / pivot
  (особенно с сервера).
  SOC triage:
  - Какой процесс в `application` (mstsc.exe — норма; иное = подозрительно), куда ведут `dest_addresses`?
  - Используется ли исходный хост обычно как RDP-клиент?
description_en: |
  This rule detects OUTBOUND RDP connections from a host (WFP 5156, Direction=Outbound, DestPort=3389).
  A server or workstation RDP-ing to another host may be a sign of lateral movement / pivot
  (especially from a server).
  SOC triage:
  - Which process is `application` (mstsc.exe is normal; anything else = suspicious), where do `dest_addresses` point?
  - Is the source host normally used as an RDP client?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.code == "5156"
  | EVAL app = COALESCE(winlog.event_data.Application, "-")
  | EVAL dst = COALESCE(winlog.event_data.DestAddress, "-")
  | EVAL dport = COALESCE(winlog.event_data.DestPort, "-")
  | EVAL dir = COALESCE(winlog.event_data.Direction, "-")
  | WHERE dir == "Outbound" AND dport == "3389"
  | WHERE dst != "127.0.0.1" AND dst != "::1"
  | STATS
      conn_count = COUNT(*),
      unique_dests = COUNT_DISTINCT(dst),
      applications = VALUES(app),
      dest_addresses = VALUES(dst),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE conn_count >= 1
  | EVAL dyn_risk = CASE(unique_dests >= 5, 80, 65)
  | KEEP agent_id, bucket, winlog.computer_name, conn_count, unique_dests, applications,
      dest_addresses, dyn_risk, first_seen, last_seen
  | SORT unique_dests DESC, conn_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.lateral-movement
  - attack.t1021.001
  - RDP
  - Network
severity: medium
risk_score: 65
mitre_attack:
  TA0008:
    T1021: ["T1021.001"]
nist: ["AC-17", "AU-2", "AU-12", "SI-4"]
pci_dss: ["10.2.5", "8.1.6"]
gdpr: ["32.1.a"]
