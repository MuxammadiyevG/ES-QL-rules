rule_id: 652e68d7-02b3-418d-9194-39be0f47e7ef
name_uz: "Windows File Server: Detailed File Share orqali Fayl O'qilishi"
name_ru: "Windows File Server: чтение файла через Detailed File Share"
name_en: "Windows File Server: File Read via Detailed File Share"
description_uz: |
  Ushbu qoida Windows File Server SMB share ichida fayl yoki papka o‘qilganini
  aniqlaydi. 5145 hodisasida `ReadData`, `ReadAttributes` yoki `ReadEA`
  accesslari fayl o‘qish yoki papka list qilish holatlarini bildiradi.
description_ru: |
  Это правило выявляет чтение файла или папки внутри SMB-шары Windows File Server.
  В событии 5145 доступы `ReadData`, `ReadAttributes` или `ReadEA`
  означают чтение файла или получение списка папки.
description_en: |
  This rule detects that a file or folder inside a Windows File Server SMB share
  has been read. In the 5145 event, the `ReadData`, `ReadAttributes`, or `ReadEA`
  accesses indicate file read or folder listing operations.
type: esql
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
    | WHERE @timestamp >= NOW() - 5 minute
    | WHERE winlog.channel == "Security"
      AND event.code == "5145"
      AND winlog.event_data.ObjectType == "File"
      AND (
        winlog.event_data.AccessList LIKE "*ReadData*"
        OR winlog.event_data.AccessList LIKE "*ListDirectory*"
        OR winlog.event_data.AccessList LIKE "*ReadAttributes*"
        OR winlog.event_data.AccessList LIKE "*ReadEA*"
        OR winlog.event_data.AccessMask IN ("0x1", "0x120089")
      )
    | WHERE NOT winlog.event_data.ShareName RLIKE ".*SYSVOL$"
    | WHERE NOT winlog.event_data.ShareName RLIKE ".*NETLOGON$"
    | WHERE NOT winlog.event_data.ShareName RLIKE ".*IPC\\$$"
    | WHERE NOT winlog.event_data.SubjectUserName == "CSECLDC$"
    | EVAL
        user_account = CONCAT(winlog.event_data.SubjectDomainName, "\\", winlog.event_data.SubjectUserName),
        share_name = winlog.event_data.ShareName,
        share_path = winlog.event_data.ShareLocalPath,
        relative_path = winlog.event_data.RelativeTargetName,
        file_path = CONCAT(winlog.event_data.ShareLocalPath, "\\", winlog.event_data.RelativeTargetName),
        src_ip = winlog.event_data.IpAddress,
        access_mask = winlog.event_data.AccessMask,
        access_list = winlog.event_data.AccessList,
        access_reason = winlog.event_data.AccessReason,
        host_name = host.name
    | KEEP
        @timestamp,
        agent_id,
        host_name,
        user_account,
        src_ip,
        share_name,
        share_path,
        relative_path,
        file_path,
        access_mask,
        access_list,
        access_reason,
        event.code,
        event.action

enabled: true
tags:
  - windows
  - file-server
  - smb
  - file-read
  - detailed-file-share
severity: low
risk_score: 20
references:
  - "https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-5145"
nist: ["AC-2", "AC-3", "AU-6", "AU-12"]
pci_dss: ["10.2.1", "10.2.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0009:
    T1039: []
