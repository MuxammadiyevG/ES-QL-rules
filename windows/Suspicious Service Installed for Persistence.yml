rule_id: 629c16b3-ce88-4667-8639-68b3423d8a15
name_uz: "Persistence uchun o'rnatilgan shubhali servis"
name_ru: "Установка подозрительной службы для закрепления"
name_en: "Suspicious Service Installed for Persistence"
description_uz: |
  Ushbu qoida shubhali servis o'rnatilishini ikkala manbadan aniqlaydi: 4697 ("Security")
  va 7045 ("System"). Binar yo'li `ImagePath` da (7045 uchun to'liq, 4697 uchun mavjud
  bo'lsa). Shubhali yo'l/interpretator/encoded buyruq persistence belgisidir.
  Eslatma: sizning indeksingizda `ServiceFileName`/`ServiceAccount` yo'q — `ImagePath`/
  `AccountName` ishlatildi.
  SOC triage:
  - `service_path` — binar qayerda? `installer` kim?
  - Tasdiqlanmasa: servisni o'chiring, hostni izolyatsiya qiling, IR.
description_ru: |
  Данное правило выявляет установку подозрительной службы из обоих источников: 4697 ("Security")
  и 7045 ("System"). Путь к бинарному файлу находится в `ImagePath` (для 7045 полностью, для 4697 при
  наличии). Подозрительный путь/интерпретатор/encoded-команда являются признаком закрепления.
  Примечание: в вашем индексе нет `ServiceFileName`/`ServiceAccount` — использованы `ImagePath`/
  `AccountName`.
  SOC triage:
  - `service_path` — где находится бинарный файл? Кто такой `installer`?
  - Если не подтверждено: удалите службу, изолируйте хост, IR.
description_en: |
  This rule detects suspicious service installation from both sources: 4697 ("Security")
  and 7045 ("System"). The binary path is in `ImagePath` (complete for 7045, for 4697 if
  available). A suspicious path/interpreter/encoded command is a sign of persistence.
  Note: your index does not have `ServiceFileName`/`ServiceAccount` — `ImagePath`/
  `AccountName` were used.
  SOC triage:
  - `service_path` — where is the binary? Who is the `installer`?
  - If not confirmed: delete the service, isolate the host, IR.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel IN ("Security", "System")
  | WHERE event.code IN ("4697", "7045")
  | EVAL installer    = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.AccountName, "-")
  | EVAL service_name = COALESCE(winlog.event_data.ServiceName, "-")
  | EVAL service_path = COALESCE(winlog.event_data.ImagePath, "-")
  | EVAL service_account = COALESCE(winlog.event_data.AccountName, "-")
  | WHERE TO_LOWER(service_path) RLIKE ".*(temp|appdata|programdata|users.public|powershell|cmd.exe|wscript|cscript|mshta|rundll32|regsvr32|encodedcommand|frombase64|-enc).*"
  | STATS
      services_installed = COUNT(*),
      service_names = VALUES(service_name),
      service_paths = VALUES(service_path),
      service_accounts = VALUES(service_account),
      first_install = MIN(@timestamp),
      last_install  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, installer, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE services_installed >= 1
  | EVAL dyn_risk = 85
  | KEEP agent_id, bucket, winlog.computer_name, installer, services_installed, service_names,
      service_paths, service_accounts, dyn_risk, first_install, last_install
  | SORT services_installed DESC
  | LIMIT 200
enabled: true
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1543.003
  - detection.emerging-threats
severity: high
risk_score: 80
mitre_attack:
  TA0003:
    T1543: ["T1543.003"]
  TA0004:
    T1543: ["T1543.003"]
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
