rule_id: eff58afe-03e2-4565-9d99-54b490e4649b
name: DNS Query to Suspicious TLD / Dynamic DNS
description: |
  Ushbu qoida xavf bilan bog'liq TLD yoki dynamic-DNS provayderlariga DNS so'rovini aniqlaydi
  (Sysmon EventID 22): .top/.xyz/.gq/.tk/.ml/.cf, duckdns, ngrok, no-ip, hopto, serveo,
  trycloudflare, workers.dev va h.k. — C2/exfil uchun ko'p ishlatiladi (T1071.004).
  SOC triage:
  - `domains` qaysi, `images` qaysi jarayon so'ragan? Reputatsiyani tekshiring.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "22"
  | EVAL qn = TO_LOWER(COALESCE(winlog.event_data.QueryName, "-"))
  | EVAL img = COALESCE(winlog.event_data.Image, "-")
  | EVAL actor = COALESCE(winlog.event_data.User, "-")
  | WHERE qn RLIKE ".*(\\.top|\\.xyz|\\.gq|\\.tk|\\.ml|\\.cf|\\.duckdns\\.org|\\.ngrok\\..*|\\.no-ip\\..*|\\.hopto\\.org|\\.serveo\\..*|\\.pagekite\\..*|\\.trycloudflare\\.com|\\.workers\\.dev|\\.run\\.app|\\.000webhostapp\\.com)"
  | STATS
      hits = COUNT(*),
      unique_domains = COUNT_DISTINCT(qn),
      domains = VALUES(qn),
      images = VALUES(img),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = 80
  | KEEP agent_id, bucket, winlog.computer_name, hits, unique_domains, domains, images, users, dyn_risk, first_seen, last_seen
  | SORT hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.command-and-control
  - attack.t1071.004
  - DNS
severity: high
risk_score: 80
mitre_attack:
  TA0011:
    T1071: ["T1071.004"]
nist: ["SI-4", "AU-12", "SC-7"]
pci_dss: ["10.2.7", "11.4", "1.3"]
gdpr: ["32.1.a"]
