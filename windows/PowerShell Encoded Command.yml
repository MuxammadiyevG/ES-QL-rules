rule_id: df18167f-34e3-46b9-81ee-0a9087dafada
name: PowerShell Encoded / Base64 Command
description: |
  Ushbu qoida obfuskatsiya qilingan PowerShell'ni aniqlaydi: ScriptBlock (4104) ichida
  `-EncodedCommand`/`-enc` yoki `FromBase64String` bo'lishi — hujumchilar buyruqni yashirish
  uchun ko'p ishlatadi.
  SOC triage:
  - `sample_script` ni dekod qiling (base64); qaysi user/host (`user`)?
  - Qonuniy avtomatlashtirish bo'lishi mumkin — kontekstni tasdiqlang.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-PowerShell/Operational"
  | WHERE event.code == "4104"
  | EVAL script_block = COALESCE(winlog.event_data.ScriptBlockText, "")
  | EVAL actor = COALESCE(winlog.user.name, "-")
  | WHERE TO_LOWER(script_block) RLIKE ".*(-encodedcommand|-enc |frombase64string).*"
  | EVAL sb_sample = SUBSTRING(script_block, 1, 400)
  | STATS
      hits = COUNT(*),
      sample_scripts = VALUES(sb_sample),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, actor, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = 82
  | KEEP agent_id, bucket, winlog.computer_name, actor, hits, sample_scripts, dyn_risk, first_seen, last_seen
  | SORT hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.execution
  - attack.defense-evasion
  - attack.t1059.001
  - attack.t1027
  - PowerShell
severity: high
risk_score: 82
mitre_attack:
  TA0002:
    T1059: ["T1059.001"]
  TA0005:
    T1027: []
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
