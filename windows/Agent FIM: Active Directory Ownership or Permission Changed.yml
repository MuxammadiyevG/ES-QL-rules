rule_id: cbcf8358-5d42-411d-b7d9-f37014fd298d
name_uz: "Agent FIM: Katalog egasi yoki ruxsatlari o'zgartirildi"
name_ru: "Agent FIM: изменён владелец или разрешения каталога"
name_en: "Agent FIM: Directory Ownership or Permission Changed"
description_uz: |
  Ushbu qoida Impact va Defense Evasion texnikalariga bog'liq bo'lib, `Agent FIM: Directory Ownership or Permission Changed` kontekstida FortiSIEM 
   Agent FIM tomonidan directory ownership yoki permission o'zgarishini aniqlaydi.
  Bu turdagi hodisa hujumchi privilege escalation, persistence yoki muhim tizim papkalariga ruxsatsiz kirish maqsadida fayl tizimi huquqlarini o'zgartirayotganligini ko'rsatishi mumkinligi sababli xavfli hisoblanadi.
  Qonuniy holatlar sifatida rejalashtirilgan tizim yangilanishlari, administrativ konfiguratsiya o'zgarishlari, deployment jarayonlari yoki dastur o'rnatish uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `host.name`, `user.name` va o'zgartirilgan `file.path` (directory) ni aniq identifikatsiya qiling.
  - O'zgarishni amalga oshirgan foydalanuvchining roli va huquqlarini tekshiring.
  - O'zgarish uchun tasdiqlangan change ticket yoki deployment yozuvi borligini tekshiring.
  - Yangi permission va ownership qiymatlari (`file.owner`, `user.group`) ning xavfliligini baholang (masalan, world-writable).
  - Hostda boshqa shubhali faoliyat (privilege escalation, lateral movement) borligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa tezkor containment bajaring: permissionlarni qaytaring, foydalanuvchi sessiyasini to'xtating va hostni tekshiring.
description_ru: |
  Это правило относится к техникам Impact и Defense Evasion и в контексте `Agent FIM: Directory Ownership or Permission Changed` FortiSIEM 
   Agent FIM обнаруживает изменение directory ownership или permission.
  Событие такого типа считается опасным, поскольку может указывать на то, что злоумышленник изменяет права файловой системы с целью privilege escalation, закрепления или несанкционированного доступа к важным системным каталогам.
  Легитимными случаями могут быть плановые обновления системы, административные изменения конфигурации, процессы deployment или установка программ.
  Шаги SOC triage:
  - Точно идентифицируйте `host.name`, `user.name` и изменённый `file.path` (directory) в событии.
  - Проверьте роль и полномочия пользователя, выполнившего изменение.
  - Проверьте, есть ли для изменения утверждённый change ticket или запись о deployment.
  - Оцените опасность новых значений permission и ownership (`file.owner`, `user.group`) (например, world-writable).
  - Проверьте, есть ли на хосте другая подозрительная активность (privilege escalation, lateral movement).
  - При подтверждении вредоносной активности выполните немедленный containment: верните permissions, завершите сессию пользователя и проверьте хост.
description_en: |
  This rule relates to Impact and Defense Evasion techniques and, in the context of `Agent FIM: Directory Ownership or Permission Changed`, FortiSIEM 
   Agent FIM detects a change of directory ownership or permission.
  This type of event is considered dangerous because it may indicate that an attacker is changing file system permissions for privilege escalation, persistence or unauthorized access to critical system folders.
  Legitimate cases may include scheduled system updates, administrative configuration changes, deployment processes or software installation.
  SOC triage steps:
  - Precisely identify `host.name`, `user.name` and the changed `file.path` (directory) in the event.
  - Check the role and privileges of the user who made the change.
  - Check whether there is an approved change ticket or deployment record for the change.
  - Assess how dangerous the new permission and ownership values (`file.owner`, `user.group`) are (for example, world-writable).
  - Check whether there is other suspicious activity (privilege escalation, lateral movement) on the host.
  - If malicious activity is confirmed, perform immediate containment: revert the permissions, stop the user session and inspect the host.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.code IN ("4670", "4663") AND winlog.channel == "Security"
  | EVAL host_name        = winlog.computer_name
  | EVAL actor            = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.TargetUserName)
  | EVAL target_object    = COALESCE(winlog.event_data.ObjectName, winlog.event_data.param1)
  | EVAL file_owner       = COALESCE(winlog.event_data.param2, winlog.event_data.SubjectUserName)
  | EVAL user_group       = COALESCE(winlog.event_data.param3, winlog.event_data.SubjectDomainName)
  | EVAL user_perm        = winlog.event_data.param4
  | EVAL group_perm       = winlog.event_data.param5
  | EVAL other_perm       = winlog.event_data.param6
  | EVAL old_sd           = winlog.event_data.OldSd
  | EVAL new_sd           = winlog.event_data.NewSd
  | WHERE target_object IS NOT NULL
  | STATS
      event_count    = COUNT(*),
      host_names     = VALUES(winlog.computer_name),
      actors         = VALUES(winlog.event_data.SubjectUserName),
      target_objects = VALUES(winlog.event_data.ObjectName),
      file_owners    = VALUES(winlog.event_data.param2),
      user_groups    = VALUES(winlog.event_data.param3),
      user_perms     = VALUES(winlog.event_data.param4),
      group_perms    = VALUES(winlog.event_data.param5),
      other_perms    = VALUES(winlog.event_data.param6),
      old_sds        = VALUES(winlog.event_data.OldSd),
      new_sds        = VALUES(winlog.event_data.NewSd),
      last_seen      = MAX(@timestamp),
      first_seen     = MIN(@timestamp)
    BY agent_id, winlog.computer_name, winlog.event_data.ObjectName, winlog.event_data.SubjectUserName
  | WHERE event_count >= 1
  | EVAL
      host_name         = winlog.computer_name,
      target_object     = winlog.event_data.ObjectName,
      user              = winlog.event_data.SubjectUserName
  | KEEP
      agent_id,
      host_name,
      target_object,
      user,
      event_count,
      host_names,
      actors,
      target_objects,
      file_owners,
      user_groups,
      user_perms,
      group_perms,
      other_perms,
      old_sds,
      new_sds,
      last_seen,
      first_seen
  | SORT event_count DESC
enabled: true
