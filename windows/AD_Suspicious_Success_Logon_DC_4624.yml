rule_id: 662d1aa3-0ab0-4091-abeb-10bdcc10c06a
name_uz: "Domain Controller'ga shubhali muvaffaqiyatli AD logon (4624)"
name_ru: "Подозрительный успешный вход в AD на контроллер домена (4624)"
name_en: "AD Suspicious Successful Logon to Domain Controller (4624)"
description_uz: |
  Ushbu qoida lateral movement va privilege escalation holatlarini aniqlash uchun DC'ga muvaffaqiyatli logonlarni tahlil qiladi.
  Noodatiy IP yoki kam uchraydigan akkaunt orqali DC'ga muvaffaqiyatli kirish hujumchining boshlang'ich foothold'dan Tier-0 muhitiga o'tganini ko'rsatishi mumkin.
  Qonuniy holatlar: adminlar tomonidan masofaviy boshqaruv, patch/deployment oynasi, zaxira yoki monitoring xizmatlari.
  SOC triage bosqichlari:
  - `actor`, `target_user`, logon turi va `hostn` ni aniqlang.
  - Kirish rejalashtirilgan ishga mos keladimi, change ticket orqali tasdiqlang.
  - `src_ip` manzili odatiy admin segmentidan ekanini va oldingi faoliyatini tekshiring.
  - Akkauntning imtiyozli guruh a'zoligini tekshirib, ortiqcha huquq bor-yo'qligini baholang.
  - Shubhali bo'lsa sessiyani uzing, akkaunt credentialini yangilang va kirish manbasini izolyatsiya qiling.
description_ru: |
  Данное правило анализирует успешные входы на DC для выявления случаев горизонтального перемещения и повышения привилегий.
  Успешный вход на DC с необычного IP или с редко встречающейся учётной записи может указывать на то, что атакующий перешёл с начального foothold в среду Tier-0.
  Легитимные случаи: удалённое администрирование администраторами, окно patch/deployment, службы резервного копирования или мониторинга.
  Этапы SOC triage:
  - Определите `actor`, `target_user`, тип входа и `hostn`.
  - Подтвердите через change ticket, соответствует ли вход запланированной работе.
  - Проверьте, относится ли адрес `src_ip` к обычному административному сегменту, и его предыдущую активность.
  - Проверьте членство учётной записи в привилегированных группах и оцените наличие избыточных прав.
  - При подозрении завершите сессию, обновите учётные данные аккаунта и изолируйте источник входа.
description_en: |
  This rule analyzes successful logons to the DC in order to detect lateral movement and privilege escalation cases.
  A successful logon to the DC from an unusual IP or with a rarely seen account may indicate that the attacker has moved from the initial foothold into the Tier-0 environment.
  Legitimate cases: remote administration by admins, a patch/deployment window, backup or monitoring services.
  SOC triage steps:
  - Identify the `actor`, `target_user`, logon type and `hostn`.
  - Confirm via a change ticket whether the logon matches planned work.
  - Check that the `src_ip` address belongs to the usual admin segment and review its previous activity.
  - Check the account's privileged group membership and assess whether it has excessive rights.
  - If suspicious, terminate the session, rotate the account credential and isolate the logon source.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | EVAL hostn = winlog.computer_name
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.TargetUserName, winlog.event_data.SubjectUserName)
  | EVAL target_user = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.SamAccountName)
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, winlog.event_data.IpAddress)
  | EVAL logon_type = COALESCE(winlog.event_data.LogonType, "")
  | EVAL auth_pkg = COALESCE(winlog.event_data.AuthenticationPackageName, "")
  | WHERE event.code == "4624"
  // DC-only: scope to Domain Controller hostnames
  | WHERE hostn LIKE "WINDC*" OR hostn LIKE "*DC*"
  | WHERE actor IS NOT NULL
  // exclude blank SubjectUserName (machine Kerberos background tickets)
  | WHERE actor != "-"
  | WHERE NOT actor LIKE "*$"
  // logon_type 10 = RemoteInteractive (RDP to DC) — genuinely suspicious
  // logon_type 3 network logons from workstations are normal background Kerberos traffic
  | WHERE logon_type == "10"
  | WHERE src_ip IS NOT NULL AND src_ip NOT IN ("-", "::1", "127.0.0.1")
  // exclude machine accounts in target_user
  | WHERE NOT target_user LIKE "*$"
  | STATS success_count = COUNT(*) BY agent_id, hostn, actor, target_user, src_ip, logon_type, auth_pkg
  | WHERE success_count >= 2
  | EVAL dyn_risk = CASE(success_count >= 5, 95, 92)
  | KEEP agent_id, hostn, actor, target_user, src_ip, logon_type, auth_pkg, success_count, dyn_risk
  | SORT dyn_risk DESC, success_count DESC
  | LIMIT 200
enabled: false
tags:
  - AD
  - Authentication
  - Lateral Movement
severity: high
risk_score: 82
references:
  - "https://attack.mitre.org/techniques/T1021/"
mitre_attack:
  TA0008:
    T1021: ["T1021.001"]
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
