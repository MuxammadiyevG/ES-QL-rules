rule_id: bab7f6e7-2f0a-426c-96cd-d074cfa61ef0
name: Potential DCSync Attack - Suspicious Replication
description: |
  Ushbu qoida DCSync replikatsiyasini aniqlaydi (AD_DCSync_Replication bilan to'ldiruvchi,
  obyekt darajasida tafsilot beradi): 4662 `Properties` ichida replikatsiya GUID'lari
  (1131f6aa / 1131f6ad / 89e95b76) yoki parol-hash atribut GUID'lari (unicodePwd
  bf9679e1, supplementalCredentials, ntPwdHistory) bo'lib, MASHINA bo'lmagan akkaunt
  tomonidan bajarilsa.
  SOC triage:
  - `accessing_user` DC emasmi? `objects_accessed`/`properties_list` da qaysi huquqlar?
  - Manba (`src_ips`) haqiqiy sync server bilan mosmi?
  - Tasdiqlanmasa: containment — akkauntni cheklang, krbtgt rotatsiya, IR.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4662"
  | EVAL accessing_user = winlog.event_data.SubjectUserName
  | EVAL object_name = COALESCE(winlog.event_data.ObjectName, "-")
  | EVAL props       = COALESCE(winlog.event_data.Properties, "")
  | EVAL access_mask = COALESCE(winlog.event_data.AccessMask, "-")
  | EVAL src_ip      = COALESCE(winlog.event_data.IpAddress, "-")
  | WHERE TO_LOWER(props) RLIKE ".*(1131f6aa|1131f6ad|89e95b76|bf9679e1|bf967a55|4c164200).*"
  | WHERE accessing_user IS NOT NULL AND NOT accessing_user LIKE "*$"
  | STATS
      replication_attempts = COUNT(*),
      objects_accessed = VALUES(object_name),
      properties_list  = VALUES(props),
      access_masks     = VALUES(access_mask),
      src_ips          = VALUES(src_ip),
      first_attempt    = MIN(@timestamp),
      last_attempt     = MAX(@timestamp)
    BY agent_id, winlog.computer_name, accessing_user, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE replication_attempts >= 1
  | EVAL dyn_risk = 96
  | KEEP agent_id, bucket, winlog.computer_name, accessing_user, replication_attempts,
      objects_accessed, properties_list, access_masks, src_ips, dyn_risk, first_attempt, last_attempt
  | SORT replication_attempts DESC
  | LIMIT 200
enabled: true
tags:
  - attack.credential-access
  - attack.t1003.006
  - detection.critical
severity: high
risk_score: 95
mitre_attack:
  TA0006:
    T1003: ["T1003.006"]
nist: ["AU-12", "AC-6", "SI-4"]
pci_dss: ["10.2.1", "10.2"]
gdpr: ["32.1.a"]
