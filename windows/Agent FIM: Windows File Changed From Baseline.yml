rule_id: 62dd5d36-fa68-43e9-a614-b9d0a617d117
name_uz: "Agent FIM: Windows fayli baseline'dan o'zgardi"
name_ru: "Agent FIM: файл Windows изменён относительно baseline"
name_en: "Agent FIM: Windows File Changed From Baseline"
description_uz: |
  Ushbu qoida Defense Evasion va Impact texnikalariga bog'liq bo'lib, `Agent FIM: Windows File Changed From Baseline` kontekstida FortiSIEM Windows Agent FIM tomonidan faylning baseline dan o'zgarganligini aniqlaydi.
  Bu turdagi hodisa hujumchi Windows tizim fayllarini, konfiguratsiya fayllarini yoki muhim binary fayllarni o'zgartirishi orqali persistence, privilege escalation yoki anti-forensics maqsadida faoliyat yuritayotganligini ko'rsatishi mumkinligi sababli xavfli hisoblanadi.
  Qonuniy holatlar sifatida rejalashtirilgan Windows Update, patch management jarayonlari, dastur o'rnatish yoki administrator tomonidan bajarilgan konfiguratsiya o'zgarishlari uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `winlog.computer_name`, `winlog.event_data.SubjectUserName` va o'zgartirilgan `winlog.event_data.ObjectName` ni aniq identifikatsiya qiling.
  - Fayl hash qiymatlarini (`winlog.event_data.OldSd` va `winlog.event_data.NewSd`) solishtiring.
  - O'zgartirilgan fayl kritik Windows fayli bo'lsa (`C:\Windows\System32`, `C:\Windows\SysWOW64`) ustuvor ko'rib chiqing.
  - O'zgarishni amalga oshirgan foydalanuvchining roli va huquqlarini tekshiring.
  - O'zgarish uchun tasdiqlangan change ticket yoki deployment yozuvi borligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa tezkor containment bajaring: faylni baseline dan tiklang, foydalanuvchi sessiyasini to'xtating va hostni izolyatsiya qiling.
description_ru: |
  Это правило относится к техникам Defense Evasion и Impact и в контексте `Agent FIM: Windows File Changed From Baseline` обнаруживает изменение файла относительно baseline, зафиксированное FortiSIEM Windows Agent FIM.
  Событие такого типа считается опасным, поскольку может указывать на то, что злоумышленник изменяет системные файлы Windows, файлы конфигурации или важные binary-файлы в целях закрепления, privilege escalation или anti-forensics.
  Легитимными случаями могут быть плановый Windows Update, процессы patch management, установка программ или изменения конфигурации, выполненные администратором.
  Шаги SOC triage:
  - Точно идентифицируйте `winlog.computer_name`, `winlog.event_data.SubjectUserName` и изменённый `winlog.event_data.ObjectName` в событии.
  - Сравните значения хэшей файла (`winlog.event_data.OldSd` и `winlog.event_data.NewSd`).
  - Если изменённый файл является критичным файлом Windows (`C:\Windows\System32`, `C:\Windows\SysWOW64`), рассмотрите его в приоритетном порядке.
  - Проверьте роль и полномочия пользователя, выполнившего изменение.
  - Проверьте, есть ли для изменения утверждённый change ticket или запись о deployment.
  - При подтверждении вредоносной активности выполните немедленный containment: восстановите файл из baseline, завершите сессию пользователя и изолируйте хост.
description_en: |
  This rule relates to Defense Evasion and Impact techniques and, in the context of `Agent FIM: Windows File Changed From Baseline`, detects that a file has changed from the baseline as reported by FortiSIEM Windows Agent FIM.
  This type of event is considered dangerous because it may indicate that an attacker is modifying Windows system files, configuration files or important binary files for persistence, privilege escalation or anti-forensics purposes.
  Legitimate cases may include scheduled Windows Update, patch management processes, software installation or configuration changes made by an administrator.
  SOC triage steps:
  - Precisely identify `winlog.computer_name`, `winlog.event_data.SubjectUserName` and the changed `winlog.event_data.ObjectName` in the event.
  - Compare the file hash values (`winlog.event_data.OldSd` and `winlog.event_data.NewSd`).
  - If the changed file is a critical Windows file (`C:\Windows\System32`, `C:\Windows\SysWOW64`), review it as a priority.
  - Check the role and privileges of the user who made the change.
  - Check whether there is an approved change ticket or deployment record for the change.
  - If malicious activity is confirmed, perform immediate containment: restore the file from the baseline, stop the user session and isolate the host.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE winlog.channel == "Security"
  | WHERE winlog.event_id IN ("4663", "4670")
  | EVAL host_name   = winlog.computer_name
  | EVAL actor       = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.TargetUserName)
  | EVAL file_path   = winlog.event_data.ObjectName
  | EVAL old_hash    = winlog.event_data.OldSd
  | EVAL new_hash    = winlog.event_data.NewSd
  | EVAL hash_algo   = "SHA256"
  | EVAL object_type = winlog.event_data.ObjectType
  | EVAL process     = winlog.event_data.ProcessName
  | EVAL logon_id    = winlog.event_data.SubjectLogonId
  | WHERE NOT actor RLIKE ".*\\$$"
  | EVAL is_critical = CASE(
      winlog.event_data.ObjectName RLIKE "(?i).*\\\\Windows\\\\System32\\\\.*",   "YES - System32",
      winlog.event_data.ObjectName RLIKE "(?i).*\\\\Windows\\\\SysWOW64\\\\.*",   "YES - SysWOW64",
      winlog.event_data.ObjectName RLIKE "(?i).*\\\\Windows\\\\.*",               "YES - Windows dir",
      winlog.event_data.ObjectName RLIKE "(?i).*\\\\Program Files\\\\.*",         "YES - Program Files",
      winlog.event_data.ObjectName RLIKE "(?i).*\\\\drivers\\\\etc\\\\hosts",     "YES - hosts file",
      winlog.event_data.ObjectName RLIKE "(?i).*\\\\SAM",                         "YES - SAM registry",
      winlog.event_data.ObjectName RLIKE "(?i).*\\\\SYSTEM",                      "YES - SYSTEM registry",
      "NO"
    )
  | WHERE file_path IS NOT NULL
  | STATS
      event_count    = COUNT(*),
      host_names     = VALUES(winlog.computer_name),
      actors         = VALUES(winlog.event_data.SubjectUserName),
      file_paths     = VALUES(winlog.event_data.ObjectName),
      old_hashes     = VALUES(winlog.event_data.OldSd),
      new_hashes     = VALUES(winlog.event_data.NewSd),
      processes      = VALUES(winlog.event_data.ProcessName),
      object_types   = VALUES(winlog.event_data.ObjectType),
      critical_files = VALUES(is_critical),
      last_seen      = MAX(@timestamp),
      first_seen     = MIN(@timestamp)
    BY agent_id, winlog.computer_name, winlog.event_data.ObjectName, winlog.event_data.SubjectUserName
  | WHERE event_count >= 1
  | EVAL
      host_name         = winlog.computer_name,
      file_name         = winlog.event_data.ObjectName,
      user              = winlog.event_data.SubjectUserName
  | KEEP
      agent_id,
      host_name,
      file_name,
      user,
      event_count,
      host_names,
      actors,
      file_paths,
      old_hashes,
      new_hashes,
      processes,
      object_types,
      critical_files,
      last_seen,
      first_seen
  | SORT event_count DESC
enabled: true
tags:
