rule_id: 77ceaadc-137c-45dc-a56a-556d8ac4f7dd
name: Administrative Share Access Detection
description: |
  Ushbu qoida administrativ share (C$, ADMIN$, IPC$) ga tarmoq orqali kirishni aniqlaydi
  (5140). Admin sharelarga kirish PsExec, lateral movement va remote tool ijrosi bilan
  bog'liq. Mashina va SYSTEM/anonymous akkauntlar chiqariladi.
  SOC triage:
  - `accessing_user`/`source_ip` — kim, qayerdan, qaysi `shares`?
  - Bu admin/IT ning kutilgan masofaviy ishimi?
  - Tasdiqlanmasa: manbani izolyatsiya qiling, sessiyani uzing, hostda jarayonlarni tekshiring.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "5140"
  | EVAL accessing_user = winlog.event_data.SubjectUserName
  | EVAL share_name = COALESCE(winlog.event_data.ShareName, "-")
  | EVAL share_path = COALESCE(winlog.event_data.ShareLocalPath, "-")
  | EVAL source_ip  = COALESCE(winlog.event_data.IpAddress, "-")
  | EVAL access_mask = COALESCE(winlog.event_data.AccessMask, "-")
  | WHERE accessing_user IS NOT NULL AND NOT accessing_user LIKE "*$"
  | WHERE NOT TO_LOWER(accessing_user) RLIKE "(system|anonymous logon)"
  | WHERE share_name LIKE "*C$" OR share_name LIKE "*ADMIN$" OR share_name LIKE "*IPC$"
  | STATS
      access_count = COUNT(*),
      unique_shares = COUNT_DISTINCT(share_name),
      shares_accessed = VALUES(share_name),
      access_masks = VALUES(access_mask),
      first_access = MIN(@timestamp),
      last_access  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, accessing_user, source_ip, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE access_count >= 1
  | EVAL dyn_risk = CASE(unique_shares >= 2, 82, 75)
  | KEEP agent_id, bucket, winlog.computer_name, accessing_user, source_ip, access_count,
      unique_shares, shares_accessed, access_masks, dyn_risk, first_access, last_access
  | SORT dyn_risk DESC, access_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.lateral-movement
  - attack.t1021.002
  - detection.emerging-threats
severity: high
risk_score: 75
mitre_attack:
  TA0008:
    T1021: ["T1021.002"]
nist: ["AC-17", "AU-2", "AU-12", "SI-4"]
pci_dss: ["10.2.5", "8.1.6"]
gdpr: ["32.1.a"]
