rule_id: 59df4bc4-1921-458f-8849-133d59f5c8c7
name_uz: "Servis akkauntning interaktiv logon'i aniqlandi"
name_ru: "Обнаружен интерактивный вход сервисной учётной записи"
name_en: "Service Account Interactive Logon Detected"
description_uz: |
  Ushbu qoida servis akkauntning INTERAKTIV logon'ini aniqlaydi (4624, LogonType 2/10).
  Servis akkauntlar odatda faqat batch/service (4/5) yoki network (3) bilan ishlaydi —
  interaktiv yoki RDP logon ko'pincha akkaunt o'g'irlangani (credential theft, lateral
  movement) belgisidir.
  Servis-akkaunt nomlash konvensiyangizni quyidagi regex'ga moslang.
  SOC triage:
  - `target_user` haqiqatan servis akkauntmi? Qaysi `workstations`/`source_ips`dan?
  - Tasdiqlanmasa: parolni rotatsiya qiling, sessiyani uzing, manbani tekshiring.
description_ru: |
  Это правило выявляет ИНТЕРАКТИВНЫЙ вход сервисной учётной записи (4624, LogonType 2/10).
  Сервисные учётные записи обычно работают только с batch/service (4/5) или network (3) —
  интерактивный или RDP-вход часто является признаком кражи учётной записи (credential theft,
  горизонтальное перемещение).
  Приведите свою конвенцию именования сервисных учётных записей в соответствие с regex ниже.
  SOC triage:
  - Действительно ли `target_user` — сервисная учётная запись? С каких `workstations`/`source_ips`?
  - Если не подтверждено: смените пароль, завершите сессию, проверьте источник.
description_en: |
  This rule detects an INTERACTIVE logon of a service account (4624, LogonType 2/10).
  Service accounts normally operate only with batch/service (4/5) or network (3) —
  an interactive or RDP logon is often a sign that the account has been stolen (credential theft, lateral
  movement).
  Adapt your service-account naming convention to the regex below.
  SOC triage:
  - Is `target_user` really a service account? From which `workstations`/`source_ips`?
  - If not confirmed: rotate the password, terminate the session, check the source.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4624"
  | WHERE winlog.event_data.LogonType IN ("2", "10")
  | EVAL target_user  = winlog.event_data.TargetUserName
  | EVAL source_ip    = COALESCE(winlog.event_data.IpAddress, "-")
  | EVAL workstation  = COALESCE(winlog.event_data.WorkstationName, "-")
  | EVAL logon_process = COALESCE(winlog.event_data.LogonProcessName, "-")
  | EVAL auth_package = COALESCE(winlog.event_data.AuthenticationPackageName, "-")
  | WHERE target_user IS NOT NULL AND NOT target_user LIKE "*$"
  // Servis-akkaunt nomlash shabloni (o'z muhitingizga moslang)
  | WHERE TO_LOWER(target_user) RLIKE "(svc[-_].*|service[-_].*|.*[-_]svc|sa[-_].*|sql[-_].*|iis[-_].*|app[-_].*|backup[-_].*)"
  | STATS
      logon_count = COUNT(*),
      source_ips  = VALUES(source_ip),
      workstations = VALUES(workstation),
      logon_processes = VALUES(logon_process),
      auth_packages = VALUES(auth_package),
      first_seen  = MIN(@timestamp),
      last_seen   = MAX(@timestamp)
    BY agent_id, winlog.computer_name, target_user, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE logon_count >= 1
  | EVAL dyn_risk = 80
  | KEEP agent_id, bucket, winlog.computer_name, target_user, logon_count, source_ips, workstations,
      logon_processes, auth_packages, dyn_risk, first_seen, last_seen
  | SORT logon_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.credential-access
  - attack.lateral-movement
  - attack.t1078.003
  - detection.emerging-threats
severity: high
risk_score: 75
mitre_attack:
  TA0004:
    T1078: ["T1078.003"]
  TA0008:
    T1021: []
nist: ["AC-17", "AU-2", "AU-12", "SI-4"]
pci_dss: ["10.2.5", "8.1.6"]
gdpr: ["32.1.a"]
