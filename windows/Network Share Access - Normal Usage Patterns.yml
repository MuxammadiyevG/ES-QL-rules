rule_id: c5cd759e-b746-47a4-a1f9-ce2c2681d46c
name_uz: "Network share kirishi - normal foydalanish shakllari"
name_ru: "Доступ к сетевым ресурсам - нормальные шаблоны использования"
name_en: "Network Share Access - Normal Usage Patterns"
description_uz: |
  Baseline/monitoring qoidasi: oddiy (administrativ BO'LMAGAN) network share kirishini (5140)
  yig'adi. C$/ADMIN$/IPC$ administrativ sharelari chiqariladi (ular alohida "Administrative
  Share Access" rule'ida). Fayl-resurs kirishining normal darajasini kuzatish uchun.
description_ru: |
  Правило baseline/мониторинга: собирает обычный (НЕ административный) доступ к сетевым ресурсам (5140).
  Административные ресурсы C$/ADMIN$/IPC$ исключаются (они покрываются отдельным правилом "Administrative
  Share Access"). Служит для наблюдения за нормальным уровнем доступа к файловым ресурсам.
description_en: |
  Baseline/monitoring rule: collects ordinary (NON-administrative) network share access (5140).
  The administrative shares C$/ADMIN$/IPC$ are excluded (they are covered by the separate "Administrative
  Share Access" rule). Used to observe the normal level of file-share access.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "5140"
  | EVAL accessing_user = winlog.event_data.SubjectUserName
  | EVAL share_name = COALESCE(winlog.event_data.ShareName, "-")
  | EVAL share_path = COALESCE(winlog.event_data.ShareLocalPath, "-")
  | EVAL source_ip  = COALESCE(winlog.event_data.IpAddress, "-")
  | WHERE accessing_user IS NOT NULL AND NOT accessing_user LIKE "*$"
  | WHERE NOT TO_LOWER(accessing_user) RLIKE "(system|anonymous logon)"
  | WHERE NOT (share_name LIKE "*C$" OR share_name LIKE "*ADMIN$" OR share_name LIKE "*IPC$")
  | STATS
      access_count = COUNT(*),
      unique_users = COUNT_DISTINCT(accessing_user),
      unique_shares = COUNT_DISTINCT(share_name),
      users = VALUES(accessing_user),
      shares = VALUES(share_name),
      source_ips = VALUES(source_ip),
      first_access = MIN(@timestamp),
      last_access  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE access_count >= 1
  | KEEP agent_id, bucket, winlog.computer_name, access_count, unique_users, unique_shares,
      users, shares, source_ips, first_access, last_access
  | SORT access_count DESC
  | LIMIT 200
enabled: false
tags:
  - detection.baseline
  - monitoring.file-access
  - detection.compliance
severity: low
risk_score: 30
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
