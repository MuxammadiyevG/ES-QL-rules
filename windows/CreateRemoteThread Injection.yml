rule_id: 7b6dd98b-03a7-495b-9bd7-defef845e1ea
name_uz: "CreateRemoteThread orqali process injection"
name_ru: "Process Injection через CreateRemoteThread"
name_en: "Process Injection via CreateRemoteThread"
description_uz: |
  Ushbu qoida bir jarayonning boshqasiga remote thread yaratishini aniqlaydi (Sysmon 8) —
  ayniqsa sezgir nishonga (lsass/winlogon/explorer/services). Bu klassik process injection
  (T1055).
  SOC triage:
  - `source_images` (kim) → `target_images` (kimga)? `start_modules`/`start_functions` shubhalimi?
description_ru: |
  Это правило выявляет создание одним процессом remote thread в другом процессе (Sysmon 8) —
  особенно в отношении чувствительных целей (lsass/winlogon/explorer/services). Это классическая process injection
  (T1055).
  Триаж SOC:
  - `source_images` (кто) → `target_images` (в кого)? Подозрительны ли `start_modules`/`start_functions`?
description_en: |
  This rule detects one process creating a remote thread in another (Sysmon 8) —
  especially against a sensitive target (lsass/winlogon/explorer/services). This is classic process injection
  (T1055).
  SOC triage:
  - `source_images` (who) → `target_images` (into whom)? Are `start_modules`/`start_functions` suspicious?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "8"
  | EVAL si = TO_LOWER(COALESCE(winlog.event_data.SourceImage, "-"))
  | EVAL ti = TO_LOWER(COALESCE(winlog.event_data.TargetImage, "-"))
  | EVAL sm = COALESCE(winlog.event_data.StartModule, "-")
  | EVAL sf = COALESCE(winlog.event_data.StartFunction, "-")
  | EVAL actor = COALESCE(winlog.event_data.SourceUser, "-")
  | EVAL sensitive = CASE(ti RLIKE ".*(lsass|winlogon|services|csrss|explorer|svchost|spoolsv|wininit).exe", 1, 0)
  | WHERE NOT (si == "c:\\windows\\system32\\dwm.exe" AND (ti RLIKE ".*csrss\\.exe" OR ti == "<unknown process>"))
  | STATS
      hits = COUNT(*),
      sensitive_hits = SUM(sensitive),
      source_images = VALUES(si),
      target_images = VALUES(ti),
      start_modules = VALUES(sm),
      start_functions = VALUES(sf),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = CASE(sensitive_hits >= 1, 90, 70)
  | KEEP agent_id, bucket, winlog.computer_name, hits, sensitive_hits, source_images, target_images, start_modules, start_functions, users, dyn_risk, first_seen, last_seen
  | SORT dyn_risk DESC, hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.defense-evasion
  - attack.privilege-escalation
  - attack.t1055
  - Sysmon
severity: high
risk_score: 85
mitre_attack:
  TA0005:
    T1055: []
nist: ["SI-4", "AU-12", "AC-6"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
