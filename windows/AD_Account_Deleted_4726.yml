rule_id: 6bed2de6-2e24-457f-833c-cae47c853393
name_uz: "Domain Controller'da AD Foydalanuvchi Akkaunti O'chirilishi (4726)"
name_ru: "Удаление учётной записи AD на контроллере домена (4726)"
name_en: "AD User Account Deletion on Domain Controller (4726)"
description_uz: |
  Ushbu qoida defense evasion va impact texnikalariga aloqador bo'lib, AD akkaunti o'chirilishini aniqlaydi.
  Hujumchi izlarni yashirish yoki tiklanishni qiyinlashtirish uchun akkauntlarni o'chirishi mumkin; bu ayniqsa imtiyozli yoki servis akkauntlarda katta xavfdir.
  Qonuniy holatlar: offboarding, test akkaunt tozalash, IAM life-cycle policy ishlari.
  SOC triage bosqichlari:
  - `actor` va o'chirilgan `target_user` ni aniqlang.
  - O'chirish bo'yicha rasmiy change ticket yoki HR buyurtmasini tekshiring.
  - `src_ip` manzili va boshqaruv hostini tekshirib, noodatiy manbani aniqlang.
  - O'chirilgan akkauntning avvalgi guruh a'zoligi va Tier-0 huquqlarini tekshiring.
  - Shubhali holatda o'chirilgan akkauntni tiklash, tegishli credentiallarni yangilash va aktorni cheklash choralarini ko'ring.
description_ru: |
  Это правило относится к техникам обхода защиты (defense evasion) и воздействия (impact) и обнаруживает удаление учётной записи AD.
  Атакующий может удалять учётные записи, чтобы скрыть следы или затруднить восстановление; это особенно опасно для привилегированных и сервисных учётных записей.
  Легитимные случаи: offboarding, очистка тестовых учётных записей, работы по IAM life-cycle policy.
  Шаги SOC triage:
  - Определите `actor` и удалённую `target_user`.
  - Проверьте наличие официального change ticket или заявки HR на удаление.
  - Проверьте адрес `src_ip` и хост управления, чтобы выявить нетипичный источник.
  - Проверьте прежнее членство удалённой учётной записи в группах и её права Tier-0.
  - При подозрении рассмотрите меры по восстановлению удалённой учётной записи, смене соответствующих учётных данных и ограничению актора.
description_en: |
  This rule relates to defense evasion and impact techniques and detects the deletion of an AD account.
  An attacker may delete accounts to hide traces or hinder recovery; this is especially dangerous for privileged or service accounts.
  Legitimate cases: offboarding, test account cleanup, IAM life-cycle policy work.
  SOC triage steps:
  - Identify the `actor` and the deleted `target_user`.
  - Check for a formal change ticket or HR request for the deletion.
  - Check the `src_ip` address and the management host to identify an unusual source.
  - Review the deleted account's previous group membership and Tier-0 rights.
  - If suspicious, consider restoring the deleted account, rotating the relevant credentials and restricting the actor.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | EVAL hostn = winlog.computer_name
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.SubjectUserName)
  | EVAL target_user = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.SamAccountName)
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, winlog.event_data.IpAddress)
  // host-filtri olib tashlandi - barcha hostlarda ishlaydi (DC-only kerak bolsa qolda yoqing)
  | WHERE event.code == "4726"
  | WHERE actor IS NOT NULL
  | WHERE NOT actor LIKE "*$"
  | STATS event_count = COUNT(*) BY agent_id, hostn, actor, target_user, src_ip
  | WHERE event_count >= 1
  | EVAL dyn_risk = CASE(TO_LOWER(target_user) RLIKE "^(administrator|krbtgt|svc_.*|backup_.*|sqlsvc.*)$", 94, event_count >= 2, 86, 80)
  | KEEP agent_id, hostn, actor, target_user, src_ip, event_count, dyn_risk
  | SORT dyn_risk DESC, event_count DESC
  | LIMIT 200
enabled: false
tags:
  - AD
  - Account Lifecycle
  - Impact
severity: high
risk_score: 80
references:
  - "https://attack.mitre.org/techniques/T1531/"
mitre_attack:
  TA0040:
    T1531: []
nist: ["AC-2", "AU-12", "IA-4"]
pci_dss: ["8.1.1", "8.1.2", "10.2.5"]
gdpr: ["32.1.a"]
