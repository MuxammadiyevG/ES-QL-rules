rule_id: 98bafac4-f3ae-4b19-b874-7d0089cf8923
name_uz: "Muvaffaqiyatli RDP logon - baseline"
name_ru: "Успешный вход по RDP - baseline"
name_en: "RDP Successful Logon - Baseline"
description_uz: |
  Baseline/monitoring: muvaffaqiyatli RDP logon (4624 Type 10) larni host/user/manba bo'yicha
  yig'adi. Yangi yoki noodatiy RDP kirishlarini aniqlash uchun normal darajani belgilaydi
  (alert emas, kontekst).
description_ru: |
  Baseline/мониторинг: собирает успешные входы по RDP (4624 Type 10) по хосту/пользователю/источнику.
  Задаёт нормальный уровень для выявления новых или необычных RDP-подключений
  (не алерт, контекст).
description_en: |
  Baseline/monitoring: aggregates successful RDP logons (4624 Type 10) by host/user/source.
  Establishes the normal level for spotting new or unusual RDP access
  (not an alert, context).
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4624"
  | WHERE winlog.event_data.LogonType == "10"
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, "-")
  | EVAL target_user = winlog.event_data.TargetUserName
  | EVAL workstation = COALESCE(winlog.event_data.WorkstationName, "-")
  | WHERE target_user IS NOT NULL AND NOT target_user LIKE "*$"
  | STATS
      logon_count = COUNT(*),
      unique_users = COUNT_DISTINCT(target_user),
      unique_sources = COUNT_DISTINCT(src_ip),
      users = VALUES(target_user),
      source_ips = VALUES(src_ip),
      workstations = VALUES(workstation),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE logon_count >= 1
  | KEEP agent_id, bucket, winlog.computer_name, logon_count, unique_users, unique_sources,
      users, source_ips, workstations, first_seen, last_seen
  | SORT logon_count DESC
  | LIMIT 200
enabled: false
tags:
  - detection.baseline
  - monitoring.rdp
  - RDP
severity: low
risk_score: 30
nist: ["AU-2", "AU-12", "AC-7", "IA-2"]
pci_dss: ["10.2.5", "8.1.6"]
gdpr: ["32.1.a"]
mitre_attack: []
