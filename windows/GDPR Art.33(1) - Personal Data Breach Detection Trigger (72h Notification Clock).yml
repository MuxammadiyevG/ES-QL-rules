rule_id: 9df50a83-d2fd-4a60-bcb7-f159b6bf531c
name_uz: "GDPR Art.33(1) - Shaxsiy ma'lumotlar buzilishini aniqlash triggeri (72 soatlik xabar berish hisoblagichi)"
name_ru: "GDPR Art.33(1) - Триггер обнаружения утечки персональных данных (72-часовой отсчёт уведомления)"
name_en: "GDPR Art.33(1) - Personal Data Breach Detection Trigger (72h Notification Clock)"
description_uz: |
  GDPR 33(1)-moddasi bo'yicha nazorat organiga 72 soatlik xabar berish hisoblagichini ishga tushiruvchi
  yuqori ishonchli shaxsiy ma'lumotlar buzilishi indikatorlarini aniqlaydi. Ushbu qoida shunchaki muvaffaqiyatsiz
  urinishlarni emas, balki haqiqiy yoki ehtimoliy shaxsiy ma'lumotlar oshkorligini ko'rsatuvchi korrelyatsiyalangan hodisalarni topadi.
  Buzilish indikatorlari: (1) brute force'dan keyingi muvaffaqiyatli kirish, (2) imtiyozlarni oshirishdan keyin
  ommaviy ma'lumotlarga kirish, (3) shaxsiy ma'lumotlar tizimlaridan katta hajmli chiquvchi uzatma,
  (4) ish vaqtidan tashqari admin akkaunt yaratilishi, (5) ma'lum zararli yoki anomal geografik
  joylashuvlardan muvaffaqiyatli kirish.
  Ushbu qoida bir necha soat ichida triage qilinishi shart bo'lgan HARAKATGA CHORLOVCHI alertlar yaratish uchun mo'ljallangan.
  Trigger: Shaxsiy ma'lumotlar tizimlarida muvaffaqiyatli kirish + anomal xulq kombinatsiyasi.
  False positive: Ish vaqtidan tashqari qonuniy admin ishlari, ruxsat etilgan penetration testing.
  Triage: DARHOL - Shaxsiy ma'lumotlarga kirilgani yoki eksfiltratsiya qilinganini aniqlang,
  ta'sirlangan ma'lumot subyektlari doirasini aniqlang, 72 soatlik Art.33 xabari qo'llanilishini baholang,
  DPO bilan darhol bog'laning, Art.33(3) xabari mazmuni uchun barcha forensik dalillarni saqlang.
description_ru: |
  Обнаруживает высокодостоверные индикаторы утечки персональных данных, запускающие 72-часовой
  отсчёт уведомления надзорного органа по статье 33(1) GDPR. Правило выявляет коррелированные
  события, явно указывающие на фактическое или вероятное раскрытие персональных данных, а не только на неудачные попытки.
  Индикаторы утечки: (1) успешный вход после перебора паролей (brute force), (2) массовый доступ к данным после
  повышения привилегий, (3) крупная исходящая передача данных из систем персональных данных,
  (4) административная учётная запись создана вне рабочих часов, (5) успешный доступ из известных
  вредоносных или аномальных географических локаций.
  Правило спроектировано для генерации ДЕЙСТВЕННЫХ алертов, которые должны быть разобраны в течение часов.
  Триггер: Сочетание успешного доступа + аномального поведения в системах персональных данных.
  Ложные срабатывания: Легитимная административная работа во внерабочее время, санкционированное тестирование на проникновение.
  Разбор: НЕМЕДЛЕННО - Определите, были ли персональные данные получены или выгружены,
  определите круг затронутых субъектов данных, оцените применимость 72-часового уведомления по Art.33,
  немедленно свяжитесь с DPO, сохраните все криминалистические доказательства для содержания уведомления по Art.33(3).
description_en: |
  Detects high-confidence personal data breach indicators that start the GDPR Article 33(1)
  72-hour notification clock to the supervisory authority. This rule identifies correlated
  events strongly suggesting actual or likely personal data exposure, not just failed attempts.
  Breach indicators: (1) successful login after brute force, (2) mass data access after
  privilege escalation, (3) large outbound data transfer from personal data systems,
  (4) admin account created outside business hours, (5) successful access from known
  malicious or anomalous geographic locations.
  This rule is designed to generate ACTIONABLE alerts that must be triaged within hours.
  Trigger: Combination of successful access + anomalous behavior on personal data systems.
  False positives: Legitimate after-hours admin work, authorized penetration testing.
  Triage: IMMEDIATE - Determine if personal data was accessed or exfiltrated,
  identify scope of affected data subjects, assess if 72h Art.33 notification applies,
  contact DPO immediately, preserve all forensic evidence for Art.33(3) notification content.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 5 minutes
    AND event.outcome == "success"
    AND event.code IN ("4624", "4648", "4672")
    AND NOT (
      winlog.event_data.TargetUserName LIKE "*$"
      OR winlog.event_data.TargetUserName == "ANONYMOUS LOGON"
    )
  | STATS
      successful_events       = COUNT(*),
      unique_users            = COUNT_DISTINCT(winlog.event_data.TargetUserName),
      unique_source_ips       = COUNT_DISTINCT(winlog.event_data.IpAddress),
      privileged_logons       = COUNT(CASE(event.code == "4672", 1, null)),
      network_logons          = COUNT(CASE(event.code == "4624", 1, null)),
      explicit_cred_use       = COUNT(CASE(event.code == "4648", 1, null)),
      users_involved          = VALUES(winlog.event_data.TargetUserName),
      source_ips              = VALUES(winlog.event_data.IpAddress),
      logon_hours             = VALUES(DATE_FORMAT("HH", @timestamp))
    BY agent_id, host.name,
       bucket = DATE_TRUNC(5 minutes, @timestamp)
  | EVAL breach_indicator_score =
      (privileged_logons * 3)
      + (explicit_cred_use * 2)
      + (CASE(unique_source_ips >= 3, 5, 0))
      + (CASE(unique_users >= 5, 4, 0))
  | WHERE breach_indicator_score >= 3
    OR (privileged_logons >= 1 AND explicit_cred_use >= 1)
    OR (unique_source_ips >= 3 AND successful_events >= 10)
  | EVAL gdpr_33_status = CASE(
      breach_indicator_score >= 10,
        "CRITICAL - HIGH CONFIDENCE BREACH: Start Art.33 72h clock. Notify DPO immediately.",
      breach_indicator_score >= 6,
        "HIGH - LIKELY BREACH: Triage within 1 hour. Assess Art.33 notification obligation.",
      "MEDIUM - POTENTIAL BREACH INDICATOR: Investigate within 4 hours for Art.33 assessment."
    )
  | EVAL severity_level = CASE(
      breach_indicator_score >= 10, "critical",
      breach_indicator_score >= 6,  "high",
      "medium"
    )
  | EVAL risk_score = CASE(
      breach_indicator_score >= 10, 98,
      breach_indicator_score >= 6,  80,
      60
    )
  | KEEP agent_id, bucket, host.name, successful_events, unique_users,
         unique_source_ips, privileged_logons, explicit_cred_use,
         users_involved, source_ips,
         breach_indicator_score, gdpr_33_status, severity_level, risk_score
  | SORT breach_indicator_score DESC
enabled: false
tags:
  - gdpr
  - breach_detection
  - art33
  - notification_trigger
  - personal_data
  - critical
severity: high
risk_score: 80
references:
  - "GDPR Article 33(1): Notify supervisory authority within 72 hours of becoming aware of breach"
  - "GDPR Article 33(3): Notification must include nature, categories, approximate number of data subjects"
  - "GDPR Article 34(1): Communicate high-risk breaches to data subjects without undue delay"
  - "GDPR Article 33(5): Document all personal data breaches"
gdpr: ["33.1", "33.3", "33.5", "34.1"]
nist: ["IR-6", "IR-4", "AU-6", "RA-3"]
pci_dss: ["12.10.1", "12.10.3"]
mitre_attack:
  TA0001:
    T1078: []
    T1133: []
  TA0006:
    T1110: []

