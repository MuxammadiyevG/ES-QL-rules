rule_id: 5db112bb-0a27-43b0-bd8b-d2d5c20f1b47
name_uz: "Office ilovasi shell ishga tushirmoqda"
name_ru: "Office-приложение запускает shell"
name_en: "Office Application Spawning Shell"
description_uz: |
  Ushbu qoida Office ilovasi (Word/Excel/PowerPoint/Outlook) shell yoki skript interpretatori
  ishga tushirishini aniqlaydi — fishing/makro orqali boshlang'ich ijro klassik belgisi
  (T1566/T1059). Sysmon 1 (ParentImage → Image).
  SOC triage:
  - `child` nima (powershell/cmd/wscript/mshta)? `command_lines` da nima?
description_ru: |
  Это правило обнаруживает запуск Office-приложением (Word/Excel/PowerPoint/Outlook) shell или интерпретатора
  скриптов — классический признак первичного выполнения через фишинг/макросы
  (T1566/T1059). Sysmon 1 (ParentImage → Image).
  SOC triage:
  - Что такое `child` (powershell/cmd/wscript/mshta)? Что в `command_lines`?
description_en: |
  This rule detects an Office application (Word/Excel/PowerPoint/Outlook) launching a shell or script
  interpreter — a classic sign of initial execution via phishing/macros
  (T1566/T1059). Sysmon 1 (ParentImage → Image).
  SOC triage:
  - What is `child` (powershell/cmd/wscript/mshta)? What is in `command_lines`?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "1"
  | EVAL parent = TO_LOWER(COALESCE(winlog.event_data.ParentImage, "-"))
  | EVAL child = TO_LOWER(COALESCE(winlog.event_data.Image, "-"))
  | EVAL cmd = COALESCE(winlog.event_data.CommandLine, "-")
  | EVAL actor = COALESCE(winlog.event_data.User, "-")
  | WHERE parent RLIKE ".*(winword|excel|powerpnt|outlook|mspub|onenote|msaccess).exe"
  | WHERE child RLIKE ".*(cmd|powershell|pwsh|wscript|cscript|mshta|rundll32|regsvr32|certutil|bitsadmin|schtasks).exe"
  | STATS
      exec_count = COUNT(*),
      children = VALUES(child),
      command_lines = VALUES(cmd),
      parents = VALUES(parent),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE exec_count >= 1
  | EVAL dyn_risk = 90
  | KEEP agent_id, bucket, winlog.computer_name, exec_count, children, command_lines, parents, users, dyn_risk, first_seen, last_seen
  | SORT exec_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.initial-access
  - attack.execution
  - attack.t1566
  - attack.t1059
  - Sysmon
severity: high
risk_score: 90
mitre_attack:
  TA0001:
    T1566: []
  TA0002:
    T1059: []
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
