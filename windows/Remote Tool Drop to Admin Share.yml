rule_id: d40248bb-2d62-459e-b43c-4e24e4dc5ece
name_uz: "Admin share'ga masofaviy tool tashlash (SMB)"
name_ru: "Сброс инструмента на административный ресурс (SMB)"
name_en: "Remote Tool Drop to Admin Share (SMB)"
description_uz: |
  Ushbu qoida administrativ share (C$/ADMIN$) ga masofadan bajariladigan fayl (exe/dll/bat/ps1)
  yozilishini aniqlaydi (5145 detailed file share + WriteData). Bu PsExec/lateral tool drop
  belgisidir (T1021.002/T1570).
  SOC triage:
  - `files` qaysi fayl yozildi, `accessing_user`/`src_ip` kim?
description_ru: |
  Это правило обнаруживает удалённую запись исполняемого файла (exe/dll/bat/ps1) на
  административный ресурс (C$/ADMIN$) (5145 detailed file share + WriteData). Это признак
  PsExec/lateral tool drop (T1021.002/T1570).
  SOC triage:
  - Какой файл записан в `files`, кто `accessing_user`/`src_ip`?
description_en: |
  This rule detects a remotely executable file (exe/dll/bat/ps1) being written to an
  administrative share (C$/ADMIN$) (5145 detailed file share + WriteData). This is a sign of
  PsExec/lateral tool drop (T1021.002/T1570).
  SOC triage:
  - Which file was written in `files`, who are `accessing_user`/`src_ip`?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "5145"
  | EVAL share = COALESCE(winlog.event_data.ShareName, "-")
  | EVAL rel = TO_LOWER(COALESCE(winlog.event_data.RelativeTargetName, "-"))
  | EVAL accessing_user = winlog.event_data.SubjectUserName
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, "-")
  | WHERE share LIKE "*C$" OR share LIKE "*ADMIN$"
  | WHERE accessing_user IS NOT NULL AND NOT accessing_user LIKE "*$"
  | WHERE rel RLIKE ".*(\\.exe|\\.dll|\\.bat|\\.ps1|\\.vbs|\\.scr|psexesvc|\\.tmp)$" OR rel RLIKE ".*(\\.exe|\\.dll|\\.bat|\\.ps1|psexesvc).*"
  | STATS
      write_count = COUNT(*),
      files = VALUES(rel),
      shares = VALUES(share),
      users = VALUES(accessing_user),
      src_ips = VALUES(src_ip),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, accessing_user, src_ip, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE write_count >= 1
  | EVAL dyn_risk = 85
  | KEEP agent_id, bucket, winlog.computer_name, accessing_user, src_ip, write_count, files, shares, users, src_ips, dyn_risk, first_seen, last_seen
  | SORT write_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.lateral-movement
  - attack.t1021.002
  - attack.t1570
  - Lateral Movement
severity: high
risk_score: 85
mitre_attack:
  TA0008:
    T1021: ["T1021.002"]
    T1570: []
nist: ["AC-17", "AU-2", "AU-12", "SI-4"]
pci_dss: ["10.2.5", "8.1.6"]
gdpr: ["32.1.a"]
