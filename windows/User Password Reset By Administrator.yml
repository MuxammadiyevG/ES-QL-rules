rule_id: ed60b92f-683a-4f01-b2dd-2c5d6c079735
name_uz: "Foydalanuvchi Parolini Reset Qilish — agent_id, Administrator"
name_ru: "Сброс пароля пользователя — agent_id, Administrator"
name_en: "User Password Reset By agent_id, Administrator"
description_uz: |
  Ushbu qoida credential access va lateral movement texnikalariga bog'liq bo'lib, `User Password Reset By agent_id, Administrator` kontekstidagi shubhali Active Directory faoliyatini aniqlaydi.
  Bu turdagi hodisa AD muhitida hujumchiga ruxsatsiz kirishni mustahkamlash, hisoblarni egallash yoki boshqaruv huquqlarini oshirish imkonini berishi mumkinligi sababli xavfli hisoblanadi.
  Qonuniy holatlar sifatida rejalashtirilgan administrativ ishlar, change/deployment jarayonlari, IAM sinxronizatsiyasi yoki servis konfiguratsiya yangilanishlari uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `actor` va `target_user` (yoki target obyekt) ni aniq identifikatsiya qiling.
  - O'zgarish/kirish uchun tasdiqlangan change ticket yoki deployment yozuvi borligini tekshiring.
  - `src_ip` manzili, manba host va tarmoq segmentining legitimligini tekshiring.
  - Ta'sirlangan akkaunt yoki obyektning guruh a'zoligi, ayniqsa imtiyozli guruhlar bilan bog'liqligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa tezkor containment bajaring: manbani cheklang, credentiallarni yangilang va ta'sir doirasini izolyatsiya qiling.
description_ru: |
  Это правило связано с техниками доступа к учётным данным (credential access) и горизонтального перемещения (lateral movement) и выявляет подозрительную активность Active Directory в контексте `User Password Reset By agent_id, Administrator`.
  Событие такого типа считается опасным, поскольку в среде AD оно может позволить злоумышленнику закрепить несанкционированный доступ, захватить учётные записи или повысить административные права.
  В качестве легитимных случаев могут встречаться плановые административные работы, процессы change/deployment, синхронизация IAM или обновления конфигурации сервисов.
  Этапы SOC-триажа:
  - Точно идентифицируйте `actor` и `target_user` (или целевой объект) в событии.
  - Проверьте наличие утверждённого change-тикета или записи о развёртывании для изменения/доступа.
  - Проверьте легитимность адреса `src_ip`, исходного хоста и сетевого сегмента.
  - Проверьте членство в группах затронутой учётной записи или объекта, особенно связь с привилегированными группами.
  - При подтверждении нелегитимной активности выполните оперативное сдерживание (containment): ограничьте источник, обновите учётные данные и изолируйте зону воздействия.
description_en: |
  This rule is related to credential access and lateral movement techniques and detects suspicious Active Directory activity in the context of `User Password Reset By agent_id, Administrator`.
  This type of event is considered dangerous because in an AD environment it can allow an attacker to establish unauthorized access, take over accounts, or escalate administrative rights.
  Legitimate cases may include scheduled administrative work, change/deployment processes, IAM synchronization, or service configuration updates.
  SOC triage steps:
  - Precisely identify the `actor` and `target_user` (or target object) in the event.
  - Check whether there is an approved change ticket or deployment record for the change/access.
  - Verify the legitimacy of the `src_ip` address, the source host, and the network segment.
  - Check the group membership of the affected account or object, especially any association with privileged groups.
  - If illegitimate activity is confirmed, perform rapid containment: restrict the source, rotate the credentials, and isolate the affected scope.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | EVAL hostn = winlog.computer_name
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.SubjectUserName)
  | EVAL target_user = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.SamAccountName)
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, winlog.event_data.IpAddress)
  // host-filtri olib tashlandi - barcha hostlarda ishlaydi (DC-only kerak bolsa qolda yoqing)
  | WHERE NOT actor LIKE "*$"
  | WHERE event.code == "4724"
  | EVAL 
      target_account = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.TargetUserName, "Unknown"),
      reset_by = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.SubjectUserName, "Unknown"),
      reset_by_domain = COALESCE(winlog.event_data.SubjectDomainName, winlog.event_data.SubjectDomainName, "Unknown"),
      target_sid = COALESCE(winlog.event_data.TargetSid, "Unknown")
  /* Exclude self-service password resets */
  | WHERE target_account != reset_by
  | STATS 
      resets_performed = COUNT(*),
      accounts_reset = COUNT_DISTINCT(target_account),
      reset_accounts_list = VALUES(target_account),
      sids = VALUES(target_sid),
      first_reset = MIN(@timestamp),
      last_reset = MAX(@timestamp)
    BY agent_id, winlog.computer_name, reset_by, reset_by_domain, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE resets_performed >= 1
  | EVAL 
      alert_level = CASE(
        accounts_reset >= 10, "Critical - Mass Reset",
        accounts_reset >= 5, "High - Multiple Resets",
        "Medium - Standard Reset"
      )
  | KEEP agent_id, bucket, winlog.computer_name, reset_by, reset_by_domain, resets_performed,
      accounts_reset, reset_accounts_list, alert_level, first_reset, last_reset
  | SORT accounts_reset DESC
  | LIMIT 200
enabled: false
tags:
  - attack.persistence
  - attack.credential-access
  - attack.t1098
  - detection.configuration-change
severity: high
risk_score: 75
mitre_attack:
  TA0003:
    T1098: []
  TA0006:
    T1110: []
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
