rule_id: 78be1990-8025-4c92-a216-38381b55acca
name_uz: "Audit siyosati konfiguratsiyasi - joriy holat"
name_ru: "Конфигурация политики аудита - текущее состояние"
name_en: "Audit Policy Configuration - Current State"
description_uz: |
  Baseline/compliance qoidasi: audit policy o'zgarishlarini (4719) yig'adi va mavjud
  subkategoriya/o'zgarish maydonlarini ko'rsatadi. Audit konfiguratsiyasining holatini
  kuzatish uchun (alert emas; tahdid varianti "Audit Policy Disabled or Modified" rule'ida).
description_ru: |
  Правило baseline/compliance: собирает изменения audit policy (4719) и отображает доступные
  поля подкатегории/изменения. Предназначено для наблюдения за состоянием конфигурации
  аудита (не алерт; вариант для угроз — в правиле "Audit Policy Disabled or Modified").
description_en: |
  Baseline/compliance rule: collects audit policy changes (4719) and shows the available
  subcategory/change fields. Intended for monitoring the state of the audit configuration
  (not an alert; the threat variant is in the "Audit Policy Disabled or Modified" rule).
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4719"
  | EVAL configuring_user = COALESCE(winlog.event_data.SubjectUserName, "-")
  | EVAL category    = COALESCE(winlog.event_data.CategoryId, "-")
  | EVAL subcategory = COALESCE(winlog.event_data.SubcategoryId, winlog.event_data.SubcategoryGuid, "-")
  | EVAL changes     = COALESCE(winlog.event_data.AuditPolicyChanges, "-")
  | STATS
      config_changes = COUNT(*),
      categories = VALUES(category),
      subcategories = VALUES(subcategory),
      change_values = VALUES(changes),
      users = VALUES(configuring_user),
      first_change = MIN(@timestamp),
      last_change  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 day, @timestamp)
  | WHERE config_changes >= 1
  | KEEP agent_id, bucket, winlog.computer_name, config_changes, categories, subcategories,
      change_values, users, first_change, last_change
  | SORT config_changes DESC
  | LIMIT 200
enabled: false
tags:
  - detection.baseline
  - detection.compliance
  - monitoring.audit-policy
severity: low
risk_score: 30
nist: ["AC-17", "AU-6", "AU-12", "CM-6"]
pci_dss: ["10.2.7", "10.2", "2.2"]
gdpr: ["32.1.a"]
mitre_attack: []
