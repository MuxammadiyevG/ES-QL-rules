rule_id: ffb30f0c-9711-48e8-bb48-1a9d431992e9
name_uz: "PowerShell noodatiy jarayonda yuklangan"
name_ru: "PowerShell размещён в необычном процессе"
name_en: "PowerShell Hosted in Unusual Process"
description_uz: |
  Ushbu qoida PowerShell engine'ning noodatiy jarayonda yuklanishini aniqlaydi (Windows
  PowerShell 400/600, HostApplication powershell/ISE emas) — bu unmanaged PowerShell /
  custom runspace (Cobalt Strike, injection) belgisidir (T1059.001).
  ESLATMA: ko'p qonuniy host bor (sqlps, vscode...) — o'z muhitingizga moslab allowlist
  kengaytiring; shuning uchun dastlab enabled:false.
  SOC triage:
  - `details` da HostApplication nima? Ro'yxatdagi bo'lmasa — chuqur tekshiring.
description_ru: |
  Это правило обнаруживает загрузку движка PowerShell в необычном процессе (Windows
  PowerShell 400/600, HostApplication не powershell/ISE) — это признак unmanaged PowerShell /
  custom runspace (Cobalt Strike, injection) (T1059.001).
  ПРИМЕЧАНИЕ: легитимных хостов много (sqlps, vscode...) — расширьте allowlist под своё
  окружение; поэтому изначально enabled:false.
  SOC triage:
  - Что в `details` указано в HostApplication? Если его нет в списке — проверьте углублённо.
description_en: |
  This rule detects the PowerShell engine being loaded in an unusual process (Windows
  PowerShell 400/600, HostApplication other than powershell/ISE) — a sign of unmanaged
  PowerShell / a custom runspace (Cobalt Strike, injection) (T1059.001).
  NOTE: there are many legitimate hosts (sqlps, vscode...) — extend the allowlist to fit
  your own environment; that is why it is enabled:false initially.
  SOC triage:
  - What is HostApplication in `details`? If it is not on the list — investigate in depth.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Windows PowerShell"
  | WHERE event.code IN ("400", "600")
  | EVAL detail = TO_LOWER(CONCAT(COALESCE(winlog.event_data.param1, ""), " ", COALESCE(winlog.event_data.param2, ""), " ", COALESCE(winlog.event_data.param3, "")))
  | WHERE detail RLIKE ".*hostapplication=.*"
  | WHERE NOT detail RLIKE ".*hostapplication=.*(powershell(\\.exe)?|powershell_ise\\.exe|powershell\\\\v1.0|sqlps|sqltoolsps|code\\.exe|devenv|wsmprovhost|sdiagnhost|servermanager|system32.*windowspowershell).*"
  | STATS
      hits = COUNT(*),
      details = VALUES(detail),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = 80
  | KEEP agent_id, bucket, winlog.computer_name, hits, details, dyn_risk, first_seen, last_seen
  | SORT hits DESC
  | LIMIT 200
enabled: false
tags:
  - attack.execution
  - attack.defense-evasion
  - attack.t1059.001
  - PowerShell
severity: high
risk_score: 80
mitre_attack:
  TA0002:
    T1059: ["T1059.001"]
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
