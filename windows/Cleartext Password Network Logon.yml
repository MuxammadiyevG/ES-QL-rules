rule_id: 6ebb13a3-5574-4581-8cbf-3f74eb14dfc8
name_uz: "Ochiq matnli parol bilan tarmoq kirishi (Type 8)"
name_ru: "Сетевой вход с паролем в открытом виде (Type 8)"
name_en: "Cleartext Password Network Logon (Type 8)"
description_uz: |
  Ushbu qoida LogonType 8 (NetworkCleartext) muvaffaqiyatli kirishni aniqlaydi (4624) —
  parol tarmoq orqali ochiq/qaytariladigan ko'rinishda yuborilgan (masalan IIS Basic Auth,
  ba'zi skriptlar). Bu credential interception xavfini va noto'g'ri konfiguratsiyani ko'rsatadi
  (T1078).
  SOC triage:
  - `target_user`/`src_ip`/`process` — qaysi ilova cleartext auth ishlatyapti?
description_ru: |
  Это правило выявляет успешный вход с LogonType 8 (NetworkCleartext) (4624) —
  пароль передан по сети в открытом/обратимом виде (например IIS Basic Auth,
  некоторые скрипты). Это указывает на риск перехвата учётных данных и на ошибку конфигурации
  (T1078).
  Триаж SOC:
  - `target_user`/`src_ip`/`process` — какое приложение использует cleartext auth?
description_en: |
  This rule detects a successful logon with LogonType 8 (NetworkCleartext) (4624) —
  the password was sent over the network in cleartext/reversible form (for example IIS Basic Auth,
  some scripts). This indicates a credential interception risk and a misconfiguration
  (T1078).
  SOC triage:
  - `target_user`/`src_ip`/`process` — which application is using cleartext auth?
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4624"
  | WHERE winlog.event_data.LogonType == "8"
  | EVAL target_user = winlog.event_data.TargetUserName
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, "-")
  | EVAL proc = COALESCE(winlog.event_data.ProcessName, "-")
  | EVAL auth_pkg = COALESCE(winlog.event_data.AuthenticationPackageName, "-")
  | WHERE target_user IS NOT NULL AND NOT target_user LIKE "*$"
  | STATS
      logon_count = COUNT(*),
      unique_users = COUNT_DISTINCT(target_user),
      users = VALUES(target_user),
      src_ips = VALUES(src_ip),
      processes = VALUES(proc),
      auth_packages = VALUES(auth_pkg),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE logon_count >= 1
  | EVAL dyn_risk = 72
  | KEEP agent_id, bucket, winlog.computer_name, logon_count, unique_users, users, src_ips, processes, auth_packages, dyn_risk, first_seen, last_seen
  | SORT logon_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.credential-access
  - attack.t1078
  - AuthAnomaly
severity: medium
risk_score: 72
mitre_attack:
  TA0001:
    T1078: []
nist: ["AC-7", "AU-12", "IA-5"]
pci_dss: ["8.2.1", "4.1"]
gdpr: ["32.1.a"]
