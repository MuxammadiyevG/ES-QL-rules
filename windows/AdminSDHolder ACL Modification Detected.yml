rule_id: a8c047ab-fd43-4f05-953a-19750f2c0756
name_uz: "AdminSDHolder ACL o'zgartirilishi aniqlandi"
name_ru: "Обнаружено изменение ACL объекта AdminSDHolder"
name_en: "AdminSDHolder ACL Modification Detected"
description_uz: |
  Ushbu qoida AdminSDHolder obyektiga o'zgarishni aniqlaydi: 5136/5137 da `ObjectName`
  ichida "AdminSDHolder" bo'lsa. AdminSDHolder ACL'ini o'zgartirish SDProp orqali barcha
  Tier-0 akkauntlarga yashirin doimiy huquq beradi.
  ESLATMA: sizning indeksingizda `ObjectDN`/`AttributeLDAPDisplayName` MAVJUD EMAS — DN
  uchun `ObjectName` ishlatildi. Agar 5136 obyekt DN'ini ObjectName'ga yozmasa, bu rule
  hech narsa qaytarmaydi (xato bermaydi). To'liq ishlash uchun "Audit Directory Service
  Changes" subkategoriyasini va DN/attribute parsing'ni yoqing.
  SOC triage:
  - `modifier` kim, `objects` da AdminSDHolder o'zgarganmi?
  - Tasdiqlanmasa: ACL'ni tiklang, Tier-0 IR.
description_ru: |
  Это правило обнаруживает изменение объекта AdminSDHolder: если в 5136/5137 внутри `ObjectName`
  содержится "AdminSDHolder". Изменение ACL объекта AdminSDHolder через SDProp даёт всем
  учётным записям Tier-0 скрытые постоянные права.
  ПРИМЕЧАНИЕ: в вашем индексе `ObjectDN`/`AttributeLDAPDisplayName` ОТСУТСТВУЮТ — для DN
  использовано `ObjectName`. Если 5136 не записывает DN объекта в ObjectName, это правило
  ничего не вернёт (ошибки не будет). Для полноценной работы включите подкатегорию "Audit Directory Service
  Changes" и парсинг DN/атрибутов.
  SOC triage:
  - Кто такой `modifier`, изменился ли AdminSDHolder в `objects`?
  - Если не подтверждено: восстановите ACL, Tier-0 IR.
description_en: |
  This rule detects a modification of the AdminSDHolder object: when `ObjectName`
  in 5136/5137 contains "AdminSDHolder". Modifying the AdminSDHolder ACL grants hidden
  permanent rights to all Tier-0 accounts via SDProp.
  NOTE: `ObjectDN`/`AttributeLDAPDisplayName` DO NOT EXIST in your index — `ObjectName`
  was used for the DN. If 5136 does not write the object DN into ObjectName, this rule
  returns nothing (it does not error). For full operation, enable the "Audit Directory Service
  Changes" subcategory and DN/attribute parsing.
  SOC triage:
  - Who is `modifier`, did AdminSDHolder change in `objects`?
  - If not confirmed: restore the ACL, Tier-0 IR.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code IN ("5136", "5137")
  | EVAL modifier   = winlog.event_data.SubjectUserName
  | EVAL object_name = COALESCE(winlog.event_data.ObjectName, "-")
  | EVAL object_type = COALESCE(winlog.event_data.ObjectType, "-")
  | EVAL op_raw     = COALESCE(winlog.event_data.OperationType, "-")
  | EVAL operation  = CASE(op_raw == "%%14674", "Value Added", op_raw == "%%14675", "Value Deleted", op_raw)
  | EVAL src_ip     = COALESCE(winlog.event_data.IpAddress, "-")
  | WHERE TO_LOWER(object_name) RLIKE ".*adminsdholder.*"
  | WHERE modifier IS NOT NULL
  | STATS
      modifications = COUNT(*),
      objects = VALUES(object_name),
      object_types = VALUES(object_type),
      operations = VALUES(operation),
      src_ips = VALUES(src_ip),
      first_modification = MIN(@timestamp),
      last_modification  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, modifier, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE modifications >= 1
  | EVAL dyn_risk = 97
  | KEEP agent_id, bucket, winlog.computer_name, modifier, modifications, objects, object_types,
      operations, src_ips, dyn_risk, first_modification, last_modification
  | SORT modifications DESC
  | LIMIT 200
enabled: true
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098
  - detection.critical
severity: high
risk_score: 95
mitre_attack:
  TA0003:
    T1098: []
  TA0004:
    T1098: []
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
