rule_id: b0ae1c14-9495-4b0a-9b47-cc19e9cde8eb
name_uz: "Yuklab olingan bajariluvchi fayl / Alternate Data Stream"
name_ru: "Загруженный исполняемый файл / Alternate Data Stream"
name_en: "Downloaded Executable / Alternate Data Stream"
description_uz: |
  Ushbu qoida internet'dan yuklangan bajariladigan fayllarni (Mark-of-the-Web Zone.Identifier
  ADS) yoki bajariluvchi faylga yozilgan alternate data stream'ni aniqlaydi (Sysmon 15).
  Yuklab olingan exe/script ko'pincha boshlang'ich ijro vektori (T1553.005/T1059).
  SOC triage:
  - `files` qaysi exe/script, `contents` (zone)? `images` kim yozdi?
description_ru: |
  Это правило выявляет исполняемые файлы, загруженные из интернета (Mark-of-the-Web Zone.Identifier
  ADS), или alternate data stream, записанный в исполняемый файл (Sysmon 15).
  Загруженный exe/script часто является начальным вектором исполнения (T1553.005/T1059).
  SOC triage:
  - Какой exe/script в `files`, какой `contents` (zone)? Кто записал по `images`?
description_en: |
  This rule detects executable files downloaded from the internet (Mark-of-the-Web Zone.Identifier
  ADS) or an alternate data stream written to an executable file (Sysmon 15).
  A downloaded exe/script is often an initial execution vector (T1553.005/T1059).
  SOC triage:
  - Which exe/script is in `files`, what is `contents` (zone)? Who wrote it per `images`?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "15"
  | EVAL tfn = TO_LOWER(COALESCE(winlog.event_data.TargetFilename, "-"))
  | EVAL contents = COALESCE(winlog.event_data.Contents, "-")
  | EVAL img = COALESCE(winlog.event_data.Image, "-")
  | EVAL actor = COALESCE(winlog.event_data.User, "-")
  | WHERE tfn RLIKE ".*\\.(exe|dll|ps1|bat|cmd|js|jse|vbs|vbe|hta|scr|lnk|iso|img):.*"
      OR tfn RLIKE ".*\\.(exe|dll|ps1|bat|js|vbs|hta|scr).*zone.identifier.*"
  | STATS
      hits = COUNT(*),
      files = VALUES(tfn),
      contents = VALUES(contents),
      images = VALUES(img),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = 72
  | KEEP agent_id, bucket, winlog.computer_name, hits, files, contents, images, users, dyn_risk, first_seen, last_seen
  | SORT hits DESC
  | LIMIT 200
enabled: false
tags:
  - attack.execution
  - attack.defense-evasion
  - attack.t1553.005
  - File
severity: medium
risk_score: 65
mitre_attack:
  TA0005:
    T1553: ["T1553.005"]
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
