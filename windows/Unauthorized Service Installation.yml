rule_id: 934e7f06-ec03-4633-b2d7-1cd10f660653
#//RULE-NIST-13 — Baseline Configuration Drift (NIST CM-2)
#//Control Family: CM (Configuration Management)
#//Objective: Detect deviations from approved baseline configurations
#//Threat scenario: Unauthorized software installation or service enablement
#//Data sources: Windows services started, Linux systemd service changes
#//ECS fields used: event.action, event.provider, process.name
#//Field validation: Verify all ECS fields exist in your indices before enabling
#//Tuning notes: Requires approved service baseline, adjust for environment-specific services
#
name_uz: "Ruxsatsiz servis o'rnatilishi"
name_ru: "Неавторизованная установка службы"
name_en: "Unauthorized Service Installation"
description_uz: |
  Tasdiqlangan baseline'da bo'lmagan yangi Windows servislari yoki Linux systemd unitlarining o'rnatilishi yoki ishga tushirilishini aniqlaydi.
  Yangi servislar ko'pincha malware mustahkamlanishi (persistence), RAT tarqatilishi yoki ruxsatsiz dasturiy ta'minot belgisidir.
  G'ayrioddiy yo'llardan ishga tushadigan yoki shubhali nomga ega servislarga e'tibor bering.
  False positive: qonuniy dasturiy ta'minot o'rnatishlari, Windows yangilanishlari, drayver o'rnatishlari.
  Triage: servis bajariluvchi faylining imzosini tekshiring, servis yo'li legitimligini tasdiqlang, 
  o'rnatish change management orqali ruxsat etilganini ko'rib chiqing.
description_ru: |
  Выявляет установку или запуск новых служб Windows или юнитов systemd в Linux, отсутствующих в утверждённом baseline.
  Новые службы часто указывают на закрепление вредоносного ПО, развёртывание RAT или неавторизованное программное обеспечение.
  Обратите внимание на службы, запускающиеся из необычных путей или с подозрительными именами.
  Ложные срабатывания: легитимная установка ПО, обновления Windows, установка драйверов.
  Triage: проверьте подпись исполняемого файла службы, подтвердите легитимность пути службы, 
  проверьте, была ли установка авторизована через change management.
description_en: |
  Detects installation or starting of new Windows services or Linux systemd units not in approved baseline.
  New services often indicate malware persistence, RAT deployment, or unauthorized software.
  Focus on services starting from unusual paths or with suspicious names.
  False positives: Legitimate software installations, Windows updates, driver installations.
  Triage: Check service executable signature, verify service path legitimacy, 
  review if installation authorized via change management.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-winlog*
  - logs-updive.audit*
query_language: esql
query: |
 FROM logs-updive.audit*, logs-winlog*
  | WHERE @timestamp > NOW() - 15 minutes
  | WHERE event.code IN ("7045", "4697")
    OR (event.action IN ("service-installed", "service-started") AND event.provider IS NOT NULL)
  | EVAL service_path = COALESCE(winlog.event_data.ImagePath, event.original)
  | EVAL service_name = COALESCE(winlog.event_data.ServiceName, event.provider)
  | EVAL suspicious_path = CASE(
      /* Use TO_LOWER + lowercase patterns: (?i) inline flag is not supported in ES|QL RLIKE */
      TO_LOWER(service_path) RLIKE ".*(\\\\users\\\\|\\\\temp\\\\|\\\\appdata\\\\|/tmp/|/var/tmp/).*", true,
      TO_LOWER(service_path) RLIKE ".*(powershell|bash|python|perl|ruby).*", true,
      false
    )
  | EVAL suspicious_name = CASE(
      /* Searching for masquerading names using winlog.event_data.ServiceName, not event.provider */
      TO_LOWER(service_name) RLIKE ".*(update|svc|system|windows|google|adobe).*", true,
      false
    )
  | WHERE suspicious_path == true OR suspicious_name == true
  | STATS
      new_services = COUNT(*),
      service_names = VALUES(service_name),
      service_paths = VALUES(service_path),
      installers = VALUES(host.name)
    BY agent_id, host.name, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE new_services >= 1
  | EVAL risk_score = new_services * 30
  | KEEP agent_id, bucket, host.name, new_services, service_names, service_paths, installers, risk_score
  | SORT risk_score DESC
enabled: false
tags:
  - nist_800_53
  - control_CM-2
  - family_CM
  - persistence
  - privilege_escalation
severity: high
risk_score: 75
references:
  - "NIST SP 800-53 Rev.5 CM-2: Baseline Configuration"
  - "MITRE ATT&CK T1543.003: Windows Service"
nist: ["CM-2"]
pci_dss: ["2.2"]
mitre_attack:
  TA0003:
    T1543.003: []