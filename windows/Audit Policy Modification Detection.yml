rule_id: 5782b3da-79d6-4e0f-8234-46107140512f
#//RULE-NIST-07 — Audit Configuration Tampering (NIST AU-2, AU-12)
#//Control Family: AU (Audit and Accountability)
#//Objective: Detect modification of audit policy or logging configuration
#//Threat scenario: Attacker disables logging to operate undetected
#//Data sources: Windows Security 4719, Linux auditd config changes
#//ECS fields used: event.code, event.action, event.original, file.path
#//Field validation: Verify all ECS fields exist in your indices before enabling
#//Tuning notes: Baseline normal audit policy changes, allowlist SCCM/GPO update windows
#
name_uz: "Audit siyosatining o'zgartirilishini aniqlash"
name_ru: "Обнаружение изменения политики аудита"
name_en: "Audit Policy Modification Detection"
description_uz: |
  Tizim audit siyosati, event log sozlamalari yoki auditd konfiguratsiyasidagi o'zgarishlarni aniqlaydi.
  Audit izlarini o'chirish ko'plab murakkab hujumlar va APT kampaniyalari uchun dastlabki shart hisoblanadi.
  Windows registrida audit siyosatlariga kiritilgan o'zgarishlar yoki Linux auditd.conf o'zgarishlari qamrab olinadi.
  False positive: Group Policy yangilanishlari, qonuniy security hardening, compliance skanerlari.
  Triage: o'zgarish change management orqali tasdiqlanganini tekshiring, hujumchida admin huquqi bor-yo'qligini tekshiring,
  qaysi hodisalar o'chirilganini ko'rib chiqing (muvaffaqiyatsiz kirishlarmi? imtiyozdan foydalanishmi?).
description_ru: |
  Обнаруживает изменения политики аудита системы, настроек журнала событий или конфигурации auditd.
  Отключение журналов аудита является предпосылкой для многих продвинутых атак и APT-кампаний.
  Фиксируются изменения политик аудита в реестре Windows или изменения Linux auditd.conf.
  Ложные срабатывания: обновления Group Policy, легитимное усиление защиты (security hardening), сканирование на соответствие требованиям.
  Триаж: убедитесь, что изменение согласовано через change management, проверьте, есть ли у злоумышленника права администратора,
  просмотрите, какие события были отключены (неудачные входы? использование привилегий?).
description_en: |
  Detects changes to system audit policy, event log settings, or auditd configuration.
  Disabling audit trails is prerequisite for many advanced attacks and APT campaigns.
  Windows registry modifications to audit policies or Linux auditd.conf changes captured.
  False positives: Group Policy updates, legitimate security hardening, compliance scans.
  Triage: Verify change authorized via change management, check if attacker has admin access, 
  review what events were disabled (failed logins? privilege use?).
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp > NOW() - 15 minutes
  | WHERE event.code == "4719"
  | EVAL change_type = "Windows-AuditPolicy-Change",
    modifier = winlog.user.name
  | STATS
      change_count = COUNT(*),
      changed_items = VALUES(winlog.event_data.AuditPolicyChanges),
      modifiers = VALUES(modifier)
    BY agent_id, host.name, change_type
    , bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE change_count >= 1
  | EVAL risk_score = change_count * 35
  | KEEP agent_id, bucket, host.name, change_type, change_count, changed_items, modifiers, risk_score
  | SORT risk_score DESC
enabled: false
tags:
  - nist_800_53
  - control_AU-2
  - control_AU-12
  - family_AU
  - defense_evasion
  - impair_defenses
severity: high
risk_score: 78
references:
  - "NIST SP 800-53 Rev.5 AU-12: Audit Record Generation"
  - "MITRE ATT&CK T1562.002: Disable Windows Event Logging"
nist: ["AU-2", "AU-12"]
pci_dss: ["10.5"]
mitre_attack:
  TA0005:
    T1562: ["T1562.002"]