rule_id: 87e7244e-1025-4a91-b934-ea78a69557c3
name_uz: "Foydalanuvchi imtiyozli xavfsizlik guruhiga qo'shildi"
name_ru: "Пользователь добавлен в привилегированную группу безопасности"
name_en: "User Added to Privileged Security Group"
description_uz: |
  Ushbu qoida privilege escalation va persistence texnikalariga bog'liq bo'lib, `User Added to Privileged Security Group` kontekstidagi shubhali Active Directory faoliyatini aniqlaydi.
  Bu turdagi hodisa AD muhitida hujumchiga ruxsatsiz kirishni mustahkamlash, hisoblarni egallash yoki boshqaruv huquqlarini oshirish imkonini berishi mumkinligi sababli xavfli hisoblanadi.
  Qonuniy holatlar sifatida rejalashtirilgan administrativ ishlar, change/deployment jarayonlari, IAM sinxronizatsiyasi yoki servis konfiguratsiya yangilanishlari uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `actor` va `target_user` (yoki target obyekt) ni aniq identifikatsiya qiling.
  - O'zgarish/kirish uchun tasdiqlangan change ticket yoki deployment yozuvi borligini tekshiring.
  - `src_ip` manzili, manba host va tarmoq segmentining legitimligini tekshiring.
  - Ta'sirlangan akkaunt yoki obyektning guruh a'zoligi, ayniqsa imtiyozli guruhlar bilan bog'liqligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa tezkor containment bajaring: manbani cheklang, credentiallarni yangilang va ta'sir doirasini izolyatsiya qiling.
description_ru: |
  Данное правило связано с техниками privilege escalation и persistence и выявляет подозрительную активность Active Directory в контексте `User Added to Privileged Security Group`.
  Событие такого типа считается опасным, поскольку в среде AD оно может позволить злоумышленнику закрепить несанкционированный доступ, захватить учётные записи или повысить административные права.
  Легитимными случаями могут быть плановые административные работы, процессы change/deployment, синхронизация IAM или обновления конфигурации сервисов.
  Шаги SOC triage:
  - Точно идентифицируйте `actor` и `target_user` (или целевой объект) в событии.
  - Проверьте наличие утверждённого change ticket или записи о deployment для изменения/доступа.
  - Проверьте легитимность адреса `src_ip`, исходного хоста и сетевого сегмента.
  - Проверьте членство в группах затронутой учётной записи или объекта, особенно связь с привилегированными группами.
  - При подтверждении нелегитимной активности выполните оперативный containment: ограничьте источник, обновите учётные данные и изолируйте область воздействия.
description_en: |
  This rule is related to privilege escalation and persistence techniques and detects suspicious Active Directory activity in the context of `User Added to Privileged Security Group`.
  This type of event is considered dangerous because in an AD environment it can allow an attacker to consolidate unauthorized access, take over accounts, or elevate administrative rights.
  Legitimate cases may include scheduled administrative work, change/deployment processes, IAM synchronization, or service configuration updates.
  SOC triage steps:
  - Precisely identify the `actor` and `target_user` (or target object) in the event.
  - Check whether an approved change ticket or deployment record exists for the change/access.
  - Verify the legitimacy of the `src_ip` address, the source host, and the network segment.
  - Check the group membership of the affected account or object, especially its association with privileged groups.
  - If illegitimate activity is confirmed, perform rapid containment: restrict the source, rotate credentials, and isolate the scope of impact.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code IN ("4728", "4732", "4756")
  | EVAL
      added_user = COALESCE(winlog.event_data.MemberName, "Unknown"),
      group_name = COALESCE(winlog.event_data.TargetUserName, "Unknown"),
      added_by = COALESCE(winlog.event_data.SubjectUserName, "Unknown"),
      added_by_domain = COALESCE(winlog.event_data.SubjectDomainName, "Unknown"),
      group_sid = COALESCE(winlog.event_data.TargetSid, "Unknown")
  /* Match privileged group SIDs:
     Builtin local groups (S-1-5-32-*) and domain groups by RID suffix (S-1-5-21-*-RID).
     DC machine accounts (actor ending with $) are intentionally included because
     domain controllers legitimately generate these events during group changes. */
  | WHERE group_sid IN (
      "S-1-5-32-544",    /* Administrators */
      "S-1-5-32-548",    /* Account Operators */
      "S-1-5-32-549",    /* Server Operators */
      "S-1-5-32-550",    /* Print Operators */
      "S-1-5-32-551",    /* Backup Operators */
      "S-1-5-32-552"     /* Replicators */
    )
    OR group_sid LIKE "S-1-5-21-*-512"    /* Domain Admins */
    OR group_sid LIKE "S-1-5-21-*-519"    /* Enterprise Admins */
    OR group_sid LIKE "S-1-5-21-*-518"    /* Schema Admins */
    OR group_sid LIKE "S-1-5-21-*-544"    /* Domain-local Administrators */
    OR group_sid LIKE "S-1-5-21-*-548"    /* Domain Account Operators */
    OR group_sid LIKE "S-1-5-21-*-549"    /* Domain Server Operators */
    OR group_sid LIKE "S-1-5-21-*-551"    /* Domain Backup Operators */
    OR TO_LOWER(group_name) RLIKE ".*(domain admins|enterprise admins|schema admins|administrators|account operators|backup operators|server operators|print operators|group policy creator|dnsadmins|cert publishers|администраторы домена|операторы учётных записей|операторы серверов|операторы резервного копирования|операторы печати).*"
  | STATS 
      privileged_additions = COUNT(*),
      users_added = VALUES(added_user),
      privileged_groups = VALUES(group_name),
      group_sids = VALUES(group_sid),
      first_addition = MIN(@timestamp),
      last_addition = MAX(@timestamp)
    BY agent_id, winlog.computer_name, added_by, added_by_domain, bucket = DATE_TRUNC(15 minutes, @timestamp)
  | WHERE privileged_additions >= 1
  | KEEP agent_id, bucket, winlog.computer_name, added_by, added_by_domain, privileged_additions,
      users_added, privileged_groups, group_sids, first_addition, last_addition
  | SORT privileged_additions DESC
  | LIMIT 200
enabled: false
tags:
  - attack.privilege-escalation
  - attack.persistence
  - attack.t1098
  - attack.t1078.002
  - detection.critical
severity: high
risk_score: 95
mitre_attack:
  TA0004:
    T1098: []
    T1078: ["T1078.002"]
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
