rule_id: a082232c-7b33-4ff0-8b7e-5ba86592727d
name: User Logon Outside Business Hours
description: |
  Ushbu qoida ish vaqtidan tashqari (Du-Ju 06:00-22:00 dan tashqari, dam olish kunlari)
  foydalanuvchi logon'larini aniqlaydi (4624, LogonType 2/3/7/10). Servis/admin/mashina
  akkauntlari chiqariladi. Off-hours kirish o'g'irlangan credential yoki insider belgisi
  bo'lishi mumkin.
  Eslatma: vaqt UTC bo'yicha; ish vaqti oynasini o'z mintaqangizga moslang.
  SOC triage:
  - `target_user`/`source_ips` odatiy egasimi, shu vaqtda kutilganmi?
  - Tasdiqlanmasa: akkauntni tekshiring, kontekstni (VPN, on-call) aniqlang.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4624"
  // LogonType 3 (network) fires hundreds of times per session for SMB/mapped drives; exclude to reduce noise
  | WHERE winlog.event_data.LogonType IN ("2", "7", "10")
  | EVAL target_user = winlog.event_data.TargetUserName
  | EVAL source_ip   = COALESCE(winlog.event_data.IpAddress, "-")
  | EVAL workstation = COALESCE(winlog.event_data.WorkstationName, "-")
  | EVAL logon_type  = winlog.event_data.LogonType
  | EVAL hour_of_day = DATE_EXTRACT("hour_of_day", @timestamp)
  | EVAL day_of_week = DATE_EXTRACT("day_of_week", @timestamp)
  | WHERE target_user IS NOT NULL AND NOT target_user LIKE "*$"
  | WHERE NOT TO_LOWER(target_user) RLIKE "(system|anonymous logon|dwm-.*|umfd-.*|svc[-_].*|.*service.*|administrator|admin.*)"
  // Ish vaqtidan tashqari: dam olish kuni (1=Du..7=Ya) yoki 06:00 dan oldin / 22:00 dan keyin (UTC)
  | WHERE day_of_week > 5 OR hour_of_day < 6 OR hour_of_day >= 22
  | STATS
      logon_count = COUNT(*),
      logon_types = VALUES(logon_type),
      source_ips  = VALUES(source_ip),
      workstations = VALUES(workstation),
      first_logon = MIN(@timestamp),
      last_logon  = MAX(@timestamp)
    BY target_user, bucket = DATE_TRUNC(4 hours, @timestamp)
  | WHERE logon_count >= 1
  | EVAL dyn_risk = 70
  | KEEP target_user, bucket, logon_count, logon_types, source_ips, workstations,
      dyn_risk, first_logon, last_logon
  | SORT logon_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.initial-access
  - attack.persistence
  - attack.t1078
  - detection.anomaly
severity: medium
risk_score: 75
mitre_attack:
  TA0001:
    T1078: []
  TA0003:
    T1078: []
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
