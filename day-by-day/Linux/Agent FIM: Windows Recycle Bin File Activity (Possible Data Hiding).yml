rule_id: ded7b5e3-fa51-4f66-89f3-c1d31306a92d
name: "Agent FIM: Windows Recycle Bin File Activity (Possible Data Hiding)"
description: |
  Ushbu qoida Defense Evasion va Collection texnikalariga bog'liq bo'lib, Windows
  Recycle Bin ($Recycle.Bin) katalogida fayl faoliyatini aniqlaydi. Hujumchi
  o'g'irlangan ma'lumotlarni yoki zararli fayllarni Recycle Bin ichida yashirishi,
  yoki o'chirilgan fayllar orqali artefaktlarni yo'q qilishi mumkin.
  Qonuniy holatlar: foydalanuvchi fayl o'chirishi.
  SOC triage bosqichlari:
  - `file.extension` — exe, dll, zip bo'lsa yuqori xavf.
  - `file.size` — katta hajmli fayl staging uchun ishlatilgan bo'lishi mumkin.
  - `file.owner` — SYSTEM tomonidan yaratilgan Recycle Bin fayli shubhali.
  - `file.mtime` — hujum vaqti bilan mosligini tekshiring.
  - Noqonuniy bo'lsa: faylni forensic tahlil qiling.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.module == "file_integrity"
  | WHERE host.os.type == "windows"
  | WHERE event.type == "change"
  | WHERE STARTS_WITH(file.path, "C:\\$Recycle.Bin\\")
  | WHERE file.extension IN ("exe", "dll", "zip", "rar", "7z", "ps1", "bat", "vbs", "db", "bak")
  | EVAL host_name  = host.hostname
  | EVAL file_path  = file.path
  | EVAL file_name  = file.name
  | EVAL file_ext   = file.extension
  | EVAL file_owner = file.owner
  | EVAL file_uid   = file.uid
  | EVAL file_size  = file.size
  | EVAL file_mtime = file.mtime
  | EVAL action     = event.action
  | WHERE file_path IS NOT NULL
  | STATS
      event_count = COUNT(*),
      host_names  = VALUES(host.hostname),
      file_paths  = VALUES(file.path),
      file_names  = VALUES(file.name),
      file_exts   = VALUES(file.extension),
      file_owners = VALUES(file.owner),
      file_uids   = VALUES(file.uid),
      file_sizes  = VALUES(file.size),
      actions     = VALUES(event.action),
      last_seen   = MAX(@timestamp),
      first_seen  = MIN(@timestamp)
    BY agent_id, host.hostname, file.path
  | WHERE event_count >= 1
  | EVAL
      host_name = host.hostname,
      file_path = file.path
  | KEEP
      agent_id, host_name, file_path, event_count,
      host_names, file_paths, file_names, file_exts,
      file_owners, file_uids, file_sizes, actions,
      last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.collection
  - attack.t1074.001
  - attack.t1070
  - detection.threat-hunting
severity: medium
risk_score: 55
references:
  - "https://attack.mitre.org/techniques/T1074/001/"
  - "https://attack.mitre.org/techniques/T1070/"
nist: ["SI-7", "AU-12", "SI-4"]
pci_dss: ["10.5.1", "11.5"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0009:
    T1074: ["T1074.001"]
  TA0005:
    T1070: []