rule_id: ed36000e-d153-45bc-8b6b-593b1267b061
name: "Agent FIM: Linux Directory Ownership or Permission Changed"
description: |
  Ushbu qoida Impact va Defense Evasion texnikalariga bog'liq bo'lib, directory ownership yoki permission o'zgarishini aniqlaydi.
  Hujumchi privilege escalation yoki muhim papkalarga ruxsatsiz kirish maqsadida fayl tizimi huquqlarini o'zgartirayotgan bo'lishi mumkin.
  Qonuniy holatlar: rejalashtirilgan tizim yangilanishlari, administrativ konfiguratsiya o'zgarishlari, deployment jarayonlari.
  SOC triage bosqichlari:
  - `host.hostname`, `user.name` va o'zgartirilgan directory `auditd.paths.name` ni identifikatsiya qiling.
  - O'zgarishni amalga oshirgan foydalanuvchining roli va huquqlarini tekshiring.
  - Yangi permission qiymatlari (`auditd.paths.mode`) ning xavfliligini baholang.
  - Tasdiqlangan change ticket yoki deployment yozuvi borligini tekshiring.
  - Noqonuniy bo'lsa: permissionlarni qaytaring, sessiyani to'xtating, hostni tekshiring.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE auditd.message_type IN ("SYSCALL", "PATH")
  | WHERE auditd.data.syscall IN ("chmod", "fchmod", "fchmodat", "chown", "fchown", "fchownat", "lchown")
  | WHERE auditd.paths.item == "1"
  | EVAL host_name   = host.hostname
  | EVAL actor       = COALESCE(auditd.data.subj_user, auditd.data.uid)
  | EVAL file_path   = auditd.paths.name
  | EVAL file_mode   = auditd.paths.mode
  | EVAL file_inode  = auditd.paths.inode
  | EVAL tty         = auditd.data.tty
  | EVAL syscall     = auditd.data.syscall
  | WHERE file_path IS NOT NULL
  | STATS
      event_count  = COUNT(*),
      host_names   = VALUES(host.hostname),
      actors       = VALUES(auditd.data.subj_user),
      file_paths   = VALUES(auditd.paths.name),
      file_modes   = VALUES(auditd.paths.mode),
      syscalls     = VALUES(auditd.data.syscall),
      ttys         = VALUES(auditd.data.tty),
      last_seen    = MAX(@timestamp),
      first_seen   = MIN(@timestamp)
    BY agent_id, host.hostname, auditd.paths.name, auditd.data.subj_user
  | WHERE event_count >= 1
  | EVAL
      host_name         = host.hostname,
      file_name         = auditd.paths.name,
      user              = auditd.data.subj_user
  | KEEP
      agent_id, host_name, file_name, user, event_count,
      host_names, actors, file_paths, file_modes,
      syscalls, ttys, last_seen, first_seen
  | SORT event_count DESC
enabled: true
tags:
  - attack.impact
  - attack.defense-evasion
  - attack.t1565.001
  - attack.t1222.002
  - detection.threat-hunting
severity: medium
risk_score: 65
references:
  - "https://attack.mitre.org/techniques/T1565/001/"
  - "https://attack.mitre.org/techniques/T1222/002/"
nist: ["AC-3", "AC-6", "SI-7", "AU-9"]
pci_dss: ["10.5.1", "11.5", "7.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0040:
    T1565: ["T1565.001"]
  TA0005:
    T1222: ["T1222.002"]