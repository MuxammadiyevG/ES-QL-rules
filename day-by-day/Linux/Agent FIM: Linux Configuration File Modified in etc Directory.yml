rule_id: 05d0cef5-1be2-4137-a9e9-9cdbb8bba850
name: "Agent FIM: Linux Configuration File Modified in /etc Directory"
description: |
  Ushbu qoida Persistence va Privilege Escalation texnikalariga bog'liq bo'lib,
  /etc katalogidagi muhim konfiguratsiya fayllarining o'zgarishini aniqlaydi.
  Hujumchi /etc/passwd, /etc/shadow, /etc/sudoers, /etc/crontab kabi fayllarni
  o'zgartirib persistence yoki privilege escalation qilishi mumkin.
  Qonuniy holatlar: tizim administratori konfiguratsiya o'zgarishlari, paket o'rnatish.
  SOC triage bosqichlari:
  - `file.name` quyidagilardan birimi: passwd, shadow, sudoers, crontab, hosts, sshd_config.
  - `file.mode` o'zgarganmi — shadow 0640, sudoers 0440 bo'lishi kerak.
  - `file.owner` root bo'lmagan bo'lsa — kritik xavf.
  - `file.hash.sha1` baseline bilan solishtiring.
  - O'sha vaqtda tizimda kim ishlayotganini tekshiring (user_login, sudo loglar).
  - Noqonuniy bo'lsa: faylni backup dan qaytaring, o'zgarishni audit qiling.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.module == "file_integrity"
  | WHERE event.type == "change"
  | WHERE host.os.type == "linux"
  | WHERE file.path LIKE "/etc/*"
  | EVAL host_name   = host.hostname
  | EVAL file_path   = file.path
  | EVAL file_name   = file.name
  | EVAL file_owner  = file.owner
  | EVAL file_mode   = file.mode
  | EVAL file_hash   = file.hash.sha1
  | EVAL file_size   = file.size
  | EVAL file_mtime  = file.mtime
  | EVAL action      = event.action
  | EVAL is_critical = CASE(
      file.name IN (
        "passwd", "shadow", "shadow-", "passwd-",
        "sudoers", "crontab", "sshd_config", "ssh_config",
        "hosts", "hosts.allow", "hosts.deny",
        "ld.so.conf", "ld.so.preload",
        "profile", "bashrc", "bash_profile",
        "environment", "security", "pam.conf"
      ), "YES", "NO"
    )
  | STATS
      event_count   = COUNT(*),
      critical_count = COUNT(is_critical == "YES"),
      host_names    = VALUES(host.hostname),
      file_paths    = VALUES(file.path),
      file_names    = VALUES(file.name),
      file_owners   = VALUES(file.owner),
      file_modes    = VALUES(file.mode),
      file_hashes   = VALUES(file.hash.sha1),
      actions       = VALUES(event.action),
      last_seen     = MAX(@timestamp),
      first_seen    = MIN(@timestamp)
    BY agent_id, host.hostname, file.path
  | WHERE event_count >= 1
  | EVAL
      host_name = host.hostname,
      file_path = file.path
  | KEEP
      agent_id, host_name, file_path, event_count, critical_count,
      host_names, file_paths, file_names, file_owners,
      file_modes, file_hashes, actions,
      last_seen, first_seen
  | SORT critical_count DESC, last_seen DESC
enabled: true
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.defense-evasion
  - attack.t1098
  - attack.t1053.003
  - attack.t1556
  - detection.threat-hunting
severity: high
risk_score: 78
references:
  - "https://attack.mitre.org/techniques/T1098/"
  - "https://attack.mitre.org/techniques/T1053/003/"
  - "https://attack.mitre.org/techniques/T1556/"
nist: ["CM-3", "SI-7", "AC-6", "AU-9"]
pci_dss: ["10.5.1", "11.5", "7.1", "8.5"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0003:
    T1098: []
    T1053: ["T1053.003"]
  TA0004:
    T1556: []