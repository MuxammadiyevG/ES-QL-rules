rule_id: 6dc68def-6d9c-4571-b931-640959045955
name: "Agent FIM: Linux File Ownership or Permission Changed"
description: |
  Ushbu qoida Impact va Defense Evasion texnikalariga bog'liq bo'lib, `Agent FIM: Linux File Ownership or Permission Changed` kontekstida FortiSIEM Linux Agent FIM tomonidan fayl ownership yoki permission o'zgarishini aniqlaydi.
  Bu turdagi hodisa directory o'zgarishidan farqli o'laroq, to'g'ridan-to'g'ri fayl darajasidagi huquq o'zgarishini kuzatadi. Hujumchi SUID/SGID bitlarini o'rnatish, world-writable fayl yaratish yoki muhim fayllar ustidan nazoratni egallash orqali privilege escalation yoki persistence maqsadida faoliyat yuritayotgan bo'lishi mumkin.
  Qonuniy holatlar sifatida rejalashtirilgan tizim yangilanishlari, administrativ konfiguratsiya o'zgarishlari yoki deployment jarayonlari uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `host.hostname`, `user.name` va o'zgartirilgan fayl `auditd.paths.name` ni aniq identifikatsiya qiling.
  - Yangi permission qiymati (`auditd.paths.mode`) da SUID (4xxx), SGID (2xxx) yoki world-writable (xx7) bitlari borligini tekshiring.
  - O'zgartirilgan faylning tizim uchun kritikligini baholang (`/bin`, `/etc`, `/usr/bin`).
  - O'zgarishni amalga oshirgan foydalanuvchining roli va huquqlarini tekshiring.
  - Tasdiqlangan change ticket yoki deployment yozuvi borligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa tezkor containment bajaring: permissionlarni qaytaring, foydalanuvchi sessiyasini to'xtating va hostni tekshiring.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE auditd.message_type IN ("SYSCALL", "PATH")
  | WHERE auditd.data.syscall IN ("chmod", "fchmod", "fchmodat", "chown", "fchown", "fchownat", "lchown")
  | WHERE auditd.paths.item == "1"
  | EVAL host_name   = host.hostname
  | EVAL actor       = COALESCE(auditd.data.subj_user, auditd.data.uid)
  | EVAL file_path   = auditd.paths.name
  | EVAL file_inode  = auditd.paths.inode
  | EVAL file_mode   = auditd.paths.mode
  | EVAL file_owner  = auditd.paths.cap_fver
  | EVAL user_group  = auditd.data.uid
  | EVAL syscall     = auditd.data.syscall
  | EVAL tty         = auditd.data.tty
  | EVAL is_suid_sgid = CASE(
      auditd.paths.mode RLIKE "^4.*", "YES - SUID bit set",
      auditd.paths.mode RLIKE "^2.*", "YES - SGID bit set",
      auditd.paths.mode RLIKE "^6.*", "YES - SUID+SGID bit set",
      auditd.paths.mode RLIKE ".*7$", "YES - world-writable",
      "NO"
    )
  | EVAL is_critical = CASE(
      auditd.paths.name RLIKE "^/etc/.*",       "YES - /etc",
      auditd.paths.name RLIKE "^/bin/.*",       "YES - /bin",
      auditd.paths.name RLIKE "^/sbin/.*",      "YES - /sbin",
      auditd.paths.name RLIKE "^/usr/bin/.*",   "YES - /usr/bin",
      auditd.paths.name RLIKE "^/usr/sbin/.*",  "YES - /usr/sbin",
      auditd.paths.name RLIKE "^/root/.*",      "YES - /root",
      auditd.paths.name RLIKE "^/boot/.*",      "YES - /boot",
      "NO"
    )
  | WHERE file_path IS NOT NULL
  | STATS
      event_count    = COUNT(*),
      host_names     = VALUES(host.hostname),
      actors         = VALUES(auditd.data.subj_user),
      file_paths     = VALUES(auditd.paths.name),
      file_modes     = VALUES(auditd.paths.mode),
      file_inodes    = VALUES(auditd.paths.inode),
      file_owners    = VALUES(auditd.paths.cap_fver),
      user_groups    = VALUES(auditd.data.uid),
      syscalls       = VALUES(auditd.data.syscall),
      ttys           = VALUES(auditd.data.tty),
      suid_sgid      = VALUES(is_suid_sgid),
      critical_files = VALUES(is_critical),
      last_seen      = MAX(@timestamp),
      first_seen     = MIN(@timestamp)
    BY agent_id,  host.hostname, auditd.paths.name, auditd.data.subj_user
  | WHERE event_count >= 1
  | EVAL
      host_name         = host.hostname,
      file_name         = auditd.paths.name,
      user              = auditd.data.subj_user
  | KEEP
      agent_id,
      host_name,
      file_name,
      user,
      event_count,
      host_names,
      actors,
      file_paths,
      file_modes,
      file_inodes,
      file_owners,
      user_groups,
      syscalls,
      ttys,
      suid_sgid,
      critical_files,
      last_seen,
      first_seen
  | SORT event_count DESC
enabled: true
tags:
  - attack.impact
  - attack.defense-evasion
  - attack.t1565.001
  - attack.t1222.002
  - detection.threat-hunting
severity: high
risk_score: 75
references:
  - "https://attack.mitre.org/techniques/T1565/001/"
  - "https://attack.mitre.org/techniques/T1222/002/"
nist: ["AC-3", "AC-6", "SI-7", "AU-9"]
pci_dss: ["10.5.1", "11.5", "7.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0040:
    T1565: ["T1565.001"]
  TA0005:
    T1222: ["T1222.002"]