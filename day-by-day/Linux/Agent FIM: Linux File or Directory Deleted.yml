rule_id: 7b3e9f1d-5c2a-4d8e-b146-3f7e2c9d4b28
name: "Agent FIM: Linux File or Directory Deleted"
description: |
  Ushbu qoida Defense Evasion va Impact texnikalariga bog'liq bo'lib, `Agent FIM: Linux File or Directory Deleted` kontekstida FortiSIEM Linux Agent FIM tomonidan fayl yoki directory o'chirilganligini aniqlaydi.
  Bu turdagi hodisa hujumchi iz qoldirmaslik, forensic tahlilni qiyinlashtirish yoki muhim tizim fayllarini yo'q qilish maqsadida fayl o'chirayotganligini ko'rsatishi mumkinligi sababli xavfli hisoblanadi.
  Qonuniy holatlar sifatida rejalashtirilgan tozalash ishlari, administrator tomonidan bajarilgan maintenance, log rotation yoki dastur o'chirish jarayonlari uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `host.hostname`, `user.name` va o'chirilgan `auditd.paths.name` ni aniq identifikatsiya qiling.
  - O'chirilgan fayl kritik tizim fayli bo'lsa (`/etc/passwd`, `/var/log/*`, `/bin/*`) ustuvor ko'rib chiqing.
  - O'chirishni amalga oshirgan foydalanuvchining roli va huquqlarini tekshiring.
  - O'zgarish uchun tasdiqlangan change ticket yoki deployment yozuvi borligini tekshiring.
  - Hostda boshqa shubhali faoliyat (lateral movement, privilege escalation) borligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa tezkor containment bajaring: faylni backup dan tiklang, foydalanuvchi sessiyasini to'xtating va hostni izolyatsiya qiling.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE auditd.message_type IN ("SYSCALL", "PATH")
  | WHERE auditd.data.syscall IN ("unlink", "unlinkat", "rmdir", "rename", "renameat", "renameat2")
  | EVAL host_name     = host.hostname
  | EVAL actor         = COALESCE(auditd.data.subj_user, auditd.data.uid)
  | EVAL file_path     = auditd.paths.name
  | EVAL file_inode    = auditd.paths.inode
  | EVAL file_mode     = auditd.paths.mode
  | EVAL syscall       = auditd.data.syscall
  | EVAL tty           = auditd.data.tty
  | EVAL is_critical   = CASE(
        auditd.paths.name RLIKE "^/etc/.*",         "YES - /etc",
        auditd.paths.name RLIKE "^/var/log/.*",     "YES - /var/log",
        auditd.paths.name RLIKE "^/bin/.*",         "YES - /bin",
        auditd.paths.name RLIKE "^/sbin/.*",        "YES - /sbin",
        auditd.paths.name RLIKE "^/usr/bin/.*",     "YES - /usr/bin",
        auditd.paths.name RLIKE "^/boot/.*",        "YES - /boot",
        auditd.paths.name RLIKE "^/root/.*",        "YES - /root",
        "NO"
      )
  | WHERE file_path IS NOT NULL
  | STATS
        event_count    = COUNT(*),
        host_names     = VALUES(host.hostname),
        actors         = VALUES(auditd.data.subj_user),
        file_paths     = VALUES(auditd.paths.name),
        file_modes     = VALUES(auditd.paths.mode),
        file_inodes    = VALUES(auditd.paths.inode),
        syscalls       = VALUES(auditd.data.syscall),
        ttys           = VALUES(auditd.data.tty),
        critical_files = VALUES(is_critical),
        last_seen      = MAX(@timestamp),
        first_seen     = MIN(@timestamp)
      BY agent_id, host.hostname, auditd.paths.name, auditd.data.subj_user
  | WHERE event_count >= 1
  | EVAL
        host_name         = host.hostname,
        file_name         = auditd.paths.name,
        user              = auditd.data.subj_user
  | KEEP
        agent_id,
        host_name,
        file_name,
        user,
        event_count,
        host_names,
        actors,
        file_paths,
        file_modes,
        file_inodes,
        syscalls,
        ttys,
        critical_files,
        last_seen,
        first_seen
  | SORT event_count DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.impact
  - attack.t1070.004
  - attack.t1565.001
  - detection.threat-hunting
severity: medium
risk_score: 65
references:
  - "https://attack.mitre.org/techniques/T1070/004/"
  - "https://attack.mitre.org/techniques/T1565/001/"
nist: ["SI-7", "AU-9", "CM-3", "IR-4"]
pci_dss: ["10.5.1", "11.5", "6.3.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1070: ["T1070.004"]
  TA0040:
    T1565: ["T1565.001"]