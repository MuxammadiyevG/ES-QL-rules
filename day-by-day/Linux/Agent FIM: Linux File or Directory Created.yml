rule_id: ed045773-79b7-4c53-bed9-c9e0512424a4
name: "Agent FIM: Linux File or Directory Created"
description: |
  Ushbu qoida Impact va Collection texnikalariga bog'liq bo'lib, yangi fayl yoki directory yaratilganligini aniqlaydi.
  Hujumchi tizimda yangi zararli fayl, backdoor yoki ma'lumot to'plash uchun saqlash joyi yaratayotgan bo'lishi mumkin.
  Qonuniy holatlar: dastur o'rnatish, administrator konfiguratsiya o'zgarishlari, deployment jarayonlari.
  SOC triage bosqichlari:
  - Yaratilgan fayl yoki directory ning joylashuvi xavfli bo'lsa (`/tmp`, `/dev/shm`, `/etc`) ustuvor ko'rib chiqing.
  - Fayl hash qiymatini malware database bilan solishtiring.
  - Faylni yaratgan foydalanuvchining roli va huquqlarini tekshiring.
  - Tasdiqlangan change ticket borligini tekshiring.
  - Noqonuniy bo'lsa: faylni o'chiring, sessiyani to'xtating, hostni izolyatsiya qiling.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE auditd.message_type IN ("SYSCALL", "PATH")
  | WHERE auditd.data.syscall IN ("creat", "open", "openat", "mkdir", "mkdirat", "mknod", "mknodat")
  | EVAL host_name     = host.hostname
  | EVAL actor         = COALESCE(auditd.data.subj_user, auditd.data.uid)
  | EVAL file_path     = auditd.paths.name
  | EVAL file_inode    = auditd.paths.inode
  | EVAL file_mode     = auditd.paths.mode
  | EVAL hash_code     = auditd.paths.cap_fp
  | EVAL hash_algo     = "SHA256"
  | EVAL syscall       = auditd.data.syscall
  | EVAL tty           = auditd.data.tty
  | EVAL is_suspicious = CASE(
      auditd.paths.name RLIKE "^/tmp/.*",           "YES - /tmp",
      auditd.paths.name RLIKE "^/dev/shm/.*",       "YES - /dev/shm",
      auditd.paths.name RLIKE "^/var/tmp/.*",       "YES - /var/tmp",
      auditd.paths.name RLIKE "^/etc/.*",           "YES - /etc",
      auditd.paths.name RLIKE "^/root/.*",          "YES - /root",
      auditd.paths.name RLIKE "^/usr/bin/.*",       "YES - /usr/bin",
      auditd.paths.name RLIKE "^/usr/local/bin/.*", "YES - /usr/local/bin",
      "NO"
    )
  | WHERE file_path IS NOT NULL
  | STATS
      event_count      = COUNT(*),
      host_names       = VALUES(host.hostname),
      actors           = VALUES(auditd.data.subj_user),
      file_paths       = VALUES(auditd.paths.name),
      file_modes       = VALUES(auditd.paths.mode),
      file_inodes      = VALUES(auditd.paths.inode),
      hash_codes       = VALUES(auditd.paths.cap_fp),
      syscalls         = VALUES(auditd.data.syscall),
      ttys             = VALUES(auditd.data.tty),
      suspicious_paths = VALUES(is_suspicious),
      last_seen        = MAX(@timestamp),
      first_seen       = MIN(@timestamp)
    BY agent_id, host.hostname, auditd.paths.name, auditd.data.subj_user
  | WHERE event_count >= 1
  | EVAL
      host_name         = host.hostname,
      file_name         = auditd.paths.name,
      user              = auditd.data.subj_user
  | KEEP
      agent_id, host_name, file_name, user, event_count,
      host_names, actors, file_paths, file_modes,
      file_inodes, hash_codes, syscalls, ttys,
      suspicious_paths, last_seen, first_seen
  | SORT event_count DESC
enabled: true
tags:
  - attack.impact
  - attack.collection
  - attack.t1565.001
  - attack.t1074.001
  - detection.threat-hunting
severity: medium
risk_score: 65
references:
  - "https://attack.mitre.org/techniques/T1565/001/"
  - "https://attack.mitre.org/techniques/T1074/001/"
nist: ["SI-7", "AU-9", "CM-3", "IR-4"]
pci_dss: ["10.5.1", "11.5", "6.3.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0040:
    T1565: ["T1565.001"]
  TA0009:
    T1074: ["T1074.001"]