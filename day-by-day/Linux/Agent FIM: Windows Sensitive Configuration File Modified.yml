rule_id: 2c45b6f5-bc26-4529-8434-bad9676d8b1f
name: "Agent FIM: Windows Sensitive Configuration File Modified"
description: |
  Ushbu qoida Defense Evasion va Persistence texnikalariga bog'liq bo'lib, Windows
  muhim konfiguratsiya fayllarining o'zgarishini aniqlaydi. Hujumchi hosts fayli,
  registry export, yoki boshqa konfiguratsiya fayllarini o'zgartirib tarmoq
  yo'naltirishini manipulyatsiya qilishi yoki persistence ta'minlashi mumkin.
  Qonuniy holatlar: tizim administratori konfiguratsiya o'zgarishlari, dastur o'rnatish.
  SOC triage bosqichlari:
  - `file.path` ni tekshiring — hosts, lmhosts, services faylmi.
  - `file.owner` SYSTEM yoki Administrator emas bo'lsa shubhali.
  - `file.mtime` — oxirgi o'zgarish vaqtini ish soatlari bilan solishtiring.
  - Faylning yangi mazmunini tekshiring — noto'g'ri DNS yozuvi bormi.
  - Noqonuniy bo'lsa: faylni asl holatiga qaytaring, kimdir o'zgartirilganini aniqlang.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.module == "file_integrity"
  | WHERE host.os.type == "windows"
  | WHERE event.type == "change"
  | WHERE STARTS_WITH(file.path, "C:\\Windows\\System32\\drivers\\etc\\")
      OR STARTS_WITH(file.path, "C:\\Windows\\System32\\GroupPolicy\\")
      OR STARTS_WITH(file.path, "C:\\Windows\\System32\\Tasks\\")
      OR STARTS_WITH(file.path, "C:\\Windows\\SysWOW64\\drivers\\etc\\")
  | EVAL host_name  = host.hostname
  | EVAL file_path  = file.path
  | EVAL file_name  = file.name
  | EVAL file_owner = file.owner
  | EVAL file_size  = file.size
  | EVAL file_mtime = file.mtime
  | EVAL action     = event.action
  | WHERE file_path IS NOT NULL
  | STATS
      event_count = COUNT(*),
      host_names  = VALUES(host.hostname),
      file_paths  = VALUES(file.path),
      file_names  = VALUES(file.name),
      file_owners = VALUES(file.owner),
      file_sizes  = VALUES(file.size),
      actions     = VALUES(event.action),
      last_seen   = MAX(@timestamp),
      first_seen  = MIN(@timestamp)
    BY agent_id, host.hostname, file.path
  | WHERE event_count >= 1
  | EVAL
      host_name = host.hostname,
      file_path = file.path
  | KEEP
      agent_id, host_name, file_path, event_count,
      host_names, file_paths, file_names,
      file_owners, file_sizes, actions, last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.persistence
  - attack.t1565.001
  - attack.t1112
  - attack.t1053.005
  - detection.threat-hunting
severity: high
risk_score: 73
references:
  - "https://attack.mitre.org/techniques/T1565/001/"
  - "https://attack.mitre.org/techniques/T1112/"
  - "https://attack.mitre.org/techniques/T1053/005/"
nist: ["SI-7", "CM-3", "AU-12"]
pci_dss: ["10.5.1", "11.5", "6.3"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1565: ["T1565.001"]
    T1112: []
  TA0003:
    T1053: ["T1053.005"]