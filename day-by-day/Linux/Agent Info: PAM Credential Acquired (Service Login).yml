rule_id: d212cf8b-b353-4825-be52-905c1b07f8a1
name: "Agent Info: PAM Credential Acquired (Service Login)"
description: |
  Tizim servislari (cron, su, sudo, sshd) tomonidan PAM credential olinganini qayd etadi.
  Service account va daemon faoliyatini kuzatish uchun ishlatiladi.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE auditd.message_type IN ("cred_acq", "cred_disp", "cred_refr")
  | WHERE auditd.result == "success"
  | STATS
      event_count  = COUNT(*),
      host_names   = VALUES(host.hostname),
      users        = VALUES(auditd.data.acct),
      executables  = VALUES(auditd.summary.how),
      terminals    = VALUES(auditd.data.terminal),
      msg_types    = VALUES(auditd.message_type),
      grantors     = VALUES(auditd.data.grantors),
      last_seen    = MAX(@timestamp),
      first_seen   = MIN(@timestamp)
    BY agent_id, host.hostname, auditd.data.acct, auditd.summary.how
  | WHERE event_count >= 1
  | KEEP
      agent_id, host.hostname, auditd.data.acct, auditd.summary.how,
      event_count, host_names, users, executables,
      terminals, msg_types, grantors, last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - detection.informational
  - visibility.authentication
severity: low
risk_score: 8
references: []
nist: ["AU-12"]
pci_dss: ["10.2.1"]
gdpr: ["32.1.b"]
mitre_attack: []