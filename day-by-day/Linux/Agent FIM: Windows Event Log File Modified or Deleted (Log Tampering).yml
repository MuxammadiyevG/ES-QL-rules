rule_id: d098e695-2b6c-40cc-aa09-87fc97348a5c
name: "Agent FIM: Windows Event Log File Modified or Deleted (Log Tampering)"
description: |
  Ushbu qoida Defense Evasion texnikasiga bog'liq bo'lib, Windows Event Log fayllarining
  o'zgartirilishi yoki o'chirilishini aniqlaydi. Hujumchi o'z izlarini yashirish maqsadida
  .evtx log fayllarini o'chirishi yoki o'zgartirishi mumkin.
  Qonuniy holatlar: log rotation, Windows log management tizimi.
  SOC triage bosqichlari:
  - `file.name` — Security.evtx, System.evtx, Application.evtx kritik fayllar.
  - `event.action` — deleted bo'lsa darhol javob bering.
  - `file.size` kutilganidan kichik bo'lsa — log cleared bo'lishi mumkin.
  - Windows Event ID 1102 (Security log cleared) va 104 (System log cleared) bilan korrelatsiya.
  - Noqonuniy bo'lsa: backup dan tiklang, incident oching, forensic dump oling.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.module == "file_integrity"
  | WHERE host.os.type == "windows"
  | WHERE file.extension == "evtx"
  | WHERE STARTS_WITH(file.path, "C:\\Windows\\System32\\winevt\\Logs\\")
  | EVAL host_name  = host.hostname
  | EVAL file_path  = file.path
  | EVAL file_name  = file.name
  | EVAL file_owner = file.owner
  | EVAL file_size  = file.size
  | EVAL file_mtime = file.mtime
  | EVAL action     = event.action
  | WHERE file_path IS NOT NULL
  | STATS
      event_count = COUNT(*),
      host_names  = VALUES(host.hostname),
      file_paths  = VALUES(file.path),
      file_names  = VALUES(file.name),
      file_owners = VALUES(file.owner),
      file_sizes  = VALUES(file.size),
      actions     = VALUES(event.action),
      last_seen   = MAX(@timestamp),
      first_seen  = MIN(@timestamp)
    BY agent_id, host.hostname, file.path
  | WHERE event_count >= 1
  | EVAL
      host_name = host.hostname,
      file_path = file.path
  | KEEP
      agent_id, host_name, file_path, event_count,
      host_names, file_paths, file_names,
      file_owners, file_sizes, actions, last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1070.001
  - detection.threat-hunting
severity: critical
risk_score: 90
references:
  - "https://attack.mitre.org/techniques/T1070/001/"
nist: ["AU-9", "SI-7", "IR-4", "AU-12"]
pci_dss: ["10.5.1", "10.5.2", "10.6.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1070: ["T1070.001"]