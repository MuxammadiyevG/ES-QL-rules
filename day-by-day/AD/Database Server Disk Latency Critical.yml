rule_id: 1cb6d002-3774-488f-87e5-a3eff83800f0
name: "Database Server Disk Latency Critical"
description: |
  Ushbu qoida database server disk I/O kechikishi kritik darajaga (50 ms dan yuqori) yetganligini aniqlaydi.
  10 daqiqalik oraliqda ketma-ket 2 ta o'lchov asosida disk read yoki write latency 50 ms dan oshsa alert ishga tushadi.
  Bu turdagi hodisa database server ning disk I/O muammolari, storage tizimidagi bottleneck yoki disk xatoliklari natijasida yuzaga kelishi mumkin bo'lib, database ishlashiga jiddiy ta'sir ko'rsatishi mumkin.
  Qonuniy holatlar sifatida rejalashtirilgan backup operatsiyalari, disk defragmentatsiya yoki yuqori yuklanish davrlari uchrashi mumkin.
  SOC triage bosqichlari:
  - Ta'sirlangan `host.name` va disk nomini (`winlog.event_data.param1`) aniq identifikatsiya qiling.
  - Disk read va write latency qiymatlarini (`read_latency_ms`, `write_latency_ms`) tekshiring.
  - Disk queue length va I/O utilization qiymatlarini tekshiring.
  - `/boot` disk partitsiyasi istisno qilingan.
  - Storage tizimi, RAID konfiguratsiyasi va disk holatini tekshiring.
  - Clear condition: 20 daqiqa ichida rule qayta ishga tushmasa alert avtomatik tozalanadi.
  - Kerak bo'lsa resurslarni ko'paytiring yoki storage tizimini optimallashtiring.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 600 seconds
  | WHERE winlog.channel == "System"
  | WHERE winlog.event_id IN ("2004", "2019", "2020")
     OR winlog.provider_name RLIKE "(?i).*(disk|storage|perfmon|performance|ntfs|storport|iaStorA).*"
     OR message RLIKE "(?i).*(disk.*latency|io.*latency|disk.*performance|read.*latency|write.*latency).*"
  | EVAL host_name        = winlog.computer_name
  | EVAL disk_name        = COALESCE(winlog.event_data.param1, winlog.event_data.ObjectName)
  | EVAL read_latency_ms  = TO_DOUBLE(COALESCE(winlog.event_data.param2, winlog.event_data.DwordVal))
  | EVAL write_latency_ms = TO_DOUBLE(COALESCE(winlog.event_data.param3, winlog.event_data.param4))
  | EVAL disk_queue       = winlog.event_data.param5
  | EVAL io_util          = winlog.event_data.param6
  | EVAL read_rate_rps    = winlog.event_data.param7
  | EVAL write_rate_rps   = winlog.event_data.param8

  // /boot partitsiyasi istisno
  | WHERE NOT disk_name RLIKE "(?i).*/boot.*"
  | WHERE disk_name IS NOT NULL

  | STATS
      event_count         = COUNT(*),
      avg_read_latency    = AVG(read_latency_ms),
      avg_write_latency   = AVG(write_latency_ms),
      max_read_latency    = MAX(read_latency_ms),
      max_write_latency   = MAX(write_latency_ms),
      host_names          = VALUES(winlog.computer_name),
      disk_names          = VALUES(winlog.event_data.param1),
      disk_queues         = VALUES(winlog.event_data.param5),
      io_utils            = VALUES(winlog.event_data.param6),
      read_rates          = VALUES(winlog.event_data.param7),
      write_rates         = VALUES(winlog.event_data.param8),
      last_seen           = MAX(@timestamp),
      first_seen          = MIN(@timestamp)
    BY agent_id, winlog.computer_name, winlog.event_data.param1

  // 50ms threshold va kamida 2 ta event
  | WHERE event_count >= 2
  | WHERE avg_read_latency >= 50
     OR avg_write_latency >= 50

  | EVAL
      host_name             = winlog.computer_name,
      disk_name             = winlog.event_data.param1
  | KEEP
      agent_id,
      host_name,
      disk_name,
      avg_read_latency,
      avg_write_latency,
      max_read_latency,
      max_write_latency,
      event_count,
      host_names,
      disk_names,
      disk_queues,
      io_utils,
      read_rates,
      write_rates,
      last_seen,
      first_seen
  | SORT avg_read_latency DESC
enabled: true
tags:
  - availability.monitoring
  - performance.monitoring
  - detection.system-health
severity: medium
risk_score: 70
references:
  - "https://docs.microsoft.com/en-us/windows-server/administration/performance-tuning/subsystem/storage-spaces"
nist: ["CP-10", "SI-4", "AU-6"]
pci_dss: ["10.6.1", "12.10.1"]
gdpr: ["32.1.b"]
mitre_attack: []