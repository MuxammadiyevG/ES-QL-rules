rule_id: 3d8c1f5e-7a2b-4e9d-c651-5f3a2d8e4c17
name: "Agent FIM: Directory Ownership or Permission Changed"
description: |
  Ushbu qoida Impact va Defense Evasion texnikalariga bog'liq bo'lib, `Agent FIM: Directory Ownership or Permission Changed` kontekstida FortiSIEM 
   Agent FIM tomonidan directory ownership yoki permission o'zgarishini aniqlaydi.
  Bu turdagi hodisa hujumchi privilege escalation, persistence yoki muhim tizim papkalariga ruxsatsiz kirish maqsadida fayl tizimi huquqlarini o'zgartirayotganligini ko'rsatishi mumkinligi sababli xavfli hisoblanadi.
  Qonuniy holatlar sifatida rejalashtirilgan tizim yangilanishlari, administrativ konfiguratsiya o'zgarishlari, deployment jarayonlari yoki dastur o'rnatish uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `host.name`, `user.name` va o'zgartirilgan `file.path` (directory) ni aniq identifikatsiya qiling.
  - O'zgarishni amalga oshirgan foydalanuvhining roli va huquqlarini tekshiring.
  - O'zgarish uchun tasdiqlangan change ticket yoki deployment yozuvi borligini tekshiring.
  - Yangi permission va ownership qiymatlari (`file.owner`, `user.group`) ning xavfliligini baholang (masalan, world-writable).
  - Hostda boshqa shubhali faoliyat (privilege escalation, lateral movement) borligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa tezkor containment bajaring: permissionlarni qaytaring, foydalanuvchi sessiyasini to'xtating va hostni tekshiring.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE winlog.event_id == "FSM_LINUX_FILE_ATTRIB_CHANGE"
     OR (winlog.event_id IN ("4670", "4663") AND winlog.channel == "Security")
  | EVAL host_name        = winlog.computer_name
  | EVAL actor            = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.TargetUserName)
  | EVAL target_object    = COALESCE(winlog.event_data.ObjectName, winlog.event_data.param1)
  | EVAL file_owner       = COALESCE(winlog.event_data.param2, winlog.event_data.SubjectUserName)
  | EVAL user_group       = COALESCE(winlog.event_data.param3, winlog.event_data.SubjectDomainName)
  | EVAL user_perm        = winlog.event_data.param4
  | EVAL group_perm       = winlog.event_data.param5
  | EVAL other_perm       = winlog.event_data.param6
  | EVAL old_sd           = winlog.event_data.OldSd
  | EVAL new_sd           = winlog.event_data.NewSd
  | WHERE target_object IS NOT NULL
  | STATS
      event_count    = COUNT(*),
      host_names     = VALUES(winlog.computer_name),
      actors         = VALUES(winlog.event_data.SubjectUserName),
      target_objects = VALUES(winlog.event_data.ObjectName),
      file_owners    = VALUES(winlog.event_data.param2),
      user_groups    = VALUES(winlog.event_data.param3),
      user_perms     = VALUES(winlog.event_data.param4),
      group_perms    = VALUES(winlog.event_data.param5),
      other_perms    = VALUES(winlog.event_data.param6),
      old_sds        = VALUES(winlog.event_data.OldSd),
      new_sds        = VALUES(winlog.event_data.NewSd),
      last_seen      = MAX(@timestamp),
      first_seen     = MIN(@timestamp)
    BY agent_id, winlog.computer_name, winlog.event_data.ObjectName, winlog.event_data.SubjectUserName
  | WHERE event_count >= 1
  | EVAL
      host_name         = winlog.computer_name,
      target_object     = winlog.event_data.ObjectName,
      user              = winlog.event_data.SubjectUserName,
  | KEEP
      agent_id,
      host_name,
      target_object,
      user,
      event_count,
      host_names,
      actors,
      target_objects,
      file_owners,
      user_groups,
      user_perms,
      group_perms,
      other_perms,
      old_sds,
      new_sds,
      last_seen,
      first_seen
  | SORT event_count DESC
enabled: true
tags:
  - attack.impact
  - attack.defense-evasion
  - attack.t1565.001
  - attack.t1222.002
  - detection.threat-hunting
severity: medium
risk_score: 65
references:
  - "https://attack.mitre.org/techniques/T1565/001/"
  - "https://attack.mitre.org/techniques/T1222/002/"
  - "https://docs.fortinet.com/product/fortisiem"
nist: ["AC-3", "AC-6", "SI-7", "AU-9"]
pci_dss: ["10.5.1", "11.5", "7.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0040:
    T1565: ["T1565.001"]
  TA0005:
    T1222: ["T1222.002"]