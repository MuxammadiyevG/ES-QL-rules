rule_id: 7e4a1d2f-3c8b-4f9e-a521-6b0d3e7c9f45
name: Account Locked - Domain
description: |
  Ushbu qoida Credential Access texnikalariga bog'liq bo'lib, `Account Locked: Domain` kontekstidagi haddan tashqari noto'g'ri kirish urinishlari natijasida domain akkauntning bloklanishini aniqlaydi.
  Bu turdagi hodisa AD muhitida hujumchi brute force yoki password spraying orqali foydalanuvchi akkauntini egallashga urinayotganligini ko'rsatishi mumkinligi sababli xavfli hisoblanadi.
  Qonuniy holatlar sifatida foydalanuvchi parolini unutganligi, boshqa tizimda keshlangan eski credential, servis akkauntidagi noto'g'ri parol konfiguratsiyasi yoki avtomatik skriptlardagi muammolar uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `actor` (bloklangan foydalanuvchi) va `src_ip` (manba IP) ni aniq identifikatsiya qiling.
  - Bloklash manbasi — qaysi host yoki IP dan kelganini tekshiring.
  - Foydalanuvchining boshqa tizimlarda keshlangan credential borligini tekshiring.
  - Manba hostda boshqa shubhali hodisalar (malware, lateral movement) borligini tekshiring.
  - Manba va manzil hostlarda zaifliklar borligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa tezkor containment bajaring: manba IP ni bloklang, credentiallarni yangilang va ta'sir doirasini izolyatsiya qiling.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 600 seconds
  | WHERE winlog.channel == "Security"
  | WHERE winlog.event_id == "4740"
  | EVAL hostn       = winlog.computer_name
  | EVAL actor       = COALESCE(winlog.event_data.TargetUserName, winlog.event_data.SamAccountName)
  | EVAL src_ip      = COALESCE(winlog.event_data.IpAddress, winlog.event_data.ClientAddress)
  | EVAL src_host    = COALESCE(winlog.event_data.WorkstationName, winlog.event_data.Workstation)
  | EVAL logon_type  = winlog.event_data.LogonType
  | WHERE hostn RLIKE "(?i)(WINDC|ADDC|-DC|DOMAINCONTROLLER)"
  | WHERE NOT actor RLIKE ".*\\$$"
  | STATS
      event_count   = COUNT(*),
      users         = VALUES(winlog.event_data.TargetUserName),
      src_ips       = VALUES(winlog.event_data.IpAddress),
      src_hosts     = VALUES(winlog.event_data.WorkstationName),
      dest_hosts    = VALUES(winlog.computer_name),
      logon_types   = VALUES(winlog.event_data.LogonType),
      last_seen     = MAX(@timestamp),
      first_seen    = MIN(@timestamp)
    BY agent_id, winlog.computer_name, winlog.event_data.IpAddress, winlog.event_data.TargetUserName
  | WHERE event_count >= 1
  | EVAL
      destination_host  = winlog.computer_name,
      destination_ip    = winlog.event_data.IpAddress,
      user              = winlog.event_data.TargetUserName,
  | KEEP
      agent_id,
      destination_host,
      destination_ip,
      user,
      event_count,
      src_ips,
      src_hosts,
      logon_types,
      last_seen,
      first_seen
  | SORT event_count DESC
enabled: false
tags:
  - attack.credential-access
  - attack.t1110.001
  - detection.threat-hunting
severity: medium
risk_score: 60
references:
  - "https://attack.mitre.org/techniques/T1110/001/"
  - "https://docs.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4740"
nist: ["AC-7", "IA-5", "SI-4"]
pci_dss: ["8.1.6", "8.1.7", "10.6.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0006:
    T1110: ["T1110.001"]