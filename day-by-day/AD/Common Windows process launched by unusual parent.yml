rule_id: 9cc75f83-b636-4f6b-9a4c-fbef9ffb4466
name: "Common Windows process launched by unusual parent"
description: |
  Ushbu qoida Persistence va Privilege Escalation texnikalariga bog'liq bo'lib, `Common Windows process launched by unusual parent` kontekstida taniqli Windows jarayonlarining noodatiy ota-jarayon tomonidan ishga tushirilganligini aniqlaydi.
  Kuzatiladigan jarayonlar: services.exe, svchost.exe, lsass.exe, cmd.exe, powershell.exe, notepad++.exe, notepad.exe, firefox.exe, chrome.exe, conhost.exe.
  Bu turdagi hodisa hujumchi process injection, living-off-the-land yoki persistence mexanizmlari orqali zararli kodni legitimli jarayon sifatida yashirayotganligini ko'rsatishi mumkinligi sababli xavfli hisoblanadi.
  Qonuniy holatlar sifatida ba'zi tizim yangilanishlari, administrativ skriptlar yoki maxsus korporativ dasturlar uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `winlog.computer_name`, `winlog.event_data.NewProcessName` va `winlog.event_data.ParentProcessName` ni aniq identifikatsiya qiling.
  - Ota-jarayonning to'liq yo'li va digital signature ni tekshiring.
  - Jarayon command line argumentlarini tekshiring.
  - `osqueryd.exe` va `RuntimeBroker.exe` ota-jarayonlari istisno qilingan.
  - Hostda boshqa shubhali hodisalar borligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa tezkor containment bajaring: jarayonni to'xtating, hostni izolyatsiya qiling va to'liq forensic tahlil bajaring.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE winlog.channel == "Security"
  | WHERE winlog.event_id == "4688"
  | EVAL proc_name   = winlog.event_data.NewProcessName
  | EVAL parent_proc = winlog.event_data.ParentProcessName
  | EVAL host_name   = winlog.computer_name
  | EVAL actor       = COALESCE(winlog.event_data.SubjectUserName, winlog.event_data.TargetUserName)
  | EVAL cmd_line    = winlog.event_data.CommandLine
  | EVAL logon_id    = winlog.event_data.SubjectLogonId

  // Kuzatiladigan jarayonlar filtri
  | WHERE winlog.event_data.NewProcessName RLIKE "(?i).*(services[.]exe|svchost[.]exe|lsass[.]exe|cmd[.]exe|powershell[.]exe|notepad[+][+][.]exe|notepad[.]exe|firefox[.]exe|chrome[.]exe|conhost[.]exe)$"

  // Noodatiy ota-jarayonlar — osqueryd va RuntimeBroker istisno
  | WHERE NOT winlog.event_data.ParentProcessName RLIKE "(?i).*osqueryd[.]exe.*"
  | WHERE NOT winlog.event_data.ParentProcessName RLIKE "(?i).*RuntimeBroker[.]exe.*"

  // Kutilgan ota-jarayonlar istisno (legitimate parentlar)
  | WHERE NOT (
      winlog.event_data.NewProcessName RLIKE "(?i).*svchost[.]exe$"
      AND winlog.event_data.ParentProcessName RLIKE "(?i).*services[.]exe$"
    )
  | WHERE NOT (
      winlog.event_data.NewProcessName RLIKE "(?i).*conhost[.]exe$"
      AND winlog.event_data.ParentProcessName RLIKE "(?i).*csrss[.]exe$"
    )
  | WHERE NOT (
      winlog.event_data.NewProcessName RLIKE "(?i).*cmd[.]exe$"
      AND winlog.event_data.ParentProcessName RLIKE "(?i).*(explorer[.]exe|cmd[.]exe)$"
    )
  | WHERE NOT winlog.event_data.ParentProcessName RLIKE "(?i).*(System|smss[.]exe|wininit[.]exe|winlogon[.]exe)$"
  | WHERE NOT actor RLIKE ".*\\$$"

  | STATS
      event_count    = COUNT(*),
      host_names     = VALUES(winlog.computer_name),
      actors         = VALUES(winlog.event_data.SubjectUserName),
      proc_names     = VALUES(winlog.event_data.NewProcessName),
      parent_procs   = VALUES(winlog.event_data.ParentProcessName),
      cmd_lines      = VALUES(winlog.event_data.CommandLine),
      last_seen      = MAX(@timestamp),
      first_seen     = MIN(@timestamp)
    BY agent_id, winlog.computer_name, winlog.event_data.NewProcessName, winlog.event_data.ParentProcessName
  | WHERE event_count >= 1
  | EVAL
      host_name         = winlog.computer_name,
      process_name      = winlog.event_data.NewProcessName,
      parent_proc_name  = winlog.event_data.ParentProcessName
  | KEEP
      agent_id,
      host_name,
      process_name,
      parent_proc_name,
      event_count,
      host_names,
      actors,
      proc_names,
      parent_procs,
      cmd_lines,
      last_seen,
      first_seen
  | SORT event_count DESC
enabled: true
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1037.001
  - attack.t1055
  - detection.threat-hunting
severity: medium
risk_score: 70
references:
  - "https://attack.mitre.org/techniques/T1037/001/"
  - "https://attack.mitre.org/techniques/T1055/"
  - "https://docs.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4688"
nist: ["SI-4", "CM-7", "AU-6"]
pci_dss: ["10.6.1", "11.5", "6.3.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0003:
    T1037: ["T1037.001"]
  TA0004:
    T1055: []