rule_id: 1f6b3e8d-5c2a-4d7f-b419-3e1f6b8d5c2a
name: "Default password usage"
description: |
  Ushbu qoida tarmoq IPS tizimlari tomonidan manzil hostda default parol ishlatilganligini aniqlaydi.
  `Default Password Detected by System` rule dan farqli o'laroq, bu rule FortiSIEM Discovery emas, balki tarmoq IPS (FortiGate, FortiProxy, Checkpoint, Palo Alto) tomonidan aniqlangan default parol ishlatilishini kuzatadi.
  Destination IP ga asoslangan GROUP BY — ya'ni qaysi host ga default parol bilan kirilayotganligi aniqlanadi.
  Bu turdagi hodisa hujumchi tarmoqdagi qurilmalarga default credentials orqali kirish urinayotganligini ko'rsatishi mumkinligi sababli xavfli hisoblanadi.
  Qonuniy holatlar sifatida yangi qurilma konfiguratsiyasi yoki test muhiti uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `destination.ip` (nishon qurilma) ni aniq identifikatsiya qiling.
  - IPS signature ID va event type ni tekshiring.
  - Nishon qurilmaning modeli va default credentials ni tekshiring.
  - Darhol default parolni o'zgartiring va kuchli parol siyosatini qo'llang.
  - Destination IP ni `Policy Violators` watch list ga qo'shing.
  - Tarmoq segmentatsiyasi va kirish cheklovlarini kuchaytiring.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-fortinet.fortigate-*
query_language: esql
query: |
  FROM logs-fortinet.fortigate-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.dataset == "fortinet.fortigate"
  | WHERE observer.type IN ("firewall", "proxy", "ids", "ips")
  | WHERE message RLIKE "(?i).*(default.*password|default.*credential|default.*passwd|default.*pwd|default.*login|factory.*password|factory.*credential|factory.*default|known.*default|common.*credential).*"
     OR event.action RLIKE "(?i).*(default.password|default.credential|default.pwd).*"
  | WHERE destination.ip IS NOT NULL
  | EVAL src_ip      = source.ip
  | EVAL dst_ip      = destination.ip
  | EVAL src_port    = source.port
  | EVAL dst_port    = destination.port
  | EVAL proto       = network.transport
  | EVAL sig_id      = rule.id
  | EVAL sig_uuid    = rule.uuid
  | EVAL dst_geo     = destination.geo.location
  | EVAL observer_nm = observer.name
  | EVAL src_geo     = source.geo.region_name
  | STATS
      event_count   = COUNT(*),
      src_ips       = VALUES(source.ip),
      dst_ips       = VALUES(destination.ip),
      src_ports     = VALUES(source.port),
      dst_ports     = VALUES(destination.port),
      src_geos      = VALUES(source.geo.region_name),
      protocols     = VALUES(network.transport),
      sig_ids       = VALUES(rule.id),
      sig_uuids     = VALUES(rule.uuid),
      actions       = VALUES(event.action),
      observers     = VALUES(observer.name),
      last_seen     = MAX(@timestamp),
      first_seen    = MIN(@timestamp)
    BY destination.ip, rule.id, event.action
  | WHERE event_count >= 1
  | EVAL
      dst_ip            = destination.ip,
      sig_id            = rule.id
  | KEEP
      dst_ip,
      sig_id,
      event_count,
      src_ips,
      dst_ips,
      src_ports,
      dst_ports,
      src_geos,
      protocols,
      sig_ids,
      sig_uuids,
      actions,
      observers,
      last_seen,
      first_seen
  | SORT event_count DESC
enabled: true
tags:
  - attack.initial-access
  - attack.credential-access
  - attack.t1078.001
  - attack.t1110.001
  - detection.threat-hunting
  - policy.violation
severity: medium
risk_score: 65
references:
  - "https://attack.mitre.org/techniques/T1078/001/"
  - "https://attack.mitre.org/techniques/T1110/001/"
  - "https://docs.fortinet.com/product/fortigate"
nist: ["IA-5", "AC-2", "CM-6", "SI-4"]
pci_dss: ["2.1", "8.2.3", "10.6.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0001:
    T1078: ["T1078.001"]
  TA0006:
    T1110: ["T1110.001"]