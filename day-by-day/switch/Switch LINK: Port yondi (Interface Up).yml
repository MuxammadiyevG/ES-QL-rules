rule_id: 0d4e8724-bb46-494e-9646-9237a4fd4f91
name: "Switch LINK: Port yondi (Interface Up)"
description: |
  Switch portiga qurilma ulandi yoki port faollashdi.
  Qaysi switchda, qaysi portda yuz berganini qayd etadi.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - updive-syslog-*
query_language: esql
query: |
  FROM updive-syslog-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | MV_EXPAND log.syslog.facility.name
  | WHERE log.syslog.facility.name == "LINK"
  | WHERE event.type == "start"
  | KEEP @timestamp, host.name, network.interface.name, event.type, event.outcome
  | SORT @timestamp DESC
enabled: true
tags:
  - event.activity
  - switch.link
severity: low
risk_score: 5
