rule_id: 06843f2f-3a9b-4d54-81fe-6195ac0e864c
name: "Switch AAA: Sessiya uzildi (DISCONNECT)"
description: |
  Foydalanuvchi SSH/Telnet sessiyasi uzildi yoki server tomonidan tugatildi.
  TERMINATED — foydalanuvchi o'zi chiqdi.
  DISCONNECT — sessiya server/switch tomonidan yopildi.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - updive-syslog-*
query_language: esql
query: |
  FROM updive-syslog-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | MV_EXPAND log.syslog.facility.name
  | WHERE log.syslog.facility.name == "AAA"
  | WHERE event.action == "DISCONNECT"
  | KEEP @timestamp, host.name, user.name, source.ip, destination.ip, event.action, event.original
  | SORT @timestamp DESC
enabled: true
tags:
  - event.activity
  - switch.auth
severity: low
risk_score: 5