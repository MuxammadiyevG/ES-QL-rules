rule_id: 5f9483ac-4400-4bff-9ea5-66f57771b11f
name: "Switch AAA: Foydalanuvchi switch ga kirdi (ACCEPTED)"
description: |
  SSH yoki Telnet orqali switch ga muvaffaqiyatli ulanish qayd etildi.
  Kim, qayerdan, qaysi switch ga kirganini ko'rsatadi.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - updive-syslog-*
query_language: esql
query: |
  FROM updive-syslog-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE log.syslog.facility.name == "AAA"
  | WHERE event.outcome == "success"
  | WHERE event.action == "logon"
  | KEEP @timestamp, host.name, user.name, source.ip, destination.ip, event.outcome, event.action
  | SORT @timestamp DESC
enabled: true
tags:
  - event.activity
  - switch.auth
severity: low
risk_score: 5