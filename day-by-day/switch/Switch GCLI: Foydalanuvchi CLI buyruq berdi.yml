rule_id: 8a788a4f-5498-4e64-a01b-4802bd86cfb6
name: "Switch GCLI: Foydalanuvchi CLI buyruq berdi"
description: |
  Switch CLI orqali istalgan buyruq bajarildi.
  Bu qoida barcha CLI harakatlarni qayd etish uchun mo'ljallangan.
  Kim, qaysi switch ga, qaysi IP dan, qanday buyruq berganini ko'rsatadi.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - updive-syslog-*
query_language: esql
query: |
  FROM updive-syslog-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | MV_EXPAND log.syslog.facility.name
  | WHERE log.syslog.facility.name == "GCLI"
  | KEEP @timestamp, host.name, user.name, source.ip, destination.ip, process.command_line, event.action
  | SORT @timestamp DESC
enabled: true
tags:
  - event.activity
  - switch.cli
severity: low
risk_score: 5
