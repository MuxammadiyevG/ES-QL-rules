rule_id: bdda1664-9a5f-40d3-9ba5-1b31c2f34e2a
name: "Switch AAA: Foydalanuvchi switch dan chiqdi"
description: |
  Foydalanuvchi SSH/Telnet sessiyasi yakunlandi.
  TERMINATED — foydalanuvchi o'zi chiqdi (exit/logout).
  DISCONNECT — sessiya switch tomonidan yopildi (timeout, admin kick).
  Kim, qachon, qaysi switch dan chiqib ketganini qayd etadi.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - updive-syslog-*
query_language: esql
query: |
  FROM updive-syslog-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | MV_EXPAND event.action
  | WHERE log.syslog.facility.name == "AAA"
  | WHERE event.action == "logoff"
  | KEEP
      @timestamp,
      host.name,
      user.name,
      source.ip,
      destination.ip,
      event.action,
      event.outcome,
      event.original
  | SORT @timestamp DESC
enabled: true
tags:
  - event.activity
  - switch.auth
  - switch.logoff
severity: info
risk_score: 5