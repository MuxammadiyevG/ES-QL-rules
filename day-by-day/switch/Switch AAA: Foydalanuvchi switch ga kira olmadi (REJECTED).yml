rule_id: b0ed8508-0f5b-404a-9f17-d99af1dd7218
name: "Switch AAA: Foydalanuvchi switch ga kira olmadi (REJECTED)"
description: |
  SSH yoki Telnet orqali switch ga ulanishda autentifikatsiya rad etildi.
  Noto'g'ri parol yoki noma'lum foydalanuvchi.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - updive-syslog-*
query_language: esql
query: |
  FROM updive-syslog-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE log.syslog.facility.name == "AAA"
  | WHERE event.outcome == "failure"
  | KEEP @timestamp, host.name, user.name, source.ip, destination.ip, event.outcome, event.action
  | SORT @timestamp DESC
enabled: true
tags:
  - event.activity
  - switch.auth
severity: low
risk_score: 10