rule_id: 212b9607-a550-491f-937e-0dd85e87e36a
name: "Switch AAA: Foydalanuvchi switch dan chiqdi (TERMINATED)"
description: |
  Foydalanuvchi switch CLI sessiyasini tugatdi yoki sessiya uzildi.
  Kim qachon chiqib ketganini qayd etadi.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - updive-syslog-*
query_language: esql
query: |
  FROM updive-syslog-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE log.syslog.facility.name == "AAA"
  | WHERE event.action == "logoff"
  | KEEP @timestamp, host.name, user.name, source.ip, destination.ip, event.outcome, event.action
  | SORT @timestamp DESC
enabled: true
tags:
  - event.activity
  - switch.auth
severity: low
risk_score: 5
