rule_id: f31aebb0-f7de-4749-8ed2-ea0b389fe511
name: "Switch SYSLOG: Barcha logging konfiguratsiya o'zgarishlari"
description: |
  SYSLOG facility ostidagi barcha hodisalar — buffer, console,
  server, aggregation va boshqa barcha o'zgarishlar.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - updive-syslog-*
query_language: esql
query: |
  FROM updive-syslog-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE log.syslog.facility.name == "SYSLOG"
  | STATS
      event_count = COUNT(*),
      actions     = VALUES(event.action),
      messages    = VALUES(event.original),
      last_seen   = MAX(@timestamp)
    BY host.name, event.action
  | KEEP host.name, event.action, event_count, messages, last_seen
  | SORT last_seen DESC
enabled: true
tags:
  - event.activity
  - switch.config
severity: low
risk_score: 10