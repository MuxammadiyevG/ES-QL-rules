rule_id: 275a06aa-df63-441a-b0a2-b19bf20b0ac2
name_uz: "Nginx - haddan ortiq ko'p autentifikatsiya xatoliklari"
name_ru: "Nginx - чрезмерное количество ошибок аутентификации"
name_en: "Nginx - Excessive Authentication Failures"
description_uz: |
  Bitta manbadan ko'plab 401 va 403 xatoliklarini aniqlaydi. 
  Bu parollarni terib ko'rish (Brute-force) yoki himoyalangan zonalarga kirishga urinish.
description_ru: |
  Обнаруживает множество ошибок 401 и 403 из одного источника. 
  Это перебор паролей (Brute-force) или попытка доступа к защищённым зонам.
description_en: |
  Detects many 401 and 403 errors from a single source. 
  This is password guessing (Brute-force) or an attempt to access protected zones.
type: esql
params: '{}'
schedule_interval: 10m
index:
 - "logs-nginx.access-*"
query_language: esql
query: |
  FROM logs-nginx.access-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE http.response.status_code == 401 OR http.response.status_code == 403
  | STATS
      fail_count = COUNT(*),
      target_urls = VALUES(url.original)
    BY agent_id, source.ip
  | WHERE fail_count >= 10
  | SORT fail_count DESC
enabled: true
tags:
 - "nginx"
 - "brute-force"
 - "access-violation"
severity: high
risk_score: 70
nist: ["AC-2", "SI-4"]
pci_dss: ["10.2.4", "10.6.1"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0006:
    T1110: []