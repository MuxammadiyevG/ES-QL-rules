rule_id: b917fceb-7b72-440b-976a-adfd0532a4ed
name_uz: "Nginx - Ehtimoliy Command Injection urinishi"
name_ru: "Nginx - Возможная попытка Command Injection"
name_en: "Nginx - Potential Command Injection Attempt"
description_uz: |
  URL yoki User-Agent orqali tizim buyruqlarini (ls, cat, whoami, /bin/sh) yuborish urinishlarini aniqlaydi.
description_ru: |
  Обнаруживает попытки отправки системных команд (ls, cat, whoami, /bin/sh) через URL или User-Agent.
description_en: |
  Detects attempts to send system commands (ls, cat, whoami, /bin/sh) via the URL or User-Agent.
type: esql
params: '{}'
schedule_interval: 5m
index:
 - "logs-nginx.access-*"
query_language: esql
query: |
  FROM logs-nginx.access-*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE url.original LIKE "*cgi-bin*"
     OR url.original LIKE "*/../*"
     OR url.original LIKE "*pearcmd*"
     OR url.original LIKE "*_vti_bin*"
     OR url.original LIKE "*%2F..%2F*"
     OR url.original LIKE "*%00*"
     OR url.original LIKE "*whoami*"
     OR url.original LIKE "*cat%20/etc/*"
     OR url.original LIKE "*cmd.exe*"
     OR url.original LIKE "*powershell*"
  | STATS
      injection_count = COUNT(*),
      full_urls = VALUES(url.original)
    BY agent_id, source.ip
  | WHERE injection_count >= 1
  | KEEP agent_id, source.ip, injection_count, full_urls
enabled: true
tags:
 - "nginx"
 - "attack.t1190"
 - "rce"
severity: critical
risk_score: 90
nist: ["SI-4", "SC-5"]
pci_dss: ["6.5.1", "10.2.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0001:
    T1190: []