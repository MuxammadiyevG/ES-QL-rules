rule_id: d25b8928-7218-430e-b9a3-b229f1e9839f
name_uz: "Nginx - Open Redirect urinishi"
name_ru: "Nginx - попытка Open Redirect"
name_en: "Nginx - Open Redirect Attempt"
description_uz: |
  Ushbu qoida Nginx access log'da open redirect urinishlarini aniqlaydi.
  redirect=, url=, next=, return=, dest= kabi parametrlar absolute yoki offsite URL (http://, https://, //)
  qiymatiga ega bo'lganda flagga olinadi.
  Bu phishing, credential theft yoki user-driven exploitation belgisi (T1204).
  Qonuniy holatlar: legitimate redirect flow, SSO callback, OAuth redirect.
  SOC triage bosqichlari:
  - Redirect target domen'ini tahlil qiling — ishonchli yoki begona ekanligini aniqlang
  - Affected endpoint va parameter validation'ni tekshiring
  - Phishing campaign bilan bog'liqlikni baholang
  - Application redirect allowlist mavjudligini review qiling
  - WAF yoki application fix zarurligini baholang
description_ru: |
  Это правило обнаруживает попытки open redirect в access log Nginx.
  Параметры вроде redirect=, url=, next=, return=, dest= помечаются, когда содержат абсолютный или внешний URL (http://, https://, //)
  в качестве значения.
  Это признак фишинга, кражи учётных данных или эксплуатации с участием пользователя (T1204).
  Легитимные случаи: легитимный поток редиректов, SSO callback, OAuth redirect.
  Этапы SOC-триажа:
  - Проанализируйте домен цели редиректа — определите, доверенный он или чужой
  - Проверьте затронутый эндпоинт и валидацию параметров
  - Оцените связь с фишинговой кампанией
  - Проверьте наличие allowlist редиректов в приложении
  - Оцените необходимость исправления в WAF или приложении
description_en: |
  This rule detects open redirect attempts in the Nginx access log.
  Parameters such as redirect=, url=, next=, return=, dest= are flagged when they carry an absolute or offsite URL (http://, https://, //)
  value.
  This is a sign of phishing, credential theft or user-driven exploitation (T1204).
  Legitimate cases: legitimate redirect flow, SSO callback, OAuth redirect.
  SOC triage steps:
  - Analyze the redirect target domain — determine whether it is trusted or foreign
  - Check the affected endpoint and parameter validation
  - Assess any link with a phishing campaign
  - Review whether an application redirect allowlist exists
  - Assess whether a WAF or application fix is needed
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-nginx.access-*
query_language: esql
query: |
  FROM logs-nginx.access-*
  | WHERE @timestamp >= NOW() - 20 minutes
  | WHERE data_stream.dataset == "nginx.access"
  | WHERE TO_LOWER(url.original) RLIKE ".*(redirect|url|next|return|returnto|dest|destination|continue|redir|goto)=(https?(:|%3a)(/|%2f){2}|(/|%2f){2}).*"
  | STATS
      event_count = COUNT(*),
      urls = VALUES(url.original),
      methods = VALUES(http.request.method),
      status_codes = VALUES(http.response.status_code),
      user_agents = VALUES(user_agent.original)
    BY agent_id, source.ip, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE event_count >= 3
  | KEEP agent_id, bucket, source.ip, event_count, urls, methods, status_codes, user_agents
  | SORT event_count DESC
  | LIMIT 100
enabled: false
tags:
- attack.initial-access
- attack.t1190
- attack.t1204
- nginx
- open-redirect
- phishing
severity: medium
risk_score: 50
references:
- "https://attack.mitre.org/techniques/T1190/"
- "https://owasp.org/www-community/attacks/Unvalidated_Redirects_and_Forwards"
nist: ["SI-4", "SI-10"]
pci_dss: ["6.5.1", "11.4"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0001:
    T1190: []
