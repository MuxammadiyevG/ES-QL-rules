rule_id: 54935f54-2239-4faa-ae54-7d7e42ef6e32
name_uz: "Nginx - CRLF Injection / HTTP Response Splitting"
name_ru: "Nginx - CRLF Injection / HTTP Response Splitting"
name_en: "Nginx - CRLF Injection / HTTP Response Splitting"
description_uz: |
  Ushbu qoida Nginx access log'da CRLF injection va HTTP response splitting urinishlarini aniqlaydi.
  URL ichida encoded carriage return / line feed (%0d%0a, \r\n) pattern'lari yuboriladi.
  Bu header injection, cache poisoning yoki XSS uchun ishlatiladi (T1190).
  Qonuniy holatlar: misconfigured client, legitimate encoded parameters.
  SOC triage bosqichlari:
  - Inject qilingan CRLF payload va target parameter'ni tahlil qiling
  - Response header'larda anomaliya bormi tekshiring
  - Cache poisoning yoki open redirect bilan bog'liqlikni baholang
  - Application input validation'ni review qiling
  - WAF rule update zarurligini baholang
description_ru: |
  Это правило обнаруживает попытки CRLF injection и HTTP response splitting в access log Nginx.
  В URL передаются закодированные шаблоны carriage return / line feed (%0d%0a, \r\n).
  Это используется для header injection, отравления кэша или XSS (T1190).
  Легитимные случаи: неверно настроенный клиент, легитимные закодированные параметры.
  Этапы SOC-триажа:
  - Проанализируйте внедрённую CRLF-нагрузку и целевой параметр
  - Проверьте, есть ли аномалии в заголовках ответа
  - Оцените связь с отравлением кэша или open redirect
  - Проверьте валидацию входных данных приложения
  - Оцените необходимость обновления правил WAF
description_en: |
  This rule detects CRLF injection and HTTP response splitting attempts in the Nginx access log.
  Encoded carriage return / line feed (%0d%0a, \r\n) patterns are sent inside the URL.
  This is used for header injection, cache poisoning or XSS (T1190).
  Legitimate cases: misconfigured client, legitimate encoded parameters.
  SOC triage steps:
  - Analyze the injected CRLF payload and the target parameter
  - Check whether there are anomalies in the response headers
  - Assess any link with cache poisoning or open redirect
  - Review the application input validation
  - Assess whether a WAF rule update is needed
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-nginx.access-*
query_language: esql
query: |
  FROM logs-nginx.access-*
  | WHERE @timestamp >= NOW() - 20 minutes
  | WHERE data_stream.dataset == "nginx.access"
  | WHERE TO_LOWER(url.original) RLIKE ".*(%0d%0a|%0a%0d|%0d|%0a|%23%0d|%e5%98%8a%e5%98%8d).*"
  | STATS
      event_count = COUNT(*),
      urls = VALUES(url.original),
      methods = VALUES(http.request.method),
      status_codes = VALUES(http.response.status_code),
      user_agents = VALUES(user_agent.original)
    BY agent_id, source.ip, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE event_count >= 3
  | KEEP agent_id, bucket, source.ip, event_count, urls, methods, status_codes, user_agents
  | SORT event_count DESC
  | LIMIT 100
enabled: false
tags:
- attack.initial-access
- attack.t1190
- nginx
- crlf-injection
- response-splitting
- web-exploitation
severity: high
risk_score: 72
references:
- "https://attack.mitre.org/techniques/T1190/"
- "https://owasp.org/www-community/attacks/HTTP_Response_Splitting"
nist: ["SI-4", "SI-10"]
pci_dss: ["6.5.1", "11.4"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0001:
    T1190: []
