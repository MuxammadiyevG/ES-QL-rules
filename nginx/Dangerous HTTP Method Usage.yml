rule_id: df5044f0-49ce-4979-9aca-dab8078f1667
#//RULE-NIST-30 — HTTP Method Abuse (NIST SC-7, SI-4)
#//Control Family: SC (System and Communications Protection), SI (System and Information Integrity)
#//Objective: Detect use of dangerous or unusual HTTP methods
#//Threat scenario: Attacker uses PUT/DELETE/TRACE methods for exploitation
#//Data sources: Nginx access logs showing HTTP methods
#//ECS fields used: event.action, event.original, event.outcome
#//Field validation: Verify all ECS fields exist in your indices before enabling
#//Tuning notes: Allowlist RESTful APIs that legitimately use PUT/DELETE

name_uz: "Xavfli HTTP metodlaridan foydalanish"
name_ru: "Использование опасных HTTP-методов"
name_en: "Dangerous HTTP Method Usage"
description_uz: |
  Potentsial xavfli HTTP metodlaridan (PUT, DELETE, TRACE, CONNECT, OPTIONS) foydalanishni aniqlaydi.
  PUT/DELETE noto'g'ri sozlanganda resurslarni o'zgartirishi/o'chirishi mumkin, TRACE esa XST hujumlariga imkon beradi.
  Aksariyat veb-ilovalarda GET/POST/HEAD dan boshqa metodlar cheklanishi kerak.
  False positive: RESTful API'lar, WebDAV xizmatlari, qonuniy admin operatsiyalari.
  Triage: ilova REST API sifatida loyihalanganini tekshiring, metodlar to'g'ri autentifikatsiya qilinganini tekshiring,
  muvaffaqiyatli ekspluatatsiya (200/204 javoblar) bor-yo'qligini ko'rib chiqing, metod cheklovlari o'rnatilganiga ishonch hosil qiling.
description_ru: |
  Обнаруживает использование потенциально опасных HTTP-методов (PUT, DELETE, TRACE, CONNECT, OPTIONS).
  PUT/DELETE при неверной настройке позволяют изменять/удалять ресурсы, TRACE открывает возможность атак XST.
  В большинстве веб-приложений методы, отличные от GET/POST/HEAD, должны быть ограничены.
  Ложные срабатывания: RESTful API, службы WebDAV, легитимные административные операции.
  Triage: проверьте, спроектировано ли приложение как REST API, проверьте, требуют ли методы аутентификации,
  изучите признаки успешной эксплуатации (ответы 200/204), убедитесь, что ограничения методов настроены.
description_en: |
  Detects usage of potentially dangerous HTTP methods (PUT, DELETE, TRACE, CONNECT, OPTIONS).
  PUT/DELETE can modify/delete resources if improperly configured, TRACE enables XST attacks.
  Methods other than GET/POST/HEAD should be restricted on most web applications.
  False positives: RESTful APIs, WebDAV services, legitimate admin operations.
  Triage: Verify if application designed as REST API, check if methods properly authenticated,
  review for successful exploitation (200/204 responses), ensure method restrictions in place.
type: esql
params: '{}'
schedule_interval: 15m
index:
  - logs-nginx*
query_language: esql
query: |
  FROM logs-nginx.access-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE http.request.method IN ("PUT", "DELETE", "TRACE", "CONNECT", "OPTIONS", "PATCH")
  | EVAL method_risk = CASE(
      http.request.method IN ("PUT", "DELETE"), "high",
      http.request.method == "TRACE", "medium",
      http.request.method IN ("OPTIONS", "CONNECT", "PATCH"), "low",
      "unknown"
    )
  | EVAL successful_execution = CASE(
      http.response.status_code IN (200, 201, 202, 204), true,
      false
    )
  | STATS
      method_count = COUNT(*),
      successful_count = SUM(CASE(successful_execution == true, 1, 0)),
      unique_paths = COUNT_DISTINCT(url.path),
      methods_used = VALUES(http.request.method),
      target_paths = VALUES(url.path),
      status_codes = VALUES(http.response.status_code)
    BY agent_id, source.ip, method_risk
    , bucket = DATE_TRUNC(15 minutes, @timestamp)
  | WHERE method_count >= 3
  | EVAL risk_score = CASE(
      method_risk == "high" AND successful_count >= 1, method_count * 30,
      method_risk == "high", method_count * 20,
      method_count * 10
    )
  | WHERE risk_score >= 30
  | KEEP agent_id, bucket, source.ip, method_risk, method_count, successful_count, unique_paths, methods_used, target_paths, risk_score
  | SORT risk_score DESC
enabled: false
tags:
  - nist_800_53
  - control_SC-7
  - control_SI-4
  - family_SC
  - family_SI
  - exploitation
  - web_application
severity: medium
risk_score: 58
references:
  - "NIST SP 800-53 Rev.5 SC-7: Boundary Protection"
  - "OWASP: HTTP Verb Tampering"
nist: ["SC-7", "SI-4"]
gdpr: []
pci_dss: []
mitre_attack: []