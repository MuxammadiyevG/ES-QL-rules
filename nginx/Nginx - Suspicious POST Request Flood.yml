rule_id: a9587e41-6523-4648-832d-c149770e2fee
name_uz: "Nginx - Shubhali POST so'rovlar to'foni"
name_ru: "Nginx - Подозрительный флуд POST-запросов"
name_en: "Nginx - Suspicious POST Request Flood"
description_uz: |
  Ushbu qoida bir xil manbadan qisqa vaqt ichida ko'p POST request'larni aniqlaydi.
  Bu DoS/DDoS, form spam yoki application abuse urinishi belgisi.
  Qonuniy holatlar: legitimate API usage, batch processing, automated workflows.
  SOC triage bosqichlari:
  - POST endpoint'lar va frequency'ni tahlil qiling
  - Request body size va pattern'ini tekshiring
  - Application performance impact'ini baholang
  - Bot yoki legitimate client ekanligini aniqlang
  - Rate limiting yoki CAPTCHA implementation'ni consider qiling
description_ru: |
  Это правило обнаруживает множество POST-запросов с одного источника за короткое время.
  Это признак DoS/DDoS, спама форм или злоупотребления приложением.
  Легитимные случаи: легитимное использование API, пакетная обработка, автоматизированные процессы.
  Этапы SOC triage:
  - Проанализируйте POST endpoint и частоту запросов
  - Проверьте размер и паттерн тела запроса
  - Оцените влияние на производительность приложения
  - Определите, это бот или легитимный клиент
  - Рассмотрите внедрение rate limiting или CAPTCHA
description_en: |
  This rule detects many POST requests from the same source within a short time.
  This is an indicator of DoS/DDoS, form spam or an application abuse attempt.
  Legitimate cases: legitimate API usage, batch processing, automated workflows.
  SOC triage steps:
  - Analyze the POST endpoints and frequency
  - Check the request body size and pattern
  - Assess the application performance impact
  - Determine whether it is a bot or a legitimate client
  - Consider implementing rate limiting or CAPTCHA
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-nginx.access-*
query_language: esql
query: |
  FROM logs-nginx.access-*
  | WHERE @timestamp >= NOW() - 30 minutes
  | WHERE data_stream.dataset == "nginx.access"
  | WHERE http.request.method == "POST"
  | STATS
      event_count = COUNT(*),
      urls = VALUES(url.original),
      status_codes = VALUES(http.response.status_code),
      user_agents = VALUES(user_agent.original),
      total_bytes = SUM(http.response.body.bytes)
    BY agent_id, source.ip, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE event_count >= 50
  | KEEP agent_id, bucket, source.ip, event_count, urls, status_codes, user_agents, total_bytes
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.impact
- attack.t1499
- nginx
- dos
- request-flood
severity: medium
risk_score: 60
references:
- "https://attack.mitre.org/techniques/T1499/"
nist: ["SC-5", "SI-4"]
pci_dss: ["10.6.1"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0040:
    T1499: []