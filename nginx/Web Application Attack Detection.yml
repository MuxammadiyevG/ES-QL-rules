rule_id: f254e86c-a479-43fd-9fdf-675ae8227e1a
#//RULE-NIST-24 — Web Application Attack Patterns (NIST SC-7, SI-4, AC-14)
#//Control Family: SC (System and Communications Protection), SI (System and Information Integrity)
#//Objective: Detect common web application attacks (SQLi, XSS, traversal)
#//Threat scenario: Attacker exploits web vulnerabilities for unauthorized access or data theft
#//Data sources: Nginx access logs via filebeat
#//ECS fields used: event.original, event.original, event.action, event.original, source.ip
#//Field validation: Verify all ECS fields exist in your indices before enabling
#//Tuning notes: Adjust pattern matching for application-specific parameters, allowlist scanners

name_uz: "Veb-ilovaga hujumlarni aniqlash"
name_ru: "Обнаружение атак на веб-приложения"
name_en: "Web Application Attack Detection"
description_uz: |
  HTTP so'rovlarida SQLi, XSS, command injection yoki path traversal'ni ko'rsatuvchi zararli payload'larni aniqlaydi.
  SQL kalit so'zlari, script teglari, shell buyruqlari yoki katalog traversal ketma-ketliklarini o'z ichiga olgan URL parametrlari flagga olinadi.
  Shubhali payload yoki g'ayrioddiy user-agent'ga ega POST/PUT so'rovlariga e'tibor qaratiladi.
  False positive: ilovaning qonuniy funksionali, xavfsizlik skanerlari, penetration testing.
  Triage: so'rovning to'liq tafsilotlarini ko'rib chiqing, manba IP tanilgan skaner ekanligini tekshiring,
  ilova aniqlangan hujum turiga zaifligini tasdiqlang, zararli manbalarni bloklang.
description_ru: |
  Обнаруживает вредоносные payload в HTTP-запросах, указывающие на SQLi, XSS, command injection или path traversal.
  Помечаются параметры URL, содержащие ключевые слова SQL, теги script, команды shell или последовательности обхода каталогов.
  Фокус на POST/PUT-запросах с подозрительными payload или необычными user-agent.
  Ложные срабатывания: легитимная функциональность приложения, сканеры безопасности, тестирование на проникновение.
  Triage: изучите полные детали запроса, проверьте, не является ли IP-источник известным сканером,
  убедитесь, уязвимо ли приложение к обнаруженному типу атаки, заблокируйте вредоносные источники.
description_en: |
  Detects malicious payloads in HTTP requests indicating SQLi, XSS, command injection, or path traversal.
  URL parameters containing SQL keywords, script tags, shell commands, or directory traversal sequences flagged.
  Focus on POST/PUT requests with suspicious payloads or unusual user-agents.
  False positives: Legitimate application functionality, security scanners, penetration testing.
  Triage: Review full request details, check if source IP is known scanner,
  verify if application is vulnerable to detected attack type, block malicious sources.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-nginx.access-*
query_language: esql
query: |
  FROM logs-nginx.access-*
  | WHERE @timestamp >= NOW() - 20 minutes
  | WHERE url.original IS NOT NULL
  | EVAL attack_pattern = CASE(
      TO_LOWER(url.original) RLIKE ".*(union.*select|insert.*into|update.*set|delete.*from|drop.*table|exec\\(|execute\\().*", "SQL-Injection",
      TO_LOWER(url.original) RLIKE ".*(\\<script|javascript:|onerror=|onload=|\\<iframe).*", "XSS-Attempt",
      /* Fixed the Path Traversal regex escaping below */
      TO_LOWER(url.original) RLIKE ".*(\\.\\.\\/|\\.\\.\\\\|etc\\/passwd|boot\\.ini|win\\.ini).*", "Path-Traversal",
      TO_LOWER(url.original) RLIKE ".*(;\\s*(ls|cat|whoami|wget|curl|bash|sh|cmd|powershell)).*", "Command-Injection",
      TO_LOWER(url.original) RLIKE ".*(admin|backup|config|phpinfo|shell|webshell).*", "Admin-Panel-Probe",
      "Unknown"
    )
  | WHERE attack_pattern != "Unknown"
  | EVAL suspicious_user_agent = CASE(
      /* Standardizing regex for scanners */
      TO_LOWER(user_agent.original) RLIKE ".*(sqlmap|nikto|nmap|metasploit|burp|acunetix|nessus|openvas).*", true,
      user_agent.original == "-" OR user_agent.original IS NULL, true,
      false
    )
  | STATS
      attack_count = COUNT(*),
      unique_payloads = COUNT_DISTINCT(url.original),
      attack_paths = VALUES(url.path),
      scanner_detected = SUM(CASE(suspicious_user_agent == true, 1, 0))
    BY agent_id, source.ip, attack_pattern, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE attack_count >= 3
  | EVAL risk_score = attack_count * 15 + scanner_detected * 20
  | WHERE risk_score >= 45
  | KEEP agent_id, bucket, source.ip, attack_pattern, attack_count, unique_payloads, attack_paths, risk_score
  | SORT risk_score DESC
enabled: false
tags:
  - nist_800_53
  - control_SC-7
  - control_SI-4
  - control_AC-14
  - family_SC
  - family_SI
  - family_AC
  - initial_access
  - web_application
  - exploitation
severity: high
risk_score: 81
references:
  - "NIST SP 800-53 Rev.5 SC-7: Boundary Protection"
  - "OWASP Top 10"
  - "MITRE ATT&CK T1190: Exploit Public-Facing Application"
nist: ["SC-7", "SI-4", "AC-14"]
pci_dss: "6.5"
mitre_attack:
  TA0001:
    T1190: []