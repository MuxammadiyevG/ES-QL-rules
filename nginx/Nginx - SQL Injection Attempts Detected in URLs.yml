rule_id: 010e4218-711d-4f78-a94c-c959d59cc098
name_uz: "Nginx - URL'larda SQL Injection urinishlari aniqlandi"
name_ru: "Nginx - Обнаружены попытки SQL Injection в URL"
name_en: "Nginx - SQL Injection Attempts Detected in URLs"
description_uz: |
  Ushbu qoida Nginx access log'da URL'larda SQL injection pattern'larni aniqlaydi.
  Bu database exploitation urinishi belgisi (T1190).
  Qonuniy holatlar: false positive, legitimate SQL-like strings in URLs.
  SOC triage bosqichlari:
  - SQL injection payload'ni tahlil qiling
  - Target application va database type'ni aniqlang
  - HTTP response code va application behavior tekshiring
  - Backend WAF yoki IPS detection'i bormi confirm qiling
  - Application vulnerability assessment zarurligini baholang
description_ru: |
  Это правило обнаруживает паттерны SQL injection в URL в access log Nginx.
  Это признак попытки эксплуатации базы данных (T1190).
  Легитимные случаи: ложное срабатывание, легитимные SQL-подобные строки в URL.
  Этапы SOC triage:
  - Проанализируйте payload SQL injection
  - Определите целевое приложение и тип базы данных
  - Проверьте HTTP response code и поведение приложения
  - Подтвердите, есть ли детект на backend WAF или IPS
  - Оцените необходимость оценки уязвимостей приложения
description_en: |
  This rule detects SQL injection patterns in URLs in the Nginx access log.
  This is an indicator of a database exploitation attempt (T1190).
  Legitimate cases: false positive, legitimate SQL-like strings in URLs.
  SOC triage steps:
  - Analyze the SQL injection payload
  - Identify the target application and database type
  - Check the HTTP response code and application behavior
  - Confirm whether there is a backend WAF or IPS detection
  - Assess whether an application vulnerability assessment is required
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-nginx.access-*
query_language: esql
query: |
  FROM logs-nginx.access-*
  | WHERE @timestamp >= NOW() - 45 minutes
  | WHERE data_stream.dataset == "nginx.access"
  | WHERE TO_LOWER(url.original) RLIKE ".*(union select|union all select|information_schema|sysobjects|syscolumns|or 1=1|or 1 = 1|and 1=1|[']or[']|sleep\\(|benchmark\\(|waitfor delay|xp_cmdshell|concat\\(|cast\\(|convert\\(|; --|/\\*\\*/|0x[0-9a-f]{4,}).*"
  | STATS
      event_count = COUNT(*),
      urls = VALUES(url.original),
      methods = VALUES(http.request.method),
      status_codes = VALUES(http.response.status_code),
      user_agents = VALUES(user_agent.original)
    BY agent_id, source.ip, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE event_count >= 1
  | KEEP agent_id, bucket, source.ip, event_count, urls, methods, status_codes, user_agents
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.initial-access
- attack.t1190
- nginx
- sql-injection
- web-exploitation
severity: critical
risk_score: 85
references:
- "https://attack.mitre.org/techniques/T1190/"
- "https://owasp.org/www-community/attacks/SQL_Injection"
nist: ["SI-4", "SI-10"]
pci_dss: ["6.5.1", "11.4"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0001:
    T1190: []