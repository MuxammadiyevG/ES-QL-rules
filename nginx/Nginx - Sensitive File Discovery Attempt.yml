rule_id: 56aee96e-9c05-4987-9ce0-18d3a6514a4f
name_uz: "Nginx - Maxfiy fayllarni aniqlash urinishi"
name_ru: "Nginx - Попытка обнаружения чувствительных файлов"
name_en: "Nginx - Sensitive File Discovery Attempt"
description_uz: |
  Konfiguratsiya va tizim fayllariga (.env, .git, .bak) kirish urinishlarini aniqlaydi.
  Bu ma'lumotlarni o'g'irlash (Information Disclosure) bosqichidir.
description_ru: |
  Обнаруживает попытки доступа к конфигурационным и системным файлам (.env, .git, .bak).
  Это этап хищения данных (Information Disclosure).
description_en: |
  Detects attempts to access configuration and system files (.env, .git, .bak).
  This is the data theft (Information Disclosure) stage.
type: esql
params: '{}'
schedule_interval: 10m
index:
 - "logs-nginx.access-*"
query_language: esql
query: |
  FROM logs-nginx.access-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE url.original LIKE "*.env*" 
     OR url.original LIKE "*.git*" 
     OR url.original LIKE "*wp-config*" 
     OR url.original LIKE "*.sql*" 
     OR url.original LIKE "*.bak*"
  | STATS
      attempt_count = COUNT(*),
      requested_files = VALUES(url.original)
    BY agent_id, source.ip
  | WHERE attempt_count >= 3
  | KEEP agent_id, source.ip, attempt_count, requested_files
  | SORT attempt_count DESC
enabled: true
tags:
 - "nginx"
 - "reconnaissance"
 - "information-disclosure"
severity: high
risk_score: 75
nist: ["SI-4", "SC-7"]
pci_dss: ["10.2.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0043:
    T1595: []
  TA0001:
    T1190: []
  TA0007:
    T1083: []