rule_id: 35b369ae-eff0-49dc-a2ff-bdcf8e5b4999
name_uz: "Nginx - Shubhali HTTP 5xx server xatolari keskin o'sishi"
name_ru: "Nginx - Подозрительный всплеск серверных ошибок HTTP 5xx"
name_en: "Nginx - Suspicious HTTP 5xx Server Error Spike"
description_uz: |
  Ushbu qoida Nginx'da qisqa vaqt ichida ko'p 5xx server error'larni aniqlaydi.
  Bu DoS attack, application vulnerability exploitation yoki service degradation belgisi.
  Qonuniy holatlar: legitimate traffic spike, backend service outage, deployment issues.
  SOC triage bosqichlari:
  - Error type distribution'ni tahlil qiling (500, 502, 503, 504)
  - Backend application logs bilan correlate qiling
  - Resource exhaustion (CPU, memory, connections) bormi tekshiring
  - Malicious traffic yoki legitimate load spike ekanligini aniqlang
  - Incident response va service restoration zarurligini baholang
description_ru: |
  Это правило обнаруживает множество серверных ошибок 5xx в Nginx за короткое время.
  Это признак DoS-атаки, эксплуатации уязвимости приложения или деградации сервиса.
  Легитимные случаи: легитимный всплеск трафика, недоступность backend-сервиса, проблемы деплоя.
  Этапы SOC triage:
  - Проанализируйте распределение типов ошибок (500, 502, 503, 504)
  - Сопоставьте с логами backend-приложения
  - Проверьте, есть ли исчерпание ресурсов (CPU, memory, connections)
  - Определите, это вредоносный трафик или легитимный всплеск нагрузки
  - Оцените необходимость реагирования на инцидент и восстановления сервиса
description_en: |
  This rule detects many 5xx server errors in Nginx within a short time.
  This is an indicator of a DoS attack, application vulnerability exploitation or service degradation.
  Legitimate cases: legitimate traffic spike, backend service outage, deployment issues.
  SOC triage steps:
  - Analyze the error type distribution (500, 502, 503, 504)
  - Correlate with the backend application logs
  - Check whether there is resource exhaustion (CPU, memory, connections)
  - Determine whether it is malicious traffic or a legitimate load spike
  - Assess whether incident response and service restoration are required
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-nginx.access-*
query_language: esql
query: |
  FROM logs-nginx.access-*
  | WHERE @timestamp >= NOW() - 30 minutes
  | WHERE data_stream.dataset == "nginx.access"
  | WHERE http.response.status_code >= 500 AND http.response.status_code < 600
  | STATS
      event_count = COUNT(*),
      status_codes = VALUES(http.response.status_code),
      urls = VALUES(url.original),
      methods = VALUES(http.request.method),
      unique_sources = COUNT_DISTINCT(source.ip)
    BY agent_id, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE event_count >= 50
  | KEEP agent_id, bucket, event_count, status_codes, urls, methods, unique_sources
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.impact
- attack.t1499
- nginx
- server-error
- availability
severity: high
risk_score: 65
references:
- "https://attack.mitre.org/techniques/T1499/"
nist: ["SC-5", "SI-4"]
pci_dss: ["10.6.1"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0040:
    T1499: []