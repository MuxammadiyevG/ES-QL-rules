rule_id: f7970315-6b55-4379-967a-7235a8fcd945
name_uz: "Nginx - Directory Traversal hujum urinishlari"
name_ru: "Nginx - попытки атаки Directory Traversal"
name_en: "Nginx - Directory Traversal Attack Attempts"
description_uz: |
  Ushbu qoida Nginx access log'da directory/path traversal pattern'larni aniqlaydi.
  Bu unauthorized file access urinishi belgisi (T1083).
  Qonuniy holatlar: legitimate relative paths, misconfigured applications.
  SOC triage bosqichlari:
  - Traversal path va target file'ni tahlil qiling
  - HTTP response code - file access successful bo'lganmi tekshiring
  - Web server configuration va file permissions'ni review qiling
  - Sensitive file'larga access bo'lganmi aniqlang
  - Containment va remediation action'lar zarurligini baholang
description_ru: |
  Это правило обнаруживает шаблоны directory/path traversal в access log Nginx.
  Это признак попытки несанкционированного доступа к файлам (T1083).
  Легитимные случаи: легитимные относительные пути, неверно настроенные приложения.
  Этапы SOC-триажа:
  - Проанализируйте путь traversal и целевой файл
  - Проверьте код ответа HTTP - был ли доступ к файлу успешным
  - Проверьте конфигурацию веб-сервера и права доступа к файлам
  - Выясните, был ли получен доступ к чувствительным файлам
  - Оцените необходимость мер по сдерживанию и устранению
description_en: |
  This rule detects directory/path traversal patterns in the Nginx access log.
  This is a sign of an unauthorized file access attempt (T1083).
  Legitimate cases: legitimate relative paths, misconfigured applications.
  SOC triage steps:
  - Analyze the traversal path and the target file
  - Check the HTTP response code - whether the file access was successful
  - Review the web server configuration and file permissions
  - Determine whether sensitive files were accessed
  - Assess whether containment and remediation actions are needed
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-nginx.access-*
query_language: esql
query: |
  FROM logs-nginx.access-*
  | WHERE @timestamp >= NOW() - 45 minutes
  | WHERE data_stream.dataset == "nginx.access"
  | WHERE TO_LOWER(url.original) RLIKE ".*(\\.\\./|\\.\\.\\.\\\\|\\.\\.%2[ff]|%2[ee]%2[ee]%2[ff]|\\.\\.\\\\|/etc/passwd|/etc/shadow|/windows/win\\.ini|/boot\\.ini|c:\\\\windows|config\\.php|wp-config|database\\.yml).*"
  | STATS
      event_count = COUNT(*),
      urls = VALUES(url.original),
      methods = VALUES(http.request.method),
      status_codes = VALUES(http.response.status_code),
      user_agents = VALUES(user_agent.original)
    BY agent_id, source.ip, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE event_count >= 3
  | KEEP agent_id, bucket, source.ip, event_count, urls, methods, status_codes, user_agents
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.initial-access
- attack.t1190
- nginx
- path-traversal
- directory-traversal
severity: critical
risk_score: 80
references:
- "https://attack.mitre.org/techniques/T1083/"
- "https://owasp.org/www-community/attacks/Path_Traversal"
nist: ["SI-4", "CM-7"]
pci_dss: ["6.5.8", "11.4"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0001:
    T1190: []