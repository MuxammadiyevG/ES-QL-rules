rule_id: ecf6cc98-3f0b-452a-8382-b199719405b9
name_uz: "Nginx - juda uzun fayl nomi bilan noto'g'ri URI"
name_ru: "Nginx - некорректный URI с чрезмерно длинным именем файла"
name_en: "Nginx - Invalid URI with Extremely Long Filename"
description_uz: |
  Ushbu qoida Nginx'da juda uzun filename bilan invalid URI request'larni aniqlaydi.
  Bu buffer overflow yoki path traversal attack urinishi belgisi bo'lishi mumkin.
  Qonuniy holatlar: misconfigured client, legitimate long URL, application bug.
  SOC triage bosqichlari:
  - Request URI length va structure'ni tahlil qiling
  - Buffer overflow yoki path traversal pattern'i bormi tekshiring
  - Source IP va attack intent'ni baholang
  - Web server va application version vulnerability'sini tekshiring
  - Similar attack pattern'lar bormi qidiring
description_ru: |
  Это правило обнаруживает в Nginx запросы с некорректным URI и очень длинным именем файла.
  Это может быть признаком попытки атаки buffer overflow или path traversal.
  Легитимные случаи: неверно настроенный клиент, легитимный длинный URL, ошибка приложения.
  Этапы SOC-триажа:
  - Проанализируйте длину и структуру URI запроса
  - Проверьте, есть ли шаблон buffer overflow или path traversal
  - Оцените IP источника и намерение атаки
  - Проверьте уязвимости версии веб-сервера и приложения
  - Поищите похожие шаблоны атак
description_en: |
  This rule detects invalid URI requests with an extremely long filename in Nginx.
  This may be a sign of a buffer overflow or path traversal attack attempt.
  Legitimate cases: misconfigured client, legitimate long URL, application bug.
  SOC triage steps:
  - Analyze the request URI length and structure
  - Check whether there is a buffer overflow or path traversal pattern
  - Assess the source IP and the attack intent
  - Check the web server and application version for vulnerabilities
  - Search for similar attack patterns
type: esql
params: '{}'
schedule_interval: 15m
index:
- logs-nginx.error-*
query_language: esql
query: |
  FROM logs-nginx.error-*
  | WHERE @timestamp >= NOW() - 1 hour
  /* nginx error logs are unstructured: everything is in `message`; client IP grokked out */
  | WHERE TO_LOWER(message) RLIKE ".*file name too long.*"
  | GROK message "client: %{IP:client_ip}"
  | EVAL src_ip = COALESCE(client_ip, "unknown")
  | STATS
      event_count = COUNT(*),
      sample_messages = VALUES(message),
      hosts = VALUES(host.name)
    BY agent_id, src_ip, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 5
  | KEEP agent_id, bucket, src_ip, event_count, sample_messages, hosts
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.initial-access
- nginx
- invalid-request
- buffer-overflow
- path-traversal
severity: high
risk_score: 68
references:
- "https://attack.mitre.org/techniques/T1190/"
nist: ["SI-10", "AC-4"]
pci_dss: ["10.2.4", "6.5.1"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0001:
    T1190: []