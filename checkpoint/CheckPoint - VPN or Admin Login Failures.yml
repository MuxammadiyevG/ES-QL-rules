rule_id: 58ae92cd-0032-4ef4-8f6c-0512c7e77c33
name_uz: "CheckPoint - VPN yoki admin login xatoliklari"
name_ru: "CheckPoint - Неудачные входы VPN или администратора"
name_en: "CheckPoint - VPN or Admin Login Failures"
description_uz: |
  Ushbu qoida CheckPoint Authorize (login) failure hodisalarini aniqlaydi.
  Bu brute force, credential stuffing yoki unauthorized access urinishi belgisi.
  Qonuniy holatlar: user parol xatosi, expired credentials, MFA issues.
  SOC triage bosqichlari:
  - User account va login type'ni identifikatsiya qiling
  - Source IP geo-location va reputation tekshiring
  - Login attempt time pattern'ini tahlil qiling
  - Muvaffaqiyatli login bo'lganmi keyinroq tekshiring
  - Account lockout yoki containment zarurligini baholang
description_ru: |
  Это правило выявляет события неудачной авторизации CheckPoint Authorize (login).
  Это признак перебора паролей (brute force), credential stuffing или попытки несанкционированного доступа.
  Легитимные ситуации: ошибка пользователя в пароле, истёкшие учётные данные, проблемы с MFA.
  Этапы SOC-триажа:
  - Идентифицируйте учётную запись и тип входа
  - Проверьте геолокацию и репутацию source IP
  - Проанализируйте временной шаблон попыток входа
  - Проверьте, был ли позже успешный вход
  - Оцените необходимость блокировки учётной записи или сдерживания
description_en: |
  This rule detects CheckPoint Authorize (login) failure events.
  This is a sign of brute force, credential stuffing or an unauthorized access attempt.
  Legitimate cases: user password typo, expired credentials, MFA issues.
  SOC triage steps:
  - Identify the user account and login type
  - Check the source IP geo-location and reputation
  - Analyze the time pattern of the login attempts
  - Check whether a successful login followed later
  - Assess the need for account lockout or containment
type: esql
params: '{}'
schedule_interval: 10m
index:
- filebeat-checkpoint-*
query_language: esql
query: |
  FROM filebeat-checkpoint-*
  | WHERE @timestamp >= NOW() - 45 minutes
  | WHERE checkpoint.fw_action == "Authorize"
  | WHERE checkpoint.auth_status == "Failure" OR event.outcome == "failure"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      dst_ips = VALUES(destination.ip),
      auth_methods = VALUES(checkpoint.auth_method),
      reject_categories = VALUES(checkpoint.reject_category),
      reject_reasons = VALUES(checkpoint.reject_id)
    BY agent_id, source.ip, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE event_count >= 10
  | KEEP bucket, source.ip, event_count, users, dst_ips, auth_methods, reject_categories, reject_reasons
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.credential-access
- attack.t1110
- checkpoint
- authentication-failure
severity: high
risk_score: 70
references:
- "https://attack.mitre.org/techniques/T1110/"
nist: ["AC-7", "IA-2"]
pci_dss: ["8.2.4", "10.2.4"]
gdpr: ["32.2"]
mitre_attack:
  TA0006:
    T1110: []