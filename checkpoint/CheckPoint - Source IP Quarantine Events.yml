rule_id: 05b0e564-aadf-4205-941d-e35879bf57fe
name_uz: "CheckPoint - Source IP karantin hodisalari"
name_ru: "CheckPoint - События помещения source IP в карантин"
name_en: "CheckPoint - Source IP Quarantine Events"
description_uz: |
  Ushbu qoida CheckPoint tomonidan quarantine qilingan source IP'larni monitoring qiladi.
  Quarantine action malicious behavior tufayli qo'llaniladi va jiddiy xavf belgisi.
  Qonuniy holatlar: compromised host, infected endpoint, policy violation.
  SOC triage bosqichlari:
  - Quarantine reason'ni aniqlang
  - Source IP owner va device'ni identifikatsiya qiling
  - Qaysi attack yoki infection trigger qilganini tekshiring
  - Host isolation va remediation zarurligini baholang
  - IOC'lar va related artifacts'ni to'plang
  - Incident response jarayonini aktivlashtiring
description_ru: |
  Это правило отслеживает source IP, помещённые CheckPoint в карантин.
  Действие quarantine применяется из-за вредоносного поведения и является признаком серьёзной угрозы.
  Легитимные ситуации: скомпрометированный хост, заражённая рабочая станция, нарушение политики.
  Этапы SOC-триажа:
  - Определите причину помещения в карантин
  - Идентифицируйте владельца и устройство source IP
  - Проверьте, какая атака или заражение послужило триггером
  - Оцените необходимость изоляции хоста и мер по устранению
  - Соберите IOC и связанные артефакты
  - Активируйте процесс реагирования на инциденты
description_en: |
  This rule monitors source IPs quarantined by CheckPoint.
  The quarantine action is applied due to malicious behavior and is a sign of serious risk.
  Legitimate cases: compromised host, infected endpoint, policy violation.
  SOC triage steps:
  - Determine the quarantine reason
  - Identify the source IP owner and device
  - Check which attack or infection triggered it
  - Assess the need for host isolation and remediation
  - Collect IOCs and related artifacts
  - Activate the incident response process
type: esql
params: '{}'
schedule_interval: 5m
index:
- filebeat-checkpoint-*
query_language: esql
query: |
  FROM filebeat-checkpoint-*
  | WHERE @timestamp >= NOW() - 30 minutes
  | WHERE checkpoint.fw_action == "Quarantine"
  | STATS
      event_count = COUNT(*),
      dst_ips = VALUES(destination.ip),
      attacks = VALUES(checkpoint.attack),
      attack_info = VALUES(checkpoint.attack_info),
      protection_names = VALUES(checkpoint.protection_name),
      verdict = VALUES(checkpoint.verdict)
    BY agent_id, source.ip, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP bucket, source.ip, event_count, dst_ips, attacks, attack_info, protection_names, verdict
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
- checkpoint
- quarantine
- malware
- host-isolation
severity: critical
risk_score: 90
references: []
nist: ["IR-4", "SI-4"]
pci_dss: ["5.2", "11.4"]
gdpr: ["35.7.d"]
mitre_attack: {}