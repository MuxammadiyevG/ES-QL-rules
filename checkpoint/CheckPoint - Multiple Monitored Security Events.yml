rule_id: 234a7626-1db6-4001-bf98-62e8bf4e0628
name_uz: "CheckPoint - Bir nechta monitored xavfsizlik hodisasi"
name_ru: "CheckPoint - Множественные отслеживаемые события безопасности"
name_en: "CheckPoint - Multiple Monitored Security Events"
description_uz: |
  Ushbu qoida CheckPoint tomonidan monitored (but not blocked) security event'larni aniqlaydi.
  Monitored action detection mode'da ishlashni yoki policy gap'ni ko'rsatishi mumkin.
  Qonuniy holatlar: policy tuning, baseline establishment, detection validation.
  SOC triage bosqichlari:
  - Nima uchun block qilinmaganini aniqlang (policy configuration)
  - Monitored event'lar orasida actual threat bormi tekshiring
  - Attack pattern va frequency'ni tahlil qiling
  - Policy adjustment zarurligini baholang
  - False positive yoki legitimate traffic ekanligini tekshiring
description_ru: |
  Это правило выявляет события безопасности, которые CheckPoint отслеживал (monitored), но не блокировал.
  Действие monitored может указывать на работу в режиме обнаружения или на пробел в политике.
  Легитимные ситуации: настройка политики, формирование базовой линии, проверка детектирования.
  Этапы SOC-триажа:
  - Определите, почему событие не было заблокировано (конфигурация политики)
  - Проверьте, есть ли среди отслеженных событий реальная угроза
  - Проанализируйте шаблон и частоту атаки
  - Оцените необходимость корректировки политики
  - Проверьте, является ли это ложным срабатыванием или легитимным трафиком
description_en: |
  This rule detects security events that were monitored (but not blocked) by CheckPoint.
  The monitored action may indicate operation in detection mode or a policy gap.
  Legitimate cases: policy tuning, baseline establishment, detection validation.
  SOC triage steps:
  - Determine why it was not blocked (policy configuration)
  - Check whether there is an actual threat among the monitored events
  - Analyze the attack pattern and frequency
  - Assess the need for policy adjustment
  - Check whether it is a false positive or legitimate traffic
type: esql
params: '{}'
schedule_interval: 15m
index:
- filebeat-checkpoint-*
query_language: esql
query: |
  FROM filebeat-checkpoint-*
  | WHERE @timestamp >= NOW() - 1 hour
  | WHERE checkpoint.fw_action == "Monitored"
  | STATS
      event_count = COUNT(*),
      dst_ips = VALUES(destination.ip),
      attacks = VALUES(checkpoint.attack),
      protection_names = VALUES(checkpoint.protection_name),
      severities = VALUES(event.severity),
      rules = VALUES(rule.name)
    BY agent_id, source.ip, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 15
  | KEEP bucket, source.ip, event_count, dst_ips, attacks, protection_names, severities, rules
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.discovery
- attack.t1046
- checkpoint
- security-monitoring
- policy-gap
severity: medium
risk_score: 55
references:
- "https://attack.mitre.org/techniques/T1046/"
nist: ["SI-4", "CA-7"]
pci_dss: ["10.6.1", "11.4"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0007:
    T1046: []