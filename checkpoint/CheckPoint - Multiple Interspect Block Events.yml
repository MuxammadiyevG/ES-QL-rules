rule_id: c34ad240-e64a-42e9-973a-50a92f1e053c
name_uz: "CheckPoint - Bir nechta Interspect block hodisasi"
name_ru: "CheckPoint - Множественные события блокировки Interspect"
name_en: "CheckPoint - Multiple Interspect Block Events"
description_uz: |
  Ushbu qoida CheckPoint Interspect tomonidan bir xil manbadan ko'p block hodisalarini aniqlaydi.
  Bu IPS/IDS detection yoki malicious activity belgisi.
  Qonuniy holatlar: false positive, legitimate traffic misclassified.
  SOC triage bosqichlari:
  - Block qilingan attack signature'larni tekshiring
  - Protection name va type'ni aniqlang
  - Source reputation va history'sini tekshiring
  - Attack severity va impact'ini baholang
  - Blocking effectiveness'ni validate qiling
description_ru: |
  Это правило выявляет множественные события блокировки от одного источника, зафиксированные CheckPoint Interspect.
  Это признак срабатывания IPS/IDS или вредоносной активности.
  Легитимные ситуации: ложное срабатывание, легитимный трафик классифицирован неверно.
  Этапы SOC-триажа:
  - Проверьте заблокированные сигнатуры атак
  - Определите имя и тип защиты (protection)
  - Проверьте репутацию и историю источника
  - Оцените критичность и воздействие атаки
  - Подтвердите эффективность блокировки
description_en: |
  This rule detects multiple block events from the same source recorded by CheckPoint Interspect.
  This is a sign of IPS/IDS detection or malicious activity.
  Legitimate cases: false positive, legitimate traffic misclassified.
  SOC triage steps:
  - Check the blocked attack signatures
  - Determine the protection name and type
  - Check the source reputation and history
  - Assess the attack severity and impact
  - Validate the blocking effectiveness
type: esql
params: '{}'
schedule_interval: 10m
index:
- filebeat-checkpoint-*
query_language: esql
query: |
  FROM filebeat-checkpoint-*
  | WHERE @timestamp >= NOW() - 45 minutes
  | WHERE checkpoint.fw_action == "Block"
  | STATS
      event_count = COUNT(*),
      dst_ips = VALUES(destination.ip),
      attacks = VALUES(checkpoint.attack),
      protection_names = VALUES(checkpoint.protection_name),
      protection_types = VALUES(checkpoint.protection_type),
      severities = VALUES(event.severity)
    BY agent_id, source.ip, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE event_count >= 10
  | KEEP bucket, source.ip, event_count, dst_ips, attacks, protection_names, protection_types, severities
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.discovery
- attack.t1046
- checkpoint
- ips
- intrusion-detection
severity: high
risk_score: 75
references:
- "https://attack.mitre.org/techniques/T1046/"
nist: ["SI-4", "DE.CM-1"]
pci_dss: ["11.4"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0007:
    T1046: []