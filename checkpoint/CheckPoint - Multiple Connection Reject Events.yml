rule_id: 01b63d35-2658-44c2-99e1-9c9d75878d02
name_uz: "CheckPoint - Ko'p sonli ulanish reject hodisalari"
name_ru: "CheckPoint - множественные события reject соединений"
name_en: "CheckPoint - Multiple Connection Reject Events"
description_uz: |
  Ushbu qoida CheckPoint firewall'da bir xil manbadan ko'p reject hodisalarini aniqlaydi.
  Reject action ICMP destination-unreachable xabarini yuboradi va bu non-standard communication belgisi bo'lishi mumkin (T1095).
  Qonuniy holatlar: tarmoq konfiguratsiya muammolari, service discovery, legitimate connection attempts.
  SOC triage bosqichlari:
  - Manba va destination IP'larni identifikatsiya qiling
  - Reject qilingan port va service'larni tahlil qiling
  - Pattern va frequency'ni tekshiring
  - Network policy bilan mos kelishini tekshiring
  - Scanning yoki reconnaissance faoliyat belgisi bormi aniqlang
description_ru: |
  Это правило выявляет множественные события reject с одного и того же источника на CheckPoint firewall.
  Действие reject отправляет сообщение ICMP destination-unreachable, и это может быть признаком non-standard communication (T1095).
  Легитимные случаи: проблемы сетевой конфигурации, service discovery, легитимные попытки соединения.
  Этапы SOC-триажа:
  - Идентифицируйте исходные и destination IP
  - Проанализируйте отклонённые порты и сервисы
  - Проверьте pattern и частоту
  - Проверьте соответствие сетевой политике
  - Определите, есть ли признаки сканирования или разведывательной активности
description_en: |
  This rule detects multiple reject events from the same source on the CheckPoint firewall.
  The reject action sends an ICMP destination-unreachable message, and this may be a sign of non-standard communication (T1095).
  Legitimate cases: network configuration issues, service discovery, legitimate connection attempts.
  SOC triage steps:
  - Identify the source and destination IPs
  - Analyze the rejected ports and services
  - Check the pattern and frequency
  - Check whether it complies with the network policy
  - Determine whether there are signs of scanning or reconnaissance activity
type: esql
params: '{}'
schedule_interval: 10m
index:
- filebeat-checkpoint-*
query_language: esql
query: |
  FROM filebeat-checkpoint-*
  | WHERE @timestamp >= NOW() - 45 minutes
  | WHERE checkpoint.fw_action == "Reject"
  | STATS
      event_count = COUNT(*),
      dst_ips = VALUES(destination.ip),
      dst_ports = VALUES(destination.port),
      protocols = VALUES(network.protocol),
      rules = VALUES(rule.name)
    BY agent_id, source.ip, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE event_count >= 15
  | KEEP bucket, source.ip, event_count, dst_ips, dst_ports, protocols, rules
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.discovery
- attack.t1095
- checkpoint
- network-denial
severity: high
risk_score: 73
references:
- "https://attack.mitre.org/techniques/T1095/"
nist: ["SC-7", "SI-4"]
pci_dss: ["1.2.1", "10.6.1"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0011:
    T1095: []