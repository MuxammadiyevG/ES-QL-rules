rule_id: e0f903ff-0f72-4330-bb3b-71b38052b6f0
name_uz: "CheckPoint - Ko'p muvaffaqiyatsiz urinishdan keyin muvaffaqiyatli login (Brute Force Success)"
name_ru: "CheckPoint - Успешный вход после множества неудачных попыток (Brute Force Success)"
name_en: "CheckPoint - Successful Login After Multiple Failures (Brute Force Success)"
description_uz: |
  Ushbu qoida bir xil source/user uchun qisqa vaqt ichida ko'p sonli authentication
  failure'dan keyin muvaffaqiyatli login bo'lganligini aniqlaydi.
  Bu brute force yoki credential stuffing hujumi muvaffaqiyatli yakunlangani belgisi
  (T1110 - Brute Force, T1078 - Valid Accounts).
  Qonuniy holatlar: foydalanuvchi parolni bir necha marta noto'g'ri kiritib, keyin to'g'ri kiritgan.
  SOC triage bosqichlari:
  - Source IP geo-location va reputation'ini tekshiring
  - Muvaffaqiyatli login bo'lgan user account'ni identifikatsiya qiling
  - Failure va success vaqt oralig'ini tahlil qiling (avtomatlashtirilgan hujum?)
  - Login type va auth method'ni tekshiring (VPN, admin, portal)
  - Account compromise va credential reset zarurligini baholang
  - Keyingi suspicious faoliyatni (lateral movement) qidiring
description_ru: |
  Это правило выявляет успешный вход после большого числа неудачных попыток
  аутентификации для одного и того же source/user за короткий промежуток времени.
  Это признак успешно завершённого перебора паролей (brute force) или credential stuffing
  (T1110 - Brute Force, T1078 - Valid Accounts).
  Легитимные ситуации: пользователь несколько раз ввёл пароль неверно, а затем ввёл его правильно.
  Этапы SOC-триажа:
  - Проверьте геолокацию и репутацию source IP
  - Идентифицируйте учётную запись, под которой выполнен успешный вход
  - Проанализируйте интервал времени между неудачами и успехом (автоматизированная атака?)
  - Проверьте тип входа и метод аутентификации (VPN, admin, портал)
  - Оцените компрометацию учётной записи и необходимость сброса учётных данных
  - Найдите последующую подозрительную активность (горизонтальное перемещение)
description_en: |
  This rule detects a successful login after a large number of authentication
  failures for the same source/user within a short time window.
  This is a sign of a successfully completed brute force or credential stuffing attack
  (T1110 - Brute Force, T1078 - Valid Accounts).
  Legitimate cases: the user mistyped the password several times and then entered it correctly.
  SOC triage steps:
  - Check the source IP geo-location and reputation
  - Identify the user account that logged in successfully
  - Analyze the time gap between the failures and the success (automated attack?)
  - Check the login type and auth method (VPN, admin, portal)
  - Assess account compromise and the need for a credential reset
  - Look for subsequent suspicious activity (lateral movement)
type: esql
params: '{}'
schedule_interval: 10m
index:
- filebeat-checkpoint-*
query_language: esql
query: |
  FROM filebeat-checkpoint-*
  | WHERE @timestamp >= NOW() - 45 minutes
  | WHERE checkpoint.fw_action == "Authorize"
  | EVAL is_failure = CASE(checkpoint.auth_status == "Failure" OR event.outcome == "failure", 1, 0)
  | EVAL is_success = CASE(checkpoint.auth_status == "Successful" OR event.outcome == "success", 1, 0)
  | STATS
      fail_count    = SUM(is_failure),
      success_count = SUM(is_success),
      event_count   = COUNT(*),
      users         = VALUES(user.name),
      dst_ips       = VALUES(destination.ip),
      auth_methods  = VALUES(checkpoint.auth_method),
      first_seen    = MIN(@timestamp),
      last_seen     = MAX(@timestamp)
    BY agent_id, source.ip, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE fail_count >= 5 AND success_count >= 1
  | KEEP bucket, source.ip, fail_count, success_count, event_count, users, dst_ips, auth_methods, first_seen, last_seen
  | SORT fail_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.credential-access
- attack.t1110
- attack.initial-access
- attack.t1078
- checkpoint
- brute-force
- authentication
severity: high
risk_score: 82
references:
- "https://attack.mitre.org/techniques/T1110/"
- "https://attack.mitre.org/techniques/T1078/"
nist: ["AC-7", "IA-2", "AU-6"]
pci_dss: ["8.2.4", "10.2.4", "10.2.5"]
gdpr: ["32.2", "32.1.b"]
mitre_attack:
  TA0006:
    T1110: []
  TA0001:
    T1078: []
