rule_id: c89a2f19-75eb-469c-8f11-fd1fab0a467f
name_uz: "CheckPoint - Bir nechta email tahdidi aniqlandi"
name_ru: "CheckPoint - Обнаружено несколько email-угроз"
name_en: "CheckPoint - Multiple Email Threats Detected"
description_uz: |
  Ushbu qoida CheckPoint email security blade tomonidan aniqlangan ko'p threat'larni monitoring qiladi.
  Email vector orqali malware, phishing yoki spam attack'lar.
  Qonuniy holatlar: false positive, legitimate attachments misclassified.
  SOC triage bosqichlari:
  - Email sender va recipient'larni identifikatsiya qiling
  - Malware type, hash va verdict'ni tekshiring
  - Email subject va content'ni tahlil qiling
  - Related IOC'lar va campaign indicator'larini qidiring
  - User awareness va remediation action'lar zarurligini baholang
description_ru: |
  Это правило отслеживает множественные угрозы, обнаруженные модулем CheckPoint email security blade.
  Атаки через почтовый вектор: вредоносное ПО, фишинг или спам.
  Легитимные ситуации: ложное срабатывание, легитимные вложения классифицированы неверно.
  Этапы SOC-триажа:
  - Идентифицируйте отправителя и получателей письма
  - Проверьте тип вредоносного ПО, хеш и вердикт
  - Проанализируйте тему и содержимое письма
  - Найдите связанные IOC и индикаторы кампании
  - Оцените необходимость обучения пользователей и мер по устранению
description_en: |
  This rule monitors multiple threats detected by the CheckPoint email security blade.
  Malware, phishing or spam attacks delivered through the email vector.
  Legitimate cases: false positive, legitimate attachments misclassified.
  SOC triage steps:
  - Identify the email sender and recipients
  - Check the malware type, hash and verdict
  - Analyze the email subject and content
  - Search for related IOCs and campaign indicators
  - Assess the need for user awareness and remediation actions
type: esql
params: '{}'
schedule_interval: 15m
index:
- filebeat-checkpoint-*
query_language: esql
query: |
  FROM filebeat-checkpoint-*
  | WHERE @timestamp >= NOW() - 1 hour
  | WHERE checkpoint.email_control IS NOT NULL
  | WHERE checkpoint.verdict == "Malicious" OR checkpoint.email_spam_category == "phishing"
  | STATS
      event_count = COUNT(*),
      senders = VALUES(email.from.address),
      recipients = VALUES(email.to.address),
      subjects = VALUES(email.subject),
      verdicts = VALUES(checkpoint.verdict),
      file_names = VALUES(file.name),
      file_hashes = VALUES(file.hash.md5)
    BY agent_id, bucket = DATE_TRUNC(15 minutes, @timestamp)
  | WHERE event_count >= 3
  | KEEP bucket, event_count, senders, recipients, subjects, verdicts, file_names, file_hashes
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.initial-access
- attack.t1566
- checkpoint
- email-security
- phishing
- malware
severity: high
risk_score: 80
references:
- "https://attack.mitre.org/techniques/T1566/"
nist: ["SI-3", "SI-8"]
pci_dss: ["5.1", "5.2"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0001:
    T1566: []