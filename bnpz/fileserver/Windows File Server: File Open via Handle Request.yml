rule_id: a34dbc9d-6c51-4d87-9efe-67ef5f6794de
name: "Windows File Server: File Open via Handle Request"
description: |
  Ushbu qoida Windows File Server’da fayl ochish/open request hodisasini
  aniqlaydi. 4656 hodisasi object handle so‘ralganini bildiradi. Fayl haqiqatan
  ishlatilganini 4663 bilan qo‘shimcha tekshirish mumkin.
type: esql
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
    | WHERE @timestamp >= NOW() - 5 minute
    | WHERE winlog.channel == "Security"
      AND event.code == "4656"
      AND winlog.event_data.ObjectType == "File"
    | EVAL
        file_path = winlog.event_data.ObjectName,
        user_account = CONCAT(winlog.event_data.SubjectDomainName, "\\", winlog.event_data.SubjectUserName),
        process_name = winlog.event_data.ProcessName,
        access_mask = winlog.event_data.AccessMask,
        access_list = winlog.event_data.AccessList,
        handle_id = winlog.event_data.HandleId,
        host_name = host.name
    | WHERE file_path IS NOT NULL
    | WHERE NOT file_path LIKE "C:\\\\Windows\\\\*"
    | WHERE NOT file_path LIKE "C:\\\\Program Files\\\\*"
    | WHERE NOT file_path LIKE "C:\\\\Program Files (x86)\\\\*"
    | KEEP
        @timestamp,
        agent_id,
        host_name,
        user_account,
        file_path,
        process_name,
        access_mask,
        access_list,
        handle_id,
        event.code,
        event.action

enabled: true
tags:
  - windows
  - file-server
  - file-open
  - handle-request
severity: low
risk_score: 20
references:
  - "https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4656"
nist: ["AC-2", "AU-2", "AU-6", "AU-12"]
pci_dss: ["10.2.1", "10.2.2", "10.2.6"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0009:
    T1039: []
