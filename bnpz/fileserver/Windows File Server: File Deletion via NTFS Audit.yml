rule_id: 3b1aba27-788a-457b-be00-844292f214a7
name: "Windows File Server: File Deletion via NTFS Audit"
description: |
  Ushbu qoida Windows File Server share ostidagi fayl o‘chirilganini aniqlaydi.
  Fayl o‘chirish uchun 5145 access check foydali bo‘lsa ham, aniqroq signal
  4663 DELETE access yoki 4660 object deleted hodisasidan olinadi.
type: esql
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
    | WHERE @timestamp >= NOW() - 5 minute
    | WHERE winlog.channel == "Security"
      AND event.code IN ("4663", "4660")
      AND (
        winlog.event_data.ObjectType == "File"
        OR event.code == "4660"
      )
      AND (
        event.code == "4660"
        OR winlog.event_data.AccessList LIKE "*DELETE*"
        OR winlog.event_data.AccessList LIKE "*Delete*"
        OR winlog.event_data.AccessMask == "0x10000"
      )
    | EVAL
        file_path = winlog.event_data.ObjectName,
        user_account = CONCAT(winlog.event_data.SubjectDomainName, "\\", winlog.event_data.SubjectUserName),
        process_name = winlog.event_data.ProcessName,
        access_mask = winlog.event_data.AccessMask,
        access_list = winlog.event_data.AccessList,
        handle_id = winlog.event_data.HandleId,
        host_name = host.name
    | WHERE file_path IS NOT NULL
    | WHERE NOT file_path LIKE "C:\\\\Windows\\\\*"
    | WHERE NOT file_path LIKE "C:\\\\Program Files\\\\*"
    | WHERE NOT file_path LIKE "C:\\\\Program Files (x86)\\\\*"
    | KEEP
        @timestamp,
        agent_id,
        host_name,
        user_account,
        file_path,
        process_name,
        access_mask,
        access_list,
        handle_id,
        event.code,
        event.action

enabled: true
tags:
  - windows
  - file-server
  - ntfs
  - file-delete
  - object-access
severity: medium
risk_score: 50
references:
  - "https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4663"
  - "https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4660"
nist: ["AC-2", "AU-2", "AU-6", "AU-12", "SI-4"]
pci_dss: ["10.2.1", "10.2.2", "10.2.6"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0040:
    T1485: []
