rule_id: fec0e79b-19db-459f-b8ed-2c9a94f4d48d
name: "Windows File Server: Possible File Rename"
description: |
  Ushbu qoida Windows File Server share ichida fayl nomi o‘zgartirilgan
  bo‘lishi mumkin bo‘lgan holatlarni aniqlaydi. Windows Security log rename
  amalini har doim alohida rename sifatida bermaydi; odatda qisqa vaqt ichida
  delete/delete-request va create/write ketma-ketligi ko‘rinadi.
type: esql
params: "{}"
schedule_interval: 5m
index:
  - logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
    | WHERE @timestamp >= NOW() - 5 minute
    | WHERE winlog.channel == "Security"
      AND event.code IN ("5145", "4663", "4660")
    | EVAL
        raw_path = COALESCE(winlog.event_data.RelativeTargetName, winlog.event_data.ObjectName),
        user_account = CONCAT(winlog.event_data.SubjectDomainName, "\\", winlog.event_data.SubjectUserName),
        action_type = CASE(
          event.code == "4660", "delete_old_name",
          winlog.event_data.AccessMask == "0x10000", "delete_old_name",
          winlog.event_data.AccessList LIKE "*DELETE*", "delete_old_name",
          winlog.event_data.AccessList LIKE "*WriteData*", "write_new_name",
          winlog.event_data.AccessList LIKE "*AddFile*", "write_new_name",
          winlog.event_data.AccessList LIKE "*AppendData*", "write_new_name",
          "other"
        )
    | WHERE action_type != "other"
    | WHERE raw_path IS NOT NULL
    | WHERE NOT winlog.event_data.ShareName RLIKE ".*SYSVOL$"
    | WHERE NOT winlog.event_data.ShareName RLIKE ".*NETLOGON$"
    | WHERE NOT winlog.event_data.ShareName RLIKE ".*IPC\\$$"
    | WHERE NOT winlog.event_data.SubjectUserName LIKE "*$"
    | STATS
        event_count = COUNT(),
        actions = VALUES(action_type),
        paths = VALUES(raw_path),
        share_names = VALUES(winlog.event_data.ShareName),
        src_ips = VALUES(winlog.event_data.IpAddress)
      BY host.name, user_account, BUCKET(@timestamp, 2 minutes)
    | WHERE event_count >= 2
    | KEEP
        host.name,
        user_account,
        event_count,
        actions,
        paths,
        share_names,
        src_ips

enabled: true
tags:
  - windows
  - file-server
  - smb
  - file-rename
  - correlation
severity: medium
risk_score: 45
references:
  - "https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-5145"
  - "https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4663"
nist: ["AC-2", "AU-2", "AU-6", "AU-12"]
pci_dss: ["10.2.1", "10.2.2", "10.2.6"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1070: ["T1070.004"]
