rule_id: a8504f7a-83f9-4d3f-b4e1-4c36f45b6f22
name: "Resource: Host Resource Pressure Detected"
description: |
  Ushbu qoida Linux yoki Windows hostda umumiy resource pressure holatini
  aniqlaydi. Agar CPU 80% dan yuqori, memory 80% dan yuqori yoki disk
  ishlatilishi 90% dan yuqori bo‘lsa alert hosil qiladi.

  Metricbeat orqali CPU, memory va filesystem metriclari tahlil qilinadi.
  Disk uchun temporary va virtual filesystem turlari false positive
  kamaytirish maqsadida chiqarib tashlanadi.

type: esql
params: "{}"
schedule_interval: 1m

index:
  - metricbeat-*

query_language: esql

query: |
  FROM metrics-updive*
      | WHERE @timestamp >= NOW() - 5 minute
      | WHERE system.cpu.total.norm.pct IS NOT NULL
          OR system.memory.actual.used.pct IS NOT NULL
          OR system.filesystem.used.bytes IS NOT NULL
      | EVAL
          host_name = COALESCE(host.name, host.hostname),
          disk_used_pct = CASE(
            system.filesystem.used.bytes IS NOT NULL
              AND system.filesystem.total IS NOT NULL
              AND system.filesystem.total > 0,
            TO_DOUBLE(system.filesystem.used.bytes) / TO_DOUBLE(system.filesystem.total),
            NULL
          )
      | STATS
          avg_cpu_pct = AVG(system.cpu.total.norm.pct),
          max_cpu_pct = MAX(system.cpu.total.norm.pct),
          avg_memory_pct = AVG(system.memory.actual.used.pct),
          max_memory_pct = MAX(system.memory.actual.used.pct),
          max_disk_used_pct = MAX(disk_used_pct),
          disk_mounts = VALUES(system.filesystem.mount_point),
          disk_devices = VALUES(system.filesystem.device_name),
          filesystem_types = VALUES(system.filesystem.type),
          event_count = COUNT(),
          first_seen = MIN(@timestamp),
          last_seen = MAX(@timestamp)
        BY host_name
      | WHERE avg_cpu_pct >= 0.80
          OR avg_memory_pct >= 0.80
          OR max_disk_used_pct >= 0.90
      | EVAL
          avg_cpu_percent = ROUND(avg_cpu_pct * 100, 2),
          max_cpu_percent = ROUND(max_cpu_pct * 100, 2),
          avg_memory_percent = ROUND(avg_memory_pct * 100, 2),
          max_memory_percent = ROUND(max_memory_pct * 100, 2),
          max_disk_used_percent = ROUND(max_disk_used_pct * 100, 2),
          detection_reason = CASE(
            avg_cpu_pct >= 0.80 AND avg_memory_pct >= 0.80 AND max_disk_used_pct >= 0.90,
              "CPU, memory and disk thresholds exceeded",
            avg_cpu_pct >= 0.80 AND avg_memory_pct >= 0.80,
              "CPU and memory thresholds exceeded",
            avg_cpu_pct >= 0.80 AND max_disk_used_pct >= 0.90,
              "CPU and disk thresholds exceeded",
            avg_memory_pct >= 0.80 AND max_disk_used_pct >= 0.90,
              "Memory and disk thresholds exceeded",
            avg_cpu_pct >= 0.80,
              "CPU utilization is above 80 percent threshold",
            avg_memory_pct >= 0.80,
              "Memory utilization is above 80 percent threshold",
            max_disk_used_pct >= 0.90,
              "Disk usage is above 90 percent threshold",
            "Host resource pressure detected"
          )
      | KEEP
          host_name,
          detection_reason,
          avg_cpu_percent,
          max_cpu_percent,
          avg_memory_percent,
          max_memory_percent,
          max_disk_used_percent,
          disk_mounts,
          disk_devices,
          filesystem_types,
          event_count,
          first_seen,
          last_seen
      | SORT max_disk_used_percent DESC

enabled: true

tags:
  - resource
  - performance
  - cpu
  - memory
  - disk
  - filesystem
  - high-utilization
  - low-disk-space
  - linux
  - windows
  - metricbeat
  - availability

severity: high
risk_score: 80

references:
  - "https://www.elastic.co/guide/en/beats/metricbeat/current/metricbeat-module-system.html"

nist: ["AU-6", "SI-4", "CP-10", "SC-5"]

pci_dss: ["10.2.1", "10.4.1", "12.10.5"]

gdpr: ["32.1.b", "32.1.c", "32.1.d"]

mitre_attack:
  TA0040:
    T1499: [] # Endpoint Denial of Service
