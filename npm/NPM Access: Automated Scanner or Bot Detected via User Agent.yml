rule_id: 76d3c33c-1ab0-4241-a93c-c8358cd846a1
name_uz: "NPM Access: User Agent orqali avtomatlashtirilgan skaner yoki bot aniqlandi"
name_ru: "NPM Access: обнаружен автоматизированный сканер или бот по User Agent"
name_en: "NPM Access: Automated Scanner or Bot Detected via User Agent"
description_uz: |
  Ushbu qoida taniqli web scanner, vulnerability scanner va bot user agentlarini
  aniqlaydi. sqlmap, nikto, nmap, masscan, nuclei, burpsuite, dirbuster kabi
  toollar.
  Qonuniy holatlar: ruxsat berilgan pentest.
  SOC triage bosqichlari:
  - event.original — scanner qaysi URL larni tekshirmoqda.
  - Client IP — ruxsatli pentest IP si bilan solishtiring.
  - Skanerlangan endpoint lar nima — admin panel, login, API.
  - Noqonuniy bo'lsa: IP ni bloklang, IT xavfsizlik jamoasiga xabarlang.
description_ru: |
  Это правило обнаруживает user agent известных web-сканеров, сканеров уязвимостей
  и ботов. Такие инструменты, как sqlmap, nikto, nmap, masscan, nuclei, burpsuite,
  dirbuster.
  Легитимные случаи: разрешённый pentest.
  Этапы SOC-триажа:
  - event.original — какие URL проверяет сканер.
  - Client IP — сопоставьте с IP разрешённого pentest.
  - Какие endpoint сканируются — админ-панель, login, API.
  - Если несанкционированно: заблокируйте IP, уведомите команду ИТ-безопасности.
description_en: |
  This rule detects the user agents of well-known web scanners, vulnerability scanners
  and bots. Tools such as sqlmap, nikto, nmap, masscan, nuclei, burpsuite,
  dirbuster.
  Legitimate cases: an authorized pentest.
  SOC triage steps:
  - event.original — which URLs the scanner is probing.
  - Client IP — compare with the authorized pentest IP.
  - What endpoints are being scanned — admin panel, login, API.
  - If unauthorized: block the IP, notify the IT security team.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-npm.access-*
query_language: esql
query: |
  FROM logs-npm.access-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE TO_LOWER(event.original) RLIKE """.*(sqlmap|nikto|nmap|masscan|nuclei|burpsuite|burp\s+suite|dirbuster|dirb|gobuster|wfuzz|acunetix|nessus|openvas|w3af|skipfish|whatweb|httprint|zgrab|zmap|shodan|censys|python-requests\/|go-http-client|curl\/|wget\/|libwww-perl|java\/|scrapy|phantomjs|headless|zgrab|python-urllib|aiohttp|httpx|httpie).*"""
  | EVAL host_name = host.hostname
  | EVAL log_path  = log.file.path
  | STATS
      event_count = COUNT(*),
      log_paths   = VALUES(log.file.path),
      samples     = VALUES(event.original),
      last_seen   = MAX(@timestamp),
      first_seen  = MIN(@timestamp)
    BY host_name, log_path
  | KEEP
      host_name, log_path, event_count,
      log_paths, samples, last_seen, first_seen
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.reconnaissance
  - attack.t1595
  - attack.t1190
  - detection.threat-hunting
severity: medium
risk_score: 62
references:
  - "https://attack.mitre.org/techniques/T1595/"
  - "https://attack.mitre.org/techniques/T1190/"
nist: ["SI-4", "RA-5", "AU-12", "SC-7"]
pci_dss: ["6.6", "10.6.1", "11.3", "11.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0043:
    T1595: []
  TA0001:
    T1190: []