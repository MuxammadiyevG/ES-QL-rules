rule_id: 0f65f19b-74aa-4379-9665-faad3e9d9775
name_uz: "NPM Access: Nostandart HTTP Metodi Ishlatilgan"
name_ru: "NPM Access: использован нестандартный HTTP-метод"
name_en: "NPM Access: Non-Standard HTTP Method Used"
description_uz: |
  Ushbu qoida GET, POST, PUT, DELETE dan tashqari HTTP metodlarini aniqlaydi.
  TRACE, CONNECT, OPTIONS ko'p, PATCH g'ayrioddiy kontekstda ishlatilishi
  server konfiguratsiyasini aniqlash yoki bypass urinishi bo'lishi mumkin.
  CONNECT metodi proxy tunneling uchun ishlatiladi.
  SOC triage bosqichlari:
  - TRACE — Cross-Site Tracing (XST) hujumi uchun ishlatiladi.
  - CONNECT — proxy tunnel ochishga urinish.
  - Response status — 200 bo'lsa server metodni qabul qilgan.
  - Server konfiguratsiyasida kerak bo'lmagan metodlarni o'chiring.
description_ru: |
  Данное правило выявляет HTTP-методы, отличные от GET, POST, PUT, DELETE.
  Частое использование TRACE, CONNECT, OPTIONS либо PATCH в необычном контексте
  может быть разведкой конфигурации сервера или попыткой обхода.
  Метод CONNECT используется для proxy-туннелирования.
  Шаги SOC-триажа:
  - TRACE — используется для атаки Cross-Site Tracing (XST).
  - CONNECT — попытка открыть proxy-туннель.
  - Response status — если 200, сервер принял метод.
  - Отключите ненужные методы в конфигурации сервера.
description_en: |
  This rule detects HTTP methods other than GET, POST, PUT, DELETE.
  Frequent use of TRACE, CONNECT, OPTIONS, or PATCH in an unusual context,
  may be server configuration discovery or a bypass attempt.
  The CONNECT method is used for proxy tunneling.
  SOC triage steps:
  - TRACE — used for the Cross-Site Tracing (XST) attack.
  - CONNECT — an attempt to open a proxy tunnel.
  - Response status — if 200, the server accepted the method.
  - Disable the unnecessary methods in the server configuration.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-npm.access-*
query_language: esql
query: |
  FROM logs-npm.access-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE TO_LOWER(event.original) RLIKE """\[.*\] - \d{3} .* - (trace|connect|propfind|proppatch|mkcol|copy|move|lock|unlock|search|purge|debug) .*"""
  | EVAL host_name = host.hostname
  | EVAL log_path  = log.file.path
  | STATS
      event_count = COUNT(*),
      log_paths   = VALUES(log.file.path),
      samples     = VALUES(event.original),
      last_seen   = MAX(@timestamp),
      first_seen  = MIN(@timestamp)
    BY host_name, log_path
  | KEEP
      host_name, log_path, event_count,
      log_paths, samples, last_seen, first_seen
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.initial-access
  - attack.defense-evasion
  - attack.t1190
  - detection.threat-hunting
severity: medium
risk_score: 55
references:
  - "https://attack.mitre.org/techniques/T1190/"
  - "https://owasp.org/www-community/attacks/Cross_Site_Tracing"
nist: ["SI-3", "SI-4", "CM-7", "SA-11"]
pci_dss: ["6.3.1", "6.6", "10.6.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0001:
    T1190: []