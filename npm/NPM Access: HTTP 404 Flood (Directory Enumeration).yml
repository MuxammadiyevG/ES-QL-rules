rule_id: e356d546-0e9b-40a7-a613-5acab7c4ea9d
name_uz: "NPM Access: HTTP 404 oqimi (directory enumeration)"
name_ru: "NPM Access: поток HTTP 404 (directory enumeration)"
name_en: "NPM Access: HTTP 404 Flood (Directory Enumeration)"
description_uz: |
  Ushbu qoida qisqa vaqt ichida ko'p sonli 404 xatoliklarini aniqlaydi.
  Bu directory/file enumeration scanning belgisi — hujumchi mavjud
  endpoint larni aniqlashga urinmoqda.
  Qonuniy holatlar: noto'g'ri konfiguratsiyalangan dastur, eskirgan link.
  SOC triage bosqichlari:
  - event.original — qaysi URL lar skanerlanyapti.
  - Bitta Client IP dan kelayotgan bo'lsa — automated scanner.
  - Pattern — sequential path lar (admin1, admin2...) shubhali.
  - Client IP ni WAF da bloklang.
description_ru: |
  Это правило обнаруживает большое количество ошибок 404 за короткое время.
  Это признак directory/file enumeration scanning — атакующий пытается
  определить существующие endpoint.
  Легитимные случаи: неверно сконфигурированное приложение, устаревшая ссылка.
  Этапы SOC-триажа:
  - event.original — какие URL сканируются.
  - Если запросы идут с одного Client IP — это automated scanner.
  - Паттерн — последовательные пути (admin1, admin2...) подозрительны.
  - Заблокируйте Client IP на WAF.
description_en: |
  This rule detects a large number of 404 errors within a short time.
  This is a sign of directory/file enumeration scanning — the attacker is trying
  to identify existing endpoints.
  Legitimate cases: a misconfigured application, an outdated link.
  SOC triage steps:
  - event.original — which URLs are being scanned.
  - If the requests come from a single Client IP — automated scanner.
  - Pattern — sequential paths (admin1, admin2...) are suspicious.
  - Block the Client IP on the WAF.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-npm.access-*
query_language: esql
query: |
  FROM logs-npm.access-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.original RLIKE """\[.*\] - 404 .*"""
  | EVAL host_name = host.hostname
  | EVAL log_path  = log.file.path
  | STATS
      error_count = COUNT(*),
      log_paths   = VALUES(log.file.path),
      samples     = VALUES(event.original),
      last_seen   = MAX(@timestamp),
      first_seen  = MIN(@timestamp)
    BY host_name, log_path
  | WHERE error_count >= 5
  | KEEP
      host_name, log_path, error_count,
      log_paths, samples, last_seen, first_seen
  | SORT error_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.reconnaissance
  - attack.t1595.003
  - detection.threat-hunting
severity: medium
risk_score: 52
references:
  - "https://attack.mitre.org/techniques/T1595/003/"
nist: ["SI-4", "AU-12", "RA-5"]
pci_dss: ["6.6", "10.6.1", "11.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0043:
    T1595: ["T1595.003"]