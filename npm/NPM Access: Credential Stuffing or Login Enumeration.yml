rule_id: 3cb89eb0-6915-4ef9-85ca-a05e945272a5
name_uz: "NPM Access: credential stuffing yoki login enumeration"
name_ru: "NPM Access: credential stuffing или перебор логинов (login enumeration)"
name_en: "NPM Access: Credential Stuffing or Login Enumeration"
description_uz: |
  Ushbu qoida qisqa vaqt ichida login/auth endpoint'larga ko'p sonli 401/403
  (Unauthorized/Forbidden) javoblarini aniqlaydi. Bu credential stuffing,
  parol brute force yoki login enumeration belgisi (T1110 - Brute Force).
  /login, /signin, /auth, /wp-login, /admin kabi endpoint'larga takroriy
  muvaffaqiyatsiz urinishlar.
  Qonuniy holatlar: foydalanuvchi parolni unutgan, noto'g'ri konfiguratsiya.
  SOC triage bosqichlari:
  - event.original — qaysi login endpoint hujum ostida.
  - Client IP — bitta IP dan ko'p urinish bo'lsa avtomatlashtirilgan.
  - 200 javob ham bo'lsa — hujum muvaffaqiyatli bo'lgan bo'lishi mumkin.
  - Client IP ni WAF/firewall da bloklang, rate limiting yoqing.
description_ru: |
  Это правило обнаруживает большое количество ответов 401/403
  (Unauthorized/Forbidden) на login/auth endpoint'ы за короткое время. Это признак credential stuffing,
  перебора паролей (brute force) или login enumeration (T1110 - Brute Force).
  Повторяющиеся неудачные попытки к endpoint'ам вида
  /login, /signin, /auth, /wp-login, /admin.
  Легитимные случаи: пользователь забыл пароль, неверная конфигурация.
  Этапы SOC-триажа:
  - event.original — какой login endpoint находится под атакой.
  - Client IP — если много попыток с одного IP, это автоматизировано.
  - Если есть и ответ 200 — атака могла быть успешной.
  - Заблокируйте Client IP на WAF/firewall, включите rate limiting.
description_en: |
  This rule detects a large number of 401/403
  (Unauthorized/Forbidden) responses to login/auth endpoints within a short time. This is a sign of credential stuffing,
  password brute force or login enumeration (T1110 - Brute Force).
  Repeated failed attempts against endpoints such as
  /login, /signin, /auth, /wp-login, /admin.
  Legitimate cases: a user forgot their password, misconfiguration.
  SOC triage steps:
  - event.original — which login endpoint is under attack.
  - Client IP — if there are many attempts from a single IP, it is automated.
  - If there is also a 200 response — the attack may have been successful.
  - Block the Client IP on the WAF/firewall, enable rate limiting.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-npm.access-*
query_language: esql
query: |
  FROM logs-npm.access-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE TO_LOWER(event.original) RLIKE """.* - (401|403) .*"""
  | WHERE TO_LOWER(event.original) RLIKE """.*(/login|/signin|/sign-in|/auth|/oauth|/session|/wp-login|/wp-admin|/admin/login|/user/login|/account/login|/api/login|/api/auth|/token).*"""
  | EVAL host_name = host.hostname
  | EVAL log_path  = log.file.path
  | STATS
      fail_count  = COUNT(*),
      log_paths   = VALUES(log.file.path),
      samples     = VALUES(event.original),
      last_seen   = MAX(@timestamp),
      first_seen  = MIN(@timestamp)
    BY host_name, log_path
  | WHERE fail_count >= 10
  | KEEP
      host_name, log_path, fail_count,
      log_paths, samples, last_seen, first_seen
  | SORT fail_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.credential-access
  - attack.t1110
  - detection.threat-hunting
  - owasp.a07-identification-authentication-failures
severity: high
risk_score: 78
references:
  - "https://attack.mitre.org/techniques/T1110/"
nist: ["AC-7", "IA-2", "SI-4", "AU-12"]
pci_dss: ["8.2.4", "10.2.4", "6.6", "10.6.1"]
gdpr: ["32.1.b", "32.2"]
mitre_attack:
  TA0006:
    T1110: []
