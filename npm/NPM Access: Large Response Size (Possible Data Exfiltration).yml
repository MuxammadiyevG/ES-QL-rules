rule_id: 3482a28e-c33e-4080-9c26-3e63be4e896e
name_uz: "NPM Access: Katta Response Hajmi (Ma'lumot O'g'irlanishi Ehtimoli)"
name_ru: "NPM Access: большой размер ответа (возможная утечка данных)"
name_en: "NPM Access: Large Response Size (Possible Data Exfiltration)"
description_uz: |
  Ushbu qoida NPM access logida juda katta response hajmli so'rovlarni aniqlaydi.
  Logda ko'ringan format: [Length 38789] — bu response bayt hajmi.
  10MB dan katta response — ma'lumot o'g'irlash uchun potensial belgi.
  Qonuniy holatlar: fayl yuklab olish, katta hisobot generatsiyasi.
  SOC triage bosqichlari:
  - log.file.path — qaysi proxy host.
  - event.original — qaysi URL va Client IP.
  - Sent-to IP — qaysi backend serverdan kelgan.
  - Foydalanuvchi autentifikatsiyasini tekshiring.
description_ru: |
  Данное правило выявляет запросы с очень большим размером ответа в журнале NPM access.
  Формат, наблюдаемый в журнале: [Length 38789] — это размер ответа в байтах.
  Ответ больше 10MB — потенциальный признак кражи данных.
  Легитимные случаи: скачивание файлов, генерация больших отчётов.
  Шаги SOC-триажа:
  - log.file.path — какой proxy-хост.
  - event.original — какой URL и Client IP.
  - Sent-to IP — с какого backend-сервера пришёл ответ.
  - Проверьте аутентификацию пользователя.
description_en: |
  This rule detects requests with a very large response size in the NPM access log.
  Format seen in the log: [Length 38789] — this is the response size in bytes.
  A response larger than 10MB is a potential indicator of data exfiltration.
  Legitimate cases: file download, large report generation.
  SOC triage steps:
  - log.file.path — which proxy host.
  - event.original — which URL and Client IP.
  - Sent-to IP — which backend server it came from.
  - Verify the user's authentication.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-npm.access-*
query_language: esql
query: |
  FROM logs-npm.access-*
  | WHERE @timestamp >= NOW() - 600 seconds
  | WHERE event.original RLIKE """\[Length [0-9]{6,}\]"""
  | EVAL host_name = host.hostname
  | EVAL log_path  = log.file.path
  | STATS
      event_count = COUNT(*),
      log_paths   = VALUES(log.file.path),
      samples     = VALUES(event.original),
      last_seen   = MAX(@timestamp),
      first_seen  = MIN(@timestamp)
    BY host_name, log_path
  | KEEP
      host_name, log_path, event_count,
      log_paths, samples, last_seen, first_seen
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.exfiltration
  - attack.t1030
  - detection.threat-hunting
severity: medium
risk_score: 55
references:
  - "https://attack.mitre.org/techniques/T1030/"
nist: ["SI-4", "AC-4", "AU-12", "SC-7"]
pci_dss: ["3.4", "10.6.1", "11.4"]
gdpr: ["32.1.b", "32.1.c"]
mitre_attack:
  TA0010:
    T1030: []