rule_id: be6daf25-d927-40da-bc8c-dc2a479a772e
name_uz: "NPM Access: So'rov URL da SQL Injection Patterni"
name_ru: "NPM Access: паттерн SQL-инъекции в URL запроса"
name_en: "NPM Access: SQL Injection Pattern in Request URL"
description_uz: |
  Ushbu qoida HTTP request URL da SQL injection pattern larini aniqlaydi.
  UNION SELECT, OR 1=1, DROP TABLE, xp_cmdshell kabi klassik SQLi payloadlari.
  Qonuniy holatlar: penetration testing (ruxsat bilan).
  SOC triage bosqichlari:
  - event.original — to'liq request ni tekshiring.
  - Client IP — bir IP dan ko'p urinish automated scanner.
  - Response status — 200 bo'lsa SQLi muvaffaqiyatli bo'lgan bo'lishi mumkin.
  - Backend loglarini tekshiring — DB xatoliklari bormi.
  - Noqonuniy bo'lsa: Client IP ni bloklang, WAF rule qo'shing.
description_ru: |
  Данное правило выявляет паттерны SQL-инъекции в URL HTTP-запроса.
  Классические SQLi-payload'ы вида UNION SELECT, OR 1=1, DROP TABLE, xp_cmdshell.
  Легитимные случаи: тестирование на проникновение (с разрешения).
  Шаги SOC-триажа:
  - event.original — проверьте полный запрос.
  - Client IP — много попыток с одного IP означает автоматический сканер.
  - Response status — если 200, SQLi могла быть успешной.
  - Проверьте логи backend — есть ли ошибки БД.
  - Если активность нелегитимна: заблокируйте Client IP, добавьте правило WAF.
description_en: |
  This rule detects SQL injection patterns in the HTTP request URL.
  Classic SQLi payloads such as UNION SELECT, OR 1=1, DROP TABLE, xp_cmdshell.
  Legitimate cases: penetration testing (with authorization).
  SOC triage steps:
  - event.original — check the full request.
  - Client IP — many attempts from one IP means an automated scanner.
  - Response status — if 200, the SQLi may have been successful.
  - Check the backend logs — are there DB errors.
  - If illegitimate: block the Client IP, add a WAF rule.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-npm.access-*
query_language: esql
query: |
  FROM logs-npm.access-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE TO_LOWER(event.original) RLIKE """.*(union\s+select|select\s+.*from|insert\s+into|drop\s+table|delete\s+from|update\s+.*set|exec\s*\(|xp_cmdshell|or\s+1\s*=\s*1|and\s+1\s*=\s*1|'\s+or\s+'|--\s*$|;\s*drop|information_schema|sleep\s*\(|benchmark\s*\().*"""
  | EVAL host_name = host.hostname
  | EVAL log_path  = log.file.path
  | STATS
      event_count = COUNT(*),
      log_paths   = VALUES(log.file.path),
      samples     = VALUES(event.original),
      last_seen   = MAX(@timestamp),
      first_seen  = MIN(@timestamp)
    BY host_name, log_path
  | KEEP
      host_name, log_path, event_count,
      log_paths, samples, last_seen, first_seen
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.initial-access
  - attack.t1190
  - detection.threat-hunting
  - owasp.a03-injection
severity: high
risk_score: 78
references:
  - "https://attack.mitre.org/techniques/T1190/"
  - "https://owasp.org/www-community/attacks/SQL_Injection"
nist: ["SI-3", "SI-4", "SA-11", "RA-5"]
pci_dss: ["6.3.1", "6.6", "10.6.1", "11.3"]
gdpr: ["32.1.b", "25.1"]
mitre_attack:
  TA0001:
    T1190: []