rule_id: 834cff1e-dbac-4310-8c70-d9135c0d44b2
name_uz: "NPM Access: URL da command injection patterni"
name_ru: "NPM Access: шаблон command injection в URL"
name_en: "NPM Access: Command Injection Pattern in URL"
description_uz: |
  Ushbu qoida HTTP request URL da OS command injection pattern larini aniqlaydi.
  ;ls, |whoami, `id`, $(cmd) kabi shell injection payloadlari.
  Qonuniy holatlar: yo'q.
  SOC triage bosqichlari:
  - Response status 200 bo'lsa — command execution bo'lgan bo'lishi mumkin.
  - Backend server loglarini tekshiring — g'ayriodatiy process ishga tushganmi.
  - Darhol: incident oching, backend serverni izolyatsiya qiling.
description_ru: |
  Это правило обнаруживает паттерны OS command injection в URL HTTP-запроса.
  Shell injection payload'ы вида ;ls, |whoami, `id`, $(cmd).
  Легитимные случаи: отсутствуют.
  Этапы SOC-триажа:
  - Если response status 200 — возможно, произошло command execution.
  - Проверьте логи backend-сервера — не был ли запущен необычный процесс.
  - Немедленно: откройте инцидент, изолируйте backend-сервер.
description_en: |
  This rule detects OS command injection patterns in the HTTP request URL.
  Shell injection payloads such as ;ls, |whoami, `id`, $(cmd).
  Legitimate cases: none.
  SOC triage steps:
  - If the response status is 200 — command execution may have occurred.
  - Check the backend server logs — whether an unusual process was started.
  - Immediately: open an incident, isolate the backend server.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-npm.access-*
query_language: esql
query: |
  FROM logs-npm.access-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE TO_LOWER(event.original) RLIKE """.*(;ls |;id |;whoami|;cat |;wget |;curl |\|ls |\|id |\|whoami|\|cat |\|wget |\|curl |%3bls|%3bid|%7cls|%7cid|/bin/sh|/bin/bash|cmd\.exe|powershell|%60id%60).*"""
  | EVAL host_name = host.hostname
  | EVAL log_path  = log.file.path
  | STATS
      event_count = COUNT(*),
      log_paths   = VALUES(log.file.path),
      samples     = VALUES(event.original),
      last_seen   = MAX(@timestamp),
      first_seen  = MIN(@timestamp)
    BY host_name, log_path
  | KEEP
      host_name, log_path, event_count,
      log_paths, samples, last_seen, first_seen
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.initial-access
  - attack.execution
  - attack.t1190
  - attack.t1059
  - detection.threat-hunting
  - owasp.a03-injection
severity: critical
risk_score: 90
references:
  - "https://attack.mitre.org/techniques/T1190/"
  - "https://attack.mitre.org/techniques/T1059/"
  - "https://owasp.org/www-community/attacks/Command_Injection"
nist: ["SI-3", "SI-4", "SA-11", "IR-4", "AC-3"]
pci_dss: ["6.3.1", "6.6", "10.6.1", "11.3", "12.10.1"]
gdpr: ["32.1.b", "25.1"]
mitre_attack:
  TA0001:
    T1190: []
  TA0002:
    T1059: []