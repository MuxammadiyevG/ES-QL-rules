rule_id: 97e95af6-162a-446f-af30-71ffecacae7f
name: "NPM Access: HTTP 5xx Server Error Flood"
description: |
  Ushbu qoida Nginx Proxy Manager access logida ko'p sonli 5xx server
  xatoliklarini aniqlaydi. 500, 502, 503, 504 xatoliklar backend servis
  ishlamayotganini yoki hujum ostida ekanligini bildirishi mumkin.
  Qonuniy holatlar: backend restart, deployment jarayoni.
  SOC triage bosqichlari:
  - log.file.path — qaysi proxy host xato bermoqda.
  - event.original — qaysi URL dan kelayotganini tekshiring.
  - Backend servis holati va resurslari (CPU, RAM) ni tekshiring.
  - Bitta Client IP dan kelayotgan bo'lsa — hujum bo'lishi mumkin.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-npm.access-*
query_language: esql
query: |
  FROM logs-npm.access-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.original RLIKE """\[.*\] - 5\d\d .*"""
  | EVAL log_path   = log.file.path
  | EVAL host_name  = host.hostname
  | EVAL raw        = event.original
  | STATS
      error_count  = COUNT(*),
      log_paths    = VALUES(log.file.path),
      samples      = VALUES(event.original),
      last_seen    = MAX(@timestamp),
      first_seen   = MIN(@timestamp)
    BY host_name, log_path
  | WHERE error_count >= 5
  | KEEP
      host_name, log_path, error_count,
      log_paths, samples, last_seen, first_seen
  | SORT error_count DESC
  | LIMIT 100
enabled: true
tags:
  - detection.availability
  - detection.threat-hunting
severity: medium
risk_score: 50
references:
  - "https://attack.mitre.org/techniques/T1499/"
nist: ["SI-4", "AU-12", "CP-10"]
pci_dss: ["10.6.1", "6.6", "12.10.1"]
gdpr: ["32.1.a"]
mitre_attack:
  TA0040:
    T1499: []