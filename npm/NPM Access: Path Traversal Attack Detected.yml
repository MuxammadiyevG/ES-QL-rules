rule_id: 79cfe185-6526-4022-a3d6-4e9606620cc2
name_uz: "NPM Access: Path Traversal Hujumi Aniqlandi"
name_ru: "NPM Access: обнаружена атака path traversal"
name_en: "NPM Access: Path Traversal Attack Detected"
description_uz: |
  Ushbu qoida HTTP request URL da path traversal pattern larini aniqlaydi.
  ../../../etc/passwd, ..%2F, %2e%2e kabi URL encoded traversal payloadlari.
  Qonuniy holatlar: yo'q, bu har doim shubhali.
  SOC triage bosqichlari:
  - event.original — to'liq URL ni tekshiring.
  - Response status 200 bo'lsa — fayl o'qilgan bo'lishi mumkin.
  - Client IP ni darhol bloklang.
  - Backend server fayllarini tekshiring.
description_ru: |
  Данное правило выявляет паттерны path traversal в URL HTTP-запроса.
  URL-кодированные traversal-payload'ы вида ../../../etc/passwd, ..%2F, %2e%2e.
  Легитимные случаи: отсутствуют, это всегда подозрительно.
  Шаги SOC-триажа:
  - event.original — проверьте полный URL.
  - Если response status 200 — файл мог быть прочитан.
  - Немедленно заблокируйте Client IP.
  - Проверьте файлы backend-сервера.
description_en: |
  This rule detects path traversal patterns in the HTTP request URL.
  URL-encoded traversal payloads such as ../../../etc/passwd, ..%2F, %2e%2e.
  Legitimate cases: none, this is always suspicious.
  SOC triage steps:
  - event.original — check the full URL.
  - If the response status is 200 — a file may have been read.
  - Block the Client IP immediately.
  - Check the backend server files.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-npm.access-*
query_language: esql
query: |
  FROM logs-npm.access-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE TO_LOWER(event.original) RLIKE """.*(\.\.\/|\.\.\\\\|%2e%2e%2f|%2e%2e\/|\.\.%2f|%252e%252e|\/etc\/passwd|\/etc\/shadow|\/proc\/self|\/windows\/system32|\/winnt\/system32|boot\.ini|web\.config|\.htaccess|\.env).*"""
  | EVAL host_name = host.hostname
  | EVAL log_path  = log.file.path
  | STATS
      event_count = COUNT(*),
      log_paths   = VALUES(log.file.path),
      samples     = VALUES(event.original),
      last_seen   = MAX(@timestamp),
      first_seen  = MIN(@timestamp)
    BY host_name, log_path
  | KEEP
      host_name, log_path, event_count,
      log_paths, samples, last_seen, first_seen
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.initial-access
  - attack.t1190
  - attack.t1083
  - detection.threat-hunting
  - owasp.a01-broken-access-control
severity: high
risk_score: 80
references:
  - "https://attack.mitre.org/techniques/T1190/"
  - "https://owasp.org/www-community/attacks/Path_Traversal"
nist: ["SI-3", "SI-4", "AC-3", "SA-11"]
pci_dss: ["6.3.1", "6.6", "10.6.1", "11.3"]
gdpr: ["32.1.b", "25.1"]
mitre_attack:
  TA0001:
    T1190: []
  TA0007:
    T1083: []