rule_id: f3e08559-bfd1-4091-a40f-21d692d7f94f
name_uz: "ESET Protect - bir nechta bloklangan zararli URL"
name_ru: "ESET Protect - несколько заблокированных вредоносных URL"
name_en: "ESET Protect - Multiple Blocked Malicious URLs"
description_uz: |
  Ushbu qoida ESET web filtering tomonidan block qilingan ko'p malicious URL access urinishlarini aniqlaydi.
  Bu phishing, malware download yoki compromised browsing belgisi (T1566, T1189).
  Qonuniy holatlar: false positive, overly restrictive policy, legitimate blocked site.
  SOC triage bosqichlari:
  - Blocked URL reputation va categorization tekshiring
  - User va process identity'ni identifikatsiya qiling
  - URL pattern - phishing, malware distribution, C2 domain
  - Related email yoki document download bormi qidiring
  - User awareness training zarurligini baholang
description_ru: |
  Это правило выявляет множественные попытки доступа к вредоносным URL, заблокированные web filtering ESET.
  Это признак фишинга, загрузки вредоносного ПО или скомпрометированного браузинга (T1566, T1189).
  Легитимные случаи: false positive, чрезмерно строгая политика, легитимный заблокированный сайт.
  Шаги SOC triage:
  - Проверьте репутацию и категоризацию заблокированного URL
  - Идентифицируйте пользователя и процесс
  - Шаблон URL - фишинг, распространение вредоносного ПО, C2-домен
  - Проверьте, есть ли связанное письмо или загрузка документа
  - Оцените необходимость обучения пользователей (user awareness training)
description_en: |
  This rule detects multiple malicious URL access attempts blocked by ESET web filtering.
  This is a sign of phishing, malware download or compromised browsing (T1566, T1189).
  Legitimate cases: false positive, overly restrictive policy, legitimate blocked site.
  SOC triage steps:
  - Check the blocked URL reputation and categorization
  - Identify the user and process identity
  - URL pattern - phishing, malware distribution, C2 domain
  - Look for a related email or document download
  - Assess whether user awareness training is required
type: esql
params: '{}'
schedule_interval: 15m
index:
- logs-eset.protect-*
query_language: esql
query: |
  FROM logs-eset.protect-*
  | WHERE @timestamp >= NOW() - 45 minutes
  | WHERE event.category == "FilteredWebsites_Event"
  | WHERE eset_protect.action_taken == "Blocked URL"
  | STATS
      event_count = COUNT(*),
      urls = VALUES(eset_protect.object_uri),
      processes = VALUES(eset_protect.process_name),
      users = VALUES(eset_protect.user),
      rule_ids = VALUES(eset_protect.rule_id),
      scanner_ids = VALUES(eset_protect.scanner_id),
      source_addresses = VALUES(eset_protect.source_address)
    BY host.name, source.ip, bucket = DATE_TRUNC(15 minutes, @timestamp)
  | WHERE event_count >= 10
  | KEEP bucket, host.name, source.ip, event_count, urls, processes, users, rule_ids, scanner_ids, source_addresses
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.initial-access
- attack.t1566
- attack.t1189
- eset
- web-filtering
- malicious-url
severity: high
risk_score: 70
references:
- "https://attack.mitre.org/techniques/T1566/"
- "https://attack.mitre.org/techniques/T1189/"
nist: ["SI-4", "SC-7"]
pci_dss: ["6.5.10", "10.6.1"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0001:
    T1566: []
    T1189: []