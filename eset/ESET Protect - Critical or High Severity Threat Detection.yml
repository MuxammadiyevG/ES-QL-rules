rule_id: 21a08aff-af78-410f-aba3-9c1e0d4a8caf
name_uz: "ESET Protect - critical yoki high severity tahdid aniqlanishi"
name_ru: "ESET Protect - обнаружение угрозы критической или высокой серьёзности"
name_en: "ESET Protect - Critical or High Severity Threat Detection"
description_uz: |
  Ushbu qoida ESET tomonidan critical yoki high severity threat detection'larni monitoring qiladi.
  Bu advanced threat, targeted attack yoki severe compromise belgisi.
  Qonuniy holatlar: rare false positives, aggressive PUA detection.
  SOC triage bosqichlari:
  - Threat name va type'ni threat intelligence bilan correlate qiling
  - Detection context - file, process, network communication
  - Response effectiveness (cleaned, quarantined, blocked) tekshiring
  - System-wide compromise indicators qidiring
  - Immediate incident response zarurligini baholang
  - Executive notification consideration
description_ru: |
  Это правило отслеживает обнаружения угроз критической или высокой серьёзности со стороны ESET.
  Это признак advanced threat, целевой атаки или серьёзной компрометации.
  Легитимные случаи: редкие false positive, агрессивное детектирование PUA.
  Шаги SOC triage:
  - Сопоставьте threat name и тип с threat intelligence
  - Контекст обнаружения - файл, процесс, сетевое взаимодействие
  - Проверьте эффективность реакции (cleaned, quarantined, blocked)
  - Ищите индикаторы компрометации в масштабах всей системы
  - Оцените необходимость немедленного реагирования на инцидент
  - Рассмотрение уведомления руководства
description_en: |
  This rule monitors critical or high severity threat detections by ESET.
  This is a sign of an advanced threat, targeted attack or severe compromise.
  Legitimate cases: rare false positives, aggressive PUA detection.
  SOC triage steps:
  - Correlate the threat name and type with threat intelligence
  - Detection context - file, process, network communication
  - Check the response effectiveness (cleaned, quarantined, blocked)
  - Look for system-wide compromise indicators
  - Assess whether immediate incident response is required
  - Executive notification consideration
type: esql
params: '{}'
schedule_interval: 5m
index:
- logs-eset.protect-*
query_language: esql
query: |
  FROM logs-eset.protect-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.category == "Threat_Event"
  | WHERE eset_protect.severity IN ("Critical", "Fatal")
  | STATS
      event_count = COUNT(*),
      detection_names = VALUES(rule.name),
      threat_types = VALUES(eset_protect.threat_type),
      object_uris = VALUES(eset_protect.object_uri),
      object_hashes = VALUES(file.hash.sha1),
      actions_taken = VALUES(eset_protect.action_taken),
      threat_handled = VALUES(eset_protect.threat_handled),
      users = VALUES(eset_protect.user),
      devices = VALUES(host.name)
    BY host.name, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP bucket, host.name, event_count, detection_names, threat_types, object_uris, object_hashes, actions_taken, threat_handled, users, devices
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.execution
- eset
- critical-threat
- high-severity
severity: critical
risk_score: 95
references:
- "https://attack.mitre.org/tactics/TA0002/"
nist: ["SI-3", "IR-4", "IR-5"]
pci_dss: ["5.1", "5.2", "10.6.1"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0002: {}