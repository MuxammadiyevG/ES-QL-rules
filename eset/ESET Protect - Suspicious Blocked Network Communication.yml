rule_id: 95df86d7-557a-42e7-b8cd-61dee40d8fd0
name_uz: "ESET Protect - shubhali bloklangan tarmoq aloqasi"
name_ru: "ESET Protect - подозрительное заблокированное сетевое соединение"
name_en: "ESET Protect - Suspicious Blocked Network Communication"
description_uz: |
  Ushbu qoida ESET tomonidan block qilingan suspicious network communication'larni aniqlaydi.
  Bu C2 communication, data exfiltration yoki malware callback urinishi belgisi (T1071, T1095).
  Qonuniy holatlar: false positive, legitimate blocked connection, overly restrictive policy.
  SOC triage bosqichlari:
  - Remote IP reputation va threat intelligence tekshiring
  - Communication protocol va port'ni tahlil qiling
  - Local process va executable path'ni examine qiling
  - C2 framework pattern'lari bormi aniqlang
  - Host-wide compromise indicator'larini qidiring
  - Network segmentation va containment zarurligini baholang
description_ru: |
  Это правило выявляет подозрительные сетевые соединения, заблокированные ESET.
  Это признак C2-коммуникации, эксфильтрации данных или попытки malware callback (T1071, T1095).
  Легитимные случаи: false positive, легитимное заблокированное соединение, чрезмерно строгая политика.
  Шаги SOC triage:
  - Проверьте репутацию удалённого IP и threat intelligence
  - Проанализируйте протокол и порт соединения
  - Изучите локальный процесс и путь к исполняемому файлу
  - Определите, есть ли паттерны C2-фреймворков
  - Ищите индикаторы компрометации в масштабах хоста
  - Оцените необходимость сегментации сети и containment
description_en: |
  This rule detects suspicious network communications blocked by ESET.
  This is a sign of C2 communication, data exfiltration or a malware callback attempt (T1071, T1095).
  Legitimate cases: false positive, legitimate blocked connection, overly restrictive policy.
  SOC triage steps:
  - Check the remote IP reputation and threat intelligence
  - Analyze the communication protocol and port
  - Examine the local process and executable path
  - Determine whether there are C2 framework patterns
  - Look for host-wide compromise indicators
  - Assess whether network segmentation and containment are required
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-eset.protect-*
query_language: esql
query: |
  FROM logs-eset.protect-*
  | WHERE @timestamp >= NOW() - 30 minutes
  | WHERE event.category == "FirewallAggregated_Event"
  | WHERE eset_protect.target_address IS NOT NULL OR eset_protect.source_address IS NOT NULL
  | EVAL remote_address = COALESCE(TO_STRING(eset_protect.target_address), TO_STRING(eset_protect.source_address))
  | STATS
      event_count = COUNT(*),
      total_aggregates = SUM(eset_protect.aggregate_count),
      source_addresses = VALUES(eset_protect.source_address),
      target_addresses = VALUES(eset_protect.target_address),
      target_ports = VALUES(eset_protect.target_port),
      source_ports = VALUES(eset_protect.source_port),
      protocols = VALUES(eset_protect.protocol),
      inbound_values = VALUES(eset_protect.inbound),
      actions_taken = VALUES(eset_protect.action_taken),
      processes = VALUES(eset_protect.process_name)
    BY host.name, remote_address, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 10
  | KEEP bucket, host.name, remote_address, event_count, total_aggregates, source_addresses, target_addresses, target_ports, source_ports, protocols, inbound_values, actions_taken, processes
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.command-and-control
- attack.t1071
- attack.t1095
- eset
- network-communication
- c2
severity: high
risk_score: 80
references:
- "https://attack.mitre.org/techniques/T1071/"
- "https://attack.mitre.org/techniques/T1095/"
nist: ["SI-4", "SC-7"]
pci_dss: ["1.3.1", "10.6.1"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0011:
    T1071: []
    T1095: []