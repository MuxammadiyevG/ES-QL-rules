rule_id: 09486d9d-c41a-4582-bfd8-26c77eaf5353
name_uz: "ESET Protect - bir nechta qurilmaga shutdown yoki reboot tasklari"
name_ru: "ESET Protect - несколько задач выключения или перезагрузки устройств"
name_en: "ESET Protect - Multiple Device Shutdown or Reboot Tasks"
description_uz: |
  Ushbu qoida ESET device management orqali bir nechta device'larga shutdown/reboot task'larni aniqlaydi.
  Bu unauthorized management action yoki insider threat belgisi bo'lishi mumkin (T1529).
  Qonuniy holatlar: scheduled maintenance, patch deployment, legitimate administrative tasks.
  SOC triage bosqichlari:
  - Task creator identity va authorization'ni verify qiling
  - Target device list va business impact'ni baholang
  - Task description va trigger time'ni review qiling
  - Change management approval borligini tekshiring
  - Unauthorized access yoki credential compromise belgilari
description_ru: |
  Это правило выявляет задачи shutdown/reboot, отправленные на несколько устройств через device management ESET.
  Это может быть признаком несанкционированного управляющего действия или инсайдерской угрозы (T1529).
  Легитимные случаи: плановое обслуживание, развёртывание патчей, легитимные административные задачи.
  Шаги SOC triage:
  - Проверьте личность создателя задачи и его авторизацию
  - Оцените список целевых устройств и влияние на бизнес
  - Просмотрите описание задачи и время запуска
  - Проверьте наличие согласования change management
  - Признаки несанкционированного доступа или компрометации учётных данных
description_en: |
  This rule detects shutdown/reboot tasks sent to multiple devices via ESET device management.
  This may be a sign of an unauthorized management action or insider threat (T1529).
  Legitimate cases: scheduled maintenance, patch deployment, legitimate administrative tasks.
  SOC triage steps:
  - Verify the task creator identity and authorization
  - Assess the target device list and business impact
  - Review the task description and trigger time
  - Check whether change management approval exists
  - Signs of unauthorized access or credential compromise
type: esql
params: '{}'
schedule_interval: 15m
index:
- logs-eset.protect-*
query_language: esql
query: |
  // Detects bulk shutdown/reboot task assignments via ESET Protect client triggers.
  // Each "Assign" event in domain "Client trigger" represents one device being targeted.
  // host.name is always the ESET management server (ESMC), not the target device.
  // Target devices are identified via COUNT_DISTINCT(eset_protect.detail) on Assign events.
  FROM logs-eset.protect-*
  | WHERE @timestamp >= NOW() - 45 minutes
  | WHERE event.category == "Audit_Event"
  | WHERE event.action == "Assign"
      AND eset_protect.domain == "Client trigger"
  | WHERE TO_LOWER(COALESCE(eset_protect.detail, "")) RLIKE ".*(shutdown|reboot|restart).*"
  | STATS
      event_count = COUNT(*),
      target_count = COUNT_DISTINCT(eset_protect.detail),
      users = VALUES(eset_protect.user),
      details = VALUES(eset_protect.detail)
    BY bucket = DATE_TRUNC(15 minutes, @timestamp)
  | WHERE target_count >= 2
  | KEEP bucket, event_count, target_count, users, details
  | SORT target_count DESC, event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.impact
- attack.t1529
- eset
- device-management
- availability
severity: medium
risk_score: 60
references:
- "https://attack.mitre.org/techniques/T1529/"
nist: ["AC-2", "AC-6"]
pci_dss: ["7.1", "10.2.2"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0040:
    T1529: []