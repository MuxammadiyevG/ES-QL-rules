rule_id: c0b049f2-4604-4d4e-9d57-c99f1559c3a7
name_uz: "Agent ESET: alert aniqlandi"
name_ru: "Agent ESET: обнаружено оповещение"
name_en: "Agent ESET: Alert Detected"
description_uz: |
  ESET Protect dan kelgan barcha alertlarni SIEM ga uzatadi.
  Severity, threat name, event tavsifi va barcha ma'lumotlar
  to'liq ESET logi ichidan olinadi.
description_ru: |
  Передаёт в SIEM все оповещения, поступающие из ESET Protect.
  Severity, threat name, описание события и все данные
  берутся полностью из лога ESET.
description_en: |
  Forwards all alerts coming from ESET Protect to the SIEM.
  Severity, threat name, event description and all data
  are taken entirely from the ESET log.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-eset.protect-*
query_language: esql
query: |
  FROM logs-eset.protect-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | KEEP
      @timestamp,
      host.name,
      host.ip,
      source.ip,
      event.action,
      event.category,
      event.module,
      rule.name,
      eset_protect.event,
      eset_protect.severity,
      eset_protect.threat_type,
      eset_protect.action_taken,
      eset_protect.object_uri,
      eset_protect.source_address,
      eset_protect.source_address_type,
      eset_protect.target_address,
      eset_protect.target_address_type,
      eset_protect.protocol,
      eset_protect.handled,
      eset_protect.threat_handled,
      eset_protect.inbound,
      eset_protect.aggregate_count,
      eset_protect.os_name,
      eset_protect.group_name,
      eset_protect.source_uuid,
      eset_protect.user,
      user.name
  | SORT @timestamp DESC
  | LIMIT 200
enabled: true
tags:
  - detection.eset
  - detection.threat-hunting
severity: high
risk_score: 70
references: []
nist: ["SI-4", "AU-12"]
pci_dss: ["10.6.1", "11.4"]
gdpr: ["32.1.b"]
mitre_attack: []