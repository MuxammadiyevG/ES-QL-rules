rule_id: a2bb9144-7609-429c-87ac-3c5b6525acce
name_uz: "VMware ESX - Virtual mashina o'chirildi"
name_ru: "VMware ESX - Виртуальная машина выключена"
name_en: "VMware ESX - Virtual Machine Powered OFF"
description_uz: |
  VMware ESX muhitida virtual mashina holati VM_STATE_OFF ga o'tdi (T1529).
  Bu ruxsatsiz shutdown, tizim crash yoki sabotaj belgisi bo'lishi mumkin.
  SOC triage bosqichlari:
  - Shutdown kim tomonidan boshlanganligi vmware.originator orqali aniqlang
  - vmware.opid bilan operatsiyani kuzating
  - vmware.sid sessiyasini solishtiring
  - Boshqa VM'larda parallel o'zgarishlar bor-yo'qligini tekshiring
  - Change management ticketi mavjudligini aniqlang
description_ru: |
  В среде VMware ESX состояние виртуальной машины изменилось на VM_STATE_OFF (T1529).
  Это может быть признаком несанкционированного выключения, сбоя системы или саботажа.
  Шаги SOC-триажа:
  - Определите через vmware.originator, кто инициировал выключение
  - Отследите операцию с помощью vmware.opid
  - Сопоставьте сессию vmware.sid
  - Проверьте, есть ли параллельные изменения на других ВМ
  - Выясните, есть ли тикет change management
description_en: |
  In a VMware ESX environment a virtual machine transitioned to VM_STATE_OFF (T1529).
  This may be a sign of an unauthorized shutdown, a system crash or sabotage.
  SOC triage steps:
  - Identify via vmware.originator who initiated the shutdown
  - Trace the operation with vmware.opid
  - Compare the vmware.sid session
  - Check whether there are parallel changes on other VMs
  - Determine whether a change management ticket exists
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-vmware.esxi*
query_language: esql
query: |
  FROM logs-vmware.esxi*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.module == "vmware"
  | WHERE event.dataset == "vmware.esxi"
  | WHERE event.category == "host"
  | WHERE log.level == "info"
  | WHERE message LIKE "*-> VM_STATE_OFF*"
  | STATS
      shutdown_count      = COUNT(*),
      affected_hosts      = VALUES(host.hostname),
      unique_hosts        = COUNT_DISTINCT(host.hostname),
      process_names       = VALUES(process.name),
      process_ids         = VALUES(process.pid),
      thread_ids          = VALUES(process.thread.id),
      originator_list     = VALUES(vmware.originator),
      opid_list           = VALUES(vmware.opid),
      sid_list            = VALUES(vmware.sid),
      syslog_priority     = VALUES(log.syslog.priority),
      log_logger          = VALUES(log.logger),
      log_messages        = VALUES(message),
      first_seen          = MIN(@timestamp),
      last_seen           = MAX(@timestamp)
    BY agent_id, host.hostname, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP
      bucket, host.hostname, shutdown_count,
      affected_hosts, unique_hosts,
      process_names, process_ids, thread_ids,
      originator_list, opid_list, sid_list,
      syslog_priority, log_logger,
      log_messages, first_seen, last_seen
  | SORT shutdown_count DESC
  | LIMIT 50
enabled: true
tags:
  - attack.impact
  - attack.t1529
  - vmware
  - esxi
  - vm-state
  - shutdown
  - availability
severity: high
risk_score: 70
references:
  - "https://attack.mitre.org/techniques/T1529/"
nist: ["CP-10", "SI-4", "AU-6"]
pci_dss: ["10.6.1"]
gdpr: ["35.7.d"]
hipaa: ["164.312.b"]
mitre_attack:
  TA0040:
    T1529: []