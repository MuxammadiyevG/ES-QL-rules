rule_id: a04a9c08-3c10-4796-80dc-05df7c6e55e0
name_uz: "VMware ESX - Virtual mashina yoqilmoqda"
name_ru: "VMware ESX - Включение виртуальной машины"
name_en: "VMware ESX - Virtual Machine Powering ON"
description_uz: |
  VMware ESX muhitida virtual mashina yoqilish jarayoni boshlandi (VM_STATE_POWERING_ON).
  Bu normal holat bo'lishi mumkin, ammo ruxsatsiz mashina ishga tushirilishi
  noodatiy aktivlik belgisi.
  SOC triage bosqichlari:
  - Mashina kimning tomonidan yoqilganini vmware.originator orqali aniqlang
  - Kutilmagan vaqtda yoqilgan VM'larni tekshiring
  - vmware.opid orqali operatsiyani kuzating
description_ru: |
  В среде VMware ESX начался процесс включения виртуальной машины (VM_STATE_POWERING_ON).
  Это может быть нормальным состоянием, однако несанкционированный запуск машины —
  признак нетипичной активности.
  Шаги SOC-триажа:
  - Определите через vmware.originator, кто включил машину
  - Проверьте ВМ, включённые в неожиданное время
  - Отследите операцию через vmware.opid
description_en: |
  In a VMware ESX environment a virtual machine power-on process started (VM_STATE_POWERING_ON).
  This may be a normal state, but an unauthorized start of a machine is
  a sign of unusual activity.
  SOC triage steps:
  - Identify via vmware.originator who powered the machine on
  - Check VMs powered on at unexpected times
  - Trace the operation via vmware.opid
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-vmware.esxi*
query_language: esql
query: |
  FROM logs-vmware.esxi*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.module == "vmware"
  | WHERE event.dataset == "vmware.esxi"
  | WHERE log.level == "info"
  | WHERE message LIKE "*-> VM_STATE_POWERING_ON*"
  | STATS
      poweron_count       = COUNT(*),
      affected_hosts      = VALUES(host.hostname),
      unique_hosts        = COUNT_DISTINCT(host.hostname),
      process_names       = VALUES(process.name),
      process_ids         = VALUES(process.pid),
      thread_ids          = VALUES(process.thread.id),
      originator_list     = VALUES(vmware.originator),
      opid_list           = VALUES(vmware.opid),
      sid_list            = VALUES(vmware.sid),
      syslog_priority     = VALUES(log.syslog.priority),
      log_logger          = VALUES(log.logger),
      log_messages        = VALUES(message),
      first_seen          = MIN(@timestamp),
      last_seen           = MAX(@timestamp)
    BY agent_id, host.hostname, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP
      bucket, host.hostname, poweron_count,
      affected_hosts, unique_hosts,
      process_names, process_ids, thread_ids,
      originator_list, opid_list, sid_list,
      syslog_priority, log_logger,
      log_messages, first_seen, last_seen
  | SORT poweron_count DESC
  | LIMIT 50
enabled: true
tags:
  - vmware
  - esxi
  - vm-state
  - power-on
severity: low
risk_score: 40
references: []
nist: ["AU-6", "CM-3"]
pci_dss: ["10.6.1"]
mitre_attack: []