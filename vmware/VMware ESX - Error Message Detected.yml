rule_id: c62c62b8-ffd8-4cfd-91f4-8ad9cef85303
name_uz: "VMware ESX - error darajasidagi xabar aniqlandi"
name_ru: "VMware ESX - обнаружено сообщение уровня error"
name_en: "VMware ESX - Error Message Detected"
description_uz: |
  VMware ESX tizimidan error darajasidagi xabar qayd etildi.
  Tizim xatoliklari yoki servis muammolarining belgisi bo'lishi mumkin.
  SOC triage bosqichlari:
  - Error xabar matnini o'qib, qaysi komponent xato bergani aniqlang
  - Vaqt oralig'ida takrorlanayotgan errorlar bor-yo'qligini tekshiring
  - Host va process ma'lumotlarini solishtiring
description_ru: |
  Зафиксировано сообщение уровня error от системы VMware ESX.
  Может быть признаком системных ошибок или проблем сервисов.
  Шаги SOC-триажа:
  - Прочитайте текст сообщения error и определите, какой компонент дал сбой
  - Проверьте, есть ли повторяющиеся ошибки за интервал времени
  - Сопоставьте данные host и process
description_en: |
  A message of error level was recorded from the VMware ESX system.
  It may indicate system errors or service issues.
  SOC triage steps:
  - Read the text of the error message and determine which component failed
  - Check whether there are errors repeating over the time range
  - Compare the host and process details
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-vmware.esxi*
query_language: esql
query: |
  FROM logs-vmware.esxi*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.module == "vmware"
  | WHERE event.dataset == "vmware.esxi"
  | WHERE log.level == "error"
  | STATS
      error_count         = COUNT(*),
      affected_hosts      = VALUES(host.hostname),
      unique_hosts        = COUNT_DISTINCT(host.hostname),
      process_names       = VALUES(process.name),
      process_ids         = VALUES(process.pid),
      originator_list     = VALUES(vmware.originator),
      opid_list           = VALUES(vmware.opid),
      sid_list            = VALUES(vmware.sid),
      log_messages        = VALUES(message),
      first_seen          = MIN(@timestamp),
      last_seen           = MAX(@timestamp)
    BY agent_id, host.hostname, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP
      bucket, host.hostname, error_count,
      affected_hosts, unique_hosts,
      process_names, process_ids,
      originator_list, opid_list, sid_list,
      log_messages, first_seen, last_seen
  | SORT error_count DESC
  | LIMIT 50
enabled: true
tags:
  - vmware
  - esxi
  - error
  - system-health
severity: medium
risk_score: 40
references:
  - "https://docs.vmware.com/en/VMware-vSphere/index.html"
nist: ["SI-4", "AU-6"]
pci_dss: ["10.6.1"]
gdpr: ["35.7.d"]
hipaa: ["164.312.b"]
mitre_attack: {}