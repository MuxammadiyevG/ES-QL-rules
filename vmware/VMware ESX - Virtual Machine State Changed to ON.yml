rule_id: 7ef28d01-ebb9-4c64-8911-eaff0090db52
name_uz: "VMware ESX - Virtual mashina holati ON ga o'zgardi"
name_ru: "VMware ESX - Состояние виртуальной машины изменено на ON"
name_en: "VMware ESX - Virtual Machine State Changed to ON"
description_uz: |
  VMware ESX muhitida virtual mashina holati VM_STATE_ON ga o'tdi.
  Mashina muvaffaqiyatli yoqildi. Noodatiy vaqtda yoki noma'lum
  mashina bo'lsa tekshirish tavsiya etiladi.
  SOC triage bosqichlari:
  - Qaysi VM yoqilganini host.hostname orqali aniqlang
  - vmware.originator kimligini tekshiring
  - Kutilmagan activatsiyalarni kuzating
description_ru: |
  В среде VMware ESX состояние виртуальной машины изменилось на VM_STATE_ON.
  Машина успешно включена. При нетипичном времени или неизвестной
  машине рекомендуется проверка.
  Шаги SOC-триажа:
  - Определите через host.hostname, какая ВМ была включена
  - Проверьте, кем является vmware.originator
  - Отслеживайте неожиданные активации
description_en: |
  In a VMware ESX environment a virtual machine transitioned to VM_STATE_ON.
  The machine was powered on successfully. If it happens at an unusual time or involves an
  unknown machine, review is recommended.
  SOC triage steps:
  - Identify via host.hostname which VM was powered on
  - Check who the vmware.originator is
  - Monitor unexpected activations
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-vmware.esxi*
query_language: esql
query: |
  FROM logs-vmware.esxi*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.module == "vmware"
  | WHERE event.dataset == "vmware.esxi"
  | WHERE log.level == "info"
  | WHERE message LIKE "*-> VM_STATE_ON*"
  | STATS
      stateon_count       = COUNT(*),
      affected_hosts      = VALUES(host.hostname),
      unique_hosts        = COUNT_DISTINCT(host.hostname),
      process_names       = VALUES(process.name),
      process_ids         = VALUES(process.pid),
      thread_ids          = VALUES(process.thread.id),
      originator_list     = VALUES(vmware.originator),
      opid_list           = VALUES(vmware.opid),
      sid_list            = VALUES(vmware.sid),
      syslog_priority     = VALUES(log.syslog.priority),
      log_logger          = VALUES(log.logger),
      log_messages        = VALUES(message),
      first_seen          = MIN(@timestamp),
      last_seen           = MAX(@timestamp)
    BY agent_id, host.hostname, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP
      bucket, host.hostname, stateon_count,
      affected_hosts, unique_hosts,
      process_names, process_ids, thread_ids,
      originator_list, opid_list, sid_list,
      syslog_priority, log_logger,
      log_messages, first_seen, last_seen
  | SORT stateon_count DESC
  | LIMIT 50
enabled: true
tags:
  - vmware
  - esxi
  - vm-state
  - power-on
severity: low
risk_score: 40
references: []
nist: ["AU-6", "CM-3"]
pci_dss: ["10.6.1"]
mitre_attack: []