rule_id: ec4739e0-8eff-4c3d-9676-8ddf0d992a00
name: VMware ESX - VM Snapshot Created or Deleted
description: |
  VMware ESX muhitida virtual mashina snapshot'i yaratildi yoki o'chirildi.
  Snapshot yaratish ransomware operatorlari uchun, snapshot o'chirish esa
  qayta tiklash imkonini yo'q qilish (anti-forensics / recovery inhibition)
  uchun ishlatilishi mumkin (T1578.004).
  Qonuniy holatlar: backup jarayoni, yangilanishdan oldingi snapshot, rejaviy housekeeping.
  SOC triage bosqichlari:
  - Snapshot operatsiyasini kim initiate qilganini vmware.originator orqali aniqlang
  - vmware.opid orqali operatsiyani to'liq kuzating
  - Snapshot o'chirish ketma-ket kelganligini va boshqa VM'larni qamraganini tekshiring
  - Change management ticketi mavjudligini aniqlang
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-vmware.esxi*
query_language: esql
query: |
  FROM logs-vmware.esxi*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.module == "vmware"
  | WHERE event.dataset == "vmware.esxi"
  | WHERE message LIKE "*Snapshot*created*"
    OR message LIKE "*Snapshot*removed*"
    OR message LIKE "*Snapshot*deleted*"
    OR message LIKE "*CreateSnapshot*"
    OR message LIKE "*RemoveSnapshot*"
  | EVAL snapshot_action = CASE(
      message LIKE "*removed*" OR message LIKE "*deleted*" OR message LIKE "*RemoveSnapshot*", "deleted",
      "created"
    )
  | STATS
      snapshot_count      = COUNT(*),
      actions             = VALUES(snapshot_action),
      affected_hosts      = VALUES(host.hostname),
      unique_hosts        = COUNT_DISTINCT(host.hostname),
      process_names       = VALUES(process.name),
      originator_list     = VALUES(vmware.originator),
      opid_list           = VALUES(vmware.opid),
      sid_list            = VALUES(vmware.sid),
      log_messages        = VALUES(message),
      first_seen          = MIN(@timestamp),
      last_seen           = MAX(@timestamp)
    BY agent_id, host.hostname, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP
      bucket, host.hostname, snapshot_count, actions,
      affected_hosts, unique_hosts,
      process_names,
      originator_list, opid_list, sid_list,
      log_messages, first_seen, last_seen
  | SORT snapshot_count DESC
  | LIMIT 50
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1578.004
  - attack.impact
  - vmware
  - esxi
  - snapshot
  - anti-forensics
severity: medium
risk_score: 55
references:
  - "https://attack.mitre.org/techniques/T1578/004/"
nist: ["CM-3", "CP-9", "AU-12"]
pci_dss: ["10.2.7"]
gdpr: ["35.7.d"]
hipaa: ["164.312.b"]
mitre_attack:
  TA0003:
    T1578: ["T1578.004"]
  TA0040: []
