rule_id: b3f68456-e1eb-416a-bffb-b186493ccd05
name_uz: "VMware ESX - SSH xizmati yoqilgan / Shell kirish"
name_ru: "VMware ESX - Включена служба SSH / доступ к Shell"
name_en: "VMware ESX - SSH Service Enabled / Shell Access"
description_uz: |
  VMware ESX hostida SSH xizmati yoki ESXi Shell yoqilganligi aniqlandi.
  SSH/Shell odatda xavfsizlik uchun o'chirilgan bo'ladi; uning yoqilishi
  ransomware operatorlari uchun tipik dastlabki qadam bo'lib, qo'lda boshqarish
  va himoyani chetlab o'tish (Remote Services / Impair Defenses) belgisi bo'lishi mumkin
  (T1021.004, T1562.001).
  Qonuniy holatlar: rejaviy troubleshooting, vendor support sessiyasi.
  SOC triage bosqichlari:
  - SSH/Shell kim tomonidan yoqilganini vmware.originator orqali aniqlang
  - Yoqilish vaqti tasdiqlangan maintenance oynasiga mos kelishini tekshiring
  - Keyingi login va fayl o'zgarishlari bilan korrelyatsiya qiling
  - Noqonuniy bo'lsa SSH/Shell ni o'chiring va hostni izolyatsiya qiling
description_ru: |
  На хосте VMware ESX обнаружено включение службы SSH или ESXi Shell.
  SSH/Shell обычно отключены из соображений безопасности; их включение
  является типичным первым шагом операторов ransomware и может указывать на ручное
  управление и обход защиты (Remote Services / Impair Defenses)
  (T1021.004, T1562.001).
  Легитимные случаи: плановое устранение неполадок, сессия поддержки вендора.
  Шаги SOC-триажа:
  - Определите через vmware.originator, кто включил SSH/Shell
  - Проверьте, совпадает ли время включения с утверждённым окном обслуживания
  - Сопоставьте с последующими входами и изменениями файлов
  - Если действие несанкционированное, отключите SSH/Shell и изолируйте хост
description_en: |
  The SSH service or ESXi Shell was detected as enabled on a VMware ESX host.
  SSH/Shell is normally disabled for security reasons; enabling it
  is a typical first step for ransomware operators and may indicate manual
  control and defense evasion (Remote Services / Impair Defenses)
  (T1021.004, T1562.001).
  Legitimate cases: planned troubleshooting, a vendor support session.
  SOC triage steps:
  - Identify via vmware.originator who enabled SSH/Shell
  - Verify that the enablement time matches an approved maintenance window
  - Correlate with subsequent logins and file changes
  - If unauthorized, disable SSH/Shell and isolate the host
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-vmware.esxi*
query_language: esql
query: |
  FROM logs-vmware.esxi*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.module == "vmware"
  | WHERE event.dataset == "vmware.esxi"
  | WHERE message LIKE "*SSH access has been enabled*"
    OR message LIKE "*ESXi Shell access has been enabled*"
    OR message LIKE "*SSH login has been enabled*"
    OR message LIKE "*TSM-SSH*started*"
  | STATS
      enable_count        = COUNT(*),
      affected_hosts      = VALUES(host.hostname),
      unique_hosts        = COUNT_DISTINCT(host.hostname),
      process_names       = VALUES(process.name),
      process_ids         = VALUES(process.pid),
      originator_list     = VALUES(vmware.originator),
      opid_list           = VALUES(vmware.opid),
      sid_list            = VALUES(vmware.sid),
      log_messages        = VALUES(message),
      first_seen          = MIN(@timestamp),
      last_seen           = MAX(@timestamp)
    BY agent_id, host.hostname, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP
      bucket, host.hostname, enable_count,
      affected_hosts, unique_hosts,
      process_names, process_ids,
      originator_list, opid_list, sid_list,
      log_messages, first_seen, last_seen
  | SORT enable_count DESC
  | LIMIT 50
enabled: true
tags:
  - attack.lateral-movement
  - attack.t1021.004
  - attack.defense-evasion
  - attack.t1562.001
  - vmware
  - esxi
  - ssh
  - shell
severity: high
risk_score: 80
references:
  - "https://attack.mitre.org/techniques/T1021/004/"
  - "https://attack.mitre.org/techniques/T1562/001/"
nist: ["AC-17", "SI-4", "CM-7"]
pci_dss: ["2.2.2", "10.6.1"]
gdpr: ["32.1.b"]
hipaa: ["164.312.b"]
mitre_attack:
  TA0008:
    T1021: ["T1021.004"]
  TA0005:
    T1562: ["T1562.001"]
