rule_id: 3fce9ead-fe87-46ec-908c-b1e1b42eed32
name_uz: "VMware ESX - critical yoki fatal xabar aniqlandi"
name_ru: "VMware ESX - обнаружено сообщение уровня critical или fatal"
name_en: "VMware ESX - Critical or Fatal Message Detected"
description_uz: |
  VMware ESX tizimidan critical yoki fatal darajadagi xabar qayd etildi.
  Bu tizim nosozligi, hardware muammosi yoki jiddiy xato belgisi bo'lishi mumkin.
  SOC triage bosqichlari:
  - Critical xabar matnini tahlil qiling
  - Qaysi host va process tomonidan kelganini aniqlang
  - Boshqa error/warn xabarlar bilan korrelyatsiya qiling
  - VMware vCenter yoki vSphere konsolini tekshiring
description_ru: |
  Зафиксировано сообщение уровня critical или fatal от системы VMware ESX.
  Это может быть признаком сбоя системы, проблемы hardware или серьёзной ошибки.
  Шаги SOC-триажа:
  - Проанализируйте текст сообщения critical
  - Определите, от какого host и process оно поступило
  - Скоррелируйте с другими сообщениями error/warn
  - Проверьте консоль VMware vCenter или vSphere
description_en: |
  A message of critical or fatal level was recorded from the VMware ESX system.
  This may indicate a system failure, a hardware issue or a serious error.
  SOC triage steps:
  - Analyze the text of the critical message
  - Determine which host and process it came from
  - Correlate it with other error/warn messages
  - Check the VMware vCenter or vSphere console
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-vmware.esxi*
query_language: esql
query: |
  FROM logs-vmware.esxi*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.module == "vmware"
  | WHERE event.dataset == "vmware.esxi"
  | WHERE log.level IN ("critical", "fatal")
  | STATS
      crit_count          = COUNT(*),
      affected_hosts      = VALUES(host.hostname),
      unique_hosts        = COUNT_DISTINCT(host.hostname),
      log_levels          = VALUES(log.level),
      process_names       = VALUES(process.name),
      process_ids         = VALUES(process.pid),
      originator_list     = VALUES(vmware.originator),
      opid_list           = VALUES(vmware.opid),
      sid_list            = VALUES(vmware.sid),
      log_messages        = VALUES(message),
      first_seen          = MIN(@timestamp),
      last_seen           = MAX(@timestamp)
    BY agent_id, host.hostname, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP
      bucket, host.hostname, crit_count,
      affected_hosts, unique_hosts,
      log_levels, process_names, process_ids,
      originator_list, opid_list, sid_list,
      log_messages, first_seen, last_seen
  | SORT crit_count DESC
  | LIMIT 50
enabled: true
tags:
  - vmware
  - esxi
  - critical
  - fatal
  - system-health
severity: high
risk_score: 70
references:
  - "https://docs.vmware.com/en/VMware-vSphere/index.html"
nist: ["SI-4", "AU-6"]
pci_dss: ["10.6.1"]
gdpr: ["35.7.d"]
hipaa: ["164.312.b"]
mitre_attack: {}