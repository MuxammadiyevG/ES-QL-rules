rule_id: aadce2f5-b8e7-4f99-bf54-c27f9083cfa6
name_uz: "VMware ESX - Muvaffaqiyatli autentifikatsiya (logged in)"
name_ru: "VMware ESX - Успешная аутентификация (logged in)"
name_en: "VMware ESX - Successful Authentication (logged in)"
description_uz: |
  VMware ESX tizimiga muvaffaqiyatli autentifikatsiya qayd etildi.
  Bu normal hodisa bo'lishi mumkin, ammo noodatiy vaqtda yoki noma'lum
  foydalanuvchi tomonidan bo'lsa tekshirish tavsiya etiladi (T1078).
  SOC triage bosqichlari:
  - Login qilgan user nomini tekshiring
  - Login vaqti va joyini solishtiring
  - Avvalgi login tarixini kuzating
  - Muvaffaqiyatsiz urinishlar ketidan kelgan login'larni aniqlang
description_ru: |
  Зафиксирована успешная аутентификация в системе VMware ESX.
  Это может быть нормальным событием, однако при нетипичном времени или
  неизвестном пользователе рекомендуется проверка (T1078).
  Шаги SOC-триажа:
  - Проверьте имя вошедшего пользователя
  - Сопоставьте время и место входа
  - Изучите историю предыдущих входов
  - Выявите входы, следующие за неудачными попытками
description_en: |
  A successful authentication to the VMware ESX system was recorded.
  This may be a normal event, but if it occurs at an unusual time or by an unknown
  user, review is recommended (T1078).
  SOC triage steps:
  - Check the name of the user who logged in
  - Compare the login time and location
  - Review the previous login history
  - Identify logins that follow failed attempts
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-vmware.esxi*
query_language: esql
query: |
  FROM logs-vmware.esxi*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.module == "vmware"
  | WHERE event.dataset == "vmware.esxi"
  | WHERE event.outcome == "success"
  | WHERE event.category == "authentication"
  | WHERE log.level == "info"
  | WHERE message LIKE "*logged in*"
  | STATS
      login_count         = COUNT(*),
      affected_users      = VALUES(user.name),
      unique_users        = COUNT_DISTINCT(user.name),
      affected_hosts      = VALUES(host.hostname),
      unique_hosts        = COUNT_DISTINCT(host.hostname),
      process_names       = VALUES(process.name),
      process_ids         = VALUES(process.pid),
      thread_ids          = VALUES(process.thread.id),
      originator_list     = VALUES(vmware.originator),
      opid_list           = VALUES(vmware.opid),
      sid_list            = VALUES(vmware.sid),
      log_messages        = VALUES(message),
      first_seen          = MIN(@timestamp),
      last_seen           = MAX(@timestamp)
    BY agent_id, host.hostname, user.name, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP
      bucket, host.hostname, user.name, login_count,
      affected_users, unique_users,
      affected_hosts, unique_hosts,
      process_names, process_ids, thread_ids,
      originator_list, opid_list, sid_list,
      log_messages, first_seen, last_seen
  | SORT login_count DESC
  | LIMIT 50
enabled: true
tags:
  - attack.initial-access
  - attack.t1078
  - vmware
  - esxi
  - authentication
  - success
severity: medium
risk_score: 15
references:
  - "https://attack.mitre.org/techniques/T1078/"
nist: ["AC-7", "AU-14"]
pci_dss: ["10.2.5"]
gdpr: ["32.2"]
hipaa: ["164.312.b"]
mitre_attack:
  TA0001:
    T1078: []