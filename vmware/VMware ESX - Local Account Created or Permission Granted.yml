rule_id: 77681dab-64f0-4df8-85c9-ab01c4426ddb
name_uz: "VMware ESX - lokal akkaunt yaratildi yoki ruxsat berildi"
name_ru: "VMware ESX - создана локальная учётная запись или выданы права"
name_en: "VMware ESX - Local Account Created or Permission Granted"
description_uz: |
  VMware ESX hostida yangi lokal foydalanuvchi yaratildi yoki rol/ruxsat (permission)
  biriktirildi. Hujumchilar hostda doimiy kirishni saqlash uchun rogue akkaunt yaratishi
  yoki mavjud akkauntga ortiqcha imtiyoz berishi mumkin (Persistence / Create Account)
  (T1136.001).
  Qonuniy holatlar: yangi administrator qo'shilishi, rejaviy ruxsat boshqaruvi.
  SOC triage bosqichlari:
  - Akkauntni yoki ruxsatni kim yaratganini vmware.originator orqali aniqlang
  - Yangi akkaunt nomi va biriktirilgan rolni message orqali tekshiring
  - O'zgarish tasdiqlangan IT so'rovi/ticket bilan mos kelishini tekshiring
  - Noqonuniy bo'lsa akkauntni o'chiring va ruxsatni qaytaring
description_ru: |
  На хосте VMware ESX создан новый локальный пользователь либо назначена роль/разрешение (permission).
  Злоумышленники могут создать rogue-учётную запись для сохранения постоянного доступа к хосту
  либо выдать избыточные привилегии существующей учётной записи (Persistence / Create Account)
  (T1136.001).
  Легитимные случаи: добавление нового администратора, плановое управление правами.
  Шаги SOC-триажа:
  - Определите через vmware.originator, кто создал учётную запись или разрешение
  - Проверьте через message имя новой учётной записи и назначенную роль
  - Проверьте соответствие изменения утверждённой IT-заявке/тикету
  - Если изменение нелегитимно, удалите учётную запись и отзовите разрешение
description_en: |
  A new local user was created on the VMware ESX host or a role/permission (permission)
  was assigned. Attackers may create a rogue account to maintain persistent access on the host
  or grant excessive privileges to an existing account (Persistence / Create Account)
  (T1136.001).
  Legitimate cases: onboarding of a new administrator, planned permission management.
  SOC triage steps:
  - Determine who created the account or the permission via vmware.originator
  - Check the new account name and the assigned role via message
  - Check that the change matches an approved IT request/ticket
  - If illegitimate, delete the account and revoke the permission
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-vmware.esxi*
query_language: esql
query: |
  FROM logs-vmware.esxi*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.module == "vmware"
  | WHERE event.dataset == "vmware.esxi"
  | WHERE message LIKE "*Account*created*"
    OR message LIKE "*Added user*"
    OR message LIKE "*useradd*"
    OR message LIKE "*Permission*created*"
    OR message LIKE "*role*assigned*"
    OR message LIKE "*Permission rule added*"
  | EVAL change_action = CASE(
      message LIKE "*Permission*" OR message LIKE "*role*", "permission-granted",
      "account-created"
    )
  | STATS
      change_count        = COUNT(*),
      actions             = VALUES(change_action),
      affected_users      = VALUES(user.name),
      affected_hosts      = VALUES(host.hostname),
      unique_hosts        = COUNT_DISTINCT(host.hostname),
      process_names       = VALUES(process.name),
      originator_list     = VALUES(vmware.originator),
      opid_list           = VALUES(vmware.opid),
      sid_list            = VALUES(vmware.sid),
      log_messages        = VALUES(message),
      first_seen          = MIN(@timestamp),
      last_seen           = MAX(@timestamp)
    BY agent_id, host.hostname, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP
      bucket, host.hostname, change_count, actions,
      affected_users, affected_hosts, unique_hosts,
      process_names,
      originator_list, opid_list, sid_list,
      log_messages, first_seen, last_seen
  | SORT change_count DESC
  | LIMIT 50
enabled: true
tags:
  - attack.persistence
  - attack.t1136.001
  - vmware
  - esxi
  - account-creation
  - permission
severity: high
risk_score: 70
references:
  - "https://attack.mitre.org/techniques/T1136/001/"
nist: ["AC-2", "AC-6", "AU-12"]
pci_dss: ["7.1", "8.1.2", "10.2.5"]
gdpr: ["32.1.b"]
hipaa: ["164.312.b"]
mitre_attack:
  TA0003:
    T1136: ["T1136.001"]
