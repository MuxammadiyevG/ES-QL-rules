rule_id: c8543525-3c94-4932-a103-6e42b3be4bf7
name_uz: "VMware ESX - Virtual mashina qayta sozlanmoqda"
name_ru: "VMware ESX - Переконфигурирование виртуальной машины"
name_en: "VMware ESX - Virtual Machine Being Reconfigured"
description_uz: |
  VMware ESX muhitida virtual mashina qayta sozlanmoqda (VM_STATE_RECONFIGURING).
  Bu ruxsatsiz konfiguratsiya o'zgarishi, persistence o'rnatish yoki
  resurs manipulyatsiyasi belgisi bo'lishi mumkin (T1578).
  SOC triage bosqichlari:
  - vmware.originator orqali kim initiate qilganini aniqlang
  - vmware.opid bilan operatsiyani to'liq kuzating
  - vmware.sid sessiyasini solishtiring
  - Change management ticketi mavjudligini aniqlang
  - CPU/RAM/disk/network o'zgarishlari tafsirini tekshiring
description_ru: |
  В среде VMware ESX выполняется переконфигурирование виртуальной машины (VM_STATE_RECONFIGURING).
  Это может быть признаком несанкционированного изменения конфигурации, установки
  закрепления (persistence) или манипуляции ресурсами (T1578).
  Шаги SOC-триажа:
  - Определите через vmware.originator, кто инициировал операцию
  - Полностью отследите операцию с помощью vmware.opid
  - Сопоставьте сессию vmware.sid
  - Выясните, есть ли тикет change management
  - Проверьте детали изменений CPU/RAM/диска/сети
description_en: |
  A virtual machine is being reconfigured in a VMware ESX environment (VM_STATE_RECONFIGURING).
  This may be a sign of an unauthorized configuration change, persistence setup or
  resource manipulation (T1578).
  SOC triage steps:
  - Identify via vmware.originator who initiated it
  - Fully trace the operation with vmware.opid
  - Compare the vmware.sid session
  - Determine whether a change management ticket exists
  - Review the details of the CPU/RAM/disk/network changes
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-vmware.esxi*
query_language: esql
query: |
  FROM logs-vmware.esxi*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.module == "vmware"
  | WHERE event.dataset == "vmware.esxi"
  | WHERE log.level == "info"
  | WHERE message LIKE "*-> VM_STATE_RECONFIGURING*"
  | STATS
      reconfig_count      = COUNT(*),
      affected_hosts      = VALUES(host.hostname),
      unique_hosts        = COUNT_DISTINCT(host.hostname),
      process_names       = VALUES(process.name),
      process_ids         = VALUES(process.pid),
      thread_ids          = VALUES(process.thread.id),
      originator_list     = VALUES(vmware.originator),
      opid_list           = VALUES(vmware.opid),
      sid_list            = VALUES(vmware.sid),
      syslog_priority     = VALUES(log.syslog.priority),
      syslog_version      = VALUES(log.syslog.version),
      log_logger          = VALUES(log.logger),
      log_messages        = VALUES(message),
      first_seen          = MIN(@timestamp),
      last_seen           = MAX(@timestamp)
    BY agent_id, host.hostname, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP
      bucket, host.hostname, reconfig_count,
      affected_hosts, unique_hosts,
      process_names, process_ids, thread_ids,
      originator_list, opid_list, sid_list,
      syslog_priority, syslog_version, log_logger,
      log_messages, first_seen, last_seen
  | SORT reconfig_count DESC
  | LIMIT 50
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1578
  - vmware
  - esxi
  - vm-state
  - reconfiguration
  - config-change
severity: medium
risk_score: 55
references:
  - "https://attack.mitre.org/techniques/T1578/"
nist: ["CM-3", "CM-6", "AU-14"]
pci_dss: ["10.2.7"]
gdpr: ["35.7.d"]
hipaa: ["164.312.b"]
mitre_attack:
  TA0005:
    T1578: []