rule_id: 52444a44-5623-4957-bd6c-a36c378e5378
name_uz: "Switch SYSLOG: Log aggregation holati o'zgardi (AGGREGATION)"
name_ru: "Switch SYSLOG: Изменено состояние log aggregation (AGGREGATION)"
name_en: "Switch SYSLOG: Log Aggregation State Changed (AGGREGATION)"
description_uz: |
  Switch log aggregation rejimi o'zgardi.
  Aggregation o'chirilsa ayrim loglar yo'qolishi mumkin.
description_ru: |
  Режим log aggregation на switch изменился.
  При отключении aggregation часть логов может быть потеряна.
description_en: |
  The switch log aggregation mode changed.
  If aggregation is disabled, some logs may be lost.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-switch.syslog-*
query_language: esql
query: |
  FROM logs-switch.syslog-*
  | MV_EXPAND log.syslog.facility.name
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE log.syslog.facility.name == "GCLI"
  | WHERE event.action == "CMD-EXEC"
  | WHERE event.original RLIKE ".*cmd:logging aggregation.*"
  | KEEP @timestamp, host.name, event.action, event.original
  | SORT @timestamp DESC
enabled: true
tags:
  - event.activity
  - switch.config
severity: low
risk_score: 10