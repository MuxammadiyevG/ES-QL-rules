rule_id: 1b61f60d-4a82-4d65-8248-79a357efbe5c
name_uz: "Switch STP: STP holat o'zgarishi (barcha)"
name_ru: "Switch STP: Изменение состояния STP (все)"
name_en: "Switch STP: STP State Change (All)"
description_uz: |
  Switch portida Spanning Tree holati o'zgardi.
  Forwarding, Blocking, Listening, Learning — istalgan holat.
description_ru: |
  На порту switch изменилось состояние Spanning Tree.
  Forwarding, Blocking, Listening, Learning — любое состояние.
description_en: |
  The Spanning Tree state changed on a switch port.
  Forwarding, Blocking, Listening, Learning — any state.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-switch.syslog-*
query_language: esql
query: |
  FROM logs-switch.syslog-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | MV_EXPAND log.syslog.facility.name
  | WHERE log.syslog.facility.name == "STP"
  | KEEP @timestamp, host.name, network.interface.name, network.stp.status, event.original
  | SORT @timestamp DESC
enabled: true
tags:
  - event.activity
  - switch.stp
severity: low
risk_score: 5