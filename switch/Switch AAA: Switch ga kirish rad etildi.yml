  rule_id: 888f23e2-a7b8-4869-900c-e83ffd3b9e49
  name: "Switch AAA: Switch ga kirish rad etildi"
  description: |
    SSH yoki Telnet orqali switch ga ulanishda autentifikatsiya rad etildi.
    Noto'g'ri parol yoki noma'lum foydalanuvchi nomi.
    Qisqa vaqtda ko'p urinish brute-force hujumini ko'rsatishi mumkin.
    SOC triage:
    - Manba IP dan nechta urinish bo'lganini tekshiring.
    - IP korporativ tarmoqdan tashqari bo'lsa darhol bloklang.
    - Boshqa switch larda ham xuddi shu IP dan urinish borligini tekshiring.
  type: esql
  params: '{}'
  schedule_interval: 5m
  index:
    - logs-switch.syslog-*
  query_language: esql
  query: |
    FROM logs-switch.syslog-*
    | WHERE @timestamp >= NOW() - 300 seconds
    | WHERE log.syslog.facility.name == "AAA"
    | WHERE event.outcome == "failure"
    | KEEP
        @timestamp,
        host.name,
        user.name,
        source.ip,
        destination.ip,
        event.action,
        event.outcome,
        event.original
    | SORT @timestamp DESC
  enabled: true
  tags:
    - event.activity
    - switch.auth
    - switch.logon-failure
  severity: low
  risk_score: 10