rule_id: 9348a282-86b8-4735-8ebf-2520ba976430
name_uz: "Switch Syslog: Barcha hodisalar (umumiy)"
name_ru: "Switch Syslog: Все события (общее)"
name_en: "Switch Syslog: All Events (General)"
description_uz: |
  Switchdan kelgan barcha syslog hodisalari.
  Facility, switch nomi, vaqt bo'yicha umumiy ko'rinish.
description_ru: |
  Все события syslog, полученные от switch.
  Общий обзор по facility, имени switch и времени.
description_en: |
  All syslog events received from the switch.
  A general overview by facility, switch name and time.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-switch.syslog-*
query_language: esql
query: |
  FROM logs-switch.syslog-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | STATS
      event_count = COUNT(*),
      last_seen   = MAX(@timestamp),
      first_seen  = MIN(@timestamp)
    BY host.name, log.syslog.facility.name, event.category, event.type
  | KEEP host.name, log.syslog.facility.name, event.category, event.type, event_count, last_seen, first_seen
  | SORT event_count DESC
enabled: true
tags:
  - event.activity
  - switch.overview
severity: low
risk_score: 0