rule_id: 2b4d746a-8b18-41fe-bc15-31487e47b53d
name_uz: "Switch SYSLOG: Console logging to'xtatildi (LOGGINGCNSLSTOP)"
name_ru: "Switch SYSLOG: Console logging остановлен (LOGGINGCNSLSTOP)"
name_en: "Switch SYSLOG: Console Logging Stopped (LOGGINGCNSLSTOP)"
description_uz: |
  Switch konsol terminaliga logging to'xtatildi.
  Bu odatiy boshqaruv harakati, lekin qayd etilishi kerak.
description_ru: |
  Logging на консольный терминал switch был остановлен.
  Это обычное административное действие, но оно должно быть зафиксировано.
description_en: |
  Logging to the switch console terminal was stopped.
  This is a routine administrative action, but it must be recorded.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-switch.syslog-*
query_language: esql
query: |
  FROM logs-switch.syslog-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | MV_EXPAND log.syslog.facility.name
  | WHERE log.syslog.facility.name == "SYSLOG"
  | WHERE event.action == "LOGGINGCNSLSTOP"
  | KEEP @timestamp, host.name, event.action, event.original
  | SORT @timestamp DESC
enabled: true
tags:
  - event.activity
  - switch.config
severity: low
risk_score: 10