rule_id: 624f91a7-cc58-4fa3-a466-a6005c8823f0
name: "Switch NT_GREEN: LLDP yoki EEE holati o'zgardi"
description: |
  Switch LLDP (Link Layer Discovery Protocol) yoki EEE
  (Energy Efficient Ethernet) holati o'zgardi.
  Yangi qurilma ulanganda yoki port holati o'zgarganda keladi.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-switch.syslog-*
query_language: esql
query: |
  FROM logs-switch.syslog-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | MV_EXPAND log.syslog.facility.name
  | WHERE log.syslog.facility.name == "NT_GREEN"
  | KEEP @timestamp, host.name, event.original, event.category, event.type
  | SORT @timestamp DESC
enabled: true
tags:
  - event.activity
  - switch.lldp
severity: low
risk_score: 5
