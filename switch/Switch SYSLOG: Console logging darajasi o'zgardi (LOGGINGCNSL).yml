rule_id: ef51cb35-9234-4be2-8966-17055981d35e
name_uz: "Switch SYSLOG: Console logging darajasi o'zgardi (LOGGINGCNSL)"
name_ru: "Switch SYSLOG: Изменён уровень console logging (LOGGINGCNSL)"
name_en: "Switch SYSLOG: Console Logging Level Changed (LOGGINGCNSL)"
description_uz: |
  Switch konsol logging severity darajasi o'zgartirildi.
  Daraja pasaytirilsa muhim xabarlar ko'rinmay qolishi mumkin.
description_ru: |
  Уровень severity консольного logging на switch был изменён.
  При понижении уровня важные сообщения могут перестать отображаться.
description_en: |
  The switch console logging severity level was changed.
  If the level is lowered, important messages may become invisible.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-switch.syslog-*
query_language: esql
query: |
  FROM logs-switch.syslog-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | MV_EXPAND log.syslog.facility.name
  | WHERE log.syslog.facility.name == "SYSLOG"
  | WHERE event.action == "LOGGINGCNSL"
  | KEEP @timestamp, host.name, event.action, event.original
  | SORT @timestamp DESC
enabled: true
tags:
  - event.activity
  - switch.config
severity: low
risk_score: 10