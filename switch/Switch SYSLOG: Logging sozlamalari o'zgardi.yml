rule_id: e0dedbee-c422-472b-9089-4b5cfcfd7d7e
name_uz: "Switch SYSLOG: Logging sozlamalari o'zgardi"
name_ru: "Switch SYSLOG: Изменены настройки logging"
name_en: "Switch SYSLOG: Logging Settings Changed"
description_uz: |
  Switch logging konfiguratsiyasi o'zgartirildi.
  Buffer level, remote server, severity level o'zgarishlari qayd etiladi.
description_ru: |
  Конфигурация logging на switch была изменена.
  Фиксируются изменения buffer level, remote server, severity level.
description_en: |
  The switch logging configuration was changed.
  Changes to buffer level, remote server and severity level are recorded.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-switch.syslog-*
query_language: esql
query: |
  FROM logs-switch.syslog-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | MV_EXPAND log.syslog.facility.name
  | WHERE log.syslog.facility.name == "SYSLOG"
  | KEEP @timestamp, host.name, event.original, event.category, event.type
  | SORT @timestamp DESC
enabled: true
tags:
  - event.activity
  - switch.config
severity: low
risk_score: 15
