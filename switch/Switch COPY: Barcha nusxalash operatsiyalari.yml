rule_id: 6ba2bcc4-22a8-464c-99d2-43c03cc1efda
name_uz: "Switch COPY: Barcha nusxalash operatsiyalari"
name_ru: "Switch COPY: все операции копирования"
name_en: "Switch COPY: All copy operations"
description_uz: |
  Switch da bajarilgan barcha fayl operatsiyalari.
  Firmware yangilanish, config backup/restore, TFTP/SCP operatsiyalari.
description_ru: |
  Все файловые операции, выполненные на коммутаторе.
  Обновление firmware, config backup/restore, операции TFTP/SCP.
description_en: |
  All file operations performed on the switch.
  Firmware update, config backup/restore, TFTP/SCP operations.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-switch.syslog-*
query_language: esql
query: |
  FROM logs-switch.syslog-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | MV_EXPAND log.syslog.facility.name
  | WHERE log.syslog.facility.name == "COPY"
  | STATS
      event_count = COUNT(*),
      actions     = VALUES(event.action),
      messages    = VALUES(event.original),
      hosts       = VALUES(host.name),
      last_seen   = MAX(@timestamp),
      first_seen  = MIN(@timestamp)
    BY host.name
  | KEEP host.name, event_count, actions, messages, last_seen, first_seen
  | SORT last_seen DESC
enabled: true
tags:
  - event.activity
  - switch.copy
severity: low
risk_score: 15