rule_id: e93a5d86-2001-4ad3-9bc4-b2c1de2d2da1
name_uz: "Switch STCK: Stack unit xabari"
name_ru: "Switch STCK: Сообщение stack unit"
name_en: "Switch STCK: Stack Unit Message"
description_uz: |
  Switch stack dan xabar keldi. Stack a'zolaridan biri holat
  o'zgarishi yoki konfiguratsiya xabari yubordi.
description_ru: |
  Получено сообщение от switch stack. Один из членов stack отправил
  сообщение об изменении состояния или о конфигурации.
description_en: |
  A message was received from the switch stack. One of the stack members sent
  a state change or configuration message.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-switch.syslog-*
query_language: esql
query: |
  FROM logs-switch.syslog-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE host.name RLIKE ".*[Ss]tack.*"
  | KEEP @timestamp, host.name, event.original, event.category, event.type
  | SORT @timestamp DESC
enabled: true
tags:
  - event.activity
  - switch.stack
severity: low
risk_score: 5