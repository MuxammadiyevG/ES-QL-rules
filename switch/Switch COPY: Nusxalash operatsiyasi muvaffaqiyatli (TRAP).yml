rule_id: 686c26bc-ff5d-47a0-bfc6-f5a39024d12a
name_uz: "Switch COPY: Nusxalash operatsiyasi muvaffaqiyatli (TRAP)"
name_ru: "Switch COPY: операция копирования успешна (TRAP)"
name_en: "Switch COPY: Copy operation successful (TRAP)"
description_uz: |
  Switch da fayl nusxalash operatsiyasi (backup, firmware upload,
  config copy va h.k.) muvaffaqiyatli yakunlandi.
  Bu firmware yangilanishi, config backup yoki config restore bo'lishi mumkin.
  SOC triage: Kim bajardi? GCLI logidan tekshiring.
description_ru: |
  Операция копирования файла на коммутаторе (backup, firmware upload,
  config copy и т.д.) успешно завершена.
  Это может быть обновление firmware, config backup или config restore.
  SOC triage: Кто выполнил? Проверьте по логу GCLI.
description_en: |
  A file copy operation on the switch (backup, firmware upload,
  config copy, etc.) completed successfully.
  This may be a firmware update, config backup or config restore.
  SOC triage: Who performed it? Check the GCLI log.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-switch.syslog-*
query_language: esql
query: |
  FROM logs-switch.syslog-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.original RLIKE ".*COPY.*TRAP.*"
  | KEEP @timestamp, host.name, event.action, event.original
  | SORT @timestamp DESC
enabled: true
tags:
  - event.activity
  - switch.copy
severity: low
risk_score: 15
