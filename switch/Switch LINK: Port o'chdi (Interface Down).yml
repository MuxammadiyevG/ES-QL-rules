rule_id: 115e214d-c336-42b4-8cd6-cb1d928939f3
name_uz: "Switch LINK: Port o'chdi (Interface Down)"
name_ru: "Switch LINK: порт отключился (Interface Down)"
name_en: "Switch LINK: Port went down (Interface Down)"
description_uz: |
  Switch portidan qurilma uzildi yoki port o'chirildi.
  Qaysi switchda, qaysi portda yuz berganini qayd etadi.
description_ru: |
  Устройство отключилось от порта коммутатора или порт был выключен.
  Фиксирует, на каком коммутаторе и на каком порту это произошло.
description_en: |
  A device was disconnected from the switch port or the port was disabled.
  Records on which switch and on which port it happened.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-switch.syslog-*
query_language: esql
query: |
  FROM logs-switch.syslog-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | MV_EXPAND log.syslog.facility.name
  | WHERE log.syslog.facility.name == "LINK"
  | WHERE event.type == "end"
  | KEEP @timestamp, host.name, network.interface.name, event.type, event.outcome
  | SORT @timestamp DESC
enabled: true
tags:
  - event.activity
  - switch.link
severity: low
risk_score: 5