rule_id: ps000004-0000-4000-a000-000000000004
name: PowerShell Offensive Tooling
description: |
  Ushbu qoida ScriptBlock (4104) ichida ma'lum hujum freymvorklari/funksiyalarini aniqlaydi:
  Mimikatz, Kerberoast, PowerView/PowerSploit, BloodHound/SharpHound, Rubeus, Invoke-Shellcode,
  Invoke-DCSync, PrintNightmare va h.k.
  SOC triage:
  - `sample_script` qaysi tool? `user`/`host` — darhol triage/izolyatsiya.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-PowerShell/Operational"
  | WHERE event.code == "4104"
  | EVAL script_block = COALESCE(winlog.event_data.ScriptBlockText, "")
  | EVAL actor = COALESCE(winlog.user.name, "-")
  | WHERE TO_LOWER(script_block) RLIKE ".*(mimikatz|invoke-kerberoast|invoke-bloodhound|sharphound|invoke-shellcode|invoke-dcsync|invoke-nightmare|get-netuser|get-domainuser|get-netcomputer|invoke-mimikatz|powersploit|invoke-empire|rubeus|invoke-portscan|invoke-smbexec|invoke-wmiexec|invoke-psexec|out-minidump|get-keystrokes|new-object.system.net.sockets.tcpclient).*"
  | EVAL sb_sample = SUBSTRING(script_block, 1, 400)
  | STATS
      hits = COUNT(*),
      sample_scripts = VALUES(sb_sample),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, actor, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = 95
  | KEEP agent_id, bucket, winlog.computer_name, actor, hits, sample_scripts, dyn_risk, first_seen, last_seen
  | SORT hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.credential-access
  - attack.execution
  - attack.t1059.001
  - attack.t1003
  - PowerShell
severity: critical
risk_score: 95
mitre_attack:
  TA0006:
    T1003: []
  TA0002:
    T1059: ["T1059.001"]
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
