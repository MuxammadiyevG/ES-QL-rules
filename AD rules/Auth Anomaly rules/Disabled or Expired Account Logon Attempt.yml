rule_id: aa000002-0000-4000-a000-000000000002
name: Disabled / Expired / Locked Account Logon Attempt
description: |
  Ushbu qoida o'chirilgan, muddati o'tgan yoki qulflangan akkauntga kirish urinishini
  aniqlaydi (4625, SubStatus): 0xC0000072 (disabled), 0xC0000193 (expired), 0xC0000234
  (locked), 0xC0000070 (workstation restriction), 0xC0000071 (password expired). Eski/o'chirilgan
  akkauntdan foydalanishga urinish shubhali (T1078).
  SOC triage:
  - `target_users` qaysi akkaunt, `src_ips` qayerdan? Nega o'chirilgan akkaunt urinilyapti?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4625"
  | EVAL sub = TO_LOWER(COALESCE(winlog.event_data.SubStatus, "-"))
  | EVAL target_user = winlog.event_data.TargetUserName
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, "-")
  | EVAL reason = CASE(
      sub == "0xc0000072", "Account Disabled",
      sub == "0xc0000193", "Account Expired",
      sub == "0xc0000234", "Account Locked",
      sub == "0xc0000070", "Workstation Restriction",
      sub == "0xc0000071", "Password Expired",
      sub)
  | WHERE sub IN ("0xc0000072", "0xc0000193", "0xc0000234", "0xc0000070", "0xc0000071")
  | WHERE target_user IS NOT NULL AND NOT target_user LIKE "*$"
  | STATS
      attempts = COUNT(*),
      unique_users = COUNT_DISTINCT(target_user),
      target_users = VALUES(target_user),
      src_ips = VALUES(src_ip),
      reasons = VALUES(reason),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE attempts >= 1
  | EVAL dyn_risk = CASE(unique_users >= 3 OR attempts >= 5, 82, 72)
  | KEEP agent_id, bucket, winlog.computer_name, attempts, unique_users, target_users, src_ips, reasons, dyn_risk, first_seen, last_seen
  | SORT dyn_risk DESC, attempts DESC
  | LIMIT 200
enabled: true
tags:
  - attack.initial-access
  - attack.t1078
  - AuthAnomaly
severity: medium
risk_score: 75
mitre_attack:
  TA0001:
    T1078: []
nist: ["AC-7", "AU-12", "SI-4"]
pci_dss: ["10.2.4", "8.1.6"]
gdpr: ["32.1.a"]
