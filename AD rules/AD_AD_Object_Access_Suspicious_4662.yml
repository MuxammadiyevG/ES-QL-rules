rule_id: c4c5e872-d89e-47af-97ff-aa9e8e6ba282
name: AD Suspicious Directory Object Access (4662)
description: |
  Ushbu qoida AD obyektlariga xavfli kengaytirilgan-huquq kirishlarini aniqlaydi: 4662
  `Properties` maydonida User-Force-Change-Password (00299570), User-Change-Password
  (ab721a53) yoki Reanimate-Tombstones (45ec5156) GUID'lari MASHINA bo'lmagan akkaunt
  tomonidan ishlatilsa. Bu ACL abuse / huquq oshirish belgisidir (replikatsiya alohida
  DCSync rule'ida).
  SOC triage:
  - `actor` va `props_seen` — qaysi huquq, qaysi obyektga?
  - Akkauntning bu huquqqa qonuniy ehtiyoji bormi (helpdesk/IAM)?
  - Tasdiqlanmasa: huquqni qaytaring, akkauntni cheklang, tokenlarni bekor qiling.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4662"
  | EVAL actor       = winlog.event_data.SubjectUserName
  | EVAL props       = COALESCE(winlog.event_data.Properties, "")
  | EVAL access_mask = COALESCE(winlog.event_data.AccessMask, "-")
  | EVAL obj         = COALESCE(winlog.event_data.ObjectName, "-")
  | EVAL src_ip      = COALESCE(winlog.event_data.IpAddress, "-")
  | WHERE actor IS NOT NULL AND NOT actor LIKE "*$"
  // Sezgir kengaytirilgan huquqlar; replikatsiyani chiqaramiz (DCSync rule qamrab oladi)
  | WHERE TO_LOWER(props) RLIKE ".*(00299570|ab721a53|45ec5156).*"
  | WHERE NOT TO_LOWER(props) RLIKE ".*(1131f6aa|1131f6ad|89e95b76).*"
  | STATS
      access_count = COUNT(*),
      unique_objects = COUNT_DISTINCT(obj),
      props_seen   = VALUES(props),
      access_masks = VALUES(access_mask),
      src_ips      = VALUES(src_ip),
      first_seen   = MIN(@timestamp),
      last_seen    = MAX(@timestamp)
    BY agent_id, winlog.computer_name, actor, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE access_count >= 1
  | EVAL dyn_risk = CASE(access_count >= 10 OR unique_objects >= 5, 90, access_count >= 3, 85, 80)
  | KEEP agent_id, bucket, winlog.computer_name, actor, access_count, unique_objects,
      props_seen, access_masks, src_ips, dyn_risk, first_seen, last_seen
  | SORT dyn_risk DESC, access_count DESC
  | LIMIT 200
enabled: true
tags:
  - AD
  - Directory Changes
  - Credential Access
severity: high
risk_score: 83
references:
  - "https://attack.mitre.org/techniques/T1222/"
mitre_attack:
  TA0005:
    T1222: ["T1222.001"]
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
