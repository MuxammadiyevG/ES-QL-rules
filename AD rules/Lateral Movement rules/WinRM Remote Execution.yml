rule_id: lm000003-0000-4000-a000-000000000003
name: WinRM / PowerShell Remoting Execution
description: |
  Ushbu qoida WinRM (PowerShell Remoting) orqali masofadan ijroni aniqlaydi: `wsmprovhost.exe`
  yoki `winrshost.exe` bola jarayon ishga tushirsa — bu remote command execution belgisidir
  (T1021.006). Sysmon 1 (ParentImage → Image).
  SOC triage:
  - `children`/`command_lines` qanday? Manba va user kutilganmi (admin remoting)?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "1"
  | EVAL parent = TO_LOWER(COALESCE(winlog.event_data.ParentImage, "-"))
  | EVAL child = TO_LOWER(COALESCE(winlog.event_data.Image, "-"))
  | EVAL cmd = COALESCE(winlog.event_data.CommandLine, "-")
  | EVAL actor = COALESCE(winlog.event_data.User, "-")
  | WHERE parent RLIKE ".*(wsmprovhost|winrshost).exe"
  | WHERE NOT child RLIKE ".*(conhost|csc|cvtres).exe"
  | EVAL is_susp_child = CASE(child RLIKE ".*(cmd|powershell|pwsh|mshta|rundll32|regsvr32|certutil|wscript|cscript|net1|whoami).exe", 1, 0)
  | STATS
      exec_count = COUNT(*),
      susp_children = SUM(is_susp_child),
      children = VALUES(child),
      command_lines = VALUES(cmd),
      parents = VALUES(parent),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE exec_count >= 1
  | EVAL dyn_risk = CASE(susp_children >= 1, 82, 68)
  | KEEP agent_id, bucket, winlog.computer_name, exec_count, susp_children, children, command_lines, parents, users, dyn_risk, first_seen, last_seen
  | SORT dyn_risk DESC, exec_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.lateral-movement
  - attack.execution
  - attack.t1021.006
  - Lateral Movement
severity: medium
risk_score: 75
mitre_attack:
  TA0008:
    T1021: ["T1021.006"]
nist: ["AC-17", "AU-2", "AU-12", "SI-4"]
pci_dss: ["10.2.5", "8.1.6"]
gdpr: ["32.1.a"]
