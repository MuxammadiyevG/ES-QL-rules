rule_id: 7764b5dd-5cea-4c89-9fe9-2202b916cf7c
name: AD Service Installed on Domain Controller (7045)
description: |
  Ushbu qoida yangi servis o'rnatilishini aniqlaydi (7045 — Service Control Manager,
  "System" kanalida). Yangi servis hujumchiga reboot'dan keyin saqlanadigan persistence va
  ko'pincha masofadan kod ijro etish (PsExec, lateral movement) imkonini beradi.
  Qonuniy holatlar: EDR/backup/monitoring agentlari, patch management.
  SOC triage:
  - `service_name`/`service_path` — binar qayerda, nomi shubhalimi?
  - Shubhali yo'l (temp/appdata/programdata) yoki interpretator (powershell/cmd) bormi (`suspicious`)?
  - Tasdiqlanmasa: servisni to'xtating/o'chiring, hostni tekshiring.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "System"
  | WHERE event.code == "7045"
  | EVAL service_name = COALESCE(winlog.event_data.ServiceName, "-")
  | EVAL service_path = COALESCE(winlog.event_data.ImagePath, "-")
  | EVAL service_account = COALESCE(winlog.event_data.AccountName, "-")
  | EVAL start_type   = COALESCE(winlog.event_data.StartType, "-")
  | EVAL suspicious = CASE(
      TO_LOWER(service_path) RLIKE ".*(temp|appdata|programdata|users.public|powershell|cmd.exe|wscript|cscript|mshta|rundll32|regsvr32|encodedcommand|frombase64).*", 1, 0)
  | STATS
      install_count = COUNT(*),
      services      = VALUES(service_name),
      service_paths = VALUES(service_path),
      accounts      = VALUES(service_account),
      start_types   = VALUES(start_type),
      suspicious_hits = SUM(suspicious),
      first_install = MIN(@timestamp),
      last_install  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE install_count >= 1
  | EVAL dyn_risk = CASE(suspicious_hits >= 1, 93, 80)
  | KEEP agent_id, bucket, winlog.computer_name, install_count, services, service_paths,
      accounts, start_types, suspicious_hits, dyn_risk, first_install, last_install
  | SORT dyn_risk DESC, install_count DESC
  | LIMIT 200
enabled: true
tags:
  - AD
  - Persistence
  - Service Creation
severity: high
risk_score: 84
references:
  - "https://attack.mitre.org/techniques/T1543/003/"
mitre_attack:
  TA0003:
    T1543: ["T1543.003"]
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
