rule_id: ada00003-0000-4000-a000-000000000003
name: Computer Account Created (MachineAccountQuota Abuse)
description: |
  Ushbu qoida yangi computer account yaratilishini (4741) aniqlaydi. Oddiy domen foydalanuvchisi
  (admin emas) computer account yaratsa — bu MachineAccountQuota suiiste'mol (RBCD, sAMAccount
  spoofing / noPac CVE-2021-42278) belgisi bo'lishi mumkin.
  SOC triage:
  - `creators` kim — admin/provisioning xizmatimi yoki oddiy user? `new_computers` qanday nomlar?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4741"
  | EVAL new_computer = COALESCE(winlog.event_data.TargetUserName, "-")
  | EVAL creator = COALESCE(winlog.event_data.SubjectUserName, "-")
  | EVAL creator_domain = COALESCE(winlog.event_data.SubjectDomainName, "-")
  | WHERE creator IS NOT NULL AND NOT creator LIKE "*$"
  | STATS
      created = COUNT(*),
      new_computers = VALUES(new_computer),
      creators = VALUES(creator),
      creator_domains = VALUES(creator_domain),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, creator, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE created >= 1
  | EVAL dyn_risk = CASE(created >= 5, 82, 70)
  | KEEP agent_id, bucket, winlog.computer_name, creator, created, new_computers, creators, creator_domains, dyn_risk, first_seen, last_seen
  | SORT dyn_risk DESC, created DESC
  | LIMIT 200
enabled: true
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1136.002
  - AD-advanced
severity: medium
risk_score: 70
mitre_attack:
  TA0003:
    T1136: ["T1136.002"]
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
