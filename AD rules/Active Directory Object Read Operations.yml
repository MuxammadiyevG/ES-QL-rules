rule_id: ca4f0dd4-11bf-4ba8-8c11-9db181309981
name: Active Directory Object Read Operations
description: |
  Baseline/monitoring qoidasi: MASHINA bo'lmagan akkauntlar tomonidan AD obyektlariga
  kirish (4662) hodisalarini soatlik yig'adi. Directory access'ning normal darajasini
  belgilash uchun (alert emas, kontekst/threat-hunting).
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4662"
  | EVAL accessing_user = winlog.event_data.SubjectUserName
  | EVAL object_type = COALESCE(winlog.event_data.ObjectType, "-")
  | EVAL object_name = COALESCE(winlog.event_data.ObjectName, "-")
  | EVAL access_mask = COALESCE(winlog.event_data.AccessMask, "-")
  | WHERE accessing_user IS NOT NULL AND NOT accessing_user LIKE "*$"
  | WHERE NOT TO_LOWER(accessing_user) RLIKE "(system|local service|network service)"
  | STATS
      read_count = COUNT(*),
      unique_objects = COUNT_DISTINCT(object_name),
      users = VALUES(accessing_user),
      object_types = VALUES(object_type),
      access_masks = VALUES(access_mask),
      first_read = MIN(@timestamp),
      last_read  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE read_count >= 1
  | KEEP agent_id, bucket, winlog.computer_name, read_count, unique_objects, users,
      object_types, access_masks, first_read, last_read
  | SORT read_count DESC
  | LIMIT 200
enabled: false
tags:
  - detection.baseline
  - monitoring.directory-access
severity: low
risk_score: 30
nist: ["AC-6", "AU-12", "AC-2"]
pci_dss: ["7.1", "7.2", "10.2.2"]
gdpr: ["32.1.a", "32.1.b"]
mitre_attack: []
