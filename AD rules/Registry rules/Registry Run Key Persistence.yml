rule_id: reg00001-0000-4000-a000-000000000001
name: Registry Run / RunOnce Key Persistence
description: |
  Ushbu qoida Run/RunOnce autostart kalitlariga yozishni aniqlaydi (Sysmon 13). Bu eng keng
  tarqalgan persistence mexanizmi (T1547.001).
  SOC triage:
  - `target_objects` qaysi kalit, `details` qanday qiymat (bajariluvchi)? Qonuniy o'rnatishmi?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "13"
  | EVAL tobj = TO_LOWER(COALESCE(winlog.event_data.TargetObject, "-"))
  | EVAL details = COALESCE(winlog.event_data.Details, "-")
  | EVAL img = COALESCE(winlog.event_data.Image, "-")
  | EVAL actor = COALESCE(winlog.event_data.User, "-")
  | WHERE tobj RLIKE ".*currentversion.run.*"
  | EVAL is_susp = CASE(TO_LOWER(details) RLIKE ".*(temp|appdata|powershell|cmd\\.exe|mshta|rundll32|\\.vbs|\\.ps1|\\.bat|frombase64).*", 1, 0)
  | STATS
      hits = COUNT(*),
      susp_hits = SUM(is_susp),
      target_objects = VALUES(tobj),
      details = VALUES(details),
      images = VALUES(img),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = CASE(susp_hits >= 1, 85, 65)
  | KEEP agent_id, bucket, winlog.computer_name, hits, susp_hits, target_objects, details, images, users, dyn_risk, first_seen, last_seen
  | SORT dyn_risk DESC, hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.persistence
  - attack.t1547.001
  - Registry
severity: medium
risk_score: 70
mitre_attack:
  TA0003:
    T1547: ["T1547.001"]
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
