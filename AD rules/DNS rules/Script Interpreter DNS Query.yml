rule_id: dns00005-0000-4000-a000-000000000005
name: Script Interpreter / LOLBin DNS Query
description: |
  Ushbu qoida skript interpretatori yoki LOLBin (powershell, mshta, rundll32, regsvr32,
  certutil, wscript, cscript, bitsadmin) tashqi domenga DNS so'rashini aniqlaydi (Sysmon 22)
  — C2 yoki tool yuklash belgisi. Ichki/Microsoft domenlari chiqarilgan.
  SOC triage:
  - `image` + `domains` — qaysi jarayon qayerga? Qonuniy skriptmi?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "22"
  | EVAL qn = TO_LOWER(COALESCE(winlog.event_data.QueryName, "-"))
  | EVAL img = TO_LOWER(COALESCE(winlog.event_data.Image, "-"))
  | EVAL actor = COALESCE(winlog.event_data.User, "-")
  | WHERE img RLIKE ".*(powershell|pwsh|mshta|rundll32|regsvr32|certutil|wscript|cscript|bitsadmin|installutil|msbuild).exe"
  | WHERE qn != "-"
  | WHERE NOT qn RLIKE ".*(microsoft|windows|msftncsi|csecdc\\.uz|\\.local|digicert|windowsupdate|powershellgallery|nuget|azureedge).*"
  | STATS
      hits = COUNT(*),
      unique_domains = COUNT_DISTINCT(qn),
      domains = VALUES(qn),
      images = VALUES(img),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = 82
  | KEEP agent_id, bucket, winlog.computer_name, hits, unique_domains, domains, images, users, dyn_risk, first_seen, last_seen
  | SORT hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.command-and-control
  - attack.t1071.004
  - DNS
severity: high
risk_score: 82
mitre_attack:
  TA0011:
    T1071: ["T1071.004"]
nist: ["SI-4", "AU-12", "SC-7"]
pci_dss: ["10.2.7", "11.4", "1.3"]
gdpr: ["32.1.a"]
