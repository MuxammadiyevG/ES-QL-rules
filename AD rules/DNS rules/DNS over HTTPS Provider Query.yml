rule_id: dns00004-0000-4000-a000-000000000004
name: DNS-over-HTTPS Provider Query
description: |
  Ushbu qoida ma'lum DoH (DNS-over-HTTPS) provayderlariga so'rovni aniqlaydi (Sysmon 22):
  cloudflare-dns.com, dns.google, quad9, nextdns, adguard-dns. DoH korporativ DNS
  monitoringini chetlab o'tish uchun ishlatiladi (T1572/T1071.004).
  SOC triage:
  - Qaysi jarayon (`images`) DoH ishlatyapti? Korporativ siyosatga ziddmi?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "22"
  | EVAL qn = TO_LOWER(COALESCE(winlog.event_data.QueryName, "-"))
  | EVAL img = COALESCE(winlog.event_data.Image, "-")
  | WHERE qn RLIKE ".*(cloudflare-dns\\.com|mozilla\\.cloudflare-dns\\.com|dns\\.google|dns\\.quad9\\.net|dns\\.nextdns\\.io|.*\\.adguard-dns\\.com|doh\\..*|dns\\.adguard\\.com)"
  | STATS
      hits = COUNT(*),
      domains = VALUES(qn),
      images = VALUES(img),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = 68
  | KEEP agent_id, bucket, winlog.computer_name, hits, domains, images, dyn_risk, first_seen, last_seen
  | SORT hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.command-and-control
  - attack.defense-evasion
  - attack.t1572
  - DNS
severity: medium
risk_score: 68
mitre_attack:
  TA0011:
    T1572: []
nist: ["SI-4", "AU-12", "SC-7"]
pci_dss: ["10.2.7", "11.4", "1.3"]
gdpr: ["32.1.a"]
