rule_id: rdp00001-0000-4000-a000-000000000001
name: RDP Brute Force - Failed Interactive Logons
description: |
  Ushbu qoida RDP (LogonType 10) bo'yicha bitta manbadan ko'p muvaffaqiyatsiz logon (4625)
  urinishlarini aniqlaydi — RDP parol brute force belgisidir.
  SOC triage:
  - `src_ip` manbasi (reputatsiya/geo), `users` nishonlar; tashqi IP bo'lsa darhol bloklang.
  - Keyin shu IP'dan muvaffaqiyatli 4624 Type 10 bo'lganini tekshiring (egallab olingan?).
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4625"
  | WHERE winlog.event_data.LogonType == "10"
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, "-")
  | EVAL victim = winlog.event_data.TargetUserName
  | EVAL status = COALESCE(winlog.event_data.Status, "-")
  | WHERE src_ip != "-" AND src_ip != "::1" AND src_ip != "127.0.0.1"
  | WHERE victim IS NOT NULL AND NOT victim LIKE "*$"
  | STATS
      fail_count = COUNT(*),
      unique_users = COUNT_DISTINCT(victim),
      users = VALUES(victim),
      status_codes = VALUES(status),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, src_ip, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE fail_count >= 10
  | EVAL dyn_risk = CASE(fail_count >= 30 OR unique_users >= 10, 88, fail_count >= 20, 82, 75)
  | KEEP agent_id, bucket, winlog.computer_name, src_ip, fail_count, unique_users, users,
      status_codes, dyn_risk, first_seen, last_seen
  | SORT dyn_risk DESC, fail_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.credential-access
  - attack.t1110
  - RDP
severity: high
risk_score: 80
mitre_attack:
  TA0006:
    T1110: []
nist: ["AU-2", "AU-12", "AC-7", "IA-2"]
pci_dss: ["10.2.4", "10.2.5", "8.1.6"]
gdpr: ["32.1.a", "32.2"]
