rule_id: inj00004-0000-4000-a000-000000000004
name: Security Service Start Type Changed
description: |
  Ushbu qoida xavfsizlik xizmatining ishga tushish turi o'zgartirilishini aniqlaydi (System
  7040) — Windows Defender (WinDefend/WdNisSvc), Defender ATP (Sense), Firewall (MpsSvc),
  EventLog yoki Sysmon. "Disabled"ga o'zgartirish himoyani o'chiradi (T1562.001).
  Eslatma: start-type qiymatlari lokalizatsiyalangan bo'lishi mumkin — xizmat NOMI (param4)
  bo'yicha aniqlanadi; `old`/`new` qiymatlarini qo'lda solishtiring.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "System"
  | WHERE event.code == "7040"
  | EVAL svc = TO_LOWER(COALESCE(winlog.event_data.param4, "-"))
  | EVAL display = COALESCE(winlog.event_data.param1, "-")
  | EVAL old_type = COALESCE(winlog.event_data.param2, "-")
  | EVAL new_type = COALESCE(winlog.event_data.param3, "-")
  | WHERE svc RLIKE ".*(windefend|wdnissvc|sense|securityhealthservice|mpssvc|wscsvc|eventlog|sysmon|sysmon64|wdboot|wdfilter).*"
  | STATS
      hits = COUNT(*),
      services = VALUES(display),
      service_keys = VALUES(svc),
      old_types = VALUES(old_type),
      new_types = VALUES(new_type),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = 85
  | KEEP agent_id, bucket, winlog.computer_name, hits, services, service_keys, old_types, new_types, dyn_risk, first_seen, last_seen
  | SORT hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1562.001
  - System
severity: high
risk_score: 85
mitre_attack:
  TA0005:
    T1562: ["T1562.001"]
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
