rule_id: ep000006-0000-4000-a000-000000000006
name: UAC Bypass via Auto-Elevated Process
description: |
  Ushbu qoida UAC bypass'ni aniqlaydi: auto-elevate qiluvchi tizim binarlari (fodhelper,
  eventvwr, sdclt, computerdefaults, silentcleanup, wsreset, slui) shell/skript ishga
  tushirsa — bu yuqori integrity'ga ko'tarilish uchun ishlatiladi (T1548.002). Sysmon 1.
  SOC triage:
  - `parent` (auto-elevated) → `child` zanjiri; `integrity` High/System bo'lsa tasdiq.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "1"
  | EVAL parent = TO_LOWER(COALESCE(winlog.event_data.ParentImage, "-"))
  | EVAL child = TO_LOWER(COALESCE(winlog.event_data.Image, "-"))
  | EVAL cmd = COALESCE(winlog.event_data.CommandLine, "-")
  | EVAL integrity = COALESCE(winlog.event_data.IntegrityLevel, "-")
  | EVAL actor = COALESCE(winlog.event_data.User, "-")
  | WHERE parent RLIKE ".*(fodhelper|eventvwr|sdclt|computerdefaults|silentcleanup|wsreset|slui|cmstp).exe"
  | WHERE child RLIKE ".*(cmd|powershell|pwsh|wscript|cscript|mshta|rundll32|regsvr32).exe"
  | STATS
      exec_count = COUNT(*),
      command_lines = VALUES(cmd),
      parents = VALUES(parent),
      children = VALUES(child),
      integrities = VALUES(integrity),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE exec_count >= 1
  | EVAL dyn_risk = 88
  | KEEP agent_id, bucket, winlog.computer_name, exec_count, command_lines, parents, children, integrities, users, dyn_risk, first_seen, last_seen
  | SORT exec_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.privilege-escalation
  - attack.defense-evasion
  - attack.t1548.002
  - Sysmon
severity: high
risk_score: 88
mitre_attack:
  TA0004:
    T1548: ["T1548.002"]
nist: ["SI-4", "AU-12", "AC-6"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
