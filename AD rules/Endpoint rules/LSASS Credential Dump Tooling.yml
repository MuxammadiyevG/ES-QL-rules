rule_id: ep000004-0000-4000-a000-000000000004
name: LSASS Credential Dump Tooling
description: |
  Ushbu qoida LSASS xotirasidan credential dump qilish toollarini aniqlaydi (command-line
  bo'yicha): `procdump ... lsass`, `comsvcs.dll MiniDump`, `rundll32 ... lsass`, `sqldumper`,
  `Out-Minidump`. T1003.001. Sysmon 1.
  SOC triage:
  - DARHOL: host'ni izolyatsiya qiling, kirgan akkauntlarni reset qiling.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "1"
  | EVAL cmd = TO_LOWER(COALESCE(winlog.event_data.CommandLine, "-"))
  | EVAL img = TO_LOWER(COALESCE(winlog.event_data.Image, "-"))
  | EVAL actor = COALESCE(winlog.event_data.User, "-")
  | WHERE cmd RLIKE ".*(procdump.*lsass|lsass.*procdump|comsvcs.*minidump|rundll32.*comsvcs|rundll32.*minidump|sqldumper.*lsass|out-minidump|nanodump|mimikatz|sekurlsa).*"
      OR (cmd RLIKE ".*lsass.*" AND img RLIKE ".*(procdump|rundll32|tasklist|createdump).exe")
  | STATS
      exec_count = COUNT(*),
      command_lines = VALUES(cmd),
      images = VALUES(img),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE exec_count >= 1
  | EVAL dyn_risk = 97
  | KEEP agent_id, bucket, winlog.computer_name, exec_count, command_lines, images, users, dyn_risk, first_seen, last_seen
  | SORT exec_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.credential-access
  - attack.t1003.001
  - Sysmon
severity: critical
risk_score: 97
mitre_attack:
  TA0006:
    T1003: ["T1003.001"]
nist: ["SI-4", "AU-12", "AC-6"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a", "32.1.b"]
