rule_id: c3ca9c3e-42cd-4e89-bc4c-8141a9c92e65
name: Suspicious Kerberos Delegation Activity
description: |
  Ushbu qoida Kerberos delegation (S4U2Self/S4U2Proxy) faoliyatini aniqlaydi: 4769 TGS
  so'rovida `TransmittedServices` to'ldirilgan bo'lsa — bu constrained/protocol-transition
  delegatsiya ishlatilganini bildiradi. Hujumchi buzilgan delegatsiya huquqi orqali boshqa
  foydalanuvchi nomidan servislarga kirishi mumkin (lateral movement).
  Qonuniy holatlar: web/SQL front-end servislar uchun sozlangan constrained delegation.
  SOC triage:
  - `requestor` delegatsiyaga ruxsat berilgan akkauntmi (msDS-AllowedToDelegateTo)?
  - `services` va `transmitted_list` — qaysi servisga, kim nomidan?
  - Tasdiqlanmasa: delegatsiya sozlamasini olib tashlang, akkauntni cheklang.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4769"
  // Ixtiyoriy DC scoping:
  // | WHERE TO_LOWER(winlog.computer_name) RLIKE ".*(dc[0-9]|addc|domaincontroller).*"
  | EVAL requestor    = winlog.event_data.TargetUserName
  | EVAL service_name = COALESCE(winlog.event_data.ServiceName, "-")
  | EVAL transmitted  = COALESCE(winlog.event_data.TransmittedServices, "-")
  | EVAL ticket_opts  = COALESCE(winlog.event_data.TicketOptions, "-")
  | EVAL src_ip       = COALESCE(winlog.event_data.IpAddress, "-")
  // TransmittedServices faqat S4U (delegatsiya) so'rovlarida to'ladi
  | WHERE transmitted != "-" AND transmitted != ""
  | WHERE requestor IS NOT NULL
  | STATS
      delegation_requests = COUNT(*),
      services_accessed   = COUNT_DISTINCT(service_name),
      services            = VALUES(service_name),
      transmitted_list    = VALUES(transmitted),
      ticket_options      = VALUES(ticket_opts),
      src_ips             = VALUES(src_ip),
      first_seen          = MIN(@timestamp),
      last_seen           = MAX(@timestamp)
    BY agent_id, winlog.computer_name, requestor, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE delegation_requests >= 3
  | EVAL dyn_risk = CASE(services_accessed >= 5, 85, 75)
  | KEEP agent_id, bucket, winlog.computer_name, requestor, delegation_requests, services_accessed,
      services, transmitted_list, ticket_options, src_ips, dyn_risk, first_seen, last_seen
  | SORT dyn_risk DESC, delegation_requests DESC
  | LIMIT 200
enabled: true
tags:
  - attack.credential-access
  - attack.lateral-movement
  - attack.t1558
  - detection.emerging-threats
severity: high
risk_score: 75
mitre_attack:
  TA0006:
    T1558: []
  TA0008:
    T1550: ["T1550.003"]
nist: ["AC-17", "AU-2", "AU-12", "SI-4"]
pci_dss: ["10.2.5", "8.1.6"]
gdpr: ["32.1.a"]
