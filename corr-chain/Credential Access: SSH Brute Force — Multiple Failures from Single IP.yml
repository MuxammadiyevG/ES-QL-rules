rule_id: 7f58b742-0310-4512-a35a-5160bdab7fe0
name: "Credential Access: SSH Brute Force — Multiple Failures from Single IP"
description: |
  Bitta IP manzildan qisqa vaqt ichida ko'p SSH login failure bo'lsa aniqlaydi.
  Bu chain uchun Stage 1 hisoblanadi.
type: esql
params: "{}"
schedule_interval: 1m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 2 minutes
  | WHERE auditd.message_type == "user_login"
    AND auditd.result == "fail"
    AND auditd.data.op == "login"
    AND auditd.data.terminal == "sshd"
    AND source.ip IS NOT NULL
  | KEEP
      @timestamp,
      agent_id,
      source.ip,
      auditd.data.acct,
      host.hostname,
      auditd.message_type,
      auditd.result,
      auditd.data.op,
      auditd.data.terminal
enabled: true
tags:
  - attack.credential-access
  - attack.t1110.001
  - ssh
  - brute-force
  - auditd
  - correlation
  - chain
severity: medium
risk_score: 70
max_signals: 100
correlation:
  enabled: true
  same_fields:
    - source.ip
  frequency: 6
  timeframe_sec: 60
  dedup_fields:
    - source.ip
    - auditd.data.acct
    - host.hostname
  ignore_sec: 60
  escalate_severity: high
chain:
  enabled: true
  stage: 1
  timeframe_sec: 3600
references:
  - "https://attack.mitre.org/techniques/T1110/001/"
nist: ["AC-7", "AC-2", "AU-2", "AU-6", "SI-4", "IR-4"]
pci_dss: ["8.1.6", "8.3", "10.2.4", "10.2.5", "11.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0006:
    T1110: ["T1110.001"]
