rule_id: "a5fbb760-9abc-47e1-a998-81880b05152c"

name_uz: "Shubhali Linux buyruqlarini aniqlash"
name_ru: "Обнаружение подозрительных команд Linux"
name_en: "Suspicious Linux Commands Detection"

description_uz: |
  Linux tizimlarida ko'pincha zararli dastur yoki xakerlik faoliyati bilan bog'liq buyruqlarni aniqlaydi.
  Bunga xavfli ruxsat o'zgarishlari (chmod 777, setuid) va imtiyozlarni oshirishda ko'p ishlatiladigan shell nusxalash kiradi.
  Eslatma: qonuniy admin faoliyatidan noto'g'ri ishlashlar (false positive) bo'lishi mumkin. Kontekstni diqqat bilan ko'rib chiqing.
description_ru: |
  Обнаруживает команды, часто связанные с вредоносным ПО или хакерской активностью в системах Linux.
  Сюда входят опасные изменения прав доступа (chmod 777, setuid) и копирование оболочки, часто используемые при повышении привилегий.
  Примечание: возможны ложные срабатывания из-за легитимных действий администраторов. Внимательно анализируйте контекст.
description_en: |
  Detects relevant commands often related to malware or hacking activity on Linux systems.
  This includes dangerous permission changes (chmod 777, setuid) and shell copying which are often used in privilege escalation.
  Note: May generate false positives from legitimate admin activity. Review context carefully.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd execve telemetry */
  | WHERE event.action == "executed"
  /* selection: suspicious commands */
  | WHERE (
      /* cmd1: chmod 777 - world writable/executable */
      (process.name == "chmod" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*[^a-z0-9_]777[^a-z0-9_].*")
      /* cmd2: chmod u+s - setuid bit */
      OR (process.name == "chmod" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*u\\+s.*")
      /* cmd3/cmd4: copying shells */
      OR (process.name == "cp" AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*/bin/(ksh|sh).*")
    )
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      executables = VALUES(process.executable),
      file_paths = VALUES(file.path),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, executables, file_paths, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.execution
  - attack.t1059.004
  - detection.threat-hunting
severity: medium
risk_score: 60
references:
  - "Internal Research - mostly derived from exploit code including code in MSF"
  - "https://attack.mitre.org/techniques/T1059/004/"
nist: ["SI-4", "AU-12", "AC-6"]
pci_dss: ["10.2", "7.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0002:
    T1059: ["T1059.004"]
