rule_id: "1649c561-a3de-4daf-a748-f955c9e7abc1"

name_uz: "Foydalanuvchilarni aniqlash (discovery) — Linux"
name_ru: "Обнаружение перечисления пользователей — Linux"
name_en: "User Discovery - Linux"

description_uz: |
  Foydalanuvchilarni sanab chiqish va aniqlash buyruqlarini aniqlaydi.
  Hujumchilar nishonga olish uchun foydalanuvchi hisoblarini aniqlashga urinishi mumkin.
description_ru: |
  Обнаруживает команды перечисления и разведки пользователей.
  Злоумышленники могут пытаться выявить учётные записи для дальнейших атак.
description_en: |
  Detects user enumeration and discovery commands.
  Adversaries may attempt to identify user accounts for targeting.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE event.action == "executed"
  | WHERE process.name IN ("who", "w", "users", "id", "lastlog", "last")
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(process.title),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE event_count >= 5
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, command_lines, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.discovery
  - attack.t1033
severity: low
risk_score: 30
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0007:
    T1033: []
