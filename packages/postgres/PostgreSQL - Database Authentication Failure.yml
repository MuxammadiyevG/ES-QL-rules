rule_id: 77101ee2-2cc0-46a6-af74-eac961453c71
name: PostgreSQL - Database Authentication Failure
description: |
  Ushbu qoida PostgreSQL da muvaffaqiyatsiz autentifikatsiya hodisalarini kuzatadi (Rule 50512).
  Takroriy muvaffaqiyatsiz urinishlar brute-force yoki credential stuffing hujumiga ishora qiladi (T1078).
  Qonuniy holatlar: xato kiritilgan parol, servis konfiguratsiya xatosi.
  SOC triage bosqichlari:
  - `actor` (user.name) va `db.name` ni tekshiring.
  - `source.ip` manzilini tekshiring — bir IP dan ko'p urinish bormi.
  - Muvaffaqiyatsiz urinishlardan keyin muvaffaqiyatli kirish borligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa: IP ni bloklang, credentiallarni yangilang.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-postgresql.log-*
query_language: esql
query: |
  FROM logs-postgresql.log-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE data_stream.dataset == "postgresql.log"
  | WHERE event.action == "postgres-auth-failed"
  | WHERE event.outcome == "failure"
  | WHERE postgresql.log.severity == "FATAL"
  | WHERE TO_LOWER(postgresql.log.message) RLIKE ".*(password authentication failed|authentication failed).*"
  | EVAL actor    = COALESCE(user.name, "Unknown")
  | EVAL db       = COALESCE(db.name, "Unknown")
  | EVAL hostn    = COALESCE(host.hostname, "Unknown")
  | EVAL pg_level = COALESCE(postgresql.log.severity, "Unknown")
  | EVAL pg_msg   = COALESCE(postgresql.log.message, "Unknown")
  | EVAL pid      = COALESCE(process.pid, 0)
  | STATS
      fail_count  = COUNT(*),
      databases   = VALUES(db),
      pg_levels   = VALUES(pg_level),
      messages    = VALUES(pg_msg),
      pids        = VALUES(pid),
      hosts       = VALUES(hostn),
      first_seen  = MIN(@timestamp),
      last_seen   = MAX(@timestamp)
    BY agent_id, actor, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE fail_count >= 5
  | KEEP agent_id, bucket, actor, fail_count, databases,
         pg_levels, messages, pids, hosts, first_seen, last_seen
  | SORT fail_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.credential_access
  - attack.t1110
  - detection.postgresql
severity: high
risk_score: 73
nist: ["AU-2", "AU-12", "AU-14", "AC-7"]
pci_dss: ["10.2.4", "10.2.5", "8.1.6"]
gdpr: ["32.1.a", "32.2", "35.7.d"]
mitre_attack:
  TA0006:
    T1110:[]