rule_id: 077c82a9-9fbe-4c17-818f-ff8d6f2322a4
name: "Kerio: Non-Standard High Port Outbound Connection Allowed"
description: |
  Ushbu qoida ichki hostlardan 1024 dan yuqori, standart bo'lmagan portlarga
  ruxsat berilgan TCP ulanishlarini aniqlaydi. C2 frameworklar ko'pincha
  8886, 4444, 8888 kabi portlardan foydalanadi.
  SOC triage bosqichlari:
  - destination.ip va destination.port ni threat intel bilan solishtiring.
  - source.ip host qaysi dastur ishlatayotganini aniqlang.
  - Bir xil dst IP ga takroriy ulanishlar shubhali.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-kerio.control-*
query_language: esql
query: |
  FROM logs-kerio.control-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.action == "allow"
  | WHERE network.transport == "tcp"
  | WHERE destination.port > 1024
  | WHERE destination.port NOT IN (
      1433, 1521, 3306, 3389, 3128, 5432, 5985,
      5986, 6379, 8080, 8443, 8888, 9200, 27017
    )
  | WHERE destination.port != 443
  | WHERE destination.port != 80
  | EVAL _src = TO_STRING(source.ip)
  | EVAL src_ip = CASE(_src IS NULL, "Unknown", _src)
  | EVAL _dst = TO_STRING(destination.ip)
  | EVAL dst_ip = CASE(_dst IS NULL, "Unknown", _dst)
  | WHERE src_ip != "Unknown"
  | WHERE src_ip != "0.0.0.0"
  | STATS
      conn_count   = COUNT(*),
      dst_ips      = VALUES(destination.ip),
      dst_ports    = VALUES(destination.port),
      tcp_flags    = VALUES(kerio.control.tcp_flags),
      rule_names   = VALUES(rule.name),
      last_seen    = MAX(@timestamp),
      first_seen   = MIN(@timestamp)
    BY src_ip, dst_ip, destination.port
  | WHERE conn_count >= 3
  | EVAL dst_port = destination.port
  | KEEP
      src_ip, dst_ip, dst_port, conn_count,
      dst_ips, dst_ports, tcp_flags, rule_names,
      last_seen, first_seen
  | SORT conn_count DESC
enabled: true
tags:
  - attack.command-and-control
  - attack.t1572
  - detection.threat-hunting
severity: medium
risk_score: 60
references:
  - "https://attack.mitre.org/techniques/T1572/"
nist: ["SC-7", "SI-4", "AU-12"]
pci_dss: ["1.3", "10.6.1", "11.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0011:
    T1572: []