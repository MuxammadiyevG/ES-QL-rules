rule_id: 290a5a94-8e9a-45d5-b641-f3fd5f132d86
name: ESET Protect - Unhandled Security Threats
description: |
  Ushbu qoida ESET tomonidan detect qilingan lekin handle qilinmagan threat'larni aniqlaydi.
  Bu incomplete remediation yoki persistent threat belgisi.
  Qonuniy holatlar: user postponement, manual intervention required, policy configuration.
  SOC triage bosqichlari:
  - Unhandled threat type va reason'ni aniqlang
  - Threat persistence duration'ni tahlil qiling
  - Manual intervention requirement'ni assess qiling
  - Host compromise risk'ini baholang
  - Force remediation yoki isolation zarurligini aniqlang
type: esql
params: '{}'
schedule_interval: 15m
index:
- logs-eset.protect-*
query_language: esql
query: |
  FROM logs-eset.protect-*
  | WHERE @timestamp >= NOW() - 45 minutes
  | WHERE event.category == "Threat_Event"
  | WHERE eset_protect.threat_handled == false OR eset_protect.handled == false
  | WHERE TO_LOWER(COALESCE(eset_protect.severity, "")) RLIKE ".*(warning|critical|fatal).*"
  | STATS
      event_count = COUNT(*),
      threat_names = VALUES(rule.name),
      threat_types = VALUES(eset_protect.threat_type),
      object_uris = VALUES(eset_protect.object_uri),
      object_types = VALUES(eset_protect.object_type),
      severities = VALUES(eset_protect.severity),
      actions_taken = VALUES(eset_protect.action_taken),
      processes = VALUES(eset_protect.process_name),
      users = VALUES(eset_protect.user)
    BY host.name, source.ip, bucket = DATE_TRUNC(15 minutes, @timestamp)
  | WHERE event_count >= 3
  | KEEP bucket, host.name, source.ip, event_count, threat_names, threat_types, object_uris, object_types, severities, actions_taken, processes, users
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.persistence
- attack.t1547
- eset
- unhandled-threat
- incomplete-remediation
severity: high
risk_score: 75
references:
- "https://attack.mitre.org/techniques/T1547/"
nist: ["SI-3", "IR-4"]
pci_dss: ["5.2", "10.6.1"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0003:
    T1547: []