rule_id: 09486d9d-c41a-4582-bfd8-26c77eaf5353
name: ESET Protect - Multiple Device Shutdown or Reboot Tasks
description: |
  Ushbu qoida ESET device management orqali bir nechta device'larga shutdown/reboot task'larni aniqlaydi.
  Bu unauthorized management action yoki insider threat belgisi bo'lishi mumkin (T1529).
  Qonuniy holatlar: scheduled maintenance, patch deployment, legitimate administrative tasks.
  SOC triage bosqichlari:
  - Task creator identity va authorization'ni verify qiling
  - Target device list va business impact'ni baholang
  - Task description va trigger time'ni review qiling
  - Change management approval borligini tekshiring
  - Unauthorized access yoki credential compromise belgilari
type: esql
params: '{}'
schedule_interval: 15m
index:
- logs-eset.protect-*
query_language: esql
query: |
  // HEURISTIC / BEST-EFFORT: There is no eset_protect.device_task field on this cluster.
  // ESET device management tasks are not a dedicated dataset. This rule approximates the
  // intent by scanning Audit_Event records for shutdown/reboot/restart wording in the
  // action_taken / detail / raw event payload. Coverage and accuracy depend entirely on
  // Audit_Event content and should be reviewed before relying on it.
  FROM logs-eset.protect-*
  | WHERE @timestamp >= NOW() - 45 minutes
  | WHERE event.category == "Audit_Event"
  | WHERE TO_LOWER(COALESCE(eset_protect.action_taken, "")) RLIKE ".*(shutdown|reboot|restart).*"
      OR TO_LOWER(COALESCE(eset_protect.detail, "")) RLIKE ".*(shutdown|reboot|restart).*"
      OR TO_LOWER(COALESCE(event.original, "")) RLIKE ".*(shutdown|reboot|restart).*"
  | STATS
      event_count = COUNT(*),
      target_count = COUNT_DISTINCT(host.name),
      actions = VALUES(event.action),
      actions_taken = VALUES(eset_protect.action_taken),
      details = VALUES(eset_protect.detail),
      users = VALUES(eset_protect.user),
      devices = VALUES(host.name)
    BY bucket = DATE_TRUNC(15 minutes, @timestamp)
  | WHERE target_count >= 5
  | KEEP bucket, event_count, target_count, actions, actions_taken, details, users, devices
  | SORT target_count DESC, event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.impact
- attack.t1529
- eset
- device-management
- availability
severity: medium
risk_score: 60
references:
- "https://attack.mitre.org/techniques/T1529/"
nist: ["AC-2", "AC-6"]
pci_dss: ["7.1", "10.2.2"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0040:
    T1529: []