rule_id: 21a08aff-af78-410f-aba3-9c1e0d4a8caf
name: ESET Protect - Critical or High Severity Threat Detection
description: |
  Ushbu qoida ESET tomonidan critical yoki high severity threat detection'larni monitoring qiladi.
  Bu advanced threat, targeted attack yoki severe compromise belgisi.
  Qonuniy holatlar: rare false positives, aggressive PUA detection.
  SOC triage bosqichlari:
  - Threat name va type'ni threat intelligence bilan correlate qiling
  - Detection context - file, process, network communication
  - Response effectiveness (cleaned, quarantined, blocked) tekshiring
  - System-wide compromise indicators qidiring
  - Immediate incident response zarurligini baholang
  - Executive notification consideration
type: esql
params: '{}'
schedule_interval: 5m
index:
- logs-eset.protect-*
query_language: esql
query: |
  FROM logs-eset.protect-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.category == "Threat_Event"
  | WHERE eset_protect.severity IN ("Critical", "Fatal")
  | STATS
      event_count = COUNT(*),
      detection_names = VALUES(rule.name),
      threat_types = VALUES(eset_protect.threat_type),
      object_uris = VALUES(eset_protect.object_uri),
      object_hashes = VALUES(file.hash.sha1),
      actions_taken = VALUES(eset_protect.action_taken),
      threat_handled = VALUES(eset_protect.threat_handled),
      users = VALUES(eset_protect.user),
      devices = VALUES(host.name)
    BY host.name, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP bucket, host.name, event_count, detection_names, threat_types, object_uris, object_hashes, actions_taken, threat_handled, users, devices
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.execution
- eset
- critical-threat
- high-severity
severity: critical
risk_score: 95
references:
- "https://attack.mitre.org/tactics/TA0002/"
nist: ["SI-3", "IR-4", "IR-5"]
pci_dss: ["5.1", "5.2", "10.6.1"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0002: {}