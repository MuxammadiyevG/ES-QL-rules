rule_id: 77e202c3-bc17-453a-add3-9a714c5bcd70
name: Sysmon Linux - Suspicious Process Creation Detected
description: |
  Ushbu qoida Linux tizimlarida Sysmon Event 1 (Process Creation) hodisalarini kuzatadi.
  Shubhali jarayon yaratilishi execution texnikasiga ishora qilishi mumkin (T1204).
  Qonuniy holatlar: rejalashtirilgan skriptlar, deployment jarayonlari, servis yangilanishlari.
  SOC triage bosqichlari:
  - `actor` (user.name) va `process.command_line` ni tekshiring.
  - Parent process zanjirini tahlil qiling.
  - `source.ip` legitimligini tekshiring.
  - Noqonuniy faoliyat tasdiqlansa: manbani cheklang, credentiallarni yangilang.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-linux.auth-*
query_language: esql
query: |
  FROM logs-linux.auth-*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE data_stream.dataset == "linux.auth"
  | WHERE event.action == "ssh-login-success"
     OR event.action == "sudo-command"
  | EVAL actor       = COALESCE(user.name, "Unknown")
  | EVAL hostn       = COALESCE(host.hostname, "Unknown")
  | EVAL src_ip      = COALESCE(source.ip, "Unknown")
  | EVAL cmd         = COALESCE(process.command_line, "Unknown")
  | EVAL working_dir = COALESCE(process.working_directory, "Unknown")
  | EVAL eff_user    = COALESCE(user.effective.name, "Unknown")
  /* Monitoring agentlarini chiqarib tashlash */
  | WHERE NOT actor RLIKE "(?i)(wazuh|zabbix|nagios|elastic)"
  /* Shubhali komandalar */
  | WHERE cmd RLIKE "(?i)(bash|sh\\s|python|perl|ruby|nc\\s|ncat|netcat|wget|curl|chmod\\s[0-9]*[7][0-9]*|chown|useradd|passwd|visudo|crontab)"
  | STATS
      process_count = COUNT(*),
      commands      = VALUES(cmd),
      working_dirs  = VALUES(working_dir),
      eff_users     = VALUES(eff_user),
      src_ips       = VALUES(src_ip),
      hosts         = VALUES(hostn),
      first_seen    = MIN(@timestamp),
      last_seen     = MAX(@timestamp)
    BY agent_id, actor, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE process_count >= 2
  | KEEP agent_id, bucket, actor, process_count, commands,
         working_dirs, eff_users, src_ips, hosts, first_seen, last_seen
  | SORT process_count DESC
  | LIMIT 200
enabled: false
tags:
  - attack.execution
  - attack.t1204
  - detection.linux
  - sysmon.event1
severity: medium
risk_score: 55
nist: ["AU-2", "AU-12", "SI-3", "AC-7"]
pci_dss: ["10.2.4", "10.2.5"]
gdpr: ["32.1.a", "32.2"]
mitre_attack:
  TA0002:
    T1204: []