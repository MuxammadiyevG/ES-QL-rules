rule_id: 8d62abce-91c0-41dc-b17a-8d2e6b9211ca
name: "NPM Access: XSS Attack Pattern in Request"
description: |
  Ushbu qoida HTTP request URL yoki parametrlarda Cross-Site Scripting (XSS)
  payloadlarini aniqlaydi. script tag, javascript:, onerror, onload kabi
  klassik XSS vektorlari.
  Qonuniy holatlar: penetration testing (ruxsat bilan).
  SOC triage bosqichlari:
  - event.original — to'liq URL va parametrlarni tekshiring.
  - Response status 200 bo'lsa — payload qabul qilingan.
  - Backend XSS sanitization mavjudligini tekshiring.
  - WAF rule qo'shing.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-npm.access-*
query_language: esql
query: |
  FROM logs-npm.access-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.original RLIKE """(?i).*(<script|%3cscript|javascript:|onerror\s*=|onload\s*=|onclick\s*=|onmouseover\s*=|alert\s*\(|document\.cookie|document\.write|eval\s*\(|fromcharcode|%3cimg|<img\s+src|svg\s+onload|<iframe|%3ciframe|on[a-zA-Z]+\s*=).*"""
  | EVAL host_name = host.hostname
  | EVAL log_path  = log.file.path
  | STATS
      event_count = COUNT(*),
      log_paths   = VALUES(log.file.path),
      samples     = VALUES(event.original),
      last_seen   = MAX(@timestamp),
      first_seen  = MIN(@timestamp)
    BY host_name, log_path
  | WHERE event_count >= 1
  | KEEP
      host_name, log_path, event_count,
      log_paths, samples, last_seen, first_seen
  | SORT event_count DESC
enabled: true
tags:
  - attack.initial-access
  - attack.t1189
  - detection.threat-hunting
  - owasp.a03-injection
severity: high
risk_score: 75
references:
  - "https://attack.mitre.org/techniques/T1189/"
  - "https://owasp.org/www-community/attacks/xss/"
nist: ["SI-3", "SI-4", "SA-11", "SC-28"]
pci_dss: ["6.3.1", "6.6", "10.6.1", "11.3"]
gdpr: ["32.1.b", "25.1"]
mitre_attack:
  TA0001:
    T1189: []