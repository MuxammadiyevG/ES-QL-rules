rule_id: 76d3c33c-1ab0-4241-a93c-c8358cd846a1
name: "NPM Access: Automated Scanner or Bot Detected via User Agent"
description: |
  Ushbu qoida taniqli web scanner, vulnerability scanner va bot user agentlarini
  aniqlaydi. sqlmap, nikto, nmap, masscan, nuclei, burpsuite, dirbuster kabi
  toollar.
  Qonuniy holatlar: ruxsat berilgan pentest.
  SOC triage bosqichlari:
  - event.original — scanner qaysi URL larni tekshirmoqda.
  - Client IP — ruxsatli pentest IP si bilan solishtiring.
  - Skanerlangan endpoint lar nima — admin panel, login, API.
  - Noqonuniy bo'lsa: IP ni bloklang, IT xavfsizlik jamoasiga xabarlang.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-npm.access-*
query_language: esql
query: |
  FROM logs-npm.access-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.original RLIKE """(?i).*(sqlmap|nikto|nmap|masscan|nuclei|burpsuite|burp\s+suite|dirbuster|dirb|gobuster|wfuzz|acunetix|nessus|openvas|w3af|skipfish|whatweb|httprint|zgrab|zmap|shodan|censys|python-requests\/|go-http-client|curl\/|wget\/|libwww-perl|java\/|scrapy|phantomjs|headless|zgrab|python-urllib|aiohttp|httpx|httpie).*"""
  | EVAL host_name = host.hostname
  | EVAL log_path  = log.file.path
  | STATS
      event_count = COUNT(*),
      log_paths   = VALUES(log.file.path),
      samples     = VALUES(event.original),
      last_seen   = MAX(@timestamp),
      first_seen  = MIN(@timestamp)
    BY host_name, log_path
  | WHERE event_count >= 1
  | KEEP
      host_name, log_path, event_count,
      log_paths, samples, last_seen, first_seen
  | SORT event_count DESC
enabled: true
tags:
  - attack.reconnaissance
  - attack.t1595
  - attack.t1190
  - detection.threat-hunting
severity: medium
risk_score: 62
references:
  - "https://attack.mitre.org/techniques/T1595/"
  - "https://attack.mitre.org/techniques/T1190/"
nist: ["SI-4", "RA-5", "AU-12", "SC-7"]
pci_dss: ["6.6", "10.6.1", "11.3", "11.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0043:
    T1595: []
  TA0001:
    T1190: []