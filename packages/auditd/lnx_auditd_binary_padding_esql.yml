rule_id: af8a60d3-09b8-4583-8476-5e34995d6b4c
name: "Binary Padding Detection"
description: |
  Adversaries may use binary padding to add junk data and change the on-disk representation of malware.
  This can be used to evade hash-based blocklisting and static anti-virus signatures.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  // Filter for process execution events in Linux Audit logs
  | WHERE event.action == "executed"
  // Selection: Identify the 'dd' utility being used to read from zero/random devices
  | WHERE process.name == "dd" 
    AND TO_LOWER(COALESCE(MV_CONCAT(process.args, " "), "")) RLIKE ".*if=/dev/(zero|random|urandom).*"
  // Selection: Look for 'of=' to identify the target file being modified/created
  | EVAL cmd = COALESCE(MV_CONCAT(process.args, " "), "")
  | WHERE TO_LOWER(cmd) RLIKE ".*of=.*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(cmd),
      hosts = VALUES(host.name)
    BY 
      agent_id, host.name, 
      user.name, 
      bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP
      agent_id, bucket, host.name, user.name, event_count, processes, command_lines
  | SORT event_count DESC
enabled: false
tags:
  - attack.defense-evasion
  - attack.t1027.001
severity: medium
risk_score: 55
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1027: ["T1027.001"]
