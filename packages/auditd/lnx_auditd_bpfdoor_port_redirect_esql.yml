rule_id: a1719539-ae26-488b-9522-c783c96f52a5
name: "BPFDoor Port Redirection Detection"
description: |
  Detects BPFDoor malware port redirection technique using iptables.
  BPFDoor is a Linux backdoor that uses BPF (Berkeley Packet Filter) to hide network traffic.
  The malware uses iptables to redirect traffic from one port to another for command and control.
  This is a specific indicator of compromise for BPFDoor activity.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  // Filter for process execution events in Linux Audit logs
  | WHERE event.action == "executed"
  // Selection: Identify iptables being used to establish BPFDoor-style port redirection
  | EVAL cmd = COALESCE(MV_CONCAT(process.args, " "), "")
  | WHERE process.name == "iptables" 
      AND TO_LOWER(cmd) RLIKE ".*\\\\-t\\\\s+nat.*"
      AND TO_LOWER(cmd) RLIKE ".*prerouting.*"
      AND TO_LOWER(cmd) RLIKE ".*\\\\-\\\\-dport.*"
      AND TO_LOWER(cmd) RLIKE ".*redirect.*"
      AND TO_LOWER(cmd) RLIKE ".*\\\\-\\\\-to\\\\-ports.*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      command_lines = VALUES(cmd),
      executables = VALUES(process.executable),
      parent_pids = VALUES(process.parent.pid),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY 
      agent_id, host.name, 
      user.name, 
      bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP
      agent_id, bucket, host.name, user.name, event_count, users, processes,
      command_lines, executables, parent_pids, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.command-and-control
  - attack.t1090
  - detection.threat-hunting
severity: critical
risk_score: 90
references:
  - "https://www.sandflysecurity.com/blog/bpfdoor-an-evasive-linux-backdoor-technical-analysis/"
  - "https://attack.mitre.org/techniques/T1090/"
nist: ["SI-4", "AU-12", "SC-7"]
pci_dss: ["10.2", "1.3"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0011:
    T1090: []
