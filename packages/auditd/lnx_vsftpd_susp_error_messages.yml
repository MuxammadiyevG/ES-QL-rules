rule_id: a08ce517-bf65-4a5f-8f84-77b61c4c5670
name: "Suspicious VSFTPD Error Messages"
description: |
  Detects suspicious VSFTPD error messages that indicate fatal or abnormal behavior.
  Such errors may be caused by agent_id, exploitation attempts, misconfigurations, or malicious clients.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd events only */
  | WHERE TO_LOWER(event.dataset) RLIKE ".*vsftpd.*"
  /* Detect relevant VSFTPD error messages */
  | WHERE TO_LOWER(COALESCE(event.original, "")) RLIKE ".*(connection refused: too many sessions for this address.|connection refused: tcp_wrappers denial.|bad http verb.|port and pasv both active|pasv and port both active|transfer done \\(but failed to open directory\\)\\.|could not set file modification time\\.|bug: pid active in ptrace_sandbox_free|ptrace_setoptions failure|weird status:|couldn't handle sandbox event|out of bounds|syscall not permitted:|syscall validate failed:|input line too long\\.|poor buffer accounting in str_netfd_alloc|vsf_sysutil_read_loop).*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      executables = VALUES(process.executable),
      command_lines = VALUES(process.title),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP
      agent_id, bucket,
      host.name,
      user.name,
      event_count,
      users,
      processes,
      executables,
      command_lines,
      hosts,
      raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.initial-access
  - attack.t1190
severity: medium
risk_score: 60
references:
  - "https://github.com/dagwieers/vsftpd/"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0001:
    T1190: []
