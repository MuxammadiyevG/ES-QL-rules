rule_id: aea78bea-08ec-4daa-9063-4e0dc91c058f
name: "Suspicious Named Error"
description: |
  Detects suspicious DNS (BIND/named) error messages that indicate fatal or abnormal behavior.
  Such errors may be caused by agent_id, exploitation attempts, zone transfer abuse, or malformed packets.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd events only */
  /* Detect suspicious named / DNS error messages */
  | WHERE TO_LOWER(COALESCE(event.original, "")) RLIKE ".*(dropping source port zero packet from|denied axfr from|exiting \\(due to fatal error\\)).*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      executables = VALUES(process.executable),
      command_lines = VALUES(process.title),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP
      agent_id, bucket,
      host.name,
      user.name,
      event_count,
      users,
      processes,
      executables,
      command_lines,
      hosts,
      raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.initial-access
  - attack.t1190
severity: high
risk_score: 75
references:
  - "https://github.com/ossec/ossec-hids/blob/1ecffb1b884607cb12e619f9ab3c04f530801083/etc/rules/named_rules.xml"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0001:
    T1190: []
