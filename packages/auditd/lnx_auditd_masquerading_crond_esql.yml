rule_id: d922c47c-c27f-43b7-8df1-c228c40b0bd4
name: "Crond Masquerading Detection"
description: |
  Detects execution of crond from unusual locations.
  Adversaries may masquerade malware as legitimate crond process.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE event.action == "executed"
  | WHERE process.name == "crond" AND NOT (TO_LOWER(COALESCE(process.executable, "")) RLIKE "/(usr/)?sbin/crond.*")
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      executables = VALUES(process.executable),
      hosts = VALUES(host.name)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, executables, hosts
  | SORT event_count DESC
enabled: false
tags:
  - attack.persistence
  - attack.t1036
severity: high
risk_score: 75
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1036: []
