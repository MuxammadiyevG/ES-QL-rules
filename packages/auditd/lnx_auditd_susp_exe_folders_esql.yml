rule_id: cbab6ec6-b60a-47b5-93ab-1b064a7e1457
name: "Program Execution in Suspicious Folders"
description: |
  Detects program executions in suspicious non-program folders.
  Adversaries may execute tools from temporary or web server directories to evade detection.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd SYSCALL events */
  /* selection: execution in suspicious folders */
  | WHERE TO_LOWER(process.executable) RLIKE "/tmp/.*"
    OR TO_LOWER(process.executable) RLIKE "/var/www/.*"
    OR TO_LOWER(process.executable) RLIKE "/home/.*/public_html/.*"
    OR TO_LOWER(process.executable) RLIKE "/var/tmp/.*"
    OR TO_LOWER(process.executable) RLIKE "/dev/shm/.*"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      executables = VALUES(process.executable),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, executables, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.resource-development
  - attack.t1587
  - attack.defense-evasion
severity: medium
risk_score: 55
references:
  - "https://attack.mitre.org/techniques/T1587/"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0042:
    T1587: []
