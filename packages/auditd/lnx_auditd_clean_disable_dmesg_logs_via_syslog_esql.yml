rule_id: cf9894c0-1101-40b5-a58d-5388e8f8c428
name: "Kernel Ring Buffer (dmesg) Clearing Detection"
description: |
  Detects clearing or disabling of kernel ring buffer (dmesg) logs via syslog syscall.
  Adversaries may clear kernel logs to hide traces of exploitation or driver loading.
  Monitors syslog syscall with actions 4 (READ_CLEAR), 5 (CLEAR), or 6 (CONSOLE_OFF).
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-updive.audit-*
query_language: esql
query: |
  FROM logs-updive.audit-*
  | WHERE @timestamp >= NOW() - 10 minutes
  /* auditd SYSCALL events */
  /* selection: syslog syscall with clear actions */
  | WHERE (TO_LOWER(COALESCE(event.original, "")) RLIKE ".*syscall=103.*" OR TO_LOWER(COALESCE(event.original, "")) RLIKE ".*syscall=syslog.*")
    AND (
      TO_LOWER(COALESCE(event.original, "")) RLIKE ".*a0=4.*"
      OR TO_LOWER(COALESCE(event.original, "")) RLIKE ".*a0=5.*"
      OR TO_LOWER(COALESCE(event.original, "")) RLIKE ".*a0=6.*"
    )
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      processes = VALUES(process.name),
      executables = VALUES(process.executable),
      hosts = VALUES(host.name),
      raw_samples = VALUES(event.original)
    BY agent_id, host.name, user.name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | KEEP agent_id, bucket, host.name, user.name, event_count, users, processes, executables, hosts, raw_samples
  | SORT event_count DESC
enabled: false
tags:
  - attack.defense-evasion
  - attack.t1070.002
severity: medium
risk_score: 50
references:
  - "https://man7.org/linux/man-pages/man2/syslog.2.html"
  - "https://attack.mitre.org/techniques/T1070/002/"
nist: ["SI-4", "AU-12"]
pci_dss: ["10.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1070: ["T1070.002"]
