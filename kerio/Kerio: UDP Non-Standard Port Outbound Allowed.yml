rule_id: fd6a56f2-1ac9-4839-a75c-7140118cbd48
name_uz: "Kerio: Standart bo'lmagan portga chiquvchi UDP ga ruxsat berildi"
name_ru: "Kerio: Разрешён исходящий UDP на нестандартный порт"
name_en: "Kerio: UDP Non-Standard Port Outbound Allowed"
description_uz: |
  Ushbu qoida standart bo'lmagan portlarga ruxsat berilgan UDP trafikni aniqlaydi.
  DNS tunneling va boshqa covert channel usullari shu pattern orqali aniqlanadi.
  SOC triage bosqichlari:
  - destination.port 53 bo'lsa DNS tunnel tekshiring.
  - destination.ip — threat intel da bormi.
  - kerio.control.packet_length — katta hajmli UDP shubhali.
description_ru: |
  Это правило выявляет разрешённый UDP-трафик на нестандартные порты.
  DNS tunneling и другие методы скрытых каналов обнаруживаются по этому шаблону.
  Этапы SOC-триажа:
  - Если destination.port равен 53 — проверьте DNS tunnel.
  - destination.ip — есть ли он в threat intel.
  - kerio.control.packet_length — UDP большого объёма подозрителен.
description_en: |
  This rule detects allowed UDP traffic to non-standard ports.
  DNS tunneling and other covert channel techniques are detected by this pattern.
  SOC triage steps:
  - If destination.port is 53, check for a DNS tunnel.
  - destination.ip — whether it appears in threat intel.
  - kerio.control.packet_length — large UDP packets are suspicious.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-kerio.control-*
query_language: esql
query: |
  FROM logs-kerio.control-*
  | WHERE @timestamp >= NOW() - 600 seconds
  | WHERE event.action == "allow"
  | WHERE network.transport == "udp"
  | WHERE destination.port NOT IN (
      53, 67, 68, 123, 137, 138, 161, 162,
      443, 500, 514, 4500
    )
  | WHERE destination.port > 1024
  | EVAL _src = TO_STRING(source.ip)
  | EVAL src_ip = CASE(_src IS NULL, "Unknown", _src)
  | EVAL _dst = TO_STRING(destination.ip)
  | EVAL dst_ip = CASE(_dst IS NULL, "Unknown", _dst)
  | WHERE src_ip != "Unknown"
  | WHERE src_ip != "0.0.0.0"
  | STATS
      conn_count   = COUNT(*),
      avg_pkt_len  = AVG(kerio.control.packet_length),
      max_pkt_len  = MAX(kerio.control.packet_length),
      dst_ips      = VALUES(destination.ip),
      dst_ports    = VALUES(destination.port),
      rule_names   = VALUES(rule.name),
      last_seen    = MAX(@timestamp),
      first_seen   = MIN(@timestamp)
    BY src_ip, dst_ip, destination.port
  | WHERE conn_count >= 5
  | EVAL dst_port = destination.port
  | KEEP
      src_ip, dst_ip, dst_port, conn_count,
      avg_pkt_len, max_pkt_len,
      dst_ips, dst_ports, rule_names,
      last_seen, first_seen
  | SORT conn_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.command-and-control
  - attack.t1071.004
  - detection.threat-hunting
severity: medium
risk_score: 58
references:
  - "https://attack.mitre.org/techniques/T1071/004/"
nist: ["SC-7", "SI-4", "AU-12"]
pci_dss: ["1.3", "10.6.1", "11.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0011:
    T1071: ["T1071.004"]