rule_id: 060c9752-8d3e-4045-821f-707400b91eef
name_uz: "Kerio: NetBIOS broadcast DROP (Informational)"
name_ru: "Kerio: DROP широковещательных NetBIOS-пакетов (Informational)"
name_en: "Kerio: NetBIOS Broadcast DROP (Informational)"
description_uz: |
  Ushbu qoida Kerio tomonidan bloklangan NetBIOS broadcast paketlarini qayd etadi.
  Port 137 (NetBIOS Name Service) va 138 (NetBIOS Datagram) broadcastlar.
  Logda ko'ringan: 10.1.27.139:137 → 10.1.27.255:137.
  Qonuniy holatlar: Windows tarmoq discovery, file sharing.
  SOC triage bosqichlari:
  - Kutilmagan VLAN dan kelsa — ruxsatsiz qurilma bo'lishi mumkin.
  - Ko'p hostdan kelsa — NetBIOS enumeration urinishi.
description_ru: |
  Это правило фиксирует широковещательные NetBIOS-пакеты, заблокированные Kerio.
  Широковещательные пакеты на порты 137 (NetBIOS Name Service) и 138 (NetBIOS Datagram).
  Замечено в логе: 10.1.27.139:137 → 10.1.27.255:137.
  Легитимные ситуации: сетевое обнаружение Windows, общий доступ к файлам.
  Этапы SOC-триажа:
  - Если приходит из неожиданного VLAN — возможно несанкционированное устройство.
  - Если приходит со многих хостов — попытка NetBIOS enumeration.
description_en: |
  This rule records NetBIOS broadcast packets blocked by Kerio.
  Broadcasts on port 137 (NetBIOS Name Service) and 138 (NetBIOS Datagram).
  Seen in the log: 10.1.27.139:137 → 10.1.27.255:137.
  Legitimate cases: Windows network discovery, file sharing.
  SOC triage steps:
  - If it comes from an unexpected VLAN — it may be an unauthorized device.
  - If it comes from many hosts — a NetBIOS enumeration attempt.
type: esql
params: '{}'
schedule_interval: 15m
index:
  - logs-kerio.control-*
query_language: esql
query: |
  FROM logs-kerio.control-*
  | WHERE @timestamp >= NOW() - 900 seconds
  | WHERE event.action == "drop"
  | WHERE network.transport == "udp"
  | WHERE destination.port IN (137, 138)
  | EVAL _src = TO_STRING(source.ip)
  | EVAL src_ip = CASE(_src IS NULL, "Unknown", _src)
  | EVAL _dst = TO_STRING(destination.ip)
  | EVAL dst_ip = CASE(_dst IS NULL, "Unknown", _dst)
  | WHERE src_ip != "Unknown"
  | WHERE src_ip != "0.0.0.0"
  | STATS
      drop_count   = COUNT(*),
      src_ips      = VALUES(source.ip),
      dst_ips      = VALUES(destination.ip),
      dst_ports    = VALUES(destination.port),
      rule_names   = VALUES(rule.name),
      last_seen    = MAX(@timestamp),
      first_seen   = MIN(@timestamp)
    BY src_ip
  | WHERE drop_count >= 5
  | KEEP
      src_ip, drop_count,
      src_ips, dst_ips, dst_ports, rule_names,
      last_seen, first_seen
  | SORT drop_count DESC
  | LIMIT 100
enabled: true
tags:
  - detection.informational
  - network.netbios
severity: low
risk_score: 18
references: []
nist: ["CM-7", "SI-4"]
pci_dss: ["1.3", "10.6.1"]
gdpr: ["32.1.b"]
mitre_attack: []