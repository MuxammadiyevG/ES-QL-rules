rule_id: d4048fae-549b-4c2c-a927-610fe88e1802
name_uz: "Kerio: Yangi rule nomi aniqlandi (Firewall Policy Change Detection)"
name_ru: "Kerio: Обнаружено новое имя правила (Firewall Policy Change Detection)"
name_en: "Kerio: New Rule Name Seen (Firewall Policy Change Detection)"
description_uz: |
  Ushbu qoida Kerio logida yangi, avval ko'rilmagan rule.name qiymatlarini
  aniqlaydi. Firewall policy o'zgarganda yoki yangi rule qo'shilganda bu
  hodisa qayd etiladi. Vizibiliti va change tracking uchun foydali.
  Qonuniy holatlar: IT admin tomonidan yangi firewall rule qo'shilishi.
  SOC triage bosqichlari:
  - rule.name — kutilmagan yoki tushunarsiz nom shubhali.
  - Change management tizimi bilan solishtiring.
  - Kerio admin panel logini tekshiring.
description_ru: |
  Это правило выявляет в логе Kerio новые, ранее не встречавшиеся значения
  rule.name. Событие фиксируется при изменении политики firewall или добавлении
  нового правила. Полезно для видимости и отслеживания изменений.
  Легитимные ситуации: добавление нового правила firewall ИТ-администратором.
  Этапы SOC-триажа:
  - rule.name — неожиданное или непонятное имя подозрительно.
  - Сопоставьте с системой управления изменениями.
  - Проверьте лог админ-панели Kerio.
description_en: |
  This rule detects new, previously unseen rule.name values in the Kerio
  log. The event is recorded when the firewall policy changes or a new rule is
  added. Useful for visibility and change tracking.
  Legitimate cases: a new firewall rule added by an IT admin.
  SOC triage steps:
  - rule.name — an unexpected or unclear name is suspicious.
  - Compare against the change management system.
  - Check the Kerio admin panel log.
type: esql
params: '{}'
schedule_interval: 60m
index:
  - logs-kerio.control-*
query_language: esql
query: |
  FROM logs-kerio.control-*
  | WHERE @timestamp >= NOW() - 3600 seconds
  | WHERE rule.name IS NOT NULL
  | STATS
      event_count  = COUNT(*),
      actions      = VALUES(event.action),
      src_ips      = VALUES(source.ip),
      dst_ports    = VALUES(destination.port),
      protos       = VALUES(network.transport),
      last_seen    = MAX(@timestamp),
      first_seen   = MIN(@timestamp)
    BY rule.name
  | KEEP
      rule.name, event_count,
      actions, src_ips, dst_ports, protos,
      last_seen, first_seen
  | SORT first_seen DESC
  | LIMIT 100
enabled: true
tags:
  - detection.informational
  - network.policy-monitoring
severity: low
risk_score: 10
references: []
nist: ["CM-3", "AU-12", "SI-4"]
pci_dss: ["1.1", "10.2.7", "10.6.1"]
gdpr: ["32.1.b"]
mitre_attack: []