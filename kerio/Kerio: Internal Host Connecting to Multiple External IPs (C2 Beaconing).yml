rule_id: c80e3037-f392-41e0-b01d-76082669851b
name_uz: "Kerio: Ichki host ko'p tashqi IP larga ulanmoqda (C2 Beaconing)"
name_ru: "Kerio: Внутренний хост подключается ко многим внешним IP (C2 Beaconing)"
name_en: "Kerio: Internal Host Connecting to Multiple External IPs (C2 Beaconing)"
description_uz: |
  Ushbu qoida bitta ichki hostdan qisqa vaqt ichida ko'p sonli tashqi IP larga
  TCP SYN ulanish urinishlarini aniqlaydi. Bu C2 beaconing yoki malware tarqalish
  urinishining klassik belgisi. Loglardan ko'ringan 192.168.213.32 dan port 80 ga
  ko'p xil tashqi IP larga SYN paketlar — aynan shu pattern.
  SOC triage bosqichlari:
  - source.ip hostni darhol izolyatsiya qiling.
  - Endpointda malware scan bajaring.
  - Destination IP larni threat intel bilan solishtiring.
  - Host network traffic history ni tekshiring.
description_ru: |
  Это правило выявляет большое количество попыток TCP SYN-подключений с одного
  внутреннего хоста ко многим внешним IP за короткий промежуток времени. Это классический
  признак C2 beaconing или попытки распространения вредоносного ПО. Замеченные в логах SYN-пакеты
  с 192.168.213.32 на порт 80 множества разных внешних IP — именно такой шаблон.
  Этапы SOC-триажа:
  - Немедленно изолируйте хост source.ip.
  - Выполните сканирование endpoint на вредоносное ПО.
  - Сопоставьте destination IP с threat intel.
  - Проверьте историю сетевого трафика хоста.
description_en: |
  This rule detects a large number of TCP SYN connection attempts from a single
  internal host to many external IPs within a short time window. This is a classic sign of
  C2 beaconing or a malware propagation attempt. The SYN packets seen in the logs from
  192.168.213.32 to port 80 of many different external IPs are exactly this pattern.
  SOC triage steps:
  - Isolate the source.ip host immediately.
  - Run a malware scan on the endpoint.
  - Compare the destination IPs against threat intel.
  - Check the host network traffic history.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-kerio.control-*
query_language: esql
query: |
  FROM logs-kerio.control-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE network.transport == "tcp"
  | WHERE kerio.control.tcp_flags LIKE "*SYN*"
  | WHERE NOT kerio.control.tcp_flags LIKE "*ACK*"
  | EVAL _src = TO_STRING(source.ip)
  | EVAL src_ip = CASE(_src IS NULL, "Unknown", _src)
  | EVAL _dst = TO_STRING(destination.ip)
  | EVAL dst_ip = CASE(_dst IS NULL, "Unknown", _dst)
  | WHERE src_ip != "Unknown"
  | WHERE src_ip != "0.0.0.0"
  | STATS
      syn_count      = COUNT(*),
      unique_dst_ips = COUNT_DISTINCT(destination.ip),
      unique_ports   = COUNT_DISTINCT(destination.port),
      dst_ips        = VALUES(destination.ip),
      dst_ports      = VALUES(destination.port),
      actions        = VALUES(event.action),
      rule_names     = VALUES(rule.name),
      last_seen      = MAX(@timestamp),
      first_seen     = MIN(@timestamp)
    BY src_ip
  | WHERE unique_dst_ips >= 5
  | KEEP
      src_ip, syn_count, unique_dst_ips, unique_ports,
      dst_ips, dst_ports, actions, rule_names,
      last_seen, first_seen
  | SORT unique_dst_ips DESC
  | LIMIT 100
enabled: true
tags:
  - attack.command-and-control
  - attack.t1071
  - attack.t1095
  - detection.threat-hunting
severity: high
risk_score: 80
references:
  - "https://attack.mitre.org/techniques/T1071/"
  - "https://attack.mitre.org/techniques/T1095/"
nist: ["SC-7", "SI-4", "AU-12", "IR-4"]
pci_dss: ["1.3", "10.6.1", "11.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0011:
    T1071: []
    T1095: []