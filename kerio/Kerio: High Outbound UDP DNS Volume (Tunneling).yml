rule_id: 61a9fb8a-4996-4606-89c9-8590d477d560
name_uz: "Kerio: Yuqori hajmli chiquvchi UDP/DNS trafik (Tunneling)"
name_ru: "Kerio: Высокий объём исходящего UDP/DNS-трафика (Tunneling)"
name_en: "Kerio: High Outbound UDP/DNS Volume (Tunneling)"
description_uz: |
  Ushbu qoida bitta ichki hostdan qisqa vaqt ichida abnormal yuqori hajmli
  DNS/UDP (port 53) outbound trafikni aniqlaydi. DNS tunneling orqali data
  exfiltration yoki C2 covert channel shu pattern bilan amalga oshiriladi
  (T1071.004 - DNS, T1048 - Exfiltration Over Alternative Protocol).
  Qonuniy holatlar: DNS server, katta DNS so'rovlar hajmi, monitoring tooling.
  SOC triage bosqichlari:
  - source.ip host DNS resolver emasligini tasdiqlang.
  - destination.ip — qaysi DNS serverga so'rovlar ketyapti (tashqimi?).
  - avg_pkt_len/max_pkt_len katta bo'lsa — tunneling ehtimoli yuqori.
  - query_count juda yuqori bo'lsa — avtomatlashtirilgan so'rovlar.
description_ru: |
  Это правило выявляет аномально высокий объём исходящего DNS/UDP-трафика
  (порт 53) с одного внутреннего хоста за короткий промежуток времени. Через DNS tunneling
  именно по такому шаблону выполняется exfiltration данных или скрытый канал C2
  (T1071.004 - DNS, T1048 - Exfiltration Over Alternative Protocol).
  Легитимные ситуации: DNS-сервер, большой объём DNS-запросов, средства мониторинга.
  Этапы SOC-триажа:
  - Подтвердите, что хост source.ip не является DNS-резолвером.
  - destination.ip — на какой DNS-сервер уходят запросы (внешний?).
  - Если avg_pkt_len/max_pkt_len велики — вероятность tunneling высокая.
  - Если query_count очень высок — запросы автоматизированы.
description_en: |
  This rule detects an abnormally high volume of outbound DNS/UDP (port 53)
  traffic from a single internal host within a short time window. Data exfiltration
  over DNS tunneling or a C2 covert channel is carried out with exactly this pattern
  (T1071.004 - DNS, T1048 - Exfiltration Over Alternative Protocol).
  Legitimate cases: DNS server, large DNS query volume, monitoring tooling.
  SOC triage steps:
  - Confirm that the source.ip host is not a DNS resolver.
  - destination.ip — which DNS server the queries are going to (external?).
  - If avg_pkt_len/max_pkt_len are large — tunneling is likely.
  - If query_count is very high — automated queries.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-kerio.control-*
query_language: esql
query: |
  FROM logs-kerio.control-*
  | WHERE @timestamp >= NOW() - 600 seconds
  | WHERE event.action == "allow"
  | WHERE network.transport == "udp"
  | WHERE destination.port == 53
  | EVAL _src = TO_STRING(source.ip)
  | EVAL src_ip = CASE(_src IS NULL, "Unknown", _src)
  | EVAL _dst = TO_STRING(destination.ip)
  | EVAL dst_ip = CASE(_dst IS NULL, "Unknown", _dst)
  | WHERE src_ip != "Unknown"
  | WHERE src_ip != "0.0.0.0"
  | STATS
      query_count  = COUNT(*),
      total_bytes  = SUM(kerio.control.packet_length),
      avg_pkt_len  = AVG(kerio.control.packet_length),
      max_pkt_len  = MAX(kerio.control.packet_length),
      dst_ips      = VALUES(destination.ip),
      rule_names   = VALUES(rule.name),
      last_seen    = MAX(@timestamp),
      first_seen   = MIN(@timestamp)
    BY src_ip
  | WHERE query_count >= 200
  | KEEP
      src_ip, query_count, total_bytes,
      avg_pkt_len, max_pkt_len,
      dst_ips, rule_names,
      last_seen, first_seen
  | SORT query_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.command-and-control
  - attack.t1071.004
  - attack.exfiltration
  - attack.t1048
  - detection.threat-hunting
severity: medium
risk_score: 64
references:
  - "https://attack.mitre.org/techniques/T1071/004/"
  - "https://attack.mitre.org/techniques/T1048/"
nist: ["SC-7", "SI-4", "AU-12"]
pci_dss: ["1.3", "10.6.1", "11.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0011:
    T1071: ["T1071.004"]
  TA0010:
    T1048: []
