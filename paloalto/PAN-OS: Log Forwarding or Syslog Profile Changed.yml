rule_id: 9331a866-2ea2-4cd3-892e-86fc5e59d1d9
name: "PAN-OS: Log Forwarding or Syslog Profile Changed"
description: |
  Ushbu qoida Palo Alto konfiguratsiyasida log-forwarding yoki syslog
  profillariga tegadigan o'zgarishlarni kuzatadi (panw.config dataset).
  Log forwarding yoki syslog konfiguratsiyasini o'chirish/o'zgartirish —
  hujumchining o'z izlarini yashirish yoki SIEM'ga log yuborishni to'xtatish
  urinishi bo'lishi mumkin (T1562.001 - Disable or Modify Tools / Indicator Blocking).
  Qonuniy holatlar: yangi SIEM kollektoriga o'tish, rejali log infratuzilma o'zgarishi.
  SOC triage bosqichlari:
  - O'zgarishni kim qilgani (admin) va qaysi qurilmada ekanligini aniqlang.
  - Log forwarding o'chirilganmi yoki destination o'zgartirilganmi — tekshiring.
  - Change management ticket mavjudligini tasdiqlang.
  - O'zgarishdan keyin SIEM'ga loglar kelishi to'xtamaganligini tekshiring.
  - Kutilmagan bo'lsa: darhol incident oching, konfiguratsiyani tiklang.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-panw*
query_language: esql
query: |
  FROM logs-panw*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.dataset == "panw.config"
  | WHERE event.action IN ("add", "edit", "delete", "set", "rename")
  | WHERE panw.panos.config.path RLIKE ".*(log-settings|log-forward|syslog|logforward).*"
  | STATS
      change_count   = COUNT(*),
      actions        = VALUES(event.action),
      config_paths   = VALUES(panw.panos.config.path),
      admins         = VALUES(source.user.name),
      admin_ips      = VALUES(source.ip),
      devices        = VALUES(observer.hostname),
      first_seen     = MIN(@timestamp),
      last_seen      = MAX(@timestamp)
    BY agent_id, observer.hostname, source.user.name, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP bucket, observer.hostname, source.user.name, change_count, actions,
         config_paths, admins, admin_ips, devices, first_seen, last_seen
  | SORT change_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1562.001
  - paloalto
  - config
  - log-forwarding
  - firewall
severity: high
risk_score: 75
references:
  - "https://attack.mitre.org/techniques/T1562/001/"
  - "https://docs.paloaltonetworks.com/pan-os/admin/monitoring/configure-log-forwarding"
nist: ["AU-9", "AU-12", "CM-5", "SI-4"]
pci_dss: ["10.5.1", "10.5.2", "11.5"]
gdpr: ["32.1.b"]
hipaa: ["164.312.b"]
mitre_attack:
  TA0005:
    T1562: ["T1562.001"]
