rule_id: b593f0fe-e059-4e41-84a8-100243b1b78f
name_uz: "PAN-OS: ichki host SSL orqali ko'p sonli tashqi IP'lar bilan aloqada"
name_ru: "PAN-OS: внутренний хост связывается с множеством внешних IP по SSL"
name_en: "PAN-OS: Internal Host Communicating with Multiple External IPs via SSL"
description_uz: |
  Ushbu qoida bitta ichki host tomonidan qisqa vaqt ichida ko'p sonli tashqi IP manzillarga SSL ulanishlarini kuzatadi.
  Bu holat browser'ning parallel ulanishlari, CDN foydalanishi yoki — anomal bo'lsa — scanning, DGA (Domain Generation Algorithm) yoki C2 beacon urinishlarini ko'rsatishi mumkin.
  Logda 10.25.255.6 manbai 194.93.25.227 ga o'nlab parallel sessiya ochgan — bu pattern tahlil qilinishi kerak.
  Qonuniy holatlar: web browser parallel TCP ulanishlari, video streaming, software update.
  SOC triage bosqichlari:
  - Nechta unique tashqi IP'ga ulanish sodir bo'lgan?
  - Portlar standartmi (443) yoki noodatiy?
  - Sessiya davomiyligi juda qisqami? (beacon pattern bo'lishi mumkin)
  - Manbaning foydalanuvchisi va qurilmasini aniqlang.
description_ru: |
  Это правило отслеживает SSL-подключения одного внутреннего хоста к большому числу внешних IP-адресов за короткое время.
  Это может быть параллельные подключения браузера, использование CDN или — если аномально — scanning, DGA (Domain Generation Algorithm) либо попытки C2 beacon.
  В логе источник 10.25.255.6 открыл десятки параллельных сессий к 194.93.25.227 — этот паттерн необходимо проанализировать.
  Легитимные случаи: параллельные TCP-подключения веб-браузера, видеостриминг, обновление ПО.
  Этапы SOC-триажа:
  - К скольким уникальным внешним IP было выполнено подключение?
  - Порты стандартные (443) или необычные?
  - Слишком ли короткая длительность сессий? (возможен beacon-паттерн)
  - Определите пользователя и устройство источника.
description_en: |
  This rule monitors SSL connections from a single internal host to a large number of external IP addresses in a short time.
  This may be a browser's parallel connections, CDN usage or — if anomalous — scanning, DGA (Domain Generation Algorithm) or C2 beacon attempts.
  In the log, source 10.25.255.6 opened dozens of parallel sessions to 194.93.25.227 — this pattern must be analyzed.
  Legitimate cases: parallel TCP connections of a web browser, video streaming, software update.
  SOC triage steps:
  - How many unique external IPs were connected to?
  - Are the ports standard (443) or unusual?
  - Is the session duration very short? (may be a beacon pattern)
  - Identify the user and device of the source.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-panw*
query_language: esql
query: |
  FROM logs-panw*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.kind == "event"
  | WHERE event.category == "network"
  | WHERE event.type == "end"
  | WHERE network.application == "ssl"
  | WHERE event.outcome == "allow"
  | EVAL src_ip         = source.ip
  | EVAL dst_ip         = destination.ip
  | EVAL src_zone       = panw.panos.source.zone
  | EVAL dst_zone       = panw.panos.destination.zone
  | EVAL src_port       = source.port
  | EVAL dst_port       = destination.port
  | EVAL bytes_total    = network.bytes
  | EVAL end_reason     = event.reason
  | EVAL ruleset        = panw.panos.ruleset
  | EVAL url_category   = panw.panos.url_category_list
  | STATS
      session_count      = COUNT(*),
      unique_dst_ips     = COUNT_DISTINCT(destination.ip),
      unique_dst_ports   = COUNT_DISTINCT(destination.port),
      dst_ips            = VALUES(destination.ip),
      dst_ports          = VALUES(destination.port),
      src_ports          = VALUES(source.port),
      total_bytes        = SUM(network.bytes),
      avg_bytes          = AVG(network.bytes),
      min_bytes          = MIN(network.bytes),
      max_bytes          = MAX(network.bytes),
      total_packets      = SUM(network.packets),
      end_reasons        = VALUES(event.reason),
      rulesets           = VALUES(panw.panos.ruleset),
      url_categories     = VALUES(panw.panos.url_category_list),
      last_seen          = MAX(@timestamp),
      first_seen         = MIN(@timestamp)
    BY source.ip, panw.panos.source.zone, panw.panos.destination.zone
  | WHERE session_count >= 10 AND unique_dst_ips >= 5
  | EVAL
      source_ip    = source.ip,
      src_zone     = panw.panos.source.zone,
      dst_zone     = panw.panos.destination.zone
  | KEEP
      source_ip, src_zone, dst_zone,
      session_count, unique_dst_ips, unique_dst_ports,
      total_bytes, avg_bytes, min_bytes, max_bytes, total_packets,
      dst_ips, dst_ports, src_ports,
      end_reasons, rulesets, url_categories,
      last_seen, first_seen
  | SORT session_count DESC
  | LIMIT 100
enabled: true
tags:
  - detection.informational
  - network.monitoring
  - attack.t1071.001
severity: low
risk_score: 25
references:
  - "https://attack.mitre.org/techniques/T1071/001/"
  - "https://attack.mitre.org/techniques/T1008/"
nist: ["AU-12", "SI-4", "SC-7"]
pci_dss: ["10.6.1", "1.3.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0011:
    T1071: ["T1071.001"]
    T1008: []