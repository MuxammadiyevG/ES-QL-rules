rule_id: 72d8178c-5354-4b13-83cc-44a778435476
name_uz: "PAN-OS: DMZ'dan shubhali TCP Reset shtormi (ehtimoliy skanerlash yoki DoS)"
name_ru: "PAN-OS: подозрительный шторм TCP Reset из DMZ (возможное сканирование или DoS)"
name_en: "PAN-OS: Suspicious TCP Reset Storm from DMZ (Possible Scanning or DoS)"
description_uz: |
  Ushbu qoida DMZ zonasidan bir xil tashqi IP'ga qisqa vaqt ichida ko'p sonli TCP RST (Reset) bilan tugaydigan sessionlarning yuqori sonini aniqlaydi.
  TCP RST stormlar port scanning, connection flooding, yoki C2 beacon urinishlari bilan bog'liq bo'lishi mumkin.
  Qonuniy holatlar: tarmoq muammolari tufayli TCP timeout, yuk muvozanatlagich konfiguratsiyasi.
  SOC triage bosqichlari:
  - RST'lar bir vaqtda sodir bo'lganmi yoki ketma-ket? (timestamp'larni solishtiring)
  - 194.93.25.227 IP'ni threat intel bilan tekshiring.
  - 10.25.255.6 DMZ serveri holati normal ekanligini tekshiring.
  - Firewall session limitlarini tekshiring.
  - Noqonuniy bo'lsa: manbani bloklang, DMZ serverini tekshiring.
description_ru: |
  Это правило выявляет большое количество сессий, завершающихся TCP RST (Reset), из зоны DMZ к одному и тому же внешнему IP за короткий промежуток времени.
  Штормы TCP RST могут быть связаны с port scanning, connection flooding или попытками C2 beacon.
  Легитимные случаи: TCP timeout из-за сетевых проблем, конфигурация балансировщика нагрузки.
  Этапы SOC-триажа:
  - Произошли ли RST одновременно или последовательно? (сравните timestamp)
  - Проверьте IP 194.93.25.227 по threat intel.
  - Проверьте, что состояние DMZ-сервера 10.25.255.6 в норме.
  - Проверьте лимиты сессий firewall.
  - Если нелегитимно: заблокируйте источник, проверьте DMZ-сервер.
description_en: |
  This rule detects a high number of sessions ending with TCP RST (Reset) from the DMZ zone toward the same external IP within a short time window.
  TCP RST storms may be related to port scanning, connection flooding, or C2 beacon attempts.
  Legitimate cases: TCP timeout caused by network issues, load balancer configuration.
  SOC triage steps:
  - Did the RSTs occur simultaneously or sequentially? (compare the timestamps)
  - Check the IP 194.93.25.227 against threat intel.
  - Verify that the state of the DMZ server 10.25.255.6 is normal.
  - Check the firewall session limits.
  - If illegitimate: block the source and inspect the DMZ server.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-panw*
query_language: esql
query: |
  FROM logs-panw*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.kind == "event"
  | WHERE event.category == "network"
  | WHERE event.type == "end"
  | WHERE event.reason == "tcp-rst-from-client"
  | WHERE panw.panos.source.zone == "DMZ"
  | EVAL src_ip         = source.ip
  | EVAL dst_ip         = destination.ip
  | EVAL src_zone       = panw.panos.source.zone
  | EVAL dst_zone       = panw.panos.destination.zone
  | EVAL src_port       = source.port
  | EVAL dst_port       = destination.port
  | EVAL bytes_total    = network.bytes
  | EVAL packets_total  = network.packets
  | EVAL flow_id        = panw.panos.flow_id
  | EVAL ruleset        = panw.panos.ruleset
  | EVAL url_category   = panw.panos.url_category_list
  | STATS
      rst_count        = COUNT(*),
      src_ips          = VALUES(source.ip),
      dst_ips          = VALUES(destination.ip),
      src_ports        = VALUES(source.port),
      dst_ports        = VALUES(destination.port),
      total_bytes      = SUM(network.bytes),
      total_packets    = SUM(network.packets),
      avg_bytes        = AVG(network.bytes),
      flow_ids         = VALUES(panw.panos.flow_id),
      rulesets         = VALUES(panw.panos.ruleset),
      url_categories   = VALUES(panw.panos.url_category_list),
      last_seen        = MAX(@timestamp),
      first_seen       = MIN(@timestamp)
    BY source.ip, destination.ip, panw.panos.source.zone, event.reason
  | WHERE rst_count >= 3
  | EVAL
      source_ip    = source.ip,
      dest_ip      = destination.ip,
      src_zone     = panw.panos.source.zone,
      end_reason   = event.reason
  | KEEP
      source_ip, dest_ip, src_zone, end_reason,
      rst_count, total_bytes, total_packets, avg_bytes,
      src_ips, dst_ips, src_ports, dst_ports,
      flow_ids, rulesets, url_categories,
      last_seen, first_seen
  | SORT rst_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.reconnaissance
  - attack.impact
  - attack.t1595.001
  - attack.t1499.001
  - detection.threat-hunting
severity: medium
risk_score: 50
references:
  - "https://attack.mitre.org/techniques/T1595/001/"
  - "https://attack.mitre.org/techniques/T1499/001/"
nist: ["SC-5", "SI-4", "AU-12", "IR-4"]
pci_dss: ["1.3.2", "11.4", "6.4.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0043:
    T1595: ["T1595.001"]
  TA0040:
    T1499: ["T1499.001"]