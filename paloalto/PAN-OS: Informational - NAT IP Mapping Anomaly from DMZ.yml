rule_id: 1ca604be-95b9-4620-ba94-3bef3da9cf2b
name_uz: "PAN-OS: informatsion - DMZ'dan NAT IP moslashuvidagi anomaliya"
name_ru: "PAN-OS: информационное - аномалия сопоставления NAT IP из DMZ"
name_en: "PAN-OS: Informational - NAT IP Mapping Anomaly from DMZ"
description_uz: |
  Ushbu qoida DMZ zonasidagi serverlardan tashqariga chiqayotgan trafikda
  source.nat.ip manzillarining o'zgarishi yoki kutilmagan NAT IP'larni kuzatadi.
  Agar DMZ serveridan boshqa NAT IP'lar orqali trafik chiqsa — bu noqonuniy NAT konfiguratsiyasi,
  IP spoofing yoki ruxsatsiz tunnel bo'lishi mumkin.
  Qonuniy holatlar: load balancer IP'lari, bir nechta ISP NAT pool'lari.
  SOC triage bosqichlari:
  - Kutilgan NAT IP'lar ro'yxatini baseline bilan solishtiring.
  - Yangi yoki noma'lum NAT IP aniqlansa — network jamoasiga xabarlang.
  - source.nat.ip va destination.nat.ip kombinatsiyasini tekshiring.
  - related.ip field'idagi barcha IP'lar ruxsat etilganligini tekshiring.
description_ru: |
  Это правило отслеживает изменения адресов source.nat.ip или неожиданные NAT IP
  в исходящем трафике серверов зоны DMZ.
  Если трафик с сервера DMZ выходит через другие NAT IP — это может быть нелегитимная конфигурация NAT,
  IP spoofing или несанкционированный туннель.
  Легитимные случаи: IP-адреса балансировщика нагрузки, несколько NAT-пулов ISP.
  Этапы SOC-триажа:
  - Сравните список ожидаемых NAT IP с baseline.
  - При обнаружении нового или неизвестного NAT IP — сообщите сетевой команде.
  - Проверьте комбинацию source.nat.ip и destination.nat.ip.
  - Проверьте, что все IP в поле related.ip разрешены.
description_en: |
  This rule monitors changes of source.nat.ip addresses or unexpected NAT IPs
  in traffic going outbound from servers in the DMZ zone.
  If traffic from a DMZ server leaves through other NAT IPs — this may be an illegitimate NAT configuration,
  IP spoofing or an unauthorized tunnel.
  Legitimate cases: load balancer IPs, multiple ISP NAT pools.
  SOC triage steps:
  - Compare the list of expected NAT IPs with the baseline.
  - If a new or unknown NAT IP is detected — notify the network team.
  - Check the combination of source.nat.ip and destination.nat.ip.
  - Check that all IPs in the related.ip field are allowed.
type: esql
params: '{}'
schedule_interval: 15m
index:
  - logs-panw*
query_language: esql
query: |
  FROM logs-panw*
  | WHERE @timestamp >= NOW() - 900 seconds
  | WHERE event.category == "network"
  | WHERE panw.panos.source.zone == "DMZ"
  | WHERE source.nat.ip IS NOT NULL
  | EVAL src_ip          = source.ip
  | EVAL src_nat_ip      = source.nat.ip
  | EVAL dst_ip          = destination.ip
  | EVAL dst_nat_ip      = destination.nat.ip
  | EVAL src_zone        = panw.panos.source.zone
  | EVAL dst_zone        = panw.panos.destination.zone
  | EVAL ruleset         = panw.panos.ruleset
  | EVAL application     = network.application
  | EVAL transport       = network.transport
  | EVAL flow_id         = panw.panos.flow_id
  | EVAL nat_pair        = CONCAT(TO_STRING(source.ip), " -> NAT: ", TO_STRING(source.nat.ip))
  | EVAL known_nat       = CASE(
      source.nat.ip == TO_IP("185.203.236.10"), "KNOWN - Primary NAT",
      "UNKNOWN - Investigate"
    )
  | STATS
      session_count    = COUNT(*),
      unique_nat_ips   = COUNT_DISTINCT(source.nat.ip),
      src_ips          = VALUES(source.ip),
      src_nat_ips      = VALUES(source.nat.ip),
      dst_ips          = VALUES(destination.ip),
      dst_nat_ips      = VALUES(destination.nat.ip),
      nat_pairs        = VALUES(nat_pair),
      known_nats       = VALUES(known_nat),
      applications     = VALUES(network.application),
      rulesets         = VALUES(panw.panos.ruleset),
      dst_zones        = VALUES(panw.panos.destination.zone),
      flow_ids         = VALUES(panw.panos.flow_id),
      total_bytes      = SUM(network.bytes),
      last_seen        = MAX(@timestamp),
      first_seen       = MIN(@timestamp)
    BY source.ip, source.nat.ip, panw.panos.source.zone
  | WHERE session_count >= 5
  | EVAL
      source_ip   = source.ip,
      nat_ip      = source.nat.ip,
      src_zone    = panw.panos.source.zone
  | KEEP
      source_ip, nat_ip, src_zone,
      session_count, unique_nat_ips,
      src_ips, src_nat_ips, dst_ips, dst_nat_ips,
      nat_pairs, known_nats, applications,
      rulesets, dst_zones, flow_ids,
      total_bytes, last_seen, first_seen
  | SORT unique_nat_ips DESC
  | LIMIT 100
enabled: true
tags:
  - detection.informational
  - network.nat-monitoring
  - policy.network-baseline
severity: low
risk_score: 20
references:
  - "https://attack.mitre.org/techniques/T1599/"
nist: ["SC-7", "AU-12", "CM-8"]
pci_dss: ["1.3.2", "10.6.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1599: []