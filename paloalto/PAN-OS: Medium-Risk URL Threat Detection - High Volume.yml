rule_id: 5420dc08-dfb1-4382-a10a-31422925e7f3
name_uz: "PAN-OS: o'rtacha xavfli URL tahdidini aniqlash - yuqori hajm"
name_ru: "PAN-OS: обнаружение URL-угроз среднего риска - большой объём"
name_en: "PAN-OS: Medium-Risk URL Threat Detection - High Volume"
description_uz: |
  Ushbu qoida Palo Alto Networks firewall tomonidan aniqlangan "medium-risk" tahdidlarning yuqori hajmda sodir bo'lishini kuzatadi.
  Bu holat C2 (Command & Control) aloqasi, data exfiltration yoki malware yuklab olish urinishlarini ko'rsatishi mumkin.
  App teglari: "used-by-malware", "able-to-transfer-file", "has-known-vulnerability", "tunnel-other-application".
  Qonuniy holatlar: ommaviy CDN xizmatlari, antivirus yangilanishlari, korporativ proksi trafigi.
  SOC triage bosqichlari:
  - 194.93.25.227 IP manziliga VirusTotal/Shodan orqali threat intelligence tekshiring.
  - DMZ'dagi 10.25.255.6 manbasini aniqlang (server yoki proxy?).
  - SSL trafigi ichida anomal portlar yoki sertifikat muammolari borligini tekshiring.
  - Firewall "alert" action qo'llagan — block qilish kerakligini baholang.
  - Noqonuniy bo'lsa: IP'ni bloklang, DMZ hostini izolyatsiya qiling, incident oching.
description_ru: |
  Это правило отслеживает большой объём угроз "medium-risk", обнаруженных межсетевым экраном Palo Alto Networks.
  Это может указывать на связь C2 (Command & Control), data exfiltration или попытки загрузки malware.
  Теги App: "used-by-malware", "able-to-transfer-file", "has-known-vulnerability", "tunnel-other-application".
  Легитимные случаи: массовые сервисы CDN, обновления антивируса, трафик корпоративного прокси.
  Этапы SOC-триажа:
  - Проверьте IP-адрес 194.93.25.227 по threat intelligence через VirusTotal/Shodan.
  - Определите источник 10.25.255.6 в DMZ (сервер или прокси?).
  - Проверьте наличие аномальных портов или проблем с сертификатами в SSL-трафике.
  - Межсетевой экран применил action "alert" — оцените необходимость блокировки.
  - Если нелегитимно: заблокируйте IP, изолируйте хост в DMZ, откройте инцидент.
description_en: |
  This rule monitors a high volume of "medium-risk" threats detected by the Palo Alto Networks firewall.
  This may indicate C2 (Command & Control) communication, data exfiltration or malware download attempts.
  App tags: "used-by-malware", "able-to-transfer-file", "has-known-vulnerability", "tunnel-other-application".
  Legitimate cases: public CDN services, antivirus updates, corporate proxy traffic.
  SOC triage steps:
  - Check threat intelligence for IP address 194.93.25.227 via VirusTotal/Shodan.
  - Identify the source 10.25.255.6 in the DMZ (server or proxy?).
  - Check for anomalous ports or certificate issues inside the SSL traffic.
  - The firewall applied the "alert" action — assess whether blocking is needed.
  - If illegitimate: block the IP, isolate the DMZ host, open an incident.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-panw*
query_language: esql
query: |
  FROM logs-panw*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.kind == "alert"
  | WHERE event.category == "intrusion_detection"
  | WHERE panw.panos.url_category_list LIKE "*medium-risk*"
  | EVAL src_ip         = source.ip
  | EVAL dst_ip         = destination.ip
  | EVAL src_zone       = panw.panos.source.zone
  | EVAL dst_zone       = panw.panos.destination.zone
  | EVAL app            = network.application
  | EVAL threat_id      = panw.panos.threat.id
  | EVAL url_category   = panw.panos.url_category_list
  | EVAL action         = event.action
  | EVAL rule_name      = rule.name
  | STATS
      event_count     = COUNT(*),
      src_ips         = VALUES(source.ip),
      dst_ips         = VALUES(destination.ip),
      src_zones       = VALUES(panw.panos.source.zone),
      dst_zones       = VALUES(panw.panos.destination.zone),
      applications    = VALUES(network.application),
      threat_ids      = VALUES(panw.panos.threat.id),
      url_categories  = VALUES(panw.panos.url_category_list),
      actions         = VALUES(event.action),
      rule_names      = VALUES(rule.name),
      total_bytes     = SUM(network.bytes),
      last_seen       = MAX(@timestamp),
      first_seen      = MIN(@timestamp)
    BY source.ip, destination.ip, panw.panos.source.zone, network.application
  | WHERE event_count >= 5
  | EVAL
      source_ip       = source.ip,
      dest_ip         = destination.ip,
      source_zone     = panw.panos.source.zone
  | KEEP
      source_ip, dest_ip, source_zone, event_count,
      src_ips, dst_ips, src_zones, dst_zones,
      applications, threat_ids, url_categories,
      actions, rule_names, total_bytes,
      last_seen, first_seen
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.command-and-control
  - attack.exfiltration
  - attack.t1071.001
  - attack.t1048.002
  - detection.threat-hunting
severity: medium
risk_score: 60
references:
  - "https://attack.mitre.org/techniques/T1071/001/"
  - "https://attack.mitre.org/techniques/T1048/002/"
nist: ["SI-3", "SC-7", "AU-12", "IR-4"]
pci_dss: ["1.3.2", "6.3.2", "11.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0011:
    T1071: ["T1071.001"]
  TA0010:
    T1048: ["T1048.002"]