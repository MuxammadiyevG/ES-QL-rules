rule_id: c4a2490b-b96c-4c40-93cd-f2fa29f5412c
name_uz: "PaloAlto - Tizimning CRITICAL darajadagi voqeasi (Defense Evasion + Endpoint DoS)"
name_ru: "PaloAlto - системное событие уровня CRITICAL (Defense Evasion + Endpoint DoS)"
name_en: "PaloAlto - System Critical Severity Event (Defense Evasion + Endpoint DoS)"
description_uz: |
  Palo Alto NGFW tizimidan CRITICAL darajadagi system xabari aniqlandi.
  Bu jiddiy tizim nosozligi, qurilmaga hujum yoki xizmatni to'xtatish
  urinishining belgisi bo'lishi mumkin (T1089, T1499).
  Qonuniy holatlar: hardware nosozligi, datacenter muammosi.
  SOC triage bosqichlari:
  - Darhol NOC/NetOps jamoasini xabardor qiling
  - Qurilmaga fizik yoki remote kirish imkonini tekshiring
  - Parallel ravishda boshqa SIEM manbalaridan korrelyatsiya qiling
  - Qurilma backup/failover holatini tekshiring
  - Barcha admin sessiyalarini audit qiling
description_ru: |
  Обнаружено системное сообщение уровня CRITICAL от Palo Alto NGFW.
  Это может быть признаком серьёзного сбоя системы, атаки на устройство или попытки
  отказа в обслуживании (T1089, T1499).
  Легитимные случаи: аппаратный сбой, проблема в датацентре.
  Этапы SOC-триажа:
  - Немедленно уведомите команду NOC/NetOps
  - Проверьте возможность физического или удалённого доступа к устройству
  - Параллельно проведите корреляцию с другими источниками SIEM
  - Проверьте состояние backup/failover устройства
  - Проведите аудит всех админских сессий
description_en: |
  A CRITICAL severity system message was detected from the Palo Alto NGFW.
  This may be a sign of a serious system failure, an attack on the device or a denial-of-service
  attempt (T1089, T1499).
  Legitimate cases: hardware failure, datacenter issue.
  SOC triage steps:
  - Immediately notify the NOC/NetOps team
  - Check whether physical or remote access to the device is possible
  - In parallel, correlate with other SIEM sources
  - Check the backup/failover state of the device
  - Audit all admin sessions
type: esql
params: '{}'
schedule_interval: 2m
index:
  - logs-panw*
query_language: esql
query: |
  FROM logs-panw*
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE event.dataset == "panw.system"
  | WHERE log.level == "critical"
  | STATS
      event_count    = COUNT(*),
      devices        = VALUES(observer.hostname),
      unique_devices = COUNT_DISTINCT(observer.hostname),
      reasons        = VALUES(event.reason),
      rule_names     = VALUES(rule.name),
      serials        = VALUES(observer.serial_number)
    BY agent_id, observer.hostname, bucket = DATE_TRUNC(2 minutes, @timestamp)
  | KEEP bucket, observer.hostname, event_count, unique_devices, reasons, rule_names, serials
  | SORT event_count DESC
  | LIMIT 50
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1089
  - attack.impact
  - attack.t1499
  - paloalto
  - system
  - critical
  - firewall
severity: critical
risk_score: 95
references:
  - "https://attack.mitre.org/techniques/T1089/"
  - "https://attack.mitre.org/techniques/T1499/"
nist: ["SI-3", "SC-5", "IR-4"]
pci_dss: ["1.4", "10.6.1", "10.8"]
gdpr: ["35.7.d"]
hipaa: ["164.312.b"]
mitre_attack:
  TA0005:
    T1089: []
  TA0040:
    T1499: []