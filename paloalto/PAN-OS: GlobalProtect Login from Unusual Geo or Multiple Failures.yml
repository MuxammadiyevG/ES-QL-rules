rule_id: e5c2a1e3-bff1-4ee1-9812-e97c01439424
name_uz: "PAN-OS: GlobalProtect'ga g'ayrioddiy geolokatsiyadan kirish yoki ko'p muvaffaqiyatsiz urinishlar"
name_ru: "PAN-OS: вход в GlobalProtect из необычной геолокации или множественные сбои"
name_en: "PAN-OS: GlobalProtect Login from Unusual Geo or Multiple Failures"
description_uz: |
  Ushbu qoida GlobalProtect gateway/portal orqali VPN autentifikatsiyasidagi
  ko'p sonli muvaffaqiyatsiz urinishlarni yoki geografik anomaliyalarni kuzatadi.
  Bir foydalanuvchi uchun bir nechta turli mamlakatlardan kelgan urinishlar yoki
  takroriy login failure'lar — credential stuffing, account takeover yoki
  ruxsatsiz remote access urinishini ko'rsatishi mumkin (T1078 / T1110).
  Qonuniy holatlar: xodimning safari, mobil tarmoq, VPN qayta ulanishi.
  SOC triage bosqichlari:
  - Foydalanuvchi va manba IP geolokatsiyasini odatdagi joylashuv bilan solishtiring.
  - Bir vaqtda turli mamlakatlardan urinishlar ("impossible travel") borligini tekshiring.
  - Failure'lardan keyin muvaffaqiyatli ulanish bo'lganmi?
  - Foydalanuvchi bilan bog'lanib, urinish unga tegishli ekanligini tasdiqlang.
  - Kerak bo'lsa: hisobni vaqtincha o'chiring, MFA majburiy qiling, IP'ni bloklang.
description_ru: |
  Это правило отслеживает множественные неудачные попытки VPN-аутентификации
  через GlobalProtect gateway/portal или географические аномалии.
  Попытки для одного пользователя из нескольких разных стран или
  повторяющиеся неудачные входы — могут указывать на credential stuffing, захват учётной записи или
  попытку несанкционированного удалённого доступа (T1078 / T1110).
  Легитимные случаи: командировка сотрудника, мобильная сеть, переподключение VPN.
  Этапы SOC-триажа:
  - Сравните геолокацию пользователя и IP-адреса источника с обычным местоположением.
  - Проверьте наличие одновременных попыток из разных стран ("impossible travel").
  - Было ли успешное подключение после неудачных попыток?
  - Свяжитесь с пользователем и подтвердите, что попытки принадлежат ему.
  - При необходимости: временно отключите учётную запись, включите обязательную MFA, заблокируйте IP.
description_en: |
  This rule monitors multiple failed VPN authentication attempts
  or geographic anomalies through the GlobalProtect gateway/portal.
  Attempts for a single user coming from several different countries or
  repeated login failures — may indicate credential stuffing, account takeover or
  an unauthorized remote access attempt (T1078 / T1110).
  Legitimate cases: employee travel, mobile network, VPN reconnection.
  SOC triage steps:
  - Compare the user and the source IP geolocation with the usual location.
  - Check for simultaneous attempts from different countries ("impossible travel").
  - Was there a successful connection after the failures?
  - Contact the user and confirm the attempts belong to them.
  - If needed: temporarily disable the account, enforce MFA, block the IP.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-panw*
query_language: esql
query: |
  FROM logs-panw*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.dataset == "panw.globalprotect"
  | WHERE event.category == "authentication"
  | STATS
      attempt_count    = COUNT(*),
      failure_count    = COUNT(CASE(event.outcome == "failure", 1, NULL)),
      users            = VALUES(source.user.name),
      source_ips       = VALUES(source.ip),
      unique_src_ips   = COUNT_DISTINCT(source.ip),
      src_countries    = VALUES(source.geo.country_name),
      unique_countries = COUNT_DISTINCT(source.geo.country_name),
      outcomes         = VALUES(event.outcome),
      devices          = VALUES(observer.hostname),
      first_seen       = MIN(@timestamp),
      last_seen        = MAX(@timestamp)
    BY agent_id, source.user.name, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE failure_count >= 5 OR unique_countries >= 2
  | KEEP bucket, source.user.name, attempt_count, failure_count, unique_src_ips,
         unique_countries, users, source_ips, src_countries, outcomes, devices,
         first_seen, last_seen
  | SORT failure_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.initial-access
  - attack.t1078
  - attack.credential-access
  - attack.t1110
  - paloalto
  - globalprotect
  - vpn
  - firewall
severity: medium
risk_score: 60
references:
