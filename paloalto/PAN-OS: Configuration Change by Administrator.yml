rule_id: 95b5af59-7d75-4dcc-a0d2-019fdeee89bd
name_uz: "PAN-OS: Administrator tomonidan konfiguratsiya o'zgarishi"
name_ru: "PAN-OS: Изменение конфигурации администратором"
name_en: "PAN-OS: Configuration Change by Administrator"
description_uz: |
  Ushbu qoida Palo Alto NGFW konfiguratsiyasiga administrator tomonidan
  kiritilgan o'zgarishlarni (add / edit / delete) kuzatadi (panw.config dataset).
  Konfiguratsiya o'zgarishlari xavfsizlik siyosatining zaiflashtirilishi,
  ruxsatsiz qoidalar qo'shilishi yoki himoyani chetlab o'tish urinishini
  ko'rsatishi mumkin (T1562 - Impair Defenses).
  Qonuniy holatlar: rejali change management, admin operatsiyasi, yangilanish.
  SOC triage bosqichlari:
  - O'zgarish kim tomonidan (admin user) va qaysi qurilmada qilinganini aniqlang.
  - Change management tizimida mos ticket borligini tekshiring.
  - Qaysi obyekt/yo'l o'zgartirilganini (event.action, panw.panos.type) tahlil qiling.
  - Ish vaqtidan tashqari o'zgarishlar anomal bo'lishi mumkin.
  - Kutilmagan bo'lsa: incident oching va konfiguratsiya backup'i bilan solishtiring.
description_ru: |
  Данное правило отслеживает изменения (add / edit / delete), внесённые администратором
  в конфигурацию Palo Alto NGFW (dataset panw.config).
  Изменения конфигурации могут указывать на ослабление политики безопасности,
  добавление несанкционированных правил или попытку обхода защиты
  (T1562 - Impair Defenses).
  Легитимные случаи: плановый change management, операция администратора, обновление.
  Этапы SOC-триажа:
  - Определите, кем (admin user) и на каком устройстве было сделано изменение.
  - Проверьте наличие соответствующего тикета в системе change management.
  - Проанализируйте, какой объект/путь был изменён (event.action, panw.panos.type).
  - Изменения вне рабочего времени могут быть аномальными.
  - Если изменение неожиданное: откройте инцидент и сравните с backup конфигурации.
description_en: |
  This rule monitors changes (add / edit / delete) made by an administrator
  to the Palo Alto NGFW configuration (panw.config dataset).
  Configuration changes may indicate a weakening of the security policy,
  the addition of unauthorized rules or an attempt to bypass protection
  (T1562 - Impair Defenses).
  Legitimate cases: planned change management, admin operation, update.
  SOC triage steps:
  - Identify who (admin user) made the change and on which device.
  - Check whether a matching ticket exists in the change management system.
  - Analyze which object/path was changed (event.action, panw.panos.type).
  - Changes outside business hours may be anomalous.
  - If unexpected: open an incident and compare with the configuration backup.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-panw*
query_language: esql
query: |
  FROM logs-panw*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.dataset == "panw.config"
  | WHERE event.action IN ("add", "edit", "delete", "set", "rename", "move", "clone")
  | STATS
      change_count   = COUNT(*),
      actions        = VALUES(event.action),
      admins         = VALUES(source.user.name),
      admin_ips      = VALUES(source.ip),
      devices        = VALUES(observer.hostname),
      serials        = VALUES(observer.serial_number),
      first_seen     = MIN(@timestamp),
      last_seen      = MAX(@timestamp)
    BY agent_id, observer.hostname, source.user.name, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP bucket, observer.hostname, source.user.name, change_count, actions,
         admins, admin_ips, devices, serials, first_seen, last_seen
  | SORT change_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1562
  - paloalto
  - config
  - firewall
severity: medium
risk_score: 55
references:
  - "https://attack.mitre.org/techniques/T1562/"
  - "https://docs.paloaltonetworks.com/pan-os/admin/monitoring/view-and-manage-logs/log-types-and-severity-levels"
nist: ["CM-3", "CM-5", "AU-12", "SI-4"]
pci_dss: ["1.1.1", "10.2.2", "11.5"]
gdpr: ["32.1.b"]
hipaa: ["164.312.b"]
mitre_attack:
  TA0005:
    T1562: []
