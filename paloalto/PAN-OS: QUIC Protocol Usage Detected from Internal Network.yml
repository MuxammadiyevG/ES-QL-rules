rule_id: a49b822d-2576-4f2b-869e-bb002d38aff2
name_uz: "PAN-OS: ichki tarmoqdan QUIC protokolidan foydalanish aniqlandi"
name_ru: "PAN-OS: обнаружено использование протокола QUIC из внутренней сети"
name_en: "PAN-OS: QUIC Protocol Usage Detected from Internal Network"
description_uz: |
  Ushbu qoida ichki tarmoqdagi qurilmalardan QUIC protokoli orqali tashqi manzillarga ulanishni kuzatadi.
  QUIC (UDP/443) Google va Cloudflare xizmatlari tomonidan ishlatiladigan zamonaviy transport protokoli.
  QUIC trafigi an'anaviy SSL inspeksiyasini chetlab o'tishi mumkin, shu sababli monitoring qilish muhim.
  Qonuniy holatlar: Chrome/Edge brauzerlari, YouTube, Google Workspace, Cloudflare xizmatlari.
  SOC triage bosqichlari:
  - QUIC foydalanayotgan qurilmalar ro'yxatini baseline bilan solishtiring.
  - Manzil IP'larini tekshiring — faqat ma'lum CDN/provayderlarmi?
  - QUIC orqali tunnel yaratish (quic-tunnel) urinishlari borligini tekshiring.
  - Korporativ siyosat QUIC'ni ruxsat etadimi — aks holda bloklashni baholang.
description_ru: |
  Это правило отслеживает подключения к внешним адресам по протоколу QUIC с устройств внутренней сети.
  QUIC (UDP/443) — современный транспортный протокол, используемый сервисами Google и Cloudflare.
  Трафик QUIC может обходить традиционную SSL-инспекцию, поэтому его мониторинг важен.
  Легитимные случаи: браузеры Chrome/Edge, YouTube, Google Workspace, сервисы Cloudflare.
  Этапы SOC-триажа:
  - Сравните список устройств, использующих QUIC, с baseline.
  - Проверьте IP-адреса назначения — только ли это известные CDN/провайдеры?
  - Проверьте наличие попыток создания туннеля через QUIC (quic-tunnel).
  - Разрешает ли корпоративная политика QUIC — иначе оцените блокировку.
description_en: |
  This rule monitors connections to external addresses over the QUIC protocol from internal network devices.
  QUIC (UDP/443) is a modern transport protocol used by Google and Cloudflare services.
  QUIC traffic can bypass traditional SSL inspection, which is why monitoring it is important.
  Legitimate cases: Chrome/Edge browsers, YouTube, Google Workspace, Cloudflare services.
  SOC triage steps:
  - Compare the list of devices using QUIC with the baseline.
  - Check the destination IPs — are they only known CDNs/providers?
  - Check for tunneling attempts over QUIC (quic-tunnel).
  - Does corporate policy allow QUIC — otherwise assess blocking.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-panw*
query_language: esql
query: |
  FROM logs-panw*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.kind == "event"
  | WHERE event.category == "network"
  | WHERE network.application == "quic-base"
  | WHERE network.transport == "udp"
  | EVAL src_ip         = source.ip
  | EVAL dst_ip         = destination.ip
  | EVAL src_zone       = panw.panos.source.zone
  | EVAL dst_zone       = panw.panos.destination.zone
  | EVAL dst_country    = destination.geo.country_name
  | EVAL bytes_total    = network.bytes
  | EVAL packets_total  = network.packets
  | EVAL end_reason     = event.reason
  | EVAL flow_id        = panw.panos.flow_id
  | EVAL ruleset        = panw.panos.ruleset
  | EVAL dst_label      = CASE(
      destination.ip == "216.58.209.174",  "Google",
      destination.ip == "188.114.96.1",    "Cloudflare",
      destination.ip == "172.64.155.214",  "Cloudflare",
      "Unknown"
    )
  | STATS
      session_count    = COUNT(*),
      src_ips          = VALUES(source.ip),
      dst_ips          = VALUES(destination.ip),
      dst_labels       = VALUES(dst_label),
      dst_countries    = VALUES(destination.geo.country_name),
      total_bytes      = SUM(network.bytes),
      total_packets    = SUM(network.packets),
      avg_bytes        = AVG(network.bytes),
      end_reasons      = VALUES(event.reason),
      rulesets         = VALUES(panw.panos.ruleset),
      flow_ids         = VALUES(panw.panos.flow_id),
      last_seen        = MAX(@timestamp),
      first_seen       = MIN(@timestamp)
    BY source.ip, panw.panos.source.zone, network.application, network.transport
  | WHERE session_count >= 5
  | EVAL
      source_ip    = source.ip,
      src_zone     = panw.panos.source.zone,
      application  = network.application,
      transport    = network.transport
  | KEEP
      source_ip, src_zone, application, transport,
      session_count, total_bytes, total_packets, avg_bytes,
      src_ips, dst_ips, dst_labels, dst_countries,
      end_reasons, rulesets, flow_ids,
      last_seen, first_seen
  | SORT session_count DESC
  | LIMIT 100
enabled: true
tags:
  - detection.informational
  - network.quic
  - policy.protocol-monitoring
severity: low
risk_score: 20
references:
  - "https://attack.mitre.org/techniques/T1071/001/"
  - "https://www.rfc-editor.org/rfc/rfc9000"
nist: ["SC-7", "AU-12", "CM-7"]
pci_dss: ["1.3.2", "10.6.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0011:
    T1071: ["T1071.001"]