rule_id: 2a9c9955-7cda-49a9-8e19-daa985766486
name_uz: "PCI DSS 1.3.3 - Internetdan CDE'ga to'g'ridan-to'g'ri ulanishga ruxsat berilgan (Palo Alto)"
name_ru: "PCI DSS 1.3.3 - разрешено прямое подключение из Интернета в CDE (Palo Alto)"
name_en: "PCI DSS 1.3.3 - Direct Internet to CDE Connection Allowed (Palo Alto)"
description_uz: |
  Internet zonasidan ichki CDE tarmog'iga DMZ'ni chetlab o'tib to'g'ridan-to'g'ri ALLOW qilingan
  trafikni aniqlaydi - bu PCI DSS 1.3.3 talabining jiddiy buzilishi bo'lib, u Internet va CDE o'rtasida
  kirish yoki chiqish yo'nalishidagi har qanday to'g'ridan-to'g'ri ulanishni taqiqlaydi.
  Agar ishonchsiz zonalardan to'g'ridan-to'g'ri CDE tegiga ega manzillarga trafik ALLOW qilinayotgan bo'lsa,
  bu noto'g'ri sozlangan yoki haddan tashqari ruxsat beruvchi firewall qoidasidan darak beradi.
  Trigger: internet/untrust zonasidan ma'lum CDE manziliga har qanday ALLOW harakati.
  False positive: CDE sifatida noto'g'ri zonalashtirilgan, DMZ'da joylashgan qonuniy servislar.
  Triage: ushbu trafikka ruxsat bergan firewall qoidasini DARHOL ko'rib chiqing,
  manzil haqiqatan ham CDE tizimi ekanligini aniqlang, firewall administratoriga eskalatsiya qiling.
  ESLATMA: maqsad CDE zonalari nomlarini o'zingizning haqiqiy zona konfiguratsiyangizga moslang.
description_ru: |
  Обнаруживает трафик, РАЗРЕШЁННЫЙ (ALLOWED) напрямую из зоны Интернета во внутреннюю сеть CDE,
  в обход DMZ - критическое нарушение требования PCI DSS 1.3.3, которое запрещает
  любые прямые входящие или исходящие соединения между Интернетом и CDE.
  Если трафик из недоверенных зон РАЗРЕШАЕТСЯ напрямую к назначениям с тегом CDE,
  это указывает на некорректно настроенное или чрезмерно разрешительное правило firewall.
  Trigger: любое действие ALLOW из зоны internet/untrust к известному назначению CDE.
  False positives: легитимные сервисы, размещённые в DMZ, но ошибочно отнесённые к зоне CDE.
  Triage: НЕМЕДЛЕННО проверьте правило firewall, разрешившее этот трафик,
  определите, действительно ли назначение является системой CDE, эскалируйте администратору firewall.
  ПРИМЕЧАНИЕ: обновите имена зон назначения CDE в соответствии с вашей реальной конфигурацией зон.
description_en: |
  Detects traffic ALLOWED directly from Internet zone to internal CDE network,
  bypassing DMZ - a critical violation of PCI DSS Requirement 1.3.3 which prohibits
  any direct connections inbound or outbound between Internet and CDE.
  If traffic is being ALLOWED from untrusted zones directly to CDE-tagged destinations,
  this indicates a misconfigured or overly permissive firewall rule.
  Trigger: Any ALLOW action from internet/untrust zone to known CDE destination.
  False positives: Legitimate DMZ-hosted services that are incorrectly zoned as CDE.
  Triage: IMMEDIATELY review the firewall rule that allowed this traffic,
  identify if the destination is truly a CDE system, escalate to firewall admin.
  NOTE: Update destination CDE zone names to match your actual zone configuration.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - filebeat-paloalto*
query_language: esql
query: |
  FROM filebeat-paloalto*
  | WHERE event.dataset == "panw.panos"
    AND event.action IN ("allow", "allowed")
    AND event.outcome == "success"
    AND network.direction == "ingress"
    AND observer.ingress.zone IN ("untrust", "internet", "external", "wan", "outside")
    AND observer.egress.zone IN ("cde", "cardholder", "pci", "secure", "internal-cde")
  | STATS
      allowed_connections    = COUNT(*),
      unique_sources         = COUNT_DISTINCT(source.ip),
      unique_destinations    = COUNT_DISTINCT(destination.ip),
      source_ips             = VALUES(source.ip),
      destination_ips        = VALUES(destination.ip),
      destination_ports      = VALUES(destination.port),
      applications_allowed   = VALUES(network.application),
      permitting_rules       = VALUES(rule.name)
    BY agent_id, observer.hostname,
       rule.name,
       bucket = DATE_TRUNC(5 minutes, @timestamp)
  | EVAL severity_level = CASE(
      allowed_connections >= 100, "critical",
      allowed_connections >= 10,  "critical",
      "critical"
    )
  | EVAL risk_score = 99
  | KEEP agent_id, bucket, observer.hostname, rule.name, allowed_connections,
         unique_sources, unique_destinations, source_ips,
         destination_ips, destination_ports, applications_allowed,
         permitting_rules, severity_level, risk_score
  | SORT allowed_connections DESC
enabled: false
tags:
  - pci_dss
  - firewall_misconfiguration
  - direct_access
  - critical
  - palo_alto
severity: critical
risk_score: 99
references:
  - "PCI DSS v3.2.1 Requirement 1.3.3: Do not allow direct connections inbound or outbound between Internet and CDE"
  - "PCI DSS v3.2.1 Requirement 1.3: Prohibit direct public access between Internet and CDE"
pci_dss: ["1.3.3", "1.3", "1.3.1"]
mitre_attack:
  - "T1133"
  - "T1190"