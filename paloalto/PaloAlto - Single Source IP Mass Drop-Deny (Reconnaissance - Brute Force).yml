rule_id: a42b0107-1519-408f-81dd-25b2a74853c3
name_uz: "PaloAlto - Bitta manba IP'dan ommaviy drop/deny (razvedka / brute force)"
name_ru: "PaloAlto - массовые drop/deny с одного исходного IP (разведка / перебор паролей (brute force))"
name_en: "PaloAlto - Single Source IP Mass Drop-Deny (Reconnaissance / Brute Force)"
description_uz: |
  Bitta manba IP manzilidan qisqa vaqt ichida ko'p sonli drop/deny
  voqealari aniqlandi. Bu port skanerlash, brute force yoki automated
  exploit urinishining aniq belgisi (T1190, T1072).
  Qonuniy holatlar: monitoring tizimi, pentest (oldindan kelishilgan).
  SOC triage bosqichlari:
  - Manba IP'ni threat intel (VirusTotal, AbuseIPDB) bilan tekshiring
  - IP internal yoki external ekanligini aniqlang
  - Maqsad portlar ketma-ketligini solishtiring (sequential = scan)
  - Pentest jadvali va ruxsatnomalarini tekshiring
  - Kerak bo'lsa IP'ni vaqtincha bloklang
description_ru: |
  С одного исходного IP-адреса за короткий промежуток времени обнаружено большое количество
  событий drop/deny. Это явный признак сканирования портов, перебора паролей (brute force) или
  автоматизированной попытки эксплуатации (T1190, T1072).
  Легитимные случаи: система мониторинга, pentest (согласованный заранее).
  Этапы SOC-триажа:
  - Проверьте исходный IP по threat intel (VirusTotal, AbuseIPDB)
  - Определите, внутренний это IP или внешний
  - Сопоставьте последовательность целевых портов (последовательные = сканирование)
  - Проверьте график pentest и выданные разрешения
  - При необходимости временно заблокируйте IP
description_en: |
  A large number of drop/deny events from a single source IP address was detected
  within a short time window. This is a clear sign of port scanning, brute force or an automated
  exploit attempt (T1190, T1072).
  Legitimate cases: monitoring system, pentest (agreed in advance).
  SOC triage steps:
  - Check the source IP against threat intel (VirusTotal, AbuseIPDB)
  - Determine whether the IP is internal or external
  - Compare the sequence of target ports (sequential = scan)
  - Check the pentest schedule and authorizations
  - Temporarily block the IP if needed
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-panw*
query_language: esql
query: |
  FROM logs-panw*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.dataset == "panw.traffic"
  | WHERE event.action IN ("drop", "deny")
  | STATS
      blocked_count   = COUNT(*),
      dest_ips        = VALUES(destination.ip),
      unique_dst_ips  = COUNT_DISTINCT(destination.ip),
      dst_ports       = VALUES(destination.port),
      unique_ports    = COUNT_DISTINCT(destination.port),
      protocols       = VALUES(network.transport),
      devices         = VALUES(observer.hostname),
      reasons         = VALUES(event.reason),
      country         = VALUES(source.geo.country_name)
    BY agent_id, source.ip, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE blocked_count >= 50
  | KEEP bucket, source.ip, blocked_count, unique_dst_ips, unique_ports,
         dest_ips, dst_ports, protocols, devices, reasons, country
  | SORT blocked_count DESC
  | LIMIT 50
enabled: true
tags:
  - attack.discovery
  - attack.t1046
  - attack.reconnaissance
  - attack.t1595.001
  - paloalto
  - traffic
  - scan
  - brute-force
  - firewall
severity: high
risk_score: 75
references:
  - "https://attack.mitre.org/techniques/T1046/"
  - "https://attack.mitre.org/techniques/T1595/001/"
nist: ["SC-7", "SI-4", "RA-5"]
pci_dss: ["1.4", "10.6.1", "11.4"]
gdpr: ["35.7.d"]
hipaa: ["164.312.b"]
mitre_attack:
  TA0007:
    T1046: []
  TA0043:
    T1595: ["T1595.001"]