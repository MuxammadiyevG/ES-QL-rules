rule_id: d6479d3d-d42e-48b7-bb47-49d265f31f9d
name_uz: "PaloAlto - Tizimning HIGH darajadagi voqeasi (Defense Evasion indikatori)"
name_ru: "PaloAlto - системное событие уровня HIGH (индикатор Defense Evasion)"
name_en: "PaloAlto - System High Severity Event (Defense Evasion Indicator)"
description_uz: |
  Palo Alto NGFW tizimidan HIGH darajadagi system xabari aniqlandi.
  Bu qurilma konfiguratsiyasining o'zgartirilishi, xavfsizlik xizmatlarining
  o'chirilishi yoki tizim muammosining belgisi bo'lishi mumkin (T1089 - Defense Evasion).
  Qonuniy holatlar: rejali texnik xizmat, firmware yangilanishi, admin operatsiyasi.
  SOC triage bosqichlari:
  - Voqea sodir bo'lgan qurilma nomini aniqlang (observer.hostname)
  - O'sha vaqtda admin tomonidan qilingan o'zgarishlarni tekshiring
  - Boshqa qurilmalarda ham xuddi shunday voqea borligini solishtiring
  - Change management tizimida mos ticket borligini tekshiring
  - Agar kutilmagan bo'lsa, incident ochib, qurilma loglarini to'liq oling
description_ru: |
  Обнаружено системное сообщение уровня HIGH от Palo Alto NGFW.
  Это может быть признаком изменения конфигурации устройства, отключения
  служб безопасности или системной проблемы (T1089 - Defense Evasion).
  Легитимные случаи: плановое техническое обслуживание, обновление firmware, операция администратора.
  Этапы SOC-триажа:
  - Определите имя устройства, на котором произошло событие (observer.hostname)
  - Проверьте изменения, внесённые администратором в это время
  - Сравните, есть ли такое же событие и на других устройствах
  - Проверьте наличие соответствующего тикета в системе change management
  - Если событие неожиданное, откройте инцидент и снимите полные логи устройства
description_en: |
  A HIGH severity system message was detected from the Palo Alto NGFW.
  This may be a sign of a device configuration change, security services being
  disabled, or a system problem (T1089 - Defense Evasion).
  Legitimate cases: planned maintenance, firmware update, admin operation.
  SOC triage steps:
  - Identify the name of the device where the event occurred (observer.hostname)
  - Check the changes made by administrators at that time
  - Compare whether the same event also occurred on other devices
  - Check for a matching ticket in the change management system
  - If unexpected, open an incident and collect the full device logs
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-panw*
query_language: esql
query: |
  FROM logs-panw*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.dataset == "panw.system"
  | WHERE log.level == "high"
  | STATS
      event_count      = COUNT(*),
      devices          = VALUES(observer.hostname),
      unique_devices   = COUNT_DISTINCT(observer.hostname),
      reasons          = VALUES(event.reason),
      rule_names       = VALUES(rule.name),
      serial_numbers   = VALUES(observer.serial_number)
    BY agent_id, observer.hostname, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP bucket, observer.hostname, event_count, unique_devices, reasons, rule_names, serial_numbers
  | SORT event_count DESC
  | LIMIT 50
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1089
  - paloalto
  - system
  - firewall
severity: high
risk_score: 72
references:
  - "https://attack.mitre.org/techniques/T1089/"
nist: ["SI-3", "CM-6", "AU-12"]
pci_dss: ["1.4", "10.6.1", "10.8"]
gdpr: ["35.7.d"]
hipaa: ["164.312.b"]
mitre_attack:
  TA0005:
    T1089: []