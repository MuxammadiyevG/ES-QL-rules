rule_id: f2d7406a-7496-43be-8f69-4bd793d5b2b7
name: UniFi WiFi Client Disconnected
description: |
  Ushbu qoida WiFi klient uzilishini, ulanish davomiyligi, sarflangan trafik va oxirgi RSSI bilan kuzatadi.
  Qisqa ulanishlar yoki takroriy uzilishlar connection flapping, interferensiya yoki deauthentication holatini ko'rsatishi mumkin.
type: esql
params: "{}"
schedule_interval: 10m
index:
  - logs-udmpro-default
query_language: esql
query: |
  FROM logs-udmpro-default
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE event.module == "udmpro" AND event.action == "WiFi Client Disconnected"
  | GROK event.original "%{GREEDYDATA:cef_prefix}\\|401\\|WiFi Client Disconnected\\|%{NUMBER:cef_severity}\\|UNIFIcategory=%{DATA:unifi_category} UNIFIhost=%{DATA:unifi_host} UNIFIlastConnectedToDeviceName=%{DATA:ap_name} UNIFIlastConnectedToDeviceIp=%{IP:ap_ip} UNIFIlastConnectedToDeviceMac=%{MAC:ap_mac} UNIFIlastConnectedToDeviceModel=%{DATA:ap_model} UNIFIlastConnectedToDeviceVersion=%{DATA:ap_version} UNIFIclientAlias=%{DATA:client_alias} UNIFIclientHostname=%{DATA:client_hostname} UNIFIclientIp=%{IP:client_ip} UNIFIclientMac=%{MAC:client_mac} UNIFIwifiChannel=%{NUMBER:wifi_channel} UNIFIwifiChannelWidth=%{NUMBER:wifi_channel_width} UNIFIwifiName=%{DATA:wifi_name} UNIFIwifiBand=%{DATA:wifi_band} UNIFIwifiAirtimeUtilization=%{NUMBER:wifi_airtime} UNIFIwifiInterference=%{NUMBER:wifi_interference} UNIFIlastConnectedToWiFiRssi=%{NUMBER:last_rssi} UNIFIduration=%{DATA:duration} UNIFIusageDown=%{DATA:usage_down} UNIFIusageUp=%{DATA:usage_up} UNIFInetworkName=%{DATA:network_name} UNIFInetworkSubnet=%{DATA:network_subnet} UNIFInetworkVlan=%{NUMBER:network_vlan} UNIFIutcTime=%{TIMESTAMP_ISO8601:event_time} msg=%{GREEDYDATA:message}"
  | EVAL dyn_risk = CASE(TO_INTEGER(last_rssi) <= -85, 65, TO_INTEGER(wifi_interference) >= 50, 60, 35)
  | KEEP @timestamp, event_time, client_alias, client_hostname, client_ip, client_mac, ap_name, ap_ip, ap_mac, wifi_name, wifi_band, wifi_channel, wifi_channel_width, wifi_airtime, wifi_interference, last_rssi, duration, usage_up, usage_down, network_name, network_subnet, network_vlan, message, dyn_risk
  | SORT dyn_risk DESC, @timestamp DESC
  | LIMIT 200
enabled: false
tags: [UniFi, WiFi, Disconnect]
severity: medium
risk_score: 35
references: []
mitre_attack:
  TA0040:
    T1498: []
nist: ["AC-18", "AU-12", "SI-4"]
pci_dss: ["10.2", "11.5"]
gdpr: ["32.1.b"]
