rule_id: afb9171f-8168-4749-a9ec-2a1448e3b66d
name_uz: "Bir nechta UniFi qurilmasi qayta ulandi"
name_ru: "Несколько устройств UniFi переподключились"
name_en: "UniFi Multiple Devices Reconnected"
description_uz: |
  Ushbu qoida bir nechta UniFi qurilmasi bir vaqtda qayta ulanganini aniqlaydi.
  Elektr uzilishi, switch restart, controller muammosi yoki uplink flapping holatlarini tekshiring.
description_ru: |
  Это правило обнаруживает одновременное переподключение нескольких устройств UniFi.
  Проверьте случаи отключения электропитания, switch restart, проблемы контроллера или uplink flapping.
description_en: |
  This rule detects multiple UniFi devices reconnecting at the same time.
  Check for a power outage, a switch restart, a controller issue or uplink flapping.
type: esql
params: "{}"
schedule_interval: 5m
index:
  - logs-udmpro-default
query_language: esql
query: |
  FROM logs-udmpro-default
  | WHERE @timestamp >= NOW() - 10 minutes
  | WHERE event.module == "udmpro" AND event.action == "Multiple Devices Reconnected"
  | GROK event.original "%{GREEDYDATA:cef_prefix}\\|516\\|Multiple Devices Reconnected\\|%{NUMBER:cef_severity}\\|UNIFIcategory=%{DATA:unifi_category} UNIFIhost=%{DATA:unifi_host} UNIFIdeviceList=%{DATA:device_list} cnt=%{NUMBER:device_count} UNIFIutcTime=%{TIMESTAMP_ISO8601:event_time} msg=%{GREEDYDATA:message}"
  | EVAL dyn_risk = CASE(TO_INTEGER(device_count) >= 10, 80, TO_INTEGER(device_count) >= 5, 65, 50)
  | KEEP @timestamp, event_time, device_list, device_count, message, dyn_risk
  | SORT dyn_risk DESC, @timestamp DESC
  | LIMIT 100
enabled: false
tags: [UniFi, Device Reconnect, Availability]
severity: medium
risk_score: 50
references: []
mitre_attack:
  TA0040:
    T1499: []
nist: ["SI-4", "CP-8", "AU-12"]
pci_dss: ["10.2", "11.5"]
gdpr: ["32.1.b", "32.1.c"]
