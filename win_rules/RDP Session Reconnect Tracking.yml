rule_id: 61b93d94-29e5-4b0a-8a9c-9a42e323ffbf
name: RDP Session Reconnect / Disconnect Tracking
description: |
  Baseline/monitoring: RDP sessiya qayta ulanish (4778) va uzilish (4779) hodisalarini
  akkaunt va klient manzili bo'yicha yig'adi. Noodatiy klient manzilidan reconnect sessiya
  o'g'irlash (session hijack) belgisi bo'lishi mumkin — `client_addresses` ni kuzating.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code IN ("4778", "4779")
  | EVAL acct = winlog.event_data.AccountName
  | EVAL client_name = COALESCE(winlog.event_data.ClientName, "-")
  | EVAL client_addr = COALESCE(winlog.event_data.ClientAddress, "-")
  | EVAL session = COALESCE(winlog.event_data.SessionName, "-")
  | EVAL evt = CASE(event.code == "4778", "Reconnect", "Disconnect")
  | WHERE acct IS NOT NULL AND NOT acct LIKE "*$"
  | STATS
      event_count = COUNT(*),
      unique_clients = COUNT_DISTINCT(client_addr),
      client_names = VALUES(client_name),
      client_addresses = VALUES(client_addr),
      sessions = VALUES(session),
      event_types = VALUES(evt),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, acct, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE event_count >= 1
  | EVAL dyn_risk = CASE(unique_clients >= 2, 70, 40)
  | KEEP agent_id, bucket, winlog.computer_name, acct, event_count, unique_clients,
      client_names, client_addresses, sessions, event_types, dyn_risk, first_seen, last_seen
  | SORT unique_clients DESC, event_count DESC
  | LIMIT 200
enabled: false
tags:
  - detection.baseline
  - attack.lateral-movement
  - attack.t1021.001
  - RDP
severity: medium
risk_score: 50
mitre_attack:
  TA0008:
    T1021: ["T1021.001"]
nist: ["AC-17", "AU-2", "AU-12", "SI-4"]
pci_dss: ["10.2.5", "8.1.6"]
gdpr: ["32.1.a"]
