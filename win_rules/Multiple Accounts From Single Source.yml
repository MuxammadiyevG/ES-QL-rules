rule_id: aa000004-0000-4000-a000-000000000004
name: Multiple Accounts Authenticated From Single Source
description: |
  Ushbu qoida bitta manba IP'dan qisqa vaqtda KO'P xil akkauntning muvaffaqiyatli kirishini
  aniqlaydi (4624) — credential testing muvaffaqiyati, password-spray natijasi yoki egallangan
  pivot host belgisidir (T1078). Jump-server/VDI istisno bo'lishi mumkin.
  SOC triage:
  - `src_ip` jump/VDI emasmi? `users` ro'yxati — bir necha akkaunt bitta manbadan nega?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4624"
  | WHERE winlog.event_data.LogonType IN ("3", "10")
  | EVAL target_user = winlog.event_data.TargetUserName
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, "-")
  | WHERE target_user IS NOT NULL AND NOT target_user LIKE "*$"
  | WHERE src_ip != "-" AND src_ip != "::1" AND src_ip != "127.0.0.1" AND src_ip != "0.0.0.0"
  | STATS
      logon_count = COUNT(*),
      unique_users = COUNT_DISTINCT(target_user),
      users = VALUES(target_user),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, src_ip, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE unique_users >= 5
  | EVAL dyn_risk = CASE(unique_users >= 15, 82, unique_users >= 10, 76, 70)
  | KEEP agent_id, bucket, src_ip, logon_count, unique_users, users, dyn_risk, first_seen, last_seen
  | SORT unique_users DESC
  | LIMIT 200
enabled: true
tags:
  - attack.lateral-movement
  - attack.t1078
  - AuthAnomaly
severity: medium
risk_score: 72
mitre_attack:
  TA0008:
    T1078: []
nist: ["AC-7", "AU-12", "SI-4"]
pci_dss: ["10.2.5", "8.1.6"]
gdpr: ["32.1.a"]
