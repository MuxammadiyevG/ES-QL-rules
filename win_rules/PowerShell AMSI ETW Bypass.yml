rule_id: a08803c4-0d5f-449b-82bd-56ba78aa8e02
name: PowerShell AMSI / ETW Bypass
description: |
  Ushbu qoida AMSI (Antimalware Scan Interface) yoki ETW logging'ni chetlab o'tish urinishini
  aniqlaydi: ScriptBlock (4104) ichida `amsiInitFailed`, `AmsiUtils`, `amsiContext` yoki
  `EtwEventWrite` manipulyatsiyasi. Bu xavfsizlik nazoratini o'chirish (T1562.001).
  SOC triage:
  - `sample_script` da reflection orqali AMSI/ETW patch bormi? Darhol host'ni tekshiring.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-PowerShell/Operational"
  | WHERE event.code == "4104"
  | EVAL script_block = COALESCE(winlog.event_data.ScriptBlockText, "")
  | EVAL actor = COALESCE(winlog.user.name, "-")
  | WHERE TO_LOWER(script_block) RLIKE ".*(amsiinitfailed|amsiutils|amsicontext|amsiscanbuffer|etweventwrite|\\[ref\\].assembly.gettype).*"
  | EVAL sb_sample = SUBSTRING(script_block, 1, 400)
  | STATS
      hits = COUNT(*),
      sample_scripts = VALUES(sb_sample),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, actor, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = 90
  | KEEP agent_id, bucket, winlog.computer_name, actor, hits, sample_scripts, dyn_risk, first_seen, last_seen
  | SORT hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1562.001
  - PowerShell
severity: high
risk_score: 90
mitre_attack:
  TA0005:
    T1562: ["T1562.001"]
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
