rule_id: 9c22613f-4ffc-4418-a934-7a2a03a6cbca
name: Active Directory Schema Modification Detected
description: |
  Ushbu qoida AD schema partition'idagi o'zgarishni aniqlaydi: 5136/5137 da `ObjectName`
  ichida "CN=Schema,CN=Configuration" bo'lsa. Schema o'zgarishi juda kam va Schema Admins
  talab qiladi.
  ESLATMA: sizning indeksingizda `ObjectDN`/`ObjectClass` MAVJUD EMAS — DN uchun `ObjectName`
  ishlatildi. 5136 DN'ni ObjectName'ga yozmasa, rule hech narsa qaytarmaydi (xato bermaydi).
  SOC triage:
  - `modifier` Schema Admins a'zosimi? `objects` da nima o'zgargan?
  - Tasdiqlanmasa: o'zgarishni va Schema Admins a'zoligini auditdan o'tkazing.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code IN ("5136", "5137")
  | EVAL modifier    = winlog.event_data.SubjectUserName
  | EVAL object_name = COALESCE(winlog.event_data.ObjectName, "-")
  | EVAL object_type = COALESCE(winlog.event_data.ObjectType, "-")
  | EVAL op_raw      = COALESCE(winlog.event_data.OperationType, "-")
  | EVAL operation   = CASE(op_raw == "%%14674", "Value Added", op_raw == "%%14675", "Value Deleted", op_raw)
  | WHERE TO_LOWER(object_name) RLIKE ".*cn=schema,cn=configuration.*"
  | WHERE modifier IS NOT NULL
  | STATS
      schema_changes = COUNT(*),
      objects = VALUES(object_name),
      object_types = VALUES(object_type),
      operations = VALUES(operation),
      first_change = MIN(@timestamp),
      last_change  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, modifier, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE schema_changes >= 1
  | EVAL dyn_risk = 90
  | KEEP agent_id, bucket, winlog.computer_name, modifier, schema_changes, objects,
      object_types, operations, first_change, last_change
  | SORT schema_changes DESC
  | LIMIT 200
enabled: true
tags:
  - attack.persistence
  - attack.defense-evasion
  - attack.t1484
  - detection.critical
severity: high
risk_score: 90
nist: ["AU-6", "AU-9", "SI-4"]
pci_dss: ["10.2.7", "10.5"]
gdpr: ["32.1.a", "32.2"]
mitre_attack:
  TA0005:
    T1484: []
