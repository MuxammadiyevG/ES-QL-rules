rule_id: 623dc991-f131-4398-840e-58c194ea634d
name: Executable Dropped to System32 / Drivers by Non-System Process
description: |
  Ushbu qoida System32 yoki drivers papkasiga exe/dll/sys yozilishini aniqlaydi (Sysmon 11),
  ishonchli o'rnatuvchi (TrustedInstaller/msiexec/WU) bo'lmagan jarayon tomonidan — xizmat/
  drayver persistence yoki DLL search-order hijack (T1543.003/T1574).
  SOC triage:
  - `files`/`images` — qaysi fayl, kim yozdi? Patch/installer emasmi?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "11"
  | EVAL tfn = TO_LOWER(COALESCE(winlog.event_data.TargetFilename, "-"))
  | EVAL img = TO_LOWER(COALESCE(winlog.event_data.Image, "-"))
  | EVAL actor = COALESCE(winlog.event_data.User, "-")
  | WHERE tfn RLIKE ".*.windows.system32..*\\.(exe|dll|sys)" OR tfn RLIKE ".*.windows.syswow64..*\\.(exe|dll|sys)"
  | WHERE NOT img RLIKE ".*(trustedinstaller|tiworker|msiexec|wuauclt|poqexec|dism|drvinst|setup|cleanmgr).exe"
  | WHERE NOT img RLIKE ".*(.windows.system32.|.windows.winsxs.|.windows.servicing.).*"
  | STATS
      hits = COUNT(*),
      files = VALUES(tfn),
      images = VALUES(img),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = 80
  | KEEP agent_id, bucket, winlog.computer_name, hits, files, images, users, dyn_risk, first_seen, last_seen
  | SORT hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.persistence
  - attack.t1543.003
  - attack.t1574
  - File
severity: high
risk_score: 80
mitre_attack:
  TA0003:
    T1543: ["T1543.003"]
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
