rule_id: 8349719e-0870-418c-bb4d-6fc9fa8618de
name: Domain Password Policy Weakened
description: |
  Ushbu qoida domen parol siyosatining zaiflashtirilishini aniqlaydi (4739 — Domain Policy
  Changed). Qisqa `MinimumPasswordLength` (< 8) hujumchiga parol taxminini osonlashtiradi.
  Eslatma: sizning indeksingizda faqat `MinimumPasswordLength`/`MinimumPasswordLengthAudit`
  bor; `MaxPasswordAge`/`PasswordHistoryLength`/`PasswordProperties` yo'q (Windows
  versiyasiga qarab kelmaydi).
  SOC triage:
  - `actor` kim, `min_lengths` qanday o'zgargan?
  - Rasmiy baseline o'zgarishimi?
  - Tasdiqlanmasa: siyosatni tiklang, aktorni cheklang.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4739"
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, "-")
  | EVAL min_pwd_length = COALESCE(winlog.event_data.MinimumPasswordLength, "-")
  | EVAL min_pwd_length_audit = COALESCE(winlog.event_data.MinimumPasswordLengthAudit, "-")
  | WHERE actor IS NOT NULL AND NOT actor LIKE "*$"
  | EVAL is_weak = CASE(min_pwd_length IN ("0", "1", "2", "3", "4", "5", "6", "7"), 1, 0)
  | STATS
      policy_changes = COUNT(*),
      weak_hits = SUM(is_weak),
      min_lengths = VALUES(min_pwd_length),
      min_lengths_audit = VALUES(min_pwd_length_audit),
      first_change = MIN(@timestamp),
      last_change  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, actor, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE policy_changes >= 1
  | EVAL dyn_risk = CASE(weak_hits >= 1, 90, 75)
  | KEEP agent_id, bucket, winlog.computer_name, actor, policy_changes, weak_hits, min_lengths,
      min_lengths_audit, dyn_risk, first_change, last_change
  | SORT dyn_risk DESC, policy_changes DESC
  | LIMIT 200
enabled: true
tags:
  - attack.defense-evasion
  - attack.persistence
  - attack.t1098
  - detection.critical
severity: high
risk_score: 85
mitre_attack:
  TA0003:
    T1098: []
nist: ["AU-6", "AU-9", "SI-4"]
pci_dss: ["10.2.7", "10.5"]
gdpr: ["32.1.a", "32.2"]
