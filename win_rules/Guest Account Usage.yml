rule_id: 1a28f905-901b-4136-bc13-4897d6f110e0
name: Guest Account Usage
description: |
  Ushbu qoida Guest akkaunt orqali autentifikatsiya (4624/4625) urinishlarini aniqlaydi.
  Guest odatda o'chirilgan bo'lishi kerak; undan foydalanish ruxsatsiz kirish belgisi
  (T1078.001).
  SOC triage:
  - Guest yoqilganmi? `src_ips` qayerdan? Darhol Guest'ni o'chiring.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code IN ("4624", "4625")
  | EVAL target_user = TO_LOWER(COALESCE(winlog.event_data.TargetUserName, "-"))
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, "-")
  | EVAL outcome = CASE(event.code == "4624", "Success", "Failure")
  | WHERE target_user RLIKE "(guest|гость|.*\\\\guest)"
  | STATS
      attempts = COUNT(*),
      outcomes = VALUES(outcome),
      src_ips = VALUES(src_ip),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, target_user, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE attempts >= 1
  | EVAL dyn_risk = 80
  | KEEP agent_id, bucket, winlog.computer_name, target_user, attempts, outcomes, src_ips, dyn_risk, first_seen, last_seen
  | SORT attempts DESC
  | LIMIT 200
enabled: true
tags:
  - attack.initial-access
  - attack.persistence
  - attack.t1078.001
  - AuthAnomaly
severity: high
risk_score: 80
mitre_attack:
  TA0001:
    T1078: ["T1078.001"]
nist: ["AC-2", "AC-7", "AU-12"]
pci_dss: ["8.1.1", "8.1.6"]
gdpr: ["32.1.a"]
