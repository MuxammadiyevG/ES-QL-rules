rule_id: fc17dcde-6c1b-4023-8a69-7aeb76c3e411
name: Pass-the-Hash - NTLM Network Logon
description: |
  Ushbu qoida Pass-the-Hash belgilarini aniqlaydi: NTLM bilan tarmoq logon (4624 Type 3),
  LogonProcessName `NtLmSsp`, mashina bo'lmagan akkaunt. NTLM hash bilan autentifikatsiya
  lateral movement uchun ishlatiladi (T1550.002). "NTLM Auth Where Kerberos Expected" bilan
  to'ldiruvchi.
  SOC triage:
  - `target_user`/`src_ip` — domen userimi, manba kutilganmi? Kerberos o'rniga NTLM nega?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4624"
  | WHERE winlog.event_data.LogonType == "3"
  | EVAL authpkg = TO_LOWER(COALESCE(winlog.event_data.AuthenticationPackageName, "-"))
  | EVAL logonproc = TO_LOWER(COALESCE(winlog.event_data.LogonProcessName, "-"))
  | EVAL target_user = winlog.event_data.TargetUserName
  | EVAL src_ip = COALESCE(winlog.event_data.IpAddress, "-")
  | EVAL keylen = COALESCE(winlog.event_data.KeyLength, "-")
  | WHERE authpkg RLIKE ".*ntlm.*" AND logonproc RLIKE ".*ntlmssp.*"
  | WHERE target_user IS NOT NULL AND NOT target_user LIKE "*$"
  | WHERE NOT TO_LOWER(target_user) RLIKE "(anonymous logon|system)"
  | STATS
      logon_count = COUNT(*),
      unique_users = COUNT_DISTINCT(target_user),
      users = VALUES(target_user),
      src_ips = VALUES(src_ip),
      key_lengths = VALUES(keylen),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, src_ip, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE logon_count >= 1
  | EVAL dyn_risk = CASE(unique_users >= 5, 82, 72)
  | KEEP agent_id, bucket, winlog.computer_name, src_ip, logon_count, unique_users, users, src_ips, key_lengths, dyn_risk, first_seen, last_seen
  | SORT dyn_risk DESC, logon_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.lateral-movement
  - attack.t1550.002
  - Lateral Movement
severity: medium
risk_score: 75
mitre_attack:
  TA0008:
    T1550: ["T1550.002"]
nist: ["AC-17", "AU-2", "AU-12", "SI-4"]
pci_dss: ["10.2.5", "8.1.6"]
gdpr: ["32.1.a"]
