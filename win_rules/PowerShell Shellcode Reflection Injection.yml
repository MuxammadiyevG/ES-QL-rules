rule_id: c91d76bd-0be6-4db3-bc71-82a726c1bd70
name: PowerShell Shellcode / Reflection / Injection
description: |
  Ushbu qoida PowerShell orqali xotiraga kod yuklash / process injection belgilarini aniqlaydi:
  `VirtualAlloc`, `CreateThread`, `CreateRemoteThread`, `WriteProcessMemory`,
  `[Reflection.Assembly]::Load`, `Marshal.Copy`, `GetProcAddress` + kernel32/ntdll API'lari.
  SOC triage:
  - `sample_script` da in-memory injection bormi? Host'ni izolyatsiya qiling.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-PowerShell/Operational"
  | WHERE event.code == "4104"
  | EVAL script_block = COALESCE(winlog.event_data.ScriptBlockText, "")
  | EVAL actor = COALESCE(winlog.user.name, "-")
  | WHERE TO_LOWER(script_block) RLIKE ".*(virtualalloc|virtualallocex|createremotethread|writeprocessmemory|reflection.assembly|reflection.emit|marshal.copy|getprocaddress|getdelegatefortype|ntdll|kernel32.dll).*"
  | EVAL sb_sample = SUBSTRING(script_block, 1, 400)
  | STATS
      hits = COUNT(*),
      sample_scripts = VALUES(sb_sample),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, actor, bucket = DATE_TRUNC(30 minutes, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = 92
  | KEEP agent_id, bucket, winlog.computer_name, actor, hits, sample_scripts, dyn_risk, first_seen, last_seen
  | SORT hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.execution
  - attack.defense-evasion
  - attack.t1059.001
  - attack.t1055
  - PowerShell
severity: high
risk_score: 92
mitre_attack:
  TA0002:
    T1059: ["T1059.001"]
  TA0005:
    T1055: []
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
