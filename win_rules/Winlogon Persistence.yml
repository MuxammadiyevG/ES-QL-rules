rule_id: cf21673f-a259-4d53-a2cf-7b7ed3497db3
name: Winlogon Shell / Userinit Persistence
description: |
  Ushbu qoida Winlogon Shell/Userinit/Notify kalitlariga yozishni aniqlaydi (Sysmon 13).
  Bu kalitlar login paytida ishga tushadi — hujumchi qo'shimcha bajariluvchi qo'shib
  persistence o'rnatadi (T1547.004).
  SOC triage:
  - `details` da explorer.exe / userinit.exe dan tashqari narsa bormi?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "13"
  | EVAL tobj = TO_LOWER(COALESCE(winlog.event_data.TargetObject, "-"))
  | EVAL details = COALESCE(winlog.event_data.Details, "-")
  | EVAL img = COALESCE(winlog.event_data.Image, "-")
  | EVAL actor = COALESCE(winlog.event_data.User, "-")
  | WHERE tobj RLIKE ".*winlogon.*" AND tobj RLIKE ".*(shell|userinit|notify|taskman|gpextensions).*"
  | EVAL is_susp = CASE(TO_LOWER(details) RLIKE ".*(explorer\\.exe.*,|userinit\\.exe.*,|temp|appdata|powershell|cmd\\.exe|\\.ps1|rundll32).*", 1, 0)
  | STATS
      hits = COUNT(*),
      susp_hits = SUM(is_susp),
      target_objects = VALUES(tobj),
      details = VALUES(details),
      images = VALUES(img),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = CASE(susp_hits >= 1, 90, 72)
  | KEEP agent_id, bucket, winlog.computer_name, hits, susp_hits, target_objects, details, images, users, dyn_risk, first_seen, last_seen
  | SORT dyn_risk DESC, hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.persistence
  - attack.t1547.004
  - Registry
severity: high
risk_score: 85
mitre_attack:
  TA0003:
    T1547: ["T1547.004"]
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
