rule_id: 5bdd228b-cae6-486f-a186-9a027b726227
name: Account Lockout / Domain Policy Changed
description: |
  Ushbu qoida domen siyosati o'zgarishini aniqlaydi (4739 — Domain Policy Changed). 4739
  kamdan-kam va yuqori imtiyoz talab qiladi; lockout/parol siyosatini zaiflashtirish brute
  force'ga yo'l ochadi.
  Eslatma: sizning indeksingizda `LockoutThreshold`/`LockoutDuration` MAVJUD EMAS — shu
  sabab aniq lockout qiymatini ko'rsata olmaydi; rule har qanday 4739 o'zgarishini va mavjud
  `MinimumPasswordLength` ni surface qiladi. Lockout qiymatini ko'rish uchun audit/parser'da
  shu maydonlarni yoqing.
  SOC triage:
  - `actor` kim, bu rasmiy baseline o'zgarishimi (change ticket)?
  - Tasdiqlanmasa: siyosatni tiklang, aktorni cheklang.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4739"
  | EVAL actor = COALESCE(winlog.event_data.SubjectUserName, "-")
  | EVAL min_pwd_length = COALESCE(winlog.event_data.MinimumPasswordLength, "-")
  | EVAL domain = COALESCE(winlog.event_data.TargetDomainName, winlog.event_data.SubjectDomainName, "-")
  | WHERE actor IS NOT NULL AND NOT actor LIKE "*$"
  | STATS
      change_count = COUNT(*),
      actors = VALUES(actor),
      domains = VALUES(domain),
      min_lengths = VALUES(min_pwd_length),
      first_change = MIN(@timestamp),
      last_change  = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE change_count >= 1
  | EVAL dyn_risk = 78
  | KEEP agent_id, bucket, winlog.computer_name, change_count, actors, domains, min_lengths,
      dyn_risk, first_change, last_change
  | SORT change_count DESC
  | LIMIT 200
enabled: true
tags:
  - attack.defense-evasion
  - attack.persistence
  - attack.t1098
  - detection.threat-hunting
severity: high
risk_score: 70
references:
  - "https://attack.mitre.org/techniques/T1098/"
nist: ["AC-7", "IA-5"]
pci_dss: ["8.1.6", "8.1.7"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0003:
    T1098: []
