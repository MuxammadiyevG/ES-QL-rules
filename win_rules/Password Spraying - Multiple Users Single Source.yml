rule_id: 43e6d3da-c515-4a1e-aef1-52df229da311
name: Password Spraying - Multiple Users Single Source
description: |
  Ushbu qoida password spray'ni aniqlaydi: bitta manbadan (`src_ip`) qisqa vaqtda KO'P xil
  akkauntga muvaffaqiyatsiz logon (4625). Nishon akkaunt `TargetUserName` da bo'ladi (avvalgi
  versiya xato tarzda Subject'ni sanagan edi). Past-shovqinli sprey ko'plab akkauntdan birini
  egallashga urinadi.
  SOC triage:
  - `src_ip` — manba reputatsiyasi/segmenti; `users_targeted` — nishonlar.
  - Tasdiqlansa: manba IP'ni bloklang, MFA/conditional access kuchaytiring.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Security"
  | WHERE event.code == "4625"
  | EVAL victim     = winlog.event_data.TargetUserName
  | EVAL src_ip     = COALESCE(winlog.event_data.IpAddress, "-")
  | EVAL logon_type = COALESCE(winlog.event_data.LogonType, "-")
  | EVAL workstation = COALESCE(winlog.event_data.WorkstationName, "-")
  | EVAL status     = COALESCE(winlog.event_data.Status, "-")
  | WHERE victim IS NOT NULL AND NOT victim LIKE "*$"
  | WHERE src_ip != "-" AND src_ip != "::1" AND src_ip != "127.0.0.1"
  | STATS
      failed_attempts = COUNT(*),
      unique_users = COUNT_DISTINCT(victim),
      users_targeted = VALUES(victim),
      logon_types = VALUES(logon_type),
      workstations = VALUES(workstation),
      status_codes = VALUES(status),
      first_seen = MIN(@timestamp),
      last_seen  = MAX(@timestamp)
    BY agent_id, src_ip, winlog.computer_name, bucket = DATE_TRUNC(10 minutes, @timestamp)
  | WHERE unique_users >= 5 AND failed_attempts >= 10
  | EVAL dyn_risk = CASE(unique_users >= 20, 90, unique_users >= 10, 85, 78)
  | KEEP agent_id, bucket, src_ip, winlog.computer_name, failed_attempts, unique_users,
      users_targeted, logon_types, workstations, status_codes, dyn_risk, first_seen, last_seen
  | SORT dyn_risk DESC, unique_users DESC
  | LIMIT 200
enabled: true
tags:
  - attack.credential-access
  - attack.t1110.003
  - detection.threat-hunting
severity: high
risk_score: 75
references:
  - "https://attack.mitre.org/techniques/T1110/003/"
nist: ["IA-5", "SI-4"]
pci_dss: ["8.2.1", "10.2.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0006:
    T1110: ["T1110.003"]
