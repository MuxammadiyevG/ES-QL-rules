rule_id: 23db09f8-4ab8-4db6-87a3-6b0f8123f985
name: Scheduled Task Launched Suspicious Process
description: |
  Ushbu qoida scheduled task tomonidan shubhali jarayon ishga tushirilishini aniqlaydi
  (TaskScheduler/Operational 129 — "created process", `Path`). Task orqali powershell/cmd/
  mshta yoki temp'dan ijro persistence/execution belgisidir (T1053.005).
  SOC triage:
  - `paths` qaysi bajariluvchi, qaysi `task_names`? Qonuniy avtomatlashtirish emasmi?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-TaskScheduler/Operational"
  | WHERE event.code == "129"
  | EVAL path = TO_LOWER(COALESCE(winlog.event_data.Path, "-"))
  | EVAL tn = COALESCE(winlog.event_data.TaskName, "-")
  | WHERE path RLIKE ".*(powershell|pwsh|cmd\\.exe|mshta|rundll32|regsvr32|wscript|cscript|certutil|bitsadmin|\\.temp\\.|\\.appdata\\.|\\.public\\.|\\.programdata\\.).*"
  | STATS
      hits = COUNT(*),
      paths = VALUES(path),
      task_names = VALUES(tn),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = 80
  | KEEP agent_id, bucket, winlog.computer_name, hits, paths, task_names, dyn_risk, first_seen, last_seen
  | SORT hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.persistence
  - attack.execution
  - attack.t1053.005
  - ScheduledTask
severity: high
risk_score: 80
mitre_attack:
  TA0002:
    T1053: ["T1053.005"]
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
