rule_id: b78275ad-2078-4cec-a26d-5267bff4c412
name: Defender / AMSI Tampering via Registry
description: |
  Ushbu qoida Windows Defender yoki AMSI'ni registry orqali o'chirish/buzishni aniqlaydi
  (Sysmon 13): DisableAntiSpyware, DisableRealtimeMonitoring, DisableBehaviorMonitoring,
  Exclusions yoki AMSI provider o'chirish (T1562.001).
  SOC triage:
  - `target_objects`/`details` qaysi himoya o'chirildi? Ruxsatlimi?
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-winlog*
query_language: esql
query: |
  FROM logs-winlog*
  | WHERE @timestamp >= NOW() - 15 minutes
  | WHERE winlog.channel == "Microsoft-Windows-Sysmon/Operational"
  | WHERE event.code == "13"
  | EVAL tobj = TO_LOWER(COALESCE(winlog.event_data.TargetObject, "-"))
  | EVAL details = COALESCE(winlog.event_data.Details, "-")
  | EVAL img = COALESCE(winlog.event_data.Image, "-")
  | EVAL actor = COALESCE(winlog.event_data.User, "-")
  | WHERE tobj RLIKE ".*(disableantispyware|disablerealtimemonitoring|disablebehaviormonitoring|disableioavprotection|disableonaccessprotection|disablescriptscanning|tamperprotection|amsi.providers).*"
      OR (tobj RLIKE ".*windows defender.*" AND tobj RLIKE ".*exclusions.*")
  | STATS
      hits = COUNT(*),
      target_objects = VALUES(tobj),
      details = VALUES(details),
      images = VALUES(img),
      users = VALUES(actor),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
    BY agent_id, winlog.computer_name, bucket = DATE_TRUNC(1 hour, @timestamp)
  | WHERE hits >= 1
  | EVAL dyn_risk = 88
  | KEEP agent_id, bucket, winlog.computer_name, hits, target_objects, details, images, users, dyn_risk, first_seen, last_seen
  | SORT hits DESC
  | LIMIT 200
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1562.001
  - Registry
severity: high
risk_score: 88
mitre_attack:
  TA0005:
    T1562: ["T1562.001"]
nist: ["SI-4", "AU-12", "CM-7"]
pci_dss: ["10.2.7", "11.4"]
gdpr: ["32.1.a"]
