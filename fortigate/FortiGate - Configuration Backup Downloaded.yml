rule_id: 06417cc9-b8df-4c95-b616-15d3a1a409e6
name_uz: "FortiGate - Konfiguratsiya zaxira nusxasi yuklab olindi"
name_ru: "FortiGate - Загрузка резервной копии конфигурации"
name_en: "FortiGate - Configuration Backup Downloaded"
description_uz: |
  Ushbu qoida FortiGate qurilmasidan admin tomonidan to'liq konfiguratsiya zaxira nusxasini
  (backup) yuklab olinishini aniqlaydi. Konfiguratsiya faylida parollar, VPN kalitlari va
  boshqa maxfiy ma'lumotlar bo'lishi mumkin, shu sababli uni yuklab olish credential exposure
  yoki ma'lumot o'g'irlash (Collection / Exfiltration) belgisi bo'lishi mumkin (T1602, T1567).
  Qonuniy holatlar: rejaviy backup jarayonlari, migratsiya, audit.

  SOC triage bosqichlari:
  - Backupni yuklab olgan admin (`user.name`) va manba IP (`source.ip`)ni aniqlang.
  - Yuklab olish vaqti rejaviy backup oynasiga mos kelishini tekshiring.
  - Bir admindan qisqa vaqt ichida bir nechta backup so'rovlari bo'lsa shubhali deb baholang.
  - Noqonuniy bo'lsa, admin akkauntini bloklang va credentiallarni yangilang.
description_ru: |
  Данное правило выявляет загрузку администратором полной резервной копии конфигурации
  (backup) с устройства FortiGate. Файл конфигурации может содержать пароли, ключи VPN и
  другие конфиденциальные данные, поэтому его загрузка может быть признаком раскрытия учётных данных
  или кражи данных (Collection / Exfiltration) (T1602, T1567).
  Легитимные случаи: плановые процессы резервного копирования, миграция, аудит.

  Этапы SOC-триажа:
  - Определите администратора (`user.name`), загрузившего backup, и IP источника (`source.ip`).
  - Проверьте, соответствует ли время загрузки плановому окну резервного копирования.
  - Считайте подозрительным несколько запросов backup от одного администратора за короткое время.
  - Если действие нелегитимно, заблокируйте учётную запись администратора и обновите учётные данные.
description_en: |
  This rule detects the download of a full configuration backup from a FortiGate device by an
  administrator. The configuration file may contain passwords, VPN keys and
  other sensitive data, so downloading it may be a sign of credential exposure
  or data theft (Collection / Exfiltration) (T1602, T1567).
  Legitimate cases: scheduled backup processes, migration, audit.

  SOC triage steps:
  - Identify the administrator (`user.name`) who downloaded the backup and the source IP (`source.ip`).
  - Check whether the download time matches the scheduled backup window.
  - Treat several backup requests from one administrator within a short time as suspicious.
  - If illegitimate, block the administrator account and rotate the credentials.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-fortinet.fortigate-*
query_language: esql
query: |
  FROM logs-fortinet.fortigate-*
  | WHERE @timestamp >= NOW() - 20 minutes
  /* FortiGate event/system logs surface only as raw `message` in this deployment; heuristic match. Requires FortiGate event-log onboarding to fire. */
  | WHERE TO_LOWER(message) RLIKE ".*(configuration backup|configuration is downloaded|cfg backuped|config download).*"
  | EVAL Device = COALESCE(observer.name, "FortiGate")
  | STATS
      download_count = COUNT(*),
      users = VALUES(user.name),
      src_ips = VALUES(source.ip),
      messages = VALUES(message),
      last_seen = MAX(@timestamp)
    BY Device, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP bucket, Device, download_count, users, src_ips, messages, last_seen
  | SORT download_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.collection
  - attack.exfiltration
  - attack.t1602
  - attack.t1567
  - fortigate.audit
  - configuration.management
severity: high
risk_score: 70
references:
  - "https://attack.mitre.org/techniques/T1602/"
  - "https://attack.mitre.org/techniques/T1567/"
  - "https://docs.fortinet.com/document/fortigate/7.4.0/fortios-log-message-reference"
nist: ["AC-6", "AU-12", "SC-28"]
pci_dss: ["10.2.1", "10.2.2", "3.4"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0009:
    T1602: []
  TA0010:
    T1567: []
