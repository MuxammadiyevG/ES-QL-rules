rule_id: 155d0745-9352-4a23-8681-57559e43fce0
name_uz: "FortiGate - Ichki tarmoqni skanerlash (Lateral Movement)"
name_ru: "FortiGate - Сканирование внутренней сети (Lateral Movement)"
name_en: "FortiGate - Internal Network Scanning (Lateral Movement)"
description_uz: |
  Ushbu qoida bitta ichki manba IP-manzilidan qisqa vaqt ichida ko'plab turli xil ichki manzillarga ulanish urinishlarini aniqlaydi. 
  Bu hujumchining tarmoq ichida boshqa qurbonlarni qidirayotganini (Internal Reconnaissance) anglatishi mumkin.
description_ru: |
  Данное правило выявляет попытки подключения с одного внутреннего IP-адреса источника ко множеству различных внутренних адресов за короткое время. 
  Это может означать, что атакующий ищет других жертв внутри сети (Internal Reconnaissance).
description_en: |
  This rule detects connection attempts from a single internal source IP address to many different internal addresses within a short time. 
  This may mean that an attacker is looking for other victims inside the network (Internal Reconnaissance).
type: esql
params: '{}'
query_language: esql
schedule_interval: 10m
index:
- logs-fortinet.fortigate-*
query: |
  FROM logs-fortinet.fortigate-*
  | WHERE @timestamp >= NOW() - 15 minutes
    AND fortinet.fortigate.subtype == "forward"
  | EVAL s_ip_str = TO_STRING(source.ip), 
         d_ip_str = TO_STRING(destination.ip)
  | WHERE s_ip_str RLIKE "10\\..*|172\\.(1[6-9]|2[0-9]|3[0-1])\\..*|192\\.168\\..*"
    AND d_ip_str RLIKE "10\\..*|172\\.(1[6-9]|2[0-9]|3[0-1])\\..*|192\\.168\\..*"
  | STATS 
      unique_targets = COUNT_DISTINCT(d_ip_str),
      total_attempts = COUNT(*),
      last_seen = MAX(@timestamp)
    BY source.ip, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE unique_targets > 20
  | SORT unique_targets DESC
  | LIMIT 100
enabled: true
tags:
  - attack.discovery
  - attack.t1046
  - fortigate.lateral_movement
severity: high
risk_score: 80
references:
  - "https://docs.fortinet.com/document/fortigate/7.4.0/fortios-log-message-reference"
nist: ["SI-4", "CA-7"]
gdpr: ["32.1.b"]
pci_dss: ["11.4"]
mitre_attack:
  TA0007:
    T1046: []