rule_id: f52c0d20-463c-4115-a36f-b50c85165b14
name_uz: "Fortigate - Tarmoq hujumi aniqlandi"
name_ru: "Fortigate - Обнаружена сетевая атака"
name_en: "Fortigate - Network Attack Detected"
description_uz: |
  Ushbu qoida Fortigate IPS tomonidan aniqlangan tarmoq hujumlarini monitoring qiladi.
  Detected action bilan hujum aniqlanganini, lekin to'xtatilmaganini bildiradi.
  Qonuniy holatlar: false positive, test trafigi, vulnerability scanning.
  SOC triage bosqichlari:
  - Attack turini va attack ID'ni aniqlang
  - Manba va destination IP manzillarini tahlil qiling
  - Attack signature va severity'ni tekshiring
  - Network traffic pattern'ini tahlil qiling
  - Muvaffaqiyatli exploit bo'lganmi tekshiring
  - Zarur bo'lsa blocking rule qo'shing
description_ru: |
  Данное правило отслеживает сетевые атаки, обнаруженные Fortigate IPS.
  Action 'detected' означает, что атака обнаружена, но не остановлена.
  Легитимные случаи: false positive, тестовый трафик, vulnerability scanning.
  Этапы SOC-триажа:
  - Определите тип атаки и attack ID
  - Проанализируйте IP-адреса источника и назначения
  - Проверьте attack signature и severity
  - Проанализируйте паттерн сетевого трафика
  - Проверьте, был ли успешный exploit
  - При необходимости добавьте blocking rule
description_en: |
  This rule monitors network attacks detected by Fortigate IPS.
  The 'detected' action means the attack was identified but not stopped.
  Legitimate cases: false positive, test traffic, vulnerability scanning.
  SOC triage steps:
  - Determine the attack type and the attack ID
  - Analyze the source and destination IP addresses
  - Check the attack signature and severity
  - Analyze the network traffic pattern
  - Check whether the exploit was successful
  - Add a blocking rule if necessary
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-fortinet.fortigate-*
query_language: esql
query: |
  FROM logs-fortinet.fortigate-*
  | WHERE @timestamp >= NOW() - 15 minutes
    AND (fortinet.fortigate.subtype == "ips" OR fortinet.fortigate.subtype == "anomaly" OR fortinet.fortigate.subtype == "webfilter")
    AND event.action=="blocked"
  | EVAL action = event.action,
         reason = fortinet.fortigate.msg,
         dev_name = observer.name
  | STATS
      event_count = COUNT(*),
      actions = VALUES(action),
      reasons = VALUES(reason),
      dst_ports = VALUES(destination.port),
      hostnames = VALUES(fortinet.fortigate.hostname)
    BY source.ip, destination.ip, dev_name, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP bucket, source.ip, destination.ip, dev_name, event_count, actions, reasons, dst_ports, hostnames
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.impact
- fortigate
- ips
- network-attack
severity: critical
risk_score: 90
references:
- "https://www.fortinet.com/support"
nist: ["SI-4"]
pci_dss: ["11.4"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0040: []