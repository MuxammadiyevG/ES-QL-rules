rule_id: baca1d2b-0e2a-4ca5-9dfa-5a718d557abb
name_uz: "Default Password Detected by System"
name_ru: "Default Password Detected by System"
name_en: "Default Password Detected by System"
description_uz: |
  Ushbu qoida FortiSIEM Discovery jarayoni tomonidan qurilmada default (standart) credentials aniqlanganda ishga tushadi.
  Default parol qoldirilgan qurilmalar tarmoqda jiddiy xavfsizlik muammosi bo'lib, hujumchi osongina kirish huquqiga ega bo'lishi mumkin.
  Bu turdagi hodisa yangi o'rnatilgan qurilmalar, noto'g'ri konfiguratsiyalangan serverlar yoki parol o'zgartirish siyosatiga rioya qilmagan qurilmalarda uchrashi mumkin.
  Qonuniy holatlar sifatida yangi qurilma o'rnatish jarayoni yoki test muhitidagi qurilmalar uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `source.ip` (qurilma IP) va `observer.name` (qurilma nomi) ni aniq identifikatsiya qiling.
  - Qurilma modeli va application protocol ni aniqlang.
  - Qurilma egasi va mas'ul adminni toping.
  - Darhol default parolni o'zgartiring va kuchli parol siyosatini qo'llang.
  - Qurilmaga ruxsatsiz kirish bo'lganligini tekshiring.
  - Qurilma IP ni `Policy Violators` watch list ga qo'shing.
  - Tarmoq segmentatsiyasi va kirish cheklovlarini tekshiring.
description_ru: |
  Данное правило срабатывает, когда процесс FortiSIEM Discovery обнаруживает на устройстве default (стандартные) credentials.
  Устройства с оставленным паролем по умолчанию представляют серьёзную проблему безопасности в сети — злоумышленник может легко получить доступ.
  Событие такого типа может встречаться на недавно установленных устройствах, некорректно настроенных серверах или устройствах, где не соблюдалась политика смены паролей.
  В качестве легитимных случаев могут встречаться процесс установки нового устройства или устройства в тестовой среде.
  Этапы SOC triage:
  - Точно идентифицируйте в событии `source.ip` (IP устройства) и `observer.name` (имя устройства).
  - Определите модель устройства и application protocol.
  - Найдите владельца устройства и ответственного администратора.
  - Немедленно смените пароль по умолчанию и примените строгую парольную политику.
  - Проверьте, не было ли несанкционированного доступа к устройству.
  - Добавьте IP устройства в watch list `Policy Violators`.
  - Проверьте сегментацию сети и ограничения доступа.
description_en: |
  This rule fires when the FortiSIEM Discovery process detects default credentials on a device.
  Devices left with a default password are a serious security problem in the network, since an attacker can easily gain access.
  This type of event may occur on newly installed devices, misconfigured servers or devices that did not follow the password change policy.
  Legitimate cases may include a new device installation process or devices in a test environment.
  SOC triage steps:
  - Precisely identify `source.ip` (device IP) and `observer.name` (device name) in the event.
  - Determine the device model and application protocol.
  - Find the device owner and the responsible administrator.
  - Immediately change the default password and enforce a strong password policy.
  - Check whether there was any unauthorized access to the device.
  - Add the device IP to the `Policy Violators` watch list.
  - Review network segmentation and access restrictions.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-fortinet.fortigate-*
query_language: esql
query: |
 FROM logs-fortinet.fortigate-*
  | WHERE @timestamp >= NOW() - 600 seconds
  | WHERE event.dataset == "fortinet.fortigate"
  | WHERE message RLIKE "(?i).*(default.*password|default.*credential|default.*passwd|default.*pwd|default.*login|factory.*password|factory.*credential|factory.*default|initial.*password|known.*default|common.*credential).*"
     OR event.action RLIKE "(?i).*(default.password|default.credential|default.pwd).*"
  | WHERE source.ip IS NOT NULL
  | EVAL src_ip      = source.ip
  | EVAL dst_ip      = destination.ip
  | EVAL src_port    = source.port
  | EVAL dst_port    = destination.port
  | EVAL observer_nm = observer.name
  | EVAL proto       = network.transport
  | EVAL sig_id      = rule.id
  | EVAL src_geo     = source.geo.region_name
  | EVAL src_mac     = source.mac
  | EVAL src_user    = user.name
  | STATS
      event_count    = COUNT(*),
      src_ips        = VALUES(source.ip),
      dst_ips        = VALUES(destination.ip),
      src_ports      = VALUES(source.port),
      dst_ports      = VALUES(destination.port),
      src_geos       = VALUES(source.geo.region_name),
      src_macs       = VALUES(source.mac),
      src_users      = VALUES(user.name),
      protocols      = VALUES(network.transport),
      observers      = VALUES(observer.name),
      sig_ids        = VALUES(rule.id),
      actions        = VALUES(event.action),
      last_seen      = MAX(@timestamp),
      first_seen     = MIN(@timestamp)
    BY source.ip, destination.ip, observer.name, network.transport
  | WHERE event_count >= 1
  | EVAL
      src_ip            = source.ip,
      dst_ip            = destination.ip
  | KEEP
      src_ip,
      dst_ip,
      event_count,
      src_ips,
      dst_ips,
      src_ports,
      dst_ports,
      src_geos,
      src_macs,
      src_users,
      protocols,
      observers,
      sig_ids,
      actions,
      last_seen,
      first_seen
  | SORT event_count DESC
enabled: true
