rule_id: c830547f-6df9-42e2-be73-504082a1f6a2
name_uz: "Default password usage"
name_ru: "Default password usage"
name_en: "Default password usage"
description_uz: |
  Ushbu qoida tarmoq IPS tizimlari tomonidan manzil hostda default parol ishlatilganligini aniqlaydi.
  `Default Password Detected by System` rule dan farqli o'laroq, bu rule FortiSIEM Discovery emas, balki tarmoq IPS (FortiGate, FortiProxy, Checkpoint, Palo Alto) tomonidan aniqlangan default parol ishlatilishini kuzatadi.
  Destination IP ga asoslangan GROUP BY — ya'ni qaysi host ga default parol bilan kirilayotganligi aniqlanadi.
  Bu turdagi hodisa hujumchi tarmoqdagi qurilmalarga default credentials orqali kirish urinayotganligini ko'rsatishi mumkinligi sababli xavfli hisoblanadi.
  Qonuniy holatlar sifatida yangi qurilma konfiguratsiyasi yoki test muhiti uchrashi mumkin.
  SOC triage bosqichlari:
  - Hodisadagi `destination.ip` (nishon qurilma) ni aniq identifikatsiya qiling.
  - IPS signature ID va event type ni tekshiring.
  - Nishon qurilmaning modeli va default credentials ni tekshiring.
  - Darhol default parolni o'zgartiring va kuchli parol siyosatini qo'llang.
  - Destination IP ni `Policy Violators` watch list ga qo'shing.
  - Tarmoq segmentatsiyasi va kirish cheklovlarini kuchaytiring.
description_ru: |
  Данное правило выявляет использование пароля по умолчанию на хосте назначения, обнаруженное сетевыми системами IPS.
  В отличие от правила `Default Password Detected by System`, это rule отслеживает использование пароля по умолчанию, обнаруженное не FortiSIEM Discovery, а сетевым IPS (FortiGate, FortiProxy, Checkpoint, Palo Alto).
  GROUP BY построен по destination IP — то есть определяется, на какой хост выполняется вход с паролем по умолчанию.
  Событие такого типа считается опасным, поскольку может указывать на попытку злоумышленника войти на устройства сети с помощью default credentials.
  В качестве легитимных случаев могут встречаться конфигурация нового устройства или тестовая среда.
  Этапы SOC triage:
  - Точно идентифицируйте в событии `destination.ip` (целевое устройство).
  - Проверьте IPS signature ID и event type.
  - Проверьте модель целевого устройства и его default credentials.
  - Немедленно смените пароль по умолчанию и примените строгую парольную политику.
  - Добавьте destination IP в watch list `Policy Violators`.
  - Усильте сегментацию сети и ограничения доступа.
description_en: |
  This rule detects the use of a default password on a destination host as reported by network IPS systems.
  Unlike the `Default Password Detected by System` rule, this rule tracks default password usage detected not by FortiSIEM Discovery but by a network IPS (FortiGate, FortiProxy, Checkpoint, Palo Alto).
  The GROUP BY is based on the destination IP — that is, it identifies which host is being logged into with a default password.
  This type of event is considered dangerous because it may indicate that an attacker is trying to access network devices using default credentials.
  Legitimate cases may include new device configuration or a test environment.
  SOC triage steps:
  - Precisely identify `destination.ip` (the target device) in the event.
  - Check the IPS signature ID and event type.
  - Check the target device model and its default credentials.
  - Immediately change the default password and enforce a strong password policy.
  - Add the destination IP to the `Policy Violators` watch list.
  - Tighten network segmentation and access restrictions.
type: esql
params: '{}'
schedule_interval: 5m
index:
  - logs-fortinet.fortigate-*
query_language: esql
query: |
  FROM logs-fortinet.fortigate-*
  | WHERE @timestamp >= NOW() - 300 seconds
  | WHERE event.dataset == "fortinet.fortigate"
  | WHERE observer.type IN ("firewall", "proxy", "ids", "ips")
  | WHERE message RLIKE "(?i).*(default.*password|default.*credential|default.*passwd|default.*pwd|default.*login|factory.*password|factory.*credential|factory.*default|known.*default|common.*credential).*"
     OR event.action RLIKE "(?i).*(default.password|default.credential|default.pwd).*"
  | WHERE destination.ip IS NOT NULL
  | EVAL src_ip      = source.ip
  | EVAL dst_ip      = destination.ip
  | EVAL src_port    = source.port
  | EVAL dst_port    = destination.port
  | EVAL proto       = network.transport
  | EVAL sig_id      = rule.id
  | EVAL sig_uuid    = rule.uuid
  | EVAL dst_geo     = destination.geo.location
  | EVAL observer_nm = observer.name
  | EVAL src_geo     = source.geo.region_name
  | STATS
      event_count   = COUNT(*),
      src_ips       = VALUES(source.ip),
      dst_ips       = VALUES(destination.ip),
      src_ports     = VALUES(source.port),
      dst_ports     = VALUES(destination.port),
      src_geos      = VALUES(source.geo.region_name),
      protocols     = VALUES(network.transport),
      sig_ids       = VALUES(rule.id),
      sig_uuids     = VALUES(rule.uuid),
      actions       = VALUES(event.action),
      observers     = VALUES(observer.name),
      last_seen     = MAX(@timestamp),
      first_seen    = MIN(@timestamp)
    BY destination.ip, rule.id, event.action
  | WHERE event_count >= 1
  | EVAL
      dst_ip            = destination.ip,
      sig_id            = rule.id
  | KEEP
      dst_ip,
      sig_id,
      event_count,
      src_ips,
      dst_ips,
      src_ports,
      dst_ports,
      src_geos,
      protocols,
      sig_ids,
      sig_uuids,
      actions,
      observers,
      last_seen,
      first_seen
  | SORT event_count DESC
enabled: true
tags:
  - attack.initial-access
  - attack.credential-access
  - attack.t1078.001
  - attack.t1110.001
  - detection.threat-hunting
  - policy.violation
severity: medium
risk_score: 65
references:
  - "https://attack.mitre.org/techniques/T1078/001/"
  - "https://attack.mitre.org/techniques/T1110/001/"
  - "https://docs.fortinet.com/product/fortigate"
nist: ["IA-5", "AC-2", "CM-6", "SI-4"]
