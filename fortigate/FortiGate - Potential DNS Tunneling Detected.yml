rule_id: 2c98b1bc-9244-48c0-b105-14a14f114899
name_uz: "FortiGate - Potensial DNS tunneling aniqlandi"
name_ru: "FortiGate - Обнаружен потенциальный DNS tunneling"
name_en: "FortiGate - Potential DNS Tunneling Detected"
description_uz: |
  Bitta ichki IPdan haddan tashqari ko'p (1000 dan ortiq) DNS so'rovlari yuborilishini aniqlaydi.
  Hujumchilar ma'lumotlarni tashqaridagi C2 serveriga DNS protokoli orqali yashirincha yuborishda ushbu usuldan foydalanadilar.
description_ru: |
  Выявляет отправку чрезмерно большого числа DNS-запросов (более 1000) с одного внутреннего IP.
  Атакующие используют этот метод для скрытной передачи данных на внешний C2-сервер по протоколу DNS.
description_en: |
  Detects an excessive number of DNS queries (more than 1000) being sent from a single internal IP.
  Attackers use this technique to covertly send data to an external C2 server over the DNS protocol.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-fortinet.fortigate-*
query_language: esql
query: |
  FROM logs-fortinet.fortigate-*
  | WHERE @timestamp >= NOW() - 10 minutes
    AND destination.port == 53
  | STATS 
      dns_queries = COUNT(*),
      unique_dns_servers = COUNT_DISTINCT(destination.ip),
      last_query_time = MAX(@timestamp)
    BY source.ip
  | WHERE dns_queries > 1000
  | SORT dns_queries DESC
  | LIMIT 100
enabled: true
tags:
  - attack.command-and-control
  - attack.exfiltration
  - t1071.004
severity: high
risk_score: 75
references:
  - "https://docs.fortinet.com/document/fortigate/7.4.0/fortios-log-message-reference"
nist: ["SC-7", "SI-4"]
gdpr: ["32.1.b"]
pci_dss: ["10.6.1"]
mitre_attack:
  TA0011:
    T1071: ["T1071.004"]