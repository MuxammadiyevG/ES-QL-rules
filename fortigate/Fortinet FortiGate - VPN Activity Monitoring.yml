rule_id: 92ae011b-1cc2-4996-9e68-414346a70a0e
name_uz: "Fortinet FortiGate - VPN faoliyatini monitoring qilish"
name_ru: "Fortinet FortiGate - Мониторинг VPN-активности"
name_en: "Fortinet FortiGate - VPN Activity Monitoring"
description_uz: |
  Ushbu qoida FortiGate VPN hodisalarini kuzatadi.
  Noodatiy VPN ulanishlari, muvaffaqiyatsiz autentifikatsiya yoki
  ruxsatsiz kirish urinishlari credential access va initial access
  texnikalariga ishora qilishi mumkin (T1078, T1133).
  Qonuniy holatlar: remote workers, site-to-site VPN, IT administratorlar.
  SOC triage bosqichlari:
  - `actor` (user.name) va `src_ip` (remip) ni tekshiring.
  - GeoIP ma'lumotlarini tekshiring — noodatiy mamlakat/shahardan kirish bormi.
  - VPN ulanish vaqtini tekshiring — ish soatlaridan tashqarimi.
  - Muvaffaqiyatsiz urinishlar soni ortib borayotgan bo'lsa brute-force ehtimolini ko'rib chiqing.
  - Noqonuniy faoliyat tasdiqlansa: VPN akkauntini bloklang, credentiallarni yangilang.
description_ru: |
  Данное правило отслеживает события FortiGate VPN.
  Необычные VPN-подключения, неудачная аутентификация или
  попытки несанкционированного доступа могут указывать на техники
  credential access и initial access (T1078, T1133).
  Легитимные случаи: удалённые сотрудники, site-to-site VPN, IT-администраторы.
  Этапы SOC-триажа:
  - Проверьте `actor` (user.name) и `src_ip` (remip).
  - Проверьте данные GeoIP — нет ли входа из необычной страны/города.
  - Проверьте время VPN-подключения — не вне ли рабочих часов.
  - Если число неудачных попыток растёт, рассмотрите вероятность brute-force.
  - При подтверждении нелегитимной активности: заблокируйте VPN-аккаунт, обновите учётные данные.
description_en: |
  This rule monitors FortiGate VPN events.
  Unusual VPN connections, failed authentication or
  unauthorized access attempts may point to credential access and initial access
  techniques (T1078, T1133).
  Legitimate cases: remote workers, site-to-site VPN, IT administrators.
  SOC triage steps:
  - Check `actor` (user.name) and `src_ip` (remip).
  - Check the GeoIP data — is there a login from an unusual country/city.
  - Check the VPN connection time — is it outside business hours.
  - If the number of failed attempts is growing, consider the possibility of brute-force.
  - If illegitimate activity is confirmed: block the VPN account, rotate the credentials.
type: esql
params: '{}'
schedule_interval: 10m
index:
  - logs-fortinet.fortigate-*
query_language: esql
query: |
  FROM logs-fortinet.fortigate-*
  | WHERE @timestamp >= NOW() - 300 minutes
  | WHERE fortinet.fortigate.subtype == "vpn"
  /* Statistikani filtrlab, faqat muhim voqealarni qoldirishingiz ham mumkin */
  /* | WHERE fortinet.fortigate.logdesc != "IPsec tunnel statistics" */
  | EVAL foydalanuvchi = user.name
  | EVAL ulanish_ip = fortinet.fortigate.remip
  | EVAL xabar = fortinet.fortigate.logdesc
  | KEEP @timestamp,foydalanuvchi, ulanish_ip, xabar
  | SORT @timestamp DESC
  | LIMIT 200
enabled: true
tags:
  - attack.initial_access
  - attack.credential_access
  - attack.t1078
  - attack.t1133
  - detection.fortinet
  - detection.vpn
severity: medium
risk_score: 50
nist: ["AU-2", "AU-12", "AC-17", "IA-2", "SC-7"]
pci_dss: ["10.2.4", "10.2.5", "8.1.6", "1.3.2"]
gdpr: ["32.1.a", "32.2"]
references:
  - "https://attack.mitre.org/techniques/T1078/"
  - "https://attack.mitre.org/techniques/T1133/"
  - "https://docs.fortinet.com/document/fortigate/7.4.0/log-message-reference/log-types"
mitre_attack:
  TA0001:
    T1133: []  # External Remote Services - VPN