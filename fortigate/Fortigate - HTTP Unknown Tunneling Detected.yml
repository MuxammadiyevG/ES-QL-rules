rule_id: 4672439c-6ea8-476b-afe3-565b9b2a620b
name_uz: "Fortigate - HTTP orqali noma'lum tunneling aniqlandi"
name_ru: "Fortigate - Обнаружен неизвестный HTTP tunneling"
name_en: "Fortigate - HTTP Unknown Tunneling Detected"
description_uz: |
  Ushbu qoida HTTP protokoli orqali suspicious tunneling faoliyatini aniqlaydi.
  Bu data exfiltration yoki C2 communication belgisi bo'lishi mumkin (T1071).
  Qonuniy holatlar: VPN client, proxy, legitimate tunnel apps.
  SOC triage bosqichlari:
  - Manba va destination IP'larni tekshiring
  - Tunneling pattern va frequency'ni tahlil qiling
  - Associated process va application'ni aniqlang
  - Data transfer hajmini tekshiring
  - Threat intelligence bilan correlate qiling
description_ru: |
  Данное правило выявляет подозрительную активность туннелирования по протоколу HTTP.
  Это может быть признаком data exfiltration или C2 communication (T1071).
  Легитимные случаи: VPN client, proxy, легитимные приложения-туннели.
  Этапы SOC-триажа:
  - Проверьте IP-адреса источника и назначения
  - Проанализируйте паттерн и частоту туннелирования
  - Определите связанный процесс и приложение
  - Проверьте объём передачи данных
  - Сопоставьте с threat intelligence
description_en: |
  This rule detects suspicious tunneling activity over the HTTP protocol.
  This may be a sign of data exfiltration or C2 communication (T1071).
  Legitimate cases: VPN client, proxy, legitimate tunnel apps.
  SOC triage steps:
  - Check the source and destination IPs
  - Analyze the tunneling pattern and frequency
  - Identify the associated process and application
  - Check the data transfer volume
  - Correlate with threat intelligence
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-fortinet.fortigate-*
query_language: esql
query: |
  FROM logs-fortinet.fortigate-*
  | WHERE @timestamp >= NOW() - 45 minutes
  | WHERE TO_LOWER(message) LIKE "%http.unknown.tunnelling%"
  | STATS
      event_count = COUNT(*),
      dst_ips = VALUES(destination.ip),
      sample_messages = VALUES(message)
    BY source.ip, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE event_count >= 18
  | KEEP bucket, source.ip, event_count, dst_ips, sample_messages
  | SORT event_count DESC
  | LIMIT 100

enabled: true
tags:
- attack.command-and-control
- attack.t1071
- fortigate
- tunneling
- data-exfiltration
severity: high
risk_score: 75
references:
- "https://attack.mitre.org/techniques/T1071/"
nist: ["SC-7", "SI-4"]
pci_dss: ["10.6.1"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0011:
    T1071: []