rule_id: f4fdf515-3f13-49e7-a886-1d35f6ab3901
name_uz: "FortiGate - Xavfsizlik profili o'chirildi (AV/IPS/WebFilter)"
name_ru: "FortiGate - Отключён профиль безопасности (AV/IPS/WebFilter)"
name_en: "FortiGate - Security Profile Disabled (AV/IPS/WebFilter)"
description_uz: |
  Ushbu qoida FortiGate qurilmalarida antivirus, IPS, web filter yoki application control
  xavfsizlik profillarini o'chirib qo'yuvchi konfiguratsiya o'zgarishlarini aniqlaydi.
  Hujumchilar himoya mexanizmlarini chetlab o'tish (Defense Evasion) maqsadida bu profillarni
  o'chirishi mumkin (T1562.001).
  Qonuniy holatlar: rejaviy maintenance, troubleshooting jarayonida vaqtincha o'chirish.

  SOC triage bosqichlari:
  - O'zgarishni amalga oshirgan admin (`user.name`) va manba IP (`source.ip`)ni aniqlang.
  - Qaysi profil (`cfgpath`) o'chirilganini `message` maydonidan tekshiring.
  - O'zgarish tasdiqlangan Change Management bileti bilan mos kelishini tekshiring.
  - Noqonuniy bo'lsa, profilni qayta yoqing (rollback) va admin akkauntini tekshiring.
description_ru: |
  Данное правило выявляет изменения конфигурации, отключающие профили безопасности antivirus, IPS, web filter
  или application control на устройствах FortiGate.
  Атакующие могут отключать эти профили с целью обхода механизмов защиты (Defense Evasion)
  (T1562.001).
  Легитимные случаи: плановое обслуживание, временное отключение в ходе troubleshooting.

  Этапы SOC-триажа:
  - Определите администратора (`user.name`), внёсшего изменение, и IP источника (`source.ip`).
  - Проверьте в поле `message`, какой профиль (`cfgpath`) был отключён.
  - Проверьте, соответствует ли изменение утверждённому тикету Change Management.
  - Если действие нелегитимно, включите профиль обратно (rollback) и проверьте учётную запись администратора.
description_en: |
  This rule detects configuration changes that disable antivirus, IPS, web filter or application control
  security profiles on FortiGate devices.
  Attackers may disable these profiles in order to bypass protection mechanisms (Defense Evasion)
  (T1562.001).
  Legitimate cases: scheduled maintenance, temporary disabling during troubleshooting.

  SOC triage steps:
  - Identify the administrator (`user.name`) who made the change and the source IP (`source.ip`).
  - Check the `message` field for which profile (`cfgpath`) was disabled.
  - Check whether the change matches an approved Change Management ticket.
  - If illegitimate, re-enable the profile (rollback) and review the administrator account.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-fortinet.fortigate-*
query_language: esql
query: |
  FROM logs-fortinet.fortigate-*
  | WHERE @timestamp >= NOW() - 20 minutes
  /* FortiGate event/system logs surface only as raw `message` in this deployment; heuristic match. Requires FortiGate event-log onboarding to fire. */
  | WHERE (
      message LIKE "*antivirus.profile*"
      OR message LIKE "*ips.sensor*"
      OR message LIKE "*webfilter.profile*"
      OR message LIKE "*application.list*"
    )
    AND TO_LOWER(message) RLIKE ".*(set status disable|status=\"disable\"|disable).*"
  | EVAL Device = COALESCE(observer.name, "FortiGate")
  | STATS
      change_count = COUNT(*),
      users = VALUES(user.name),
      src_ips = VALUES(source.ip),
      messages = VALUES(message),
      last_seen = MAX(@timestamp)
    BY Device, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | KEEP bucket, Device, change_count, users, src_ips, messages, last_seen
  | SORT change_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.defense-evasion
  - attack.t1562.001
  - fortigate.audit
  - configuration.management
  - security-profile
severity: high
risk_score: 80
references:
  - "https://attack.mitre.org/techniques/T1562/001/"
  - "https://docs.fortinet.com/document/fortigate/7.4.0/fortios-log-message-reference"
nist: ["CM-3", "SI-3", "SI-4", "AU-12"]
pci_dss: ["5.1", "5.2", "10.2.2"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0005:
    T1562: ["T1562.001"]
