rule_id: ef97ccb5-d4f4-442f-97ca-aa952f5a4c89
name_uz: "FortiGate - Ulanish mijoz tomonidan uzildi"
name_ru: "FortiGate - Сброс соединения клиентом"
name_en: "FortiGate - Connection Reset by Client"
description_uz: |
  Ushbu qoida tarmoq ulanishining mijoz tomonidan kutilmaganda to'xtatilganini (`client-rst`) aniqlaydi. 
  Agar bitta manba IPdan juda ko'p 'client-rst' xabarlari kelsa, bu tarmoq skanerlash yoki port scanning harakatlaridan darak berishi mumkin.

  SOC triage bosqichlari:
  - 'source.ip' (10.10.40.34) va 'destination.ip' (3.7.245.115) o'rtasidagi trafik hajmini tekshiring.
  - 'fortinet.fortigate.app' (SSL_TLSv1.2) va 'service.name' (HTTPS) legitimligini tasdiqlang.
  - Agar ushbu holat qisqa vaqt ichida juda ko'p takrorlansa, manba qurilmada zararli dastur (malware) borligini tekshiring.
description_ru: |
  Данное правило выявляет неожиданное прекращение сетевого соединения со стороны клиента (`client-rst`). 
  Если с одного IP источника приходит очень много сообщений 'client-rst', это может указывать на сканирование сети или port scanning.

  Этапы SOC-триажа:
  - Проверьте объём трафика между 'source.ip' (10.10.40.34) и 'destination.ip' (3.7.245.115).
  - Подтвердите легитимность 'fortinet.fortigate.app' (SSL_TLSv1.2) и 'service.name' (HTTPS).
  - Если эта ситуация повторяется очень часто за короткое время, проверьте устройство-источник на наличие вредоносного ПО (malware).
description_en: |
  This rule detects an unexpected termination of a network connection by the client (`client-rst`). 
  If a very large number of 'client-rst' messages come from a single source IP, this may indicate network scanning or port scanning activity.

  SOC triage steps:
  - Check the traffic volume between 'source.ip' (10.10.40.34) and 'destination.ip' (3.7.245.115).
  - Confirm the legitimacy of 'fortinet.fortigate.app' (SSL_TLSv1.2) and 'service.name' (HTTPS).
  - If this situation repeats very often within a short time, check the source device for malware.
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-fortinet.fortigate-*
query_language: esql
query: |
  FROM logs-fortinet.fortigate-*
  | WHERE @timestamp >= NOW() - 15 minutes
    AND event.action == "client-rst"
    AND fortinet.fortigate.subtype == "forward"
  | EVAL src_ip = source.ip, 
         dst_ip = destination.ip,
         app = fortinet.fortigate.app,
         policy = fortinet.fortigate.policyname
  | STATS
      reset_count = COUNT(*),
      dst_ports = VALUES(destination.port),
      apps = VALUES(app),
      policies = VALUES(policy)
    BY src_ip, dst_ip, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE reset_count >= 20
  | KEEP bucket, src_ip, dst_ip, reset_count, dst_ports, apps, policies
  | SORT reset_count DESC
  | LIMIT 100
enabled: true
tags:
  - attack.reconnaissance
  - fortigate.traffic
  - network.reset
severity: low
risk_score: 25
references:
  - "https://community.fortinet.com/t5/FortiGate/Technical-Tip-Log-messages-with-action-client-rst-or-server-rst/ta-p/190225"
nist: ["SI-4", "CA-7"]
pci_dss: ["10.6.1"]
gdpr: ["32.1.b"]
mitre_attack:
  TA0043:
    T1595: []