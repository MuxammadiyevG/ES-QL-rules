rule_id: 0e1af39f-7c4b-44ab-aea0-e35da22efbe7
name_uz: "Fortigate - SSL VPN'da ko'p marta muvaffaqiyatsiz login urinishlari"
name_ru: "Fortigate - Множественные неудачные попытки входа в SSL VPN"
name_en: "Fortigate - SSL VPN Multiple Failed Login Attempts"
description_uz: |
  Ushbu qoida Fortigate SSL VPN'da bir xil manbadan ko'p marta muvaffaqiyatsiz login urinishlarini aniqlaydi.
  SSL VPN external access nuqtasi bo'lganligi uchun bu juda xavfli hodisa (T1110, T1133).
  Qonuniy holatlar: foydalanuvchi parol xatosi, VPN client konfiguratsiya muammolari.
  SOC triage bosqichlari:
  - Manba IP manzilini threat intelligence bilan tekshiring
  - User name legitimligini tasdiqlang
  - VPN urinishlarining time pattern'ini tahlil qiling
  - Muvaffaqiyatli VPN ulanish bo'lganmi tekshiring
  - Zarur bo'lsa IP blocking amalga oshiring
description_ru: |
  Данное правило выявляет многократные неудачные попытки входа в Fortigate SSL VPN из одного и того же источника.
  Поскольку SSL VPN является точкой внешнего доступа, это очень опасное событие (T1110, T1133).
  Легитимные случаи: ошибка пароля пользователя, проблемы конфигурации VPN client.
  Этапы SOC-триажа:
  - Проверьте IP-адрес источника по threat intelligence
  - Подтвердите легитимность user name
  - Проанализируйте time pattern VPN-попыток
  - Проверьте, было ли успешное VPN-подключение
  - При необходимости выполните блокировку IP
description_en: |
  This rule detects repeated failed login attempts to the Fortigate SSL VPN from the same source.
  Because SSL VPN is an external access point, this is a highly dangerous event (T1110, T1133).
  Legitimate cases: user password error, VPN client configuration issues.
  SOC triage steps:
  - Check the source IP address against threat intelligence
  - Confirm the legitimacy of the user name
  - Analyze the time pattern of the VPN attempts
  - Check whether a successful VPN connection occurred
  - Perform IP blocking if necessary
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-fortinet.fortigate-*
query_language: esql
query: |
  FROM logs-fortinet.fortigate-*
  | WHERE @timestamp >= NOW() - 45 minutes
  | WHERE fortinet.fortigate.subtype == "vpn" 
    AND event.action == "ssl-login-fail"
  | EVAL src_ip = source.ip
  | STATS
      event_count = COUNT(*),
      unique_users_count = COUNT_DISTINCT(user.name),
      users = VALUES(user.name),
      reasons = VALUES(fortinet.fortigate.reason),
      dst_hosts = VALUES(fortinet.fortigate.dst_host)
    BY src_ip, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE event_count >= 15
  | KEEP bucket, src_ip, event_count, unique_users_count, users, reasons, dst_hosts
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.credential-access
- attack.initial-access
- attack.t1110
- attack.t1133
- fortigate
- vpn
severity: high
risk_score: 80
references:
- "https://attack.mitre.org/techniques/T1110/"
- "https://attack.mitre.org/techniques/T1133/"
nist: ["AC-7", "AC-17"]
pci_dss: ["10.2.4", "10.2.5", "8.2.6"]
gdpr: ["32.2", "35.7.d"]
mitre_attack:
  TA0001:
    T1133: []
  TA0006:
    T1110: []