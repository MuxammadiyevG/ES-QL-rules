rule_id: 974369e1-d915-4013-b3d2-cc2067298a35
name_uz: "FortiGate konfiguratsiya o'zgarishi aniqlandi"
name_ru: "FortiGate - Обнаружено изменение конфигурации"
name_en: "FortiGate Configuration Change Detected"
description_uz: |
  Ushbu qoida FortiGate qurilmalarida konfiguratsiya o'zgarishlarini (`Config-Changed`) aniqlaydi. 
  Tizim parametrlarining o'zgarishi persistence (doimiy kirishni saqlash) yoki defense evasion (himoyani chetlab o'tish) harakatlaridan darak berishi mumkin.
  Qonuniy holatlar: IT administratorlari tomonidan amalga oshirilgan rejaviy o'zgarishlar, backup jarayonlari yoki yangi qoidalar qo'shilishi.

  SOC triage bosqichlari:
  - O'zgarishni amalga oshirgan `actor` (user) va manba qurilmani (`Dev`) aniqlang.
  - O'zgarish vaqti tasdiqlangan "Change Management" bileti yoki rejaviy ishlar vaqtiga mos kelishini tekshiring.
  - Log xabaridagi `message` qismini tahlil qilib, aynan qaysi parametr o'zgarganini ko'ring.
  - Noqonuniy o'zgarish aniqlansa, konfiguratsiyani avvalgi holatiga qaytaring (Rollback) va administrator akkauntini tekshiring.
description_ru: |
  Данное правило выявляет изменения конфигурации (`Config-Changed`) на устройствах FortiGate. 
  Изменение системных параметров может свидетельствовать о действиях закрепления (persistence — сохранение постоянного доступа) или обхода защиты (defense evasion).
  Легитимные случаи: плановые изменения, выполненные IT-администраторами, процессы резервного копирования или добавление новых правил.

  Этапы SOC-триажа:
  - Определите `actor` (user), внёсшего изменение, и устройство-источник (`Dev`).
  - Проверьте, соответствует ли время изменения утверждённому тикету "Change Management" или окну плановых работ.
  - Проанализируйте часть `message` в сообщении лога и посмотрите, какой именно параметр был изменён.
  - При выявлении нелегитимного изменения верните конфигурацию в прежнее состояние (Rollback) и проверьте учётную запись администратора.
description_en: |
  This rule detects configuration changes (`Config-Changed`) on FortiGate devices. 
  A change of system parameters may indicate persistence (maintaining permanent access) or defense evasion activity.
  Legitimate cases: scheduled changes made by IT administrators, backup processes or the addition of new rules.

  SOC triage steps:
  - Identify the `actor` (user) who made the change and the source device (`Dev`).
  - Check whether the time of the change matches an approved "Change Management" ticket or a scheduled maintenance window.
  - Analyze the `message` part of the log record and see exactly which parameter was changed.
  - If an illegitimate change is found, revert the configuration to its previous state (Rollback) and review the administrator account.
type: esql
params: '{}'
schedule_interval: 5m
index:
- logs-fortinet.fortigate-*
query_language: esql
query: |
  FROM logs-fortinet.fortigate-*
  | WHERE @timestamp >= NOW() - 5 minutes
    AND fortinet.fortigate.type == "event"
    AND fortinet.fortigate.subtype == "system"
    AND message LIKE "*state=\"Config-Changed\"*"
  | EVAL Dev = COALESCE(observer.name, observer.name.text, "FortiGate")
  | KEEP @timestamp, Dev, message
  | SORT @timestamp DESC
  | LIMIT 100
enabled: true
tags:
  - attack.persistence
  - attack.defense-evasion
  - attack.t1562.004
  - fortinet.fortigate.config
severity: high
risk_score: 75
references:
  - "https://community.fortinet.com/t5/FortiGate/Technical-Tip-How-to-monitor-configuration-changes-on-FortiGate/ta-p/195383"
nist: ["CM-3", "AU-12"]
pci_dss: ["10.2.2"]
gdpr: ["32.1.b"]
mitre_attack: []