rule_id: 0cd409c0-6feb-497b-b7b4-5aa27c130ff6
name_uz: "Fortigate - Bir manbadan ko'plab konfiguratsiya o'zgarishlari"
name_ru: "Fortigate - Множественные изменения конфигурации из одного источника"
name_en: "Fortigate - Multiple Configuration Changes from Same Source"
description_uz: |
  Ushbu qoida Fortigate firewall'da bir xil manbadan qisqa vaqt ichida ko'p konfiguratsiya o'zgarishlarini aniqlaydi.
  Bu defense evasion (T1562.001) belgisi bo'lishi mumkin.
  Qonuniy holatlar: rejalashtirilgan maintenance, bulk configuration deployment.
  SOC triage bosqichlari:
  - O'zgarishlarni amalga oshirgan admin user'ni identifikatsiya qiling
  - Change ticket borligini tekshiring
  - Qanday konfiguratsiyalar o'zgartirilganini aniqlang
  - O'zgarishlar vaqti va tezligini tahlil qiling
  - Kritik security policy o'zgarishlari bo'lganmi tekshiring
description_ru: |
  Данное правило выявляет множественные изменения конфигурации на Fortigate firewall из одного и того же источника за короткое время.
  Это может быть признаком defense evasion (T1562.001).
  Легитимные случаи: плановое обслуживание, массовое развёртывание конфигурации.
  Этапы SOC-триажа:
  - Идентифицируйте admin user, выполнившего изменения
  - Проверьте наличие change ticket
  - Определите, какие конфигурации были изменены
  - Проанализируйте время и скорость изменений
  - Проверьте, были ли изменения критичных security policy
description_en: |
  This rule detects multiple configuration changes on a Fortigate firewall from the same source within a short time.
  This may be a sign of defense evasion (T1562.001).
  Legitimate cases: planned maintenance, bulk configuration deployment.
  SOC triage steps:
  - Identify the admin user who made the changes
  - Check whether a change ticket exists
  - Determine which configurations were changed
  - Analyze the timing and rate of the changes
  - Check whether critical security policy changes occurred
type: esql
params: '{}'
schedule_interval: 10m
index:
- logs-fortinet.fortigate-*
query_language: esql
query: |
  FROM logs-fortinet.fortigate-*
  | WHERE @timestamp >= NOW() - 45 minutes
  | WHERE TO_LOWER(message) RLIKE ".*configuration is changed in the admin session.*"
  | WHERE fortinet.fortigate.subtype == "system"
  | WHERE log.level == "alert"
  | STATS
      event_count = COUNT(*),
      users = VALUES(user.name),
      interfaces = VALUES(observer.ingress.interface.name),
      vdoms = VALUES(fortinet.fortigate.vd)
    BY source.ip, bucket = DATE_TRUNC(5 minutes, @timestamp)
  | WHERE event_count >= 18
  | KEEP bucket, source.ip, event_count, users, interfaces, vdoms
  | SORT event_count DESC
  | LIMIT 100
enabled: true
tags:
- attack.defense-evasion
- attack.t1562.001
- fortigate
- configuration-change
severity: medium
risk_score: 65
references:
- "https://attack.mitre.org/techniques/T1562/001/"
nist: ["CM-3", "CM-5", "AU-6"]
pci_dss: ["10.2.7"]
gdpr: ["35.7.d"]
mitre_attack:
  TA0005:
    T1562: ["T1562.001"]